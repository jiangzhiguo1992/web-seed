name: webseed

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: webseed
      POSTGRES_PASSWORD: webseed
      POSTGRES_DB: webseed
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webseed"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
