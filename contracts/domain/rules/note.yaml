# contract: domain.rule.note
# summary: 笔记业务规则集。每条规则必须有 given/when/then，否则不算规则。
# enforcement: tested
# consumers: [api]
# refs: [domain.entity.note, domain.state.note, platform.errors]
# generates:
#   - apps/api/internal/modules/notes/rules_test.go（测试骨架）
# do_not:
#   - 不要写没有断言的规则
#   - 不要在 handler 或 service 里复制规则逻辑
#   - 一条文件规则数不超过 10 条，超过请拆分

schema_version: 1
id: domain.rule.note
summary: 笔记业务规则集
stability: stable
scope: note

rules:
  - id: domain.rule.note.title_required
    summary: 标题去除首尾空白后不能为空
    severity: error
    on_violation: platform.error.NOTE_TITLE_REQUIRED
    given: "title = '   '"
    when: "create 或 update"
    then: "拒绝，返回 NOTE_TITLE_REQUIRED"

  - id: domain.rule.note.version_required
    summary: 更新必须携带当前版本号
    severity: error
    on_violation: platform.error.NOTE_VERSION_CONFLICT
    given: "note.version = 3"
    when: "update 携带 version = 2"
    then: "拒绝，返回 NOTE_VERSION_CONFLICT，不修改任何字段"

  - id: domain.rule.note.owner_only
    summary: 仅作者可写；他人只读
    severity: error
    on_violation: platform.error.NOTE_FORBIDDEN
    given: "note.user_id = A"
    when: "用户 B 尝试 update / delete / archive"
    then: "拒绝，返回 NOTE_FORBIDDEN"

  - id: domain.rule.note.deleted_invisible
    summary: 已软删的笔记对普通查询不可见
    severity: error
    on_violation: platform.error.NOTE_NOT_FOUND
    given: "note.deleted_at != nil"
    when: "get / list"
    then: "视为不存在，返回 NOTE_NOT_FOUND"

  - id: domain.rule.note.publish_requires_title
    summary: 发布前标题必须非空
    severity: error
    on_violation: platform.error.NOTE_TITLE_REQUIRED
    given: "note.title = ''"
    when: "publish"
    then: "拒绝，返回 NOTE_TITLE_REQUIRED"

limits:
  max_body_length: 10000
  max_title_length: 200
