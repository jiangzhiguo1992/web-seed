# contract: domain.state.note
# summary: 笔记状态机。所有合法转换必须穷举，未列出即为非法。
# enforcement: generated+tested
# consumers: [api, web/admin]
# refs: [data.enum.note_status, domain.entity.note, platform.errors]
# generates:
#   - apps/api/internal/generated/domain/note_state.go
#   - apps/api/internal/generated/domain/note_state_test.go
#   - packages/api-client/src/generated/domain/note_state.ts
# do_not:
#   - 不要新增状态而不更新本文件
#   - 不要在 handler 里手写状态判断，必须用 Transition()
#   - 不要把 archived 与 deleted 混用

schema_version: 1
id: domain.state.note
summary: 笔记状态机
stability: stable
machine: note
subject: domain.entity.note

states:
  - { name: draft, description: 草稿，仅作者可见, terminal: false }
  - { name: active, description: 已发布, terminal: false }
  - { name: archived, description: 已归档，可恢复, terminal: false }
  - { name: deleted, description: 已软删, terminal: true }

initial: draft

events:
  - name: publish
    description: 发布笔记
    from: [draft]
    to: active
    guard: "trim(title) != ''"
    on_violation: platform.error.NOTE_TITLE_REQUIRED
    side_effects: [domain.event.note_published]

  - name: archive
    description: 归档
    from: [active]
    to: archived
    guard: "true"
    side_effects: [domain.event.note_archived]

  - name: restore
    description: 从归档恢复
    from: [archived]
    to: active
    guard: "trim(title) != ''"
    on_violation: platform.error.NOTE_TITLE_REQUIRED

  - name: delete
    description: 软删
    from: [draft, active, archived]
    to: deleted
    guard: "true"
    side_effects: [domain.event.note_deleted]

# 显式声明的非法转换，生成测试时必须覆盖
forbidden_examples:
  - { from: draft, event: archive, reason: 草稿不可直接归档 }
  - { from: deleted, event: publish, reason: 已删除不可发布 }
  - { from: archived, event: publish, reason: 归档需先恢复 }

# 同一状态的重复转换是否幂等
idempotent_events: []
