# contract: index
# summary: 契约地图；先读摘要，再按 playbook 读正文。
# do_not: 不写正文/业务规则；新增契约必须登记。

schema_version: 1

# 读取顺序：index -> playbook 指定的契约 -> 开工
read_order:
  - docs/index.md
  - docs/playbooks/<task>.md
  - contracts/index.yaml
  - <playbook.must_read 指定的 2-5 个契约文件>

groups:
  data:
    description: "tables 物理结构，entities 读模型，queries 装载桥，storage 表级约束。"
    layers: [tables, entities, queries, storage, policy]
  capabilities:
    description: "HTTP / 异步 / 跨模块 service。"
    layers: [http, async, services, flows]
  business:
    description: "状态机、规则、领域事件。"
    layers: [states, rules, events, glossary]
  features:
    description: "路由、页面、跨页旅程。"
    layers: [routes, pages, flows]
  platform:
    description: "平台约定：环境、错误、架构、观测、安全等。"
    layers: [environments, versioning, errors, http_conventions, quality, config, architecture, design, observability, analytics, security]

# enforcement: generated | generated+tested | tested | review-only
# stability: stable | draft | deprecated
entries:
  # ---------- 项目 ----------
  - { id: project, path: project.yaml, summary: "项目元信息与 derive 输入", consumers: [ops, tools], enforcement: generated, stability: stable }

  # ---------- data ----------
  - { id: data.tables.base, path: data/tables/_base.yaml, summary: "表结构基类（5 个基础字段）", consumers: [tools], enforcement: generated, stability: stable }
  - { id: data.entities.base, path: data/entities/_base.yaml, summary: "实体字段基类（5 个基础字段）", consumers: [tools], enforcement: generated, stability: stable }
  - { id: data.storage, path: data/storage.yaml, summary: "数据存储约束（引擎/表级保留/分区）", consumers: [api, worker, ops], enforcement: tested, stability: draft }
  - id: data.tables.account
    path: data/tables/account.yaml
    summary: "账号主表结构"
    consumers: [api]
    enforcement: generated+tested
    stability: draft
    common_mistakes:
      - "把密码/手机号/邮箱/令牌写进账号主表"
      - "手写 migrations 而不是改本文件"
      - "忘记软删过滤（deleted_at IS NULL）"
      - "唯一索引用普通 CREATE UNIQUE INDEX，导致软删后无法重建同值"
  - { id: data.tables.token, path: data/tables/token.yaml, summary: "令牌表结构", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.tables.auth_pwd, path: data/tables/auth_pwd.yaml, summary: "密码认证表结构", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.tables.auth_phone, path: data/tables/auth_phone.yaml, summary: "手机号认证表结构", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.tables.auth_email, path: data/tables/auth_email.yaml, summary: "邮箱认证表结构", consumers: [api], enforcement: generated+tested, stability: draft }
  - id: data.tables.verification_body
    path: data/tables/verification_body.yaml
    summary: "验证体表结构（一次性验证凭证与消息快照）"
    consumers: [api]
    enforcement: generated+tested
    stability: draft
    common_mistakes:
      - "auth_id 与 auth_type 指向不同种类的认证绑定"
      - "在验证体里存 target 地址原文而不是 auth_id"
      - "把验证码原文写进 code_hash"
      - "在 account 之前创建验证体"
  - id: data.tables.verification_action
    path: data/tables/verification_action.yaml
    summary: "验证动作表结构（校验请求日志）"
    consumers: [api, worker]
    enforcement: generated+tested
    stability: draft
    common_mistakes:
      - "把 auth_id/auth_type/account_id 复制进动作表"
      - "用裸哈希存 input_hash"
      - "更新或软删历史动作"
  - { id: data.entities.account, path: data/entities/account.yaml, summary: "账号数据实体与关系", consumers: [api, web/admin], enforcement: generated+tested, stability: draft }
  - { id: data.entities.token, path: data/entities/token.yaml, summary: "令牌数据实体", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.entities.auth_pwd, path: data/entities/auth_pwd.yaml, summary: "密码认证数据实体", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.entities.auth_phone, path: data/entities/auth_phone.yaml, summary: "手机号认证数据实体", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.entities.auth_email, path: data/entities/auth_email.yaml, summary: "邮箱认证数据实体", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.entities.verification_body, path: data/entities/verification_body.yaml, summary: "验证体数据实体", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.entities.verification_action, path: data/entities/verification_action.yaml, summary: "验证动作数据实体", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.queries.account, path: data/queries/account.yaml, summary: "账号查询集", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.queries.auth, path: data/queries/auth.yaml, summary: "认证查询集（密码/手机/邮箱）", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.queries.token, path: data/queries/token.yaml, summary: "令牌查询集", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.queries.verification, path: data/queries/verification.yaml, summary: "验证查询集（验证体与验证动作）", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: data.enums, path: data/enums.yaml, summary: "跨端枚举集合", consumers: [api, web/admin, worker], enforcement: generated, stability: draft }

  # ---------- capabilities ----------
  - { id: cap.http.shared, path: capabilities/protocols/http/shared.yaml, summary: "HTTP 共享组件", consumers: [api, web/admin], enforcement: generated, stability: stable }
  - id: cap.http.account
    path: capabilities/protocols/http/account.yaml
    summary: "账号 HTTP 接口"
    consumers: [api, web/admin]
    enforcement: generated+tested
    stability: stable
    common_mistakes:
      - "在 handler 里直接读 r.URL.Query() 而不用生成参数"
      - "逐接口重复声明 4xx/5xx 响应（已由 default_error_responses 注入）"
      - 响应 schema 缺少 additionalProperties: false
      - "忘记 x-flow 锚点到 cap.flows"
  - { id: cap.http.auth, path: capabilities/protocols/http/auth.yaml, summary: "认证 HTTP 接口（登录/刷新/登出/验证码）", consumers: [api, web/admin], enforcement: generated+tested, stability: draft }
  - { id: cap.methods.account, path: capabilities/methods/account.yaml, summary: "账号跨模块原子方法", consumers: [api], enforcement: generated+tested, stability: stable }
  - { id: cap.methods.auth, path: capabilities/methods/auth.yaml, summary: "认证会话跨模块原子方法", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: cap.methods.token, path: capabilities/methods/token.yaml, summary: "令牌签发与校验原子方法", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: cap.methods.verification, path: capabilities/methods/verification.yaml, summary: "验证码发送与校验原子方法", consumers: [api], enforcement: generated+tested, stability: draft }
  - { id: cap.flows.account, path: capabilities/flows/account.yaml, summary: "账号用例集", consumers: [api, web/admin], enforcement: generated+tested, stability: stable }
  - { id: cap.flows.auth, path: capabilities/flows/auth.yaml, summary: "认证用例集", consumers: [api, web/admin], enforcement: generated+tested, stability: stable }

  # ---------- business ----------
  - id: business.states.account
    path: business/states/account.yaml
    summary: "账号状态机"
    consumers: [api, web/admin]
    enforcement: generated+tested
    stability: stable
    common_mistakes:
      - "在 handler/service 手写 status 判断"
      - "新增状态却不加转换"
      - "把 archived 与 deleted 混用"
  - { id: business.rules.account, path: business/rules/account.yaml, summary: "账号业务规则集", consumers: [api], enforcement: tested, stability: stable }
  - { id: business.rules.auth, path: business/rules/auth.yaml, summary: "认证业务规则集（验证体）", consumers: [api], enforcement: tested, stability: draft }
  - { id: business.events.account, path: business/events/account.yaml, summary: "账号领域事件", consumers: [api, worker], enforcement: generated+tested, stability: stable }
  - { id: business.glossary, path: business/glossary.md, summary: "统一术语表", consumers: [api, web/admin, ai], enforcement: review-only, stability: stable }

  # ---------- features ----------
  - { id: feature.routes, path: features/routes.yaml, summary: "路由与菜单", consumers: [web/admin], enforcement: generated, stability: stable }
  - id: feature.pages.account_list
    path: features/pages/account_list.yaml
    summary: "账号列表页"
    consumers: [web/admin]
    enforcement: generated+tested
    stability: stable
    common_mistakes:
      - "手写 /v1/account 而不是引用 capability"
      - "漏掉 forbidden 态"
      - "在页面里直接引用 data.*"
  - { id: feature.pages.account_detail, path: features/pages/account_detail.yaml, summary: "账号详情页", consumers: [web/admin], enforcement: generated+tested, stability: stable }
  - { id: feature.pages.account_create, path: features/pages/account_create.yaml, summary: "新建账号页", consumers: [web/admin], enforcement: generated+tested, stability: draft }
  - { id: feature.pages.login, path: features/pages/login.yaml, summary: "登录页", consumers: [web/admin], enforcement: generated+tested, stability: draft }
  - { id: feature.pages.not_found, path: features/pages/not_found.yaml, summary: "404 页", consumers: [web/admin], enforcement: generated, stability: stable }
  - { id: feature.flows.account_create, path: features/flows/account_create.yaml, summary: "创建账号用户旅程", consumers: [web/admin], enforcement: tested, stability: draft }

  # ---------- platform ----------
  - { id: platform.environments, path: platform/environments.yaml, summary: "环境清单与差异", consumers: [ops, api, web/admin], enforcement: tested, stability: stable }
  - { id: platform.versioning, path: platform/versioning.yaml, summary: "版本与兼容策略", consumers: [api, web/admin, ops], enforcement: tested, stability: stable }
  - { id: platform.errors, path: platform/errors.yaml, summary: "错误码与 HTTP 映射", consumers: [api, web/admin], enforcement: generated+tested, stability: stable }
  - { id: platform.http_conventions, path: platform/http_conventions.yaml, summary: "信封、分页、header、状态码", consumers: [api, web/admin], enforcement: generated, stability: stable }
  - { id: platform.quality, path: platform/quality.yaml, summary: "测试策略与门槛", consumers: [tools], enforcement: tested, stability: stable }
  - { id: platform.config.env, path: platform/config/env.json, summary: "环境变量 schema", consumers: [api, web/admin, ops], enforcement: generated+tested, stability: stable }
  - { id: platform.architecture.go_arch, path: platform/architecture/go_arch.yaml, summary: "Go 分层约束", consumers: [tools], enforcement: tested, stability: stable }
  - { id: platform.architecture.web_deps, path: platform/architecture/web_deps.json, summary: "前端依赖方向约束", consumers: [tools], enforcement: tested, stability: stable }
  - { id: platform.design.tokens, path: platform/design/tokens.json, summary: "设计令牌", consumers: [web/admin], enforcement: generated, stability: stable }
  - { id: platform.observability.log_fields, path: platform/observability/log_fields.yaml, summary: "日志字段与 PII 规则", consumers: [api, ops], enforcement: generated+tested, stability: stable }
  - { id: platform.observability.metrics, path: platform/observability/metrics.yaml, summary: "指标名与标签", consumers: [api, ops], enforcement: generated, stability: stable }
  - { id: platform.analytics.events, path: platform/analytics/events.yaml, summary: "埋点事件与属性", consumers: [web/admin, api], enforcement: generated, stability: draft }
  - { id: platform.security.permissions, path: platform/security/permissions.yaml, summary: "权限点", consumers: [api, web/admin], enforcement: generated+tested, stability: stable }
  - { id: platform.security.roles, path: platform/security/roles.yaml, summary: "角色与权限映射", consumers: [api, web/admin], enforcement: generated+tested, stability: stable }
  - { id: platform.security.auth_policy, path: platform/security/auth_policy.yaml, summary: "会话与认证策略", consumers: [api, web/admin], enforcement: tested, stability: stable }

  # ---------- generated（产物索引，非契约正文） ----------
  - { id: generated.openapi, path: generated/openapi/admin.yaml, summary: "合并 OpenAPI spec（代码生成输入）", consumers: [api, tools], enforcement: generated, stability: draft }

# 跨文件的坑：不属于任何单一契约，但 AI 最容易犯
global_notes:
  - "错误响应由 capabilities/http 的 default_error_responses 注入，不要逐接口声明"
  - "data.entities 是读模型：字段必须投影回列，多表合成只读，JOIN 条件在 query；统计结果用 query.returns"
  - "data.entities 的字段名与表列名可能不同：entity 用 source.column 指明来源；method 返回 entity，不重复列映射"
  - "领域事件由 business/events 的 emitted_by 声明，capabilities 不写 emits"
  - "capabilities 契约不引用 business.*（cap.flows 仅允许引用 business.states/rules/events 做编排）"
  - "类型规则在 _meta/<type>.yaml 的 rules，通用指导在 <group>/README.md 或 <type>/_base.yaml，实例约束在正文 do_not"
  - "table.queries / model.queries / query.used_by 由 make gen-graph 写回，不要手改；CI 用 make gen-graph-check 校验漂移"
  - "引擎分组与表级物理事实（tables.<engine>/caches/size_class/retention/partition）只在 data/storage.yaml 声明；冗余列表直接写在 columns[].redundancy"

# 白名单：允许没有入边的根契约
orphan_whitelist:
  - project
  - data.tables.base
  - data.storage
  - platform.environments
  - platform.versioning
  - platform.quality
  - platform.architecture.go_arch
  - platform.architecture.web_deps
