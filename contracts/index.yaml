# contract: index
# summary: 契约地图。AI 的唯一入口：先读本文件摘要，再按 playbook 指令读正文。
# enforcement: generated（由各契约文件头聚合生成）
# do_not:
#   - 不要把正文写进本文件，只放摘要与索引
#   - 不要在本文件里写业务规则
#   - 新增契约必须同步登记，否则 contract-graph 报孤儿错误

schema_version: 1

# 读取顺序：index -> playbook 指定的契约 -> 开工
read_order:
  - docs/index.md
  - docs/playbooks/<task>.md
  - contracts/index.yaml
  - <playbook.must_read 指定的 2-5 个契约文件>

groups:
  data:
    description: 数据契约。tables 是表结构真相源，migrations 由它生成。
    layers: [tables, enums, queries, seeds, policy]
  capabilities:
    description: 能力契约。HTTP / 异步 / 跨模块 service。
    layers: [http, async, internal]
  domain:
    description: 领域契约。实体、状态机、规则、流程、术语。
    layers: [entities, states, rules, flows, glossary]
  features:
    description: 功能契约。路由、页面、跨页旅程。
    layers: [routes, pages, flows]
  platform:
    description: 平台契约。环境、错误、配置、架构、设计、观测、埋点、安全。
    layers: [environments, versioning, errors, http-conventions, quality, config, architecture, design, observability, analytics, security]

# enforcement: generated | generated+tested | tested | review-only
# stability: stable | draft | deprecated
entries:
  # ---------- 项目 ----------
  - { id: project, path: project.yaml, summary: 项目元信息与 derive 输入, consumers: [ops, tools], enforcement: generated, stability: stable }

  # ---------- data ----------
  - { id: data.table.notes, path: data/tables/notes.yaml, summary: 笔记主表结构, consumers: [api], enforcement: generated+tested, stability: stable }
  - { id: data.enum.note_status, path: data/enums.yaml, summary: 跨端枚举集合, consumers: [api, web/admin], enforcement: generated, stability: stable }
  - { id: data.query.notes, path: data/queries/notes.yaml, summary: 笔记查询集, consumers: [api], enforcement: generated+tested, stability: stable }
  - { id: data.seed.roles, path: data/seeds/roles.yaml, summary: 系统必需角色数据, consumers: [api, ops], enforcement: generated+tested, stability: stable }
  - { id: data.policy.migrations, path: data/migrations-policy.yaml, summary: 迁移策略与禁止操作, consumers: [ops, tools], enforcement: generated, stability: stable }

  # ---------- capabilities ----------
  - { id: cap.http.shared, path: capabilities/http/shared.yaml, summary: HTTP 共享组件, consumers: [api, web/admin], enforcement: generated, stability: stable }
  - { id: cap.http.notes, path: capabilities/http/notes.yaml, summary: 笔记 HTTP 接口, consumers: [api, web/admin], enforcement: generated+tested, stability: stable }
  - { id: cap.async.notes_cleanup, path: capabilities/async/notes_cleanup.yaml, summary: 过期笔记清理任务, consumers: [worker], enforcement: generated+tested, stability: draft }
  - { id: cap.internal.notes, path: capabilities/internal/notes.yaml, summary: 笔记跨模块 service 接口, consumers: [api], enforcement: generated+tested, stability: stable }

  # ---------- domain ----------
  - { id: domain.entity.note, path: domain/entities/note.yaml, summary: 笔记实体与不变量, consumers: [api], enforcement: generated+tested, stability: stable }
  - { id: domain.state.note, path: domain/states/note.yaml, summary: 笔记状态机, consumers: [api, web/admin], enforcement: generated+tested, stability: stable }
  - { id: domain.rule.note, path: domain/rules/note.yaml, summary: 笔记业务规则集, consumers: [api], enforcement: tested, stability: stable }
  - { id: domain.flow.note_publish, path: domain/flows/note_publish.yaml, summary: 笔记发布业务流程, consumers: [api], enforcement: tested, stability: draft }
  - { id: domain.event.note, path: domain/events/note.yaml, summary: 笔记领域事件, consumers: [api, worker], enforcement: generated+tested, stability: stable }
  - { id: domain.glossary, path: domain/glossary.md, summary: 统一术语表, consumers: [api, web/admin, ai], enforcement: review-only, stability: stable }

  # ---------- features ----------
  - { id: feature.routes, path: features/routes.yaml, summary: 路由与菜单, consumers: [web/admin], enforcement: generated, stability: stable }
  - { id: feature.page.note_list, path: features/pages/note_list.yaml, summary: 笔记列表页, consumers: [web/admin], enforcement: generated+tested, stability: stable }
  - { id: feature.page.note_detail, path: features/pages/note_detail.yaml, summary: 笔记详情页, consumers: [web/admin], enforcement: generated+tested, stability: stable }
  - { id: feature.page.login, path: features/pages/login.yaml, summary: 登录页, consumers: [web/admin], enforcement: generated+tested, stability: draft }
  - { id: feature.page.not_found, path: features/pages/not_found.yaml, summary: 404 页, consumers: [web/admin], enforcement: generated, stability: stable }
  - { id: feature.flow.note_create, path: features/flows/note_create.yaml, summary: 创建笔记用户旅程, consumers: [web/admin], enforcement: tested, stability: draft }

  # ---------- platform ----------
  - { id: platform.environments, path: platform/environments.yaml, summary: 环境清单与差异, consumers: [ops, api, web/admin], enforcement: tested, stability: stable }
  - { id: platform.versioning, path: platform/versioning.yaml, summary: 版本与兼容策略, consumers: [api, web/admin, ops], enforcement: tested, stability: stable }
  - { id: platform.errors, path: platform/errors.yaml, summary: 错误码与 HTTP 映射, consumers: [api, web/admin], enforcement: generated+tested, stability: stable }
  - { id: platform.http_conventions, path: platform/http-conventions.yaml, summary: 信封、分页、header、状态码, consumers: [api, web/admin], enforcement: generated, stability: stable }
  - { id: platform.quality, path: platform/quality.yaml, summary: 测试策略与门槛, consumers: [tools], enforcement: tested, stability: stable }
  - { id: platform.config.env, path: platform/config/env.schema.json, summary: 环境变量 schema, consumers: [api, web/admin, ops], enforcement: generated+tested, stability: stable }
  - { id: platform.arch.go, path: platform/architecture/go-arch.yaml, summary: Go 分层约束, consumers: [tools], enforcement: tested, stability: stable }
  - { id: platform.arch.web, path: platform/architecture/web-deps.json, summary: 前端依赖方向约束, consumers: [tools], enforcement: tested, stability: stable }
  - { id: platform.design.tokens, path: platform/design/tokens.json, summary: 设计令牌, consumers: [web/admin], enforcement: generated, stability: stable }
  - { id: platform.obs.log, path: platform/observability/log-fields.yaml, summary: 日志字段与 PII 规则, consumers: [api, ops], enforcement: generated+tested, stability: stable }
  - { id: platform.obs.metrics, path: platform/observability/metrics.yaml, summary: 指标名与标签, consumers: [api, ops], enforcement: generated, stability: stable }
  - { id: platform.analytics.events, path: platform/analytics/events.yaml, summary: 埋点事件与属性, consumers: [web/admin, api], enforcement: generated, stability: draft }
  - { id: platform.sec.permissions, path: platform/security/permissions.yaml, summary: 权限点, consumers: [api, web/admin], enforcement: generated+tested, stability: stable }
  - { id: platform.sec.roles, path: platform/security/roles.yaml, summary: 角色与权限映射, consumers: [api, web/admin], enforcement: generated+tested, stability: stable }
  - { id: platform.sec.auth, path: platform/security/auth-policy.yaml, summary: 会话与认证策略, consumers: [api, web/admin], enforcement: tested, stability: stable }

  # ---------- generated（产物索引，非契约正文） ----------
  - { id: generated.manifest, path: generated/manifest.json, summary: 生成物与来源契约映射, consumers: [tools], enforcement: generated, stability: stable }
  - { id: generated.graph, path: generated/graph.json, summary: 锚点图, consumers: [tools, ai], enforcement: generated, stability: stable }
  - { id: generated.lineage, path: generated/lineage.md, summary: 人读血缘报告, consumers: [ai, ops], enforcement: generated, stability: stable }

# 白名单：允许没有入边的根契约
orphan_whitelist:
  - project
  - platform.environments
  - platform.versioning
  - platform.quality
  - platform.arch.go
  - platform.arch.web
  - generated.manifest
  - generated.graph
  - generated.lineage
