components:
  headers:
    RetryAfter:
      description: 建议重试等待秒数或 HTTP-date；非法值不发送，调用方记录参数错误
      schema:
        example: "30"
        type: string
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        maxLength: 64
        minLength: 8
        type: string
    RequestId:
      in: header
      name: X-Request-Id
      required: false
      schema:
        maxLength: 64
        type: string
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: 请求非法
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: 状态冲突
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: 无权限
    Internal:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: 服务端错误
    Locked:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: 认证锁定中，可稍后重试
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: 资源不存在
    ServiceUnavailable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: 服务暂不可用或循环预算耗尽，可稍后重试
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: 触发限流
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: 未认证
    UnprocessableEntity:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: 语义校验失败
  schemas:
    Account:
      additionalProperties: false
      properties:
        auth_email:
          description: 账号绑定的邮箱
          type: object
        auth_phone:
          description: 账号绑定的手机号
          type: object
        auth_pwd:
          description: 账号的密码认证记录
          type: object
        nickname:
          description: 昵称
          type: object
        number:
          description: 账号编号
          type: object
        status:
          description: 账号状态
          enum:
            - pending
            - active
            - suspended
            - deleted
          type: string
        tokens:
          description: 账号的设备令牌列表
          items:
            type: object
          type: array
        user_i_d:
          description: 关联用户 ID
          type: object
      required:
        - status
        - number
        - nickname
        - user_i_d
        - tokens
        - auth_pwd
        - auth_phone
        - auth_email
      type: object
      x-entity: data.entities.account
    AccountPage:
      additionalProperties: false
      properties:
        has_more:
          description: 是否还有下一页
          type: boolean
        items:
          description: 分页项列表
          items:
            $ref: '#/components/schemas/Account'
          type: array
        limit:
          default: 20
          description: 当前页大小
          maximum: 100
          minimum: 1
          type: integer
        offset:
          default: 0
          description: 当前页偏移
          minimum: 0
          type: integer
      required:
        - items
        - offset
        - limit
        - has_more
      type: object
      x-service-type: cap.services.account.schemas.AccountPage
    AccountStatus:
      enum:
        - pending
        - active
        - suspended
        - deleted
      type: string
      x-enum: data.enums.account_status
    AuthAttributes:
      additionalProperties: false
      properties:
        auth_type:
          description: 本次登录使用的认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        device_id:
          description: 登录设备标识
          maxLength: 128
          nullable: true
          type: string
      required:
        - auth_type
      type: object
      x-service-type: cap.services.auth.schemas.AuthAttributes
    AuthSession:
      additionalProperties: false
      properties:
        account:
          $ref: '#/components/schemas/Account'
          description: 账号实体
        attributes:
          $ref: '#/components/schemas/AuthAttributes'
          description: 会话属性
        tokens:
          $ref: '#/components/schemas/TokenPair'
          description: 令牌对
      required:
        - account
        - tokens
        - attributes
      type: object
      x-service-type: cap.services.auth.schemas.AuthSession
    CreateAccountInput:
      additionalProperties: false
      properties:
        nickname:
          description: 账号昵称
          maxLength: 100
          minLength: 1
          type: string
        number:
          description: 账号编号
          maxLength: 64
          minLength: 4
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        user_id:
          description: 关联用户 ID
          nullable: true
          type: integer
      required:
        - number
        - nickname
      type: object
      x-service-type: cap.services.account.schemas.CreateAccountInput
    EventAccountActivated:
      additionalProperties: false
      description: 账号激活或解封
      properties:
        activated_at:
          description: 账号激活时间
          format: date-time
          type: string
        id:
          description: 唯一标识
          type: integer
      required:
        - id
        - activated_at
      type: object
      x-event-id: cap.events.account.activated
      x-event-name: account.activated
      x-event-version: 1
    EventAccountCreated:
      additionalProperties: false
      description: 账号创建
      properties:
        created_at:
          description: 创建时间
          format: date-time
          type: string
        id:
          description: 唯一标识
          type: integer
        number:
          description: 账号编号
          maxLength: 64
          minLength: 4
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        status:
          description: 账号创建后的状态
          enum:
            - pending
            - active
            - suspended
            - deleted
          type: string
      required:
        - id
        - number
        - status
        - created_at
      type: object
      x-event-id: cap.events.account.created
      x-event-name: account.created
      x-event-version: 1
    EventAccountDeleted:
      additionalProperties: false
      description: 账号软删
      properties:
        deleted_at:
          description: 软删时间
          format: date-time
          type: string
        id:
          description: 唯一标识
          type: integer
      required:
        - id
        - deleted_at
      type: object
      x-event-id: cap.events.account.deleted
      x-event-name: account.deleted
      x-event-version: 1
    EventAccountLoginFailed:
      additionalProperties: false
      description: 登录失败
      properties:
        account_id:
          description: 账号 ID；未知账号为 null
          nullable: true
          type: integer
        failed_at:
          description: 登录失败时间
          format: date-time
          type: string
        reason:
          description: 失败或停用原因
          enum:
            - bad_password
            - locked
            - suspended
            - not_found
          type: string
      required:
        - reason
        - failed_at
      type: object
      x-event-id: cap.events.account.login_failed
      x-event-name: account.login_failed
      x-event-version: 1
    EventAccountLoginSucceeded:
      additionalProperties: false
      description: 登录成功
      properties:
        attributes:
          additionalProperties:
            type: string
          description: 登录上下文扩展属性；键值均为字符串
          maxProperties: 10
          minProperties: 1
          propertyNames:
            pattern: ^[a-z][a-z0-9_]*$
          type: object
        id:
          description: 唯一标识
          type: integer
        ip:
          description: 客户端 IP
          type: string
        login_at:
          description: 登录时间
          format: date-time
          type: string
        user_agent:
          description: 客户端 User-Agent
          type: string
      required:
        - id
        - login_at
      type: object
      x-event-id: cap.events.account.login_succeeded
      x-event-name: account.login_succeeded
      x-event-version: 1
    EventAccountReactivated:
      additionalProperties: false
      description: 账号解封
      properties:
        id:
          description: 唯一标识
          type: integer
        reactivated_at:
          description: 账号重新激活时间
          format: date-time
          type: string
      required:
        - id
        - reactivated_at
      type: object
      x-event-id: cap.events.account.reactivated
      x-event-name: account.reactivated
      x-event-version: 1
    EventAccountSuspended:
      additionalProperties: false
      description: 账号封禁
      properties:
        id:
          description: 唯一标识
          type: integer
        reason:
          description: 失败或停用原因
          type: string
        suspended_at:
          description: 账号停用时间
          format: date-time
          type: string
      required:
        - id
        - reason
        - suspended_at
      type: object
      x-event-id: cap.events.account.suspended
      x-event-name: account.suspended
      x-event-version: 1
    EventTokenIssued:
      additionalProperties: false
      description: 令牌签发
      properties:
        account:
          $ref: '#/components/schemas/Account'
          description: 账号实体
        account_id:
          description: 账号 ID
          type: integer
        issued_at:
          description: 签发时间
          format: date-time
          type: string
        token_id:
          description: 令牌 ID
          type: integer
      required:
        - token_id
        - account_id
        - account
        - issued_at
      type: object
      x-event-id: cap.events.token.issued
      x-event-name: token.issued
      x-event-version: 1
    LoginInput:
      additionalProperties: false
      properties:
        auth_type:
          description: 认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        code:
          description: 手机号区号，例如 +86
          maxLength: 8
          minLength: 2
          nullable: true
          pattern: ^\+[0-9]{1,4}$
          type: string
        device_id:
          description: 设备标识
          maxLength: 128
          nullable: true
          type: string
        identifier:
          description: 登录标识
          maxLength: 254
          minLength: 1
          type: string
        password:
          description: 密码；仅请求写入，不回显
          nullable: true
          type: string
          writeOnly: true
      required:
        - auth_type
        - identifier
      type: object
      x-service-type: cap.services.auth.schemas.LoginInput
    PageInfo:
      additionalProperties: false
      properties:
        has_more:
          type: boolean
      required:
        - has_more
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          example: ACCOUNT_NOT_FOUND
          type: string
        detail:
          type: string
        errors:
          items:
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
            required:
              - field
              - message
            type: object
          type: array
        instance:
          format: uri-reference
          type: string
        status:
          example: 404
          maximum: 599
          minimum: 100
          type: integer
        title:
          example: not found
          type: string
        type:
          example: about:blank
          format: uri-reference
          type: string
      required:
        - type
        - title
        - status
      type: object
    SendVerificationInput:
      additionalProperties: false
      properties:
        account_id:
          description: 注册时必传（先建 pending account）；其他用途可省略，由服务端按 target 解析
          nullable: true
          type: integer
        auth_type:
          description: 认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        purpose:
          description: 验证码用途
          enum:
            - register
            - login
            - reset_password
            - bind_phone
            - bind_email
            - unbind_phone
            - unbind_email
            - change_phone
            - change_email
            - delete_account
          type: string
        target:
          description: 验证码接收目标
          maxLength: 320
          minLength: 1
          type: string
      required:
        - auth_type
        - target
        - purpose
      type: object
      x-service-type: cap.services.verification.schemas.SendVerificationInput
    TokenPair:
      additionalProperties: false
      properties:
        access_expire_at:
          description: 访问令牌过期时间
          format: date-time
          type: string
        access_token:
          description: 访问令牌
          readOnly: true
          type: string
        refresh_expire_at:
          description: 刷新令牌过期时间
          format: date-time
          type: string
        refresh_token:
          description: 刷新令牌
          readOnly: true
          type: string
        token_type:
          default: Bearer
          description: 令牌类型；固定 Bearer
          pattern: ^Bearer$
          type: string
      required:
        - access_token
        - refresh_token
        - access_expire_at
        - refresh_expire_at
      type: object
      x-auth-response: true
      x-service-type: cap.services.token.schemas.TokenPair
    UpdateAccountInput:
      additionalProperties: false
      properties:
        nickname:
          description: 账号昵称
          maxLength: 100
          minLength: 1
          type: string
      required:
        - nickname
      type: object
      x-service-type: cap.services.account.schemas.UpdateAccountInput
    VerificationPurpose:
      enum:
        - register
        - login
        - reset_password
        - bind_phone
        - bind_email
        - unbind_phone
        - unbind_email
        - change_phone
        - change_email
        - delete_account
      type: string
      x-enum: data.enums.verification_purpose
    VerificationResult:
      additionalProperties: false
      properties:
        consumed_at:
          description: 验证码消费时间；未消费为 null
          format: date-time
          nullable: true
          type: string
        verification_id:
          description: 验证记录 ID
          type: integer
        verified:
          description: 是否验证通过
          type: boolean
      required:
        - verified
        - verification_id
      type: object
      x-service-type: cap.services.verification.schemas.VerificationResult
    VerificationSent:
      additionalProperties: false
      properties:
        expire_at:
          description: 过期时间
          format: date-time
          type: string
        id:
          description: 验证记录 ID
          type: integer
        masked_target:
          description: 脱敏后的接收目标
          type: string
      required:
        - id
        - masked_target
        - expire_at
      type: object
      x-service-type: cap.services.verification.schemas.VerificationSent
    VerifyCodeInput:
      additionalProperties: false
      properties:
        account_id:
          description: 注册时必传；其他用途可省略
          nullable: true
          type: integer
        auth_type:
          description: 认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        code:
          description: 验证码
          maxLength: 12
          minLength: 4
          type: string
        purpose:
          description: 验证码用途
          enum:
            - register
            - login
            - reset_password
            - bind_phone
            - bind_email
            - unbind_phone
            - unbind_email
            - change_phone
            - change_email
            - delete_account
          type: string
        target:
          description: 验证码接收目标
          maxLength: 320
          minLength: 1
          type: string
      required:
        - auth_type
        - target
        - purpose
        - code
      type: object
      x-service-type: cap.services.verification.schemas.VerifyCodeInput
info:
  title: web-seed admin API
  version: 0.1.0
openapi: 3.1.0
paths:
  /account:
    get:
      operationId: listAccounts
      parameters:
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - in: query
          name: offset
          required: false
          schema:
            default: 0
            minimum: 0
            type: integer
        - in: query
          name: limit
          required: false
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              example:
                has_more: false
                items:
                  - created_at: "2026-11-11T09:30:00Z"
                    id: 1
                    nickname: 管理员
                    number: ACC-0001
                    status: active
                limit: 20
                offset: 0
              schema:
                $ref: '#/components/schemas/AccountPage'
                x-service-return: cap.services.account.schemas.AccountPage
          description: 成功
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/Internal'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      summary: 列出账号
      x-contract-id: cap.protocols.http.account.list
      x-service: cap.services.account.list
      x-timeout-ms: 3000
    post:
      operationId: createAccount
      requestBody:
        content:
          application/json:
            example:
              nickname: 管理员
              number: ACC-0001
            schema:
              $ref: '#/components/schemas/CreateAccountInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
                x-service-return: data.entities.account
          description: 已创建
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/Internal'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      summary: 创建账号
      x-contract-id: cap.protocols.http.account.create
      x-service: cap.services.account.create
      x-timeout-ms: 5000
  /account/{id}:
    delete:
      operationId: deleteAccount
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: 已删除
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/Internal'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      summary: 删除账号（软删）
      x-contract-id: cap.protocols.http.account.delete
      x-service: cap.services.account.delete
    get:
      operationId: getAccount
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
                x-service-return: data.entities.account
          description: 成功
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/Internal'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      summary: 获取账号
      x-contract-id: cap.protocols.http.account.get
      x-service: cap.services.account.get
    patch:
      operationId: updateAccount
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
                x-service-return: data.entities.account
          description: 成功
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/Internal'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      summary: 更新账号资料
      x-contract-id: cap.protocols.http.account.update
      x-service: cap.services.account.update
  /account/{id}/activate:
    post:
      operationId: activateAccount
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
                x-service-return: data.entities.account
          description: 成功
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/Internal'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      summary: 激活账号
      x-contract-id: cap.protocols.http.account.activate
      x-service: cap.services.account.activate
  /account/{id}/suspend:
    post:
      operationId: suspendAccount
      parameters:
        - in: path
