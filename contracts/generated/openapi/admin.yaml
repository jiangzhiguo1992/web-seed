components:
  headers:
    RetryAfter:
      description: 建议重试等待秒数或 HTTP-date；非法值不发送，调用方记录参数错误
      schema:
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 请求非法
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 状态冲突
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 无权限
    Gone:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 端点已移除
    Internal:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 服务端错误
    Locked:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 认证锁定中，可稍后重试
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    MethodNotAllowed:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 方法不允许
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 资源不存在
    PayloadTooLarge:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 请求体超过上限
    ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 服务暂不可用或循环预算耗尽，可稍后重试
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 触发限流
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 未认证
    UnprocessableEntity:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 语义校验失败
    UnsupportedMediaType:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 不支持的 Content-Type
  schemas:
    AccessToken:
      additionalProperties: false
      properties:
        access_expire_at:
          description: 访问令牌过期时间
          format: int64
          type: integer
        access_token:
          description: 访问令牌
          readOnly: true
          type: string
        token_type:
          default: Bearer
          description: 令牌类型；固定 Bearer
          pattern: ^Bearer$
          type: string
      required:
        - access_token
        - access_expire_at
      type: object
    Account:
      additionalProperties: false
      properties:
        created_at:
          description: 创建时间
          format: int64
          type: integer
        deleted_at:
          description: 软删时间；为空表示未删除
          format: int64
          nullable: true
          type: integer
        id:
          description: 实体唯一主键；来自主表 id 列（integer）
          type: integer
        nickname:
          description: 昵称
          maxLength: 100
          minLength: 1
          type: string
        number:
          description: 账号编号
          maxLength: 64
          minLength: 4
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        status:
          description: 账号状态
          enum:
            - pending
            - active
            - suspended
            - deleted
          type: string
        updated_at:
          description: 更新时间
          format: int64
          type: integer
        user_id:
          description: 关联用户 ID
          nullable: true
          type: integer
      required:
        - id
        - created_at
        - updated_at
        - status
        - number
        - nickname
      type: object
    AccountPage:
      additionalProperties: false
      properties:
        has_more:
          description: 是否还有下一页
          type: boolean
        items:
          description: 分页项列表
          items:
            $ref: '#/components/schemas/Account'
          type: array
        limit:
          default: 20
          description: 当前页大小
          maximum: 100
          minimum: 1
          type: integer
        offset:
          default: 0
          description: 当前页偏移
          minimum: 0
          type: integer
      required:
        - items
        - offset
        - limit
        - has_more
      type: object
    AccountStatus:
      enum:
        - pending
        - active
        - suspended
        - deleted
      type: string
    ApiAccountPageResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/AccountPage'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiAccountResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/Account'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiAttachmentPageResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/AttachmentPage'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiAttachmentResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/Attachment'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiAuthBindingResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/AuthBinding'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiAuthResultResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/AuthResult'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiDictionaryPageResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/DictionaryPage'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiDictionaryResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/Dictionary'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiErrorResponse:
      additionalProperties: false
      properties:
        code:
          maximum: 9999
          minimum: 1000
          type: integer
        data:
          type: "null"
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiImportResultResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/ImportResult'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiRefreshResultResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/RefreshResult'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiSignedURLResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/SignedURL'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiUploadTicketResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/UploadTicket'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiVerificationResultResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/VerificationResult'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    ApiVerificationSentResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/VerificationSent'
        msg:
          type: string
      required:
        - code
        - msg
        - data
      type: object
    Attachment:
      additionalProperties: false
      properties:
        content_type:
          description: MIME 类型
          type: string
        created_at:
          description: 创建时间
          format: int64
          type: integer
        deleted_at:
          description: 软删时间；为空表示未删除
          format: int64
          nullable: true
          type: integer
        id:
          description: 实体唯一主键；来自主表 id 列（integer）
          type: integer
        object_key:
          description: 对象存储 key；不存 URL
          type: string
        original_name:
          description: 原始文件名；仅展示/下载
          type: string
        owner_id:
          description: 所有者行 ID
          type: integer
        owner_table_name:
          description: 所有者物理表名
          type: string
        purpose:
          description: 用途：icon/avatar/attachment 等
          type: string
        replaces_id:
          description: 被替换的旧附件 ID；无替换为 null
          nullable: true
          type: integer
        sha256:
          description: SHA-256 十六进制；完整性/去重校验
          nullable: true
          type: string
        size_bytes:
          description: 对象大小（字节）
          minimum: 0
          type: integer
        sort:
          description: 同一 owner+purpose 内的展示顺序
          type: integer
        status:
          description: 附件状态
          enum:
            - uploading
            - available
            - deleted
            - failure
          type: string
        updated_at:
          description: 更新时间
          format: int64
          type: integer
        visibility:
          description: 访问级别
          enum:
            - private
            - public
          type: string
      required:
        - id
        - created_at
        - updated_at
        - status
        - owner_table_name
        - owner_id
        - purpose
        - sort
        - object_key
        - original_name
        - content_type
        - size_bytes
        - visibility
      type: object
    AttachmentPage:
      additionalProperties: false
      properties:
        has_more:
          description: 是否还有下一页
          type: boolean
        items:
          description: 分页项列表
          items:
            $ref: '#/components/schemas/Attachment'
          type: array
        limit:
          default: 20
          description: 当前页大小
          maximum: 100
          minimum: 1
          type: integer
        offset:
          default: 0
          description: 当前页偏移
          minimum: 0
          type: integer
      required:
        - items
        - offset
        - limit
        - has_more
      type: object
    AuthAttributes:
      additionalProperties: false
      properties:
        auth_type:
          description: 本次登录使用的认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        device_id:
          description: 登录设备标识
          maxLength: 128
          nullable: true
          type: string
      required:
        - auth_type
      type: object
    AuthBinding:
      additionalProperties: false
      properties:
        account_id:
          description: 账号 ID
          type: integer
        auth_id:
          description: 认证绑定 ID
          type: integer
        auth_type:
          description: 认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        masked_target:
          description: 脱敏后的接收目标
          type: string
        status:
          description: 认证绑定状态
          enum:
            - unverified
            - verified
            - disabled
          type: string
      required:
        - auth_type
        - auth_id
        - account_id
        - status
      type: object
    AuthResult:
      additionalProperties: false
      properties:
        account:
          $ref: '#/components/schemas/Account'
          description: 账号实体
        attributes:
          $ref: '#/components/schemas/AuthAttributes'
          description: 登录结果属性
        refresh:
          $ref: '#/components/schemas/RefreshToken'
          description: 刷新 JWT
        tokens:
          $ref: '#/components/schemas/AccessToken'
          description: 访问令牌
      required:
        - account
        - tokens
        - attributes
        - refresh
      type: object
    BindEmailInput:
      additionalProperties: false
      properties:
        action:
          description: 认证绑定动作
          enum:
            - create
            - enable
            - disable
            - replace
          type: string
        domain:
          description: 邮箱域名
          maxLength: 190
          minLength: 1
          nullable: true
          type: string
        username:
          description: 用户名
          maxLength: 64
          minLength: 1
          nullable: true
          type: string
      required:
        - action
      type: object
    BindPasswordInput:
      additionalProperties: false
      properties:
        action:
          description: 认证绑定动作
          enum:
            - create
            - update
            - enable
            - disable
          type: string
        password:
          description: 密码；仅请求写入，不回显
          nullable: true
          type: string
          writeOnly: true
        username:
          description: 用户名
          maxLength: 254
          minLength: 1
          nullable: true
          type: string
      required:
        - action
      type: object
    BindPhoneInput:
      additionalProperties: false
      properties:
        action:
          description: 认证绑定动作
          enum:
            - create
            - enable
            - disable
            - replace
          type: string
        code:
          description: 手机号区号，例如 +86
          maxLength: 8
          minLength: 2
          nullable: true
          pattern: ^\+[0-9]{1,4}$
          type: string
        number:
          description: 手机号；只允许数字
          maxLength: 32
          minLength: 1
          nullable: true
          pattern: ^[0-9]{1,32}$
          type: string
      required:
        - action
      type: object
    CreateAccountInput:
      additionalProperties: false
      properties:
        nickname:
          description: 账号昵称
          maxLength: 100
          minLength: 1
          type: string
        number:
          description: 账号编号
          maxLength: 64
          minLength: 4
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        user_id:
          description: 关联用户 ID
          nullable: true
          type: integer
      required:
        - number
        - nickname
      type: object
    CreateDictionaryInput:
      additionalProperties: false
      properties:
        code:
          description: 全局唯一编码
          type: string
        color:
          description: '展示颜色 #RRGGBB'
          nullable: true
          type: string
        extra:
          description: 扩展元数据
          nullable: true
          type: object
        name:
          description: 展示名
          type: string
        parent_id:
          description: 父节点 ID；顶级为空
          nullable: true
          type: integer
        remark:
          description: 备注
          nullable: true
          type: string
        sort:
          description: 排序
          type: integer
      required:
        - code
        - name
        - sort
      type: object
    CreateUploadInput:
      additionalProperties: false
      properties:
        content_type:
          description: MIME 类型
          type: string
        original_name:
          description: 原始文件名
          type: string
        owner_id:
          description: 所有者行 ID
          type: integer
        owner_table_name:
          description: 所有者物理表名
          type: string
        purpose:
          description: 用途：icon/avatar/attachment 等
          type: string
        replaces_id:
          description: 被替换的旧附件 ID；新上传为 null
          nullable: true
          type: integer
        sha256:
          description: SHA-256 十六进制
          nullable: true
          type: string
        size_bytes:
          description: 对象大小（字节）
          minimum: 0
          type: integer
        sort:
          description: 同一 owner+purpose 内的排序
          type: integer
        visibility:
          description: 访问级别
          enum:
            - private
            - public
          type: string
      required:
        - owner_table_name
        - owner_id
        - purpose
        - sort
        - original_name
        - content_type
        - size_bytes
        - visibility
      type: object
    Dictionary:
      additionalProperties: false
      properties:
        code:
          description: 字典编码；全局唯一且创建后不可变
          type: string
        color:
          description: 展示颜色；#RRGGBB
          nullable: true
          type: string
        created_at:
          description: 创建时间
          format: int64
          type: integer
        deleted_at:
          description: 软删时间；为空表示未删除
          format: int64
          nullable: true
          type: integer
        extra:
          description: 扩展元数据；只放 UI/非关键信息
          nullable: true
          type: object
        id:
          description: 实体唯一主键；来自主表 id 列（integer）
          type: integer
        name:
          description: 展示名；允许重复
          type: string
        parent_id:
          description: 父节点 ID；顶级为 null
          nullable: true
          type: integer
        remark:
          description: 备注；仅用于说明
          nullable: true
          type: string
        sort:
          description: 同一父节点下的展示顺序
          type: integer
        status:
          description: 字典状态
          enum:
            - enabled
            - disabled
            - deleted
          type: string
        updated_at:
          description: 更新时间
          format: int64
          type: integer
      required:
        - id
        - created_at
        - updated_at
        - status
        - code
        - name
        - sort
      type: object
    DictionaryImportInput:
      additionalProperties: false
      properties:
        items:
          description: 字典项数组
          items:
            $ref: '#/components/schemas/DictionaryImportItem'
          type: array
      required:
        - items
      type: object
    DictionaryImportItem:
      additionalProperties: false
      properties:
        code:
          description: 全局唯一编码
          type: string
        color:
          description: '展示颜色 #RRGGBB'
          nullable: true
          type: string
        extra:
          description: 扩展元数据
          nullable: true
          type: object
        name:
          description: 展示名
          type: string
        parent_id:
          description: 父节点 ID；null 表示顶级
          nullable: true
          type: integer
        remark:
          description: 备注
          nullable: true
          type: string
        sort:
          description: 排序
          type: integer
      required:
        - code
        - name
        - sort
      type: object
    DictionaryPage:
      additionalProperties: false
      properties:
        has_more:
          description: 是否还有下一页
          type: boolean
        items:
          description: 分页项列表
          items:
            $ref: '#/components/schemas/Dictionary'
          type: array
        limit:
          default: 20
          description: 当前页大小
          maximum: 100
          minimum: 1
          type: integer
        offset:
          default: 0
          description: 当前页偏移
          minimum: 0
          type: integer
      required:
        - items
        - offset
        - limit
        - has_more
      type: object
    EventAccountActivated:
      additionalProperties: false
      description: 账号激活或解封
      properties:
        activated_at:
          description: 账号激活时间
          format: int64
          type: integer
        id:
          description: 唯一标识
          type: integer
      required:
        - id
        - activated_at
      type: object
    EventAccountCreated:
      additionalProperties: false
      description: 账号创建
      properties:
        created_at:
          description: 创建时间
          format: int64
          type: integer
        id:
          description: 唯一标识
          type: integer
        number:
          description: 账号编号
          maxLength: 64
          minLength: 4
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        status:
          description: 账号创建后的状态
          enum:
            - pending
            - active
            - suspended
            - deleted
          type: string
      required:
        - id
        - number
        - status
        - created_at
      type: object
    EventAccountDeleted:
      additionalProperties: false
      description: 账号软删
      properties:
        deleted_at:
          description: 软删时间
          format: int64
          type: integer
        id:
          description: 唯一标识
          type: integer
      required:
        - id
        - deleted_at
      type: object
    EventAccountLoginFailed:
      additionalProperties: false
      description: 登录失败
      properties:
        account_id:
          description: 账号 ID；未知账号为 null
          nullable: true
          type: integer
        failed_at:
          description: 登录失败时间
          format: int64
          type: integer
        reason:
          description: 失败或停用原因
          enum:
            - bad_password
            - locked
            - suspended
            - not_found
          type: string
      required:
        - reason
        - failed_at
      type: object
    EventAccountLoginSucceeded:
      additionalProperties: false
      description: 登录成功
      properties:
        attributes:
          additionalProperties:
            type: string
          description: 登录上下文扩展属性；键值均为字符串
          maxProperties: 10
          minProperties: 1
          propertyNames:
            pattern: ^[a-z][a-z0-9_]*$
          type: object
        id:
          description: 唯一标识
          type: integer
        ip:
          description: 客户端 IP
          type: string
        login_at:
          description: 登录时间
          format: int64
          type: integer
        user_agent:
          description: 客户端 User-Agent
          type: string
      required:
        - id
        - login_at
      type: object
    EventAccountReactivated:
      additionalProperties: false
      description: 账号解封
      properties:
        id:
          description: 唯一标识
          type: integer
        reactivated_at:
          description: 账号重新激活时间
          format: int64
          type: integer
      required:
        - id
        - reactivated_at
      type: object
    EventAccountSuspended:
      additionalProperties: false
      description: 账号封禁
      properties:
        id:
          description: 唯一标识
          type: integer
        reason:
          description: 失败或停用原因
          type: string
        suspended_at:
          description: 账号停用时间
          format: int64
          type: integer
      required:
        - id
        - reason
        - suspended_at
      type: object
    EventTokenIssued:
      additionalProperties: false
      description: 令牌签发
      properties:
        account:
          $ref: '#/components/schemas/Account'
          description: 账号实体
        account_id:
          description: 账号 ID
          type: integer
        issued_at:
          description: 签发时间
          format: int64
          type: integer
        token_id:
          description: 令牌 ID
          type: integer
      required:
        - token_id
        - account_id
        - account
        - issued_at
      type: object
    ImportResult:
      additionalProperties: false
      properties:
        affected_rows:
          description: 成功写入的行数
          type: integer
      required:
        - affected_rows
      type: object
    LoginInput:
      additionalProperties: false
      properties:
        auth_type:
          description: 认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        code:
          description: 手机号区号，例如 +86
          maxLength: 8
          minLength: 2
          nullable: true
          pattern: ^\+[0-9]{1,4}$
          type: string
        device_id:
          description: 设备标识
          maxLength: 128
          nullable: true
          type: string
        identifier:
          description: 登录标识
          maxLength: 254
          minLength: 1
          type: string
        password:
          description: 密码；仅请求写入，不回显
          nullable: true
          type: string
          writeOnly: true
      required:
        - auth_type
        - identifier
      type: object
    MoveDictionaryInput:
      additionalProperties: false
      properties:
        parent_id:
          description: 新父节点；null 表示移到顶级
          nullable: true
          type: integer
      type: object
    RefreshInput:
      additionalProperties: false
      properties:
        refresh_token:
          description: 刷新 JWT
          type: string
          writeOnly: true
      required:
        - refresh_token
      type: object
    RefreshResult:
      additionalProperties: false
      properties:
        access:
          $ref: '#/components/schemas/AccessToken'
          description: 新的访问令牌
        refresh:
          $ref: '#/components/schemas/RefreshToken'
          description: 新的刷新令牌
      required:
        - access
        - refresh
      type: object
    RefreshToken:
      additionalProperties: false
      properties:
        refresh_expire_at:
          description: 刷新令牌过期时间
          format: int64
          type: integer
        refresh_token:
          description: 刷新 JWT
          readOnly: true
          type: string
      required:
        - refresh_token
        - refresh_expire_at
      type: object
    SendVerificationInput:
      additionalProperties: false
      properties:
        account_id:
          description: 注册时必传（先建 pending account）；其他用途可省略，由服务端按 target 解析
          nullable: true
          type: integer
        auth_type:
          description: 认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        purpose:
          description: 验证码用途
          enum:
            - register
            - login
            - reset_password
            - bind_phone
            - bind_email
            - unbind_phone
            - unbind_email
            - change_phone
            - change_email
            - delete_account
          type: string
        target:
          description: 验证码接收目标
          maxLength: 320
          minLength: 1
          type: string
      required:
        - auth_type
        - target
        - purpose
      type: object
    SetDictionaryStatusInput:
      additionalProperties: false
      properties:
        status:
          description: 目标状态
          enum:
            - enabled
            - disabled
            - deleted
          type: string
      required:
        - status
      type: object
    SignedURL:
      additionalProperties: false
      properties:
        expires_at:
          description: 下载 URL 过期时间
          format: int64
          type: integer
        url:
          description: 预签名下载 URL
          type: string
      required:
        - url
        - expires_at
      type: object
    SuspendAccountInput:
      additionalProperties: false
      properties:
        reason:
          description: 封禁原因
          maxLength: 200
          minLength: 1
          type: string
      required:
        - reason
      type: object
    UpdateAccountInput:
      additionalProperties: false
      properties:
        nickname:
          description: 账号昵称
          maxLength: 100
          minLength: 1
          type: string
      required:
        - nickname
      type: object
    UpdateDictionaryInput:
      additionalProperties: false
      properties:
        color:
          description: '展示颜色 #RRGGBB'
          nullable: true
          type: string
        extra:
          description: 扩展元数据
          nullable: true
          type: object
        name:
          description: 展示名
          type: string
        remark:
          description: 备注
          nullable: true
          type: string
        sort:
          description: 排序
          type: integer
      required:
        - name
        - sort
      type: object
    UploadTicket:
      additionalProperties: false
      properties:
        attachment_id:
          description: 附件 ID
          type: integer
        expires_at:
          description: 上传 URL 过期时间
          format: int64
          type: integer
        object_key:
          description: 对象存储 key
          type: string
        upload_url:
          description: 预签名上传 URL
          type: string
      required:
        - attachment_id
        - object_key
        - upload_url
        - expires_at
      type: object
    VerificationResult:
      additionalProperties: false
      properties:
        consumed_at:
          description: 验证码消费时间；未消费为 null
          format: int64
          nullable: true
          type: integer
        verification_id:
          description: 验证记录 ID
          type: integer
        verified:
          description: 是否验证通过
          type: boolean
      required:
        - verified
        - verification_id
      type: object
    VerificationSent:
      additionalProperties: false
      properties:
        expire_at:
          description: 过期时间
          format: int64
          type: integer
        id:
          description: 验证记录 ID
          type: integer
        masked_target:
          description: 脱敏后的接收目标
          type: string
      required:
        - id
        - masked_target
        - expire_at
      type: object
    VerifyCodeInput:
      additionalProperties: false
      properties:
        account_id:
          description: 注册时必传；其他用途可省略
          nullable: true
          type: integer
        auth_type:
          description: 认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        code:
          description: 验证码
          maxLength: 12
          minLength: 4
          type: string
        purpose:
          description: 验证码用途
          enum:
            - register
            - login
            - reset_password
            - bind_phone
            - bind_email
            - unbind_phone
            - unbind_email
            - change_phone
            - change_email
            - delete_account
          type: string
        target:
          description: 验证码接收目标
          maxLength: 320
          minLength: 1
          type: string
      required:
        - auth_type
        - target
        - purpose
        - code
      type: object
  securitySchemes:
    Bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: web-seed admin API
  version: 0.1.0
openapi: 3.1.0
paths:
  /account/admin:
    get:
      operationId: listAccounts
      parameters:
        - description: 期望响应媒体类型
          in: header
          name: Accept
          required: false
          schema:
            enum:
              - application/json
            type: string
        - description: 账号状态过滤
          in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - description: 分页偏移；默认 0
          in: query
          name: offset
          required: false
          schema:
            default: 0
            minimum: 0
            type: integer
        - description: 分页大小；默认 20
          in: query
          name: limit
          required: false
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAccountPageResponse'
          description: 成功
        400:
          $ref: '#/components/responses/BadRequest'
          x-error-codes:
            - biz_code: 1001
              code: COMMON_BAD_REQUEST
              msg: 请求参数不合法
        401:
          $ref: '#/components/responses/Unauthorized'
          x-error-codes:
            - biz_code: 1002
              code: COMMON_UNAUTHORIZED
              msg: 未认证
        403:
          $ref: '#/components/responses/Forbidden'
          x-error-codes:
            - biz_code: 1003
              code: COMMON_FORBIDDEN
              msg: 无权限
        405:
          $ref: '#/components/responses/MethodNotAllowed'
          x-error-codes:
            - biz_code: 1014
              code: COMMON_METHOD_NOT_ALLOWED
              msg: 方法不允许
        429:
          $ref: '#/components/responses/TooManyRequests'
          x-error-codes:
            - biz_code: 1006
              code: COMMON_RATE_LIMITED
              msg: 请求过于频繁
        500:
          $ref: '#/components/responses/Internal'
          x-error-codes:
            - biz_code: 1007
              code: COMMON_INTERNAL
              msg: 服务端错误
            - biz_code: 1008
              code: COMMON_AUDIT_FAILED
              msg: 审计写入失败
        503:
          $ref: '#/components/responses/ServiceUnavailable'
          x-error-codes:
            - biz_code: 1009
              code: COMMON_LOOP_EXHAUSTED
              msg: 循环次数超过上限，请稍后重试
            - biz_code: 1010
              code: COMMON_UNAVAILABLE
              msg: 服务暂不可用
      security:
        - Bearer: []
      summary: 列出账号
