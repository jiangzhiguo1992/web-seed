components:
  headers:
    ClearAuthCookies:
      description: 清除 refresh_token 与 csrf_token cookie；Max-Age=0；Path=/<app.api_version>/auth
      schema:
        type: string
    RetryAfter:
      description: 建议重试等待秒数或 HTTP-date；非法值不发送，调用方记录参数错误
      schema:
        type: string
    SetAuthCookies:
      description: 设置 refresh_token HttpOnly cookie 与 csrf_token 可读 cookie；Path=/<app.api_version>/auth，SameSite=Lax，Secure 按环境
      schema:
        type: string
    XRequestId:
      description: 请求链路 ID；服务端必须回传
      schema:
        maxLength: 64
        type: string
  parameters:
    Authorization:
      in: header
      name: Authorization
      required: true
      schema:
        minLength: 1
        type: string
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        minLength: 1
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        maxLength: 64
        minLength: 8
        type: string
    IdempotencyKeyRequired:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 64
        minLength: 8
        type: string
    RefreshTokenCookie:
      in: cookie
      name: refresh_token
      required: true
      schema:
        minLength: 1
        type: string
    RequestId:
      in: header
      name: X-Request-Id
      required: false
      schema:
        maxLength: 64
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 请求非法
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 状态冲突
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 无权限
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Gone:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 端点已移除
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Internal:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 服务端错误
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Locked:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 认证锁定中，可稍后重试
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 资源不存在
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    PayloadTooLarge:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 请求体超过上限
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 服务暂不可用或循环预算耗尽，可稍后重试
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 触发限流
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 未认证
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    UnprocessableEntity:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 语义校验失败
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    UnsupportedMediaType:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
      description: 不支持的 Content-Type
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
  schemas:
    AccessToken:
      additionalProperties: false
      properties:
        access_expire_at:
          description: 访问令牌过期时间
          format: date-time
          type: string
        access_token:
          description: 访问令牌
          readOnly: true
          type: string
        token_type:
          default: Bearer
          description: 令牌类型；固定 Bearer
          pattern: ^Bearer$
          type: string
      required:
        - access_token
        - access_expire_at
      type: object
    Account:
      additionalProperties: false
      properties:
        created_at:
          description: 创建时间
          format: date-time
          type: string
        deleted_at:
          description: 软删时间；为空表示未删除
          format: date-time
          nullable: true
          type: string
        id:
          description: 实体唯一主键；来自主表 id 列（integer）
          type: integer
        nickname:
          description: 昵称
          maxLength: 100
          minLength: 1
          type: string
        number:
          description: 账号编号
          maxLength: 64
          minLength: 4
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        status:
          description: 账号状态
          enum:
            - pending
            - active
            - suspended
            - deleted
          type: string
        updated_at:
          description: 更新时间
          format: date-time
          type: string
        user_id:
          description: 关联用户 ID
          nullable: true
          type: integer
      required:
        - id
        - created_at
        - updated_at
        - status
        - number
        - nickname
      type: object
    ApiAccessTokenResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/AccessToken'
        message:
          type: string
      required:
        - code
        - message
        - data
      type: object
    ApiAccountResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/Account'
        message:
          type: string
      required:
        - code
        - message
        - data
      type: object
    ApiAuthBindingResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/AuthBinding'
        message:
          type: string
      required:
        - code
        - message
        - data
      type: object
    ApiAuthSessionResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/AuthSession'
        message:
          type: string
      required:
        - code
        - message
        - data
      type: object
    ApiErrorResponse:
      additionalProperties: false
      properties:
        code:
          maximum: 9999
          minimum: 1000
          type: integer
        data:
          type: null
        message:
          type: string
      required:
        - code
        - message
        - data
      type: object
    ApiVerificationResultResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/VerificationResult'
        message:
          type: string
      required:
        - code
        - message
        - data
      type: object
    ApiVerificationSentResponse:
      additionalProperties: false
      properties:
        code:
          const: 0
          type: integer
        data:
          $ref: '#/components/schemas/VerificationSent'
        message:
          type: string
      required:
        - code
        - message
        - data
      type: object
    AuthAttributes:
      additionalProperties: false
      properties:
        auth_type:
          description: 本次登录使用的认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        device_id:
          description: 登录设备标识
          maxLength: 128
          nullable: true
          type: string
      required:
        - auth_type
      type: object
    AuthBinding:
      additionalProperties: false
      properties:
        account_id:
          description: 账号 ID
          type: integer
        auth_id:
          description: 认证绑定 ID
          type: integer
        auth_type:
          description: 认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        masked_target:
          description: 脱敏后的接收目标
          type: string
        status:
          description: 认证绑定状态
          enum:
            - unverified
            - verified
            - disabled
          type: string
      required:
        - auth_type
        - auth_id
        - account_id
        - status
      type: object
    AuthSession:
      additionalProperties: false
      properties:
        account:
          $ref: '#/components/schemas/Account'
          description: 账号实体
        attributes:
          $ref: '#/components/schemas/AuthAttributes'
          description: 会话属性
        tokens:
          $ref: '#/components/schemas/AccessToken'
          description: 访问令牌
      required:
        - account
        - tokens
        - attributes
      type: object
    BindEmailInput:
      additionalProperties: false
      properties:
        account_id:
          description: 账号 ID
          type: integer
        action:
          description: 认证绑定动作
          enum:
            - create
            - enable
            - disable
            - replace
          type: string
        domain:
          description: 邮箱域名
          maxLength: 190
          minLength: 1
          nullable: true
          type: string
        username:
          description: 用户名
          maxLength: 64
          minLength: 1
          nullable: true
          type: string
      required:
        - account_id
        - action
      type: object
    BindPasswordInput:
      additionalProperties: false
      properties:
        account_id:
          description: 账号 ID
          type: integer
        action:
          description: 认证绑定动作
          enum:
            - create
            - update
            - enable
            - disable
          type: string
        password:
          description: 密码；仅请求写入，不回显
          nullable: true
          type: string
          writeOnly: true
        username:
          description: 用户名
          maxLength: 254
          minLength: 1
          nullable: true
          type: string
      required:
        - account_id
        - action
      type: object
    BindPhoneInput:
      additionalProperties: false
      properties:
        account_id:
          description: 账号 ID
          type: integer
        action:
          description: 认证绑定动作
          enum:
            - create
            - enable
            - disable
            - replace
          type: string
        code:
          description: 手机号区号，例如 +86
          maxLength: 8
          minLength: 2
          nullable: true
          pattern: ^\+[0-9]{1,4}$
          type: string
        number:
          description: 手机号；只允许数字
          maxLength: 32
          minLength: 1
          nullable: true
          pattern: ^[0-9]{1,32}$
          type: string
      required:
        - account_id
        - action
      type: object
    EventAccountActivated:
      additionalProperties: false
      description: 账号激活或解封
      properties:
        activated_at:
          description: 账号激活时间
          format: date-time
          type: string
        id:
          description: 唯一标识
          type: integer
      required:
        - id
        - activated_at
      type: object
    EventAccountCreated:
      additionalProperties: false
      description: 账号创建
      properties:
        created_at:
          description: 创建时间
          format: date-time
          type: string
        id:
          description: 唯一标识
          type: integer
        number:
          description: 账号编号
          maxLength: 64
          minLength: 4
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        status:
          description: 账号创建后的状态
          enum:
            - pending
            - active
            - suspended
            - deleted
          type: string
      required:
        - id
        - number
        - status
        - created_at
      type: object
    EventAccountDeleted:
      additionalProperties: false
      description: 账号软删
      properties:
        deleted_at:
          description: 软删时间
          format: date-time
          type: string
        id:
          description: 唯一标识
          type: integer
      required:
        - id
        - deleted_at
      type: object
    EventAccountLoginFailed:
      additionalProperties: false
      description: 登录失败
      properties:
        account_id:
          description: 账号 ID；未知账号为 null
          nullable: true
          type: integer
        failed_at:
          description: 登录失败时间
          format: date-time
          type: string
        reason:
          description: 失败或停用原因
          enum:
            - bad_password
            - locked
            - suspended
            - not_found
          type: string
      required:
        - reason
        - failed_at
      type: object
    EventAccountLoginSucceeded:
      additionalProperties: false
      description: 登录成功
      properties:
        attributes:
          additionalProperties:
            type: string
          description: 登录上下文扩展属性；键值均为字符串
          maxProperties: 10
          minProperties: 1
          propertyNames:
            pattern: ^[a-z][a-z0-9_]*$
          type: object
        id:
          description: 唯一标识
          type: integer
        ip:
          description: 客户端 IP
          type: string
        login_at:
          description: 登录时间
          format: date-time
          type: string
        user_agent:
          description: 客户端 User-Agent
          type: string
      required:
        - id
        - login_at
      type: object
    EventAccountReactivated:
      additionalProperties: false
      description: 账号解封
      properties:
        id:
          description: 唯一标识
          type: integer
        reactivated_at:
          description: 账号重新激活时间
          format: date-time
          type: string
      required:
        - id
        - reactivated_at
      type: object
    EventAccountSuspended:
      additionalProperties: false
      description: 账号封禁
      properties:
        id:
          description: 唯一标识
          type: integer
        reason:
          description: 失败或停用原因
          type: string
        suspended_at:
          description: 账号停用时间
          format: date-time
          type: string
      required:
        - id
        - reason
        - suspended_at
      type: object
    EventTokenIssued:
      additionalProperties: false
      description: 令牌签发
      properties:
        account:
          $ref: '#/components/schemas/Account'
          description: 账号实体
        account_id:
          description: 账号 ID
          type: integer
        issued_at:
          description: 签发时间
          format: date-time
          type: string
        token_id:
          description: 令牌 ID
          type: integer
      required:
        - token_id
        - account_id
        - account
        - issued_at
      type: object
    LoginInput:
      additionalProperties: false
      properties:
        auth_type:
          description: 认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        code:
          description: 手机号区号，例如 +86
          maxLength: 8
          minLength: 2
          nullable: true
          pattern: ^\+[0-9]{1,4}$
          type: string
        device_id:
          description: 设备标识
          maxLength: 128
          nullable: true
          type: string
        identifier:
          description: 登录标识
          maxLength: 254
          minLength: 1
          type: string
        password:
          description: 密码；仅请求写入，不回显
          nullable: true
          type: string
          writeOnly: true
      required:
        - auth_type
        - identifier
      type: object
    SendVerificationInput:
      additionalProperties: false
      properties:
        account_id:
          description: 注册时必传（先建 pending account）；其他用途可省略，由服务端按 target 解析
          nullable: true
          type: integer
        auth_type:
          description: 认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        purpose:
          description: 验证码用途
          enum:
            - register
            - login
            - reset_password
            - bind_phone
            - bind_email
            - unbind_phone
            - unbind_email
            - change_phone
            - change_email
            - delete_account
          type: string
        target:
          description: 验证码接收目标
          maxLength: 320
          minLength: 1
          type: string
      required:
        - auth_type
        - target
        - purpose
      type: object
    VerificationResult:
      additionalProperties: false
      properties:
        consumed_at:
          description: 验证码消费时间；未消费为 null
          format: date-time
          nullable: true
          type: string
        verification_id:
          description: 验证记录 ID
          type: integer
        verified:
          description: 是否验证通过
          type: boolean
      required:
        - verified
        - verification_id
      type: object
    VerificationSent:
      additionalProperties: false
      properties:
        expire_at:
          description: 过期时间
          format: date-time
          type: string
        id:
          description: 验证记录 ID
          type: integer
        masked_target:
          description: 脱敏后的接收目标
          type: string
      required:
        - id
        - masked_target
        - expire_at
      type: object
    VerifyCodeInput:
      additionalProperties: false
      properties:
        account_id:
          description: 注册时必传；其他用途可省略
          nullable: true
          type: integer
        auth_type:
          description: 认证类型
          enum:
            - pwd
            - phone
            - email
          type: string
        code:
          description: 验证码
          maxLength: 12
          minLength: 4
          type: string
        purpose:
          description: 验证码用途
          enum:
            - register
            - login
            - reset_password
            - bind_phone
            - bind_email
            - unbind_phone
            - unbind_email
            - change_phone
            - change_email
            - delete_account
          type: string
        target:
          description: 验证码接收目标
          maxLength: 320
          minLength: 1
          type: string
      required:
        - auth_type
        - target
        - purpose
        - code
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: web-seed user API
  version: 0.1.0
openapi: 3.1.0
paths:
  /auth/bind/email:
    post:
      operationId: bindEmail
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindEmailInput'
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAuthBindingResponse'
          description: 成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
          x-error-codes:
            - biz_code: 2005
              code: ACCOUNT_SUSPENDED
        409:
          $ref: '#/components/responses/Conflict'
          x-error-codes:
            - biz_code: 2007
              code: ACCOUNT_ALREADY_DELETED
            - biz_code: 3005
              code: AUTH_EMAIL_TAKEN
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
          x-error-codes:
            - biz_code: 3007
              code: AUTH_EMAIL_INVALID
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/Internal'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        - BearerAuth: []
      summary: 创建、换绑或启停邮箱认证绑定
  /auth/bind/password:
    post:
      operationId: bindPassword
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindPasswordInput'
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAuthBindingResponse'
          description: 成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
          x-error-codes:
            - biz_code: 3001
              code: AUTH_INVALID_CREDENTIALS
        403:
          $ref: '#/components/responses/Forbidden'
          x-error-codes:
            - biz_code: 2005
              code: ACCOUNT_SUSPENDED
        409:
          $ref: '#/components/responses/Conflict'
          x-error-codes:
            - biz_code: 2007
              code: ACCOUNT_ALREADY_DELETED
            - biz_code: 3003
              code: AUTH_USERNAME_TAKEN
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        415:
          $ref: '#/components/responses/UnsupportedMediaType'
        429:
          $ref: '#/components/responses/TooManyRequests'
        500:
          $ref: '#/components/responses/Internal'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        - BearerAuth: []
      summary: 创建、修改或启停密码认证绑定
  /auth/bind/phone:
    post:
      operationId: bindPhone
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindPhoneInput'
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAuthBindingResponse'
          description: 成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
          x-error-codes:
            - biz_code: 2005
              code: ACCOUNT_SUSPENDED
        409:
          $ref: '#/components/responses/Conflict'
          x-error-codes:
            - biz_code: 2007
