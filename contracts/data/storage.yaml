# 存储拓扑单例：引擎、缓存、保留与归档。

id: data.storage
summary: "数据存储约束"
schema_version: 1
stability: draft
do_not:
  - "data.storage.caches 的 prefix 必须含项目命名空间；派生项目必须替换 web-seed 前缀，避免多项目共用一个 Redis 时 key 冲突"

supported_engines: [ postgres ]
supported_cache_engines: [ redis ]
not_supported_topologies: [ sharding, multi-primary, cross-region, outbox ]

tables:
  postgres:
    - { table: data.tables.dictionary, description: "字典表" }
    - { table: data.tables.attachment, description: "附件表" }
    - { table: data.tables.unit, description: "计量单位表" }
    - { table: data.tables.account, description: "账号主表" }
    - { table: data.tables.token, description: "令牌表" }
    - { table: data.tables.auth_pwd, description: "密码认证表" }
    - { table: data.tables.auth_phone, description: "手机号认证表" }
    - { table: data.tables.auth_email, description: "邮箱认证表" }
    - { table: data.tables.verification_body, description: "验证体（一次性验证凭证与消息快照）" }
    - { table: data.tables.verification_action, description: "验证动作（校验请求记录）" }
    - { table: token_archive, description: "令牌冷数据归档；可按 updated_at 回迁热表", archive_of: data.tables.token, promotable: true, on_conflict: overwrite, age_by: updated_at, after_unit: days, after: 180 }
    - { table: verification_body_archive, description: "验证体冷数据归档；只读，不回迁", archive_of: data.tables.verification_body, promotable: false, age_by: created_at, after_unit: days, after: 30 }
    - { table: verification_action_archive, description: "验证动作冷数据归档；只读，不回迁", archive_of: data.tables.verification_action, promotable: false, age_by: created_at, after_unit: days, after: 30 }

caches:
  redis:
    - { prefix: "web-seed:token", key: [ col.access_token_hash ], cache_of: data.tables.token, retention: true, unit: days, cache_ttl: 30 }
    - { prefix: "web-seed:account", key: [ col.id ], cache_of: data.tables.account, retention: true, unit: minutes, cache_ttl: 30 }
