# 数据存储约束（项目级单例）。

id: data.storage
summary: "数据存储约束"
schema_version: 1
stability: draft
do_not:
  - "未列出的引擎与拓扑一律视为不支持，禁止自行引入"
  - "Redis 只作为 caches 中的非权威副本；权威表数据只能落在 supported_engines 中的引擎"
  - "引擎版本/连接池/部署副本/锁/迁移策略属于运行时配置，不要写进本契约"
  - "归档条目用 archive_of 指向原表；归档表只封存原数据，不建 data.tables 契约、实体或查询"

supported_engines: [ mysql, postgres, mongodb ]
not_supported_topologies: [ sharding, multi-primary, cross-region, outbox ]

tables:
  mysql:
    - { table: data.tables.account, description: "账号主表" }
    - { table: data.tables.token, description: "令牌表" }
    - { table: data.tables.auth_pwd, description: "密码认证表" }
    - { table: data.tables.auth_phone, description: "手机号认证表" }
    - { table: data.tables.auth_email, description: "邮箱认证表" }
    - { table: data.tables.verification_body, description: "验证体（一次性验证凭证与消息快照）", retention: true, unit: minutes, ttl: 10 }
    - { table: data.tables.verification_action, description: "验证动作（校验请求记录）" }
  postgres:
    - { table: verification_action_archive, archive_of: data.tables.verification_action, age_by: created_at, after_unit: days, after: 90 }
  mongodb: [ ]

caches:
  redis:
    - { cache_of: data.tables.token, key: [ col.access_token_hash ], retention: true, unit: days, cache_ttl: 30 }
    - { cache_of: data.tables.token, key: [ col.own_type, col.own_id ], retention: true, unit: days, cache_ttl: 30 }
    - { cache_of: data.tables.token, key: [ col.account_id ], retention: true, unit: days, cache_ttl: 30 }
    - { cache_of: data.tables.token, key: [ col.user_id ], retention: true, unit: days, cache_ttl: 30 }
    - { cache_of: data.tables.token, key: [ col.device_id ], retention: true, unit: days, cache_ttl: 30 }
    - { cache_of: data.tables.account, key: [ col.id ], retention: true, unit: minutes, cache_ttl: 30 }
    - { cache_of: data.tables.verification_body, key: [ col.account_id ], retention: true, unit: minutes, cache_ttl: 10 }
