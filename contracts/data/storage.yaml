# 数据存储约束（项目级单例）；只约束落盘，不写运行时配置。

id: data.storage
summary: "数据存储约束"
schema_version: 1
stability: stable
do_not:
  - "未列出的引擎与拓扑一律视为不支持，禁止自行引入"
  - "Redis 不是表存储；表数据只能落在 supported_engines 中的引擎"
  - "引擎版本/连接池/部署副本/锁/迁移策略属于运行时配置，不要写进本契约"

supported_engines: [mysql, postgres, mongodb]

# 每张物理表的存储事实；键是 data.tables.* 契约 ID。
# engine 必须显式声明，且必须在 supported_engines 中；size_class 省略时为 small。
tables:
  data.tables.account:
    engine: mysql
    size_class: large
    retention: { unit: days, pending: 7, soft_delete: 30, hard_delete: 90 }

  data.tables.token:
    engine: mysql
    size_class: large
    retention: { unit: days, ttl: 30 }

  data.tables.auth_pwd:
    engine: mysql
    retention: { unit: days, soft_delete: 30, hard_delete: 90 }

  data.tables.auth_phone:
    engine: mysql
    retention: { unit: days, soft_delete: 30, hard_delete: 90 }

  data.tables.auth_email:
    engine: mysql
    retention: { unit: days, soft_delete: 30, hard_delete: 90 }
