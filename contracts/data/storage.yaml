# 数据存储约束。项目级单例，禁止在 tables/*.yaml 里逐表声明 engine。
#
# 设计决策：
#   - 本文件只约束数据落盘：允许的引擎、每张表的引擎/保留/分区、不支持的拓扑。
#   - 引擎版本、扩展、连接池、迁移工具、部署副本/锁/读写分离属于运行时/部署配置，不写进契约。
#   - 未列出的引擎/拓扑即为不支持；AI 不得自行引入分库分表、多主、跨地域。
#   - Redis 只作为缓存/会话/锁，不作为表存储。

id: data.storage
summary: "数据存储约束"
stability: stable
schema_version: 1
do_not:
  - "禁止在 data/tables/*.yaml 里声明 engine，存储引擎只在本文件定义"
  - "未列出的引擎与拓扑一律视为不支持，禁止自行引入"
  - "Redis 不是表存储；表数据只能落在 supported_engines 中的引擎"
  - "每张物理表必须在本文件 tables 下登记；未登记的表不生成 DDL"
  - "引擎版本/连接池/部署副本/锁/迁移策略属于运行时配置，不要写进本契约"

supported_engines: [mysql, postgres, mongodb]

# 每张物理表的存储事实；键是 data.tables.* 契约 ID。
# engine 必须显式声明，且必须在 supported_engines 中；size_class 省略时为 small。
tables:
  data.tables.account:
    engine: mysql
    size_class: large
    retention: { unit: days, pending: 7, soft_delete: 30, hard_delete: 90 }

  data.tables.token:
    engine: mysql
    size_class: large
    retention: { unit: days, ttl: 30 }

  data.tables.auth_pwd:
    engine: mysql
    retention: { unit: days, soft_delete: 30, hard_delete: 90 }

  data.tables.auth_phone:
    engine: mysql
    retention: { unit: days, soft_delete: 30, hard_delete: 90 }

  data.tables.auth_email:
    engine: mysql
    retention: { unit: days, soft_delete: 30, hard_delete: 90 }
