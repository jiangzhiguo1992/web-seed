# 跨前后端枚举集合。仅收两端都要用的枚举，模块内部枚举不进本文件。

schema_version: 1
id: data.enum.account_status
summary: 跨端枚举集合
stability: stable

enums:
  - name: account_status
    description: 账号状态
    db_type: text
    go_type: AccountStatus
    ts_type: AccountStatus
    values:
      - { value: pending, description: 待激活，不能登录 }
      - { value: active, description: 正常，可登录 }
      - { value: suspended, description: 已封禁，不能登录 }
      - { value: deleted, description: 已软删，终态 }

  - name: audit_action
    description: 审计日志动作
    db_type: text
    go_type: AuditAction
    ts_type: AuditAction
    values:
      - { value: create }
      - { value: update }
      - { value: delete }
      - { value: login }
      - { value: logout }
