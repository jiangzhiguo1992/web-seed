# 跨前后端枚举集合；模块内部枚举不进本文件。

id: data.enums
summary: "跨端枚举集合"
schema_version: 1
stability: draft
do_not:
  - "data.enums 的 value 删除后 code 不得复用；历史数据仍引用旧 code"
  - "data.enums stable 后改名/删除 value 属破坏性变更"

enums:
  - name: account_status
    description: "账号状态"
    go_type: AccountStatus
    ts_type: AccountStatus
    values:
      - { value: pending, code: 0, description: "待激活，不能登录" }
      - { value: active, code: 1, description: "正常，可登录" }
      - { value: suspended, code: 2, description: "已封禁，不能登录" }
      - { value: deleted, code: 3, description: "已软删，终态；与 deleted_at 同步" }
    used_by:
      entities:
        - data.entities.account
      capabilities:
        - cap.services.account

  - name: own_type
    description: "数据归属主体类型"
    go_type: OwnType
    ts_type: OwnType
    values:
      - { value: user, code: 0, description: "用户" }
      - { value: tenant, code: 1, description: "租户" }
      - { value: system, code: 2, description: "系统" }
    used_by:
      entities:
        - data.entities.account
        - data.entities.token
      capabilities:
        - cap.services.account

  - name: auth_status
    description: "认证记录状态"
    go_type: AuthStatus
    ts_type: AuthStatus
    values:
      - { value: active, code: 0, description: "可认证" }
      - { value: disabled, code: 1, description: "已停用" }
    used_by:
      entities:
        - data.entities.auth_email
        - data.entities.auth_phone
        - data.entities.auth_pwd
      capabilities: []

  - name: token_status
    description: "令牌状态"
    go_type: TokenStatus
    ts_type: TokenStatus
    values:
      - { value: active, code: 0, description: "有效" }
      - { value: revoked, code: 1, description: "已吊销" }
      - { value: expired, code: 2, description: "已过期" }
    used_by:
      entities:
        - data.entities.token
      capabilities: []

  - name: auth_type
    description: "认证方式；仅 API 输入，无 entity"
    go_type: AuthType
    ts_type: AuthType
    values:
      - { value: pwd, code: 0, description: "密码认证" }
      - { value: phone, code: 1, description: "手机号认证" }
      - { value: email, code: 2, description: "邮箱认证" }
    used_by:
      entities: []
      capabilities:
        - cap.services.auth

  - name: audit_action
    description: "审计日志动作；暂无 entity/capability 使用"
    go_type: AuditAction
    ts_type: AuditAction
    values:
      - { value: create, code: 0 }
      - { value: update, code: 1 }
      - { value: delete, code: 2 }
      - { value: login, code: 3 }
      - { value: logout, code: 4 }
    used_by:
      entities: []
      capabilities: []
