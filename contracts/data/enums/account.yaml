# 账号域跨端枚举集合。

id: data.enums.account
summary: "账号域跨端枚举集合"
owner_module: account
schema_version: 1
stability: draft
do_not: []

enums:
  - name: account_status
    description: "账号状态"
    go_type: AccountStatus
    ts_type: AccountStatus
    values:
      - { value: pending, code: 0, description: "待激活，不能登录" }
      - { value: active, code: 1, description: "正常，可登录" }
      - { value: suspended, code: 2, description: "已封禁，不能登录" }
      - { value: deleted, code: 3, description: "已软删，终态；与 deleted_at 同步" }
    used_by:
      - data.entities.account
      - cap.protocols.http.account.list
      - cap.services.account.activate
      - cap.services.account.create
      - cap.services.account.delete
      - cap.services.account.list
      - cap.services.account.suspend
      - cap.events.account.created

  - name: auth_status
    description: "认证记录状态"
    go_type: AuthStatus
    ts_type: AuthStatus
    values:
      - { value: unverified, code: 0, description: "未认证" }
      - { value: verified, code: 1, description: "已认证" }
      - { value: disabled, code: 2, description: "已停用" }
    used_by:
      - data.entities.auth_email
      - data.entities.auth_phone
      - data.entities.auth_pwd
      - cap.protocols.http.auth.bind_email
      - cap.protocols.http.auth.bind_password
      - cap.protocols.http.auth.bind_phone
      - cap.services.auth.bind_email
      - cap.services.auth.bind_password
      - cap.services.auth.bind_phone
      - cap.services.auth.login
      - cap.services.verification.verify

  - name: token_status
    description: "令牌状态"
    go_type: TokenStatus
    ts_type: TokenStatus
    values:
      - { value: active, code: 0, description: "有效" }
      - { value: revoked, code: 1, description: "已吊销" }
      - { value: expired, code: 2, description: "已过期" }
    used_by:
      - cap.services.token.expire
      - data.entities.token

  - name: token_revoke_reason
    description: "令牌吊销原因"
    go_type: TokenRevokeReason
    ts_type: TokenRevokeReason
    values:
      - { value: rotated, code: 0, description: "正常轮换" }
      - { value: reused, code: 1, description: "复用检测触发" }
      - { value: logout, code: 2, description: "登出" }
      - { value: admin, code: 3, description: "管理员吊销" }
      - { value: password_change, code: 4, description: "密码变更" }
      - { value: phone_change, code: 5, description: "手机变更" }
      - { value: email_change, code: 6, description: "邮箱变更" }
    used_by:
      - data.entities.token
      - cap.services.token.logout
      - cap.services.token.refresh
      - cap.services.token.revoke_by_account

  - name: auth_type
    description: "认证方式"
    go_type: AuthType
    ts_type: AuthType
    values:
      - { value: pwd, code: 0, description: "密码认证" }
      - { value: phone, code: 1, description: "手机号认证" }
      - { value: email, code: 2, description: "邮箱认证" }
    used_by:
      - data.entities.verification_body
      - cap.protocols.http.auth.bind_email
      - cap.protocols.http.auth.bind_password
      - cap.protocols.http.auth.bind_phone
      - cap.protocols.http.auth.login
      - cap.protocols.http.auth.verification_send
      - cap.protocols.http.auth.verification_verify
      - cap.services.auth.bind_email
      - cap.services.auth.bind_password
      - cap.services.auth.bind_phone
      - cap.services.auth.login
      - cap.services.verification.revoke_by_auth
      - cap.services.verification.send
      - cap.services.verification.verify

  - name: verification_status
    description: "验证体状态"
    go_type: VerificationStatus
    ts_type: VerificationStatus
    values:
      - { value: pending, code: 0, description: "待发送" }
      - { value: sent, code: 1, description: "已发送，待验证" }
      - { value: consumed, code: 2, description: "已消费，终态" }
      - { value: expired, code: 3, description: "已过期，终态" }
      - { value: revoked, code: 4, description: "已作废，终态" }
      - { value: failed, code: 5, description: "发送失败，终态" }
    used_by:
      - cap.services.verification.cleanup
      - cap.services.verification.revoke_by_account
      - cap.services.verification.revoke_by_auth
      - cap.services.verification.send
      - cap.services.verification.verify
      - data.entities.verification_body

  - name: verification_purpose
    description: "验证用途"
    go_type: VerificationPurpose
    ts_type: VerificationPurpose
    values:
      - { value: register, code: 0, description: "注册" }
      - { value: login, code: 1, description: "登录" }
      - { value: reset_password, code: 2, description: "重置密码" }
      - { value: bind_phone, code: 3, description: "绑定手机号" }
      - { value: bind_email, code: 4, description: "绑定邮箱" }
      - { value: unbind_phone, code: 5, description: "解绑手机号" }
      - { value: unbind_email, code: 6, description: "解绑邮箱" }
      - { value: change_phone, code: 7, description: "换绑手机号" }
      - { value: change_email, code: 8, description: "换绑邮箱" }
      - { value: delete_account, code: 9, description: "注销账号" }
    used_by:
      - data.entities.verification_body
      - cap.protocols.http.auth.verification_send
      - cap.protocols.http.auth.verification_verify
      - cap.services.verification.revoke_by_auth
      - cap.services.verification.send
      - cap.services.verification.verify

  - name: verification_result
    description: "验证动作结果"
    go_type: VerificationResult
    ts_type: VerificationResult
    values:
      - { value: success, code: 1, description: "验证码校验通过" }
      - { value: mismatch, code: 2, description: "验证码不匹配" }
      - { value: expired, code: 3, description: "验证码已过期" }
      - { value: attempts_exceeded, code: 4, description: "失败次数超过上限" }
      - { value: invalid, code: 5, description: "验证体状态非法：已消费、已作废或已过期" }
    used_by:
      - cap.services.verification.record_failure
      - cap.services.verification.verify
      - data.entities.verification_action

  - name: auth_bind_action
    description: "认证绑定动作（手机/邮箱）"
    go_type: AuthBindAction
    ts_type: AuthBindAction
    values:
      - { value: create, code: 0, description: "创建绑定" }
      - { value: enable, code: 1, description: "启用绑定" }
      - { value: disable, code: 2, description: "停用绑定" }
      - { value: replace, code: 3, description: "换绑到新的手机号或邮箱" }
    used_by:
      - cap.protocols.http.auth.bind_email
      - cap.protocols.http.auth.bind_phone
      - cap.services.auth.bind_email
      - cap.services.auth.bind_phone

  - name: auth_password_action
    description: "密码认证绑定动作"
    go_type: AuthPasswordAction
    ts_type: AuthPasswordAction
    values:
      - { value: create, code: 0, description: "创建密码" }
      - { value: update, code: 1, description: "修改密码" }
      - { value: enable, code: 2, description: "启用密码" }
      - { value: disable, code: 3, description: "停用密码" }
    used_by:
      - cap.protocols.http.auth.bind_password
      - cap.services.auth.bind_password

  - name: login_failed_reason
    description: "登录失败原因"
    go_type: LoginFailedReason
    ts_type: LoginFailedReason
    values:
      - { value: bad_password, code: 0, description: "密码错误" }
      - { value: locked, code: 1, description: "账号锁定" }
      - { value: suspended, code: 2, description: "账号封禁" }
      - { value: not_found, code: 3, description: "账号不存在" }
    used_by:
      - cap.services.auth.login
      - cap.services.auth.record_login_failure
      - cap.events.account.login_failed
