# 账号主表。账号是业务主体，不承载密码、手机号、邮箱、令牌；认证信息在 auth_* / tokens。

schema_version: 1
id: data.tables.account
summary: 账号主表
stability: stable
owner_module: accounts
extends: [data.tables.base]
do_not:
  - 认证信息（密码/手机号/邮箱/令牌）禁止写入本表
  - number 唯一索引必须带 WHERE deleted_at IS NULL
  - status 只能引用 data.enums.account_status
  - own_type/own_id 表示数据归属，user_id 表示关联用户；不要把 user_id 当作 own_id 的别名
  - 只有 owner_module 对应的 cap.services/cap.async 可以写本表，其他模块只能经 service 读
  - used_by 由 make gen-graph 生成，禁止手改

table:
  name: accounts
  comment: 账号（业务主体）
  size_class: large
  retention: { pending_days: 7, soft_delete_days: 30, hard_delete_days: 90 }

columns:
  - name: own_type
    type: text
    nullable: false
    min_length: 1
    max_length: 32
    comment: 归属类型（user/tenant/system；跨模块共享时升级为枚举）

  - name: own_id
    type: uuid
    nullable: false
    comment: 归属 ID；与 own_type 组成归属主体

  - name: number
    type: text
    nullable: false
    min_length: 4
    max_length: 64
    pattern: "^[A-Za-z0-9_-]+$"
    normalize: upper
    comment: 账号编号；业务唯一；存储前大写归一

  - name: nickname
    type: text
    nullable: false
    min_length: 1
    max_length: 100
    pii: true
    comment: 昵称

  - name: user_id
    type: uuid
    nullable: true
    comment: 关联用户 ID；user 模块落地后补外键

  - name: status
    type: data.enums.account_status
    nullable: false
    default: pending
    comment: 账号状态

  - name: version
    type: integer
    nullable: false
    min: 1
    default: 1
    comment: 乐观锁；非业务字段

constraints:
  - name: ck_accounts_status
    type: enum
    column: status
    enum: data.enums.account_status

  - name: ck_accounts_deleted_consistent
    type: check
    expr: "(status = 'deleted') = (deleted_at IS NOT NULL)"

indexes:
  - name: uq_accounts_number
    columns: [number]
    unique: true
    where: "deleted_at IS NULL"
    reason: 账号编号在未删除账号内唯一

  - name: idx_accounts_own_type_own_id
    columns: [own_type, own_id]
    where: "deleted_at IS NULL"
    reason: 按归属主体查询

  - name: idx_accounts_user_id
    columns: [user_id]
    where: "deleted_at IS NULL AND user_id IS NOT NULL"
    reason: 按用户反查账号

  - name: idx_accounts_created_at_id
    columns: [created_at, id]
    order: [desc, desc]
    where: "deleted_at IS NULL"
    reason: 列表游标分页

used_by:
  entities: [data.entities.account]
  queries: [data.queries.account]
  capabilities: [cap.services.accounts, cap.services.auth]
