# 账号主表。账号是业务主体，认证信息在 auth_* / tokens。

schema_version: 1
id: data.tables.account
summary: "账号主表"
stability: stable
owner_module: accounts
extends: [ data.tables.base ]
do_not:
  - "account 表禁止写入密码/手机号/邮箱/令牌；这些在 auth_* / token 表"
  - "account.status 使用 integer；具体枚举只在 entity 定义"
  - "own_type/own_id 表示数据归属，user_id 表示关联用户；不要把 user_id 当作 own_id 的别名"
  - "own_type/own_id/user_id 是冗余 source；token 的 copy 必须 ref 到这里"

table:
  name: accounts
  comment: "账号（业务主体）"
  size_class: large
  retention: { unit: days, pending: 7, soft_delete: 30, hard_delete: 90 }

columns:
  - name: own_type
    type: string
    nullable: false
    min_len: 1
    max_len: 32
    redundancy: { group: account_own_type, role: source }
    comment: "归属类型（user/tenant/system；跨模块共享时升级为枚举）"

  - name: own_id
    type: string
    max_len: 36
    nullable: false
    redundancy: { group: account_own_id, role: source }
    comment: "归属 ID；与 own_type 组成归属主体"

  - name: number
    type: string
    nullable: false
    min_len: 4
    max_len: 64
    pattern: "^[A-Za-z0-9_-]+$"
    normalize: upper
    comment: "账号编号；业务唯一；存储前大写归一"

  - name: nickname
    type: string
    nullable: false
    min_len: 1
    max_len: 100
    pii: true
    comment: "昵称"

  - name: user_id
    type: string
    max_len: 36
    nullable: true
    redundancy: { group: account_user_id, role: source }
    comment: "关联用户 ID；不做数据库外键"

  - name: version
    type: integer
    nullable: false
    min: 1
    default: 1
    comment: "乐观锁；非业务字段"

constraints:
  - name: ck_accounts_deleted_consistent
    type: check
    expr: "(status = 3) = (deleted_at IS NOT NULL)"

indexes:
  - name: uq_accounts_number
    columns: [ number ]
    unique: true
    where: "deleted_at IS NULL"
    used_by:
      - data.queries.account.get_account_by_number
      - data.queries.account.exists_account_number
      - data.queries.account.create_account
    reason: "账号编号在未删除账号内唯一"

  - name: idx_accounts_own_type_own_id
    columns: [ own_type, own_id ]
    where: "deleted_at IS NULL"
    used_by: [ data.queries.account.list_accounts ]
    reason: "按归属主体查询"

  - name: idx_accounts_created_at_id
    columns: [ created_at, id ]
    order: [ desc, desc ]
    where: "deleted_at IS NULL"
    used_by:
      - data.queries.account.list_accounts
      - data.queries.account.list_stale_pending_accounts
    reason: "列表游标分页"

used_by:
  entities: [ data.entities.account ]
  queries:
    - data.queries.account.get_account
    - data.queries.account.get_account_by_number
    - data.queries.account.exists_account_number
    - data.queries.account.list_accounts
    - data.queries.account.create_account
    - data.queries.account.update_account
    - data.queries.account.set_account_status
    - data.queries.account.soft_delete_account
    - data.queries.account.list_stale_pending_accounts
    - data.queries.account.soft_delete_stale_pending_accounts
