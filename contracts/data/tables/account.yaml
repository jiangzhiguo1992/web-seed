# 账号主表。

id: data.tables.account
summary: "账号主表"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "account 表禁止写入密码/手机号/邮箱/令牌；这些在 auth_* / token 表"
  - "own_type/own_id 表示数据归属，user_id 表示关联用户；不要把 user_id 当作 own_id 的别名"

table:
  name: account
  comment: "账号（业务主体）"
  extends:
    - data.tables.base
  entities:
    - data.entities.account
  queries:
    - data.queries.account.create_account
    - data.queries.account.exists_account_number
    - data.queries.account.get_account
    - data.queries.account.list_accounts
    - data.queries.account.set_account_status
    - data.queries.account.soft_delete_account
    - data.queries.account.update_account

columns:
  - name: own_type
    type: integer
    nullable: false
    redundancy:
      - { column: data.tables.account.col.own_type, source: true }
      - { column: data.tables.token.col.own_type, source: false }
    comment: "归属类型整数码；映射 data.enums.own_type"

  - name: own_id
    type: integer
    nullable: false
    redundancy:
      - { column: data.tables.account.col.own_id, source: true }
      - { column: data.tables.token.col.own_id, source: false }
    comment: "归属 ID；与 own_type 组成归属主体"

  - name: number
    type: account_number
    nullable: false
    comment: "账号编号"

  - name: nickname
    type: account_nickname
    nullable: false
    sensitivity: pii
    comment: "昵称"

  - name: user_id
    type: integer
    nullable: true
    redundancy:
      - { column: data.tables.account.col.user_id, source: true }
      - { column: data.tables.token.col.user_id, source: false }
    comment: "关联用户 ID；不做数据库外键"

constraints:
  - name: ck_account_deleted_consistent
    expr: "(status = 3) = (deleted_at IS NOT NULL)"
    on_violation: platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    used_by:
      - data.queries.account.create_account
      - data.queries.account.set_account_status
      - data.queries.account.soft_delete_account

indexes:
  - name: uq_account_number
    columns: [ number ]
    unique: true
    live_only: true
    comment: "账号编号在未删除账号内唯一"
    used_by:
      - data.queries.account.exists_account_number
      - data.queries.account.create_account

  - name: idx_account_own_type_own_id
    columns: [ own_type, own_id ]
    live_only: true
    comment: "按归属主体查询"
    used_by:
      - data.queries.account.list_accounts

  - name: idx_account_created_at_id
    columns: [ created_at, id ]
    live_only: true
    comment: "列表游标分页"
    used_by:
      - data.queries.account.list_accounts
