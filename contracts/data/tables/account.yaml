# 账号主表。账号是业务主体，认证信息在 auth_* / token。

id: data.tables.account
summary: "账号主表"
owner_module: account
schema_version: 1
stability: stable
do_not:
  - "account 表禁止写入密码/手机号/邮箱/令牌；这些在 auth_* / token 表"
  - "account.status 使用 integer；具体枚举只在 entity 定义"
  - "own_type/own_id 表示数据归属，user_id 表示关联用户；不要把 user_id 当作 own_id 的别名"
  - "own_type/own_id/user_id 是冗余组 source；source/copies 在 data/redundancy.yaml 的 groups 登记"

table:
  name: account
  comment: "账号（业务主体）"
  extends:
    - data.tables.base
  entities:
    - data.entities.account

columns:
  - name: own_type
    type: integer
    nullable: false
    redundancy: account_own_type
    comment: "归属类型整数码；映射 data.enums.own_type"

  - name: own_id
    type: integer
    nullable: false
    redundancy: account_own_id
    comment: "归属 ID；与 own_type 组成归属主体"

  - name: number
    type: string
    nullable: false
    min_len: 4
    max_len: 64
    pattern: "^[A-Za-z0-9_-]+$"
    normalize: upper
    comment: "账号编号；业务唯一；存储前大写归一"

  - name: nickname
    type: string
    nullable: false
    min_len: 1
    max_len: 100
    sensitivity: pii
    comment: "昵称"

  - name: user_id
    type: integer
    nullable: true
    redundancy: account_user_id
    comment: "关联用户 ID；不做数据库外键"

  - name: version
    type: integer
    nullable: false
    default: 1
    min: 1
    comment: "乐观锁；非业务字段"

constraints:
  - name: ck_account_deleted_consistent
    type: check
    expr: "(status = 3) = (deleted_at IS NOT NULL)"

indexes:
  - name: uq_account_number
    columns: [ number ]
    unique: true
    live_only: true
    comment: "账号编号在未删除账号内唯一"
    used_by:
      - data.queries.account.get_account_by_number
      - data.queries.account.exists_account_number
      - data.queries.account.create_account

  - name: idx_account_own_type_own_id
    columns: [ own_type, own_id ]
    live_only: true
    comment: "按归属主体查询"
    used_by:
      - data.queries.account.list_accounts

  - name: idx_account_created_at_id
    columns: [ created_at, id ]
    live_only: true
    comment: "列表游标分页"
    used_by:
      - data.queries.account.list_accounts
      - data.queries.account.list_stale_pending_accounts

used_by:
  queries:
    - data.queries.account.create_account
    - data.queries.account.exists_account_number
    - data.queries.account.get_account
    - data.queries.account.get_account_by_number
    - data.queries.account.list_accounts
    - data.queries.account.list_stale_pending_accounts
    - data.queries.account.set_account_status
    - data.queries.account.soft_delete_account
    - data.queries.account.soft_delete_stale_pending_accounts
    - data.queries.account.update_account
