# 账号主表。

id: data.tables.account
summary: "账号主表"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "account 表禁止写入密码/手机号/邮箱/令牌；这些在 auth_* / token 表"
  - "account.number 是永久身份；软删后也不可复用，唯一性查询不得过滤 deleted_at"

table:
  name: account
  extends:
    - data.tables.base
  entities:
    - data.entities.account
  references: []
  referenced_by:
    - data.tables.token.col.account_id
    - data.tables.auth_pwd.col.account_id
    - data.tables.auth_phone.col.account_id
    - data.tables.auth_email.col.account_id
    - data.tables.verification_body.col.account_id
    - data.tables.verification_action.col.account_id
  queries:
    - data.queries.account.create_account
    - data.queries.account.exists_account_number
    - data.queries.account.get_account
    - data.queries.account.list_accounts
    - data.queries.account.set_account_status
    - data.queries.account.soft_delete_account
    - data.queries.account.update_account

columns:
  - name: number
    type: _types.basics.account_number
    nullable: false
    comment: "账号编号"

  - name: nickname
    type: _types.basics.account_nickname
    nullable: false
    sensitivity: pii
    comment: "昵称"

  - name: user_id
    type: _types.basics.id
    nullable: true
    redundancy:
      - { column: data.tables.account.col.user_id, source: true }
      - { column: data.tables.token.col.user_id, source: false }
    comment: "关联用户 ID；不做数据库外键"

constraints:
  - name: ck_account_deleted_consistent
    expr: "(status = 3) = (deleted_at IS NOT NULL)"
    on_violation: platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    used_by:
      - data.queries.account.create_account
      - data.queries.account.set_account_status
      - data.queries.account.soft_delete_account

indexes:
  - name: uq_account_number
    columns: [ number ]
    unique: true
    comment: "账号编号全局唯一；软删后不释放"
    used_by:
      - data.queries.account.exists_account_number
      - data.queries.account.create_account

  - name: idx_account_created_at_id
    columns: [ deleted_at, created_at, id ]
    comment: "列表游标分页"
    used_by:
      - data.queries.account.list_accounts
