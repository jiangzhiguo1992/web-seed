# 验证体表：一次性验证凭证与短信/邮件消息快照。

id: data.tables.verification_body
summary: "验证体（一次性验证凭证与消息快照）"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "verification_body.auth_id 必须与 auth_type 指向同一种绑定（phone→auth_phone、email→auth_email），不建数据库外键"
  - "verification_body.code_hash 只存哈希，不存验证码原文；content 若含原文必须按 secret 管理"
  - "verification_body.content 默认存脱敏正文；仅审计必要时写原文"
  - "verification_body.auth_type 只允许 phone/email；pwd 不是可发送验证消息的渠道"
  - "verification_body 不存 target 地址原文；发送时按 auth_id 读取绑定记录"
  - "Redis 缓存只允许 id/status/account_id/auth_type/auth_id/purpose/expire_at 等非秘密字段，禁止缓存 code_hash/content"
  - "status=consumed 时必须同时写 consumed_at"
  - "注册必须先创建 pending account 再发验证码；verification_body 不早于 account 存在"

table:
  name: verification_body
  extends:
    - data.tables.base
  entities:
    - data.entities.verification_body
  referenced_by: [ ]
  queries:
    - data.queries.verification.consume_verification
    - data.queries.verification.create_verification
    - data.queries.verification.expire_stale_verifications
    - data.queries.verification.get_latest_verification
    - data.queries.verification.increment_verification_attempt
    - data.queries.verification.mark_verification_sent
    - data.queries.verification.revoke_active_verifications_by_account
    - data.queries.verification.revoke_active_verifications_by_auth
    - data.queries.verification.revoke_exhausted_verifications
    - data.queries.verification.set_verification_status

columns:
  - name: account_id
    type: integer
    nullable: false
    references: { column: data.tables.account.col.id, on_delete: cascade }
    comment: "账号 ID；验证体不早于 account 存在，不建数据库外键"

  - name: auth_type
    type: integer
    nullable: false
    comment: "认证方式整数码；映射 data.enums.auth_type；只允许 phone/email"

  - name: auth_id
    type: integer
    nullable: false
    comment: "认证绑定 ID；auth_type=phone 指向 auth_phone，auth_type=email 指向 auth_email；不建外键"

  - name: purpose
    type: integer
    nullable: false
    comment: "验证用途整数码；映射 data.enums.verification_purpose，例如注册/登录/重置密码"

  - name: code_hash
    type: string
    nullable: false
    min_len: 32
    max_len: 128
    sensitivity: secret
    comment: "验证码/令牌哈希；不存原文"

  - name: content
    type: string
    nullable: true
    max_len: 4096
    sensitivity: secret
    comment: "发送正文快照；可能含验证码原文，按 secret 管理，禁止进入日志/响应/事件"

  - name: sent_at
    type: timestamp
    nullable: true
    comment: "实际发送时间；发送失败为空"

  - name: expire_at
    type: timestamp
    nullable: false
    comment: "验证码过期时间；必须晚于 created_at"

  - name: consumed_at
    type: timestamp
    nullable: true
    comment: "验证通过/消费时间；为空表示未使用"

  - name: attempt_count
    type: integer
    nullable: false
    default: 0
    min: 0
    comment: "校验失败次数；达到上限后作废"

constraints:
  - name: ck_verification_auth_type
    expr: "auth_type IN (1, 2)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.verification.create_verification

  - name: ck_verification_purpose_auth_type
    expr: "(purpose IN (3, 5, 7) AND auth_type = 1) OR (purpose IN (4, 6, 8) AND auth_type = 2) OR purpose IN (0, 1, 2, 9)"
    on_violation: platform.errors.AUTH_VERIFICATION_TARGET_INVALID
    used_by:
      - data.queries.verification.create_verification

  - name: ck_verification_status
    expr: "status IN (0, 1, 2, 3, 4, 5)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.verification.create_verification
      - data.queries.verification.mark_verification_sent
      - data.queries.verification.consume_verification
      - data.queries.verification.increment_verification_attempt
      - data.queries.verification.expire_stale_verifications
      - data.queries.verification.revoke_exhausted_verifications
      - data.queries.verification.set_verification_status
      - data.queries.verification.revoke_active_verifications_by_auth
      - data.queries.verification.revoke_active_verifications_by_account

  - name: ck_verification_expire_order
    expr: "expire_at > created_at"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.verification.create_verification

  - name: ck_verification_sent_order
    expr: "sent_at IS NULL OR (sent_at >= created_at AND sent_at < expire_at)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.verification.mark_verification_sent

  - name: ck_verification_consumed_order
    expr: "consumed_at IS NULL OR (consumed_at >= created_at AND consumed_at <= expire_at AND (sent_at IS NULL OR consumed_at >= sent_at))"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.verification.consume_verification

  - name: ck_verification_consumed_status
    expr: "(status = 2) = (consumed_at IS NOT NULL)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.verification.consume_verification

indexes:
  - name: idx_verification_auth_purpose
    columns: [ auth_type, auth_id, purpose, created_at ]
    comment: "按认证绑定与用途查最新验证码、重发作废"
    used_by:
      - data.queries.verification.get_latest_verification
      - data.queries.verification.revoke_active_verifications_by_auth

  - name: idx_verification_account_id
    columns: [ account_id ]
    comment: "账号软删时作废该账号未消费的验证体"
    used_by:
      - data.queries.verification.revoke_active_verifications_by_account

  - name: idx_verification_expire_at
    columns: [ expire_at ]
    comment: "清理过期验证体"
    used_by:
      - data.queries.verification.expire_stale_verifications

  - name: idx_verification_status_attempt
    columns: [ status, attempt_count ]
    comment: "作废尝试次数超限的验证体"
    used_by:
      - data.queries.verification.revoke_exhausted_verifications
