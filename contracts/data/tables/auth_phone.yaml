# 手机号认证表。一个账号只能绑定一个手机号；只允许认证模块读写。

schema_version: 1
id: data.tables.auth_phone
summary: "手机号认证表"
stability: stable
owner_module: auth
extends: [ data.tables.base ]
do_not:

table:
  comment: "手机号认证"
  size_class: small
  retention: { unit: days, soft_delete: 30, hard_delete: 90 }

columns:
  - name: account_id
    type: string
    max_len: 36
    nullable: false
    comment: "关联账号"

  - name: code
    type: string
    nullable: false
    min_len: 2
    max_len: 8
    pattern: "^\\+[0-9]{1,4}$"
    comment: "国际区号，例如 +86"

  - name: number
    type: string
    nullable: false
    min_len: 1
    max_len: 32
    pii: true
    comment: "手机号"

  - name: operator
    type: string
    nullable: true
    max_len: 32
    comment: "运营商"

indexes:
  - name: uq_auth_phone_number
    columns: [ code, number ]
    unique: true
    where: "deleted_at IS NULL"
    used_by:
      - data.queries.auth.get_auth_phone_by_number
      - data.queries.auth.create_auth_phone
    reason: "手机号在未删除记录内唯一"

used_by:
  entities: [ data.entities.auth_phone ]
  queries:
    - data.queries.auth.get_auth_phone_by_number
    - data.queries.auth.create_auth_phone
  capabilities: [ cap.services.auth ]
