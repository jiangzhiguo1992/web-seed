# 手机号认证表。

id: data.tables.auth_phone
summary: "手机号认证表"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "软删时必须同时把 account_id 置 NULL；ck_auth_phone_account_live 会拒绝未置空的行"

table:
  name: auth_phone
  extends:
    - data.tables.base
  entities:
    - data.entities.auth_phone
  references:
    - data.tables.account.col.id
  referenced_by: [ ]
  queries:
    - data.queries.auth.create_auth_phone
    - data.queries.auth.get_auth_phone_by_id
    - data.queries.auth.get_auth_phone_by_number
    - data.queries.auth.set_auth_phone_status
    - data.queries.auth.soft_delete_auth_phone_by_account

columns:
  - name: account_id
    type: _types.basics.id
    nullable: true
    references: { column: data.tables.account.col.id, on_delete: cascade }
    comment: "关联账号"

  - name: code
    type: _types.basics.phone_code
    nullable: false
    comment: "国际区号，例如 +86"

  - name: number
    type: _types.basics.phone_number
    nullable: false
    sensitivity: pii
    comment: "手机号；只允许数字，与 code 拼成 E.164 快照"

  - name: operator
    type: _types.basics.string
    nullable: true
    max_len: 32
    comment: "运营商"

constraints:
  - name: ck_auth_phone_status
    expr: "status IN (0, 1, 2)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.auth.create_auth_phone
      - data.queries.auth.set_auth_phone_status

  - name: ck_auth_phone_account_live
    expr: "(deleted_at IS NULL) = (account_id IS NOT NULL)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.auth.create_auth_phone
      - data.queries.auth.soft_delete_auth_phone_by_account

indexes:
  - name: uq_auth_phone_number
    columns: [ code, number ]
    unique: true
    comment: "手机号全局唯一；软删后不释放"
    used_by:
      - data.queries.auth.get_auth_phone_by_number
      - data.queries.auth.create_auth_phone

  - name: uq_auth_phone_account
    columns: [ account_id ]
    unique: true
    comment: "账号绑定全局唯一；软删行 account_id 置 NULL 后释放"
    used_by:
      - data.queries.auth.create_auth_phone
      - data.queries.auth.soft_delete_auth_phone_by_account
