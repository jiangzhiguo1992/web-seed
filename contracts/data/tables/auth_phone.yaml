# 手机号认证表。一个账号只能绑定一个手机号；只允许认证模块读写。

id: data.tables.auth_phone
summary: "手机号认证表"
owner_module: auth
schema_version: 1
stability: stable
do_not:

table:
  comment: "手机号认证"
  extends:
    - data.tables.base

  entities:
    - data.entities.auth_phone

columns:
  - name: account_id
    type: integer
    nullable: false
    comment: "关联账号"

  - name: code
    type: string
    nullable: false
    min_len: 2
    max_len: 8
    pattern: "^\\+[0-9]{1,4}$"
    comment: "国际区号，例如 +86"

  - name: number
    type: string
    nullable: false
    min_len: 1
    max_len: 32
    sensitivity: pii
    comment: "手机号"

  - name: operator
    type: string
    nullable: true
    max_len: 32
    comment: "运营商"

indexes:
  - name: uq_auth_phone_number
    columns: [ code, number ]
    unique: true
    live_only: true
    comment: "手机号在未删除记录内唯一"
    used_by:
      - data.queries.auth.get_auth_phone_by_number
      - data.queries.auth.create_auth_phone

used_by:
  queries:
    - data.queries.auth.create_auth_phone
    - data.queries.auth.get_auth_phone_by_number
