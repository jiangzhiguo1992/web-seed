# 手机号认证表。

id: data.tables.auth_phone
summary: "手机号认证表"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "auth_phone 同一账号只能绑定一个未删除的手机号"
  - "uq_auth_phone_number 不区分 status；未认证/停用绑定仍占用手机号，换绑前先软删旧记录"

table:
  name: auth_phone
  extends:
    - data.tables.base
  entities:
    - data.entities.auth_phone
  referenced_by: [ ]
  queries:
    - data.queries.auth.create_auth_phone
    - data.queries.auth.get_auth_phone_by_number
    - data.queries.auth.set_auth_phone_status
    - data.queries.auth.soft_delete_auth_phone_by_account

columns:
  - name: account_id
    type: integer
    nullable: false
    references: { column: data.tables.account.col.id, on_delete: cascade }
    comment: "关联账号"

  - name: code
    type: phone_code
    nullable: false
    comment: "国际区号，例如 +86"

  - name: number
    type: phone_number
    nullable: false
    sensitivity: pii
    comment: "手机号；只允许数字，与 code 拼成 E.164 快照"

  - name: operator
    type: string
    nullable: true
    max_len: 32
    comment: "运营商"

constraints:
  - name: ck_auth_phone_status
    expr: "status IN (0, 1, 2)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.auth.create_auth_phone
      - data.queries.auth.set_auth_phone_status

indexes:
  - name: uq_auth_phone_number
    columns: [ code, number ]
    unique: true
    live_only: true
    comment: "手机号在未删除记录内唯一"
    used_by:
      - data.queries.auth.get_auth_phone_by_number
      - data.queries.auth.create_auth_phone

  - name: uq_auth_phone_account
    columns: [ account_id ]
    unique: true
    live_only: true
    comment: "账号绑定唯一性"
    used_by:
      - data.queries.auth.create_auth_phone
      - data.queries.auth.soft_delete_auth_phone_by_account
