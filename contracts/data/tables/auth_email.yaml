# 邮箱认证表。邮箱拆分为 username/domain/entity/tld，便于检索与域名聚合。
# 一个账号可绑定多个邮箱；只允许认证模块读写。

schema_version: 1
id: data.tables.auth_email
summary: 邮箱认证表
stability: stable
owner_module: auth
extends: [data.tables.base]
do_not:
  - (username, domain) 唯一索引必须带 WHERE deleted_at IS NULL
  - domain 必须小写归一后再存储
  - 只有 owner_module 对应的 cap.services/cap.async 可以写本表，其他模块只能经 service 读
  - used_by 由 make gen-graph 生成，禁止手改

table:
  comment: 邮箱认证
  size_class: small
  retention: { soft_delete_days: 30, hard_delete_days: 90 }

columns:
  - name: account_id
    type: uuid
    nullable: false
    comment: 关联账号

  - name: username
    type: text
    nullable: false
    min_length: 1
    max_length: 64
    pii: true
    comment: 邮箱 @ 前的本地部分

  - name: domain
    type: text
    nullable: false
    min_length: 1
    max_length: 190
    comment: 完整域名，例如 example.com；小写归一

  - name: entity
    type: text
    nullable: true
    max_length: 190
    comment: 注册域/二级域，例如 example.com

  - name: tld
    type: text
    nullable: true
    max_length: 32
    comment: 顶级域，例如 com

  - name: status
    type: data.enums.auth_status
    nullable: false
    default: active
    comment: 认证记录状态

constraints:
  - name: fk_auth_email_account
    type: foreign_key
    columns: [account_id]
    references: data.tables.account.col.id
    on_delete: cascade
    on_update: no_action

  - name: ck_auth_email_domain_lowercase
    type: check
    expr: "domain = lower(domain)"

  - name: ck_auth_email_status
    type: enum
    column: status
    enum: data.enums.auth_status

indexes:
  - name: uq_auth_email_username_domain
    columns: [username, domain]
    unique: true
    where: "deleted_at IS NULL"
    reason: 邮箱在未删除记录内唯一

  - name: idx_auth_email_domain
    columns: [domain]
    where: "deleted_at IS NULL"
    reason: 按域名聚合与检索

  - name: idx_auth_email_account_id
    columns: [account_id]
    where: "deleted_at IS NULL"
    reason: 按账号查邮箱

used_by:
  entities: [data.entities.auth_email]
  queries: [data.queries.auth]
  capabilities: [cap.services.auth]
