# 邮箱认证表。

id: data.tables.auth_email
summary: "邮箱认证表"
owner_module: auth
schema_version: 1
stability: draft
do_not:
  - "auth_email 同一账号只能绑定一个未删除的邮箱"

table:
  name: auth_email
  comment: "邮箱认证"
  extends:
    - data.tables.base
  entities:
    - data.entities.auth_email

columns:
  - name: account_id
    type: integer
    nullable: false
    comment: "关联账号"

  - name: username
    type: string
    nullable: false
    min_len: 1
    max_len: 64
    sensitivity: pii
    comment: "邮箱 @ 前的本地部分"

  - name: domain
    type: string
    nullable: false
    min_len: 1
    max_len: 190
    comment: "完整域名，例如 example.com；小写归一"

  - name: entity
    type: string
    nullable: true
    max_len: 190
    comment: "邮箱服务商，例如 163、gmail等"

  - name: tld
    type: string
    nullable: true
    max_len: 32
    comment: "顶级域，例如 com"

constraints:
  - name: ck_auth_email_domain_lowercase
    type: check
    expr: "domain = lower(domain)"

indexes:
  - name: uq_auth_email_username_domain
    columns: [ username, domain ]
    unique: true
    live_only: true
    comment: "邮箱在未删除记录内唯一"
    used_by:
      - data.queries.auth.get_auth_email_by_username_domain
      - data.queries.auth.create_auth_email

  - name: uq_auth_email_account
    columns: [ account_id ]
    unique: true
    live_only: true
    comment: "账号绑定唯一性"
    used_by:
      - data.queries.auth.create_auth_email

used_by:
  queries:
    - data.queries.auth.create_auth_email
    - data.queries.auth.get_auth_email_by_username_domain
