# 邮箱认证表。

id: data.tables.auth_email
summary: "邮箱认证表"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "auth_email 同一账号只能绑定一个未删除的邮箱"
  - "uq_auth_email_username_domain 是全局唯一；软删也不释放邮箱，重建同名邮箱会失败"
  - "软删时必须同时把 account_id 置 NULL；ck_auth_email_account_live 会拒绝未置空的行"

table:
  name: auth_email
  extends:
    - data.tables.base
  entities:
    - data.entities.auth_email
  references:
    - data.tables.account.col.id
  referenced_by: [ ]
  queries:
    - data.queries.auth.create_auth_email
    - data.queries.auth.get_auth_email_by_id
    - data.queries.auth.get_auth_email_by_username_domain
    - data.queries.auth.set_auth_email_status
    - data.queries.auth.soft_delete_auth_email_by_account

columns:
  - name: account_id
    type: _types.basics.id
    nullable: true
    references: { column: data.tables.account.col.id, on_delete: cascade }
    comment: "关联账号"

  - name: username
    type: _types.basics.email_username
    nullable: false
    sensitivity: pii
    comment: "邮箱 @ 前的本地部分；小写归一"

  - name: domain
    type: _types.basics.email_domain
    nullable: false
    comment: "完整域名，例如 example.com；小写归一"

  - name: entity
    type: _types.basics.string
    nullable: true
    max_len: 190
    comment: "邮箱服务商，例如 163、gmail等"

  - name: tld
    type: _types.basics.string
    nullable: true
    max_len: 32
    comment: "顶级域，例如 com"

constraints:
  - name: ck_auth_email_domain_lowercase
    expr: "domain = lower(domain)"
    on_violation: platform.errors.AUTH_EMAIL_INVALID
    used_by:
      - data.queries.auth.create_auth_email

  - name: ck_auth_email_username_lowercase
    expr: "username = lower(username)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.auth.create_auth_email

  - name: ck_auth_email_status
    expr: "status IN (0, 1, 2)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.auth.create_auth_email
      - data.queries.auth.set_auth_email_status

  - name: ck_auth_email_account_live
    expr: "(deleted_at IS NULL) = (account_id IS NOT NULL)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.auth.create_auth_email
      - data.queries.auth.soft_delete_auth_email_by_account

indexes:
  - name: uq_auth_email_username_domain
    columns: [ username, domain ]
    unique: true
    comment: "邮箱全局唯一；软删后不释放"
    used_by:
      - data.queries.auth.get_auth_email_by_username_domain
      - data.queries.auth.create_auth_email

  - name: uq_auth_email_account
    columns: [ account_id ]
    unique: true
    comment: "账号绑定全局唯一；软删行 account_id 置 NULL 后释放"
    used_by:
      - data.queries.auth.create_auth_email
      - data.queries.auth.soft_delete_auth_email_by_account
