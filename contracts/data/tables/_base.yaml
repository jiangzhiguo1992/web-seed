# 表结构基类。单例契约：5 列 + do_not；不生成 DDL、不建实体、不落存储。
# 字段树与规则见 _meta/data.tables.yaml；路径/ID 由 checker 写死识别。

schema_version: 1
id: data.tables.base
summary: "表结构基类"
stability: stable
do_not:
  - "本文件不是物理表：不生成 DDL、不建实体、不落存储"
  - "不要给基类加业务字段"
  - "基类 5 列不得改名或删除"

columns:
  - name: id
    type: string
    max_len: 36
    primary_key: true
    generated_by: application
    nullable: false
    comment: "主键 UUIDv7（36 字符字符串）"

  - name: status
    type: integer
    bits: 32
    nullable: false
    default: 0
    comment: "业务状态整数码；所有物理表继承，枚举映射在 entity 层"

  - name: created_at
    type: timestamp
    nullable: false
    default_sql: now()
    managed_by: database
    comment: "创建时间"

  - name: updated_at
    type: timestamp
    nullable: false
    default_sql: now()
    managed_by: application
    comment: "更新时间；应用层写入"

  - name: deleted_at
    type: timestamp
    nullable: true
    managed_by: application
    comment: "软删时间；为空表示未删除"
