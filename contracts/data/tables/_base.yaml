# 表结构基类：5 列 + 类型级 do_not；不是物理表。

id: data.tables.base
summary: "表结构基类"
schema_version: 1
stability: draft
do_not:
  - "本文件不是物理表：不生成 DDL、不建实体、不落存储"
  - "不要给基类加业务字段"
  - "不建数据库外键：关系只写在 columns.references 与实体 source.join，由应用维护"
  - "追加日志类表不提供更新或软删，只允许按保留期清理"

columns:
  - name: id
    type: _types.basics.integer
    nullable: false
    primary_key: true
    bits: 64
    comment: "主键 integer（bits: 64）；生成方式由实现决定"

  - name: status
    type: _types.basics.integer
    nullable: false
    default: 0
    comment: "业务状态整数码；枚举映射在 entity 层"

  - name: created_at
    type: _types.basics.timestamp
    nullable: false
    default_sql: now()
    comment: "创建时间；数据库默认 now()"

  - name: updated_at
    type: _types.basics.timestamp
    nullable: false
    default_sql: now()
    comment: "更新时间；应用层写入"

  - name: deleted_at
    type: _types.basics.timestamp
    nullable: true
    comment: "软删时间；应用层写入；为空表示未删除"
