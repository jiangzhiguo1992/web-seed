# 令牌表。访问令牌与刷新令牌；只允许认证模块读写。

schema_version: 1
id: data.table.tokens
summary: 令牌表
stability: stable
owner_module: auth
extends: [data.table.base]
do_not:
  - access_token / refresh_token 禁止出现在普通响应、日志、事件；仅 /auth/login 与 /auth/refresh 的 TokenPair 可返回
  - 建议只存哈希或加密值；若存原文，必须由 platform 层加密
  - 唯一索引必须带 WHERE deleted_at IS NULL
  - 只有 owner_module 对应的 cap.service 可以写本表，其他模块只能经 service 读
  - used_by 由 make gen-graph 生成，禁止手改

table:
  comment: 令牌（访问令牌与刷新令牌）
  size_class: large
  retention: { expired_days: 30 }

columns:
  - name: own_type
    type: text
    nullable: false
    min_length: 1
    max_length: 32
    comment: 归属类型

  - name: own_id
    type: uuid
    nullable: false
    comment: 归属 ID

  - name: account_id
    type: uuid
    nullable: false
    comment: 关联账号

  - name: device_id
    type: text
    nullable: true
    max_length: 128
    comment: 设备标识；多端登录时区分设备

  - name: user_id
    type: uuid
    nullable: true
    comment: 关联用户 ID

  - name: access_token
    type: text
    nullable: false
    pii: true
    never_expose: true
    comment: 访问令牌；仅认证签发响应可返回，禁止日志

  - name: refresh_token
    type: text
    nullable: false
    pii: true
    never_expose: true
    comment: 刷新令牌；仅认证签发响应可返回，禁止日志

  - name: access_expire_at
    type: timestamptz
    nullable: false
    comment: 访问令牌过期时间

  - name: refresh_expire_at
    type: timestamptz
    nullable: false
    comment: 刷新令牌过期时间

  - name: status
    type: data.enum.token_status
    nullable: false
    default: active
    comment: 令牌状态

constraints:
  - name: fk_tokens_account
    type: foreign_key
    columns: [account_id]
    references: data.table.accounts.col.id
    on_delete: cascade
    on_update: no_action

  - name: ck_tokens_expire_order
    type: check
    expr: "refresh_expire_at > access_expire_at"

  - name: ck_tokens_status
    type: enum
    column: status
    enum: data.enum.token_status

indexes:
  - name: uq_tokens_access
    columns: [access_token]
    unique: true
    where: "deleted_at IS NULL"
    reason: 访问令牌查找

  - name: uq_tokens_refresh
    columns: [refresh_token]
    unique: true
    where: "deleted_at IS NULL"
    reason: 刷新令牌查找

  - name: idx_tokens_account_id
    columns: [account_id]
    where: "deleted_at IS NULL"
    reason: 按账号列出令牌

  - name: idx_tokens_refresh_expire_at
    columns: [refresh_expire_at]
    where: "deleted_at IS NULL"
    reason: 过期令牌清理

  - name: idx_tokens_account_id_device_id
    columns: [account_id, device_id]
    where: "deleted_at IS NULL"
    reason: 按设备吊销令牌

used_by:
  - data.entity.token
  - data.query.auth
  - cap.service.auth
