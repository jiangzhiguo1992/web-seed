# 验证动作表：校验请求的追加日志。

id: data.tables.verification_action
summary: "验证动作（校验请求记录）"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "verification_action.account_id 是有意快照；不要复制 auth_id/auth_type"
  - "verification_action.input_hash 必须用 HMAC-SHA256，不能用裸哈希"
  - "verification_action.verification_id 可因验证体清理而悬空；不要按 verification_id 级联删除"

table:
  name: verification_action
  extends:
    - data.tables.base
  entities:
    - data.entities.verification_action
  references:
    - data.tables.account.col.id
  referenced_by: [ ]
  queries:
    - data.queries.verification.create_verification_action

columns:
  - name: verification_id
    type: _types.integer
    nullable: false
    bits: 64
    comment: "验证体 ID；不建外键，验证体清理后允许悬空"

  - name: account_id
    type: _types.integer
    nullable: false
    bits: 64
    references: { column: data.tables.account.col.id, on_delete: no_action }
    comment: "账号 ID 快照；账号硬删后保留；验证体清理后仍可按账号追溯；不作为冗余副本声明"

  - name: result
    type: _types.integer
    nullable: false
    comment: "结果整数码；映射 data.enums.verification_result"

  - name: request_ip
    type: _types.string
    nullable: true
    max_len: 45
    sensitivity: pii
    comment: "本次请求 IP 快照；风控与审计"

  - name: device_id
    type: _types.string
    nullable: true
    max_len: 128
    sensitivity: pii
    comment: "客户端设备标识；与 LoginInput.device_id 对齐"

  - name: location
    type: _types.string
    nullable: true
    max_len: 128
    sensitivity: pii
    comment: "IP 派生的粗粒度地点（国家/省/市）；不存精确坐标"

  - name: input_hash
    type: _types.string
    nullable: false
    min_len: 32
    max_len: 128
    sensitivity: secret
    comment: "提交内容的 HMAC-SHA256；不存原文"

constraints:
  - name: ck_verification_action_result
    expr: "result IN (1, 2, 3, 4, 5)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.verification.create_verification_action

  - name: ck_verification_action_input
    expr: "input_hash IS NOT NULL"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.verification.create_verification_action

  - name: ck_verification_action_status
    expr: "status = 0"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.verification.create_verification_action

  - name: ck_verification_action_no_soft_delete
    expr: "deleted_at IS NULL"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.verification.create_verification_action

indexes: [ ]
