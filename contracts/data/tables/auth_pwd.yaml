# 密码认证表。

id: data.tables.auth_pwd
summary: "密码认证表"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "auth_pwd.password_hash 只存哈希，不存原文"
  - "软删时必须同时把 account_id 置 NULL；ck_auth_pwd_account_live 会拒绝未置空的行"

table:
  name: auth_pwd
  extends:
    - data.tables.base
  entities:
    - data.entities.auth_pwd
  references:
    - data.tables.account.col.id
  referenced_by: [ ]
  queries:
    - data.queries.auth.create_auth_pwd
    - data.queries.auth.get_auth_pwd_by_id
    - data.queries.auth.get_auth_pwd_by_username
    - data.queries.auth.record_auth_pwd_login_failure
    - data.queries.auth.record_auth_pwd_login_success
    - data.queries.auth.set_auth_pwd_status
    - data.queries.auth.soft_delete_auth_pwd_by_account
    - data.queries.auth.update_auth_pwd_hash

columns:
  - name: account_id
    type: _types.basics.id
    nullable: true
    references: { column: data.tables.account.col.id, on_delete: cascade }
    comment: "关联账号"

  - name: username
    type: _types.basics.auth_username
    nullable: false
    sensitivity: pii
    comment: "登录名；小写归一且唯一"

  - name: password_hash
    type: _types.basics.string
    nullable: false
    min_len: 20
    max_len: 255
    sensitivity: secret
    comment: "argon2id 口令哈希；新密码写入此列"

  - name: failed_login_count
    type: _types.basics.integer.32
    nullable: false
    default: 0
    min: 0
    comment: "连续失败次数；成功登录后归零"

  - name: locked_until
    type: _types.basics.timestamp.long
    nullable: true
    comment: "锁定截止时间；为空表示未锁定"

constraints:
  - name: ck_auth_pwd_username_lowercase
    expr: "username = lower(username)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.auth.create_auth_pwd

  - name: ck_auth_pwd_status
    expr: "status IN (1, 2)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.auth.create_auth_pwd
      - data.queries.auth.set_auth_pwd_status

  - name: ck_auth_pwd_account_live
    expr: "(deleted_at IS NULL) = (account_id IS NOT NULL)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.auth.create_auth_pwd
      - data.queries.auth.soft_delete_auth_pwd_by_account

indexes:
  - name: uq_auth_pwd_username
    columns: [ username ]
    unique: true
    comment: "登录名全局唯一；软删后不释放"
    used_by:
      - data.queries.auth.get_auth_pwd_by_username
      - data.queries.auth.create_auth_pwd

  - name: uq_auth_pwd_account
    columns: [ account_id ]
    unique: true
    comment: "账号绑定全局唯一；软删行 account_id 置 NULL 后释放"
    used_by:
      - data.queries.auth.create_auth_pwd
      - data.queries.auth.soft_delete_auth_pwd_by_account
