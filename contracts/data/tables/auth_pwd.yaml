# 密码认证表。一个账号一条密码记录；只允许认证模块读写。

schema_version: 1
id: data.tables.auth_pwd
summary: "密码认证表"
stability: stable
owner_module: auth
extends: [ data.tables.base ]
do_not:
  - "password_hash 禁止出现在响应、日志、事件"

table:
  comment: "密码认证"
  size_class: small
  retention: { unit: days, soft_delete: 30, hard_delete: 90 }

columns:
  - name: account_id
    type: string
    max_len: 36
    nullable: false
    comment: "关联账号"

  - name: username
    type: string
    nullable: false
    min_len: 1
    max_len: 254
    pii: true
    comment: "登录名；唯一"

  - name: password_hash
    type: string
    nullable: true
    min_len: 20
    max_len: 255
    pii: true
    never_expose: true
    comment: "argon2id 口令哈希；新密码写入此列"

  - name: failed_login_count
    type: integer
    nullable: false
    min: 0
    default: 0
    comment: "连续失败次数；成功登录后归零"

  - name: locked_until
    type: timestamp
    nullable: true
    comment: "锁定截止时间；为空表示未锁定"

  - name: status
    type: integer
    bits: 32
    nullable: false
    default: 0
    comment: "认证记录状态整数码；0=active 1=disabled"

constraints:
  - name: ck_auth_pwd_password_present
    type: check
    expr: "num_nonnulls(password_hash) >= 1"

indexes:
  - name: uq_auth_pwd_username
    columns: [ username ]
    unique: true
    where: "deleted_at IS NULL"
    used_by:
      - data.queries.auth.get_auth_pwd_by_username
      - data.queries.auth.create_auth_pwd
    reason: "登录名在未删除记录内唯一"

  - name: uq_auth_pwd_account
    columns: [ account_id ]
    unique: true
    where: "deleted_at IS NULL"
    used_by: [ data.queries.auth.create_auth_pwd ]
    reason: "一个账号只有一条密码记录"

used_by:
  entities: [ data.entities.auth_pwd ]
  queries:
    - data.queries.auth.get_auth_pwd_by_username
    - data.queries.auth.create_auth_pwd
    - data.queries.auth.update_auth_pwd_hash
    - data.queries.auth.record_auth_pwd_login_success
    - data.queries.auth.record_auth_pwd_login_failure
  capabilities: [ cap.services.auth ]
