# 密码认证表。

id: data.tables.auth_pwd
summary: "密码认证表"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "auth_pwd.password_hash 只存哈希，不存原文"
  - "auth_pwd.status 只允许 verified/disabled；unverified 不适用于密码绑定"

table:
  name: auth_pwd
  comment: "密码认证"
  extends:
    - data.tables.base
  entities:
    - data.entities.auth_pwd
  queries:
    - data.queries.auth.create_auth_pwd
    - data.queries.auth.get_auth_pwd_by_username
    - data.queries.auth.record_auth_pwd_login_failure
    - data.queries.auth.record_auth_pwd_login_success
    - data.queries.auth.set_auth_pwd_status
    - data.queries.auth.soft_delete_auth_pwd_by_account
    - data.queries.auth.update_auth_pwd_hash

columns:
  - name: account_id
    type: integer
    nullable: false
    comment: "关联账号"

  - name: username
    type: auth_username
    nullable: false
    sensitivity: pii
    comment: "登录名；小写归一且唯一"

  - name: password_hash
    type: string
    nullable: false
    min_len: 20
    max_len: 255
    sensitivity: secret
    comment: "argon2id 口令哈希；新密码写入此列"

  - name: failed_login_count
    type: integer
    nullable: false
    default: 0
    min: 0
    comment: "连续失败次数；成功登录后归零"

  - name: locked_until
    type: timestamp
    nullable: true
    comment: "锁定截止时间；为空表示未锁定"

constraints:
  - name: ck_auth_pwd_username_lowercase
    type: check
    expr: "username = lower(username)"

  - name: ck_auth_pwd_status
    type: check
    expr: "status IN (1, 2)"

indexes:
  - name: uq_auth_pwd_username
    columns: [ username ]
    unique: true
    live_only: true
    comment: "登录名在未删除记录内唯一"
    used_by:
      - data.queries.auth.get_auth_pwd_by_username
      - data.queries.auth.create_auth_pwd

  - name: uq_auth_pwd_account
    columns: [ account_id ]
    unique: true
    live_only: true
    comment: "未删除记录内一个账号只有一条密码记录"
    used_by:
      - data.queries.auth.create_auth_pwd
      - data.queries.auth.soft_delete_auth_pwd_by_account
