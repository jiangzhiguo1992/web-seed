# 密码认证表。一个账号一条密码记录；只允许认证模块读写。

schema_version: 1
id: data.tables.auth_pwd
summary: 密码认证表
stability: stable
owner_module: auth
extends: [data.tables.base]
do_not:
  - password_md5 仅用于兼容遗留系统；新密码必须使用 argon2id 并写入 password_hash
  - password_hash / password_md5 禁止出现在响应、日志、事件
  - username 唯一索引必须带 WHERE deleted_at IS NULL
  - 只有 owner_module 对应的 cap.services 可以写本表，其他模块只能经 service 读
  - used_by 由 make gen-graph 生成，禁止手改

table:
  comment: 密码认证
  size_class: small
  retention: { soft_delete_days: 30, hard_delete_days: 90 }

columns:
  - name: account_id
    type: uuid
    nullable: false
    comment: 关联账号

  - name: username
    type: text
    nullable: false
    min_length: 1
    max_length: 254
    pii: true
    comment: 登录名；唯一

  - name: password_hash
    type: text
    nullable: true
    min_length: 20
    max_length: 255
    pii: true
    never_expose: true
    comment: argon2id 口令哈希；新密码写入此列

  - name: password_md5
    type: text
    nullable: true
    min_length: 32
    max_length: 32
    pattern: "^[a-fA-F0-9]{32}$"
    pii: true
    never_expose: true
    comment: 遗留 MD5 口令；仅兼容旧账号，新密码禁止使用

  - name: failed_login_count
    type: integer
    nullable: false
    min: 0
    default: 0
    comment: 连续失败次数；成功登录后归零

  - name: locked_until
    type: timestamptz
    nullable: true
    comment: 锁定截止时间；为空表示未锁定

  - name: status
    type: data.enums.auth_status
    nullable: false
    default: active
    comment: 认证记录状态

constraints:
  - name: fk_auth_pwd_account
    type: foreign_key
    columns: [account_id]
    references: data.tables.account.col.id
    on_delete: cascade
    on_update: no_action

  - name: ck_auth_pwd_password_present
    type: check
    expr: "num_nonnulls(password_hash, password_md5) >= 1"

  - name: ck_auth_pwd_status
    type: enum
    column: status
    enum: data.enums.auth_status

indexes:
  - name: uq_auth_pwd_username
    columns: [username]
    unique: true
    where: "deleted_at IS NULL"
    reason: 登录名在未删除记录内唯一

  - name: uq_auth_pwd_account
    columns: [account_id]
    unique: true
    where: "deleted_at IS NULL"
    reason: 一个账号只有一条密码记录

used_by:
  entities: [data.entities.auth_pwd]
  queries: [data.queries.auth]
  capabilities: [cap.services.auth]
