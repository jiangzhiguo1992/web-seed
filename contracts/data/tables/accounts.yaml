# 账号主表。表结构真相源，migrations 由本文件生成。

schema_version: 1
id: data.table.accounts
summary: 账号主表
stability: stable
owner_module: accounts
do_not:
  - email 唯一索引必须带 WHERE deleted_at IS NULL
  - password_hash 禁止出现在任何查询响应与日志
  - status 只能引用 data.enum.account_status，不要裸字符串

table:
  name: accounts
  comment: 账号（管理员与普通用户统一模型）
  lifecycle: soft_delete
  audit_columns: true

columns:
  - name: id
    type: uuid
    primary_key: true
    generated_by: application
    comment: 主键

  - name: email
    type: text
    nullable: false
    max_length: 254
    pii: true
    comment: 登录标识；存储前统一小写

  - name: password_hash
    type: text
    nullable: false
    pii: true
    never_expose: true
    comment: argon2id 哈希；永不出现在响应、日志、事件

  - name: display_name
    type: text
    nullable: false
    max_length: 100
    pii: true

  - name: status
    type: data.enum.account_status
    nullable: false
    default: pending
    comment: 账号状态

  - name: failed_login_count
    type: integer
    nullable: false
    default: 0
    comment: 连续失败次数；成功登录后归零

  - name: locked_until
    type: timestamptz
    nullable: true
    comment: 锁定截止时间；为空表示未锁定

  - name: last_login_at
    type: timestamptz
    nullable: true

  - name: created_at
    type: timestamptz
    nullable: false
    default: now()

  - name: updated_at
    type: timestamptz
    nullable: false
    default: now()

  - name: deleted_at
    type: timestamptz
    nullable: true
    comment: 软删时间；查询默认过滤

  - name: version
    type: integer
    nullable: false
    default: 1
    comment: 乐观锁

constraints:
  - name: ck_accounts_email_format
    type: check
    expr: "email ~* '^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$'"

  - name: ck_accounts_failed_login_non_negative
    type: check
    expr: "failed_login_count >= 0"

indexes:
  - name: uq_accounts_email
    columns: [email]
    unique: true
    where: "deleted_at IS NULL"
    reason: 登录标识在未删除账号内唯一

  - name: idx_accounts_status
    columns: [status]
    where: "deleted_at IS NULL"
    reason: 按状态筛选

  - name: idx_accounts_created
    columns: [created_at, id]
    order: [desc, desc]
    where: "deleted_at IS NULL"
    reason: 列表游标分页

ddl_ext: []
