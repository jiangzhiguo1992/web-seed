# 令牌表。访问令牌与刷新令牌；只允许认证模块读写。

schema_version: 1
id: data.tables.token
summary: 令牌表
stability: stable
owner_module: auth
extends: [data.tables.base]
do_not:
  - access_token_hash / refresh_token_hash 只存哈希，禁止出现在普通响应、日志、事件；原文只在 /auth/login、/auth/refresh 的 TokenPair 返回一次
  - uq_tokens_access_hash / uq_tokens_refresh_hash 必须带 WHERE deleted_at IS NULL

table:
  name: tokens
  comment: 令牌（访问令牌与刷新令牌）
  size_class: large
  retention: { expired_days: 30 }

columns:
  - name: own_type
    type: string
    nullable: false
    min_len: 1
    max_len: 32
    comment: 归属类型

  - name: own_id
    type: string
    max_len: 36
    nullable: false
    comment: 归属 ID

  - name: account_id
    type: string
    max_len: 36
    nullable: false
    comment: 关联账号

  - name: device_id
    type: string
    nullable: true
    max_len: 128
    comment: 设备标识；多端登录时区分设备

  - name: user_id
    type: string
    max_len: 36
    nullable: true
    comment: 关联用户 ID

  - name: access_token_hash
    type: string
    nullable: false
    min_len: 32
    max_len: 128
    pii: true
    never_expose: true
    comment: 访问令牌哈希；只存哈希，禁止存原文

  - name: refresh_token_hash
    type: string
    nullable: false
    min_len: 32
    max_len: 128
    pii: true
    never_expose: true
    comment: 刷新令牌哈希；只存哈希，禁止存原文

  - name: access_expire_at
    type: timestamp
    nullable: false
    comment: 访问令牌过期时间

  - name: refresh_expire_at
    type: timestamp
    nullable: false
    comment: 刷新令牌过期时间

  - name: status
    type: data.enums.token_status
    nullable: false
    default: active
    comment: 令牌状态

constraints:
  - name: fk_tokens_account
    type: foreign_key
    columns: [account_id]
    references: [data.tables.account.col.id]
    on_delete: cascade
    on_update: no_action

  - name: ck_tokens_expire_order
    type: check
    expr: "refresh_expire_at > access_expire_at"

  - name: ck_tokens_status
    type: enum
    column: status
    enum: data.enums.token_status

indexes:
  - name: uq_tokens_access_hash
    columns: [access_token_hash]
    unique: true
    where: "deleted_at IS NULL"
    reason: 访问令牌哈希查找

  - name: uq_tokens_refresh_hash
    columns: [refresh_token_hash]
    unique: true
    where: "deleted_at IS NULL"
    reason: 刷新令牌哈希查找

  - name: idx_tokens_account_id
    columns: [account_id]
    where: "deleted_at IS NULL"
    reason: 按账号列出令牌

  - name: idx_tokens_refresh_expire_at
    columns: [refresh_expire_at]
    where: "deleted_at IS NULL"
    reason: 过期令牌清理

  - name: idx_tokens_account_id_device_id
    columns: [account_id, device_id]
    where: "deleted_at IS NULL"
    reason: 按设备吊销令牌

used_by:
  entities: [data.entities.token]
  queries:
    - data.queries.auth.create_token
    - data.queries.auth.get_token_by_refresh
    - data.queries.auth.get_token_by_access
    - data.queries.auth.revoke_token
    - data.queries.auth.delete_expired_tokens
    - data.queries.auth.list_tokens_by_account
  capabilities: [cap.services.auth]
