# 令牌表。访问令牌与刷新令牌；只允许认证模块读写。

id: data.tables.token
summary: "令牌表"
owner_module: auth
schema_version: 1
stability: stable
do_not:
  - "access_token_hash / refresh_token_hash 只存哈希，禁止出现在普通响应、日志、事件；原文只在 /auth/login、/auth/refresh 的 TokenPair 返回一次"

table:
  name: tokens
  comment: "令牌（访问令牌与刷新令牌）"
  extends:
    - data.tables.base

  entities:
    - data.entities.token

columns:
  - name: own_type
    type: string
    nullable: false
    min_len: 1
    max_len: 32
    redundancy: { group: account_own_type, role: copy, ref: data.tables.account.col.own_type }
    comment: "归属类型（冗余自 account.own_type）"

  - name: own_id
    type: string
    max_len: 36
    nullable: false
    redundancy: { group: account_own_id, role: copy, ref: data.tables.account.col.own_id }
    comment: "归属 ID（冗余自 account.own_id）"

  - name: account_id
    type: string
    max_len: 36
    nullable: false
    comment: "关联账号"

  - name: device_id
    type: string
    nullable: true
    max_len: 128
    comment: "设备标识；多端登录时区分设备"

  - name: user_id
    type: string
    max_len: 36
    nullable: true
    redundancy: { group: account_user_id, role: copy, ref: data.tables.account.col.user_id }
    comment: "关联用户 ID（冗余自 account.user_id）"

  - name: access_token_hash
    type: string
    nullable: false
    min_len: 32
    max_len: 128
    pii: true
    never_expose: true
    comment: "访问令牌哈希；只存哈希，禁止存原文"

  - name: refresh_token_hash
    type: string
    nullable: false
    min_len: 32
    max_len: 128
    pii: true
    never_expose: true
    comment: "刷新令牌哈希；只存哈希，禁止存原文"

  - name: access_expire_at
    type: timestamp
    nullable: false
    comment: "访问令牌过期时间"

  - name: refresh_expire_at
    type: timestamp
    nullable: false
    comment: "刷新令牌过期时间"

constraints:
  - name: ck_tokens_expire_order
    type: check
    expr: "refresh_expire_at > access_expire_at"

indexes:
  - name: uq_tokens_access_hash
    columns: [ access_token_hash ]
    unique: true
    where: "deleted_at IS NULL"
    used_by:
      - data.queries.auth.get_token_by_access
      - data.queries.auth.create_token
    reason: "访问令牌哈希查找"

  - name: uq_tokens_refresh_hash
    columns: [ refresh_token_hash ]
    unique: true
    where: "deleted_at IS NULL"
    used_by:
      - data.queries.auth.get_token_by_refresh
      - data.queries.auth.revoke_token
      - data.queries.auth.create_token
    reason: "刷新令牌哈希查找"

  - name: idx_tokens_account_id
    columns: [ account_id ]
    where: "deleted_at IS NULL"
    used_by: [ data.queries.auth.list_tokens_by_account ]
    reason: "按账号列出令牌"

  - name: idx_tokens_refresh_expire_at
    columns: [ refresh_expire_at ]
    where: "deleted_at IS NULL"
    used_by: [ data.queries.auth.delete_expired_tokens ]
    reason: "过期令牌清理"

used_by:
  queries:
    - data.queries.auth.create_token
    - data.queries.auth.delete_expired_tokens
    - data.queries.auth.get_token_by_access
    - data.queries.auth.get_token_by_refresh
    - data.queries.auth.list_tokens_by_account
    - data.queries.auth.revoke_token
