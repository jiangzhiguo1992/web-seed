# 令牌表。

id: data.tables.token
summary: "令牌表"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "access_token_hash / refresh_token_hash 只存哈希，不存原文"
  - "token 原文只在 /auth/login、/auth/refresh 的签发响应中返回一次；不落库、不写日志"

table:
  name: token
  comment: "令牌（访问令牌与刷新令牌）"
  extends:
    - data.tables.base
  entities:
    - data.entities.token
  queries:
    - data.queries.token.create_token
    - data.queries.token.delete_expired_tokens
    - data.queries.token.get_token_by_access
    - data.queries.token.get_token_by_refresh
    - data.queries.token.revoke_token
    - data.queries.token.revoke_tokens_by_account

columns:
  - name: own_type
    type: integer
    nullable: false
    redundancy:
      - { column: data.tables.account.col.own_type, source: true }
      - { column: data.tables.token.col.own_type, source: false }
    comment: "归属类型整数码；映射 data.enums.own_type"

  - name: own_id
    type: integer
    nullable: false
    redundancy:
      - { column: data.tables.account.col.own_id, source: true }
      - { column: data.tables.token.col.own_id, source: false }
    comment: "归属 ID"

  - name: account_id
    type: integer
    nullable: false
    comment: "关联账号"

  - name: device_id
    type: device_id
    nullable: true
    comment: "设备标识；多端登录时区分设备"

  - name: user_id
    type: integer
    nullable: true
    redundancy:
      - { column: data.tables.account.col.user_id, source: true }
      - { column: data.tables.token.col.user_id, source: false }
    comment: "关联用户 ID"

  - name: access_token_hash
    type: string
    nullable: false
    min_len: 32
    max_len: 128
    sensitivity: secret
    comment: "访问令牌哈希"

  - name: refresh_token_hash
    type: string
    nullable: false
    min_len: 32
    max_len: 128
    sensitivity: secret
    comment: "刷新令牌哈希"

  - name: access_expire_at
    type: timestamp
    nullable: false
    comment: "访问令牌过期时间"

  - name: refresh_expire_at
    type: timestamp
    nullable: false
    comment: "刷新令牌过期时间"

  - name: revoked_at
    type: timestamp
    nullable: true
    comment: "吊销时间；为空表示未吊销"

  - name: revoke_reason
    type: integer
    nullable: true
    comment: "吊销原因整数码；映射 data.enums.token_revoke_reason"

  - name: replaced_by_id
    type: integer
    nullable: true
    comment: "轮换后新令牌 ID（旧→新的前向指针）；不是吊销者 ID"

constraints:
  - name: ck_token_expire_order
    expr: "refresh_expire_at > access_expire_at"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.token.create_token

  - name: ck_token_revoked_consistent
    expr: "(status = 1) = (revoked_at IS NOT NULL)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.token.revoke_token
      - data.queries.token.revoke_tokens_by_account

  - name: ck_token_revoke_reason_consistent
    expr: "(status = 1) = (revoke_reason IS NOT NULL)"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.token.revoke_token
      - data.queries.token.revoke_tokens_by_account

  - name: ck_token_replaced_by_self
    expr: "replaced_by_id IS NULL OR replaced_by_id <> id"
    on_violation: platform.errors.COMMON_INTERNAL
    used_by:
      - data.queries.token.revoke_token

indexes:
  - name: uq_token_access_hash
    columns: [ access_token_hash ]
    unique: true
    live_only: true
    comment: "访问令牌哈希查找"
    used_by:
      - data.queries.token.get_token_by_access
      - data.queries.token.create_token

  - name: uq_token_refresh_hash
    columns: [ refresh_token_hash ]
    unique: true
    live_only: true
    comment: "刷新令牌哈希查找"
    used_by:
      - data.queries.token.get_token_by_refresh
      - data.queries.token.revoke_token
      - data.queries.token.create_token

  - name: idx_token_account_status
    columns: [ account_id, status ]
    live_only: true
    comment: "按账号与状态列出/吊销令牌"
    used_by:
      - data.queries.token.revoke_tokens_by_account

  - name: idx_token_refresh_expire_at
    columns: [ refresh_expire_at ]
    live_only: true
    comment: "过期令牌清理"
    used_by: [ data.queries.token.delete_expired_tokens ]
