# 附件查询集。

id: data.queries.attachment
summary: "附件查询集"
owner_module: system
schema_version: 1
stability: draft
do_not:
  - "ListAttachments 必须同时按 owner_table_name 与 owner_id 过滤；owner_id 不是全局唯一"
  - "GetAttachmentByKey 按 object_key 读取；不要用 original_name 做查询键"
  - "附件写查询必须复用 uq_attachment_object_key / idx_attachment_owner；不要为写路径新增重复索引"
  - "替换旧附件由 complete_upload 软删；不要在 CreateAttachment 里原地覆盖 object_key"

queries:
  - name: ListAttachments
    description: "按所有者、用途列出附件并保持顺序"
    tables:
      - { table: data.tables.attachment }
    params:
      - { name: ctx, type: context.Context }
      - { name: owner_table_name, type: _types.string, column: data.tables.attachment.col.owner_table_name }
      - { name: owner_id, type: _types.id, column: data.tables.attachment.col.owner_id }
      - { name: purpose, type: _types.string, column: data.tables.attachment.col.purpose, nullable: true }
      - { name: offset, type: _types.integer, nullable: true, default: 0 }
      - { name: limit, type: _types.integer, nullable: true, default: 20 }
    returns:
      - { name: attachments, list: true, kind: entity, entity: data.entities.attachment }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.attachment.idx_attachment_owner, columns: [ deleted_at, owner_table_name, owner_id, purpose, sort, id ] }
    used_by:
      - cap.services.attachment.list

  - name: GetAttachment
    description: "按 ID 读取附件"
    tables:
      - { table: data.tables.attachment }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.attachment.col.id }
    returns:
      - { name: attachment, kind: entity, entity: data.entities.attachment, nullable: true }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.attachment.pk, columns: [ id ] }
    used_by:
      - cap.services.attachment.complete_upload
      - cap.services.attachment.delete
      - cap.services.attachment.get
      - cap.services.attachment.get_download_url

  - name: GetAttachmentByKey
    description: "按对象 key 读取附件"
    tables:
      - { table: data.tables.attachment }
    params:
      - { name: ctx, type: context.Context }
      - { name: object_key, type: _types.string, column: data.tables.attachment.col.object_key }
    returns:
      - { name: attachment, kind: entity, entity: data.entities.attachment, nullable: true }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.attachment.uq_attachment_object_key, columns: [ object_key ] }
    used_by:
      - cap.services.attachment.get_by_key

  - name: CreateAttachment
    description: "创建附件元数据并返回实体；对象字节由客户端直传对象存储"
    tables:
      - { table: data.tables.attachment, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.attachment.col.id }
      - { name: owner_table_name, type: _types.string, column: data.tables.attachment.col.owner_table_name }
      - { name: owner_id, type: _types.id, column: data.tables.attachment.col.owner_id }
      - { name: purpose, type: _types.string, column: data.tables.attachment.col.purpose }
      - { name: sort, type: _types.integer, column: data.tables.attachment.col.sort }
      - { name: object_key, type: _types.string, column: data.tables.attachment.col.object_key }
      - { name: original_name, type: _types.string, column: data.tables.attachment.col.original_name }
      - { name: content_type, type: _types.string, column: data.tables.attachment.col.content_type }
      - { name: size_bytes, type: _types.byte_size, column: data.tables.attachment.col.size_bytes }
      - { name: sha256, type: _types.string, column: data.tables.attachment.col.sha256, nullable: true }
      - { name: visibility, type: _types.integer, column: data.tables.attachment.col.visibility }
      - { name: status, type: _types.integer, column: data.tables.attachment.col.status }
      - { name: replaces_id, type: _types.id, column: data.tables.attachment.col.replaces_id, nullable: true }
    returns:
      - { name: attachment, kind: entity, entity: data.entities.attachment }
      - { name: err, kind: error }
    errors:
      - platform.errors.ATTACHMENT_OBJECT_KEY_TAKEN
      - platform.errors.ATTACHMENT_OWNER_INVALID
      - platform.errors.ATTACHMENT_INVALID
    index_ref:
      - { index: data.tables.attachment.uq_attachment_object_key, columns: [ object_key ] }
    used_by:
      - cap.services.attachment.create_upload

  - name: SetAttachmentStatus
    description: "设置附件状态并返回实体"
    tables:
      - { table: data.tables.attachment, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.attachment.col.id }
      - { name: status, type: _types.integer, column: data.tables.attachment.col.status }
    returns:
      - { name: attachment, kind: entity, entity: data.entities.attachment }
      - { name: err, kind: error }
    errors:
      - platform.errors.ATTACHMENT_ILLEGAL_TRANSITION
    index_ref:
      - { index: data.tables.attachment.pk, columns: [ id ] }
    used_by:
      - cap.services.attachment.complete_upload

  - name: SoftDeleteAttachment
    description: "软删附件并同步 status 与 deleted_at；id 为 null 时视为无替换目标"
    tables:
      - { table: data.tables.attachment, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.attachment.col.id, nullable: true }
      - { name: status, type: _types.integer, column: data.tables.attachment.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors:
      - platform.errors.ATTACHMENT_ILLEGAL_TRANSITION
    index_ref:
      - { index: data.tables.attachment.pk, columns: [ id ] }
    used_by:
      - cap.services.attachment.complete_upload
      - cap.services.attachment.delete

  - name: SoftDeleteStaleUploads
    description: "软删超过 cutoff 仍停留在 uploading 的附件"
    tables:
      - { table: data.tables.attachment, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: cutoff, type: _types.timestamp }
      - { name: status, type: _types.integer, column: data.tables.attachment.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.attachment.idx_attachment_stale_upload, columns: [ status, created_at ] }
    used_by:
      - cap.services.attachment.cleanup_stale_uploads
