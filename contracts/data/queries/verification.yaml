# 验证查询集：验证体（body）与验证动作（verification_action）。

id: data.queries.verification
summary: "验证查询集（验证体与验证动作）"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "verification 查询不要向非认证调用方返回 code_hash / content / input_hash"
  - "verification_action 只追加；不要提供更新或软删动作的查询"

queries:
  - name: CreateVerification
    description: "创建验证体"
    tables:
      - { table: data.tables.verification_body, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.basics.id, column: data.tables.verification_body.col.id }
      - { name: account_id, type: _types.basics.id, column: data.tables.verification_body.col.account_id }
      - { name: auth_type, type: data.enums.auth_type, column: data.tables.verification_body.col.auth_type }
      - { name: purpose, type: data.enums.verification_purpose, column: data.tables.verification_body.col.purpose }
      - { name: auth_id, type: _types.basics.id, column: data.tables.verification_body.col.auth_id }
      - { name: code_hash, type: _types.basics.string, column: data.tables.verification_body.col.code_hash }
      - { name: content, type: _types.basics.string, column: data.tables.verification_body.col.content, nullable: true }
      - { name: expire_at, type: _types.basics.timestamp, column: data.tables.verification_body.col.expire_at }
    returns:
      - { name: row, kind: entity, entity: data.entities.verification_body }
      - { name: err, kind: error }
    errors:
      - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
    index_ref:
      - { index: data.tables.verification_body.pk, columns: [ id ] }
    used_by:
      - cap.services.verification.send

  - name: MarkVerificationSent
    description: "标记验证体已发送"
    tables:
      - { table: data.tables.verification_body, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.basics.id, column: data.tables.verification_body.col.id }
      - { name: sent_at, type: _types.basics.timestamp, column: data.tables.verification_body.col.sent_at }
      - { name: status, type: data.enums.verification_status, column: data.tables.verification_body.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.verification_body.pk, columns: [ id ] }
    used_by:
      - cap.services.verification.send

  - name: GetLatestVerification
    description: "读取指定认证目标的最新验证体"
    tables:
      - { table: data.tables.verification_body }
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: _types.basics.id, column: data.tables.verification_body.col.account_id }
      - { name: auth_type, type: data.enums.auth_type, column: data.tables.verification_body.col.auth_type }
      - { name: auth_id, type: _types.basics.id, column: data.tables.verification_body.col.auth_id }
      - { name: purpose, type: data.enums.verification_purpose, column: data.tables.verification_body.col.purpose }
    returns:
      - { name: row, kind: entity, entity: data.entities.verification_body }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.verification_body.idx_verification_auth_purpose, columns: [ deleted_at, auth_type, auth_id, purpose, created_at ] }
    used_by:
      - cap.services.verification.verify

  - name: ConsumeVerification
    description: "消费验证体"
    tables:
      - { table: data.tables.verification_body, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.basics.id, column: data.tables.verification_body.col.id }
      - { name: consumed_at, type: _types.basics.timestamp, column: data.tables.verification_body.col.consumed_at }
      - { name: status, type: data.enums.verification_status, column: data.tables.verification_body.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors:
      - platform.errors.AUTH_VERIFICATION_INVALID
    index_ref:
      - { index: data.tables.verification_body.pk, columns: [ id ] }
    used_by:
      - cap.services.verification.verify

  - name: IncrementVerificationAttempt
    description: "递增验证失败次数并更新状态"
    tables:
      - { table: data.tables.verification_body, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.basics.id, column: data.tables.verification_body.col.id }
      - { name: attempt_count, type: _types.basics.integer, column: data.tables.verification_body.col.attempt_count }
      - { name: status, type: data.enums.verification_status, column: data.tables.verification_body.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.verification_body.pk, columns: [ id ] }
    used_by:
      - cap.services.verification.verify

  - name: SetVerificationStatus
    description: "按 ID 设置验证体终态（如 failed）"
    tables:
      - { table: data.tables.verification_body, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.basics.id, column: data.tables.verification_body.col.id }
      - { name: status, type: data.enums.verification_status, column: data.tables.verification_body.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.verification_body.pk, columns: [ id ] }
    used_by:
      - cap.services.verification.send

  - name: ExpireStaleVerifications
    description: "把超过 expire_at 的 pending/sent 验证体置为 expired"
    tables:
      - { table: data.tables.verification_body, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: now, type: _types.basics.timestamp }
      - { name: status, type: data.enums.verification_status }
      - { name: limit, type: _types.basics.integer, nullable: true, default: 100 }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.verification_body.idx_verification_expire_at, columns: [ deleted_at, expire_at ] }
    used_by:
      - cap.services.verification.cleanup

  - name: RevokeExhaustedVerifications
    description: "把尝试次数达到上限的 sent 验证体置为 revoked"
    tables:
      - { table: data.tables.verification_body, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: max_attempts, type: _types.basics.integer }
      - { name: status, type: data.enums.verification_status }
      - { name: limit, type: _types.basics.integer, nullable: true, default: 100 }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.verification_body.idx_verification_status_attempt, columns: [ deleted_at, status, attempt_count ] }
    used_by:
      - cap.services.verification.cleanup

  - name: RevokeActiveVerificationsByAuth
    description: "按认证目标作废活跃验证体"
    tables:
      - { table: data.tables.verification_body, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: auth_type, type: data.enums.auth_type, column: data.tables.verification_body.col.auth_type }
      - { name: auth_id, type: _types.basics.id, column: data.tables.verification_body.col.auth_id }
      - { name: purpose, type: data.enums.verification_purpose, column: data.tables.verification_body.col.purpose, nullable: true }
      - { name: status, type: data.enums.verification_status, column: data.tables.verification_body.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.verification_body.idx_verification_auth_purpose, columns: [ deleted_at, auth_type, auth_id, purpose ] }
    used_by:
      - cap.services.verification.revoke_by_auth
      - cap.services.verification.send

  - name: RevokeActiveVerificationsByAccount
    description: "按账号作废活跃验证体"
    tables:
      - { table: data.tables.verification_body, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: _types.basics.id, column: data.tables.verification_body.col.account_id }
      - { name: status, type: data.enums.verification_status, column: data.tables.verification_body.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.verification_body.idx_verification_account_id, columns: [ account_id ] }
    used_by:
      - cap.services.verification.revoke_by_account

  - name: CreateVerificationAction
    description: "追加验证动作记录"
    tables:
      - { table: data.tables.verification_action, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: verification_id, type: _types.basics.id, column: data.tables.verification_action.col.verification_id }
      - { name: account_id, type: _types.basics.id, column: data.tables.verification_action.col.account_id }
      - { name: result, type: data.enums.verification_result, column: data.tables.verification_action.col.result }
      - { name: request_ip, type: _types.basics.string, column: data.tables.verification_action.col.request_ip, nullable: true }
      - { name: device_id, type: _types.basics.string, column: data.tables.verification_action.col.device_id, nullable: true }
      - { name: location, type: _types.basics.string, column: data.tables.verification_action.col.location, nullable: true }
      - { name: input_hash, type: _types.basics.string, column: data.tables.verification_action.col.input_hash }
    returns:
      - { name: row, kind: entity, entity: data.entities.verification_action }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.verification_action.pk, columns: [ id ] }
    used_by:
      - cap.services.verification.record_failure
      - cap.services.verification.verify
