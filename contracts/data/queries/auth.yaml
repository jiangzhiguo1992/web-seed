# 认证查询集。

id: data.queries.auth
summary: "认证查询集"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "auth 查询不要向非认证调用方或跨模块返回 password_hash"
  - "auth_email/auth_phone/auth_pwd 的唯一键是全局唯一；软删不释放，创建前不要用过滤掉 deleted_at 的查询判重"

queries:
  - name: GetAuthPwdByUsername
    description: "按登录名读取密码认证记录"
    tables:
      - { table: data.tables.auth_pwd }
    params:
      - { name: ctx, type: context.Context }
      - { name: username, type: _types.string, column: data.tables.auth_pwd.col.username }
    returns:
      - { name: row, kind: entity, entity: data.entities.auth_pwd }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_pwd.uq_auth_pwd_username, columns: [ username ] }
    used_by:
      - cap.services.auth.login

  - name: CreateAuthPwd
    description: "创建密码认证记录"
    tables:
      - { table: data.tables.auth_pwd, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.auth_pwd.col.id }
      - { name: account_id, type: _types.id, column: data.tables.auth_pwd.col.account_id }
      - { name: status, type: data.enums.auth_status, column: data.tables.auth_pwd.col.status }
      - { name: username, type: _types.string, column: data.tables.auth_pwd.col.username }
      - { name: password_hash, type: _types.string, column: data.tables.auth_pwd.col.password_hash }
    returns:
      - { name: row, kind: entity, entity: data.entities.auth_pwd }
      - { name: err, kind: error }
    errors:
      - platform.errors.AUTH_USERNAME_TAKEN
      - platform.errors.AUTH_INVALID_CREDENTIALS
    index_ref:
      - { index: data.tables.auth_pwd.uq_auth_pwd_username, columns: [ username ] }
      - { index: data.tables.auth_pwd.uq_auth_pwd_account, columns: [ account_id ] }
    used_by:
      - cap.services.auth.bind_password

  - name: UpdateAuthPwdHash
    description: "更新密码哈希"
    tables:
      - { table: data.tables.auth_pwd, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.auth_pwd.col.id }
      - { name: password_hash, type: _types.string, column: data.tables.auth_pwd.col.password_hash }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_pwd.pk, columns: [ id ] }
    used_by:
      - cap.services.auth.bind_password

  - name: RecordAuthPwdLoginSuccess
    description: "记录登录成功并清零失败计数"
    tables:
      - { table: data.tables.auth_pwd, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.auth_pwd.col.id }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_pwd.pk, columns: [ id ] }
    used_by:
      - cap.services.auth.record_login_success

  - name: RecordAuthPwdLoginFailure
    description: "记录登录失败并写入锁定时间"
    tables:
      - { table: data.tables.auth_pwd, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.auth_pwd.col.id }
      - { name: lock_until, type: _types.timestamp, column: data.tables.auth_pwd.col.locked_until, nullable: true }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_pwd.pk, columns: [ id ] }
    used_by:
      - cap.services.auth.record_login_failure

  - name: GetAuthPhoneByNumber
    description: "按区号与手机号读取认证记录"
    tables:
      - { table: data.tables.auth_phone }
    params:
      - { name: ctx, type: context.Context }
      - { name: code, type: _types.string, column: data.tables.auth_phone.col.code }
      - { name: number, type: _types.string, column: data.tables.auth_phone.col.number }
    returns:
      - { name: row, kind: entity, entity: data.entities.auth_phone }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_phone.uq_auth_phone_number, columns: [ code, number ] }
    used_by:
      - cap.services.auth.login

  - name: CreateAuthPhone
    description: "创建手机号认证记录"
    tables:
      - { table: data.tables.auth_phone, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.auth_phone.col.id }
      - { name: account_id, type: _types.id, column: data.tables.auth_phone.col.account_id }
      - { name: status, type: data.enums.auth_status, column: data.tables.auth_phone.col.status }
      - { name: code, type: _types.string, column: data.tables.auth_phone.col.code }
      - { name: number, type: _types.string, column: data.tables.auth_phone.col.number }
      - { name: operator, type: _types.string, column: data.tables.auth_phone.col.operator, nullable: true }
    returns:
      - { name: row, kind: entity, entity: data.entities.auth_phone }
      - { name: err, kind: error }
    errors:
      - platform.errors.AUTH_PHONE_TAKEN
    index_ref:
      - { index: data.tables.auth_phone.uq_auth_phone_number, columns: [ code, number ] }
      - { index: data.tables.auth_phone.uq_auth_phone_account, columns: [ account_id ] }
    used_by:
      - cap.services.auth.bind_phone

  - name: GetAuthEmailByUsernameDomain
    description: "按本地部分与域名读取邮箱认证记录"
    tables:
      - { table: data.tables.auth_email }
    params:
      - { name: ctx, type: context.Context }
      - { name: username, type: _types.string, column: data.tables.auth_email.col.username }
      - { name: domain, type: _types.string, column: data.tables.auth_email.col.domain }
    returns:
      - { name: row, kind: entity, entity: data.entities.auth_email }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_email.uq_auth_email_username_domain, columns: [ username, domain ] }
    used_by:
      - cap.services.auth.login

  - name: CreateAuthEmail
    description: "创建邮箱认证记录"
    tables:
      - { table: data.tables.auth_email, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.auth_email.col.id }
      - { name: account_id, type: _types.id, column: data.tables.auth_email.col.account_id }
      - { name: status, type: data.enums.auth_status, column: data.tables.auth_email.col.status }
      - { name: username, type: _types.string, column: data.tables.auth_email.col.username }
      - { name: domain, type: _types.string, column: data.tables.auth_email.col.domain }
      - { name: entity, type: _types.string, column: data.tables.auth_email.col.entity, nullable: true }
      - { name: tld, type: _types.string, column: data.tables.auth_email.col.tld, nullable: true }
    returns:
      - { name: row, kind: entity, entity: data.entities.auth_email }
      - { name: err, kind: error }
    errors:
      - platform.errors.AUTH_EMAIL_TAKEN
      - platform.errors.AUTH_EMAIL_INVALID
    index_ref:
      - { index: data.tables.auth_email.uq_auth_email_username_domain, columns: [ username, domain ] }
      - { index: data.tables.auth_email.uq_auth_email_account, columns: [ account_id ] }
    used_by:
      - cap.services.auth.bind_email

  - name: GetAuthPwdById
    description: "按 ID 读取密码认证记录"
    tables:
      - { table: data.tables.auth_pwd }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.auth_pwd.col.id }
    returns:
      - { name: row, kind: entity, entity: data.entities.auth_pwd }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_pwd.pk, columns: [ id ] }
    used_by:
      - cap.services.auth.bind_password

  - name: GetAuthPhoneById
    description: "按 ID 读取手机号认证记录"
    tables:
      - { table: data.tables.auth_phone }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.auth_phone.col.id }
    returns:
      - { name: row, kind: entity, entity: data.entities.auth_phone }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_phone.pk, columns: [ id ] }
    used_by:
      - cap.services.auth.bind_phone

  - name: GetAuthEmailById
    description: "按 ID 读取邮箱认证记录"
    tables:
      - { table: data.tables.auth_email }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.auth_email.col.id }
    returns:
      - { name: row, kind: entity, entity: data.entities.auth_email }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_email.pk, columns: [ id ] }
    used_by:
      - cap.services.auth.bind_email

  - name: SoftDeleteAuthPwdByAccount
    description: "按账号软删全部密码认证记录"
    tables:
      - { table: data.tables.auth_pwd, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: _types.id, column: data.tables.auth_pwd.col.account_id }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_pwd.uq_auth_pwd_account, columns: [ account_id ] }
    used_by:
      - cap.services.auth.revoke_all_for_account

  - name: SoftDeleteAuthPhoneByAccount
    description: "按账号软删全部手机号认证记录"
    tables:
      - { table: data.tables.auth_phone, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: _types.id, column: data.tables.auth_phone.col.account_id }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_phone.uq_auth_phone_account, columns: [ account_id ] }
    used_by:
      - cap.services.auth.bind_phone
      - cap.services.auth.revoke_all_for_account

  - name: SoftDeleteAuthEmailByAccount
    description: "按账号软删全部邮箱认证记录"
    tables:
      - { table: data.tables.auth_email, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: _types.id, column: data.tables.auth_email.col.account_id }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_email.uq_auth_email_account, columns: [ account_id ] }
    used_by:
      - cap.services.auth.bind_email
      - cap.services.auth.revoke_all_for_account

  - name: SetAuthPhoneStatus
    description: "设置手机号认证状态"
    tables:
      - { table: data.tables.auth_phone, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.auth_phone.col.id }
      - { name: status, type: data.enums.auth_status, column: data.tables.auth_phone.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_phone.pk, columns: [ id ] }
    used_by:
      - cap.services.auth.bind_phone
      - cap.services.verification.verify

  - name: SetAuthEmailStatus
    description: "设置邮箱认证状态"
    tables:
      - { table: data.tables.auth_email, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.auth_email.col.id }
      - { name: status, type: data.enums.auth_status, column: data.tables.auth_email.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_email.pk, columns: [ id ] }
    used_by:
      - cap.services.auth.bind_email
      - cap.services.verification.verify

  - name: SetAuthPwdStatus
    description: "设置密码认证状态"
    tables:
      - { table: data.tables.auth_pwd, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.id, column: data.tables.auth_pwd.col.id }
      - { name: status, type: data.enums.auth_status, column: data.tables.auth_pwd.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.auth_pwd.pk, columns: [ id ] }
    used_by:
      - cap.services.auth.bind_password
