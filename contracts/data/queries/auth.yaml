# 认证查询集。

id: data.queries.auth
summary: "认证查询集"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "auth 之外的普通业务查询不要引用本文件"
  - "auth 查询不要返回 password_hash 给非认证调用方"
  - "auth 查询返回 kind:table，不要改成 entity 隐式投影（会丢 secret 或扩大行形状）"

queries:
  - name: GetAuthPwdByUsername
    tables:
      - { table: data.tables.auth_pwd }
    params:
      - { name: username, type: text, column: data.tables.auth_pwd.col.username }
    returns:
      - name: row
        kind: table
        table: data.tables.auth_pwd
        columns:
          - id
          - account_id
          - username
          - password_hash
          - failed_login_count
          - locked_until
          - status
    index_ref: [ data.tables.auth_pwd.uq_auth_pwd_username ]
    used_by:
      - cap.methods.auth.login

  - name: CreateAuthPwd
    tables:
      - { table: data.tables.auth_pwd, write: true }
    params:
      - { name: id, type: integer, column: data.tables.auth_pwd.col.id }
      - { name: account_id, type: integer, column: data.tables.auth_pwd.col.account_id }
      - { name: status, type: data.enums.auth_status, column: data.tables.auth_pwd.col.status }
      - { name: username, type: text, column: data.tables.auth_pwd.col.username }
      - { name: password_hash, type: text, column: data.tables.auth_pwd.col.password_hash }
    returns:
      - name: row
        kind: table
        table: data.tables.auth_pwd
        columns:
          - id
          - account_id
          - username
          - status
          - created_at
          - updated_at
    index_ref:
      - data.tables.auth_pwd.uq_auth_pwd_username
      - data.tables.auth_pwd.uq_auth_pwd_account
    used_by:
      - cap.methods.auth.bind_password

  - name: UpdateAuthPwdHash
    tables:
      - { table: data.tables.auth_pwd, write: true }
    params:
      - { name: id, type: integer, column: data.tables.auth_pwd.col.id }
      - { name: password_hash, type: text, column: data.tables.auth_pwd.col.password_hash }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.auth_pwd.pk ]
    used_by:
      - cap.methods.auth.bind_password

  - name: RecordAuthPwdLoginSuccess
    tables:
      - { table: data.tables.auth_pwd, write: true }
    params:
      - { name: id, type: integer, column: data.tables.auth_pwd.col.id }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.auth_pwd.pk ]
    used_by:
      - cap.methods.auth.login

  - name: RecordAuthPwdLoginFailure
    tables:
      - { table: data.tables.auth_pwd, write: true }
    params:
      - { name: id, type: integer, column: data.tables.auth_pwd.col.id }
      - { name: lock_until, type: timestamp, column: data.tables.auth_pwd.col.locked_until, nullable: true }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.auth_pwd.pk ]
    used_by:
      - cap.methods.auth.login

  - name: GetAuthPhoneByNumber
    tables:
      - { table: data.tables.auth_phone }
    params:
      - { name: code, type: text, column: data.tables.auth_phone.col.code }
      - { name: number, type: text, column: data.tables.auth_phone.col.number }
    returns:
      - name: row
        kind: table
        table: data.tables.auth_phone
        columns:
          - id
          - account_id
          - code
          - number
          - operator
          - status
    index_ref: [ data.tables.auth_phone.uq_auth_phone_number ]
    used_by:
      - cap.methods.auth.login

  - name: CreateAuthPhone
    tables:
      - { table: data.tables.auth_phone, write: true }
    params:
      - { name: id, type: integer, column: data.tables.auth_phone.col.id }
      - { name: account_id, type: integer, column: data.tables.auth_phone.col.account_id }
      - { name: status, type: data.enums.auth_status, column: data.tables.auth_phone.col.status }
      - { name: code, type: text, column: data.tables.auth_phone.col.code }
      - { name: number, type: text, column: data.tables.auth_phone.col.number }
      - { name: operator, type: text, column: data.tables.auth_phone.col.operator, nullable: true }
    returns:
      - name: row
        kind: table
        table: data.tables.auth_phone
        columns:
          - id
          - account_id
          - code
          - number
          - operator
          - status
          - created_at
          - updated_at
    index_ref:
      - data.tables.auth_phone.uq_auth_phone_number
      - data.tables.auth_phone.uq_auth_phone_account
    used_by:
      - cap.methods.auth.bind_phone

  - name: GetAuthEmailByUsernameDomain
    tables:
      - { table: data.tables.auth_email }
    params:
      - { name: username, type: text, column: data.tables.auth_email.col.username }
      - { name: domain, type: text, column: data.tables.auth_email.col.domain }
    returns:
      - name: row
        kind: table
        table: data.tables.auth_email
        columns:
          - id
          - account_id
          - username
          - domain
          - entity
          - tld
          - status
    index_ref: [ data.tables.auth_email.uq_auth_email_username_domain ]
    used_by:
      - cap.methods.auth.login

  - name: CreateAuthEmail
    tables:
      - { table: data.tables.auth_email, write: true }
    params:
      - { name: id, type: integer, column: data.tables.auth_email.col.id }
      - { name: account_id, type: integer, column: data.tables.auth_email.col.account_id }
      - { name: status, type: data.enums.auth_status, column: data.tables.auth_email.col.status }
      - { name: username, type: text, column: data.tables.auth_email.col.username }
      - { name: domain, type: text, column: data.tables.auth_email.col.domain }
      - { name: entity, type: text, column: data.tables.auth_email.col.entity, nullable: true }
      - { name: tld, type: text, column: data.tables.auth_email.col.tld, nullable: true }
    returns:
      - name: row
        kind: table
        table: data.tables.auth_email
        columns:
          - id
          - account_id
          - username
          - domain
          - entity
          - tld
          - status
          - created_at
          - updated_at
    index_ref:
      - data.tables.auth_email.uq_auth_email_username_domain
      - data.tables.auth_email.uq_auth_email_account
    used_by:
      - cap.methods.auth.bind_email

  - name: SoftDeleteAuthPwdByAccount
    tables:
      - { table: data.tables.auth_pwd, write: true }
    params:
      - { name: account_id, type: integer, column: data.tables.auth_pwd.col.account_id }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.auth_pwd.uq_auth_pwd_account ]
    used_by:
      - cap.methods.auth.revoke_all_for_account

  - name: SoftDeleteAuthPhoneByAccount
    tables:
      - { table: data.tables.auth_phone, write: true }
    params:
      - { name: account_id, type: integer, column: data.tables.auth_phone.col.account_id }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.auth_phone.uq_auth_phone_account ]
    used_by:
      - cap.methods.auth.revoke_all_for_account

  - name: SoftDeleteAuthEmailByAccount
    tables:
      - { table: data.tables.auth_email, write: true }
    params:
      - { name: account_id, type: integer, column: data.tables.auth_email.col.account_id }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.auth_email.uq_auth_email_account ]
    used_by:
      - cap.methods.auth.revoke_all_for_account

  - name: SetAuthPhoneStatus
    tables:
      - { table: data.tables.auth_phone, write: true }
    params:
      - { name: id, type: integer, column: data.tables.auth_phone.col.id }
      - { name: status, type: data.enums.auth_status, column: data.tables.auth_phone.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.auth_phone.pk ]
    used_by:
      - cap.methods.auth.bind_phone

  - name: SetAuthEmailStatus
    tables:
      - { table: data.tables.auth_email, write: true }
    params:
      - { name: id, type: integer, column: data.tables.auth_email.col.id }
      - { name: status, type: data.enums.auth_status, column: data.tables.auth_email.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.auth_email.pk ]
    used_by:
      - cap.methods.auth.bind_email

  - name: SetAuthPwdStatus
    tables:
      - { table: data.tables.auth_pwd, write: true }
    params:
      - { name: id, type: integer, column: data.tables.auth_pwd.col.id }
      - { name: status, type: data.enums.auth_status, column: data.tables.auth_pwd.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.auth_pwd.pk ]
    used_by:
      - cap.methods.auth.bind_password
