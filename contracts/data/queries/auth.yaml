# 认证查询集。

id: data.queries.auth
summary: "认证查询集"
owner_module: auth
schema_version: 1
stability: draft
do_not:
  - "auth 之外的普通业务查询不要引用本文件"
  - "auth 查询不要返回 password_hash / access_token / refresh_token 给非认证调用方"
  - "auth 查询返回 kind:table，不要改成 entity 隐式投影（会丢 secret 或扩大行形状）"

queries:
  - name: GetAuthPwdByUsername
    tables:
      - data.tables.auth_pwd
    params:
      - { name: username, type: text, column: data.tables.auth_pwd.col.username }
    returns:
      - name: row
        kind: table
        table: data.tables.auth_pwd
        columns:
          - id
          - account_id
          - username
          - password_hash
          - failed_login_count
          - locked_until
          - status
    index_ref: [ data.tables.auth_pwd.uq_auth_pwd_username ]

  - name: CreateAuthPwd
    tables:
      - data.tables.auth_pwd
    params:
      - { name: id, type: integer, column: data.tables.auth_pwd.col.id }
      - { name: account_id, type: integer, column: data.tables.auth_pwd.col.account_id }
      - { name: username, type: text, column: data.tables.auth_pwd.col.username }
      - { name: password_hash, type: text, column: data.tables.auth_pwd.col.password_hash }
    returns:
      - name: row
        kind: table
        table: data.tables.auth_pwd
        columns:
          - id
          - account_id
          - username
          - status
          - created_at
          - updated_at
    index_ref:
      - data.tables.auth_pwd.uq_auth_pwd_username
      - data.tables.auth_pwd.uq_auth_pwd_account

  - name: UpdateAuthPwdHash
    tables:
      - data.tables.auth_pwd
    params:
      - { name: id, type: integer, column: data.tables.auth_pwd.col.id }
      - { name: password_hash, type: text, column: data.tables.auth_pwd.col.password_hash }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.auth_pwd.pk ]

  - name: RecordAuthPwdLoginSuccess
    tables:
      - data.tables.auth_pwd
    params:
      - { name: id, type: integer, column: data.tables.auth_pwd.col.id }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.auth_pwd.pk ]

  - name: RecordAuthPwdLoginFailure
    tables:
      - data.tables.auth_pwd
    params:
      - { name: id, type: integer, column: data.tables.auth_pwd.col.id }
      - { name: lock_until, type: timestamp, column: data.tables.auth_pwd.col.locked_until, nullable: true }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.auth_pwd.pk ]

  - name: GetAuthPhoneByNumber
    tables:
      - data.tables.auth_phone
    params:
      - { name: code, type: text, column: data.tables.auth_phone.col.code }
      - { name: number, type: text, column: data.tables.auth_phone.col.number }
    returns:
      - name: row
        kind: table
        table: data.tables.auth_phone
        columns:
          - id
          - account_id
          - code
          - number
          - operator
          - status
    index_ref: [ data.tables.auth_phone.uq_auth_phone_number ]

  - name: CreateAuthPhone
    tables:
      - data.tables.auth_phone
    params:
      - { name: id, type: integer, column: data.tables.auth_phone.col.id }
      - { name: account_id, type: integer, column: data.tables.auth_phone.col.account_id }
      - { name: code, type: text, column: data.tables.auth_phone.col.code }
      - { name: number, type: text, column: data.tables.auth_phone.col.number }
      - { name: operator, type: text, column: data.tables.auth_phone.col.operator, nullable: true }
    returns:
      - name: row
        kind: table
        table: data.tables.auth_phone
        columns:
          - id
          - account_id
          - code
          - number
          - operator
          - status
          - created_at
          - updated_at
    index_ref: [ data.tables.auth_phone.uq_auth_phone_number ]

  - name: GetAuthEmailByUsernameDomain
    tables:
      - data.tables.auth_email
    params:
      - { name: username, type: text, column: data.tables.auth_email.col.username }
      - { name: domain, type: text, column: data.tables.auth_email.col.domain }
    returns:
      - name: row
        kind: table
        table: data.tables.auth_email
        columns:
          - id
          - account_id
          - username
          - domain
          - entity
          - tld
          - status
    index_ref: [ data.tables.auth_email.uq_auth_email_username_domain ]

  - name: CreateAuthEmail
    tables:
      - data.tables.auth_email
    params:
      - { name: id, type: integer, column: data.tables.auth_email.col.id }
      - { name: account_id, type: integer, column: data.tables.auth_email.col.account_id }
      - { name: username, type: text, column: data.tables.auth_email.col.username }
      - { name: domain, type: text, column: data.tables.auth_email.col.domain }
      - { name: entity, type: text, column: data.tables.auth_email.col.entity, nullable: true }
      - { name: tld, type: text, column: data.tables.auth_email.col.tld, nullable: true }
    returns:
      - name: row
        kind: table
        table: data.tables.auth_email
        columns:
          - id
          - account_id
          - username
          - domain
          - entity
          - tld
          - status
          - created_at
          - updated_at
    index_ref: [ data.tables.auth_email.uq_auth_email_username_domain ]

  - name: CreateToken
    tables:
      - data.tables.token
    params:
      - { name: id, type: integer, column: data.tables.token.col.id }
      - { name: own_type, type: data.enums.own_type, column: data.tables.token.col.own_type }
      - { name: own_id, type: integer, column: data.tables.token.col.own_id }
      - { name: account_id, type: integer, column: data.tables.token.col.account_id }
      - { name: device_id, type: text, column: data.tables.token.col.device_id, nullable: true }
      - { name: user_id, type: integer, column: data.tables.token.col.user_id, nullable: true }
      - { name: access_token_hash, type: text, column: data.tables.token.col.access_token_hash }
      - { name: refresh_token_hash, type: text, column: data.tables.token.col.refresh_token_hash }
      - { name: access_expire_at, type: timestamp, column: data.tables.token.col.access_expire_at }
      - { name: refresh_expire_at, type: timestamp, column: data.tables.token.col.refresh_expire_at }
    returns:
      - name: row
        kind: table
        table: data.tables.token
        columns:
          - id
          - account_id
          - device_id
          - access_expire_at
          - refresh_expire_at
          - status
    index_ref:
      - data.tables.token.uq_token_access_hash
      - data.tables.token.uq_token_refresh_hash

  - name: GetTokenByRefresh
    tables:
      - data.tables.token
    params:
      - { name: refresh_token_hash, type: text, column: data.tables.token.col.refresh_token_hash }
    returns:
      - name: row
        kind: table
        table: data.tables.token
        columns:
          - id
          - account_id
          - device_id
          - user_id
          - access_expire_at
          - refresh_expire_at
          - status
    index_ref: [ data.tables.token.uq_token_refresh_hash ]

  - name: GetTokenByAccess
    tables:
      - data.tables.token
    params:
      - { name: access_token_hash, type: text, column: data.tables.token.col.access_token_hash }
    returns:
      - name: row
        kind: table
        table: data.tables.token
        columns:
          - id
          - account_id
          - device_id
          - user_id
          - access_expire_at
          - refresh_expire_at
          - status
    index_ref: [ data.tables.token.uq_token_access_hash ]

  - name: RevokeToken
    tables:
      - data.tables.token
    params:
      - { name: refresh_token_hash, type: text, column: data.tables.token.col.refresh_token_hash }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.token.uq_token_refresh_hash ]

  - name: DeleteExpiredTokens
    tables:
      - data.tables.token
    params:
      - { name: limit, type: integer, nullable: true, default: 100 }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.token.idx_token_refresh_expire_at ]

  - name: ListTokensByAccount
    tables:
      - data.tables.token
    params:
      - { name: offset, type: integer, nullable: true, default: 0 }
      - { name: limit, type: integer, nullable: true, default: 20 }
      - { name: account_id, type: integer, column: data.tables.token.col.account_id }
    returns:
      - name: rows
        list: true
        kind: table
        table: data.tables.token
        columns:
          - id
          - account_id
          - device_id
          - access_expire_at
          - refresh_expire_at
          - status
          - created_at
          - updated_at
    index_ref: [ data.tables.token.idx_token_account_id ]
