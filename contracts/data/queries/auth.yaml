# 认证查询集。密码/手机/邮箱/令牌查询只在这里出现。
#
# 规则：
#   - 敏感表必须显式写 return_columns；不得 SELECT *。
#   - password_md5 / token 字段只能由认证流程使用。
#   - 每个 query 必须有显式 id；capabilities 只能引用 id。

schema_version: 1
id: data.queries.auth
summary: "认证查询集"
stability: draft
module: auth
do_not:
  - "不要让普通业务查询引用本文件"
  - "不要返回 password_md5 / access_token / refresh_token 给非认证调用方"
  - "不要写 SELECT *"

queries:
  - id: data.queries.auth.get_auth_pwd_by_username
    name: GetAuthPwdByUsername
    kind: one
    table: data.tables.auth_pwd
    params:
      - { name: username, type: text }
    returns: data.tables.auth_pwd.row
    return_columns: [id, account_id, username, password_hash, password_md5, failed_login_count, locked_until, status]
    semantics: "仅供登录校验；包含 password_hash 与遗留 password_md5"
    sql: |
      SELECT id, account_id, username, password_hash, password_md5,
             failed_login_count, locked_until, status
      FROM auth_pwd
      WHERE username = @username AND deleted_at IS NULL;

  - id: data.queries.auth.create_auth_pwd
    name: CreateAuthPwd
    kind: one
    table: data.tables.auth_pwd
    params:
      - { name: id, type: text }
      - { name: account_id, type: text }
      - { name: username, type: text }
      - { name: password_hash, type: text, nullable: true }
      - { name: password_md5, type: text, nullable: true }
    returns: data.tables.auth_pwd.row
    return_columns: [id, account_id, username, status, created_at, updated_at]
    semantics: "创建密码认证记录；password_hash/password_md5 至少一个，均不返回"
    sql: |
      INSERT INTO auth_pwd (id, account_id, username, password_hash, password_md5, status)
      VALUES (@id, @account_id, @username,
              sqlc.narg('password_hash'), sqlc.narg('password_md5'), 0)
      RETURNING id, account_id, username, status, created_at, updated_at;

  - id: data.queries.auth.update_auth_pwd_hash
    name: UpdateAuthPwdHash
    kind: execrows
    table: data.tables.auth_pwd
    params:
      - { name: id, type: text }
      - { name: password_hash, type: text }
    returns: affected_rows
    semantics: "设置新 argon2id 哈希并清空遗留 MD5；成功后应吊销该账号全部令牌"
    sql: |
      UPDATE auth_pwd
      SET password_hash = @password_hash, password_md5 = NULL, updated_at = now()
      WHERE id = @id AND deleted_at IS NULL;

  - id: data.queries.auth.record_auth_pwd_login_success
    name: RecordAuthPwdLoginSuccess
    kind: execrows
    table: data.tables.auth_pwd
    params:
      - { name: id, type: text }
    returns: affected_rows
    semantics: "成功登录后重置失败计数与锁定"
    sql: |
      UPDATE auth_pwd
      SET failed_login_count = 0, locked_until = NULL, updated_at = now()
      WHERE id = @id AND deleted_at IS NULL;

  - id: data.queries.auth.record_auth_pwd_login_failure
    name: RecordAuthPwdLoginFailure
    kind: execrows
    table: data.tables.auth_pwd
    params:
      - { name: id, type: text }
      - { name: lock_until, type: timestamp, nullable: true }
    returns: affected_rows
    semantics: "失败计数 +1；达到阈值时设置 locked_until"
    sql: |
      UPDATE auth_pwd
      SET failed_login_count = failed_login_count + 1,
          locked_until = COALESCE(sqlc.narg('lock_until'), locked_until),
          updated_at = now()
      WHERE id = @id AND deleted_at IS NULL;

  - id: data.queries.auth.get_auth_phone_by_number
    name: GetAuthPhoneByNumber
    kind: one
    table: data.tables.auth_phone
    params:
      - { name: code, type: text }
      - { name: number, type: text }
    returns: data.tables.auth_phone.row
    return_columns: [id, account_id, code, number, operator, status]
    semantics: "按区号 + 手机号登录/校验"
    sql: |
      SELECT id, account_id, code, number, operator, status
      FROM auth_phone
      WHERE code = @code AND number = @number AND deleted_at IS NULL;

  - id: data.queries.auth.create_auth_phone
    name: CreateAuthPhone
    kind: one
    table: data.tables.auth_phone
    params:
      - { name: id, type: text }
      - { name: account_id, type: text }
      - { name: code, type: text }
      - { name: number, type: text }
      - { name: operator, type: text, nullable: true }
    returns: data.tables.auth_phone.row
    return_columns: [id, account_id, code, number, operator, status, created_at, updated_at]
    semantics: "绑定手机号"
    sql: |
      INSERT INTO auth_phone (id, account_id, code, number, operator, status)
      VALUES (@id, @account_id, @code, @number, sqlc.narg('operator'), 0)
      RETURNING id, account_id, code, number, operator, status, created_at, updated_at;

  - id: data.queries.auth.get_auth_email_by_username_domain
    name: GetAuthEmailByUsernameDomain
    kind: one
    table: data.tables.auth_email
    params:
      - { name: username, type: text }
      - { name: domain, type: text }
    returns: data.tables.auth_email.row
    return_columns: [id, account_id, username, domain, entity, tld, status]
    semantics: "按邮箱本地部分 + 域名登录/校验"
    sql: |
      SELECT id, account_id, username, domain, entity, tld, status
      FROM auth_email
      WHERE username = @username AND domain = @domain AND deleted_at IS NULL;

  - id: data.queries.auth.create_auth_email
    name: CreateAuthEmail
    kind: one
    table: data.tables.auth_email
    params:
      - { name: id, type: text }
      - { name: account_id, type: text }
      - { name: username, type: text }
      - { name: domain, type: text }
      - { name: entity, type: text, nullable: true }
      - { name: tld, type: text, nullable: true }
    returns: data.tables.auth_email.row
    return_columns: [id, account_id, username, domain, entity, tld, status, created_at, updated_at]
    semantics: "绑定邮箱；domain 入库前小写归一"
    sql: |
      INSERT INTO auth_email (id, account_id, username, domain, entity, tld, status)
      VALUES (@id, @account_id, @username, lower(@domain),
              sqlc.narg('entity'), sqlc.narg('tld'), 0)
      RETURNING id, account_id, username, domain, entity, tld, status, created_at, updated_at;

  - id: data.queries.auth.create_token
    name: CreateToken
    kind: one
    table: data.tables.token
    params:
      - { name: id, type: text }
      - { name: own_type, type: text }
      - { name: own_id, type: text }
      - { name: account_id, type: text }
      - { name: device_id, type: text, nullable: true }
      - { name: user_id, type: text, nullable: true }
      - { name: access_token_hash, type: text }
      - { name: refresh_token_hash, type: text }
      - { name: access_expire_at, type: timestamp }
      - { name: refresh_expire_at, type: timestamp }
    returns: data.tables.token.row
    return_columns: [id, account_id, device_id, access_expire_at, refresh_expire_at, status]
    semantics: "创建令牌对；数据库只存哈希，原文由调用方返回一次"
    sql: |
      INSERT INTO tokens (
        id, own_type, own_id, account_id, device_id, user_id,
        access_token_hash, refresh_token_hash, access_expire_at, refresh_expire_at, status
      )
      VALUES (
        @id, @own_type, @own_id, @account_id,
        sqlc.narg('device_id'), sqlc.narg('user_id'),
        @access_token_hash, @refresh_token_hash, @access_expire_at, @refresh_expire_at, 0
      )
      RETURNING id, account_id, device_id, access_expire_at, refresh_expire_at, status;

  - id: data.queries.auth.get_token_by_refresh
    name: GetTokenByRefresh
    kind: one
    table: data.tables.token
    params:
      - { name: refresh_token_hash, type: text }
    returns: data.tables.token.row
    return_columns: [id, account_id, device_id, user_id, access_expire_at, refresh_expire_at, status]
    semantics: "仅供刷新流程；按哈希查找，不返回哈希原文"
    sql: |
      SELECT id, account_id, device_id, user_id, access_expire_at,
             refresh_expire_at, status
      FROM tokens
      WHERE refresh_token_hash = @refresh_token_hash AND deleted_at IS NULL;

  - id: data.queries.auth.get_token_by_access
    name: GetTokenByAccess
    kind: one
    table: data.tables.token
    params:
      - { name: access_token_hash, type: text }
    returns: data.tables.token.row
    return_columns: [id, account_id, device_id, user_id, access_expire_at, refresh_expire_at, status]
    semantics: "校验访问令牌；按哈希查找"
    sql: |
      SELECT id, account_id, device_id, user_id, access_expire_at,
             refresh_expire_at, status
      FROM tokens
      WHERE access_token_hash = @access_token_hash AND deleted_at IS NULL;

  - id: data.queries.auth.revoke_token
    name: RevokeToken
    kind: execrows
    table: data.tables.token
    params:
      - { name: refresh_token_hash, type: text }
    returns: affected_rows
    semantics: "吊销单个刷新令牌；幂等"
    sql: |
      UPDATE tokens
      SET status = 1, updated_at = now()
      WHERE refresh_token_hash = @refresh_token_hash
        AND deleted_at IS NULL
        AND status = 0;

  - id: data.queries.auth.delete_expired_tokens
    name: DeleteExpiredTokens
    kind: execrows
    table: data.tables.token
    params:
      - { name: batch_size, type: integer, min: 1, max: 1000, default: 100 }
    returns: affected_rows
    semantics: "软删过期令牌；供清理任务使用"
    sql: |
      UPDATE tokens
      SET deleted_at = now(), updated_at = now(), status = 2
      WHERE id IN (
        SELECT id FROM tokens
        WHERE refresh_expire_at < now() AND deleted_at IS NULL
        ORDER BY refresh_expire_at
        LIMIT @batch_size
      );

  - id: data.queries.auth.list_tokens_by_account
    name: ListTokensByAccount
    kind: many
    table: data.tables.token
    params:
      - { name: account_id, type: text }
    returns: "[]data.tables.token.row"
    return_columns: [id, account_id, device_id, access_expire_at, refresh_expire_at, status, created_at, updated_at]
    semantics: "列出账号的设备令牌；不返回 token 原文"
    sql: |
      SELECT id, account_id, device_id, access_expire_at, refresh_expire_at,
             status, created_at, updated_at
      FROM tokens
      WHERE account_id = @account_id AND deleted_at IS NULL AND status = 0
      ORDER BY created_at DESC;
