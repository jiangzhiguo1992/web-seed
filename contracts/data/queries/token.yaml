# 令牌查询集。

id: data.queries.token
summary: "令牌查询集"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "token 之外的普通业务查询不要引用本文件"
  - "token 查询不要向非认证调用方返回 access_token_hash / refresh_token_hash"

queries:
  - name: CreateToken
    description: "创建访问与刷新令牌记录"
    tables:
      - { table: data.tables.token, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: integer, column: data.tables.token.col.id }
      - { name: account_id, type: integer, column: data.tables.token.col.account_id }
      - { name: device_id, type: text, column: data.tables.token.col.device_id, nullable: true }
      - { name: user_id, type: integer, column: data.tables.token.col.user_id, nullable: true }
      - { name: access_token_hash, type: text, column: data.tables.token.col.access_token_hash }
      - { name: refresh_token_hash, type: text, column: data.tables.token.col.refresh_token_hash }
      - { name: access_expire_at, type: timestamp, column: data.tables.token.col.access_expire_at }
      - { name: refresh_expire_at, type: timestamp, column: data.tables.token.col.refresh_expire_at }
    returns:
      - { name: row, kind: entity, entity: data.entities.token }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - data.tables.token.uq_token_access_hash
      - data.tables.token.uq_token_refresh_hash
    used_by:
      - cap.services.token.issue
      - cap.services.token.refresh

  - name: GetTokenByRefresh
    description: "按刷新令牌哈希读取令牌"
    tables:
      - { table: data.tables.token }
    params:
      - { name: ctx, type: context.Context }
      - { name: refresh_token_hash, type: text, column: data.tables.token.col.refresh_token_hash }
    returns:
      - { name: row, kind: entity, entity: data.entities.token }
      - { name: err, kind: error }
    errors: [ ]
    index_ref: [ data.tables.token.uq_token_refresh_hash ]
    used_by:
      - cap.services.token.logout
      - cap.services.token.refresh

  - name: GetTokenByAccess
    description: "按访问令牌哈希读取令牌"
    tables:
      - { table: data.tables.token }
    params:
      - { name: ctx, type: context.Context }
      - { name: access_token_hash, type: text, column: data.tables.token.col.access_token_hash }
    returns:
      - { name: row, kind: entity, entity: data.entities.token }
      - { name: err, kind: error }
    errors: [ ]
    index_ref: [ data.tables.token.uq_token_access_hash ]
    used_by:
      - cap.services.token.verify

  - name: RevokeToken
    description: "吊销单个令牌并记录原因"
    tables:
      - { table: data.tables.token, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: refresh_token_hash, type: text, column: data.tables.token.col.refresh_token_hash }
      - { name: revoked_at, type: timestamp, column: data.tables.token.col.revoked_at }
      - { name: revoke_reason, type: data.enums.token_revoke_reason, column: data.tables.token.col.revoke_reason }
      - { name: replaced_by_id, type: integer, column: data.tables.token.col.replaced_by_id, nullable: true }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors:
      - platform.errors.AUTH_TOKEN_INVALID
    index_ref: [ data.tables.token.uq_token_refresh_hash ]
    used_by:
      - cap.services.token.logout
      - cap.services.token.refresh

  - name: RevokeTokensByAccount
    description: "按账号批量吊销令牌"
    tables:
      - { table: data.tables.token, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: integer, column: data.tables.token.col.account_id }
      - { name: revoked_at, type: timestamp, column: data.tables.token.col.revoked_at }
      - { name: revoke_reason, type: data.enums.token_revoke_reason, column: data.tables.token.col.revoke_reason }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref: [ data.tables.token.idx_token_account_status ]
    used_by:
      - cap.services.token.revoke_by_account

  - name: DeleteExpiredTokens
    description: "物理清理已过期的令牌"
    tables:
      - { table: data.tables.token, write: true }
    params:
      - { name: ctx, type: context.Context }
      - { name: limit, type: integer, nullable: true, default: 100 }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors: [ ]
    index_ref: [ data.tables.token.idx_token_refresh_expire_at ]
    used_by:
      - cap.services.token.purge_expired

