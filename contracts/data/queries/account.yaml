# 账号查询集。SQL 是结构化契约字段，queries/*.sql 由它生成。
#
# 规则：
#   - 每个 query 必须有显式 id；capabilities 只能引用 id。
#   - 每个 query 必须写 index_columns；内层列表按顺序匹配索引最左前缀或主键。
#   - nullable 参数在 SQL 表达式中使用 sqlc.narg('name')，非 nullable 使用 @name。
#   - 账号表不含敏感字段，允许返回 data.tables.account.row。

schema_version: 1
id: data.queries.account
summary: "账号查询集"
stability: stable
module: accounts
do_not:
  - "account 之外的邮箱/手机号/密码查询不要写在这里，去 data.queries.auth"
  - "account.number 唯一性查询必须带 deleted_at IS NULL"
  - "account 查询不要写 SELECT *；返回列必须显式列出"

queries:
  - id: data.queries.account.get_account
    name: GetAccount
    kind: one
    table: data.tables.account
    params:
      - { name: id, type: text }
    returns: data.entities.account
    semantics: "已软删视为不存在；直接投影为账号实体"
    index_columns: [[id]]
    sql:
      statement: select
      from: data.tables.account
      select:
        - id
        - own_type
        - own_id
        - number
        - nickname
        - user_id
        - status
        - version
        - created_at
        - updated_at
        - deleted_at
      where:
        - "id = @id"
        - "deleted_at IS NULL"

  - id: data.queries.account.get_account_by_number
    name: GetAccountByNumber
    kind: one
    table: data.tables.account
    params:
      - { name: number, type: text }
    returns: data.entities.account
    semantics: "按账号编号精确查询；已软删视为不存在；投影为账号实体"
    index_columns: [[number]]
    sql:
      statement: select
      from: data.tables.account
      select:
        - id
        - own_type
        - own_id
        - number
        - nickname
        - user_id
        - status
        - version
        - created_at
        - updated_at
        - deleted_at
      where:
        - "number = upper(@number)"
        - "deleted_at IS NULL"

  - id: data.queries.account.exists_account_number
    name: ExistsAccountNumber
    kind: one
    table: data.tables.account
    params:
      - { name: number, type: text }
    returns: boolean
    semantics: "未删除账号内编号是否存在"
    index_columns: [[number]]
    sql:
      statement: select
      from: data.tables.account
      select:
        - "EXISTS (SELECT 1 FROM accounts WHERE number = upper(@number) AND deleted_at IS NULL)"

  - id: data.queries.account.list_accounts
    name: ListAccounts
    kind: many
    table: data.tables.account
    params:
      - { name: status, type: integer, nullable: true }
      - { name: own_type, type: text, nullable: true }
      - { name: cursor_created_at, type: timestamp, nullable: true }
      - { name: cursor_id, type: text, nullable: true }
      - { name: page_size, type: integer, max: 100, default: 20 }
    returns: "[]data.entities.account"
    semantics: "按 created_at DESC, id DESC 游标分页；status/own_type 为空不过滤；投影为账号实体"
    index_columns: [[created_at, id], [own_type]]
    sql:
      statement: select
      from: data.tables.account
      select:
        - id
        - own_type
        - own_id
        - number
        - nickname
        - user_id
        - status
        - version
        - created_at
        - updated_at
        - deleted_at
      where:
        - "deleted_at IS NULL"
        - "(sqlc.narg('status')::integer IS NULL OR status = sqlc.narg('status'))"
        - "(sqlc.narg('own_type')::text IS NULL OR own_type = sqlc.narg('own_type'))"
        - "(sqlc.narg('cursor_created_at')::timestamp IS NULL OR (created_at, id) < (sqlc.narg('cursor_created_at'), sqlc.narg('cursor_id')))"
      order_by:
        - "created_at DESC"
        - "id DESC"
      limit: "sqlc.arg('page_size')"

  - id: data.queries.account.create_account
    name: CreateAccount
    kind: one
    table: data.tables.account
    params:
      - { name: id, type: text }
      - { name: own_type, type: text }
      - { name: own_id, type: text }
      - { name: number, type: text }
      - { name: nickname, type: text }
      - { name: user_id, type: text, nullable: true }
    returns: data.entities.account
    semantics: "初始状态 pending(0)；number 入库前大写归一；RETURNING 投影为账号实体"
    index_columns: [[number]]
    sql:
      statement: insert
      into: data.tables.account
      columns: [ id, own_type, own_id, number, nickname, user_id, status ]
      values: [ "@id", "@own_type", "@own_id", "upper(@number)", "@nickname", "sqlc.narg('user_id')", "0" ]
      returning:
        - id
        - own_type
        - own_id
        - number
        - nickname
        - user_id
        - status
        - version
        - created_at
        - updated_at
        - deleted_at

  - id: data.queries.account.update_account
    name: UpdateAccount
    kind: execrows
    table: data.tables.account
    params:
      - { name: id, type: text }
      - { name: nickname, type: text }
      - { name: version, type: integer }
    returns: affected_rows
    semantics: "乐观锁；返回 0 表示版本冲突"
    index_columns: [[id]]
    sql:
      statement: update
      from: data.tables.account
      set:
        - "nickname = @nickname"
        - "updated_at = now()"
        - "version = version + 1"
      where:
        - "id = @id"
        - "version = @version"
        - "deleted_at IS NULL"

  - id: data.queries.account.set_account_status
    name: SetAccountStatus
    kind: execrows
    table: data.tables.account
    params:
      - { name: id, type: text }
      - { name: status, type: integer }
      - { name: version, type: integer }
    returns: affected_rows
    semantics: "只允许非 deleted(3) 状态；deleted 只能走 soft_delete_account"
    index_columns: [[id]]
    sql:
      statement: update
      from: data.tables.account
      set:
        - "status = @status"
        - "updated_at = now()"
        - "version = version + 1"
      where:
        - "id = @id"
        - "version = @version"
        - "deleted_at IS NULL"
        - "status <> 3"
        - "@status <> 3"

  - id: data.queries.account.soft_delete_account
    name: SoftDeleteAccount
    kind: execrows
    table: data.tables.account
    params:
      - { name: id, type: text }
      - { name: version, type: integer }
    returns: affected_rows
    semantics: "软删；同时写 status=3 与 deleted_at，保证两者一致；幂等（已删返回 0）"
    index_columns: [[id]]
    sql:
      statement: update
      from: data.tables.account
      set:
        - "status = 3"
        - "deleted_at = now()"
        - "updated_at = now()"
        - "version = version + 1"
      where:
        - "id = @id"
        - "version = @version"
        - "deleted_at IS NULL"

  - id: data.queries.account.list_stale_pending_accounts
    name: ListStalePendingAccounts
    kind: many
    table: data.tables.account
    params:
      - { name: older_than_days, type: integer, min: 1 }
      - { name: batch_size, type: integer, min: 1, max: 1000, default: 100 }
    returns: "[]data.tables.account.row"
    semantics: "扫描超过保留期仍未激活的账号；供 account_cleanup 使用"
    index_columns: [[created_at]]
    sql:
      statement: select
      from: data.tables.account
      select:
        - id
        - own_type
        - own_id
        - number
        - nickname
        - user_id
        - status
        - version
        - created_at
        - updated_at
        - deleted_at
      where:
        - "status = 0"
        - "deleted_at IS NULL"
        - "created_at < now() - make_interval(days => @older_than_days)"
      order_by:
        - "created_at"
      limit: "@batch_size"

  - id: data.queries.account.soft_delete_stale_pending_accounts
    name: SoftDeleteStalePendingAccounts
    kind: execrows
    table: data.tables.account
    params:
      - { name: ids, type: "[]text" }
    returns: affected_rows
    semantics: "批量软删 pending 账号；只处理仍为 pending 且未删除的记录"
    index_columns: [[id]]
    sql:
      statement: update
      from: data.tables.account
      set:
        - "status = 3"
        - "deleted_at = now()"
        - "updated_at = now()"
      where:
        - "id = ANY(@ids::text[])"
        - "status = 0"
        - "deleted_at IS NULL"
