# 账号查询集。只声明接口：入参、结果、目标表与索引。

id: data.queries.account
summary: "账号查询集"
owner_module: account
schema_version: 1
stability: stable
do_not:
  - "account 之外的邮箱/手机号/密码查询不要写在这里，去 data.queries.auth"
  - "account.number 唯一性查询必须带 deleted_at IS NULL"
  - "account 查询不要返回未声明的列；返回列由 returns 决定"

queries:
  - name: GetAccount
    tables:
      - data.tables.account
    params:
      - { name: id, type: integer, column: data.tables.account.col.id }
    returns:
      - { name: account, kind: entity, entity: data.entities.account }
    index_ref: [ data.tables.account.pk ]

  - name: GetAccountByNumber
    tables:
      - data.tables.account
    params:
      - { name: number, type: text, column: data.tables.account.col.number }
    returns:
      - { name: account, kind: entity, entity: data.entities.account }
    index_ref: [ data.tables.account.uq_account_number ]

  - name: ExistsAccountNumber
    tables:
      - data.tables.account
    params:
      - { name: number, type: text, column: data.tables.account.col.number }
    returns:
      - { name: exists, kind: scalar, type: boolean }
    index_ref: [ data.tables.account.uq_account_number ]

  - name: ListAccounts
    tables:
      - data.tables.account
    limit: 20
    params:
      - { name: status, type: integer, column: data.tables.account.col.status, nullable: true }
      - { name: own_type, type: integer, column: data.tables.account.col.own_type, nullable: true }
      - { name: cursor_created_at, type: timestamp, column: data.tables.account.col.created_at, nullable: true }
      - { name: cursor_id, type: integer, column: data.tables.account.col.id, nullable: true }
    returns:
      - { name: accounts, kind: entity, entity: data.entities.account, list: true }
    index_ref:
      - data.tables.account.idx_account_created_at_id
      - data.tables.account.idx_account_own_type_own_id

  - name: CreateAccount
    tables:
      - data.tables.account
    params:
      - { name: id, type: integer, column: data.tables.account.col.id }
      - { name: own_type, type: integer, column: data.tables.account.col.own_type }
      - { name: own_id, type: integer, column: data.tables.account.col.own_id }
      - { name: number, type: text, column: data.tables.account.col.number }
      - { name: nickname, type: text, column: data.tables.account.col.nickname }
      - { name: user_id, type: integer, column: data.tables.account.col.user_id, nullable: true }
    returns:
      - { name: account, kind: entity, entity: data.entities.account }
    index_ref: [ data.tables.account.uq_account_number ]

  - name: UpdateAccount
    tables:
      - data.tables.account
    params:
      - { name: id, type: integer, column: data.tables.account.col.id }
      - { name: nickname, type: text, column: data.tables.account.col.nickname }
      - { name: version, type: integer, column: data.tables.account.col.version }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.account.pk ]

  - name: SetAccountStatus
    tables:
      - data.tables.account
    params:
      - { name: id, type: integer, column: data.tables.account.col.id }
      - { name: status, type: integer, column: data.tables.account.col.status }
      - { name: version, type: integer, column: data.tables.account.col.version }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.account.pk ]

  - name: SoftDeleteAccount
    tables:
      - data.tables.account
    params:
      - { name: id, type: integer, column: data.tables.account.col.id }
      - { name: version, type: integer, column: data.tables.account.col.version }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.account.pk ]

  - name: ListStalePendingAccounts
    tables:
      - data.tables.account
    limit: 100
    params:
      - { name: older_than_days, type: integer }
    returns:
      - { name: accounts, kind: table, table: data.tables.account, list: true }
    index_ref: [ data.tables.account.idx_account_created_at_id ]

  - name: SoftDeleteStalePendingAccounts
    tables:
      - data.tables.account
    params:
      - { name: ids, type: List<integer>, column: data.tables.account.col.id }
    returns:
      - { name: affected_rows, kind: affected_rows }
    index_ref: [ data.tables.account.pk ]
