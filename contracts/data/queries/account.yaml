# 账号查询集。

id: data.queries.account
summary: "账号查询集"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "account 之外的邮箱/手机号/密码查询不要写在这里，去 data.queries.auth"
  - "account.number 唯一性查询必须带 deleted_at IS NULL"

queries:
  - name: GetAccount
    description: "按 ID 读取账号实体"
    tables:
      - { table: data.tables.account }
    caches:
      - data.tables.account.cache.id
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: integer, column: data.tables.account.col.id }
    returns:
      - { name: account, kind: entity, entity: data.entities.account }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.account.pk, columns: [ id ] }
    used_by:
      - cap.services.account.activate
      - cap.services.account.delete
      - cap.services.account.get
      - cap.services.account.suspend
      - cap.services.account.update
      - cap.services.auth.bind_email
      - cap.services.auth.bind_password
      - cap.services.auth.bind_phone
      - cap.services.auth.login
      - cap.services.token.issue
      - cap.services.token.refresh
      - cap.services.token.verify
      - cap.services.verification.send
      - cap.services.verification.verify

  - name: ExistsAccountNumber
    description: "判断账号编号是否已被占用"
    tables:
      - { table: data.tables.account }
    params:
      - { name: ctx, type: context.Context }
      - { name: number, type: text, column: data.tables.account.col.number }
    returns:
      - { name: exists, kind: scalar, type: boolean }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.account.uq_account_number, columns: [ number ] }
    used_by:
      - cap.services.account.create

  - name: ListAccounts
    description: "按状态与归属筛选账号列表"
    tables:
      - { table: data.tables.account }
    params:
      - { name: ctx, type: context.Context }
      - { name: status, type: integer, column: data.tables.account.col.status, nullable: true }
      - { name: offset, type: integer, nullable: true, default: 0 }
      - { name: limit, type: integer, nullable: true, default: 20 }
    returns:
      - { name: accounts, list: true, kind: entity, entity: data.entities.account }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.account.idx_account_created_at_id, columns: [ deleted_at, created_at, id ] }
    used_by:
      - cap.services.account.list

  - name: CreateAccount
    description: "创建账号并返回实体"
    tables:
      - { table: data.tables.account, write: true }
    caches:
      - data.tables.account.cache.id
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: integer, column: data.tables.account.col.id }
      - { name: status, type: integer, column: data.tables.account.col.status }
      - { name: number, type: text, column: data.tables.account.col.number }
      - { name: nickname, type: text, column: data.tables.account.col.nickname }
      - { name: user_id, type: integer, column: data.tables.account.col.user_id, nullable: true }
    returns:
      - { name: account, kind: entity, entity: data.entities.account }
      - { name: err, kind: error }
    errors:
      - platform.errors.ACCOUNT_NUMBER_TAKEN
    index_ref:
      - { index: data.tables.account.uq_account_number, columns: [ number ] }
    used_by:
      - cap.services.account.create

  - name: UpdateAccount
    description: "更新账号昵称并返回更新后的实体"
    tables:
      - { table: data.tables.account, write: true }
    caches:
      - data.tables.account.cache.id
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: integer, column: data.tables.account.col.id }
      - { name: nickname, type: text, column: data.tables.account.col.nickname }
    returns:
      - { name: account, kind: entity, entity: data.entities.account }
      - { name: err, kind: error }
    errors: [ ]
    index_ref:
      - { index: data.tables.account.pk, columns: [ id ] }
    used_by:
      - cap.services.account.update

  - name: SetAccountStatus
    description: "设置账号状态并返回更新后的实体；用于激活与封禁"
    tables:
      - { table: data.tables.account, write: true }
    caches:
      - data.tables.account.cache.id
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: integer, column: data.tables.account.col.id }
      - { name: status, type: integer, column: data.tables.account.col.status }
    returns:
      - { name: account, kind: entity, entity: data.entities.account }
      - { name: err, kind: error }
    errors:
      - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    index_ref:
      - { index: data.tables.account.pk, columns: [ id ] }
    used_by:
      - cap.services.account.activate
      - cap.services.account.suspend

  - name: SoftDeleteAccount
    description: "软删账号并同步 status 与 deleted_at"
    tables:
      - { table: data.tables.account, write: true }
    caches:
      - data.tables.account.cache.id
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: integer, column: data.tables.account.col.id }
      - { name: status, type: integer, column: data.tables.account.col.status }
    returns:
      - { name: affected_rows, kind: affected_rows }
      - { name: err, kind: error }
    errors:
      - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    index_ref:
      - { index: data.tables.account.pk, columns: [ id ] }
    used_by:
      - cap.services.account.delete
