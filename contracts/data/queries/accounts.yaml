# 账号查询集。SQL 是契约字段，queries/*.sql 由本文件生成。

schema_version: 1
id: data.query.accounts
summary: 账号查询集
stability: stable
module: accounts
do_not:
  - 邮箱唯一性查询必须带 deleted_at IS NULL
  - password_hash 只能在 GetAccountForAuth 中出现，其他查询显式排除

queries:
  - name: GetAccount
    kind: one
    params:
      - { name: id, type: uuid }
    returns: data.table.accounts.row
    semantics: 已软删视为不存在；不含 password_hash
    sql: |
      SELECT id, email, display_name, status, failed_login_count,
             locked_until, last_login_at, version, created_at, updated_at, deleted_at
      FROM accounts
      WHERE id = @id AND deleted_at IS NULL;

  - name: GetAccountForAuth
    kind: one
    params:
      - { name: email, type: text }
    returns: data.table.accounts.row
    semantics: 仅供认证使用，包含 password_hash；其他场景禁止调用
    sql: |
      SELECT * FROM accounts
      WHERE email = lower(@email) AND deleted_at IS NULL;

  - name: ListAccounts
    kind: many
    params:
      - { name: status, type: data.enum.account_status, nullable: true }
      - { name: cursor_created_at, type: timestamptz, nullable: true }
      - { name: cursor_id, type: uuid, nullable: true }
      - { name: page_size, type: integer, max: 100, default: 20 }
    returns: "[]data.table.accounts.row"
    semantics: 按 created_at DESC, id DESC 游标分页；status 为空不过滤
    sql: |
      SELECT id, email, display_name, status, failed_login_count,
             locked_until, last_login_at, version, created_at, updated_at, deleted_at
      FROM accounts
      WHERE deleted_at IS NULL
        AND (@status::text IS NULL OR status = @status)
        AND (
          @cursor_created_at::timestamptz IS NULL
          OR (created_at, id) < (@cursor_created_at, @cursor_id)
        )
      ORDER BY created_at DESC, id DESC
      LIMIT @page_size;

  - name: CreateAccount
    kind: one
    params:
      - { name: id, type: uuid }
      - { name: email, type: text }
      - { name: password_hash, type: text }
      - { name: display_name, type: text }
    returns: data.table.accounts.row
    semantics: 初始状态 pending；email 入库前小写归一
    sql: |
      INSERT INTO accounts (id, email, password_hash, display_name, status)
      VALUES (@id, lower(@email), @password_hash, @display_name, 'pending')
      RETURNING id, email, display_name, status, failed_login_count,
                locked_until, last_login_at, version, created_at, updated_at, deleted_at;

  - name: UpdateAccountVersioned
    kind: execrows
    params:
      - { name: id, type: uuid }
      - { name: display_name, type: text }
      - { name: version, type: integer }
    returns: affected_rows
    semantics: 乐观锁；返回 0 表示版本冲突
    sql: |
      UPDATE accounts
      SET display_name = @display_name, updated_at = now(), version = version + 1
      WHERE id = @id AND version = @version AND deleted_at IS NULL;

  - name: SetAccountStatus
    kind: execrows
    params:
      - { name: id, type: uuid }
      - { name: status, type: data.enum.account_status }
      - { name: version, type: integer }
    returns: affected_rows
    semantics: 状态转换由 business/states 决定，本查询只落库
    sql: |
      UPDATE accounts
      SET status = @status, updated_at = now(), version = version + 1
      WHERE id = @id AND version = @version AND deleted_at IS NULL;

  - name: RecordLoginSuccess
    kind: execrows
    params:
      - { name: id, type: uuid }
    returns: affected_rows
    semantics: 成功登录后重置失败计数与锁定
    sql: |
      UPDATE accounts
      SET failed_login_count = 0, locked_until = NULL,
          last_login_at = now(), updated_at = now()
      WHERE id = @id AND deleted_at IS NULL;

  - name: RecordLoginFailure
    kind: execrows
    params:
      - { name: id, type: uuid }
      - { name: lock_until, type: timestamptz, nullable: true }
    returns: affected_rows
    semantics: 失败计数 +1；达到阈值时设置 locked_until
    sql: |
      UPDATE accounts
      SET failed_login_count = failed_login_count + 1,
          locked_until = COALESCE(@lock_until, locked_until),
          updated_at = now()
      WHERE id = @id AND deleted_at IS NULL;

  - name: SoftDeleteAccount
    kind: execrows
    params:
      - { name: id, type: uuid }
      - { name: version, type: integer }
    returns: affected_rows
    semantics: 软删；幂等（已删返回 0）
    sql: |
      UPDATE accounts
      SET deleted_at = now(), updated_at = now(), version = version + 1
      WHERE id = @id AND version = @version AND deleted_at IS NULL;
