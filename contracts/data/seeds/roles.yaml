# contract: data.seed.roles
# summary: 系统必需数据。所有 seed 必须幂等（重复执行结果一致）。
# enforcement: generated+tested
# consumers: [api, ops]
# refs: [platform.sec.roles, platform.sec.permissions]
# do_not:
#   - 不要在 seed 里写业务演示数据
#   - 不要使用 DELETE + INSERT，必须 UPSERT
#   - 不要硬编码权限字符串，引用 platform.permission.*

schema_version: 1
id: data.seed.roles
summary: 系统必需角色数据
stability: stable
idempotent: true

seeds:
  - table: roles
    key: [code]
    rows:
      - code: admin
        name: 管理员
        permissions: ["*"]
      - code: editor
        name: 编辑
        permissions:
          - platform.permission.note_read
          - platform.permission.note_write
      - code: viewer
        name: 只读
        permissions:
          - platform.permission.note_read

  - table: permissions
    key: [code]
    source: platform.sec.permissions   # 权限点由该契约生成，seed 只做落库
