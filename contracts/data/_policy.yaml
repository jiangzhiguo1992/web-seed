# 数据契约的机器可读规则。人类规范见 data/README.md。

schema_version: 1
id: data.policy
summary: 数据契约的机器可读规则
stability: stable

naming:
  migration:
    pattern: "<utc_timestamp>_<snake_case_name>.sql"
    example: "20261111T093000_add_token_table.sql"
  table: "契约文件名/ID 用 snake_case（data.tables.account）；物理表名默认等于文件段，需要不同名时用 table.name 覆盖（accounts）"
  index: "idx_<table>_<cols>；唯一 uq_<table>_<cols>"
  constraint: "ck_<table>_<rule> / uq_<table>_<cols> / ex_<table>_<rule>"
  query: "snake_case；每个 query 必须有显式 id data.queries.<module>.<query_id>"

base:
  id: data.tables.base
  required: true
  rule: "物理表必须 extends: [data.tables.base]；不得重复声明 id/created_at/updated_at/deleted_at；status 必须重声明为 data.enums.*"
  override_allowed: [status]
  extra_columns: allowed

columns:
  identity:
    rule: id 由应用生成 UUIDv7；数据库不设 default
  defaults:
    literal: default
    expression: default_sql
    rule: 字面量用 default，SQL 表达式用 default_sql；禁止混用
  length:
    rule: string/bytes 用 min_len/max_len；默认生成 CHECK (char_length(col) BETWEEN ...)；枚举列忽略 max_len
  normalize:
    rule: lower/upper 在应用写入前归一，DB 只存归一值；唯一索引建立在归一值上
  numeric:
    rule: min/max 默认生成 CHECK (col BETWEEN min AND max)
  nullable:
    rule: 未写 nullable 视为 false；主键不可空
  sensitive:
    pii: true 的列由生成器汇总进 platform/observability/log_fields.never_log
    never_expose: true 的列禁止进入普通 OpenAPI/TS/事件/普通 entity；认证 query 的 return_columns 与 x-auth-response 响应是唯一例外

constraints:
  physical_in: data/tables/*.yaml
  business_in: data/entities/*.yaml + business/rules/*.yaml
  rule: 数据库能表达的约束（check/enum/unique/exclude）留在 tables；禁止 foreign_key；唯一性按 scope 选择约束或索引；跨字段、跨表、业务不变量写 entities.validation 或 business.rules
  types:
    - check
    - enum
    - unique
    - exclude
  naming_id: "data.tables.<file>.constraint.<constraint.name>"

indexes:
  reason_required: true
  method_default: btree
  expression:
    rule: 表达式索引用 indexes[].expression，不要塞原生 SQL
    example: "lower(email)"
  concurrently:
    rule: "size_class=large 的表默认 CREATE INDEX CONCURRENTLY；生成器自动加 transaction: false"
  partition:
    rule: 分区用 table.partition 结构化字段，不要塞原生 SQL

soft_delete:
  column: deleted_at
  rule: 软删表必须有 deleted_at；全局唯一（含软删行）用 constraints.unique；软删后可复用用 indexes[].unique + WHERE deleted_at IS NULL
  consistency: 若 status 也有 deleted 值，必须加 CHECK (status = 'deleted') = (deleted_at IS NOT NULL)

ownership:
  field: owner_module
  rule: 只有 owner_module 相同的 cap.services/cap.async 可以写表；跨模块读通过 persistence.queries，不直接引用表

used_by:
  generated: true
  structure:
    entities: "实体 ID 列表"
    queries: "查询 ID 列表"
    capabilities: "能力 ID 列表"
  rule: 由 make gen-graph 写入，禁止手改；三个列表必须等于实际入边，空列表写 []

size:
  field: size_class
  values: [small, large]
  rule: large 表的建索引默认 CONCURRENTLY；small 表允许事务内建索引

forbidden:
  - id: no_foreign_key
    rule: 禁止数据库外键（foreign_key）
    instead: 跨表一致性由应用/业务规则保证
  - id: no_drop_column
    rule: 禁止直接 DROP COLUMN
    instead: 先标 deprecated，停止写入一个版本后再删
  - id: no_rename_column
    rule: 禁止 RENAME COLUMN
    instead: 加新列 → 双写 → 回填 → 切读 → 删旧列
  - id: no_not_null_without_default
    rule: 禁止给已有数据的表加 NOT NULL 且无默认值
    instead: 加可空 → 回填 → 加约束
  - id: no_type_change_in_place
    rule: 禁止原地改列类型
    instead: 新列 + 回填 + 切换
  - id: no_lock_heavy_index
    rule: size_class=large 的表禁止非 CONCURRENTLY 建索引
    instead: "CREATE INDEX CONCURRENTLY（transaction: false）"
  - id: no_unstructured_ddl
    rule: 禁止用未结构化字段塞原生 DDL（旧 ddl_ext 已移除）
    instead: 用 table.partition / indexes[].expression / indexes[].method 等结构化字段

manual_adjust:
  prefix: "-- manual-adjust:"
  required_reason: true
  allowed_cases:
    - CREATE INDEX CONCURRENTLY
    - ALTER TABLE ... VALIDATE CONSTRAINT
    - 数据回填的分批与限速
  review_required: true

verification:
  - id: empty_db_replay
    command: make db-verify
    rule: 空库 apply 全部迁移 → dump schema 必须等于 data/tables 生成的目标态
  - id: contract_diff
    command: make gen-db && git diff --exit-code
    rule: 契约变更必须伴随迁移生成
  - id: used_by_sync
    command: make gen-graph && git diff --exit-code
    rule: used_by 必须等于实际入边集合
