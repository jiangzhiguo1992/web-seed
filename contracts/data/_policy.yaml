# 数据契约的机器可读规则。人类规范见 data/README.md。

id: data.policy
summary: 数据契约的机器可读规则
stability: stable

naming:
  pattern: "<utc_timestamp>_<snake_case_name>.sql"
  example: "20261111T093000_add_notes_table.sql"

forward_only: true
down_migrations: false
transactional_default: true

# 生成器遇到以下操作应报错，而不是生成迁移
forbidden:
  - id: no_drop_column
    rule: 禁止直接 DROP COLUMN
    instead: 先标 deprecated，停止写入一个版本后再删
  - id: no_rename_column
    rule: 禁止 RENAME COLUMN
    instead: 加新列 → 双写 → 回填 → 切读 → 删旧列
  - id: no_not_null_without_default
    rule: 禁止给已有数据的表加 NOT NULL 且无默认值
    instead: 加可空 → 回填 → 加约束
  - id: no_type_change_in_place
    rule: 禁止原地改列类型
    instead: 新列 + 回填 + 切换
  - id: no_lock_heavy_index
    rule: 大表禁止非 CONCURRENTLY 建索引
    instead: "CREATE INDEX CONCURRENTLY（需 transaction: false）"

# 生成器无法表达时，允许人工调整的边界
manual_adjust:
  prefix: "-- manual-adjust:"
  required_reason: true
  allowed_cases:
    - CREATE INDEX CONCURRENTLY
    - ALTER TABLE ... VALIDATE CONSTRAINT
    - 数据回填的分批与限速
  review_required: true

verification:
  - id: empty_db_replay
    command: make db-verify
    rule: 空库 apply 全部迁移 → dump schema 必须等于 data/tables 生成的目标态
  - id: contract_diff
    command: make gen-db && git diff --exit-code
    rule: 契约变更必须伴随迁移生成
