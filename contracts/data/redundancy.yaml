# 跨表冗余列关系。组 ID 只写在表列 redundancy 上，source/copies 只在这里定义。
# 与 storage 解耦：storage 只描述落盘方式，冗余关系集中在本文件便于审计。

id: data.redundancy
summary: "跨表冗余列关系"
schema_version: 1
stability: stable
do_not:
  - "组 ID 只写在表列 redundancy 上；source/copies 只在本文件定义"

groups:
  account_own_type:
    source: data.tables.account.col.own_type
    copies:
      - data.tables.token.col.own_type

  account_own_id:
    source: data.tables.account.col.own_id
    copies:
      - data.tables.token.col.own_id

  account_user_id:
    source: data.tables.account.col.user_id
    copies:
      - data.tables.token.col.user_id
