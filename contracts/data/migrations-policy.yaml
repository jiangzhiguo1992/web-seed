# contract: data.policy.migrations
# summary: 迁移策略。约束生成器与人工调整的边界。
# enforcement: generated
# consumers: [ops, tools]
# do_not:
#   - 不要手工修改已合并的迁移文件
#   - 不要写 DOWN 迁移（只前进，用补偿迁移）
#   - 不要在同一次迁移里做 DDL 和数据回填

schema_version: 1
id: data.policy.migrations
summary: 迁移策略与禁止操作
stability: stable

naming:
  pattern: "<utc_timestamp>_<snake_case_name>.sql"
  example: "20261111T093000_add_notes_table.sql"

forward_only: true
down_migrations: false
transactional_default: true       # 需要 CREATE INDEX CONCURRENTLY 时显式关闭

forbidden:
  - id: no_drop_column
    rule: 禁止直接 DROP COLUMN
    instead: 先标记 deprecated，停止写入一个版本后再删
  - id: no_rename_column
    rule: 禁止 RENAME COLUMN
    instead: 加新列 → 双写 → 回填 → 切读 → 删旧列
  - id: no_not_null_without_default
    rule: 禁止给已有数据的表加 NOT NULL 且无默认值
    instead: 加可空 → 回填 → 加约束
  - id: no_type_change_in_place
    rule: 禁止原地改列类型
    instead: 新列 + 回填 + 切换
  - id: no_lock_heavy_index
    rule: 大表禁止非 CONCURRENTLY 建索引
    instead: "CREATE INDEX CONCURRENTLY（需 transaction: false）"

zero_downtime_steps:
  - 加可空列
  - 回填（分批，限速）
  - 加约束（NOT NULL / CHECK，使用 NOT VALID 后 VALIDATE）
  - 切换读写路径
  - 删除旧列（下个版本）

manual_adjust:
  allowed_prefix: "-- manual-adjust:"
  required_reason: true
  allowed_cases:
    - CREATE INDEX CONCURRENTLY
    - ALTER TABLE ... VALIDATE CONSTRAINT
    - 数据回填的分批与限速
  review_required: true

verification:
  - id: empty_db_replay
    command: make db-verify
    rule: 空库 apply 全部迁移 → dump schema 必须等于 data/tables 生成的目标态
  - id: contract_diff
    command: make gen-db && git diff --exit-code
    rule: 契约变更必须伴随迁移生成
