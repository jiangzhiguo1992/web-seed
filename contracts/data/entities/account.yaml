# 账号数据实体。

id: data.entities.account
summary: "账号数据实体"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "account 的认证标识只能通过 auth_* 实体访问"

model:
  name: Account
  extends:
    - data.entities.base
  tables:
    - data.tables.account
  includes:
    - { field: AuthEmail, entity: data.entities.auth_email, cardinality: one_to_one }
    - { field: AuthPhone, entity: data.entities.auth_phone, cardinality: one_to_one }
    - { field: AuthPwd, entity: data.entities.auth_pwd, cardinality: one_to_one }
    - { field: Tokens, entity: data.entities.token, cardinality: one_to_many }
  included_by:
    - { entity: data.entities.auth_email, field: Account, cardinality: one_to_one }
    - { entity: data.entities.auth_phone, field: Account, cardinality: one_to_one }
    - { entity: data.entities.auth_pwd, field: Account, cardinality: one_to_one }
    - { entity: data.entities.token, field: Account, cardinality: one_to_many }
    - { entity: data.entities.verification_action, field: Account, cardinality: one_to_many }
    - { entity: data.entities.verification_body, field: Account, cardinality: one_to_many }
  queries:
    - data.queries.account.create_account
    - data.queries.account.get_account
    - data.queries.account.list_accounts
    - data.queries.account.set_account_status
    - data.queries.account.update_account

fields:
  - name: Status
    type: data.enums.account_status
    description: "账号状态"
    source: { column: data.tables.account.col.status }

  - name: Number
    description: "账号编号"
    source: { column: data.tables.account.col.number }

  - name: Nickname
    description: "昵称"
    source: { column: data.tables.account.col.nickname }

  - name: UserID
    description: "关联用户 ID"
    source: { column: data.tables.account.col.user_id }

  - name: Tokens
    type: _types.structures.list<data.entities.token>
    description: "账号的设备令牌列表"
    source:
      join:
        from: data.tables.account.col.id
        to: data.tables.token.col.account_id

  - name: AuthPwd
    type: data.entities.auth_pwd
    description: "账号的密码认证记录"
    source:
      join:
        from: data.tables.account.col.id
        to: data.tables.auth_pwd.col.account_id

  - name: AuthPhone
    type: data.entities.auth_phone
    description: "账号绑定的手机号"
    source:
      join:
        from: data.tables.account.col.id
        to: data.tables.auth_phone.col.account_id

  - name: AuthEmail
    type: data.entities.auth_email
    description: "账号绑定的邮箱"
    source:
      join:
        from: data.tables.account.col.id
        to: data.tables.auth_email.col.account_id

validation: [ ]
