# 账号数据实体。物理表在 tables/account.yaml；认证信息在 auth_* / token。
# 只写语义增量：来源列、枚举映射、关系；description/source/validation 必须显式，类型/敏感标记可从来源列派生。

id: data.entities.account
summary: "账号数据实体"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "account 的认证标识只能通过 auth_* 实体访问"
  - "OwnType/OwnID 是数据归属，userID 是关联用户；两者不得互相替代"
  - "account.validation 不要写 DDL"

model:
  name: Account
  extends:
    - data.entities.base
  tables:
    - data.tables.account
  included_by:
    - data.entities.auth_pwd
    - data.entities.auth_phone
    - data.entities.auth_email
    - data.entities.token

fields:
  - name: Status
    type: data.enums.account_status
    description: "账号状态"
    source: { column: data.tables.account.col.status }
    validation: { column: data.tables.account.col.status }

  - name: OwnType
    type: data.enums.own_type
    description: "数据归属主体类型"
    source: { column: data.tables.account.col.own_type }
    validation: { column: data.tables.account.col.own_type }

  - name: OwnID
    description: "归属 ID；与 own_type 组成归属主体"
    source: { column: data.tables.account.col.own_id }
    validation: { column: data.tables.account.col.own_id }

  - name: Number
    description: "账号编号；业务唯一；存储前大写归一"
    source: { column: data.tables.account.col.number }
    validation: { column: data.tables.account.col.number }

  - name: Nickname
    description: "昵称"
    source: { column: data.tables.account.col.nickname }
    validation: { column: data.tables.account.col.nickname }

  - name: userID
    description: "关联用户 ID；不做数据库外键"
    source: { column: data.tables.account.col.user_id }
    validation: { column: data.tables.account.col.user_id }

  - name: Version
    description: "乐观锁；非业务字段"
    source: { column: data.tables.account.col.version }
    validation: { column: data.tables.account.col.version }

  - name: Tokens
    type: data.entities.token
    description: "账号的设备令牌"
    join_column_from: data.tables.account.col.id
    join_column_to: data.tables.token.col.account_id
    load: lazy

  - name: AuthPwd
    type: data.entities.auth_pwd
    description: "账号的密码认证记录"
    join_column_from: data.tables.account.col.id
    join_column_to: data.tables.auth_pwd.col.account_id
    load: lazy

  - name: AuthPhone
    type: data.entities.auth_phone
    description: "账号绑定的手机号"
    join_column_from: data.tables.account.col.id
    join_column_to: data.tables.auth_phone.col.account_id
    load: lazy

  - name: AuthEmail
    type: data.entities.auth_email
    description: "账号绑定的邮箱"
    join_column_from: data.tables.account.col.id
    join_column_to: data.tables.auth_email.col.account_id
    load: lazy

used_by:
  queries:
    - data.queries.account.get_account
    - data.queries.account.get_account_by_number
    - data.queries.account.list_accounts
    - data.queries.account.create_account
  capabilities:
    - cap.http.account
    - cap.services.account
    - cap.services.auth
