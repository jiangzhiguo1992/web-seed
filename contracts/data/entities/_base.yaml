# 实体字段基类。单例契约：5 个通用字段 + 类型级 do_not；不生成类型、不落表。
# 字段树与规则见 _meta/data.entities.yaml；路径/ID 由 checker 写死识别。
# 字段名是 Go 标识符：首字母大写导出，小写不导出。

schema_version: 1
id: data.entities.base
summary: "实体字段基类"
stability: stable
do_not:
  - "data.entities.base 不是实体：不生成类型、不落表、不建关系"
  - "基类 5 列不得改名或删除"
  - "实体是读模型：字段必须能投影回物理列，不写聚合/计算字段"
  - "多表合成只读；JOIN 条件写在 query，不要写进 entity"
  - "每张物理表必须至少被一个 entity 映射；tables 必填"
  - "entity 只定义数据结构，不定义函数/方法；行为放 capabilities/business"
  - "不要写状态机、业务规则（属于 business）"
  - "数据库表达不了的复杂校验写在 validation，不要搬到 tables"
  - "不要引用 business.*"

fields:
  - name: ID
    json_name: id
    type: string
    required: true
    mutable: false
    description: "实体唯一主键；来源列 id"
  - name: Status
    json_name: status
    type: integer
    required: true
    examples: [ 0, 1 ]
    description: "业务状态整数码；具体实体可用 data.enums.* 特化"
  - name: CreatedAt
    json_name: created_at
    type: timestamp
    required: true
    mutable: false
  - name: UpdatedAt
    json_name: updated_at
    type: timestamp
    required: true
    mutable: false
  - name: DeletedAt
    json_name: deleted_at
    type: timestamp
    mutable: false
