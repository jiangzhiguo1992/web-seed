# 手机号认证数据实体。物理表在 tables/auth_phone.yaml。
# 只写语义增量：来源列、枚举映射、关系；类型/校验/描述/敏感标记从来源列派生。

id: data.entities.auth_phone
summary: "手机号认证数据实体"
owner_module: auth
schema_version: 1
stability: stable
do_not:
  - "auth_phone.number 不要写进账号主表"
  - "auth_phone.number 不要出现在日志"

model:
  name: authPhone
  extends:
    - data.entities.base
  tables:
    - data.tables.auth_phone
  included_by:
    - data.entities.account

fields:
  - name: AccountID
    mutable: false
    source: { column: data.tables.auth_phone.col.account_id }
  - name: Code
    source: { column: data.tables.auth_phone.col.code }
  - name: Number
    source: { column: data.tables.auth_phone.col.number }
  - name: Operator
    source: { column: data.tables.auth_phone.col.operator }
  - name: Status
    type: data.enums.auth_status
    source: { column: data.tables.auth_phone.col.status }
    description: "认证记录状态"

  - name: Account
    target: data.tables.account
    type: data.entities.account
    join_column_from: data.tables.auth_phone.col.account_id
    join_column_to: data.tables.account.col.id
    load: lazy
    description: "所属账号"

used_by:
  queries: []
