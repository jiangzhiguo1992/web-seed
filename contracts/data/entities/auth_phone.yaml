# 手机号认证数据实体。物理表在 tables/auth_phone.yaml。
#
# 边界：
#   - 基类字段在 entities/_base.yaml；本文件只写手机号认证业务字段。

id: data.entities.auth_phone
summary: "手机号认证数据实体"
owner_module: auth
schema_version: 1
stability: stable
do_not:
  - "auth_phone.number 不要写进账号主表"
  - "auth_phone.number 不要出现在日志"

model:
  name: authPhone
  extends: [ data.entities.base ]
  tables: [ data.tables.auth_phone ]

fields:
  - name: AccountID
    json_name: account_id
    type: string
    required: true
    mutable: false
  - name: Code
    json_name: code
    type: string
    required: true
  - name: Number
    json_name: number
    type: string
    required: true
    pii: true
  - name: Operator
    json_name: operator
    type: string
  - name: Status
    json_name: status
    type: data.enums.auth_status

relations:
  - { name: account, target: data.entities.account, kind: many_to_one, via: data.tables.auth_phone.col.account_id }

used_by:
  queries: []
  entities: [ data.entities.account ]
