# 手机号认证数据实体。物理表在 tables/auth_phone.yaml。

schema_version: 1
id: data.entities.auth_phone
summary: "手机号认证数据实体"
stability: stable
table: data.tables.auth_phone
identity: id
do_not:
  - "不要把手机号写进账号主表"
  - "不要在日志里输出完整手机号"

fields:
  - { name: id, type: string, max_len: 36, required: true, mutable: false }
  - { name: account_id, type: string, max_len: 36, required: true, mutable: false }
  - { name: code, type: string, min_len: 2, max_len: 8, required: true }
  - { name: number, type: string, min_len: 1, max_len: 32, required: true, pii: true }
  - { name: operator, type: string, max_len: 32 }
  - { name: status, type: data.enums.auth_status, required: true }
  - { name: created_at, type: timestamp, required: true, mutable: false }
  - { name: updated_at, type: timestamp, required: true, mutable: false }
  - { name: deleted_at, type: timestamp, mutable: false }

relations:
  - { name: account, target: data.entities.account, kind: many_to_one, via: data.tables.auth_phone.col.account_id }
