# 手机号认证数据实体。

id: data.entities.auth_phone
summary: "手机号认证数据实体"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "auth_phone.number 不要出现在日志"

model:
  name: authPhone
  extends:
    - data.entities.base
  tables:
    - data.tables.auth_phone
  queries:
    - data.queries.auth.create_auth_phone
    - data.queries.auth.get_auth_phone_by_number
  included_by:
    - data.entities.account

fields:
  - name: Status
    type: data.enums.auth_status
    description: "认证记录状态"
    source: { column: data.tables.auth_phone.col.status }

  - name: AccountID
    description: "关联账号"
    source: { column: data.tables.auth_phone.col.account_id }

  - name: Code
    description: "国际区号，例如 +86"
    source: { column: data.tables.auth_phone.col.code }

  - name: Number
    description: "手机号"
    source: { column: data.tables.auth_phone.col.number }

  - name: Operator
    description: "运营商"
    source: { column: data.tables.auth_phone.col.operator }

  - name: Account
    type: data.entities.account
    description: "所属账号"
    source:
      join:
        from: data.tables.auth_phone.col.account_id
        to: data.tables.account.col.id
        lazy: true
