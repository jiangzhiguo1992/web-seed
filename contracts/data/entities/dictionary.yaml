# 字典实体。

id: data.entities.dictionary
summary: "字典实体"
owner_module: system
schema_version: 1
stability: draft
do_not:
  - "data.entities.dictionary 是只读展示模型；字典值不参与业务分支"
  - "Dictionary.Parent / Dictionary.Children 只表达一层父子关系；不要递归展开整棵树"
  - "ParentID 为 null 时不要读取 Parent；顶级节点没有父节点"
  - "Dictionary.Extra 只放 UI/非关键信息；业务状态、权限、金额不得进 Extra"
  - "Dictionary.Code 是全局稳定标识，不用 ID 或 name 替代"

model:
  name: Dictionary
  extends:
    - data.entities.base
  tables:
    - data.tables.dictionary
  includes:
    - { field: Children, entity: data.entities.dictionary, cardinality: one_to_many }
    - { field: Parent, entity: data.entities.dictionary, cardinality: many_to_one }
  included_by:
    - { entity: data.entities.dictionary, field: Children, cardinality: many_to_one }
    - { entity: data.entities.dictionary, field: Parent, cardinality: one_to_many }
  queries:
    - data.queries.dictionary.create_dictionary
    - data.queries.dictionary.get_dictionary
    - data.queries.dictionary.get_dictionary_by_id
    - data.queries.dictionary.list_dictionary_children
    - data.queries.dictionary.list_root_dictionaries
    - data.queries.dictionary.move_dictionary
    - data.queries.dictionary.set_dictionary_status
    - data.queries.dictionary.update_dictionary

fields:
  - name: Status
    type: data.enums.dictionary_status
    description: "字典状态"
    source: { column: data.tables.dictionary.col.status }

  - name: ParentID
    description: "父节点 ID；顶级为 null"
    source: { column: data.tables.dictionary.col.parent_id }

  - name: Code
    description: "字典编码；全局唯一且创建后不可变"
    source: { column: data.tables.dictionary.col.code }

  - name: Name
    description: "展示名；允许重复"
    source: { column: data.tables.dictionary.col.name }

  - name: Color
    description: "展示颜色；#RRGGBB"
    source: { column: data.tables.dictionary.col.color }

  - name: Sort
    description: "同一父节点下的展示顺序"
    source: { column: data.tables.dictionary.col.sort }

  - name: Remark
    description: "备注；仅用于说明"
    source: { column: data.tables.dictionary.col.remark }

  - name: Extra
    description: "扩展元数据；只放 UI/非关键信息"
    source: { column: data.tables.dictionary.col.extra }

  - name: Parent
    type: data.entities.dictionary
    description: "父节点；顶级为 null"
    source:
      join:
        from: data.tables.dictionary.col.parent_id
        to: data.tables.dictionary.col.id

  - name: Children
    type: _types.structures.list<data.entities.dictionary>
    description: "直接子节点列表"
    source:
      join:
        from: data.tables.dictionary.col.id
        to: data.tables.dictionary.col.parent_id

validation: [ ]
