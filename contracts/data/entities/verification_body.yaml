# 验证体数据实体。

id: data.entities.verification_body
summary: "验证体数据实体"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "verification_body 不表示登录态；登录态由 token 承载"
  - "verification_body.codeHash 与 content 禁止进入日志、事件或普通响应"
  - "verification_body.authId 必须与 authType 指向同一种认证绑定"

model:
  name: verificationBody
  extends:
    - data.entities.base
  tables:
    - data.tables.verification_body
  includes:
    - data.entities.account
  included_by: [ ]
  queries:
    - data.queries.verification.create_verification
    - data.queries.verification.get_latest_verification

fields:
  - name: Status
    type: data.enums.verification_status
    description: "验证记录状态"
    source: { column: data.tables.verification_body.col.status }

  - name: AccountID
    description: "账号 ID；验证体不早于 account 存在"
    source: { column: data.tables.verification_body.col.account_id }

  - name: AuthType
    type: data.enums.auth_type
    description: "认证方式；只允许 phone/email"
    source: { column: data.tables.verification_body.col.auth_type }

  - name: AuthID
    description: "认证绑定 ID：phone 指向 auth_phone，email 指向 auth_email"
    source: { column: data.tables.verification_body.col.auth_id }

  - name: Purpose
    type: data.enums.verification_purpose
    description: "验证用途，例如注册、登录、重置密码"
    source: { column: data.tables.verification_body.col.purpose }

  - name: codeHash
    description: "验证码/令牌哈希；不存原文"
    source: { column: data.tables.verification_body.col.code_hash }

  - name: content
    description: "发送正文快照；可能含验证码原文"
    source: { column: data.tables.verification_body.col.content }

  - name: SentAt
    description: "实际发送时间；发送失败为空"
    source: { column: data.tables.verification_body.col.sent_at }

  - name: ExpireAt
    description: "验证码过期时间"
    source: { column: data.tables.verification_body.col.expire_at }

  - name: ConsumedAt
    description: "验证通过/消费时间；为空表示未使用"
    source: { column: data.tables.verification_body.col.consumed_at }

  - name: AttemptCount
    description: "校验失败次数；达到上限后作废"
    source: { column: data.tables.verification_body.col.attempt_count }

  - name: Account
    type: data.entities.account
    description: "所属账号；账号硬删时验证体级联删除"
    source:
      join:
        from: data.tables.verification_body.col.account_id
        to: data.tables.account.col.id
        lazy: true
