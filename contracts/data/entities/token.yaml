# 令牌数据实体。物理表在 tables/token.yaml。
#
# 边界：
#   - 基类字段在 entities/_base.yaml；本文件只写令牌业务字段。
#   - access_token_hash / refresh_token_hash 标记 never_expose，只能出现在认证流程。
#   - 实体不描述签发算法、签名、刷新策略；这些在 platform/security/auth_policy。

schema_version: 1
id: data.entities.token
summary: "令牌数据实体"
stability: stable
name: token
extends: [ data.entities.base ]
tables: [ data.tables.token ]
do_not:
  - "token 的哈希字段禁止出现在任何 DTO、日志、事件"
  - "token 实体不要写 JWT 签发或校验逻辑"
  - "token 原文只在签发响应返回一次，数据库不存原文"

fields:
  - name: OwnType
    type: string
    required: true
  - name: OwnID
    type: string
    required: true
  - name: AccountID
    type: string
    required: true
    mutable: false
  - name: DeviceID
    type: string
  - name: UserID
    type: string
  - name: accessTokenHash
    type: string
    required: true
    pii: true
    never_expose: true
  - name: refreshTokenHash
    type: string
    required: true
    pii: true
    never_expose: true
  - name: AccessExpireAt
    type: timestamp
    required: true
  - name: RefreshExpireAt
    type: timestamp
    required: true
  - name: Status
    type: data.enums.token_status

relations:
  - { name: account, target: data.entities.account, kind: many_to_one, via: data.tables.token.col.account_id }

used_by:
  queries: []
  entities: [ data.entities.account ]
