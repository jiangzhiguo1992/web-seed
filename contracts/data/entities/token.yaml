# 令牌数据实体。

id: data.entities.token
summary: "令牌数据实体"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "token 实体不要写 JWT 签发或校验逻辑"

model:
  name: token
  extends:
    - data.entities.base
  tables:
    - data.tables.token
  includes:
    - { field: Account, entity: data.entities.account, cardinality: many_to_one }
  included_by:
    - { entity: data.entities.account, field: Tokens, cardinality: many_to_one }
  queries:
    - data.queries.token.create_token
    - data.queries.token.get_token_by_access
    - data.queries.token.get_token_by_refresh

fields:
  - name: Status
    type: data.enums.token_status
    description: "令牌状态"
    source: { column: data.tables.token.col.status }

  - name: AccountID
    description: "关联账号"
    source: { column: data.tables.token.col.account_id }

  - name: UserID
    description: "关联用户 ID"
    source: { column: data.tables.token.col.user_id }

  - name: DeviceID
    description: "设备标识；多端登录时区分设备"
    source: { column: data.tables.token.col.device_id }

  - name: accessTokenHash
    description: "访问令牌哈希"
    source: { column: data.tables.token.col.access_token_hash }

  - name: refreshTokenHash
    description: "刷新令牌哈希"
    source: { column: data.tables.token.col.refresh_token_hash }

  - name: AccessExpireAt
    description: "访问令牌过期时间"
    source: { column: data.tables.token.col.access_expire_at }

  - name: RefreshExpireAt
    description: "刷新令牌过期时间"
    source: { column: data.tables.token.col.refresh_expire_at }

  - name: RevokedAt
    description: "吊销时间；为空表示未吊销"
    source: { column: data.tables.token.col.revoked_at }

  - name: RevokeReason
    type: data.enums.token_revoke_reason
    nullable: true
    description: "吊销原因"
    source: { column: data.tables.token.col.revoke_reason }

  - name: ReplacedByID
    description: "轮换后新令牌 ID（旧→新的前向指针）；不是吊销者 ID"
    source: { column: data.tables.token.col.replaced_by_id }

  - name: Account
    type: data.entities.account
    description: "所属账号"
    source:
      join:
        from: data.tables.token.col.account_id
        to: data.tables.account.col.id
