# 令牌数据实体。物理表在 tables/token.yaml。
#
# 边界：
#   - access_token_hash / refresh_token_hash 标记 never_expose，只能出现在认证流程。
#   - 实体不描述签发算法、签名、刷新策略；这些在 platform/security/auth_policy。

schema_version: 1
id: data.entities.token
summary: 令牌数据实体
stability: stable
table: data.tables.token
identity: id
do_not:
  - token 哈希字段禁止出现在任何 DTO、日志、事件
  - 不要在本实体写 JWT 签发或校验逻辑
  - 原始 token 只在签发响应返回一次，数据库不存原文

fields:
  - { name: id, type: uuid, required: true, mutable: false }
  - { name: own_type, type: string, max_length: 32, required: true }
  - { name: own_id, type: uuid, required: true }
  - { name: account_id, type: uuid, required: true, mutable: false }
  - { name: device_id, type: string, max_length: 128 }
  - { name: user_id, type: uuid }
  - { name: access_token_hash, type: string, min_length: 32, max_length: 128, required: true, pii: true, never_expose: true }
  - { name: refresh_token_hash, type: string, min_length: 32, max_length: 128, required: true, pii: true, never_expose: true }
  - { name: access_expire_at, type: datetime, required: true }
  - { name: refresh_expire_at, type: datetime, required: true }
  - { name: status, type: data.enums.token_status, required: true }
  - { name: created_at, type: datetime, required: true, mutable: false }
  - { name: updated_at, type: datetime, required: true, mutable: false }
  - { name: deleted_at, type: datetime, mutable: false }

relations:
  - { name: account, target: data.entities.account, kind: many_to_one, via: data.tables.token.col.account_id }
