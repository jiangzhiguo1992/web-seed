# 令牌数据实体。物理表在 tables/tokens.yaml。
#
# 边界：
#   - access_token / refresh_token 标记 never_expose，只能出现在认证流程。
#   - 实体不描述签发算法、签名、刷新策略；这些在 platform/security/auth-policy。

schema_version: 1
id: data.entity.token
summary: 令牌数据实体
stability: stable
table: data.table.tokens
identity: id
do_not:
  - token 字段禁止出现在任何 DTO、日志、事件
  - 不要在本实体写 JWT 签发或校验逻辑

fields:
  - { name: id, type: uuid, required: true, mutable: false }
  - { name: own_type, type: string, max_length: 32, required: true }
  - { name: own_id, type: uuid, required: true }
  - { name: account_id, type: uuid, required: true, mutable: false }
  - { name: device_id, type: string, max_length: 128 }
  - { name: user_id, type: uuid }
  - { name: access_token, type: string, required: true, pii: true, never_expose: true }
  - { name: refresh_token, type: string, required: true, pii: true, never_expose: true }
  - { name: access_expire_at, type: datetime, required: true }
  - { name: refresh_expire_at, type: datetime, required: true }
  - { name: status, type: data.enum.token_status, required: true }
  - { name: created_at, type: datetime, required: true, mutable: false }
  - { name: updated_at, type: datetime, required: true, mutable: false }
  - { name: deleted_at, type: datetime, mutable: false }

relations:
  - { name: account, target: data.entity.account, kind: many_to_one, via: data.table.tokens.col.account_id }
