# 令牌数据实体。物理表在 tables/token.yaml。
#
# 边界：
#   - 基类字段在 entities/_base.yaml；本文件只写令牌业务字段。
#   - access_token_hash / refresh_token_hash 标记 never_expose，只能出现在认证流程。
#   - 实体不描述签发算法、签名、刷新策略；这些在 platform/security/auth_policy。

id: data.entities.token
summary: "令牌数据实体"
owner_module: auth
schema_version: 1
stability: stable
do_not:
  - "token 的哈希字段禁止出现在任何 DTO、日志、事件"
  - "token 实体不要写 JWT 签发或校验逻辑"
  - "token 原文只在签发响应返回一次，数据库不存原文"

model:
  name: token
  extends: [ data.entities.base ]
  tables: [ data.tables.token ]

fields:
  - name: OwnType
    json_name: own_type
    type: string
    source: { column: data.tables.token.col.own_type }
    validation: { column: data.tables.token.col.own_type }
    description: "归属类型（冗余自 account.own_type）"

  - name: OwnID
    json_name: own_id
    type: string
    source: { column: data.tables.token.col.own_id }
    validation: { column: data.tables.token.col.own_id }
    description: "归属 ID（冗余自 account.own_id）"

  - name: AccountID
    json_name: account_id
    type: string
    mutable: false
    source: { column: data.tables.token.col.account_id }
    validation: { column: data.tables.token.col.account_id }
    description: "关联账号"

  - name: DeviceID
    json_name: device_id
    type: "*string"
    source: { column: data.tables.token.col.device_id }
    validation: { column: data.tables.token.col.device_id }
    description: "设备标识；多端登录时区分设备"

  - name: UserID
    json_name: user_id
    type: "*string"
    source: { column: data.tables.token.col.user_id }
    validation: { column: data.tables.token.col.user_id }
    description: "关联用户 ID（冗余自 account.user_id）"

  - name: accessTokenHash
    json_name: access_token_hash
    type: string
    pii: true
    never_expose: true
    source: { column: data.tables.token.col.access_token_hash }
    validation: { column: data.tables.token.col.access_token_hash }
    description: "访问令牌哈希；只存哈希"

  - name: refreshTokenHash
    json_name: refresh_token_hash
    type: string
    pii: true
    never_expose: true
    source: { column: data.tables.token.col.refresh_token_hash }
    validation: { column: data.tables.token.col.refresh_token_hash }
    description: "刷新令牌哈希；只存哈希"

  - name: AccessExpireAt
    json_name: access_expire_at
    type: timestamp
    source: { column: data.tables.token.col.access_expire_at }
    validation: { column: data.tables.token.col.access_expire_at }
    description: "访问令牌过期时间"

  - name: RefreshExpireAt
    json_name: refresh_expire_at
    type: timestamp
    source: { column: data.tables.token.col.refresh_expire_at }
    validation: { column: data.tables.token.col.refresh_expire_at }
    description: "刷新令牌过期时间"

  - name: Status
    json_name: status
    type: data.enums.token_status
    source: { column: data.tables.token.col.status }
    validation: { column: data.tables.token.col.status }
    description: "令牌状态"

  - name: Account
    json_name: account
    relationship: many_to_one
    target: data.entities.account
    join_column: data.tables.token.col.account_id
    load: lazy
    description: "令牌所属账号"

used_by:
  queries: []
  entities: [ data.entities.account ]
