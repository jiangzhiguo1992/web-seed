# 验证体数据实体。

id: data.entities.verification
summary: "验证体数据实体"
owner_module: auth
schema_version: 1
stability: draft
do_not:
  - "verification 不表示登录态；登录态由 token 承载"
  - "verification.codeHash 与 content 禁止进入日志、事件或普通响应"
  - "verification.target 是发送时快照，不要回写 auth_phone/auth_email"

model:
  name: verification
  extends:
    - data.entities.base
  tables:
    - data.tables.verification
  included_by: []

fields:
  - name: Status
    type: data.enums.verification_status
    description: "验证记录状态"
    source: { column: data.tables.verification.col.status }
    validation: { column: data.tables.verification.col.status }

  - name: OwnType
    type: data.enums.own_type
    description: "数据归属主体类型"
    source: { column: data.tables.verification.col.own_type }
    validation: { column: data.tables.verification.col.own_type }

  - name: OwnID
    description: "归属 ID；与 own_type 组成归属主体"
    source: { column: data.tables.verification.col.own_id }
    validation: { column: data.tables.verification.col.own_id }

  - name: AuthType
    type: data.enums.auth_type
    description: "认证方式；只允许 phone/email"
    source: { column: data.tables.verification.col.auth_type }
    validation: { column: data.tables.verification.col.auth_type }

  - name: Purpose
    type: data.enums.verification_purpose
    description: "验证用途，例如注册、登录、重置密码"
    source: { column: data.tables.verification.col.purpose }
    validation: { column: data.tables.verification.col.purpose }

  - name: Target
    description: "目标地址快照：phone 用 E.164，email 用小写完整地址"
    source: { column: data.tables.verification.col.target }
    validation: { column: data.tables.verification.col.target }

  - name: codeHash
    description: "验证码/令牌哈希；不存原文"
    source: { column: data.tables.verification.col.code_hash }
    validation: { column: data.tables.verification.col.code_hash }

  - name: content
    description: "发送正文快照；可能含验证码原文"
    source: { column: data.tables.verification.col.content }
    validation: { column: data.tables.verification.col.content }

  - name: SentAt
    description: "实际发送时间；发送失败为空"
    source: { column: data.tables.verification.col.sent_at }
    validation: { column: data.tables.verification.col.sent_at }

  - name: ExpireAt
    description: "验证码过期时间"
    source: { column: data.tables.verification.col.expire_at }
    validation: { column: data.tables.verification.col.expire_at }

  - name: ConsumedAt
    description: "验证通过/消费时间；为空表示未使用"
    source: { column: data.tables.verification.col.consumed_at }
    validation: { column: data.tables.verification.col.consumed_at }

  - name: AttemptCount
    description: "校验失败次数；达到上限后作废"
    source: { column: data.tables.verification.col.attempt_count }
    validation: { column: data.tables.verification.col.attempt_count }

  - name: RequestIP
    description: "发起请求的 IP；风控与审计"
    source: { column: data.tables.verification.col.request_ip }
    validation: { column: data.tables.verification.col.request_ip }

used_by:
  queries: []
  capabilities: []
