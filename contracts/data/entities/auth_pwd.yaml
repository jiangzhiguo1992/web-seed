# 密码认证数据实体。

id: data.entities.auth_pwd
summary: "密码认证数据实体"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "auth_pwd 不写密码强度规则；规则在 platform/security/auth_policy"

model:
  name: authPwd
  extends:
    - data.entities.base
  tables:
    - data.tables.auth_pwd
  includes:
    - { entity: data.entities.account, cardinality: one_to_one }
  included_by:
    - { entity: data.entities.account, cardinality: one_to_one }
  queries:
    - data.queries.auth.create_auth_pwd
    - data.queries.auth.get_auth_pwd_by_id
    - data.queries.auth.get_auth_pwd_by_username

fields:
  - name: Status
    type: data.enums.auth_status
    description: "认证记录状态"
    source: { column: data.tables.auth_pwd.col.status }

  - name: AccountID
    description: "关联账号"
    source: { column: data.tables.auth_pwd.col.account_id }

  - name: Username
    description: "登录名；唯一"
    source: { column: data.tables.auth_pwd.col.username }

  - name: passwordHash
    description: "口令哈希"
    source: { column: data.tables.auth_pwd.col.password_hash }

  - name: FailedLoginCount
    description: "连续失败次数；成功登录后归零"
    source: { column: data.tables.auth_pwd.col.failed_login_count }

  - name: LockedUntil
    description: "锁定截止时间；为空表示未锁定"
    source: { column: data.tables.auth_pwd.col.locked_until }

  - name: Account
    type: data.entities.account
    description: "所属账号"
    source:
      join:
        from: data.tables.auth_pwd.col.account_id
        to: data.tables.account.col.id

validation:
  - name: lock_consistency
    expr: "LockedUntil == nil || FailedLoginCount > 0"
    on_violation: platform.errors.AUTH_LOCKED
    used_by:
      - cap.services.auth.login
