# 密码认证数据实体。物理表在 tables/auth_pwd.yaml。
# 只写语义增量：来源列、枚举映射、关系；类型/校验/描述/敏感标记从来源列派生。

id: data.entities.auth_pwd
summary: "密码认证数据实体"
owner_module: auth
schema_version: 1
stability: stable
do_not:
  - "auth_pwd.passwordHash 禁止出现在任何 DTO、日志、事件"
  - "auth_pwd 不写密码强度规则；规则在 platform/security/auth_policy"

model:
  name: authPwd
  extends:
    - data.entities.base
  tables:
    - data.tables.auth_pwd
  included_by:
    - data.entities.account

fields:
  - name: AccountID
    mutable: false
    source: { column: data.tables.auth_pwd.col.account_id }
  - name: Username
    source: { column: data.tables.auth_pwd.col.username }
  - name: passwordHash
    source: { column: data.tables.auth_pwd.col.password_hash }
  - name: FailedLoginCount
    source: { column: data.tables.auth_pwd.col.failed_login_count }
  - name: LockedUntil
    source: { column: data.tables.auth_pwd.col.locked_until }
  - name: Status
    type: data.enums.auth_status
    source: { column: data.tables.auth_pwd.col.status }
    description: "认证记录状态"

  - name: Account
    target: data.tables.account
    type: data.entities.account
    join_column_from: data.tables.auth_pwd.col.account_id
    join_column_to: data.tables.account.col.id
    load: lazy
    description: "所属账号"

validation:
  - id: data.entities.auth_pwd.password_present
    expr: "PasswordHash != nil"
    on_violation: platform.errors.AUTH_INVALID_CREDENTIALS
  - id: data.entities.auth_pwd.lock_consistency
    expr: "LockedUntil == nil || FailedLoginCount > 0"
    on_violation: platform.errors.AUTH_LOCKED

used_by:
  queries: []
