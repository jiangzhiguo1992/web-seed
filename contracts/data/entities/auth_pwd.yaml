# 密码认证数据实体。物理表在 tables/auth_pwd.yaml。
#
# 边界：
#   - 基类字段在 entities/_base.yaml；本文件只写密码认证业务字段。
#   - password_hash 只服务认证流程；新密码必须使用 argon2id。
#   - 本实体只服务认证流程，不得被普通业务查询引用。

schema_version: 1
id: data.entities.auth_pwd
summary: "密码认证数据实体"
stability: stable
name: authPwd
extends: [ data.entities.base ]
tables: [ data.tables.auth_pwd ]
do_not:
  - "auth_pwd.passwordHash 禁止出现在任何 DTO、日志、事件"
  - "auth_pwd 不写密码强度规则；规则在 platform/security/auth_policy"

fields:
  - name: AccountID
    type: string
    required: true
    mutable: false
  - name: Username
    type: string
    required: true
    pii: true
  - name: passwordHash
    type: string
    pii: true
    never_expose: true
    description: "argon2id；新密码写入此列"
  - name: FailedLoginCount
    type: integer
    required: true
  - name: LockedUntil
    type: timestamp
  - name: Status
    type: data.enums.auth_status

relations:
  - { name: account, target: data.entities.account, kind: many_to_one, via: data.tables.auth_pwd.col.account_id }

validation:
  - id: data.entities.auth_pwd.password_present
    expr: "PasswordHash != nil"
    on_violation: platform.errors.AUTH_INVALID_CREDENTIALS
  - id: data.entities.auth_pwd.lock_consistency
    expr: "LockedUntil == nil || FailedLoginCount > 0"
    on_violation: platform.errors.AUTH_LOCKED

used_by:
  queries: []
  entities: [ data.entities.account ]
