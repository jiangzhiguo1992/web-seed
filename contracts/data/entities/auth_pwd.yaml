# 密码认证数据实体。物理表在 tables/auth_pwd.yaml。
#
# 边界：
#   - password_hash 只服务认证流程；新密码必须使用 argon2id。
#   - 本实体只服务认证流程，不得被普通业务查询引用。

schema_version: 1
id: data.entities.auth_pwd
summary: "密码认证数据实体"
stability: stable
table: data.tables.auth_pwd
identity: id
do_not:
  - "password_hash 禁止出现在任何 DTO、日志、事件"
  - "不要在本实体写密码强度规则；规则在 platform/security/auth_policy"

fields:
  - { name: id, type: string, max_len: 36, required: true, mutable: false }
  - { name: account_id, type: string, max_len: 36, required: true, mutable: false }
  - { name: username, type: string, min_len: 1, max_len: 254, required: true, pii: true }
  - { name: password_hash, type: string, min_len: 20, max_len: 255, pii: true, never_expose: true, note: "argon2id；新密码写入此列" }
  - { name: failed_login_count, type: integer, required: true }
  - { name: locked_until, type: timestamp }
  - { name: status, type: data.enums.auth_status, required: true }
  - { name: created_at, type: timestamp, required: true, mutable: false }
  - { name: updated_at, type: timestamp, required: true, mutable: false }
  - { name: deleted_at, type: timestamp, mutable: false }

relations:
  - { name: account, target: data.entities.account, kind: many_to_one, via: data.tables.auth_pwd.col.account_id }

validation:
  - id: data.entities.auth_pwd.password_present
    expr: "password_hash != nil"
    on_violation: platform.errors.AUTH_INVALID_CREDENTIALS
  - id: data.entities.auth_pwd.lock_consistency
    expr: "locked_until == nil || failed_login_count > 0"
    on_violation: platform.errors.AUTH_LOCKED
