# 密码认证数据实体。物理表在 tables/auth_pwd.yaml。
#
# 边界：
#   - 基类字段在 entities/_base.yaml；本文件只写密码认证业务字段。
#   - password_hash 只服务认证流程；新密码必须使用 argon2id。
#   - 本实体只服务认证流程，不得被普通业务查询引用。

id: data.entities.auth_pwd
summary: "密码认证数据实体"
owner_module: auth
schema_version: 1
stability: stable
do_not:
  - "auth_pwd.passwordHash 禁止出现在任何 DTO、日志、事件"
  - "auth_pwd 不写密码强度规则；规则在 platform/security/auth_policy"

model:
  name: authPwd
  extends: [ data.entities.base ]
  tables: [ data.tables.auth_pwd ]

fields:
  - name: AccountID
    json_name: account_id
    type: string
    mutable: false
    source: { column: data.tables.auth_pwd.col.account_id }
    validation: { column: data.tables.auth_pwd.col.account_id }
    description: "关联账号"

  - name: Username
    json_name: username
    type: string
    pii: true
    source: { column: data.tables.auth_pwd.col.username }
    validation: { column: data.tables.auth_pwd.col.username }
    description: "登录名"

  - name: passwordHash
    json_name: password_hash
    type: "*string"
    pii: true
    never_expose: true
    source: { column: data.tables.auth_pwd.col.password_hash }
    validation: { column: data.tables.auth_pwd.col.password_hash }
    description: "argon2id 口令哈希；新密码写入此列"

  - name: FailedLoginCount
    json_name: failed_login_count
    type: integer
    source: { column: data.tables.auth_pwd.col.failed_login_count }
    validation: { column: data.tables.auth_pwd.col.failed_login_count }
    description: "连续失败次数"

  - name: LockedUntil
    json_name: locked_until
    type: "*timestamp"
    source: { column: data.tables.auth_pwd.col.locked_until }
    validation: { column: data.tables.auth_pwd.col.locked_until }
    description: "锁定截止时间；为空表示未锁定"

  - name: Status
    json_name: status
    type: data.enums.auth_status
    source: { column: data.tables.auth_pwd.col.status }
    validation: { column: data.tables.auth_pwd.col.status }
    description: "认证记录状态"

  - name: Account
    json_name: account
    relationship: many_to_one
    target: data.entities.account
    join_column: data.tables.auth_pwd.col.account_id
    load: lazy
    description: "密码记录所属账号"

validation:
  - id: data.entities.auth_pwd.password_present
    expr: "PasswordHash != nil"
    on_violation: platform.errors.AUTH_INVALID_CREDENTIALS
  - id: data.entities.auth_pwd.lock_consistency
    expr: "LockedUntil == nil || FailedLoginCount > 0"
    on_violation: platform.errors.AUTH_LOCKED

used_by:
  queries: []
  entities: [ data.entities.account ]
