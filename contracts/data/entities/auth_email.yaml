# 邮箱认证数据实体。物理表在 tables/auth_email.yaml。
#
# 边界：
#   - 基类字段在 entities/_base.yaml；本文件只写邮箱认证业务字段。
#   - 邮箱拆分为 username/domain/entity/tld，便于检索与域名聚合。
#   - 完整邮箱 = username + "@" + domain；entity/tld 由 domain 派生，可为空。

schema_version: 1
id: data.entities.auth_email
summary: "邮箱认证数据实体"
stability: stable
name: authEmail
extends: [ data.entities.base ]
tables: [ data.tables.auth_email ]
do_not:
  - "auth_email.domain 不要写进账号主表"
  - "auth_email 的完整邮箱不要出现在日志"

fields:
  - name: AccountID
    type: string
    required: true
    mutable: false
  - name: Username
    type: string
    required: true
    pii: true
  - name: Domain
    type: string
    required: true
  - name: Entity
    type: string
  - name: TLD
    type: string
  - name: Status
    type: data.enums.auth_status

relations:
  - { name: account, target: data.entities.account, kind: many_to_one, via: data.tables.auth_email.col.account_id }

validation:
  - id: data.entities.auth_email.domain_parts
    expr: "TLD == nil || Domain endsWith('.' + TLD)"
    on_violation: platform.errors.AUTH_EMAIL_INVALID

used_by:
  queries: []
  entities: [ data.entities.account ]
