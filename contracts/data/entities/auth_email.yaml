# 邮箱认证数据实体。

id: data.entities.auth_email
summary: "邮箱认证数据实体"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "auth_email.domain_parts 校验不要搬到数据库"

model:
  name: authEmail
  extends:
    - data.entities.base
  tables:
    - data.tables.auth_email
  included_by:
    - data.entities.account
  queries:
    - data.queries.auth.create_auth_email
    - data.queries.auth.get_auth_email_by_id
    - data.queries.auth.get_auth_email_by_username_domain

fields:
  - name: Status
    type: data.enums.auth_status
    description: "认证记录状态"
    source: { column: data.tables.auth_email.col.status }

  - name: AccountID
    description: "关联账号"
    source: { column: data.tables.auth_email.col.account_id }

  - name: Username
    description: "邮箱 @ 前的本地部分"
    source: { column: data.tables.auth_email.col.username }

  - name: Domain
    description: "完整域名，例如 example.com；小写归一"
    source: { column: data.tables.auth_email.col.domain }

  - name: Entity
    description: "邮箱服务商，例如 gmail、163"
    source: { column: data.tables.auth_email.col.entity }

  - name: TLD
    description: "顶级域，例如 com"
    source: { column: data.tables.auth_email.col.tld }

  - name: Account
    type: data.entities.account
    description: "所属账号"
    source:
      join:
        from: data.tables.auth_email.col.account_id
        to: data.tables.account.col.id
        lazy: true

validation:
  - name: domain_parts
    expr: "TLD == nil || Domain endsWith('.' + TLD)"
    on_violation: platform.errors.AUTH_EMAIL_INVALID
    used_by:
      - cap.services.auth.bind_email
      - cap.services.auth.login
