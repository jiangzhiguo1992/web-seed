# HTTP 信封、分页、header、状态码与平台组件约定。只写规则与平台级组件，不写 operation。

schema_version: 1
id: platform.http_conventions
summary: "HTTP 信封、状态码与平台组件约定"
stability: draft
do_not:
  - "传输层头由 HTTP server/proxy 生成，不写进 request.headers / response.headers"
  - "3xx 与未登记状态码不得出现在 operation.response"

response:
  success: "统一信封 { code: 0, msg: \"ok\", data: <service return> }；data 必须是 service 的非 err return"
  error: "统一信封 { code: <biz_code>, msg: <i18n>, data: null }；HTTP status 保留 4xx/5xx，不改成全部 200；一次响应只返回一个业务错误，同一状态的候选错误由 x-error-codes 列出"
  error_msg: "response.<status>.msg 是该状态的默认消息；具体错误码的 msg 以 platform.errors 的 message 为准"
  raw: "text/binary 响应不包 JSON 信封，body.type 直接对应 service 的 string return"
  empty:
    status: 204
    body: "无 body；204 与 text/binary 是仅有的不包 JSON 信封的成功响应"

envelope:
  success_code: 0
  code: "整数业务码；0 成功，非 0 取 platform.errors.* 的 biz_code；取值范围 1000-9999"
  msg: "人类可读文案；成功固定 ok"
  data: "成功时为 service return；错误时为 null"
  generated_by: "gen_openapi 为每个 2xx data 类型生成 Api<Type>Response，源契约不手写信封"

pagination:
  style: offset
  request:
    - { name: offset, in: query, required: false, default: 0, min: 0 }
    - { name: limit, in: query, required: false, default: 20, max: 100 }
  response:
    shape: "{ items: [], offset, limit, has_more }"
    ordering: "必须稳定（有唯一 tiebreaker，如 id）"

# 传输层头由 HTTP server/proxy 生成，不写进 request.headers / response.headers；
# 名单在 transport_headers，checker 与 generator 统一读取。
# Upgrade-Insecure-Requests 等端到端浏览器 hint 不列入本目录；需要时按普通 header 声明。
# 下表的 required 是 header 的全局语义；operation 的 request/response headers item 可省略 required，省略为 true。
headers:
  request:
    - { name: Authorization, required: false, note: "request.headers 中用 auth: Bearer 标记；生成器映射为 OpenAPI security" }
    - { name: Content-Type, required: false, note: "有 body 时必填；value 必须等于 body.kind 对应的媒体类型" }
    - { name: Accept, required: false, note: "可选；声明期望的响应媒体类型" }
  response:
    - { name: Content-Type, required: false, note: "有 body 时必填；value 必须等于 body.kind 对应的媒体类型" }
    - { name: Location, required: false, note: "201 或 3xx 的资源地址" }
    - { name: Retry-After, required: false, note: "由平台 components.responses 的 429/503 声明，不在 operation 里重复" }
    - { name: Cache-Control, required: false, note: "缓存策略" }
    - { name: ETag, required: false, note: "实体标签" }
    - { name: Last-Modified, required: false, note: "最后修改时间" }
    - { name: Deprecation, required: false, note: "弃用响应由 versioning 契约声明；不在 operation 里重复" }
    - { name: Sunset, required: false, note: "弃用响应由 versioning 契约声明；不在 operation 里重复" }

status_codes:
  success: [200, 201, 202, 204]
  client_error: [400, 401, 403, 404, 405, 409, 410, 413, 415, 422, 423, 429]
  server_error: [500, 502, 503, 504]
  forbidden_usage:
    - "200 表示错误"
    - "500 表示业务校验失败"
    - "302 用于 API 重定向"

# 平台基线错误响应：这些状态由中间件或框架产生，不写进单个 operation 的 codes。
# 业务错误只写自己的 status + codes；生成器把基线与业务响应合并成 OpenAPI responses。
error_responses:
  always: [400, 405, 429, 500, 503]
  secured: [401, 403]
  body: [413, 415]
  deprecated: [410]

audiences: [admin, user]

transport_headers:
  - Connection
  - Content-Length
  - Expect
  - Host
  - Keep-Alive
  - Proxy-Authenticate
  - Proxy-Authorization
  - Proxy-Connection
  - TE
  - Trailer
  - Transfer-Encoding
  - Upgrade

body_types:
  json: application/json
  form: application/x-www-form-urlencoded
  multipart: multipart/form-data
  text: "text/plain"
  binary: application/octet-stream
  note: "body.kind 决定媒体类型；Content-Type header 必须显式声明且 value 与之一致，生成器再写成 OpenAPI content.<content_type>"

timeouts:
  server_read_header: 5s
  server_read: 15s
  server_write: 30s
  server_idle: 60s
  handler_default: 10s
  external_call_default: 3s

limits:
  max_body_bytes: 1048576
  max_upload_bytes: 10485760
  max_header_bytes: 16384

cors:
  allowed_origins_source: platform.environments
  allow_credentials: false
  max_age_seconds: 600

# 平台级 HTTP 组件：直接使用 OpenAPI 3.1 components 形状，由 gen_openapi 注入每个 api app。
# HTTP 文件没有私有组件；所有引用都指向这里的组件名。
components:
  schemas:
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required:
        - "code"
        - "msg"
        - "data"
      properties:
        code:
          type: integer
          minimum: 1000
          maximum: 9999
        msg:
          type: string
        data:
          type: "null"
  responses:
    BadRequest:
      description: "请求非法"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: "未认证"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: "无权限"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: "资源不存在"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    MethodNotAllowed:
      description: "方法不允许"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Gone:
      description: "端点已移除"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    PayloadTooLarge:
      description: "请求体超过上限"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    UnsupportedMediaType:
      description: "不支持的 Content-Type"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: "状态冲突"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    UnprocessableEntity:
      description: "语义校验失败"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Locked:
      description: "认证锁定中，可稍后重试"
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    TooManyRequests:
      description: "触发限流"
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailable:
      description: "服务暂不可用或循环预算耗尽，可稍后重试"
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Internal:
      description: "服务端错误"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  headers:
    RetryAfter:
      description: "建议重试等待秒数或 HTTP-date；非法值不发送，调用方记录参数错误"
      schema:
        type: string
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
