# 环境清单与显式差异。

schema_version: 1
id: platform.environments
summary: "环境清单与差异"
stability: draft
do_not:
  - "禁止在代码里按环境名写分支；环境差异只在本文件登记"

environments:
  - name: dev
    description: "本地开发"
    api_base_url: http://localhost:8080
    web_base_url: http://localhost:5173
    debug: true
    seed: true
    logging: { level: debug, format: json }
    security: { require_https: false }

  - name: test
    description: "自动化测试"
    api_base_url: http://localhost:8080
    web_base_url: http://localhost:5173
    debug: false
    seed: true
    logging: { level: info, format: json }
    security: { require_https: false }

  - name: staging
    description: "预发布，与生产同构"
    api_base_url: https://api.staging.example.com
    web_base_url: https://admin.staging.example.com
    debug: false
    seed: false
    logging: { level: info, format: json }
    security: { require_https: true }

  - name: prod
    description: "生产"
    api_base_url: https://api.example.com
    web_base_url: https://admin.example.com
    debug: false
    seed: false
    logging: { level: warn, format: json }
    security: { require_https: true, require_mfa: true }

differences:
  # 唯一允许的环境差异清单，新增差异必须登记
  - { key: debug, environments: [dev], note: "仅本地开启 pprof / verbose error" }
  - { key: seed, environments: [dev, test], note: "允许写入示例数据" }
  - { key: api_base_url, environments: [dev, test, staging, prod], note: "API 域名按环境不同" }
  - { key: web_base_url, environments: [dev, test, staging, prod], note: "Web 域名按环境不同" }
  - { key: logging.level, environments: [dev, test, staging, prod], note: "dev=debug/test=info/staging=info/prod=warn" }
  - { key: security.require_https, environments: [staging, prod], note: "预发布与生产强制 HTTPS" }
  - { key: security.require_mfa, environments: [prod], note: "管理员强制 MFA" }

secrets_source:
  dev: .env.local
  test: CI secrets
  staging: 平台注入（不落盘）
  prod: 平台注入（不落盘）

# 禁止进入镜像与仓库的内容
never_committed:
  - .env.local
  - "*.pem"
  - "*.key"
