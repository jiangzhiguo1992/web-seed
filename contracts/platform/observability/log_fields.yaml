# 日志字段与 PII 规则。

schema_version: 1
id: platform.observability.log_fields
summary: "日志字段与 PII 规则"
stability: draft
do_not:
  - "日志字段只使用本文件登记的字段；不得临时新增未登记字段"

format: json
timestamp: RFC3339Nano
level_field: level

required:
  - { name: time, type: _types.string, format: date-time }
  - { name: level, type: _types.string, enum: [debug, info, warn, error] }
  - { name: msg, type: _types.string }

fields:
  # ---------- 请求上下文 ----------
  - name: request_id
    type: _types.string
    pii: false
    required_for: [http]
  - name: trace_id
    type: _types.string
    pii: false
    required_for: [http]
  - name: span_id
    type: _types.string
    pii: false
  - name: method
    type: _types.string
    pii: false
    required_for: [http]
  - name: path
    type: _types.string
    pii: false
    required_for: [http]
    note: "只记录路由模板，不记录真实参数"
  - name: status
    type: _types.integer
    pii: false
    required_for: [http]
  - name: duration_ms
    type: _types.integer
    pii: false
    required_for: [http]
  - name: bytes
    type: _types.integer
    pii: false

  # ---------- 身份 ----------
  - name: user_id
    type: _types.string
    pii: true
    note: "仅记录哈希或 ID，不记录邮箱/手机号"
  - name: role
    type: _types.string
    pii: false
  - name: app
    type: _types.string
    pii: false
    required_for: [http, job]

  # ---------- 业务 ----------
  - name: module
    type: _types.string
    pii: false
  - name: entity
    type: _types.string
    pii: false
  - name: entity_id
    type: _types.string
    pii: false
  - name: error_code
    type: _types.string
    pii: false
    ref: platform.errors
  - name: job
    type: _types.string
    pii: false
    required_for: [job]
  - name: attempt
    type: _types.integer
    pii: false
    required_for: [job]

never_log:
  - password
  - token
  - authorization
  - secret
  - email
  - phone
  - request_ip
  - device_id
  - location
  - username
  - nickname
  - number
  - content
  - "*_title"         # 任何 pii: true 的标题字段
  - "*_body"          # 用户正文内容；has_body 这类布尔字段必须改名
  - "*_hash"          # 密码/令牌/验证码哈希
  - "*_token"         # access_token/refresh_token 等
  - "*_password"      # old_password/new_password 等
  - "*_secret"        # client_secret 等
  - "*_authorization" # proxy_authorization 等
  - "*_email"         # contact_email/primary_email 等
  - "*_phone"         # contact_phone/primary_phone 等

pii_source: "checker 汇总 data/tables/*.yaml 中 sensitivity: pii|secret 的列，必须被 never_log 覆盖"

rules:
  - "路径记录路由模板（/v1/account/{id}），不记录实际值"
  - "错误日志必须带 request_id 与 error_code"
  - "生产 level >= warn，debug 仅 dev 环境"
