id: platform.security.access
summary: "入口访问策略（权限、审计、限流）"
schema_version: 1
stability: draft
do_not:
  - "入口策略只在此绑定；service 契约不重复声明"
bindings:
  - { target: cap.services.account.get, permissions: [platform.security.permissions.account_read] }
  - { target: cap.services.account.list, permissions: [platform.security.permissions.account_read], rate_limit: { requests: 60, window_seconds: 60 } }
  - { target: cap.services.account.create, permissions: [platform.security.permissions.account_write], audit: true }
  - { target: cap.services.account.update, permissions: [platform.security.permissions.account_write], audit: true }
  - { target: cap.services.account.delete, permissions: [platform.security.permissions.account_delete], audit: true }
  - { target: cap.services.account.activate, permissions: [platform.security.permissions.account_write], audit: true }
  - { target: cap.services.account.suspend, permissions: [platform.security.permissions.account_write], audit: true }
  - { target: cap.services.auth.login, audit: true, rate_limit: { requests: 10, window_seconds: 60 } }
  - { target: cap.services.verification.send, audit: true, rate_limit: { requests: 5, window_seconds: 60 } }
  - { target: cap.services.verification.verify, audit: true, rate_limit: { requests: 10, window_seconds: 60 } }
  - { target: cap.services.token.logout, audit: true }
  - { target: cap.services.token.refresh, audit: true, rate_limit: { requests: 30, window_seconds: 60 } }
  - { target: cap.services.token.verify, rate_limit: { requests: 120, window_seconds: 60 } }
  - { target: cap.services.auth.bind_password, permissions: [platform.security.permissions.account_write], audit: true }
  - { target: cap.services.auth.bind_phone, permissions: [platform.security.permissions.account_write], audit: true }
  - { target: cap.services.auth.bind_email, permissions: [platform.security.permissions.account_write], audit: true }
  - { target: cap.services.dictionary.list_roots, permissions: [platform.security.permissions.dictionary_read], rate_limit: { requests: 60, window_seconds: 60 } }
  - { target: cap.services.dictionary.list_children, permissions: [platform.security.permissions.dictionary_read] }
  - { target: cap.services.dictionary.get, permissions: [platform.security.permissions.dictionary_read] }
  - { target: cap.services.dictionary.get_by_id, permissions: [platform.security.permissions.dictionary_read] }
  - { target: cap.services.dictionary.create, permissions: [platform.security.permissions.dictionary_write], audit: true }
  - { target: cap.services.dictionary.update, permissions: [platform.security.permissions.dictionary_write], audit: true }
  - { target: cap.services.dictionary.import, permissions: [platform.security.permissions.dictionary_write], audit: true }
  - { target: cap.services.dictionary.move, permissions: [platform.security.permissions.dictionary_write], audit: true }
  - { target: cap.services.dictionary.set_status, permissions: [platform.security.permissions.dictionary_write], audit: true }
  - { target: cap.services.dictionary.delete, permissions: [platform.security.permissions.dictionary_delete], audit: true }
  - { target: cap.services.attachment.list, permissions: [platform.security.permissions.attachment_read], rate_limit: { requests: 60, window_seconds: 60 } }
  - { target: cap.services.attachment.get, permissions: [platform.security.permissions.attachment_read] }
  - { target: cap.services.attachment.get_by_key, permissions: [platform.security.permissions.attachment_read] }
  - { target: cap.services.attachment.create_upload, permissions: [platform.security.permissions.attachment_write], audit: true }
  - { target: cap.services.attachment.complete_upload, permissions: [platform.security.permissions.attachment_write], audit: true }
  - { target: cap.services.attachment.get_download_url, permissions: [platform.security.permissions.attachment_read] }
  - { target: cap.services.attachment.delete, permissions: [platform.security.permissions.attachment_delete], audit: true }
