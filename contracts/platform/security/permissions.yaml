# 权限点唯一来源。

schema_version: 1
id: platform.security.permissions
summary: "权限点"
stability: draft
do_not:
  - "权限点只增不改；删除必须走弃用流程"
  - "资源级权限不要只靠权限点，必须在 features/rules 声明"

naming:
  pattern: "<resource>_<action>"
  actions: [read, write, delete, manage]

permissions:
  # ---------- 字典 ----------
  - { code: dictionary_read, resource: dictionary, action: "read", description: "查看字典" }
  - { code: dictionary_write, resource: dictionary, action: "write", description: "创建与编辑字典" }
  - { code: dictionary_delete, resource: dictionary, action: "delete", description: "删除字典" }

  # ---------- 附件 ----------
  - { code: attachment_read, resource: attachment, action: "read", description: "查看附件" }
  - { code: attachment_write, resource: attachment, action: "write", description: "上传、替换与标记失败" }
  - { code: attachment_delete, resource: attachment, action: "delete", description: "删除附件" }

  # ---------- 账号 ----------
  - { code: account_read, resource: account, action: "read", description: "查看账号" }
  - { code: account_write, resource: account, action: "write", description: "创建与编辑账号" }
  - { code: account_delete, resource: account, action: "delete", description: "删除账号" }

  # ---------- 角色 ----------
  - { code: role_manage, resource: role, action: "manage", description: "管理角色与权限" }

  # ---------- 审计 ----------
  - { code: audit_read, resource: audit, action: "read", description: "查看审计日志" }

boundaries:
  resource_level:
    example: "见 feature.rules.account.self_only"

  wildcard:
    allowed_for: [platform.security.roles.admin]
    note: "仅 admin 角色可使用 *"