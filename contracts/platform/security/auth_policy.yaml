# 认证与会话策略。影响 cookie、CSRF、token 生命周期。

schema_version: 1
id: platform.security.auth_policy
summary: "会话与认证策略"
stability: stable

token:
  persistence: data.tables.token
  storage: "hash"
  hash_algorithm: sha256
  access:
    type: jwt
    algorithm: HS256
    ttl: 15m
    claims_required: [sub, aud, exp, iat, jti]
    audience: [web/admin]
    pii_in_token: false
    storage: "hash"              # 仅存哈希用于吊销/审计；校验优先验签
  refresh:
    type: opaque
    ttl: 30d
    rotation: true               # 每次刷新换新 token，旧的作废
    reuse_detection: true        # 复用旧 token 即吊销全部会话
    storage: "hash"
    table: data.tables.token
    cookie:
      name: refresh_token
      same_site: Lax
      secure: platform.environments（security.cookie_secure）
      path: /v1/auth/refresh
      http_only: true

session:
  max_concurrent: 5
  idle_timeout: 7d
  absolute_timeout: 30d
  revoke_on_password_change: true
  store: database

csrf:
  strategy: double_submit_cookie
  applies_to: cookie_based_endpoints
  header: X-CSRF-Token
  exempt: [GET, HEAD, OPTIONS]

password:
  algorithm: argon2id
  hash_field: data.tables.auth_pwd.col.password_hash
  min_length: 12
  require_mixed_case: false
  max_attempts: 5
  lockout: 15m
  breach_check: true
  legacy:
    field: data.tables.auth_pwd.col.password_md5
    note: "仅兼容遗留系统；新密码写入 password_hash，登录成功后清除 MD5"

mfa:
  required_for_roles: [admin]
  methods: [totp]
  recovery_codes: 10

authorization:
  model: rbac + resource_rule
  note: "角色决定\"能不能做\"，business/rules 决定\"能不能对这个资源做\""
  deny_by_default: true
