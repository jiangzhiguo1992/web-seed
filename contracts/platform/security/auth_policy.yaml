# JWT 认证策略：access/refresh 都是 JWT；token 表存哈希，用于校验吊销、轮换与审计。

id: platform.security.auth_policy
summary: "JWT 令牌认证策略"
schema_version: 1
stability: draft
do_not:
  - "认证只依赖 JWT 与 Authorization header"
  - "token 表只存 JWT 哈希与吊销/轮换元数据，不存 JWT 原文"

token:
  persistence: data.tables.token
  storage: "hash"
  hash_algorithm: sha256
  issuer: web-seed
  access:
    format: jwt
    algorithm: HS256
    ttl: 15m
    claims_required: [iss, sub, aud, exp, iat, jti]
    audience: [admin, user]
    pii_in_token: false
  refresh:
    format: jwt
    algorithm: HS256
    ttl: 30d
    claims_required: [iss, sub, aud, exp, iat, jti]
    audience: [admin, user]
    pii_in_token: false
    rotation: true
    reuse_detection: true
    storage: "hash"
    table: data.tables.token
  revocation:
    strategy: server
    note: "JWT 验签后仍查 token 表 revoked_at；登出、refresh 轮换、账号删除、改密/换绑都会吊销记录；access JWT 的撤销即时生效"

password:
  algorithm: argon2id
  hash_field: data.tables.auth_pwd.col.password_hash
  min_length: 12
  require_mixed_case: false
  max_attempts: 5
  lockout: 15m
  breach_check: true

verification:
  table: data.tables.verification_body
  code:
    length: 6
    charset: digits
    storage: "hash"
    hash_algorithm: hmac-sha256
    secret_env: AUTH_VERIFICATION_SECRET
  ttl: 10m
  max_attempts: 5
  target_normalization:
    phone: e164
    email: lowercase

mfa:
  required_for_roles: [admin]
  methods: [totp]
  recovery_codes: 10

authorization:
  model: rbac + resource_rule
  note: "角色决定\"能不能做\"，features/rules 决定\"能不能对这个资源做\""
  deny_by_default: true
