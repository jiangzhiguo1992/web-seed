id: platform.errors.account
summary: "账号错误码"
schema_version: 1
stability: draft
do_not:
  - "账号错误与认证错误分开，不要把认证失败塞进 ACCOUNT_*"
errors:
  - { code: ACCOUNT_NOT_FOUND, biz_code: 2001, status: 404, retryable: false, i18n: errors.account.not_found, message: "账号不存在" }
  - { code: ACCOUNT_NUMBER_TAKEN, biz_code: 2002, status: 409, retryable: false, i18n: errors.account.number_taken, message: "账号编号已被使用" }
  - { code: ACCOUNT_NUMBER_INVALID, biz_code: 2003, status: 422, retryable: false, i18n: errors.account.number_invalid, message: "账号编号格式不合法" }
  - { code: ACCOUNT_NICKNAME_INVALID, biz_code: 2004, status: 422, retryable: false, i18n: errors.account.nickname_invalid, message: "昵称长度不合法" }
  - { code: ACCOUNT_SUSPENDED, biz_code: 2005, status: 403, retryable: false, i18n: errors.account.suspended, message: "账号已被封禁" }
  - { code: ACCOUNT_ILLEGAL_TRANSITION, biz_code: 2006, status: 409, retryable: false, i18n: errors.account.illegal_transition, message: "当前状态不允许该操作" }
  - { code: ACCOUNT_ALREADY_DELETED, biz_code: 2007, status: 409, retryable: false, i18n: errors.account.already_deleted, message: "账号已删除" }
