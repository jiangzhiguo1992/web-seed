id: platform.errors.verification
summary: "验证码错误码"
schema_version: 1
stability: draft
do_not:
  - "验证码错误不要暴露验证码内容或目标原文"
errors:
  - { code: AUTH_VERIFICATION_INVALID, status: 422, retryable: false, i18n: errors.auth.verification_invalid, message: "验证码不正确" }
  - { code: AUTH_VERIFICATION_EXPIRED, status: 422, retryable: false, i18n: errors.auth.verification_expired, message: "验证码已过期" }
  - { code: AUTH_VERIFICATION_ATTEMPTS_EXCEEDED, status: 423, retryable: true, i18n: errors.auth.verification_attempts_exceeded, message: "验证码尝试次数过多" }
  - { code: AUTH_VERIFICATION_TARGET_INVALID, status: 422, retryable: false, i18n: errors.auth.verification_target_invalid, message: "验证目标格式不合法" }
