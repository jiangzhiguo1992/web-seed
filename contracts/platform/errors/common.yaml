  - { code: COMMON_UNSUPPORTED_MEDIA_TYPE, biz_code: 1012, status: 415, retryable: false, i18n: errors.common.unsupported_media_type, message: "不支持的 Content-Type" }
  - { code: COMMON_GONE, biz_code: 1013, status: 410, retryable: false, i18n: errors.common.gone, message: "端点已移除" }
