id: platform.errors.common
summary: "通用错误码"
schema_version: 1
stability: draft
do_not:
  - "通用错误码不绑定具体业务域"
errors:
  - { code: COMMON_BAD_REQUEST, biz_code: 1001, status: 400, retryable: false, i18n: errors.common.bad_request, message: "请求参数不合法" }
  - { code: COMMON_UNAUTHORIZED, biz_code: 1002, status: 401, retryable: false, i18n: errors.common.unauthorized, message: "未认证" }
  - { code: COMMON_FORBIDDEN, biz_code: 1003, status: 403, retryable: false, i18n: errors.common.forbidden, message: "无权限" }
  - { code: COMMON_NOT_FOUND, biz_code: 1004, status: 404, retryable: false, i18n: errors.common.not_found, message: "资源不存在" }
  - { code: COMMON_CONFLICT, biz_code: 1005, status: 409, retryable: false, i18n: errors.common.conflict, message: "状态冲突" }
  - { code: COMMON_RATE_LIMITED, biz_code: 1006, status: 429, retryable: true, i18n: errors.common.rate_limited, message: "请求过于频繁" }
  - { code: COMMON_INTERNAL, biz_code: 1007, status: 500, retryable: true, i18n: errors.common.internal, message: "服务端错误" }
