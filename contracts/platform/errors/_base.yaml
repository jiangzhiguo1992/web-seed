# 错误码全局约定；具体错误码按域放在同目录文件。

id: platform.errors.base
summary: "错误码全局约定"
schema_version: 1
stability: draft
do_not:
  - "错误码只增不改；改变含义必须新建 code"

naming:
  pattern: "<DOMAIN>_<REASON>"
  common_prefix: COMMON_
  # 号段规划：每个域 1000；7000-7999 dictionary，8000-8999 attachment；
  # 9000-9999 预留给后续存储/审计域。新增域时同步 order 与 ranges。
  # 当前 46 条；按 13 个域、每域约 15 条预留 200 条上限。
  max_total: 200

# 响应信封 code 的整数业务码；0 保留给成功。
# 每个错误项必须写 biz_code，且落在所属文件的号段内、全局唯一。
biz_code:
  success_code: 0
  ranges:
    common: [1000, 1999]
    account: [2000, 2999]
    auth: [3000, 3999]
    verification: [4000, 4999]
    token: [5000, 5999]
    data_access: [6000, 6999]
    dictionary: [7000, 7999]
    attachment: [8000, 8999]

order: [common, account, auth, verification, token, dictionary, attachment]

mapping_rules:
  - { status: 400, when: "请求体/参数校验失败" }
  - { status: 401, when: "缺失或无效凭据、令牌无效/过期" }
  - { status: 403, when: "已认证但无权限，或账号被封禁" }
  - { status: 404, when: "资源不存在或对当前用户不可见" }
  - { status: 409, when: "版本冲突、状态冲突、唯一约束" }
  - { status: 422, when: "语义校验失败（格式正确但业务不接受）" }
  - { status: 423, when: "认证锁定中" }
  - { status: 429, when: "触发限流" }
  - { status: 500, when: "未预期错误，必须记日志并含 request_id" }
  - { status: 503, when: "依赖暂不可用或循环预算耗尽，可稍后重试；建议带 Retry-After" }
