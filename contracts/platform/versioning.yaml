# API 版本、弃用与兼容策略。

schema_version: 1
id: platform.versioning
summary: "版本与兼容策略"
stability: draft
do_not:
  - "弃用窗口内不得移除端点；只能标记 deprecated"

api:
  scheme: url_major             # /v1 /v2
  current: v1
  stability_levels:
    - { level: experimental, note: "可随时变更，需显式标注" }
    - { level: stable, note: "遵守弃用流程" }
    - { level: deprecated, note: "已弃用，倒计时中" }

contract:
  schema_version: 1
  evolution: additive_only       # 只增不改：加字段/加端点合法，改语义不合法

compatibility:
  accepted_breaking_changes:
    - id: v1-http-redesign
      baseline: origin/main
      reason: "v1 从 Problem 信封/裸路径迁移到统一 code/message 信封 + mount/paths；v2 是迁移目标"
      scope: ["v1"]
  breaking_changes:
    definition:
      - "删除或改名端点"
      - "删除或改名响应字段"
      - "改字段类型或格式"
      - "收紧校验（新增必填、降低上限）"
      - "改错误码含义"
    requires: major_version_bump
  non_breaking:
    - "新增可选请求字段"
    - "新增响应字段（客户端必须忽略未知字段）"
    - "新增端点"
    - "放宽校验"

deprecation:
  header_required: true
  headers:
    - { name: Deprecation, format: RFC9745, example: "@1789000000" }
    - { name: Sunset, format: HTTP-date, example: "Wed, 11 Mar 2027 00:00:00 GMT" }
  min_window_days: 90
  process:
    - "契约标记 stability: deprecated"
    - "响应加 Deprecation / Sunset"
    - "文档登记迁移指南"
    - "窗口结束且无调用后移除"

detection:
  command: make contract-compat
  baseline_command: make contract-compat-baseline
  tool: oasdiff
  baseline: origin/main
  fail_on: [breaking]
  note: "v2 需要独立的 mount.api_version: v2 文件；当前未提供 v2 契约，兼容检测只做 baseline 对比"

client_requirements:
  - "必须忽略未知响应字段"
  - "必须处理 410 Gone"
  - "不得缓存 Deprecation 头之外的 5xx"
