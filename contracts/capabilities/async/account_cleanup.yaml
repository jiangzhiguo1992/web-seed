# 定期清理长期未激活的账号。五要素必须齐全，缺一即校验失败。

schema_version: 1
id: cap.async.account_cleanup
summary: 未激活账号清理任务
stability: draft
module: accounts
do_not:
  - 只清理 pending 状态，不要碰 active / suspended
  - 必须保留审计事件，不要静默删除
  - 多实例部署时必须持有分布式锁，不能只靠 max_in_flight
  - 本任务按天清理；data.tables.account.retention.unit 必须为 days，阈值读 retention.pending

trigger:
  type: cron
  schedule: "0 4 * * *"
  timezone: UTC

input:
  type: object
  additionalProperties: false
  properties:
    older_than_days: { type: integer, minimum: 1, default: 7, x-source: data.tables.account.retention.pending }
    batch_size: { type: integer, minimum: 1, maximum: 1000, default: 100 }

output:
  type: object
  additionalProperties: false
  required: [deleted_count]
  properties:
    deleted_count: { type: integer, minimum: 0 }

uses:
  - data.queries.account.list_stale_pending_accounts
  - data.queries.account.soft_delete_stale_pending_accounts

idempotency:
  key: "account_cleanup:{date}:{older_than_days}"
  window: 24h
  rationale: 同一天重复执行结果一致，已软删记录不会被再次匹配

retry:
  max_attempts: 3
  backoff: exponential
  initial_delay: 30s
  max_delay: 10m
  dead_letter: account_cleanup_dlq

concurrency:
  max_in_flight: 1
  lock: postgres_advisory_lock
  rationale: 避免多实例同时扫同一批数据

observability:
  log_event: job.account_cleanup.completed
  metrics:
    - platform.observability.metrics.job_duration_ms
    - platform.observability.metrics.job_failed_total
