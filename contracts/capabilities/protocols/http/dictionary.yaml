id: cap.protocols.http.dictionary
summary: "字典 HTTP 接口"
owner_module: system
schema_version: 1
stability: draft
do_not:
  - "响应返回 data.entities.dictionary；不要暴露表行或内部缓存"
  - "删除是软删；HTTP DELETE 成功返回 204"

mount:
  api_version: v1
  path: /dictionary
  audience: [admin]

paths:
  /admin:
    get:
      id: cap.protocols.http.dictionary.list
      name: listDictionaries
      summary: "列出顶级字典"
      service: cap.services.dictionary.list_roots
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
        query:
          - { name: offset, type: _types.page_offset, required: false, description: "分页偏移；默认 0", to: params.offset }
          - { name: limit, type: _types.page_limit, required: false, description: "分页大小；默认 20", to: params.limit }
      response:
        200:
          msg: "成功"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            type: cap.services.dictionary.schemas.DictionaryPage

    post:
      id: cap.protocols.http.dictionary.create
      name: createDictionary
      summary: "创建字典"
      service: cap.services.dictionary.create
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          type: cap.services.dictionary.schemas.CreateDictionaryInput
          to: params.input
      response:
        201:
          msg: "已创建"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
            - { name: Location, required: false, type: _types.string, description: "新字典资源地址" }
          body:
            kind: json
            type: data.entities.dictionary
        409:
          msg: "状态冲突"
          headers: []
          errors:
            - platform.errors.DICTIONARY_CODE_TAKEN
        422:
          msg: "语义校验失败"
          headers: []
          errors:
            - platform.errors.DICTIONARY_INVALID
            - platform.errors.DICTIONARY_PARENT_INVALID

  /admin/import:
    post:
      id: cap.protocols.http.dictionary.import
      name: importDictionaries
      summary: "批量导入字典"
      service: cap.services.dictionary.import
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          type: cap.services.dictionary.schemas.DictionaryImportInput
          to: params.input
      response:
        200:
          msg: "成功"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            type: cap.services.dictionary.schemas.ImportResult
        409:
          msg: "状态冲突"
          headers: []
          errors:
            - platform.errors.DICTIONARY_CODE_TAKEN
        422:
          msg: "语义校验失败"
          headers: []
          errors:
            - platform.errors.DICTIONARY_INVALID
            - platform.errors.DICTIONARY_PARENT_INVALID


  /admin/{id}:
    get:
      id: cap.protocols.http.dictionary.get
      name: getDictionary
      summary: "获取字典"
      service: cap.services.dictionary.get_by_id
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
        path:
          - { name: id, type: _types.id, description: "字典 ID", to: params.id }
      response:
        200:
          msg: "成功"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            type: data.entities.dictionary
        404:
          msg: "资源不存在"
          headers: []
          errors:
            - platform.errors.DICTIONARY_NOT_FOUND

    patch:
      id: cap.protocols.http.dictionary.update
      name: updateDictionary
      summary: "更新字典"
      service: cap.services.dictionary.update
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        path:
          - { name: id, type: _types.id, description: "字典 ID", to: params.id }
        body:
          kind: json
          type: cap.services.dictionary.schemas.UpdateDictionaryInput
          to: params.input
      response:
        200:
          msg: "成功"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            type: data.entities.dictionary
        404:
          msg: "资源不存在"
          headers: []
          errors:
            - platform.errors.DICTIONARY_NOT_FOUND
        422:
          msg: "语义校验失败"
          headers: []
          errors:
            - platform.errors.DICTIONARY_INVALID

    delete:
      id: cap.protocols.http.dictionary.delete
      name: deleteDictionary
      summary: "删除字典（软删）"
      service: cap.services.dictionary.delete
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
        path:
          - { name: id, type: _types.id, description: "字典 ID", to: params.id }
      response:
        204:
          msg: "已删除"
          headers: []
        404:
          msg: "资源不存在"
          headers: []
          errors:
            - platform.errors.DICTIONARY_NOT_FOUND
        409:
          msg: "状态冲突"
          headers: []
          errors:
            - platform.errors.DICTIONARY_HAS_CHILDREN

  /admin/{id}/children:
    get:
      id: cap.protocols.http.dictionary.children
      name: listDictionaryChildren
      summary: "列出字典子节点"
      service: cap.services.dictionary.list_children
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
        path:
          - { name: id, type: _types.id, description: "父字典 ID", to: params.parent_id }
        query:
          - { name: offset, type: _types.page_offset, required: false, description: "分页偏移；默认 0", to: params.offset }
          - { name: limit, type: _types.page_limit, required: false, description: "分页大小；默认 20", to: params.limit }
      response:
        200:
          msg: "成功"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            type: cap.services.dictionary.schemas.DictionaryPage

  /admin/{id}/status:
    post:
      id: cap.protocols.http.dictionary.set_status
      name: setDictionaryStatus
      summary: "启用或停用字典"
      service: cap.services.dictionary.set_status
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        path:
          - { name: id, type: _types.id, description: "字典 ID", to: params.id }
        body:
          kind: json
          type: cap.services.dictionary.schemas.SetDictionaryStatusInput
          to: params.input
      response:
        200:
          msg: "成功"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            type: data.entities.dictionary
        404:
          msg: "资源不存在"
          headers: []
          errors:
            - platform.errors.DICTIONARY_NOT_FOUND
        409:
          msg: "状态冲突"
          headers: []
          errors:
            - platform.errors.DICTIONARY_ILLEGAL_TRANSITION

  /admin/{id}/move:
    post:
      id: cap.protocols.http.dictionary.move
      name: moveDictionary
      summary: "移动字典节点"
      service: cap.services.dictionary.move
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        path:
          - { name: id, type: _types.id, description: "字典 ID", to: params.id }
        body:
          kind: json
          type: cap.services.dictionary.schemas.MoveDictionaryInput
          to: params.input
      response:
        200:
          msg: "成功"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            type: data.entities.dictionary
        404:
          msg: "资源不存在"
          headers: []
          errors:
            - platform.errors.DICTIONARY_NOT_FOUND
        422:
          msg: "语义校验失败"
          headers: []
          errors:
            - platform.errors.DICTIONARY_PARENT_INVALID
