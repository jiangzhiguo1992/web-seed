id: cap.protocols.http.account
summary: "账号 HTTP 接口"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "响应禁止包含密码、手机号、邮箱、令牌；Account schema 不得加这些字段"
  - "枚举必须引用 data.enums.*；不要在此重复枚举值"

mount:
  api_version: v1
  path: /account
  audience: [admin]

paths:
  /admin:
    get:
      id: cap.protocols.http.account.list
      name: listAccounts
      summary: "列出账号"
      service: cap.services.account.list
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
        query:
          - { name: status, type: data.enums.account_status, required: false, description: "账号状态过滤", to: params.status }
          - { name: offset, type: _types.basics.page_offset, required: false, description: "分页偏移；默认 0", to: params.offset }
          - { name: limit, type: _types.basics.page_limit, required: false, description: "分页大小；默认 20", to: params.limit }
      response:
        200:
          msg: "成功"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            type: cap.services.account.schemas.AccountPage
      used_by:
        - feature.pages.account_list

    post:
      id: cap.protocols.http.account.create
      name: createAccount
      summary: "创建账号"
      service: cap.services.account.create
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          type: cap.services.account.schemas.CreateAccountInput
          to: params.input
      response:
        201:
          msg: "已创建"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
            - { name: Location, required: false, type: _types.basics.string, description: "新账号资源地址" }
          body:
            kind: json
            type: data.entities.account
        409:
          msg: "状态冲突"
          headers: []
          errors:
            - platform.errors.ACCOUNT_NUMBER_TAKEN
        422:
          msg: "语义校验失败"
          headers: []
          errors:
            - platform.errors.ACCOUNT_NICKNAME_INVALID
            - platform.errors.ACCOUNT_NUMBER_INVALID
      used_by:
        - feature.pages.account_create

  /admin/{id}:
    get:
      id: cap.protocols.http.account.get
      name: getAccount
      summary: "获取账号"
      service: cap.services.account.get
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
        path:
          - { name: id, type: _types.basics.id, description: "账号 ID", to: params.id }
      response:
        200:
          msg: "成功"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            type: data.entities.account
        404:
          msg: "资源不存在"
          headers: []
          errors:
            - platform.errors.ACCOUNT_NOT_FOUND
      used_by:
        - feature.pages.account_detail
        - feature.pages.account_security

    patch:
      id: cap.protocols.http.account.update
      name: updateAccount
      summary: "更新账号资料"
      service: cap.services.account.update
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        path:
          - { name: id, type: _types.basics.id, description: "账号 ID", to: params.id }
        body:
          kind: json
          type: cap.services.account.schemas.UpdateAccountInput
          to: params.input
      response:
        200:
          msg: "成功"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            type: data.entities.account
        404:
          msg: "资源不存在"
          headers: []
          errors:
            - platform.errors.ACCOUNT_NOT_FOUND
        409:
          msg: "状态冲突"
          headers: []
          errors:
            - platform.errors.ACCOUNT_ALREADY_DELETED
        422:
          msg: "语义校验失败"
          headers: []
          errors:
            - platform.errors.ACCOUNT_NICKNAME_INVALID
      used_by:
        - feature.pages.account_detail

    delete:
      id: cap.protocols.http.account.delete
      name: deleteAccount
      summary: "删除账号（软删）"
      service: cap.services.account.delete
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
        path:
          - { name: id, type: _types.basics.id, description: "账号 ID", to: params.id }
      response:
        204:
          msg: "已删除"
          headers: []
        404:
          msg: "资源不存在"
          headers: []
          errors:
            - platform.errors.ACCOUNT_NOT_FOUND
        409:
          msg: "状态冲突"
          headers: []
          errors:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
      used_by:
        - feature.pages.account_list
        - feature.pages.account_detail

  /admin/{id}/activate:
    post:
      id: cap.protocols.http.account.activate
      name: activateAccount
      summary: "激活账号"
      service: cap.services.account.activate
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
        path:
          - { name: id, type: _types.basics.id, description: "账号 ID", to: params.id }
      response:
        200:
          msg: "成功"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            type: data.entities.account
        404:
          msg: "资源不存在"
          headers: []
          errors:
            - platform.errors.ACCOUNT_NOT_FOUND
        409:
          msg: "状态冲突"
          headers: []
          errors:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
      used_by:
        - feature.pages.account_list
        - feature.pages.account_detail

  /admin/{id}/suspend:
    post:
      id: cap.protocols.http.account.suspend
      name: suspendAccount
      summary: "封禁账号"
      service: cap.services.account.suspend
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        path:
          - { name: id, type: _types.basics.id, description: "账号 ID", to: params.id }
        body:
          kind: json
          type: cap.services.account.schemas.SuspendAccountInput
          to: params.input
      response:
        200:
          msg: "成功"
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            type: data.entities.account
        404:
          msg: "资源不存在"
          headers: []
          errors:
            - platform.errors.ACCOUNT_NOT_FOUND
        409:
          msg: "状态冲突"
          headers: []
          errors:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
      used_by:
        - feature.pages.account_list
        - feature.pages.account_detail
