id: cap.protocols.http.account
summary: "账号 HTTP 接口"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "响应禁止包含密码、手机号、邮箱、令牌；Account schema 不得加这些字段"
  - "枚举必须引用 data.enums.*；不要在此重复枚举值"

mount:
  api_version: v1
  path: /account
  audience: [admin]

paths:
  /admin:
    get:
      id: cap.protocols.http.account.list
      name: listAccounts
      service: cap.services.account.list
      summary: "列出账号"
      used_by:
        - feature.pages.account_list
      request:
        headers:
          - { name: Authorization, required: true, auth: BearerAuth, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Connection, required: false, value: keep-alive, description: "hop-by-hop 连接控制" }
        query:
          - { name: status, schema: data.enums.account_status, required: false, description: "账号状态过滤", to: params.status }
          - { name: offset, schema: _types.page_offset, required: false, description: "分页偏移；默认 0", to: params.offset }
          - { name: limit, schema: _types.page_limit, required: false, description: "分页大小；默认 20", to: params.limit }
      response:
        200:
          description: "成功"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
            - { name: Content-Length, required: false, schema: _types.integer, description: "响应体长度；通常由传输层生成" }
          body:
            kind: json
            schema: cap.services.account.schemas.AccountPage

    post:
      id: cap.protocols.http.account.create
      name: createAccount
      service: cap.services.account.create
      summary: "创建账号"
      used_by:
        - feature.pages.account_create
      request:
        headers:
          - { name: Authorization, required: true, auth: BearerAuth, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, required: true, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          schema: cap.services.account.schemas.CreateAccountInput
          to: params.input
      response:
        201:
          description: "已创建"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
            - { name: Location, required: false, schema: _types.string, description: "新账号资源地址" }
          body:
            kind: json
            schema: data.entities.account
        409:
          codes:
            - platform.errors.ACCOUNT_NUMBER_TAKEN
        422:
          codes:
            - platform.errors.ACCOUNT_NICKNAME_INVALID
            - platform.errors.ACCOUNT_NUMBER_INVALID

  /admin/{id}:
    get:
      id: cap.protocols.http.account.get
      name: getAccount
      service: cap.services.account.get
      summary: "获取账号"
      used_by:
        - feature.pages.account_detail
        - feature.pages.account_security
      request:
        headers:
          - { name: Authorization, required: true, auth: BearerAuth, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
        path:
          - { name: id, schema: _types.positive_integer, description: "账号 ID", to: params.id }
      response:
        200:
          description: "成功"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            schema: data.entities.account
        404:
          codes:
            - platform.errors.ACCOUNT_NOT_FOUND

    patch:
      id: cap.protocols.http.account.update
      name: updateAccount
      service: cap.services.account.update
      summary: "更新账号资料"
      used_by:
        - feature.pages.account_detail
      request:
        headers:
          - { name: Authorization, required: true, auth: BearerAuth, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, required: true, value: application/json, description: "请求体媒体类型" }
        path:
          - { name: id, schema: _types.positive_integer, description: "账号 ID", to: params.id }
        body:
          kind: json
          schema: cap.services.account.schemas.UpdateAccountInput
          to: params.input
      response:
        200:
          description: "成功"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            schema: data.entities.account
        404:
          codes:
            - platform.errors.ACCOUNT_NOT_FOUND
        409:
          codes:
            - platform.errors.ACCOUNT_ALREADY_DELETED
        422:
          codes:
            - platform.errors.ACCOUNT_NICKNAME_INVALID

    delete:
      id: cap.protocols.http.account.delete
      name: deleteAccount
      service: cap.services.account.delete
      summary: "删除账号（软删）"
      used_by:
        - feature.pages.account_list
        - feature.pages.account_detail
      request:
        headers:
          - { name: Authorization, required: true, auth: BearerAuth, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
        path:
          - { name: id, schema: _types.positive_integer, description: "账号 ID", to: params.id }
      response:
        204:
          description: "已删除"
        404:
          codes:
            - platform.errors.ACCOUNT_NOT_FOUND
        409:
          codes:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.ACCOUNT_ILLEGAL_TRANSITION

  /admin/{id}/activate:
    post:
      id: cap.protocols.http.account.activate
      name: activateAccount
      service: cap.services.account.activate
      summary: "激活账号"
      used_by:
        - feature.pages.account_list
        - feature.pages.account_detail
      request:
        headers:
          - { name: Authorization, required: true, auth: BearerAuth, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
        path:
          - { name: id, schema: _types.positive_integer, description: "账号 ID", to: params.id }
      response:
        200:
          description: "成功"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            schema: data.entities.account
        404:
          codes:
            - platform.errors.ACCOUNT_NOT_FOUND
        409:
          codes:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.ACCOUNT_ILLEGAL_TRANSITION

  /admin/{id}/suspend:
    post:
      id: cap.protocols.http.account.suspend
      name: suspendAccount
      service: cap.services.account.suspend
      summary: "封禁账号"
      used_by:
        - feature.pages.account_list
        - feature.pages.account_detail
      request:
        headers:
          - { name: Authorization, required: true, auth: BearerAuth, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, required: true, value: application/json, description: "请求体媒体类型" }
        path:
          - { name: id, schema: _types.positive_integer, description: "账号 ID", to: params.id }
        body:
          kind: json
          schema: cap.services.account.schemas.SuspendAccountInput
          to: params.input
      response:
        200:
          description: "成功"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            schema: data.entities.account
        404:
          codes:
            - platform.errors.ACCOUNT_NOT_FOUND
        409:
          codes:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
