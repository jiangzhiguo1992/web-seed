id: cap.protocols.http.account
summary: "账号 HTTP 接口"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "响应禁止包含密码、手机号、邮箱、令牌；Account schema 不得加这些字段"
  - "枚举必须引用 data.enums.*；不要在此重复枚举值"

mount:
  path: /account
  audience: [admin]

paths:
  /admin:
    get:
      id: cap.protocols.http.account.list
      name: listAccounts
      service: cap.services.account.list
      summary: "列出账号"
      used_by:
        - feature.pages.account_list
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
        query:
          status: { schema: data.enums.account_status }
          offset: { schema: _types.page_offset }
          limit: { schema: _types.page_limit }
        mapping:
          query:
            status: filter.status
            offset: filter.offset
            limit: filter.limit
        idempotency: none
      response:
        200:
          description: "成功"
          headers:
            X-Request-Id: XRequestId
          body:
            content_type: application/json
            schema: cap.services.account.schemas.AccountPage

    post:
      id: cap.protocols.http.account.create
      name: createAccount
      service: cap.services.account.create
      summary: "创建账号"
      used_by:
        - feature.pages.account_create
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
          Idempotency-Key: IdempotencyKeyRequired
        body:
          content_type: application/json
          schema: cap.services.account.schemas.CreateAccountInput
        mapping:
          body: "input"
        idempotency: required
      response:
        201:
          description: "已创建"
          headers:
            X-Request-Id: XRequestId
          body:
            content_type: application/json
            schema: data.entities.account
        409:
          codes:
            - platform.errors.ACCOUNT_NUMBER_TAKEN
        422:
          codes:
            - platform.errors.ACCOUNT_NICKNAME_INVALID
            - platform.errors.ACCOUNT_NUMBER_INVALID

  /admin/{id}:
    get:
      id: cap.protocols.http.account.get
      name: getAccount
      service: cap.services.account.get
      summary: "获取账号"
      used_by:
        - feature.pages.account_detail
        - feature.pages.account_security
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
        path:
          id: { schema: _types.integer }
        mapping:
          path:
            id: id
        idempotency: none
      response:
        200:
          description: "成功"
          headers:
            X-Request-Id: XRequestId
          body:
            content_type: application/json
            schema: data.entities.account
        404:
          codes:
            - platform.errors.ACCOUNT_NOT_FOUND

    patch:
      id: cap.protocols.http.account.update
      name: updateAccount
      service: cap.services.account.update
      summary: "更新账号资料"
      used_by:
        - feature.pages.account_detail
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
          Idempotency-Key: IdempotencyKey
        path:
          id: { schema: _types.integer }
        body:
          content_type: application/json
          schema: cap.services.account.schemas.UpdateAccountInput
        mapping:
          path:
            id: id
          body: "input"
        idempotency: optional
      response:
        200:
          description: "成功"
          headers:
            X-Request-Id: XRequestId
          body:
            content_type: application/json
            schema: data.entities.account
        404:
          codes:
            - platform.errors.ACCOUNT_NOT_FOUND
        409:
          codes:
            - platform.errors.ACCOUNT_ALREADY_DELETED
        422:
          codes:
            - platform.errors.ACCOUNT_NICKNAME_INVALID

    delete:
      id: cap.protocols.http.account.delete
      name: deleteAccount
      service: cap.services.account.delete
      summary: "删除账号（软删）"
      used_by:
        - feature.pages.account_list
        - feature.pages.account_detail
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
          Idempotency-Key: IdempotencyKey
        path:
          id: { schema: _types.integer }
        mapping:
          path:
            id: id
        idempotency: optional
      response:
        204:
          description: "已删除"
          headers:
            X-Request-Id: XRequestId
        404:
          codes:
            - platform.errors.ACCOUNT_NOT_FOUND
        409:
          codes:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.ACCOUNT_ILLEGAL_TRANSITION

  /admin/{id}/activate:
    post:
      id: cap.protocols.http.account.activate
      name: activateAccount
      service: cap.services.account.activate
      summary: "激活账号"
      used_by:
        - feature.pages.account_list
        - feature.pages.account_detail
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
          Idempotency-Key: IdempotencyKey
        path:
          id: { schema: _types.integer }
        mapping:
          path:
            id: id
        idempotency: optional
      response:
        200:
          description: "成功"
          headers:
            X-Request-Id: XRequestId
          body:
            content_type: application/json
            schema: data.entities.account
        404:
          codes:
            - platform.errors.ACCOUNT_NOT_FOUND
        409:
          codes:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.ACCOUNT_ILLEGAL_TRANSITION

  /admin/{id}/suspend:
    post:
      id: cap.protocols.http.account.suspend
      name: suspendAccount
      service: cap.services.account.suspend
      summary: "封禁账号"
      used_by:
        - feature.pages.account_list
        - feature.pages.account_detail
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
          Idempotency-Key: IdempotencyKey
        path:
          id: { schema: _types.integer }
        body:
          content_type: application/json
          schema:
            type: _types.object
            properties:
              reason: { type: _types.string, min_len: 1, max_len: 200 }
            required:
              - reason
        mapping:
          path:
            id: id
          body:
            reason: "reason"
        idempotency: optional
      response:
        200:
          description: "成功"
          headers:
            X-Request-Id: XRequestId
          body:
            content_type: application/json
            schema: data.entities.account
        404:
          codes:
            - platform.errors.ACCOUNT_NOT_FOUND
        409:
          codes:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
