id: cap.protocols.http.account
summary: "账号 HTTP 接口"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "响应禁止包含密码、手机号、邮箱、令牌；Account schema 不得加这些字段"
  - "枚举必须引用 data.enums.*；不要在此重复枚举值"

default_error_responses:
  - 400
  - 401
  - 403
  - 404
  - 409
  - 422
  - 429
  - 500
  - 503

paths:
  /account:
    get:
      id: cap.protocols.http.account.list
      name: listAccounts
      service: cap.services.account.list
      summary: "列出账号"
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
        query:
          status: { schema: data.enums.account_status }
          offset: { schema: _types.page_offset }
          limit: { schema: _types.page_limit }
        mapping:
          query:
            status: filter.status
            offset: filter.offset
            limit: filter.limit
        idempotency: none
      response:
        200:
          description: "成功"
          headers:
            X-Request-Id: XRequestId
          body:
            content_type: application/json
            schema: cap.services.account.schemas.AccountPage
      errors: []

    post:
      id: cap.protocols.http.account.create
      name: createAccount
      service: cap.services.account.create
      summary: "创建账号"
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
          Idempotency-Key: IdempotencyKeyRequired
        body:
          content_type: application/json
          schema: cap.services.account.schemas.CreateAccountInput
        mapping:
          body: "input"
        idempotency: required
      response:
        201:
          description: "已创建"
          headers:
            X-Request-Id: XRequestId
          body:
            content_type: application/json
            schema: data.entities.account
      errors:
        - platform.errors.ACCOUNT_NICKNAME_INVALID
        - platform.errors.ACCOUNT_NUMBER_INVALID
        - platform.errors.ACCOUNT_NUMBER_TAKEN

  /account/{id}:
    get:
      id: cap.protocols.http.account.get
      name: getAccount
      service: cap.services.account.get
      summary: "获取账号"
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
        path:
          id: { schema: _types.integer }
        mapping:
          path:
            id: id
        idempotency: none
      response:
        200:
          description: "成功"
          headers:
            X-Request-Id: XRequestId
          body:
            content_type: application/json
            schema: data.entities.account
      errors:
        - platform.errors.ACCOUNT_NOT_FOUND

    patch:
      id: cap.protocols.http.account.update
      name: updateAccount
      service: cap.services.account.update
      summary: "更新账号资料"
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
          Idempotency-Key: IdempotencyKey
        path:
          id: { schema: _types.integer }
        body:
          content_type: application/json
          schema: cap.services.account.schemas.UpdateAccountInput
        mapping:
          path:
            id: id
          body: "input"
        idempotency: optional
      response:
        200:
          description: "成功"
          headers:
            X-Request-Id: XRequestId
          body:
            content_type: application/json
            schema: data.entities.account
      errors:
        - platform.errors.ACCOUNT_ALREADY_DELETED
        - platform.errors.ACCOUNT_NICKNAME_INVALID
        - platform.errors.ACCOUNT_NOT_FOUND

    delete:
      id: cap.protocols.http.account.delete
      name: deleteAccount
      service: cap.services.account.delete
      summary: "删除账号（软删）"
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
          Idempotency-Key: IdempotencyKey
        path:
          id: { schema: _types.integer }
        mapping:
          path:
            id: id
        idempotency: optional
      response:
        204:
          description: "已删除"
          headers:
            X-Request-Id: XRequestId
      errors:
        - platform.errors.ACCOUNT_ALREADY_DELETED
        - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
        - platform.errors.ACCOUNT_NOT_FOUND
  /account/{id}/activate:

    post:
      id: cap.protocols.http.account.activate
      name: activateAccount
      service: cap.services.account.activate
      summary: "激活账号"
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
          Idempotency-Key: IdempotencyKey
        path:
          id: { schema: _types.integer }
        mapping:
          path:
            id: id
        idempotency: optional
      response:
        200:
          description: "成功"
          headers:
            X-Request-Id: XRequestId
          body:
            content_type: application/json
            schema: data.entities.account
      errors:
        - platform.errors.ACCOUNT_ALREADY_DELETED
        - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
        - platform.errors.ACCOUNT_NOT_FOUND
  /account/{id}/suspend:

    post:
      id: cap.protocols.http.account.suspend
      name: suspendAccount
      service: cap.services.account.suspend
      summary: "封禁账号"
      security:
        - BearerAuth: []
      request:
        headers:
          X-Request-Id: RequestId
          Idempotency-Key: IdempotencyKey
        path:
          id: { schema: _types.integer }
        body:
          content_type: application/json
          schema:
            type: _types.object
            properties:
              reason:
                type: _types.string
                min_len: 1
                max_len: 200
            required:
              - reason
        mapping:
          path:
            id: id
          body:
            reason: "reason"
        idempotency: optional
      response:
        200:
          description: "成功"
          headers:
            X-Request-Id: XRequestId
          body:
            content_type: application/json
            schema: data.entities.account
      errors:
        - platform.errors.ACCOUNT_ALREADY_DELETED
        - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
        - platform.errors.ACCOUNT_NOT_FOUND
