id: cap.protocols.http.account
summary: "账号 HTTP 接口"
owner_module: account
schema_version: 1
stability: stable
do_not:
  - "响应禁止包含密码、手机号、邮箱、令牌；Account schema 不得加这些字段"
  - "枚举必须引用 data.enums.*；不要在此重复枚举值"

base_path: /v1
default_error_responses: [400, 401, 403, 404, 409, 422, 429, 500, 503]

paths:
  /account:
    get:
      operationId: listAccounts
      x-contract-id: cap.protocols.http.account.list
      x-service: cap.services.account.list
      summary: "列出账号"
      x-timeout-ms: 3000
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/AccountStatus" } }
        - { name: own_type, in: query, required: false, schema: { $ref: "#/components/schemas/OwnType" } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
                x-service-return: AccountPage
              example:
                items:
                  - { id: 1, own_type: user, own_id: 2, number: "ACC-0001", nickname: "管理员", status: active, created_at: "2026-11-11T09:30:00Z" }
                offset: 0
                limit: 20
                has_more: false

    post:
      operationId: createAccount
      x-contract-id: cap.protocols.http.account.create
      x-service: cap.services.account.create
      summary: "创建账号"
      x-timeout-ms: 5000
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountInput" }
            example: { own_type: user, own_id: 2, number: "ACC-0001", nickname: "管理员" }
      responses:
        "201":
          description: "已创建"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
                x-service-return: data.entities.account

  /account/{id}:
    get:
      operationId: getAccount
      x-contract-id: cap.protocols.http.account.get
      x-service: cap.services.account.get
      summary: "获取账号"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
                x-service-return: data.entities.account

    patch:
      operationId: updateAccount
      x-contract-id: cap.protocols.http.account.update
      x-service: cap.services.account.update
      summary: "更新账号资料"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountInput" }
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
                x-service-return: data.entities.account

    delete:
      operationId: deleteAccount
      x-contract-id: cap.protocols.http.account.delete
      x-service: cap.services.account.delete
      summary: "删除账号（软删）"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: "已删除" }

  /account/{id}/activate:
    post:
      operationId: activateAccount
      x-contract-id: cap.protocols.http.account.activate
      x-service: cap.services.account.activate
      summary: "激活账号"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
                x-service-return: data.entities.account

  /account/{id}/suspend:
    post:
      operationId: suspendAccount
      x-contract-id: cap.protocols.http.account.suspend
      x-service: cap.services.account.suspend
      summary: "封禁账号"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
                x-service-return: data.entities.account

components:
  schemas:
    AccountStatus:
      x-enum: data.enums.account_status

    OwnType:
      x-enum: data.enums.own_type

    Account:
      x-entity: data.entities.account

    CreateAccountInput:
      x-service-type: cap.services.account.schemas.CreateAccountInput

    UpdateAccountInput:
      x-service-type: cap.services.account.schemas.UpdateAccountInput

    AccountPage:
      x-service-type: cap.services.account.schemas.AccountPage
