id: cap.protocols.http.shared
summary: "HTTP 共享组件"
schema_version: 1
stability: stable
do_not:
  - "shared 只放跨模块复用组件，不放 operation 或模块专属 schema"

components:
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference, example: "about:blank" }
        title: { type: string, example: "not found" }
        status: { type: integer, minimum: 100, maximum: 599, example: 404 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, example: "ACCOUNT_NOT_FOUND" }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    PageInfo:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        has_more: { type: boolean }
        next_offset: { type: integer, nullable: true }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 64 }

    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 64 }

  headers:
    RetryAfter:
      description: "建议重试等待秒数或 HTTP-date；非法值不发送，调用方记录参数错误"
      schema: { type: string, example: "30" }

  responses:
    BadRequest:
      description: "请求非法"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: "未认证"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: "无权限"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: "资源不存在"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: "状态冲突"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: "语义校验失败"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Locked:
      description: "认证锁定中，可稍后重试"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: "触发限流"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: "服务暂不可用或循环预算耗尽，可稍后重试"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Internal:
      description: "服务端错误"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
