id: cap.protocols.http.shared
summary: "HTTP 共享组件"
schema_version: 1
stability: draft
do_not:
  - "shared 只放跨模块复用组件，不放 operation 或模块专属 schema"
shared:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiErrorResponse:
      source:
        platform: true
      type: object
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "data"
      properties:
        code:
          type: integer
          minimum: 1000
          maximum: 9999
        message:
          type: string
        data:
          type: null
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 64
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 64
    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: true
      schema:
        type: string
        minLength: 1
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  headers:
    RetryAfter:
      description: "建议重试等待秒数或 HTTP-date；非法值不发送，调用方记录参数错误"
      schema:
        type: string
    XRequestId:
      description: "请求链路 ID；服务端必须回传"
      schema:
        type: string
        maxLength: 64
    SetAuthCookies:
      description: "设置 refresh_token HttpOnly cookie 与 csrf_token 可读 cookie；Path=/<app.api_version>/auth，SameSite=Lax，Secure 按环境"
      schema:
        type: string
    ClearAuthCookies:
      description: "清除 refresh_token 与 csrf_token cookie；Max-Age=0；Path=/<app.api_version>/auth"
      schema:
        type: string
  responses:
    BadRequest:
      description: "请求非法"
      headers:
        X-Request-Id: XRequestId
      content:
        application/json:
          schema: ApiErrorResponse
    Unauthorized:
      description: "未认证"
      headers:
        X-Request-Id: XRequestId
      content:
        application/json:
          schema: ApiErrorResponse
    Forbidden:
      description: "无权限"
      headers:
        X-Request-Id: XRequestId
      content:
        application/json:
          schema: ApiErrorResponse
    NotFound:
      description: "资源不存在"
      headers:
        X-Request-Id: XRequestId
      content:
        application/json:
          schema: ApiErrorResponse
    Conflict:
      description: "状态冲突"
      headers:
        X-Request-Id: XRequestId
      content:
        application/json:
          schema: ApiErrorResponse
    UnprocessableEntity:
      description: "语义校验失败"
      headers:
        X-Request-Id: XRequestId
      content:
        application/json:
          schema: ApiErrorResponse
    Locked:
      description: "认证锁定中，可稍后重试"
      headers:
        Retry-After: RetryAfter
        X-Request-Id: XRequestId
      content:
        application/json:
          schema: ApiErrorResponse
    TooManyRequests:
      description: "触发限流"
      headers:
        Retry-After: RetryAfter
        X-Request-Id: XRequestId
      content:
        application/json:
          schema: ApiErrorResponse
    ServiceUnavailable:
      description: "服务暂不可用或循环预算耗尽，可稍后重试"
      headers:
        Retry-After: RetryAfter
        X-Request-Id: XRequestId
      content:
        application/json:
          schema: ApiErrorResponse
    Internal:
      description: "服务端错误"
      headers:
        X-Request-Id: XRequestId
      content:
        application/json:
          schema: ApiErrorResponse
