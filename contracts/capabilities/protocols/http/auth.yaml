# 认证 HTTP 接口（OpenAPI 片段）。

id: cap.http.auth
summary: "认证 HTTP 接口"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "不要把 password_hash 或 token 写入日志、事件"
  - "token 只允许出现在 /auth/login 与 /auth/refresh 的响应"

base_path: /v1
default_error_responses: [400, 401, 403, 422, 423, 429, 500, 503]

paths:
  /auth/login:
    post:
      operationId: login
      x-contract-id: cap.http.auth.login
      x-service: cap.services.auth.login
      summary: "登录"
      x-timeout-ms: 5000
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
            example: { auth_type: pwd, identifier: "admin", password: "a-strong-password", device_id: "web-admin" }
      responses:
        "200":
          description: "登录成功"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }

  /auth/verification/send:
    post:
      operationId: sendVerification
      x-contract-id: cap.http.auth.verification_send
      x-service: cap.services.verification.send
      summary: "发送验证码"
      x-timeout-ms: 5000
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendVerificationInput" }
            example: { auth_type: phone, target: "+8613800138000", purpose: login }
      responses:
        "202":
          description: "已受理"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationSent" }

  /auth/verification/verify:
    post:
      operationId: verifyCode
      x-contract-id: cap.http.auth.verification_verify
      x-service: cap.services.verification.verify
      summary: "校验验证码"
      x-timeout-ms: 5000
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyCodeInput" }
            example: { auth_type: phone, target: "+8613800138000", purpose: login, code: "123456" }
      responses:
        "200":
          description: "校验成功"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationResult" }

  /auth/refresh:
    post:
      operationId: refreshToken
      x-contract-id: cap.http.auth.refresh
      x-service: cap.services.token.refresh
      summary: "刷新令牌"
      x-timeout-ms: 3000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 1 }
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }

  /auth/logout:
    post:
      operationId: logout
      x-contract-id: cap.http.auth.logout
      x-service: cap.services.token.logout
      summary: "登出"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 1 }
      responses:
        "204": { description: "已登出" }

components:
  schemas:
    LoginInput:
      x-service-type: cap.services.auth.types.LoginInput

    SendVerificationInput:
      x-service-type: cap.services.verification.types.SendVerificationInput

    VerifyCodeInput:
      x-service-type: cap.services.verification.types.VerifyCodeInput

    TokenPair:
      x-service-type: cap.services.token.types.TokenPair

    AuthSession:
      x-service-type: cap.services.auth.types.AuthSession

    VerificationPurpose:
      x-enum: data.enums.verification_purpose

    VerificationSent:
      x-service-type: cap.services.verification.types.VerificationSent

    VerificationResult:
      x-service-type: cap.services.verification.types.VerificationResult
