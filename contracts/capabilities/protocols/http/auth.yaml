id: cap.protocols.http.auth
summary: "认证 HTTP 接口"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "不要把 password_hash 或 token 写入日志、事件"
  - "JWT 只通过响应体和 Authorization header 传递"

mount:
  api_version: v1
  path: /auth
  audience: [ admin, user ]

paths:
  /login:
    post:
      id: cap.protocols.http.auth.login
      name: login
      summary: "登录"
      service: cap.services.auth.login
      request:
        headers:
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          type: cap.services.auth.schemas.LoginInput
          to: params.input
      response:
        200:
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          msg: "登录成功"
          body:
            kind: json
            type: cap.services.auth.schemas.AuthResult
        401:
          msg: "未认证"
          errors:
            - platform.errors.AUTH_INVALID_CREDENTIALS
            - platform.errors.AUTH_TOKEN_INVALID
        403:
          msg: "无权限"
          errors:
            - platform.errors.ACCOUNT_SUSPENDED
        423:
          msg: "认证锁定中，可稍后重试"
          errors:
            - platform.errors.AUTH_LOCKED
      used_by:
        - feature.pages.login

  /verification/send:
    post:
      id: cap.protocols.http.auth.verification_send
      name: sendVerification
      summary: "发送验证码"
      service: cap.services.verification.send
      request:
        headers:
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          type: cap.services.verification.schemas.SendVerificationInput
          to: params.input
      response:
        202:
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          msg: "已受理"
          body:
            kind: json
            type: cap.services.verification.schemas.VerificationSent
        422:
          msg: "语义校验失败"
          errors:
            - platform.errors.AUTH_EMAIL_INVALID
            - platform.errors.AUTH_PHONE_INVALID
            - platform.errors.AUTH_VERIFICATION_INVALID
            - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
      used_by:
        - feature.pages.login

  /verification/verify:
    post:
      id: cap.protocols.http.auth.verification_verify
      name: verifyCode
      summary: "校验验证码"
      service: cap.services.verification.verify
      request:
        headers:
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          type: cap.services.verification.schemas.VerifyCodeInput
          to: params.input
      response:
        200:
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          msg: "校验成功"
          body:
            kind: json
            type: cap.services.verification.schemas.VerificationResult
        422:
          msg: "语义校验失败"
          errors:
            - platform.errors.AUTH_VERIFICATION_EXPIRED
            - platform.errors.AUTH_VERIFICATION_INVALID
        423:
          msg: "认证锁定中，可稍后重试"
          errors:
            - platform.errors.AUTH_VERIFICATION_ATTEMPTS_EXCEEDED
      used_by:
        - feature.pages.login

  /refresh:
    post:
      id: cap.protocols.http.auth.refresh
      name: refreshToken
      summary: "刷新 JWT"
      service: cap.services.token.refresh
      request:
        headers:
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          type: cap.services.token.schemas.RefreshInput
          to: params.input
      response:
        200:
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          msg: "成功"
          body:
            kind: json
            type: cap.services.token.schemas.RefreshResult
        401:
          msg: "未认证"
          errors:
            - platform.errors.AUTH_TOKEN_EXPIRED
            - platform.errors.AUTH_TOKEN_INVALID
      used_by:
        - feature.pages.current_account

  /logout:
    post:
      id: cap.protocols.http.auth.logout
      name: logout
      summary: "吊销 refresh JWT"
      service: cap.services.token.logout
      request:
        headers:
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          type: cap.services.token.schemas.RefreshInput
          to: params.input
      response:
        204:
          msg: "已吊销"
        401:
          msg: "未认证"
          errors:
            - platform.errors.AUTH_TOKEN_INVALID
      used_by:
        - feature.pages.current_account

  /bind/password:
    post:
      id: cap.protocols.http.auth.bind_password
      name: bindPassword
      summary: "创建、修改或启停密码认证绑定"
      service: cap.services.auth.bind_password
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          type: cap.services.auth.schemas.BindPasswordInput
          to: params.input
      response:
        200:
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          msg: "成功"
          body:
            kind: json
            type: cap.services.auth.schemas.AuthBinding
        401:
          msg: "未认证"
          errors:
            - platform.errors.AUTH_INVALID_CREDENTIALS
        403:
          msg: "无权限"
          errors:
            - platform.errors.ACCOUNT_SUSPENDED
        409:
          msg: "状态冲突"
          errors:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.AUTH_USERNAME_TAKEN
        422:
          msg: "语义校验失败"
          errors:
            - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
            - platform.errors.AUTH_WEAK_PASSWORD
      used_by:
        - feature.pages.account_security

  /bind/phone:
    post:
      id: cap.protocols.http.auth.bind_phone
      name: bindPhone
      summary: "创建、换绑或启停手机号认证绑定"
      service: cap.services.auth.bind_phone
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          type: cap.services.auth.schemas.BindPhoneInput
          to: params.input
      response:
        200:
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          msg: "成功"
          body:
            kind: json
            type: cap.services.auth.schemas.AuthBinding
        403:
          msg: "无权限"
          errors:
            - platform.errors.ACCOUNT_SUSPENDED
        409:
          msg: "状态冲突"
          errors:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.AUTH_PHONE_TAKEN
        422:
          msg: "语义校验失败"
          errors:
            - platform.errors.AUTH_PHONE_INVALID
            - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
      used_by:
        - feature.pages.account_security

  /bind/email:
    post:
      id: cap.protocols.http.auth.bind_email
      name: bindEmail
      summary: "创建、换绑或启停邮箱认证绑定"
      service: cap.services.auth.bind_email
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          type: cap.services.auth.schemas.BindEmailInput
          to: params.input
      response:
        200:
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          msg: "成功"
          body:
            kind: json
            type: cap.services.auth.schemas.AuthBinding
        403:
          msg: "无权限"
          errors:
            - platform.errors.ACCOUNT_SUSPENDED
        409:
          msg: "状态冲突"
          errors:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.AUTH_EMAIL_TAKEN
        422:
          msg: "语义校验失败"
          errors:
            - platform.errors.AUTH_EMAIL_INVALID
            - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
      used_by:
        - feature.pages.account_security

  /me:
    get:
      id: cap.protocols.http.auth.me
      name: currentAccount
      summary: "校验访问令牌并返回当前账号"
      service: cap.services.token.verify
      request:
        headers:
          - { name: Authorization, auth: Bearer, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
      response:
        200:
          headers:
            - { name: Content-Type, value: application/json, description: "响应体媒体类型" }
          msg: "成功"
          body:
            kind: json
            type: data.entities.account
        401:
          msg: "未认证"
          errors:
            - platform.errors.AUTH_TOKEN_EXPIRED
            - platform.errors.AUTH_TOKEN_INVALID
      used_by:
        - feature.pages.current_account
