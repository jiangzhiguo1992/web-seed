# 认证 HTTP 接口（OpenAPI 片段）。

schema_version: 1
id: cap.http.auth
summary: "认证 HTTP 接口"
stability: draft
do_not:
  - "不要把 password_hash 或 token 写入日志、事件"
  - "auth 登录失败统一返回 AUTH_INVALID_CREDENTIALS，不要枚举账号是否存在"
  - "auth 响应中的 token 只允许出现在 /auth/login 与 /auth/refresh"
  - "auth 每个 operation 必须有 x-contract-id 与 x-flow"
  - "验证码接口不要返回 code_hash / content / target 原文；只返回 masked_target"
  - "验证码发送/校验失败不要枚举 target 是否存在"

module: account
base_path: /v1
default_error_responses: [400, 401, 403, 422, 423, 429, 500]

paths:
  /auth/login:
    post:
      operationId: login
      x-contract-id: cap.http.auth.login
      x-flow: cap.flows.auth_login
      summary: "登录"
      x-timeout-ms: 5000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [auth_type, identifier]
              properties:
                auth_type: { type: string, enum: [pwd, phone, email] }
                identifier: { type: string, minLength: 1, maxLength: 254 }
                password: { type: string, writeOnly: true, nullable: true }
                code: { type: string, nullable: true, description: "手机号区号，例如 +86" }
                device_id: { type: string, nullable: true, maxLength: 128 }
            example: { auth_type: pwd, identifier: "admin", password: "a-strong-password", device_id: "web-admin" }
      responses:
        "200":
          description: "登录成功"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }

  /auth/verification/send:
    post:
      operationId: sendVerification
      x-contract-id: cap.http.auth.verification_send
      x-flow: cap.flows.auth_send_verification
      summary: "发送验证码"
      x-timeout-ms: 5000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [auth_type, target, purpose]
              properties:
                auth_type: { type: string, enum: [phone, email] }
                account_id: { type: integer, nullable: true, description: "注册时必传" }
                target: { type: string, minLength: 1, maxLength: 320 }
                purpose: { $ref: "#/components/schemas/VerificationPurpose" }
            example: { auth_type: phone, target: "+8613800138000", purpose: login }
      responses:
        "202":
          description: "已受理"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationSent" }

  /auth/verification/verify:
    post:
      operationId: verifyCode
      x-contract-id: cap.http.auth.verification_verify
      x-flow: cap.flows.auth_verify_code
      summary: "校验验证码"
      x-timeout-ms: 5000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [auth_type, target, purpose, code]
              properties:
                auth_type: { type: string, enum: [phone, email] }
                account_id: { type: integer, nullable: true, description: "注册时必传" }
                target: { type: string, minLength: 1, maxLength: 320 }
                purpose: { $ref: "#/components/schemas/VerificationPurpose" }
                code: { type: string, minLength: 4, maxLength: 12 }
            example: { auth_type: phone, target: "+8613800138000", purpose: login, code: "123456" }
      responses:
        "200":
          description: "校验成功"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationResult" }

  /auth/refresh:
    post:
      operationId: refreshToken
      x-contract-id: cap.http.auth.refresh
      x-flow: cap.flows.auth_refresh
      summary: "刷新令牌"
      x-timeout-ms: 3000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 1 }
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }

  /auth/logout:
    post:
      operationId: logout
      x-contract-id: cap.http.auth.logout
      x-flow: cap.flows.auth_logout
      summary: "登出"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 1 }
      responses:
        "204": { description: "已登出" }

components:
  schemas:
    TokenPair:
      type: object
      additionalProperties: false
      x-entity: data.entities.token
      x-auth-response: true
      required: [access_token, refresh_token, access_expire_at, refresh_expire_at]
      properties:
        access_token: { type: string, readOnly: true }
        refresh_token: { type: string, readOnly: true }
        access_expire_at: { type: string, format: date-time }
        refresh_expire_at: { type: string, format: date-time }
        token_type: { type: string, enum: [Bearer] }

    AuthSession:
      type: object
      additionalProperties: false
      required: [account, tokens]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        tokens: { $ref: "#/components/schemas/TokenPair" }

    VerificationPurpose:
      type: string
      enum: [register, login, reset_password, bind_phone, bind_email, unbind_phone, unbind_email, change_phone, change_email, delete_account]

    VerificationSent:
      type: object
      additionalProperties: false
      required: [id, masked_target, expire_at]
      properties:
        id: { type: integer }
        masked_target: { type: string }
        expire_at: { type: string, format: date-time }

    VerificationResult:
      type: object
      additionalProperties: false
      required: [verified, verification_id]
      properties:
        verified: { type: boolean }
        verification_id: { type: integer }
        consumed_at: { type: string, format: date-time, nullable: true }
