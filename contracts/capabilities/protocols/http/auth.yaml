id: cap.protocols.http.auth
summary: "认证 HTTP 接口"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "不要把 password_hash 或 token 写入日志、事件"
  - "JWT 只通过响应体和 Authorization header 传递"

mount:
  api_version: v1
  path: /auth
  audience: [admin, user]

paths:
  /login:
    post:
      id: cap.protocols.http.auth.login
      name: login
      service: cap.services.auth.login
      summary: "登录"
      used_by:
        - feature.pages.login
      request:
        headers:
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, required: true, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          schema: cap.services.auth.schemas.LoginInput
          to: params.input
      response:
        200:
          description: "登录成功"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            schema: cap.services.auth.schemas.AuthResult
        401:
          codes:
            - platform.errors.AUTH_INVALID_CREDENTIALS
            - platform.errors.AUTH_TOKEN_INVALID
        403:
          codes:
            - platform.errors.ACCOUNT_SUSPENDED
        423:
          codes:
            - platform.errors.AUTH_LOCKED

  /verification/send:
    post:
      id: cap.protocols.http.auth.verification_send
      name: sendVerification
      service: cap.services.verification.send
      summary: "发送验证码"
      used_by:
        - feature.pages.login
      request:
        headers:
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, required: true, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          schema: cap.services.verification.schemas.SendVerificationInput
          to: params.input
      response:
        202:
          description: "已受理"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            schema: cap.services.verification.schemas.VerificationSent
        422:
          codes:
            - platform.errors.AUTH_EMAIL_INVALID
            - platform.errors.AUTH_PHONE_INVALID
            - platform.errors.AUTH_VERIFICATION_INVALID
            - platform.errors.AUTH_VERIFICATION_TARGET_INVALID

  /verification/verify:
    post:
      id: cap.protocols.http.auth.verification_verify
      name: verifyCode
      service: cap.services.verification.verify
      summary: "校验验证码"
      used_by:
        - feature.pages.login
      request:
        headers:
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, required: true, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          schema: cap.services.verification.schemas.VerifyCodeInput
          to: params.input
      response:
        200:
          description: "校验成功"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            schema: cap.services.verification.schemas.VerificationResult
        422:
          codes:
            - platform.errors.AUTH_VERIFICATION_EXPIRED
            - platform.errors.AUTH_VERIFICATION_INVALID
        423:
          codes:
            - platform.errors.AUTH_VERIFICATION_ATTEMPTS_EXCEEDED

  /refresh:
    post:
      id: cap.protocols.http.auth.refresh
      name: refreshToken
      service: cap.services.token.refresh
      summary: "刷新 JWT"
      used_by:
        - feature.pages.current_account
      request:
        headers:
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, required: true, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          schema: cap.services.token.schemas.RefreshInput
          to: params.input
      response:
        200:
          description: "成功"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            schema: cap.services.token.schemas.RefreshResult
        401:
          codes:
            - platform.errors.AUTH_TOKEN_EXPIRED
            - platform.errors.AUTH_TOKEN_INVALID

  /logout:
    post:
      id: cap.protocols.http.auth.logout
      name: logout
      service: cap.services.token.logout
      summary: "吊销 refresh JWT"
      used_by:
        - feature.pages.current_account
      request:
        headers:
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, required: true, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          schema: cap.services.token.schemas.RefreshInput
          to: params.input
      response:
        204:
          description: "已吊销"
        401:
          codes:
            - platform.errors.AUTH_TOKEN_INVALID

  /bind/password:
    post:
      id: cap.protocols.http.auth.bind_password
      name: bindPassword
      service: cap.services.auth.bind_password
      summary: "创建、修改或启停密码认证绑定"
      used_by:
        - feature.pages.account_security
      request:
        headers:
          - { name: Authorization, required: true, auth: BearerAuth, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, required: true, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          schema: cap.services.auth.schemas.BindPasswordInput
          to: params.input
      response:
        200:
          description: "成功"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            schema: cap.services.auth.schemas.AuthBinding
        401:
          codes:
            - platform.errors.AUTH_INVALID_CREDENTIALS
        403:
          codes:
            - platform.errors.ACCOUNT_SUSPENDED
        409:
          codes:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.AUTH_USERNAME_TAKEN
        422:
          codes:
            - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
            - platform.errors.AUTH_WEAK_PASSWORD

  /bind/phone:
    post:
      id: cap.protocols.http.auth.bind_phone
      name: bindPhone
      service: cap.services.auth.bind_phone
      summary: "创建、换绑或启停手机号认证绑定"
      used_by:
        - feature.pages.account_security
      request:
        headers:
          - { name: Authorization, required: true, auth: BearerAuth, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, required: true, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          schema: cap.services.auth.schemas.BindPhoneInput
          to: params.input
      response:
        200:
          description: "成功"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            schema: cap.services.auth.schemas.AuthBinding
        403:
          codes:
            - platform.errors.ACCOUNT_SUSPENDED
        409:
          codes:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.AUTH_PHONE_TAKEN
        422:
          codes:
            - platform.errors.AUTH_PHONE_INVALID
            - platform.errors.AUTH_VERIFICATION_TARGET_INVALID

  /bind/email:
    post:
      id: cap.protocols.http.auth.bind_email
      name: bindEmail
      service: cap.services.auth.bind_email
      summary: "创建、换绑或启停邮箱认证绑定"
      used_by:
        - feature.pages.account_security
      request:
        headers:
          - { name: Authorization, required: true, auth: BearerAuth, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
          - { name: Content-Type, required: true, value: application/json, description: "请求体媒体类型" }
        body:
          kind: json
          schema: cap.services.auth.schemas.BindEmailInput
          to: params.input
      response:
        200:
          description: "成功"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            schema: cap.services.auth.schemas.AuthBinding
        403:
          codes:
            - platform.errors.ACCOUNT_SUSPENDED
        409:
          codes:
            - platform.errors.ACCOUNT_ALREADY_DELETED
            - platform.errors.AUTH_EMAIL_TAKEN
        422:
          codes:
            - platform.errors.AUTH_EMAIL_INVALID
            - platform.errors.AUTH_VERIFICATION_TARGET_INVALID

  /me:
    get:
      id: cap.protocols.http.auth.me
      name: currentAccount
      service: cap.services.token.verify
      summary: "校验访问令牌并返回当前账号"
      used_by:
        - feature.pages.current_account
      request:
        headers:
          - { name: Authorization, required: true, auth: BearerAuth, description: "JWT access token" }
          - { name: Accept, required: false, value: application/json, description: "期望响应媒体类型" }
      response:
        200:
          description: "成功"
          headers:
            - { name: Content-Type, required: true, value: application/json, description: "响应体媒体类型" }
          body:
            kind: json
            schema: data.entities.account
        401:
          codes:
            - platform.errors.AUTH_TOKEN_EXPIRED
            - platform.errors.AUTH_TOKEN_INVALID
