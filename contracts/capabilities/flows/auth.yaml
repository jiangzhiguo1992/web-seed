# 认证用例集。

id: cap.flows.auth
summary: "认证用例集"
owner_module: account
schema_version: 1
stability: stable
do_not:
  - "auth 用例只编排 cap.methods.{auth,token,verification}.*；不要在 flow 里写密码学或令牌逻辑"

flows:
  - name: login
    summary: "登录"
    implementation: direct
    method: cap.methods.auth.login
    permissions: []
    audit: true
    rate_limit: { requests: 10, window_seconds: 60 }
    transaction: required
    errors:
      - platform.errors.AUTH_INVALID_CREDENTIALS
      - platform.errors.AUTH_LOCKED
      - platform.errors.ACCOUNT_SUSPENDED
      - platform.errors.COMMON_FORBIDDEN
      - platform.errors.COMMON_AUDIT_FAILED
      - platform.errors.COMMON_RATE_LIMITED

  - name: send_verification
    summary: "发送验证码"
    implementation: direct
    method: cap.methods.verification.send
    permissions: []
    audit: true
    rate_limit: { requests: 5, window_seconds: 60 }
    transaction: required
    errors:
      - platform.errors.AUTH_VERIFICATION_INVALID
      - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
      - platform.errors.AUTH_PHONE_INVALID
      - platform.errors.AUTH_EMAIL_INVALID
      - platform.errors.COMMON_AUDIT_FAILED
      - platform.errors.COMMON_RATE_LIMITED

  - name: verify_code
    summary: "校验验证码"
    implementation: direct
    method: cap.methods.verification.verify
    permissions: []
    audit: true
    rate_limit: { requests: 10, window_seconds: 60 }
    transaction: required
    errors:
      - platform.errors.AUTH_VERIFICATION_INVALID
      - platform.errors.AUTH_VERIFICATION_EXPIRED
      - platform.errors.AUTH_VERIFICATION_ATTEMPTS_EXCEEDED
      - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
      - platform.errors.COMMON_AUDIT_FAILED
      - platform.errors.COMMON_RATE_LIMITED

  - name: refresh
    summary: "刷新令牌"
    implementation: direct
    method: cap.methods.token.refresh
    permissions: []
    transaction: required
    errors:
      - platform.errors.AUTH_TOKEN_INVALID
      - platform.errors.AUTH_TOKEN_EXPIRED

  - name: logout
    summary: "登出"
    implementation: direct
    method: cap.methods.token.logout
    permissions: []
    audit: true
    transaction: required
    idempotency: { key: "auth_logout:{refresh_token_hash}", window: 24h }
    errors:
      - platform.errors.AUTH_TOKEN_INVALID
      - platform.errors.COMMON_AUDIT_FAILED
      - platform.errors.COMMON_IDEMPOTENCY_CONFLICT
