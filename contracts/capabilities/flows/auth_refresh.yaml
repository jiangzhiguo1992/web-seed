# 刷新令牌用例。直通 cap.methods.auth.refresh。
schema_version: 1
id: cap.flows.auth_refresh
summary: "刷新令牌"
stability: stable
do_not:
  - "auth_refresh 不得签发超出 platform.security.auth_policy 的令牌"
module: account
implementation: direct
method: cap.methods.auth.refresh
permissions: []
transaction: required
errors:
  - platform.errors.AUTH_TOKEN_INVALID
  - platform.errors.AUTH_TOKEN_EXPIRED
