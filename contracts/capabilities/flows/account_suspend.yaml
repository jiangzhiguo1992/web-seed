# 封禁账号用例。直通 cap.methods.account.suspend。
schema_version: 1
id: cap.flows.account_suspend
summary: "封禁账号"
stability: stable
do_not:
  - "account_suspend 必须记录 reason；不得只改 status"
module: account
implementation: direct
method: cap.methods.account.suspend
permissions:
  - platform.security.permissions.account_write
audit: true
transaction: required
errors:
  - platform.errors.ACCOUNT_NOT_FOUND
  - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
