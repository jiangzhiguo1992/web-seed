# 定期清理过期验证体与历史验证动作。

schema_version: 1
id: cap.flows.verification_cleanup
summary: "过期验证体与历史验证动作清理任务"
stability: draft
module: account
implementation: flow
do_not:
  - "只删除 expire_at 已过期的验证体，不要碰未过期记录"
  - "动作日志按时间清理，不要按 verification_id 级联删除"
  - "动作保留阈值由 input.action_older_than_days 提供；storage 不再声明 retention"
  - "不要删除未超过 action_older_than_days 的动作"
  - "cap.flows.verification_cleanup 必须有 trigger/input/output/steps/idempotency/retry/concurrency"

trigger:
  type: cron
  schedule: "0 * * * *"
  timezone: UTC

input:
  type: object
  additionalProperties: false
  properties:
    body_limit: { type: integer, minimum: 1, maximum: 1000, default: 500 }
    action_older_than_days: { type: integer, minimum: 1, default: 90 }
    action_limit: { type: integer, minimum: 1, maximum: 1000, default: 1000 }

output:
  type: object
  additionalProperties: false
  required: [deleted_bodies, deleted_actions]
  properties:
    deleted_bodies: { type: integer, minimum: 0 }
    deleted_actions: { type: integer, minimum: 0 }

steps:
  - id: delete_bodies
    use: data.queries.verification.delete_expired_verifications
  - id: delete_actions
    use: data.queries.verification.delete_verification_actions_before
uses:
  - data.queries.verification.delete_expired_verifications
  - data.queries.verification.delete_verification_actions_before
writes:
  - data.queries.verification.delete_expired_verifications
  - data.queries.verification.delete_verification_actions_before

idempotency:
  key: "verification_cleanup:{date}:{hour}"
  window: 1h
  rationale: "过期验证体与历史动作删除是幂等的；按小时分桶避免重复执行"

retry:
  max_attempts: 3
  backoff: exponential
  initial_delay: 30s
  max_delay: 10m
  dead_letter: verification_cleanup_dlq

concurrency:
  max_in_flight: 1
  lock: db_advisory_lock
  rationale: "避免多实例同时清理同一批验证记录"

observability:
  log_event: job.verification_cleanup.completed
  metrics:
    - platform.observability.metrics.job_duration_ms
    - platform.observability.metrics.job_failed_total
