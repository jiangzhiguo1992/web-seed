# 登出用例。直通 cap.methods.auth.logout。
schema_version: 1
id: cap.flows.auth_logout
summary: "登出"
stability: stable
do_not:
  - "auth_logout 必须吊销 refresh token，不得只清客户端状态"
module: account
implementation: direct
method: cap.methods.auth.logout
permissions: []
audit: true
transaction: required
idempotency: { key: "auth_logout:{refresh_token_hash}", window: 24h }
errors:
  - platform.errors.AUTH_TOKEN_INVALID
