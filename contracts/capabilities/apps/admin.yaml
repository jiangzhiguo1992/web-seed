# contract: cap.app.admin
# summary: admin API 应用的能力组合清单。只声明"包含哪些能力"，不写接口定义。
# enforcement: generated
# consumers: [tools, api]
# refs: [cap.http.shared, cap.http.notes]
# generates:
#   - contracts/generated/openapi/admin.yaml
# do_not:
#   - 不要在本文件写 paths / schemas，接口定义属于各模块契约
#   - 新增模块后必须同步 includes，否则生成器不会合并
#   - 不要把未实现的能力直接写进 includes，用 planned

schema_version: 1
id: cap.app.admin
summary: admin API 应用能力组合
stability: stable
app: admin

base:
  openapi: 3.1.0
  info:
    title: web-seed admin API
    version: 0.1.0
    description: 管理端 API；契约由 capabilities/http/* 合并生成

includes:
  - cap.http.shared
  - cap.http.notes

# 已规划但未落地的能力：生成器跳过并在报告中列出
planned:
  - cap.http.auth

generated:
  spec: generated/openapi/admin.yaml
  server: apps/api/internal/generated/openapi
  client: packages/api-client/src/generated
