# 验证码 service。

schema_version: 1
id: cap.methods.verification
summary: "验证码发送与校验接口"
stability: draft
do_not:
  - "Send / Verify 不要返回 code_hash / content / target 原文；只返回 masked_target"
  - "Send / Verify 写 verification_action 必须与业务结果同事务，失败不得留下不一致记录"
  - "验证码校验失败不要枚举 target 是否存在"
  - "换绑、解绑或停用认证绑定必须调用 RevokeByAuth"

module: account

interface:
  name: VerificationService
  package: internal/modules/account/auth/verification
  methods:
    - name: Send
      summary: "发送短信/邮件验证码，并记录发送动作"
      params:
        - { name: ctx, type: context.Context }
        - { name: input, type: SendVerificationInput }
      returns:
        - { name: verification, type: VerificationSent }
        - { name: err, type: error }
      errors:
        - platform.errors.AUTH_VERIFICATION_INVALID
        - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
        - platform.errors.AUTH_PHONE_INVALID
        - platform.errors.AUTH_EMAIL_INVALID
      transaction: none
      queries:
        - data.queries.verification.get_latest_verification
        - data.queries.verification.create_verification
        - data.queries.verification.mark_verification_sent
        - data.queries.verification.create_verification_action

    - name: Verify
      summary: "校验并消费验证码，记录每次校验动作"
      params:
        - { name: ctx, type: context.Context }
        - { name: input, type: VerifyCodeInput }
      returns:
        - { name: result, type: VerificationResult }
        - { name: err, type: error }
      errors:
        - platform.errors.AUTH_VERIFICATION_INVALID
        - platform.errors.AUTH_VERIFICATION_EXPIRED
        - platform.errors.AUTH_VERIFICATION_ATTEMPTS_EXCEEDED
        - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
      transaction: none
      queries:
        - data.queries.verification.get_latest_verification
        - data.queries.verification.consume_verification
        - data.queries.verification.increment_verification_attempt
        - data.queries.verification.create_verification_action

    - name: RevokeByAuth
      summary: "换绑/解绑/停用认证绑定时作废对应未消费验证体"
      params:
        - { name: ctx, type: context.Context }
        - { name: auth_type, type: data.enums.auth_type }
        - { name: auth_id, type: integer }
      returns:
        - { name: err, type: error }
      errors:
        - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
        - platform.errors.COMMON_INTERNAL
      transaction: none
      queries:
        - data.queries.verification.revoke_active_verifications_by_auth

    - name: RevokeByAccount
      summary: "作废账号的全部未消费验证体"
      params:
        - { name: ctx, type: context.Context }
        - { name: account_id, type: integer }
      returns:
        - { name: err, type: error }
      errors: [platform.errors.COMMON_INTERNAL]
      transaction: none
      queries:
        - data.queries.verification.revoke_active_verifications_by_account

persistence:
  tables:
    - data.tables.verification_body
    - data.tables.verification_action
  constraint_errors:
    ck_verification_auth_type: platform.errors.AUTH_VERIFICATION_TARGET_INVALID
    ck_verification_consumed_status: platform.errors.AUTH_VERIFICATION_INVALID

types:
  SendVerificationInput:
    type: object
    additionalProperties: false
    required: [auth_type, target, purpose]
    properties:
      auth_type: { type: data.enums.auth_type }
      account_id: { type: integer, nullable: true, description: "注册时必传（先建 pending account）；其他用途可省略，由服务端按 target 解析" }
      target: { type: string, minLength: 1, maxLength: 320 }
      purpose: { type: data.enums.verification_purpose }

  VerificationSent:
    type: object
    additionalProperties: false
    required: [id, masked_target, expire_at]
    properties:
      id: { type: integer }
      masked_target: { type: string }
      expire_at: { type: string, format: date-time }

  VerifyCodeInput:
    type: object
    additionalProperties: false
    required: [auth_type, target, purpose, code]
    properties:
      auth_type: { type: data.enums.auth_type }
      account_id: { type: integer, nullable: true, description: "注册时必传；其他用途可省略" }
      target: { type: string, minLength: 1, maxLength: 320 }
      purpose: { type: data.enums.verification_purpose }
      code: { type: string, minLength: 4, maxLength: 12 }

  VerificationResult:
    type: object
    additionalProperties: false
    required: [verified, verification_id]
    properties:
      verified: { type: boolean }
      verification_id: { type: integer }
      consumed_at: { type: string, format: date-time, nullable: true }

used_by:
  flows:
    - cap.flows.auth.send_verification
    - cap.flows.auth.verify_code
