# 令牌 service。

id: cap.methods.token
summary: "令牌签发与校验接口"
module: account
schema_version: 1
stability: draft
do_not:
  - "token 持久化前必须哈希；数据库只存 hash，不存原文"
  - "token.Issue 返回 TokenPair 是唯一允许暴露原文的位置"
  - "token.Verify 只校验 access token；refresh token 只在 Refresh/Logout 中使用"

interface:
  name: TokenService
  package: internal/modules/account/auth/token
  methods:
    - name: Issue
      summary: "为账号签发 access + refresh 令牌对"
      params:
        - { name: ctx, type: context.Context }
        - { name: account_id, type: integer }
        - { name: device_id, type: string, nullable: true }
      returns:
        - { name: tokens, type: TokenPair }
        - { name: err, type: error }
      errors: [platform.errors.COMMON_INTERNAL]
      transaction: none
      queries:
        - data.queries.token.create_token

    - name: Refresh
      summary: "用刷新令牌换取新令牌对"
      params:
        - { name: ctx, type: context.Context }
        - { name: refresh_token, type: string }
      returns:
        - { name: tokens, type: TokenPair }
        - { name: err, type: error }
      errors:
        - platform.errors.AUTH_TOKEN_INVALID
        - platform.errors.AUTH_TOKEN_EXPIRED
      transaction: none
      queries:
        - data.queries.token.get_token_by_refresh
        - data.queries.token.create_token
        - data.queries.token.revoke_token

    - name: Logout
      summary: "吊销刷新令牌"
      params:
        - { name: ctx, type: context.Context }
        - { name: refresh_token, type: string }
      returns:
        - { name: err, type: error }
      errors: [platform.errors.AUTH_TOKEN_INVALID]
      transaction: none
      queries:
        - data.queries.token.get_token_by_refresh
        - data.queries.token.revoke_token

    - name: RevokeByAccount
      summary: "吊销账号的全部令牌"
      params:
        - { name: ctx, type: context.Context }
        - { name: account_id, type: integer }
      returns:
        - { name: err, type: error }
      errors: [platform.errors.COMMON_INTERNAL]
      transaction: none
      queries:
        - data.queries.token.revoke_tokens_by_account

    - name: Verify
      summary: "校验访问令牌并返回账号"
      params:
        - { name: ctx, type: context.Context }
        - { name: access_token, type: string }
      returns:
        - { name: account, type: data.entities.account }
        - { name: err, type: error }
      errors:
        - platform.errors.AUTH_TOKEN_INVALID
        - platform.errors.AUTH_TOKEN_EXPIRED
      transaction: read_only
      queries:
        - data.queries.token.get_token_by_access
        - data.queries.account.get_account

    - name: PurgeExpired
      summary: "清理已过期令牌"
      params:
        - { name: ctx, type: context.Context }
      returns:
        - { name: affected_rows, type: integer }
        - { name: err, type: error }
      errors: [platform.errors.COMMON_INTERNAL]
      transaction: none
      queries:
        - data.queries.token.delete_expired_tokens

persistence:
  table: data.tables.token
  constraint_errors:
    ck_token_revoked_consistent: platform.errors.AUTH_TOKEN_INVALID
    ck_token_revoke_reason_consistent: platform.errors.AUTH_TOKEN_INVALID
    ck_token_replaced_by_self: platform.errors.COMMON_CONFLICT

types:
  TokenPair:
    type: object
    additionalProperties: false
    x-auth-response: true
    required: [access_token, refresh_token, access_expire_at, refresh_expire_at]
    properties:
      access_token: { type: string, readOnly: true }
      refresh_token: { type: string, readOnly: true }
      access_expire_at: { type: string, format: date-time }
      refresh_expire_at: { type: string, format: date-time }
      token_type: { type: string, enum: [Bearer] }

used_by:
  flows:
    - cap.flows.auth.logout
    - cap.flows.auth.refresh
