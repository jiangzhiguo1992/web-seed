# 认证会话能力：登录与账号级聚合清理。令牌在 methods/token.yaml，验证码在 methods/verification.yaml。

schema_version: 1
id: cap.methods.auth
summary: "认证会话跨模块接口"
stability: draft
do_not:
  - "auth.Login 不直接写 token 表；通过 TokenService.Issue 完成签发"
  - "auth.RevokeAllForAccount 必须编排 TokenService.RevokeByAccount 与 VerificationService.RevokeByAccount"
  - "认证失败统一返回 AUTH_INVALID_CREDENTIALS，不要枚举账号是否存在"
  - "不要返回 data.tables.*.row；返回 data.entities.account 或 AuthSession"

module: account

interface:
  name: AuthService
  package: internal/modules/account/auth
  methods:
    - name: Login
      summary: "登录：校验 password_hash，签发令牌"
      params:
        - { name: ctx, type: context.Context }
        - { name: input, type: LoginInput }
      returns:
        - { name: session, type: AuthSession }
        - { name: err, type: error }
      errors:
        - platform.errors.AUTH_INVALID_CREDENTIALS
        - platform.errors.AUTH_LOCKED
        - platform.errors.ACCOUNT_SUSPENDED
        - platform.errors.COMMON_FORBIDDEN
      transaction: none
      queries:
        - data.queries.account.get_account
        - data.queries.auth.get_auth_pwd_by_username
        - data.queries.auth.get_auth_phone_by_number
        - data.queries.auth.get_auth_email_by_username_domain
        - data.queries.auth.record_auth_pwd_login_success
        - data.queries.auth.record_auth_pwd_login_failure

    - name: BindPassword
      summary: "创建、更新或启停密码认证绑定（注册/绑定/改密）"
      params:
        - { name: ctx, type: context.Context }
        - { name: input, type: BindPasswordInput }
      returns:
        - { name: binding, type: AuthBinding }
        - { name: err, type: error }
      errors:
        - platform.errors.AUTH_USERNAME_TAKEN
        - platform.errors.AUTH_INVALID_CREDENTIALS
        - platform.errors.COMMON_FORBIDDEN
      transaction: none
      queries:
        - data.queries.auth.create_auth_pwd
        - data.queries.auth.update_auth_pwd_hash
        - data.queries.auth.set_auth_pwd_status

    - name: BindPhone
      summary: "创建或启停手机号认证绑定"
      params:
        - { name: ctx, type: context.Context }
        - { name: input, type: BindPhoneInput }
      returns:
        - { name: binding, type: AuthBinding }
        - { name: err, type: error }
      errors:
        - platform.errors.AUTH_PHONE_TAKEN
        - platform.errors.AUTH_PHONE_INVALID
        - platform.errors.COMMON_FORBIDDEN
      transaction: none
      queries:
        - data.queries.auth.create_auth_phone
        - data.queries.auth.set_auth_phone_status

    - name: BindEmail
      summary: "创建或启停邮箱认证绑定"
      params:
        - { name: ctx, type: context.Context }
        - { name: input, type: BindEmailInput }
      returns:
        - { name: binding, type: AuthBinding }
        - { name: err, type: error }
      errors:
        - platform.errors.AUTH_EMAIL_TAKEN
        - platform.errors.AUTH_EMAIL_INVALID
        - platform.errors.COMMON_FORBIDDEN
      transaction: none
      queries:
        - data.queries.auth.create_auth_email
        - data.queries.auth.set_auth_email_status

    - name: RevokeAllForAccount
      summary: "软删账号的认证绑定，并编排令牌吊销与验证体作废"
      params:
        - { name: ctx, type: context.Context }
        - { name: account_id, type: integer }
      returns:
        - { name: err, type: error }
      errors: [platform.errors.COMMON_INTERNAL]
      transaction: none
      queries:
        - data.queries.auth.soft_delete_auth_pwd_by_account
        - data.queries.auth.soft_delete_auth_phone_by_account
        - data.queries.auth.soft_delete_auth_email_by_account

# 持久化归属：auth 绑定归本方法；token / verification 由对应 method 文件声明。
persistence:
  tables:
    - data.tables.auth_pwd
    - data.tables.auth_phone
    - data.tables.auth_email
  constraint_errors:
    uq_auth_pwd_username: platform.errors.AUTH_USERNAME_TAKEN
    uq_auth_pwd_account: platform.errors.AUTH_USERNAME_TAKEN
    ck_auth_pwd_username_lowercase: platform.errors.AUTH_INVALID_CREDENTIALS
    uq_auth_phone_number: platform.errors.AUTH_PHONE_TAKEN
    uq_auth_email_username_domain: platform.errors.AUTH_EMAIL_TAKEN
    ck_auth_email_domain_lowercase: platform.errors.AUTH_EMAIL_INVALID
    ck_auth_email_username_lowercase: platform.errors.AUTH_EMAIL_INVALID

types:
  LoginInput:
    type: object
    additionalProperties: false
    required: [auth_type, identifier]
    properties:
      auth_type: { type: data.enums.auth_type }
      identifier: { type: string, minLength: 1, maxLength: 254 }
      password: { type: string, writeOnly: true, nullable: true }
      code: { type: string, nullable: true, description: "手机号区号，例如 +86" }
      device_id: { type: string, nullable: true, maxLength: 128 }

  BindPasswordInput:
    type: object
    additionalProperties: false
    required: [account_id, action]
    properties:
      account_id: { type: integer }
      action: { type: string, enum: [create, update, enable, disable] }
      username: { type: string, nullable: true, maxLength: 254 }
      password: { type: string, writeOnly: true, nullable: true }

  BindPhoneInput:
    type: object
    additionalProperties: false
    required: [account_id, action]
    properties:
      account_id: { type: integer }
      action: { type: string, enum: [create, enable, disable] }
      code: { type: string, nullable: true, description: "手机号区号，例如 +86" }
      number: { type: string, nullable: true, maxLength: 32 }

  BindEmailInput:
    type: object
    additionalProperties: false
    required: [account_id, action]
    properties:
      account_id: { type: integer }
      action: { type: string, enum: [create, enable, disable] }
      username: { type: string, nullable: true, maxLength: 254 }
      domain: { type: string, nullable: true, maxLength: 255 }

  AuthBinding:
    type: object
    additionalProperties: false
    required: [auth_type, auth_id, account_id, status]
    properties:
      auth_type: { type: data.enums.auth_type }
      auth_id: { type: integer }
      account_id: { type: integer }
      status: { type: data.enums.auth_status }
      masked_target: { type: string }

  AuthSession:
    type: object
    additionalProperties: false
    required: [account, tokens]
    properties:
      account: { type: data.entities.account }
      tokens: { type: TokenPair }

used_by:
  flows:
    - cap.flows.account.delete
    - cap.flows.auth.login
