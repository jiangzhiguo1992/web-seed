# 账号模块对外暴露的 service 能力。只登记跨模块调用，模块内部方法不进契约。

schema_version: 1
id: cap.methods.account
summary: "账号跨模块 service 接口"
stability: stable
do_not:
  - "返回 data.entities.account，不要返回表行"
  - "不要在 interface 里暴露 *pgx.Tx 或 HTTP 类型"
  - "认证相关方法在 cap.methods.auth，不要塞进本接口"
  - "Delete 只做 account 软删；认证绑定、未消费验证体与令牌由 cap.flows.account.delete 编排清理"

module: account

interface:
  name: AccountService
  package: internal/modules/account
  methods:
    - name: Get
      summary: "按 ID 获取账号"
      params:
        - { name: ctx, type: context.Context }
        - { name: id, type: integer }
      returns:
        - { name: account, type: data.entities.account }
        - { name: err, type: error }
      errors: [platform.errors.ACCOUNT_NOT_FOUND, platform.errors.COMMON_FORBIDDEN]
      transaction: read_only
      queries:
        - data.queries.account.get_account

    - name: List
      summary: "列出账号（游标分页）"
      params:
        - { name: ctx, type: context.Context }
        - { name: filter, type: ListAccountsFilter }
      returns:
        - { name: accounts, type: List<data.entities.account> }
        - { name: next_cursor, type: string, nullable: true }
        - { name: err, type: error }
      errors: [platform.errors.COMMON_FORBIDDEN]
      transaction: read_only
      queries:
        - data.queries.account.list_accounts

    - name: Create
      summary: "创建账号"
      params:
        - { name: ctx, type: context.Context }
        - { name: input, type: CreateAccountInput }
      returns:
        - { name: account, type: data.entities.account }
        - { name: err, type: error }
      errors:
        - platform.errors.ACCOUNT_NUMBER_INVALID
        - platform.errors.ACCOUNT_NUMBER_TAKEN
        - platform.errors.ACCOUNT_OWN_INVALID
        - platform.errors.COMMON_FORBIDDEN
      transaction: none
      queries:
        - data.queries.account.exists_account_number
        - data.queries.account.create_account

    - name: Update
      summary: "更新账号资料"
      params:
        - { name: ctx, type: context.Context }
        - { name: id, type: integer }
        - { name: input, type: UpdateAccountInput }
      returns:
        - { name: account, type: data.entities.account }
        - { name: err, type: error }
      errors:
        - platform.errors.ACCOUNT_NOT_FOUND
        - platform.errors.COMMON_FORBIDDEN
      transaction: none
      queries:
        - data.queries.account.get_account
        - data.queries.account.update_account

    - name: Activate
      summary: "激活或解封账号"
      params:
        - { name: ctx, type: context.Context }
        - { name: id, type: integer }
      returns:
        - { name: account, type: data.entities.account }
        - { name: err, type: error }
      errors:
        - platform.errors.ACCOUNT_NOT_FOUND
        - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
      transaction: none
      queries:
        - data.queries.account.get_account
        - data.queries.account.set_account_status

    - name: Suspend
      summary: "封禁账号"
      params:
        - { name: ctx, type: context.Context }
        - { name: id, type: integer }
        - { name: reason, type: string }
      returns:
        - { name: account, type: data.entities.account }
        - { name: err, type: error }
      errors:
        - platform.errors.ACCOUNT_NOT_FOUND
        - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
      transaction: none
      queries:
        - data.queries.account.get_account
        - data.queries.account.set_account_status

    - name: Delete
      summary: "软删账号"
      params:
        - { name: ctx, type: context.Context }
        - { name: id, type: integer }
      returns:
        - { name: err, type: error }
      errors:
        - platform.errors.ACCOUNT_NOT_FOUND
        - platform.errors.COMMON_FORBIDDEN
      transaction: none
      queries:
        - data.queries.account.get_account
        - data.queries.account.soft_delete_account

# 持久化实现：capabilities 负责把 data 实体映射到表
persistence:
  table: data.tables.account
  constraint_errors:
    uq_account_number: platform.errors.ACCOUNT_NUMBER_TAKEN
    ck_account_deleted_consistent: platform.errors.ACCOUNT_ILLEGAL_TRANSITION

types:
  ListAccountsFilter:
    type: object
    additionalProperties: false
    properties:
      status: { type: data.enums.account_status, nullable: true }
      own_type: { type: data.enums.own_type, nullable: true }
      cursor: { type: string, nullable: true }
      page_size: { type: integer, minimum: 1, maximum: 100, default: 20 }

  CreateAccountInput:
    type: object
    additionalProperties: false
    required: [own_type, own_id, number, nickname]
    properties:
      own_type: { type: data.enums.own_type }
      own_id: { type: integer }
      number: { type: string, minLength: 4, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
      nickname: { type: string, minLength: 1, maxLength: 100 }
      user_id: { type: integer, nullable: true }

  UpdateAccountInput:
    type: object
    additionalProperties: false
    required: [nickname]
    properties:
      nickname: { type: string, minLength: 1, maxLength: 100 }


used_by:
  flows:
    - cap.flows.account.activate
    - cap.flows.account.create
    - cap.flows.account.delete
    - cap.flows.account.get
    - cap.flows.account.list
    - cap.flows.account.suspend
    - cap.flows.account.update
