# HTTP 共享组件。各模块 OpenAPI 引用的公共 schema 与参数。

schema_version: 1
id: cap.http.shared
summary: "HTTP 共享组件"
stability: stable

components:
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference, example: "about:blank" }
        title: { type: string, example: "not found" }
        status: { type: integer, minimum: 100, maximum: 599, example: 404 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, example: "NOTE_NOT_FOUND" }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    PageInfo:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        has_more: { type: boolean }
        next_cursor: { type: string, nullable: true }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 64 }

    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 64 }

  responses:
    BadRequest:
      description: "请求非法"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: "未认证"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: "无权限"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: "资源不存在"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: "状态冲突"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: "触发限流"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Internal:
      description: "服务端错误"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
