# 账号 HTTP 接口。OpenAPI 片段，生成时与 shared.yaml / auth.yaml 合并。
#
# 规则：
#   - 每个 operation 必须有 x-contract-id 与 x-service。
#   - 账号响应不含任何认证字段；认证接口在 auth.yaml。
#   - 字段长度/枚举以 data 契约为准，这里手写值只用于 OpenAPI 展开。

schema_version: 1
id: cap.http.account
summary: "账号 HTTP 接口"
stability: stable
do_not:
  - "响应禁止包含密码、手机号、邮箱、令牌；Account schema 不得加这些字段"
  - "x-contract-id 必须与 index 中的 operation 一一对应"

module: account
base_path: /v1
default_error_responses: [400, 401, 403, 404, 409, 422, 429, 500]

paths:
  /account:
    get:
      operationId: listAccounts
      x-contract-id: cap.http.account.list
      x-service: cap.services.account.list
      summary: "列出账号"
      x-preconditions: [platform.security.permissions.account_read]
      x-timeout-ms: 3000
      x-rate-limit: { requests: 60, window_seconds: 60 }
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, active, suspended, deleted] } }
        - { name: own_type, in: query, required: false, schema: { type: string, enum: [user, tenant, system] } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
                  page: { $ref: "#/components/schemas/PageInfo" }
              example:
                items:
                  - { id: 1, own_type: user, own_id: 2, number: "ACC-0001", nickname: "管理员", status: active, version: 1, created_at: "2026-11-11T09:30:00Z" }
                page: { has_more: false, next_cursor: null }

    post:
      operationId: createAccount
      x-contract-id: cap.http.account.create
      x-service: cap.services.account.create
      summary: "创建账号"
      x-idempotent: true
      x-preconditions: [platform.security.permissions.account_write]
      x-timeout-ms: 5000
      x-audit: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [own_type, own_id, number, nickname]
              properties:
                own_type: { type: string, enum: [user, tenant, system] }
                own_id: { type: integer }
                number: { type: string, minLength: 4, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
                nickname: { type: string, minLength: 1, maxLength: 100 }
                user_id: { type: integer, nullable: true }
            example: { own_type: user, own_id: 2, number: "ACC-0001", nickname: "管理员" }
      responses:
        "201":
          description: "已创建"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

  /account/{id}:
    get:
      operationId: getAccount
      x-contract-id: cap.http.account.get
      x-service: cap.services.account.get
      summary: "获取账号"
      x-preconditions: [platform.security.permissions.account_read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

    patch:
      operationId: updateAccount
      x-contract-id: cap.http.account.update
      x-service: cap.services.account.update
      summary: "更新账号资料"
      x-preconditions: [platform.security.permissions.account_write]
      x-audit: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nickname, version]
              properties:
                nickname: { type: string, minLength: 1, maxLength: 100 }
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

    delete:
      operationId: deleteAccount
      x-contract-id: cap.http.account.delete
      x-service: cap.services.account.delete
      summary: "删除账号（软删）"
      x-idempotent: true
      x-preconditions: [platform.security.permissions.account_delete]
      x-audit: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: "已删除" }

  /account/{id}/activate:
    post:
      operationId: activateAccount
      x-contract-id: cap.http.account.activate
      x-service: cap.services.account.activate
      summary: "激活账号"
      x-preconditions: [platform.security.permissions.account_write]
      x-audit: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

  /account/{id}/suspend:
    post:
      operationId: suspendAccount
      x-contract-id: cap.http.account.suspend
      x-service: cap.services.account.suspend
      summary: "封禁账号"
      x-preconditions: [platform.security.permissions.account_write]
      x-audit: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

components:
  schemas:
    Account:
      type: object
      additionalProperties: false
      x-entity: data.entities.account
      required: [id, own_type, own_id, number, nickname, status, version, created_at]
      properties:
        id: { type: integer }
        own_type: { type: string, enum: [user, tenant, system] }
        own_id: { type: integer }
        number: { type: string, maxLength: 64 }
        nickname: { type: string, maxLength: 100 }
        user_id: { type: integer, nullable: true }
        status: { type: string, enum: [pending, active, suspended, deleted] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      example:
        id: 1
        own_type: user
        own_id: 2
        number: "ACC-0001"
        nickname: "管理员"
        status: active
        version: 1
        created_at: "2026-11-11T09:00:00Z"
        updated_at: "2026-11-11T09:30:00Z"
