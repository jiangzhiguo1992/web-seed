# contract: cap.http.notes
# summary: 笔记 HTTP 接口。OpenAPI 片段，生成时与 shared.yaml 合并。
# enforcement: generated+tested
# consumers: [api, web/admin]
# refs: [data.table.notes, data.query.notes, domain.rule.note.title_required, platform.errors]
# generates:
#   - apps/api/internal/generated/openapi/notes.gen.go
#   - packages/api-client/src/generated/notes.ts
#   - contracts/generated/openapi/admin.yaml（合并产物）
# note: 错误响应由 default_error_responses 统一注入，不要逐接口重复声明
# do_not:
#   - 不要在本文件重复定义 Problem / PageInfo
#   - 不要在 handler 里直接读 r.URL.Query()
#   - 不要省略 additionalProperties: false
#   - 不要绕过 domain.rule 的规则在 handler 里重复判断

schema_version: 1
id: cap.http.notes
summary: 笔记 HTTP 接口
stability: stable
module: notes
base_path: /v1
# 默认错误响应：生成器会为每个 operation 自动附加，无需逐个声明
default_error_responses: [400, 401, 403, 404, 409, 429, 500]

paths:
  /notes:
    get:
      operationId: listNotes
      x-contract-id: cap.http.notes.list
      summary: 列出笔记
      x-preconditions: [platform.permission.note_read]
      x-timeout-ms: 3000
      x-rate-limit: { requests: 60, window_seconds: 60 }
      x-side-effects: []
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, active, archived] } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Note" }
                  page: { $ref: "#/components/schemas/PageInfo" }
              example:
                items:
                  - { id: "0190f5c2-7d3a-7c3e-9b6a-2f5b1c8d9e01", title: "示例笔记", status: active, created_at: "2026-11-11T09:30:00Z" }
                page: { has_more: false, next_cursor: null }

    post:
      operationId: createNote
      x-contract-id: cap.http.notes.create
      summary: 创建笔记
      x-idempotent: true
      x-preconditions: [platform.permission.note_write, domain.rule.note.title_required]
      x-timeout-ms: 5000
      x-side-effects: [domain.event.note_created]
      x-audit: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, maxLength: 10000 }
            example: { title: "示例笔记", body: "正文" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

  /notes/{id}:
    get:
      operationId: getNote
      x-contract-id: cap.http.notes.get
      summary: 获取笔记
      x-preconditions: [platform.permission.note_read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

    patch:
      operationId: updateNote
      x-contract-id: cap.http.notes.update
      summary: 更新笔记
      x-preconditions: [platform.permission.note_write, domain.rule.note.version_required]
      x-side-effects: [domain.event.note_updated]
      x-audit: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, version]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, maxLength: 10000 }
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

    delete:
      operationId: deleteNote
      x-contract-id: cap.http.notes.delete
      summary: 删除笔记（软删）
      x-idempotent: true
      x-preconditions: [platform.permission.note_write, domain.state.note.transition]
      x-side-effects: [domain.event.note_deleted]
      x-audit: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: 已删除 }

  /notes/{id}/archive:
    post:
      operationId: archiveNote
      x-contract-id: cap.http.notes.archive
      summary: 归档笔记
      x-preconditions: [platform.permission.note_write, domain.state.note.transition]
      x-side-effects: [domain.event.note_archived]
      x-audit: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

components:
  schemas:
    Note:
      type: object
      additionalProperties: false
      required: [id, title, status, version, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        body: { type: string, nullable: true }
        status: { type: string, enum: [draft, active, archived] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      example:
        id: "0190f5c2-7d3a-7c3e-9b6a-2f5b1c8d9e01"
        title: "示例笔记"
        body: "正文"
        status: active
        version: 1
        created_at: "2026-11-11T09:30:00Z"
        updated_at: "2026-11-11T09:30:00Z"
