id: cap.services.account
summary: "账号服务：查询、创建、更新、状态转换与软删编排"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "返回 data.entities.account，不要返回表行"
  - "不要在 interface 里暴露 *sql.Tx 或 HTTP 类型"
  - "写操作前必须先完成校验；不要把校验逻辑放在写查询之后"

schemas:
  CreateAccountInput:
    type: _types.object
    properties:
      - { name: number, schema: { type: _types.account_number }, required: true, description: "账号编号" }
      - { name: nickname, schema: { type: _types.account_nickname }, required: true, description: "账号昵称" }
      - { name: user_id, schema: { type: _types.integer }, nullable: true, description: "关联用户 ID" }
  UpdateAccountInput:
    type: _types.object
    properties:
      - { name: nickname, schema: { type: _types.account_nickname }, required: true, description: "账号昵称" }
  SuspendAccountInput:
    type: _types.object
    properties:
      - { name: reason, schema: { type: _types.account_suspend_reason }, required: true, description: "封禁原因" }
  AccountPage:
    type: _types.object
    properties:
      - { name: items, schema: { type: _types.array, items: { ref: data.entities.account } }, required: true, description: "分页项列表" }
      - { name: offset, schema: { type: _types.page_offset }, required: true, description: "当前页偏移" }
      - { name: limit, schema: { type: _types.page_limit }, required: true, description: "当前页大小" }
      - { name: has_more, schema: { type: _types.boolean }, required: true, description: "是否还有下一页" }

services:
  - name: get
    summary: "按 ID 获取账号"
    visibility: public
    tx_mode: read_only
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.integer }
    returns:
      - { name: account, type: data.entities.account, value: step.get_account.account }
      - { name: err, type: error, value: "*" }
    steps:
      - id: get_account
        kind: query
        summary: "调用 data.queries.account.get_account"
        input:
          - { name: id, value: params.id, description: "待读取的账号 ID" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.get_account
        goto: load
      - id: load
        kind: logic
        summary: "校验账号可见性"
        input:
          - { name: account, value: step.get_account.account, description: "查询到的账号" }
        output: [ ]
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.COMMON_FORBIDDEN
        rules:
          - { rule: feature.rules.account.self_only }
        goto: $end
    used_by:
      - cap.protocols.http.account.get

  - name: list
    summary: "列出账号（游标分页）"
    visibility: public
    tx_mode: read_only
    params:
      - { name: ctx, type: context.Context }
      - { name: status, type: data.enums.account_status, nullable: true }
      - { name: offset, type: _types.page_offset }
      - { name: limit, type: _types.page_limit }
    returns:
      - { name: page, type: cap.services.account.schemas.AccountPage, value: step.paginate.page }
      - { name: err, type: error, value: "*" }
    steps:
      - id: list_accounts
        kind: query
        summary: "调用 data.queries.account.list_accounts"
        input:
          - { name: status, value: params.status, description: "账号状态筛选" }
          - { name: offset, value: params.offset, description: "分页偏移" }
          - { name: limit, value: params.limit, description: "分页上限" }
        output:
          - { name: accounts, type: _types.list<data.entities.account>, description: "query 返回的 accounts" }
        query: data.queries.account.list_accounts
        goto: paginate
      - id: paginate
        kind: logic
        summary: "把账号列表包装成分页结果"
        input:
          - { name: accounts, value: step.list_accounts.accounts, description: "查询到的账号列表" }
          - { name: offset, value: params.offset, description: "分页偏移" }
          - { name: limit, value: params.limit, description: "分页上限" }
        output:
          - { name: page, type: cap.services.account.schemas.AccountPage, description: "账号分页结果" }
        errors: [ ]
        rules: [ ]
        goto: $end
    used_by:
      - cap.protocols.http.account.list

  - name: create
    summary: "创建账号"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: input, type: cap.services.account.schemas.CreateAccountInput }
    returns:
      - { name: account, type: data.entities.account, value: step.create_account.account }
      - { name: err, type: error, value: "*" }
    steps:
      - id: new_id
        kind: logic
        summary: "生成新账号 ID"
        input: [ ]
        output:
          - { name: id, type: _types.integer, description: "新账号 ID" }
        errors: [ ]
        rules: [ ]
        goto: status_pending
      - id: status_pending
        kind: logic
        summary: "确定创建后的初始状态 pending"
        input: [ ]
        output:
          - { name: status, type: data.enums.account_status, description: "初始状态 pending" }
        errors: [ ]
        rules: [ ]
        goto: validate
      - id: validate
        kind: logic
        summary: "校验编号格式与昵称长度"
        input:
          - { name: number, value: params.input.number, description: "账号编号" }
          - { name: nickname, value: params.input.nickname, description: "账号昵称" }
        output: [ ]
        errors:
          - platform.errors.ACCOUNT_NUMBER_INVALID
          - platform.errors.ACCOUNT_NICKNAME_INVALID
        rules:
          - { rule: feature.rules.account.number_format }
          - { rule: feature.rules.account.nickname_length }
        goto: exists_account_number
      - id: exists_account_number
        kind: query
        summary: "调用 data.queries.account.exists_account_number"
        input:
          - { name: number, value: params.input.number, description: "待创建账号的编号" }
        output:
          - { name: exists, type: _types.boolean, description: "query 返回的 exists" }
        query: data.queries.account.exists_account_number
        goto: check_unique
      - id: check_unique
        kind: logic
        summary: "编号已占用时拒绝创建"
        input:
          - { name: exists, value: step.exists_account_number.exists, description: "编号是否已被占用" }
        output: [ ]
        errors:
          - platform.errors.ACCOUNT_NUMBER_TAKEN
        rules:
          - { rule: feature.rules.account.number_unique }
        goto: create_account
      - id: create_account
        kind: query
        summary: "调用 data.queries.account.create_account"
        lifecycles: [ cap.lifecycles.account.create ]
        input:
          - { name: id, value: step.new_id.id, description: "新账号 ID" }
          - { name: number, value: params.input.number, description: "账号编号" }
          - { name: nickname, value: params.input.nickname, description: "账号昵称" }
          - { name: user_id, value: params.input.user_id, description: "关联用户 ID" }
          - { name: status, value: step.status_pending.status, description: "初始状态 pending" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.create_account
        goto: emit_created
      - id: emit_created
        kind: events
        summary: "发出账号创建事件"
        input:
          - { name: id, value: step.create_account.account.id, description: "账号 ID" }
          - { name: number, value: step.create_account.account.number, description: "账号编号" }
          - { name: status, value: step.create_account.account.status, description: "账号创建后的状态" }
          - { name: created_at, value: step.create_account.account.created_at, description: "创建时间" }
        output: [ ]
        events:
          - ref: cap.events.account.created
        goto: $end
    used_by:
      - cap.protocols.http.account.create

  - name: update
    summary: "更新账号资料"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.integer }
      - { name: input, type: cap.services.account.schemas.UpdateAccountInput }
    returns:
      - { name: account, type: data.entities.account, value: step.update_account.account }
      - { name: err, type: error, value: "*" }
    steps:
      - id: get_account
        kind: query
        summary: "调用 data.queries.account.get_account"
        input:
          - { name: id, value: params.id, description: "账号 ID" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.get_account
        goto: validate
      - id: validate
        kind: logic
        summary: "校验可见性与软删状态后更新资料"
        input:
          - { name: account, value: step.get_account.account, description: "当前账号" }
          - { name: nickname, value: params.input.nickname, description: "新昵称" }
        output: [ ]
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.ACCOUNT_ALREADY_DELETED
          - platform.errors.ACCOUNT_NICKNAME_INVALID
          - platform.errors.COMMON_FORBIDDEN
        rules:
          - { rule: feature.rules.account.nickname_length }
          - { rule: feature.rules.account.self_only }
          - { rule: feature.rules.account.deleted_cannot_modify }
        goto: update_account
      - id: update_account
        kind: query
        summary: "调用 data.queries.account.update_account"
        input:
          - { name: id, value: params.id, description: "待更新账号 ID" }
          - { name: nickname, value: params.input.nickname, description: "新昵称" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.update_account
        goto: $end
    used_by:
      - cap.protocols.http.account.update

  - name: delete
    summary: "软删账号，并清理认证绑定、验证体与令牌"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.integer }
    returns:
      - { name: err, type: error, value: "*" }
    steps:
      - id: get_account
        kind: query
        summary: "读取待删除账号"
        input:
          - { name: id, value: params.id, description: "待删除账号 ID" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.get_account
        goto: check
      - id: check
        kind: logic
        summary: "校验软删前置条件"
        input:
          - { name: account, value: step.get_account.account, description: "待删除账号" }
        output: [ ]
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.ACCOUNT_ALREADY_DELETED
          - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
          - platform.errors.COMMON_INTERNAL
        rules:
          - { rule: feature.rules.account.deleted_cannot_modify }
          - { rule: feature.rules.account.delete_revokes_auth }
          - { rule: feature.rules.account.deleted_status_consistent }
        goto: revoke_auth
      - id: revoke_auth
        kind: service
        summary: "软删认证绑定并作废验证体"
        input:
          - { name: account_id, value: params.id, description: "被注销账号 ID" }
        output: [ ]
        errors:
          - platform.errors.COMMON_INTERNAL
        service: cap.services.auth.revoke_all_for_account
        goto: now
      - id: now
        kind: logic
        summary: "取当前时间作为软删时间"
        input: [ ]
        output:
          - { name: deleted_at, type: _types.timestamp, description: "软删时间" }
        errors: [ ]
        rules: [ ]
        goto: status_deleted
      - id: status_deleted
        kind: logic
        summary: "确定软删后的目标状态 deleted"
        input: [ ]
        output:
          - { name: status, type: data.enums.account_status, description: "目标状态 deleted" }
        errors: [ ]
        rules: [ ]
        goto: soft_delete_account
      - id: soft_delete_account
        kind: query
        summary: "调用 data.queries.account.soft_delete_account"
        lifecycles: [ cap.lifecycles.account.destroy ]
        input:
          - { name: id, value: params.id, description: "待软删账号 ID" }
          - { name: status, value: step.status_deleted.status, description: "目标状态 deleted" }
        output: [ ]
        query: data.queries.account.soft_delete_account
        goto: emit_deleted
      - id: emit_deleted
        kind: events
        summary: "发出账号删除事件"
        input:
          - { name: id, value: params.id, description: "账号 ID" }
          - { name: deleted_at, value: step.now.deleted_at, description: "软删时间" }
        output: [ ]
        events:
          - ref: cap.events.account.deleted
        goto: $end
    used_by:
      - cap.protocols.http.account.delete

  - name: activate
    summary: "激活或解封账号"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.integer }
    returns:
      - { name: account, type: data.entities.account, value: step.set_account_status.account }
      - { name: err, type: error, value: "*" }
    steps:
      - id: get_account
        kind: query
        summary: "调用 data.queries.account.get_account"
        input:
          - { name: id, value: params.id, description: "账号 ID" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.get_account
        goto: check
      - id: check
        kind: logic
        summary: "校验账号可激活状态"
        input:
          - { name: account, value: step.get_account.account, description: "当前账号" }
        output: [ ]
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.ACCOUNT_ALREADY_DELETED
          - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
        rules:
          - { rule: feature.rules.account.activate_requires_pending_or_suspended }
        goto: target_status
      - id: target_status
        kind: logic
        summary: "确定激活后的目标状态 active"
        input: [ ]
        output:
          - { name: status, type: data.enums.account_status, description: "目标状态 active" }
        errors: [ ]
        rules: [ ]
        goto: set_account_status
      - id: set_account_status
        kind: query
        summary: "调用 data.queries.account.set_account_status"
        lifecycles: [ cap.lifecycles.account.transitions.activate, cap.lifecycles.account.transitions.reactivate ]
        input:
          - { name: id, value: params.id, description: "待激活账号 ID" }
          - { name: status, value: step.target_status.status, description: "目标状态：激活" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.set_account_status
        goto: now
      - id: now
        kind: logic
        summary: "取当前时间作为激活时间"
        input: [ ]
        output:
          - { name: activated_at, type: _types.timestamp, description: "激活时间" }
        errors: [ ]
        rules: [ ]
        goto: event_branch
      - id: event_branch
        kind: when
        summary: "按原状态选择激活或解封事件"
        input:
          - { name: status, value: step.get_account.account.status, description: "操作前的账号状态" }
        output: [ ]
        when:
          - input: status
            expr: "input.status == 'suspended'"
            goto: emit_reactivated
        goto: emit_activated
      - id: emit_activated
        kind: events
        summary: "发出账号激活事件"
        input:
          - { name: id, value: params.id, description: "账号 ID" }
          - { name: activated_at, value: step.now.activated_at, description: "激活时间" }
        output: [ ]
        events:
          - ref: cap.events.account.activated
        goto: $end
      - id: emit_reactivated
        kind: events
        summary: "发出账号解封事件"
        input:
          - { name: id, value: params.id, description: "账号 ID" }
          - { name: reactivated_at, value: step.now.activated_at, description: "解封时间" }
        output: [ ]
        events:
          - ref: cap.events.account.reactivated
        goto: $end
    used_by:
      - cap.protocols.http.account.activate

  - name: suspend
    summary: "封禁账号"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: _types.integer }
      - { name: input, type: cap.services.account.schemas.SuspendAccountInput }
    returns:
      - { name: account, type: data.entities.account, value: step.set_account_status.account }
      - { name: err, type: error, value: "*" }
    steps:
      - id: get_account
        kind: query
        summary: "调用 data.queries.account.get_account"
        input:
          - { name: id, value: params.id, description: "账号 ID" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.get_account
        goto: check
      - id: check
        kind: logic
        summary: "校验账号可封禁状态"
        input:
          - { name: account, value: step.get_account.account, description: "当前账号" }
        output: [ ]
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.ACCOUNT_ALREADY_DELETED
          - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
        rules:
          - { rule: feature.rules.account.suspend_requires_active }
        goto: target_status
      - id: target_status
        kind: logic
        summary: "确定封禁后的目标状态 suspended"
        input: [ ]
        output:
          - { name: status, type: data.enums.account_status, description: "目标状态 suspended" }
        errors: [ ]
        rules: [ ]
        goto: set_account_status
      - id: set_account_status
        kind: query
        summary: "调用 data.queries.account.set_account_status"
        lifecycles: [ cap.lifecycles.account.transitions.suspend ]
        input:
          - { name: id, value: params.id, description: "待封禁账号 ID" }
          - { name: status, value: step.target_status.status, description: "目标状态：封禁" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.set_account_status
        goto: now
      - id: now
        kind: logic
        summary: "取当前时间作为封禁时间"
        input: [ ]
        output:
          - { name: suspended_at, type: _types.timestamp, description: "封禁时间" }
        errors: [ ]
        rules: [ ]
        goto: emit_suspended
      - id: emit_suspended
        kind: events
        summary: "发出账号封禁事件"
        input:
          - { name: id, value: params.id, description: "账号 ID" }
          - { name: reason, value: params.input.reason, description: "封禁原因" }
          - { name: suspended_at, value: step.now.suspended_at, description: "封禁时间" }
        output: [ ]
        events:
          - ref: cap.events.account.suspended
        goto: $end
    used_by:
      - cap.protocols.http.account.suspend
