id: cap.services.account
summary: "账号服务：查询、创建、更新、状态转换与软删编排"
owner_module: account
schema_version: 1
stability: stable
do_not:
  - "返回 data.entities.account，不要返回表行"
  - "不要在 interface 里暴露 *sql.Tx 或 HTTP 类型"

schemas:
  ListAccountsFilter:
    type: object
    properties:
      - { name: status, schema: { ref: data.enums.account_status }, nullable: true, description: "账号状态过滤" }
      - { name: offset, schema: { type: page_offset }, description: "分页偏移；默认 0" }
      - { name: limit, schema: { type: page_limit }, description: "分页大小；默认 20" }
  CreateAccountInput:
    type: object
    properties:
      - { name: number, schema: { type: account_number }, required: true, description: "账号编号" }
      - { name: nickname, schema: { type: account_nickname }, required: true, description: "账号昵称" }
      - { name: user_id, schema: { type: integer }, nullable: true, description: "关联用户 ID" }
  UpdateAccountInput:
    type: object
    properties:
      - { name: nickname, schema: { type: account_nickname }, required: true, description: "账号昵称" }
  AccountPage:
    type: object
    properties:
      - { name: items, schema: { type: array, items: { ref: data.entities.account } }, required: true, description: "分页项列表" }
      - { name: offset, schema: { type: page_offset }, required: true, description: "当前页偏移" }
      - { name: limit, schema: { type: page_limit }, required: true, description: "当前页大小" }
      - { name: has_more, schema: { type: boolean }, required: true, description: "是否还有下一页" }

services:
  - name: get
    summary: "按 ID 获取账号"
    visibility: public
    tx_mode: read_only
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: integer }
    returns:
      - { name: account, type: data.entities.account }
      - { name: err, type: error }
    steps:
      - id: get_account
        kind: query
        summary: "调用 data.queries.account.get_account"
        query:
          query: data.queries.account.get_account
          input:
            - { name: id, value: params.id, description: "待读取的账号 ID" }
      - id: load
        kind: logic
        summary: "按 ID 读取账号并校验可见性"
        output:
          - { name: account, type: data.entities.account, description: "读取到的账号" }
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.COMMON_FORBIDDEN
        rules:
          - { rule: "feature.rules.account.self_only" }

  - name: list
    summary: "列出账号（游标分页）"
    visibility: public
    tx_mode: read_only
    params:
      - { name: ctx, type: context.Context }
      - { name: filter, type: cap.services.account.schemas.ListAccountsFilter }
    returns:
      - { name: page, type: cap.services.account.schemas.AccountPage }
      - { name: err, type: error }
    steps:
      - id: list_accounts
        kind: query
        summary: "调用 data.queries.account.list_accounts"
        query:
          query: data.queries.account.list_accounts
          input:
            - { name: status, value: params.filter.status, description: "账号状态筛选" }
            - { name: offset, value: params.filter.offset, description: "分页偏移" }
            - { name: limit, value: params.filter.limit, description: "分页上限" }
      - id: paginate
        kind: logic
        summary: "把账号列表包装成分页结果"
        input:
          - { name: accounts, value: step.list_accounts.accounts, description: "查询到的账号列表" }
          - { name: offset, value: params.filter.offset, description: "分页偏移" }
          - { name: limit, value: params.filter.limit, description: "分页上限" }
        output:
          - { name: page, type: cap.services.account.schemas.AccountPage, description: "账号分页结果" }
        errors:
          - platform.errors.COMMON_FORBIDDEN
        rules: [ ]
  - name: create
    summary: "创建账号"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: input, type: cap.services.account.schemas.CreateAccountInput }
    returns:
      - { name: account, type: data.entities.account }
      - { name: err, type: error }
    steps:
      - id: new_id
        kind: logic
        summary: "生成新账号 ID"
        output:
          - { name: id, type: integer, description: "新账号 ID" }
        errors: [ ]
        rules: [ ]
      - id: status_pending
        kind: logic
        summary: "确定创建后的初始状态 pending"
        output:
          - { name: status, type: data.enums.account_status, description: "初始状态 pending" }
        errors: [ ]
        rules: [ ]
      - id: exists_account_number
        kind: query
        summary: "调用 data.queries.account.exists_account_number"
        query:
          query: data.queries.account.exists_account_number
          input:
            - { name: number, value: params.input.number, description: "待创建账号的手机号" }
      - id: create_account
        kind: query
        summary: "调用 data.queries.account.create_account"
        query:
          query: data.queries.account.create_account
          input:
            - { name: id, value: step.new_id.id, description: "新账号 ID" }
            - { name: number, value: params.input.number, description: "账号手机号" }
            - { name: nickname, value: params.input.nickname, description: "账号昵称" }
            - { name: user_id, value: params.input.user_id, description: "关联用户 ID" }
            - { name: status, value: step.status_pending.status, description: "初始状态 pending" }
      - id: create
        kind: logic
        summary: "校验编号与归属规则，查重后插入账号"
        lifecycles: [ cap.lifecycles.account.create ]
        input:
          - { name: status, value: step.status_pending.status, description: "初始状态 pending" }
        output:
          - { name: account, type: data.entities.account, description: "新建的账号" }
        errors:
          - platform.errors.ACCOUNT_NUMBER_INVALID
          - platform.errors.ACCOUNT_NUMBER_TAKEN
          - platform.errors.ACCOUNT_NICKNAME_INVALID
          - platform.errors.COMMON_FORBIDDEN
        rules:
          - { rule: "feature.rules.account.number_format" }
          - { rule: "feature.rules.account.number_unique" }
          - { rule: "feature.rules.account.nickname_length" }
      - id: emit_created
        kind: events
        summary: "发出账号创建事件"
        events: [ cap.events.account.created ]

  - name: update
    summary: "更新账号资料"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: integer }
      - { name: input, type: cap.services.account.schemas.UpdateAccountInput }
    returns:
      - { name: account, type: data.entities.account }
      - { name: err, type: error }
    steps:
      - id: get_account
        kind: query
        summary: "调用 data.queries.account.get_account"
        query:
          query: data.queries.account.get_account
          input:
            - { name: id, value: params.id, description: "账号 ID" }
      - id: update_account
        kind: query
        summary: "调用 data.queries.account.update_account"
        query:
          query: data.queries.account.update_account
          input:
            - { name: id, value: params.id, description: "待更新账号 ID" }
            - { name: nickname, value: params.input.nickname, description: "新昵称" }
      - id: update
        kind: logic
        summary: "校验可见性与软删状态后更新资料"
        output:
          - { name: account, type: data.entities.account, description: "更新后的账号" }
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.ACCOUNT_ALREADY_DELETED
          - platform.errors.ACCOUNT_NICKNAME_INVALID
          - platform.errors.COMMON_FORBIDDEN
        rules:
          - { rule: "feature.rules.account.nickname_length" }
          - { rule: "feature.rules.account.self_only" }
          - { rule: "feature.rules.account.deleted_cannot_modify" }

  - name: delete
    summary: "软删账号，并清理认证绑定、验证体与令牌"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: integer }
    returns:
      - { name: err, type: error }
    steps:
      - id: load
        kind: query
        summary: "读取待删除账号"
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.COMMON_FORBIDDEN
        query:
          query: data.queries.account.get_account
          input:
            - { name: id, value: params.id, description: "待删除账号 ID" }
      - id: revoke_auth
        kind: service
        summary: "软删认证绑定并吊销令牌、作废验证体"
        depends_on: [ load ]
        errors:
          - platform.errors.COMMON_INTERNAL
        service:
          service: cap.services.auth.revoke_all_for_account
          input:
            - { name: account_id, value: params.id, description: "被注销账号 ID" }
      - id: status_deleted
        kind: logic
        summary: "确定软删后的目标状态 deleted"
        output:
          - { name: status, type: data.enums.account_status, description: "目标状态 deleted" }
        errors: [ ]
        rules: [ ]
      - id: soft_delete_account
        kind: query
        summary: "调用 data.queries.account.soft_delete_account"
        query:
          query: data.queries.account.soft_delete_account
          input:
            - { name: id, value: params.id, description: "待软删账号 ID" }
            - { name: status, value: step.status_deleted.status, description: "目标状态 deleted" }
      - id: soft_delete
        kind: logic
        summary: "软删账号并保证 status/deleted_at 一致"
        depends_on: [ revoke_auth ]
        lifecycles: [ cap.lifecycles.account.destroy ]
        input:
          - { name: status, value: step.status_deleted.status, description: "目标状态 deleted" }
        output: [ ]
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.ACCOUNT_ALREADY_DELETED
          - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
          - platform.errors.COMMON_INTERNAL
        rules:
          - { rule: "feature.rules.account.deleted_cannot_modify" }
          - { rule: "feature.rules.account.delete_revokes_auth" }
          - { rule: "feature.rules.account.deleted_status_consistent" }
      - id: emit_deleted
        kind: events
        summary: "发出账号删除事件"
        events: [ cap.events.account.deleted ]

  - name: activate
    summary: "激活或解封账号"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: integer }
    returns:
      - { name: account, type: data.entities.account }
      - { name: err, type: error }
    steps:
      - id: target_status
        kind: logic
        summary: "按生命周期动作确定激活目标状态"
        output:
          - { name: status, type: data.enums.account_status, description: "目标状态" }
        errors: [ ]
        rules: [ ]
      - id: get_account
        kind: query
        summary: "调用 data.queries.account.get_account"
        query:
          query: data.queries.account.get_account
          input:
            - { name: id, value: params.id, description: "账号 ID" }
      - id: set_account_status
        kind: query
        summary: "调用 data.queries.account.set_account_status"
        query:
          query: data.queries.account.set_account_status
          input:
            - { name: id, value: params.id, description: "待激活账号 ID" }
            - { name: status, value: step.target_status.status, description: "目标状态：激活" }
      - id: apply
        kind: logic
        summary: "按账号生命周期执行 activate / reactivate"
        lifecycles: [ cap.lifecycles.account.activate, cap.lifecycles.account.reactivate ]
        output:
          - { name: account, type: data.entities.account, description: "激活后的账号" }
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.ACCOUNT_ALREADY_DELETED
          - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
        rules: [ ]
      - id: emit_activated
        kind: events
        summary: "发出账号激活或解封事件"
        events: [ cap.events.account.activated, cap.events.account.reactivated ]

  - name: suspend
    summary: "封禁账号"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: id, type: integer }
      - { name: reason, type: string }
    returns:
      - { name: account, type: data.entities.account }
      - { name: err, type: error }
    steps:
      - id: target_status
        kind: logic
        summary: "按生命周期动作确定封禁目标状态"
        output:
          - { name: status, type: data.enums.account_status, description: "目标状态" }
        errors: [ ]
        rules: [ ]
      - id: get_account
        kind: query
        summary: "调用 data.queries.account.get_account"
        query:
          query: data.queries.account.get_account
          input:
            - { name: id, value: params.id, description: "账号 ID" }
      - id: set_account_status
        kind: query
        summary: "调用 data.queries.account.set_account_status"
        query:
          query: data.queries.account.set_account_status
          input:
            - { name: id, value: params.id, description: "待封禁账号 ID" }
            - { name: status, value: step.target_status.status, description: "目标状态：封禁" }
      - id: apply
        kind: logic
        summary: "按账号生命周期执行 suspend"
        lifecycles: [ cap.lifecycles.account.suspend ]
        input:
          - { name: reason, value: params.reason, description: "封禁原因，供审计或事件使用" }
        output:
          - { name: account, type: data.entities.account, description: "封禁后的账号" }
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.ACCOUNT_ALREADY_DELETED
          - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
        rules: [ ]
      - id: emit_suspended
        kind: events
        summary: "发出账号封禁事件"
        events: [ cap.events.account.suspended ]
