id: cap.services.account
summary: "账号服务：查询、创建、更新、状态转换与软删编排"
owner_module: account
schema_version: 1
stability: stable
do_not:
  - "返回 data.entities.account，不要返回表行"
  - "不要在 interface 里暴露 *sql.Tx 或 HTTP 类型"

schemas:
  ListAccountsFilter:
    type: object
    properties:
      - { name: status, schema: { ref: data.enums.account_status }, nullable: true, description: "账号状态过滤" }
      - { name: own_type, schema: { ref: data.enums.own_type }, nullable: true, description: "归属类型过滤" }
      - { name: offset, schema: { type: page_offset }, description: "分页偏移；默认 0" }
      - { name: limit, schema: { type: page_limit }, description: "分页大小；默认 20" }
  CreateAccountInput:
    type: object
    properties:
      - { name: own_type, schema: { ref: data.enums.own_type }, required: true, description: "归属类型" }
      - { name: own_id, schema: { type: integer }, required: true, description: "归属对象 ID" }
      - { name: number, schema: { type: account_number }, required: true, description: "账号编号" }
      - { name: nickname, schema: { type: account_nickname }, required: true, description: "账号昵称" }
      - { name: user_id, schema: { type: integer }, nullable: true, description: "关联用户 ID" }
  UpdateAccountInput:
    type: object
    properties:
      - { name: nickname, schema: { type: account_nickname }, required: true, description: "账号昵称" }
  AccountPage:
    type: object
    properties:
      - { name: items, schema: { type: array, items: { ref: data.entities.account } }, required: true, description: "分页项列表" }
      - { name: offset, schema: { type: page_offset }, required: true, description: "当前页偏移" }
      - { name: limit, schema: { type: page_limit }, required: true, description: "当前页大小" }
      - { name: has_more, schema: { type: boolean }, required: true, description: "是否还有下一页" }

services:
  - name: get
    summary: "按 ID 获取账号"
    visibility: public
    transaction: read_only
    params:
      - {name: ctx, type: context.Context}
      - {name: id, type: integer}
    returns:
      - {name: account, type: data.entities.account}
    steps:
      - id: load
        kind: logic
        summary: "按 ID 读取账号并校验可见性"
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.COMMON_FORBIDDEN
        output:
          - {name: account, type: data.entities.account}
        queries:
          - query: data.queries.account.get_account
            input: {id: "input.id"}
        rules:
          - "feature.rules.account.self_only"

  - name: list
    summary: "列出账号（游标分页）"
    visibility: public
    transaction: read_only
    params:
      - {name: ctx, type: context.Context}
      - {name: filter, type: ListAccountsFilter}
    returns:
      - {name: page, type: AccountPage}
    steps:
      - id: query
        kind: logic
        summary: "按过滤条件游标分页查询账号"
        errors:
          - platform.errors.COMMON_FORBIDDEN
        output:
          - {name: page, type: AccountPage}
        queries:
          - query: data.queries.account.list_accounts
            input:
              status: "input.filter.status"
              own_type: "input.filter.own_type"
              offset: "input.filter.offset"
              limit: "input.filter.limit"

  - name: create
    summary: "创建账号"
    visibility: public
    transaction: required
    params:
      - {name: ctx, type: context.Context}
      - {name: input, type: CreateAccountInput}
    returns:
      - {name: account, type: data.entities.account}
    steps:
      - id: create
        kind: logic
        summary: "校验编号与归属规则，查重后插入账号"
        errors:
          - platform.errors.ACCOUNT_NUMBER_INVALID
          - platform.errors.ACCOUNT_NUMBER_TAKEN
          - platform.errors.ACCOUNT_OWN_INVALID
          - platform.errors.ACCOUNT_NICKNAME_INVALID
          - platform.errors.COMMON_FORBIDDEN
        output:
          - {name: account, type: data.entities.account}
        queries:
          - query: data.queries.account.exists_account_number
            input: {number: "input.input.number"}
          - query: data.queries.account.create_account
            input:
              id: "expr: new_id()"
              own_type: "input.input.own_type"
              own_id: "input.input.own_id"
              number: "input.input.number"
              nickname: "input.input.nickname"
              user_id: "input.input.user_id"
        events:
          - cap.events.account.created
        rules:
          - "feature.rules.account.number_format"
          - "feature.rules.account.number_unique"
          - "feature.rules.account.own_pair"
          - "feature.rules.account.nickname_length"

  - name: update
    summary: "更新账号资料"
    visibility: public
    transaction: required
    params:
      - {name: ctx, type: context.Context}
      - {name: id, type: integer}
      - {name: input, type: UpdateAccountInput}
    returns:
      - {name: account, type: data.entities.account}
    steps:
      - id: update
        kind: logic
        summary: "校验可见性与软删状态后更新资料"
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.ACCOUNT_ALREADY_DELETED
          - platform.errors.ACCOUNT_NICKNAME_INVALID
          - platform.errors.COMMON_FORBIDDEN
        output:
          - {name: account, type: data.entities.account}
        queries:
          - query: data.queries.account.get_account
            input: {id: "input.id"}
          - query: data.queries.account.update_account
            input: {id: "input.id", nickname: "input.input.nickname"}
        rules:
          - "feature.rules.account.nickname_length"
          - "feature.rules.account.self_only"
          - "feature.rules.account.deleted_cannot_modify"

  - name: delete
    summary: "软删账号，并清理认证绑定、验证体与令牌"
    visibility: public
    transaction: required
    params:
      - {name: ctx, type: context.Context}
      - {name: id, type: integer}
    returns: []
    steps:
      - id: load
        kind: query
        summary: "读取待删除账号"
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.COMMON_FORBIDDEN
        query: data.queries.account.get_account
        input: {id: "input.id"}
      - id: revoke_auth
        kind: service
        summary: "软删认证绑定并吊销令牌、作废验证体"
        depends_on: [load]
        errors:
          - platform.errors.COMMON_INTERNAL
        service: cap.services.auth.revoke_all_for_account
        input: {account_id: "input.id"}
      - id: soft_delete
        kind: transition
        summary: "软删账号并保证 status/deleted_at 一致"
        depends_on: [revoke_auth]
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.ACCOUNT_ALREADY_DELETED
          - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
          - platform.errors.COMMON_INTERNAL
        output: []
        queries:
          - query: data.queries.account.soft_delete_account
            input: {id: "input.id"}
        events:
          - cap.events.account.deleted
        rules:
          - "feature.rules.account.deleted_cannot_modify"
          - "feature.rules.account.delete_revokes_auth"
        transitions: [feature.states.account.delete]

  - name: activate
    summary: "激活或解封账号"
    visibility: public
    transaction: required
    params:
      - {name: ctx, type: context.Context}
      - {name: id, type: integer}
    returns:
      - {name: account, type: data.entities.account}
    steps:
      - id: transition
        kind: transition
        summary: "按账号状态机执行 activate / reactivate"
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.ACCOUNT_ALREADY_DELETED
          - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
        output:
          - {name: account, type: data.entities.account}
        queries:
          - query: data.queries.account.get_account
            input: {id: "input.id"}
          - query: data.queries.account.set_account_status
            input: {id: "input.id", status: "expr: transition_target()"}
        transitions: [feature.states.account.activate, feature.states.account.reactivate]

  - name: suspend
    summary: "封禁账号"
    visibility: public
    transaction: required
    params:
      - {name: ctx, type: context.Context}
      - {name: id, type: integer}
      - {name: reason, type: string}
    returns:
      - {name: account, type: data.entities.account}
    steps:
      - id: transition
        kind: transition
        summary: "按账号状态机执行 suspend"
        errors:
          - platform.errors.ACCOUNT_NOT_FOUND
          - platform.errors.ACCOUNT_ALREADY_DELETED
          - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
        input: {reason: "input.reason"}
        output:
          - {name: account, type: data.entities.account}
        queries:
          - query: data.queries.account.get_account
            input: {id: "input.id"}
          - query: data.queries.account.set_account_status
            input: {id: "input.id", status: "expr: transition_target()"}
        transitions: [feature.states.account.suspend]
