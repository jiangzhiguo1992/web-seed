# 账号模块对外暴露的 service 能力。只登记跨模块调用，模块内部方法不进契约。

schema_version: 1
id: cap.services.accounts
summary: 账号跨模块 service 接口
stability: stable
do_not:
  - 返回 data.entities.account，不要返回表行
  - 不要在 interface 里暴露 *pgx.Tx 或 HTTP 类型
  - 不要引用 business.*（规则/事件由 business 侧锚点）
  - 认证相关方法在 cap.services.auth，不要塞进本接口
  - 数据库约束到业务错误的映射写在 constraint_errors

module: accounts

interface:
  name: AccountsService
  package: internal/modules/accounts
  methods:
    - name: Get
      summary: 按 ID 获取账号
      params:
        - { name: ctx, type: context.Context }
        - { name: id, type: uuid }
      returns:
        - { name: account, type: data.entities.account }
        - { name: err, type: error }
      errors: [platform.errors.ACCOUNT_NOT_FOUND, platform.errors.COMMON_FORBIDDEN]
      transaction: read_only

    - name: List
      summary: 列出账号（游标分页）
      params:
        - { name: ctx, type: context.Context }
        - { name: filter, type: ListAccountsFilter }
      returns:
        - { name: accounts, type: "[]data.entities.account" }
        - { name: next_cursor, type: string, nullable: true }
        - { name: err, type: error }
      errors: [platform.errors.COMMON_FORBIDDEN]
      transaction: read_only

    - name: Create
      summary: 创建账号
      params:
        - { name: ctx, type: context.Context }
        - { name: input, type: CreateAccountInput }
      returns:
        - { name: account, type: data.entities.account }
        - { name: err, type: error }
      errors:
        - platform.errors.ACCOUNT_NUMBER_INVALID
        - platform.errors.ACCOUNT_NUMBER_TAKEN
        - platform.errors.ACCOUNT_OWN_INVALID
        - platform.errors.COMMON_FORBIDDEN
      transaction: required

    - name: Update
      summary: 更新账号资料
      params:
        - { name: ctx, type: context.Context }
        - { name: id, type: uuid }
        - { name: input, type: UpdateAccountInput }
      returns:
        - { name: account, type: data.entities.account }
        - { name: err, type: error }
      errors:
        - platform.errors.ACCOUNT_NOT_FOUND
        - platform.errors.ACCOUNT_VERSION_CONFLICT
        - platform.errors.COMMON_FORBIDDEN
      transaction: required

    - name: Activate
      summary: 激活或解封账号
      params:
        - { name: ctx, type: context.Context }
        - { name: id, type: uuid }
        - { name: version, type: integer }
      returns:
        - { name: account, type: data.entities.account }
        - { name: err, type: error }
      errors:
        - platform.errors.ACCOUNT_NOT_FOUND
        - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
        - platform.errors.ACCOUNT_VERSION_CONFLICT
      transaction: required

    - name: Suspend
      summary: 封禁账号
      params:
        - { name: ctx, type: context.Context }
        - { name: id, type: uuid }
        - { name: reason, type: string }
        - { name: version, type: integer }
      returns:
        - { name: account, type: data.entities.account }
        - { name: err, type: error }
      errors:
        - platform.errors.ACCOUNT_NOT_FOUND
        - platform.errors.ACCOUNT_ILLEGAL_TRANSITION
        - platform.errors.ACCOUNT_VERSION_CONFLICT
      transaction: required

    - name: Delete
      summary: 软删账号
      params:
        - { name: ctx, type: context.Context }
        - { name: id, type: uuid }
        - { name: version, type: integer }
      returns:
        - { name: err, type: error }
      errors:
        - platform.errors.ACCOUNT_NOT_FOUND
        - platform.errors.ACCOUNT_VERSION_CONFLICT
        - platform.errors.COMMON_FORBIDDEN
      transaction: required

# 持久化实现：capabilities 负责把 data 实体映射到表
persistence:
  table: data.tables.account
  field_map: {}                    # 实体字段名与列名一致，无差异
  queries:
    get: data.queries.account.get_account
    get_by_number: data.queries.account.get_account_by_number
    exists_number: data.queries.account.exists_account_number
    list: data.queries.account.list_accounts
    create: data.queries.account.create_account
    update: data.queries.account.update_account
    set_status: data.queries.account.set_account_status
    soft_delete: data.queries.account.soft_delete_account
    list_stale_pending: data.queries.account.list_stale_pending_accounts
    soft_delete_stale_pending: data.queries.account.soft_delete_stale_pending_accounts
  constraint_errors:
    uq_accounts_number: platform.errors.ACCOUNT_NUMBER_TAKEN
    ck_accounts_status: platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    ck_accounts_deleted_consistent: platform.errors.ACCOUNT_ILLEGAL_TRANSITION

types:
  ListAccountsFilter:
    type: object
    additionalProperties: false
    properties:
      status: { type: data.enums.account_status, nullable: true }
      own_type: { type: string, nullable: true, maxLength: 32 }
      cursor: { type: string, nullable: true }
      page_size: { type: integer, minimum: 1, maximum: 100, default: 20 }

  CreateAccountInput:
    type: object
    additionalProperties: false
    required: [own_type, own_id, number, nickname]
    properties:
      own_type: { type: string, minLength: 1, maxLength: 32 }
      own_id: { type: string, format: uuid }
      number: { type: string, minLength: 4, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
      nickname: { type: string, minLength: 1, maxLength: 100 }
      user_id: { type: string, format: uuid, nullable: true }

  UpdateAccountInput:
    type: object
    additionalProperties: false
    required: [nickname, version]
    properties:
      nickname: { type: string, minLength: 1, maxLength: 100 }
      version: { type: integer, minimum: 1 }

consumers:
  - module: audit
    uses: [Get]
  - module: auth
    uses: [Get]
  - module: notification
    uses: [Get]
