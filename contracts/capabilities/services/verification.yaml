# 验证码服务。

id: cap.services.verification
summary: "验证码服务：发送、校验与作废"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "send / verify 不要返回 code_hash / content / target 原文；只返回 masked_target"
  - "verify 的成功/不匹配在同一事务写 verification_action；失败尝试由 record_failure 独立事务写入"
  - "换绑、解绑或停用认证绑定必须调用 revoke_by_auth"
  - "send / verify 必须先读取 account 并校验 status ∈ (pending, active)"
  - "send 使用 tx_mode=none：create/mark_sent/mark_failed 各自提交；发送失败必须保留 failed，不能因整体回滚丢失"
  - "send 的 create 与 mark_sent 非原子；mark_sent 失败会留下 pending，由 verification cleanup 按 expire_at 清理"
  - "record_failure 是独立事务；审计写入失败不得覆盖 verify 的原始错误码，由监控告警"
  - "send 步骤不要直接返回错误；发送失败必须输出 delivered=false，由 mark_failed 落 failed"

schemas:
  SendVerificationInput:
    kind: _types.schemas.object
    properties:
      - { name: auth_type, schema: { type: data.enums.auth_type }, required: true, description: "认证类型" }
      - { name: account_id, schema: { type: _types.basics.id }, nullable: true, description: "注册时必传（先建 pending account）；其他用途可省略，由服务端按 target 解析" }
      - { name: target, schema: { type: _types.basics.verification_target }, required: true, description: "验证码接收目标" }
      - { name: purpose, schema: { type: data.enums.verification_purpose }, required: true, description: "验证码用途" }
    validation:
      - { rule: "input.purpose != \"register\" || input.account_id != null", message: "注册验证必须携带 pending account ID" }
  VerificationSent:
    kind: _types.schemas.object
    properties:
      - { name: id, schema: { type: _types.basics.id }, required: true, description: "验证记录 ID" }
      - { name: masked_target, schema: { type: _types.basics.string }, required: true, description: "脱敏后的接收目标" }
      - { name: expire_at, schema: { type: _types.basics.timestamp.long }, required: true, description: "过期时间" }
  VerifyCodeInput:
    kind: _types.schemas.object
    properties:
      - { name: auth_type, schema: { type: data.enums.auth_type }, required: true, description: "认证类型" }
      - { name: account_id, schema: { type: _types.basics.id }, nullable: true, description: "注册时必传；其他用途可省略" }
      - { name: target, schema: { type: _types.basics.verification_target }, required: true, description: "验证码接收目标" }
      - { name: purpose, schema: { type: data.enums.verification_purpose }, required: true, description: "验证码用途" }
      - { name: code, schema: { type: _types.basics.verification_code }, required: true, description: "验证码" }
    validation:
      - { rule: "input.purpose != \"register\" || input.account_id != null", message: "注册验证必须携带 pending account ID" }
  VerificationResult:
    kind: _types.schemas.object
    properties:
      - { name: verified, schema: { type: _types.basics.boolean }, required: true, description: "是否验证通过" }
      - { name: verification_id, schema: { type: _types.basics.id }, required: true, description: "验证记录 ID" }
      - { name: consumed_at, schema: { type: _types.basics.timestamp.long }, nullable: true, description: "验证码消费时间；未消费为 null" }

services:
  - name: send
    summary: "发送短信/邮件验证码"
    visibility: public
    tx_mode: none
    params:
      - { name: ctx, type: context.Context }
      - { name: input, type: cap.services.verification.schemas.SendVerificationInput }
    returns:
      - { name: verification, type: cap.services.verification.schemas.VerificationSent, value: step.send.verification }
      - { name: err, type: error, value: "*" }
    steps:
      - id: resolve_auth_id
        kind: logic
        summary: "归一化 target，解析认证绑定与账号，并校验发送前置条件"
        input:
          - { name: auth_type, value: params.input.auth_type, description: "认证类型" }
          - { name: account_id, value: params.input.account_id, description: "验证目标账号 ID" }
          - { name: target, value: params.input.target, description: "验证码接收目标" }
          - { name: purpose, value: params.input.purpose, description: "验证码用途" }
        output:
          - { name: auth_id, type: _types.basics.id, description: "验证目标认证绑定 ID" }
          - { name: account_id, type: _types.basics.id, description: "解析后的验证目标账号 ID" }
        errors:
          - platform.errors.AUTH_VERIFICATION_INVALID
          - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
          - platform.errors.AUTH_PHONE_INVALID
          - platform.errors.AUTH_EMAIL_INVALID
          - platform.errors.COMMON_INTERNAL
        rules:
          - { rule: feature.rules.auth.verification_target_normalization }
          - { rule: feature.rules.auth.verification_no_enumeration }
          - { rule: feature.rules.auth.verification_register_account }
          - { rule: feature.rules.auth.verification_auth_binding }
          - { rule: feature.rules.auth.verification_purpose_status }
          - { rule: feature.rules.auth.verification_resend }
        goto: load_account
      - id: load_account
        kind: query
        summary: "读取验证目标账号"
        input:
          - { name: id, value: step.resolve_auth_id.account_id, description: "验证目标账号 ID" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.get_account
        goto: check_account
      - id: check_account
        kind: logic
        summary: "校验账号未删除且未封禁"
        input:
          - { name: account, value: step.load_account.account, description: "验证目标账号" }
        output: [ ]
        errors:
          - platform.errors.AUTH_VERIFICATION_INVALID
        rules:
          - { rule: feature.rules.auth.verification_account_active }
        goto: gen_code
      - id: gen_code
        kind: logic
        summary: "生成验证码原文"
        input: [ ]
        output:
          - { name: code, type: _types.basics.string, description: "验证码原文；仅在本服务的步骤间传递" }
        errors: [ ]
        rules: [ ]
        goto: hash_code
      - id: hash_code
        kind: logic
        summary: "计算验证码哈希"
        input:
          - { name: code, value: step.gen_code.code, description: "验证码原文" }
        output:
          - { name: code_hash, type: _types.basics.string, description: "验证码哈希" }
        errors: [ ]
        rules: [ ]
        goto: render_content
      - id: render_content
        kind: logic
        summary: "按用途渲染下发内容"
        input:
          - { name: code, value: step.gen_code.code, description: "验证码原文" }
          - { name: auth_type, value: params.input.auth_type, description: "认证类型，决定短信或邮件模板" }
          - { name: target, value: params.input.target, description: "验证码接收目标" }
          - { name: purpose, value: params.input.purpose, description: "验证码用途" }
        output:
          - { name: content, type: _types.basics.string, description: "下发给用户的验证内容" }
        errors: [ ]
        rules: [ ]
        goto: new_id
      - id: new_id
        kind: logic
        summary: "生成新验证体 ID"
        input: [ ]
        output:
          - { name: id, type: _types.basics.id, description: "新验证体 ID" }
        errors: [ ]
        rules: [ ]
        goto: expire_at
      - id: expire_at
        kind: logic
        summary: "计算验证码过期时间"
        input: [ ]
        output:
          - { name: expire_at, type: _types.basics.timestamp.long, description: "验证码过期时间" }
        errors: [ ]
        rules: [ ]
        goto: now
      - id: now
        kind: logic
        summary: "取当前时间作为发送时间"
        input: [ ]
        output:
          - { name: sent_at, type: _types.basics.timestamp.long, description: "发送时间" }
        errors: [ ]
        rules: [ ]
        goto: status_sent
      - id: status_sent
        kind: logic
        summary: "构造验证体目标状态：已发送"
        input: [ ]
        output:
          - { name: status, type: data.enums.verification_status, description: "目标状态：已发送" }
        errors: [ ]
        rules: [ ]
        goto: status_revoked
      - id: status_revoked
        kind: logic
        summary: "构造验证体目标状态：已作废"
        input: [ ]
        output:
          - { name: status, type: data.enums.verification_status, description: "目标状态：已作废" }
        errors: [ ]
        rules: [ ]
        goto: revoke_old
      - id: revoke_old
        kind: query
        summary: "重发前作废同一认证目标与用途的旧验证体"
        lifecycles: [ cap.lifecycles.verification.transitions.revoke ]
        state_gate:
          - { lifecycle: cap.lifecycles.verification, values: [ pending, sent ] }
        input:
          - { name: auth_type, value: params.input.auth_type, description: "认证类型" }
          - { name: auth_id, value: step.resolve_auth_id.auth_id, description: "认证绑定 ID" }
          - { name: purpose, value: params.input.purpose, description: "验证用途" }
          - { name: status, value: step.status_revoked.status, description: "目标状态：已作废" }
        output: [ ]
        query: data.queries.verification.revoke_active_verifications_by_auth
        goto: create
      - id: create
        kind: query
        summary: "创建验证体"
        lifecycles: [ cap.lifecycles.verification.create ]
        input:
          - { name: id, value: step.new_id.id, description: "新验证体 ID" }
          - { name: account_id, value: step.resolve_auth_id.account_id, description: "验证目标账号 ID" }
          - { name: auth_type, value: params.input.auth_type, description: "验证目标认证类型" }
          - { name: purpose, value: params.input.purpose, description: "验证用途" }
          - { name: auth_id, value: step.resolve_auth_id.auth_id, description: "验证目标认证绑定 ID" }
          - { name: code_hash, value: step.hash_code.code_hash, description: "验证码哈希" }
          - { name: content, value: step.render_content.content, description: "下发给用户的验证内容" }
          - { name: expire_at, value: step.expire_at.expire_at, description: "验证码过期时间" }
        output:
          - { name: row, type: data.entities.verification_body, description: "query 返回的 row" }
        query: data.queries.verification.create_verification
        goto: mark_sent
      - id: mark_sent
        kind: query
        summary: "标记验证体已发送"
        lifecycles: [ cap.lifecycles.verification.transitions.send ]
        state_gate:
          - { lifecycle: cap.lifecycles.verification, values: [ pending ] }
        input:
          - { name: id, value: step.create.row.id, description: "待标记的验证体 ID" }
          - { name: sent_at, value: step.now.sent_at, description: "发送时间" }
          - { name: status, value: step.status_sent.status, description: "目标状态：已发送" }
        output:
          - { name: affected_rows, type: _types.basics.integer.32, description: "query 返回的 affected_rows" }
        query: data.queries.verification.mark_verification_sent
        goto: mark_sent_result
      - id: mark_sent_result
        kind: when
        summary: "标记成功才继续发送"
        input:
          - { name: affected_rows, value: step.mark_sent.affected_rows, description: "标记影响行数" }
        output: [ ]
        when:
          - input: affected_rows
            expr: "input.affected_rows == 1"
            goto: send
        goto: deny_stale
      - id: deny_stale
        kind: logic
        summary: "验证体不在待发送状态，返回统一验证错误"
        input: [ ]
        output: [ ]
        errors:
          - platform.errors.AUTH_VERIFICATION_INVALID
        rules: [ ]
        goto: $end
      - id: send
        kind: logic
        summary: "下发验证码并返回发送是否成功"
        input:
          - { name: id, value: step.create.row.id, description: "验证记录 ID" }
          - { name: target, value: params.input.target, description: "验证码接收目标，用于脱敏" }
          - { name: expire_at, value: step.expire_at.expire_at, description: "验证码过期时间" }
        output:
          - { name: verification, type: cap.services.verification.schemas.VerificationSent, description: "发送后的验证体" }
          - { name: delivered, type: _types.basics.boolean, description: "发送是否成功" }
        errors: [ ]
        rules: [ ]
        goto: send_result
      - id: send_result
        kind: when
        summary: "发送失败时落 failed 终态"
        input:
          - { name: delivered, value: step.send.delivered, description: "发送是否成功" }
        output: [ ]
        when:
          - input: delivered
            expr: "input.delivered == false"
            goto: status_failed
        goto: $end
      - id: status_failed
        kind: logic
        summary: "构造验证体目标状态：发送失败"
        input: [ ]
        output:
          - { name: status, type: data.enums.verification_status, description: "目标状态：发送失败" }
        errors: [ ]
        rules: [ ]
        goto: mark_failed
      - id: mark_failed
        kind: query
        summary: "发送失败时把验证体置为 failed"
        lifecycles: [ cap.lifecycles.verification.transitions.fail ]
        state_gate:
          - { lifecycle: cap.lifecycles.verification, values: [ sent ] }
        input:
          - { name: id, value: step.create.row.id, description: "待标记的验证体 ID" }
          - { name: status, value: step.status_failed.status, description: "目标状态：发送失败" }
        output: [ ]
        query: data.queries.verification.set_verification_status
        goto: deny_send_failed
      - id: deny_send_failed
        kind: logic
        summary: "发送失败，返回内部错误"
        input: [ ]
        output: [ ]
        errors:
          - platform.errors.COMMON_INTERNAL
        rules: [ ]
        goto: $end
    used_by:
      - cap.protocols.http.auth.verification_send

  - name: verify
    summary: "校验并消费验证码，记录每次校验动作"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: input, type: cap.services.verification.schemas.VerifyCodeInput }
    returns:
      - { name: result, type: cap.services.verification.schemas.VerificationResult, value: step.record_done.result }
      - { name: err, type: error, value: "*" }
    steps:
      - id: resolve_auth_id
        kind: logic
        summary: "按 auth_type 与 target 解析认证绑定与账号"
        input:
          - { name: auth_type, value: params.input.auth_type, description: "认证类型" }
          - { name: account_id, value: params.input.account_id, description: "验证目标账号 ID" }
          - { name: target, value: params.input.target, description: "验证码接收目标" }
        output:
          - { name: auth_id, type: _types.basics.id, description: "验证目标认证绑定 ID" }
          - { name: account_id, type: _types.basics.id, description: "解析后的验证目标账号 ID" }
        errors: [ ]
        rules: [ ]
        goto: load_account
      - id: load_account
        kind: query
        summary: "读取验证目标账号"
        input:
          - { name: id, value: step.resolve_auth_id.account_id, description: "验证目标账号 ID" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.get_account
        goto: check_account
      - id: check_account
        kind: logic
        summary: "校验账号未删除且未封禁"
        input:
          - { name: account, value: step.load_account.account, description: "验证目标账号" }
        output: [ ]
        errors:
          - platform.errors.AUTH_VERIFICATION_INVALID
        rules:
          - { rule: feature.rules.auth.verification_account_active }
        goto: load_verification
      - id: load_verification
        kind: query
        summary: "读取最新验证体"
        input:
          - { name: account_id, value: step.resolve_auth_id.account_id, description: "验证目标账号 ID" }
          - { name: auth_type, value: params.input.auth_type, description: "验证目标认证类型" }
          - { name: auth_id, value: step.resolve_auth_id.auth_id, description: "验证目标认证绑定 ID" }
          - { name: purpose, value: params.input.purpose, description: "验证用途" }
        output:
          - { name: row, type: data.entities.verification_body, description: "query 返回的 row" }
        query: data.queries.verification.get_latest_verification
        goto: now
      - id: now
        kind: logic
        summary: "取当前时间作为消费时间"
        input: [ ]
        output:
          - { name: consumed_at, type: _types.basics.timestamp.long, description: "消费时间" }
        errors: [ ]
        rules: [ ]
        goto: status_consumed
      - id: status_consumed
        kind: logic
        summary: "构造验证体目标状态：已消费"
        input: [ ]
        output:
          - { name: status, type: data.enums.verification_status, description: "目标状态：已消费" }
        errors: [ ]
        rules: [ ]
        goto: status_sent
      - id: status_sent
        kind: logic
        summary: "构造验证体目标状态：已发送"
        input: [ ]
        output:
          - { name: status, type: data.enums.verification_status, description: "目标状态：已发送" }
        errors: [ ]
        rules: [ ]
        goto: next_attempt
      - id: next_attempt
        kind: logic
        summary: "计算递增后的尝试次数"
        input:
          - { name: attempt_count, value: step.load_verification.row.attempt_count, description: "当前尝试次数" }
        output:
          - { name: attempt_count, type: _types.basics.integer.32, description: "递增后的尝试次数" }
        errors: [ ]
        rules: [ ]
        goto: request_ip
      - id: request_ip
        kind: logic
        summary: "读取请求 IP"
        input: [ ]
        output:
          - { name: request_ip, type: _types.basics.string, description: "请求 IP" }
        errors: [ ]
        rules: [ ]
        goto: device_id
      - id: device_id
        kind: logic
        summary: "读取请求设备标识"
        input: [ ]
        output:
          - { name: device_id, type: _types.basics.string, description: "请求设备标识" }
        errors: [ ]
        rules: [ ]
        goto: location
      - id: location
        kind: logic
        summary: "读取请求位置"
        input: [ ]
        output:
          - { name: location, type: _types.basics.string, description: "请求位置" }
        errors: [ ]
        rules: [ ]
        goto: input_hash
      - id: input_hash
        kind: logic
        summary: "计算用户输入验证码的哈希"
        input:
          - { name: code, value: params.input.code, description: "用户输入的验证码" }
        output:
          - { name: input_hash, type: _types.basics.string, description: "用户输入的哈希" }
        errors: [ ]
        rules: [ ]
        goto: check
      - id: check
        kind: logic
        summary: "校验验证码、有效期与尝试次数，输出 success/mismatch/expired/attempts_exceeded/invalid"
        input:
          - { name: code, value: params.input.code, description: "用户输入的验证码" }
          - { name: verification, value: step.load_verification.row, description: "待校验的验证体行" }
        output:
          - { name: outcome, type: data.enums.verification_result, description: "本次校验结果" }
        errors:
          - platform.errors.AUTH_VERIFICATION_INVALID
          - platform.errors.AUTH_VERIFICATION_EXPIRED
          - platform.errors.AUTH_VERIFICATION_ATTEMPTS_EXCEEDED
        rules:
          - { rule: feature.rules.auth.verification_one_time }
          - { rule: feature.rules.auth.verification_expiry }
          - { rule: feature.rules.auth.verification_attempts }
          - { rule: feature.rules.auth.verification_auth_binding }
          - { rule: feature.rules.auth.verification_purpose_status }
          - { rule: feature.rules.auth.verification_no_enumeration }
          - { rule: feature.rules.auth.verification_register_account }
        goto: record_branch
      - id: record_branch
        kind: when
        summary: "按验证结果选择审计路径"
        input:
          - { name: outcome, value: step.check.outcome, description: "本次校验结果" }
        output: [ ]
        when:
          - input: outcome
            expr: "input.outcome == 'success'"
            goto: log_action
          - input: outcome
            expr: "input.outcome == 'mismatch'"
            goto: log_action
          - input: outcome
            expr: "input.outcome == 'expired'"
            goto: record_failure
          - input: outcome
            expr: "input.outcome == 'attempts_exceeded'"
            goto: record_failure
          - input: outcome
            expr: "input.outcome == 'invalid'"
            goto: record_failure
        goto: record_failure
      - id: log_action
        kind: query
        summary: "追加验证动作日志"
        input:
          - { name: verification_id, value: step.load_verification.row.id, description: "本次校验的验证体 ID" }
          - { name: account_id, value: step.resolve_auth_id.account_id, description: "校验动作所属账号 ID" }
          - { name: result, value: step.check.outcome, description: "本次校验结果" }
          - { name: request_ip, value: step.request_ip.request_ip, description: "请求 IP" }
          - { name: device_id, value: step.device_id.device_id, description: "请求设备标识" }
          - { name: location, value: step.location.location, description: "请求位置" }
          - { name: input_hash, value: step.input_hash.input_hash, description: "用户输入的哈希" }
        output: [ ]
        query: data.queries.verification.create_verification_action
        goto: record_after_log
      - id: record_after_log
        kind: when
        summary: "按结果选择消费或递增"
        input:
          - { name: outcome, value: step.check.outcome, description: "本次校验结果" }
        output: [ ]
        when:
          - input: outcome
            expr: "input.outcome == 'success'"
            goto: consume
          - input: outcome
            expr: "input.outcome == 'mismatch'"
            goto: increment
        goto: deny_invalid
      - id: record_failure
        kind: service
        summary: "独立事务记录失败校验动作"
        input:
          - { name: verification_id, value: step.load_verification.row.id, description: "本次校验的验证体 ID" }
          - { name: account_id, value: step.resolve_auth_id.account_id, description: "校验动作所属账号 ID" }
          - { name: result, value: step.check.outcome, description: "本次校验结果" }
          - { name: request_ip, value: step.request_ip.request_ip, description: "请求 IP" }
          - { name: device_id, value: step.device_id.device_id, description: "请求设备标识" }
          - { name: location, value: step.location.location, description: "请求位置" }
          - { name: input_hash, value: step.input_hash.input_hash, description: "用户输入的哈希" }
        output: [ ]
        errors: [ ]
        service: cap.services.verification.record_failure
        goto: deny_branch
      - id: deny_branch
        kind: when
        summary: "按失败结果选择错误"
        input:
          - { name: outcome, value: step.check.outcome, description: "本次校验结果" }
        output: [ ]
        when:
          - input: outcome
            expr: "input.outcome == 'expired'"
            goto: deny_expired
          - input: outcome
            expr: "input.outcome == 'attempts_exceeded'"
            goto: deny_attempts
        goto: deny_invalid
      - id: consume
        kind: query
        summary: "验证成功时一次性消费验证码"
        lifecycles: [ cap.lifecycles.verification.transitions.consume ]
        state_gate:
          - { lifecycle: cap.lifecycles.verification, values: [ sent ] }
        input:
          - { name: id, value: step.load_verification.row.id, description: "待消费的验证体 ID" }
          - { name: consumed_at, value: step.now.consumed_at, description: "消费时间" }
          - { name: status, value: step.status_consumed.status, description: "目标状态：已消费" }
        output: [ ]
        query: data.queries.verification.consume_verification
        goto: record_done
      - id: increment
        kind: query
        summary: "验证码不匹配时递增失败次数，状态保持 sent"
        input:
          - { name: id, value: step.load_verification.row.id, description: "校验失败的验证体 ID" }
          - { name: attempt_count, value: step.next_attempt.attempt_count, description: "递增后的尝试次数" }
          - { name: status, value: step.status_sent.status, description: "目标状态：已发送" }
        output: [ ]
        query: data.queries.verification.increment_verification_attempt
        goto: record_done
      - id: deny_expired
        kind: logic
        summary: "验证码已过期，返回过期错误"
        input: [ ]
        output: [ ]
        errors:
          - platform.errors.AUTH_VERIFICATION_EXPIRED
        rules: [ ]
        goto: $end
      - id: deny_attempts
        kind: logic
        summary: "尝试次数超限，返回超限错误"
        input: [ ]
        output: [ ]
        errors:
          - platform.errors.AUTH_VERIFICATION_ATTEMPTS_EXCEEDED
        rules: [ ]
        goto: $end
      - id: deny_invalid
        kind: logic
        summary: "验证体状态非法，返回统一验证错误"
        input: [ ]
        output: [ ]
        errors:
          - platform.errors.AUTH_VERIFICATION_INVALID
        rules: [ ]
        goto: $end
      - id: record_done
        kind: logic
        summary: "汇总校验结果"
        input:
          - { name: outcome, value: step.check.outcome, description: "本次校验结果" }
          - { name: verification_id, value: step.load_verification.row.id, description: "验证记录 ID" }
          - { name: now, value: step.now.consumed_at, description: "消费时间" }
        output:
          - { name: result, type: cap.services.verification.schemas.VerificationResult, description: "校验结果" }
          - { name: verified, type: _types.basics.boolean, description: "是否验证通过" }
        errors:
          - platform.errors.COMMON_INTERNAL
          - platform.errors.AUTH_VERIFICATION_INVALID
        rules:
          - { rule: feature.rules.auth.verification_action_recorded }
          - { rule: feature.rules.auth.verification_action_append_only }
          - { rule: feature.rules.auth.verification_consumed_consistent }
        goto: status_verified
      - id: status_verified
        kind: logic
        summary: "目标状态：已认证"
        input: [ ]
        output:
          - { name: status, type: data.enums.auth_status, description: "目标状态：已认证" }
        errors:
          - platform.errors.COMMON_INTERNAL
        rules:
          - { rule: feature.rules.auth.verification_success_sets_verified }
        goto: require_verified
      - id: require_verified
        kind: when
        summary: "验证码不匹配时跳过认证绑定写入"
        input:
          - { name: verified, value: step.record_done.verified, description: "是否验证通过" }
        output: [ ]
        when:
          - input: verified
            expr: "input.verified == false"
            goto: $end
        goto: dispatch
      - id: dispatch
        kind: when
        summary: "按 auth_type 选择手机或邮箱的状态写入分支"
        input:
          - { name: auth_type, value: params.input.auth_type, description: "认证类型" }
        output: [ ]
        when:
          - input: auth_type
            expr: "input.auth_type == 'phone'"
            goto: apply_phone_verified
          - input: auth_type
            expr: "input.auth_type == 'email'"
            goto: apply_email_verified
        goto: $end
      - id: apply_phone_verified
        kind: query
        summary: "验证成功且 auth_type=phone 时把手机绑定置为 verified"
        lifecycles: [ cap.lifecycles.auth_contact.transitions.verify ]
        state_gate:
          - { lifecycle: cap.lifecycles.auth_contact, values: [ unverified ] }
        input:
          - { name: id, value: step.resolve_auth_id.auth_id, description: "认证绑定 ID" }
          - { name: status, value: step.status_verified.status, description: "目标状态：已认证" }
        output: [ ]
        errors:
          - platform.errors.AUTH_VERIFICATION_INVALID
          - platform.errors.COMMON_INTERNAL
        query: data.queries.auth.set_auth_phone_status
        goto: $end
      - id: apply_email_verified
        kind: query
        summary: "验证成功且 auth_type=email 时把邮箱绑定置为 verified"
        lifecycles: [ cap.lifecycles.auth_contact.transitions.verify ]
        state_gate:
          - { lifecycle: cap.lifecycles.auth_contact, values: [ unverified ] }
        input:
          - { name: id, value: step.resolve_auth_id.auth_id, description: "认证绑定 ID" }
          - { name: status, value: step.status_verified.status, description: "目标状态：已认证" }
        output: [ ]
        errors:
          - platform.errors.AUTH_VERIFICATION_INVALID
          - platform.errors.COMMON_INTERNAL
        query: data.queries.auth.set_auth_email_status
        goto: $end
    used_by:
      - cap.protocols.http.auth.verification_verify

  - name: record_failure
    summary: "独立事务记录失败校验动作"
    visibility: internal
    tx_mode: none
    params:
      - { name: ctx, type: context.Context }
      - { name: verification_id, type: _types.basics.id }
      - { name: account_id, type: _types.basics.id }
      - { name: result, type: data.enums.verification_result }
      - { name: request_ip, type: _types.basics.string, nullable: true }
      - { name: device_id, type: _types.basics.string, nullable: true }
      - { name: location, type: _types.basics.string, nullable: true }
      - { name: input_hash, type: _types.basics.string }
    returns:
      - { name: err, type: error, value: "*" }
    steps:
      - id: log
        kind: query
        summary: "追加失败校验动作"
        input:
          - { name: verification_id, value: params.verification_id, description: "验证体 ID" }
          - { name: account_id, value: params.account_id, description: "账号 ID" }
          - { name: result, value: params.result, description: "失败结果" }
          - { name: request_ip, value: params.request_ip, description: "请求 IP" }
          - { name: device_id, value: params.device_id, description: "请求设备标识" }
          - { name: location, value: params.location, description: "请求位置" }
          - { name: input_hash, value: params.input_hash, description: "用户输入的哈希" }
        output: [ ]
        query: data.queries.verification.create_verification_action
        goto: $end
    used_by:
      - cap.services.verification.verify

  - name: cleanup
    summary: "批量把过期或尝试超限的验证体置为终态"
    visibility: internal
    tx_mode: none
    params:
      - { name: ctx, type: context.Context }
    returns:
      - { name: expired_rows, type: _types.basics.integer.32, value: step.expire_stale.affected_rows }
      - { name: revoked_rows, type: _types.basics.integer.32, value: step.revoke_exhausted.affected_rows }
      - { name: err, type: error, value: "*" }
    steps:
      - id: now
        kind: logic
        summary: "取当前时间"
        input: [ ]
        output:
          - { name: now, type: _types.basics.timestamp.long, description: "当前时间" }
        errors: [ ]
        rules: [ ]
        goto: max_attempts
      - id: max_attempts
        kind: logic
        summary: "取验证码尝试次数上限"
        input: [ ]
        output:
          - { name: max_attempts, type: _types.basics.integer.32, description: "尝试次数上限" }
        errors: [ ]
        rules: [ ]
        goto: status_expired
      - id: status_expired
        kind: logic
        summary: "构造验证体目标状态：已过期"
        input: [ ]
        output:
          - { name: status, type: data.enums.verification_status, description: "目标状态：已过期" }
        errors: [ ]
        rules: [ ]
        goto: status_revoked
      - id: status_revoked
        kind: logic
        summary: "构造验证体目标状态：已作废"
        input: [ ]
        output:
          - { name: status, type: data.enums.verification_status, description: "目标状态：已作废" }
        errors: [ ]
        rules: [ ]
        goto: batch_limit
      - id: batch_limit
        kind: logic
        summary: "取单批更新上限"
        input: [ ]
        output:
          - { name: limit, type: _types.basics.integer.32, description: "单批更新上限" }
        errors: [ ]
        rules: [ ]
        goto: expire_stale
      - id: expire_stale
        kind: query
        summary: "调用 data.queries.verification.expire_stale_verifications"
        lifecycles: [ cap.lifecycles.verification.transitions.expire ]
        state_gate:
          - { lifecycle: cap.lifecycles.verification, values: [ pending, sent ] }
        input:
          - { name: now, value: step.now.now, description: "当前时间" }
          - { name: status, value: step.status_expired.status, description: "目标状态：已过期" }
          - { name: limit, value: step.batch_limit.limit, description: "单批更新上限" }
        output:
          - { name: affected_rows, type: _types.basics.integer.32, description: "query 返回的 affected_rows" }
        query: data.queries.verification.expire_stale_verifications
        goto: revoke_exhausted
      - id: revoke_exhausted
        kind: query
        summary: "调用 data.queries.verification.revoke_exhausted_verifications"
        lifecycles: [ cap.lifecycles.verification.transitions.revoke ]
        state_gate:
          - { lifecycle: cap.lifecycles.verification, values: [ pending, sent ] }
        input:
          - { name: max_attempts, value: step.max_attempts.max_attempts, description: "尝试次数上限" }
          - { name: status, value: step.status_revoked.status, description: "目标状态：已作废" }
          - { name: limit, value: step.batch_limit.limit, description: "单批更新上限" }
        output:
          - { name: affected_rows, type: _types.basics.integer.32, description: "query 返回的 affected_rows" }
        query: data.queries.verification.revoke_exhausted_verifications
        goto: $end
    used_by:
      - cap.events.verification.cleanup

  - name: revoke_by_auth
    summary: "换绑/解绑/停用认证绑定时作废对应未消费验证体"
    visibility: public
    tx_mode: none
    params:
      - { name: ctx, type: context.Context }
      - { name: auth_type, type: data.enums.auth_type }
      - { name: auth_id, type: _types.basics.id }
    returns:
      - { name: err, type: error, value: "*" }
    steps:
      - id: no_purpose
        kind: logic
        summary: "构造空用途：由查询按 NULL 匹配任意用途"
        input: [ ]
        output:
          - { name: purpose, type: data.enums.verification_purpose, description: "空用途；null 表示任意用途", nullable: true }
        errors: [ ]
        rules: [ ]
        goto: status_revoked
      - id: status_revoked
        kind: logic
        summary: "构造验证体目标状态：已作废"
        input: [ ]
        output:
          - { name: status, type: data.enums.verification_status, description: "目标状态：已作废" }
        errors: [ ]
        rules: [ ]
        goto: guard
      - id: guard
        kind: logic
        summary: "校验认证绑定归属与可作废性"
        input:
          - { name: auth_type, value: params.auth_type, description: "要作废的认证类型" }
          - { name: auth_id, value: params.auth_id, description: "要作废的认证绑定 ID" }
        output: [ ]
        errors:
          - platform.errors.AUTH_VERIFICATION_TARGET_INVALID
          - platform.errors.COMMON_INTERNAL
        rules:
          - { rule: feature.rules.auth.verification_auth_change }
        goto: revoke_active_verifications_by_auth
      - id: revoke_active_verifications_by_auth
        kind: query
        summary: "调用 data.queries.verification.revoke_active_verifications_by_auth"
        lifecycles: [ cap.lifecycles.verification.transitions.revoke ]
        state_gate:
          - { lifecycle: cap.lifecycles.verification, values: [ pending, sent ] }
        input:
          - { name: auth_type, value: params.auth_type, description: "要作废的认证类型" }
          - { name: auth_id, value: params.auth_id, description: "要作废的认证绑定 ID" }
          - { name: purpose, value: step.no_purpose.purpose, description: "验证用途；null 表示任意" }
          - { name: status, value: step.status_revoked.status, description: "目标状态：已作废" }
        output: [ ]
        query: data.queries.verification.revoke_active_verifications_by_auth
        goto: $end
    used_by:
      - cap.services.auth.bind_email
      - cap.services.auth.bind_password
      - cap.services.auth.bind_phone

  - name: revoke_by_account
    summary: "作废账号的全部未消费验证体"
    visibility: public
    tx_mode: none
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: _types.basics.id }
    returns:
      - { name: err, type: error, value: "*" }
    steps:
      - id: status_revoked
        kind: logic
        summary: "构造验证体目标状态：已作废"
        input: [ ]
        output:
          - { name: status, type: data.enums.verification_status, description: "目标状态：已作废" }
        errors: [ ]
        rules: [ ]
        goto: revoke_active_verifications_by_account
      - id: revoke_active_verifications_by_account
        kind: query
        summary: "调用 data.queries.verification.revoke_active_verifications_by_account"
        lifecycles: [ cap.lifecycles.verification.transitions.revoke ]
        state_gate:
          - { lifecycle: cap.lifecycles.verification, values: [ pending, sent ] }
        input:
          - { name: account_id, value: params.account_id, description: "要作废验证体的账号 ID" }
          - { name: status, value: step.status_revoked.status, description: "目标状态：已作废" }
        output: [ ]
        errors:
          - platform.errors.COMMON_INTERNAL
        query: data.queries.verification.revoke_active_verifications_by_account
        goto: $end
    used_by:
      - cap.services.auth.revoke_all_for_account
