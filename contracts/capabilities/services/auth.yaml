id: cap.services.auth
summary: "认证会话服务：登录、认证绑定与账号注销编排"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "auth.login 不直接写 token 表；通过 cap.services.token.issue 签发"
  - "认证失败统一返回 AUTH_INVALID_CREDENTIALS，不要枚举账号是否存在"
  - "登录失败计数必须先于错误返回写入；login 不使用整体事务"
  - "bind_email / bind_phone / bind_password 必须先读取 account 并校验 status ∈ (pending, active)"

schemas:
  LoginInput:
    type: object
    properties:
      - { name: auth_type, schema: { ref: data.enums.auth_type }, required: true, description: "认证类型" }
      - { name: identifier, schema: { type: _types.auth_identifier }, required: true, description: "登录标识" }
      - { name: password, schema: { type: _types.string }, nullable: true, write_only: true, description: "密码；仅请求写入，不回显" }
      - { name: code, schema: { type: _types.phone_code }, nullable: true, description: "手机号区号，例如 +86" }
      - { name: device_id, schema: { type: _types.device_id }, nullable: true, description: "设备标识" }
    validation:
      - { rule: "input.auth_type != \"pwd\" || input.password != null", message: "密码认证必须提供密码" }
  BindPasswordInput:
    type: object
    properties:
      - { name: account_id, schema: { type: _types.integer }, required: true, description: "账号 ID" }
      - { name: action, schema: { ref: data.enums.auth_password_action }, required: true, description: "认证绑定动作" }
      - { name: username, schema: { type: _types.auth_username }, nullable: true, description: "用户名" }
      - { name: password, schema: { type: _types.string }, nullable: true, write_only: true, description: "密码；仅请求写入，不回显" }
    validation:
      - { rule: "input.action != \"create\" && input.action != \"update\" || input.password != null", message: "创建或修改密码必须提供密码" }
  BindPhoneInput:
    type: object
    properties:
      - { name: account_id, schema: { type: _types.integer }, required: true, description: "账号 ID" }
      - { name: action, schema: { ref: data.enums.auth_bind_action }, required: true, description: "认证绑定动作" }
      - { name: code, schema: { type: _types.phone_code }, nullable: true, description: "手机号区号，例如 +86" }
      - { name: number, schema: { type: _types.phone_number }, nullable: true, description: "手机号；只允许数字" }
    validation:
      - { rule: "input.action != \"create\" || input.number != null", message: "创建手机绑定必须提供手机号" }
  BindEmailInput:
    type: object
    properties:
      - { name: account_id, schema: { type: _types.integer }, required: true, description: "账号 ID" }
      - { name: action, schema: { ref: data.enums.auth_bind_action }, required: true, description: "认证绑定动作" }
      - { name: username, schema: { type: _types.email_username }, nullable: true, description: "用户名" }
      - { name: domain, schema: { type: _types.email_domain }, nullable: true, description: "邮箱域名" }
    validation:
      - { rule: "input.action != \"create\" || input.username != null && input.domain != null", message: "创建邮箱绑定必须提供用户名和域名" }
  AuthBinding:
    type: object
    properties:
      - { name: auth_type, schema: { ref: data.enums.auth_type }, required: true, description: "认证类型" }
      - { name: auth_id, schema: { type: _types.integer }, required: true, description: "认证绑定 ID" }
      - { name: account_id, schema: { type: _types.integer }, required: true, description: "账号 ID" }
      - { name: status, schema: { ref: data.enums.auth_status }, required: true, description: "认证绑定状态" }
      - { name: masked_target, schema: { type: _types.string }, description: "脱敏后的接收目标" }
  AuthSession:
    type: object
    properties:
      - { name: account, schema: { ref: data.entities.account }, required: true, description: "账号实体" }
      - { name: tokens, schema: { ref: cap.services.token.schemas.TokenPair }, required: true, description: "令牌对" }

services:
  - name: login
    summary: "登录：校验认证绑定，签发令牌"
    visibility: public
    tx_mode: none
    params:
      - { name: ctx, type: context.Context }
      - { name: input, type: cap.services.auth.schemas.LoginInput }
    returns:
      - { name: session, type: cap.services.auth.schemas.AuthSession, value: step.build_session.session }
      - { name: err, type: error }
    steps:
      - id: load_branch
        kind: when
        summary: "按 auth_type 选择密码、手机或邮箱绑定查询"
        input:
          - { name: auth_type, value: params.input.auth_type, description: "认证类型" }
        output: [ ]
        when:
          - input: auth_type
            expr: "input.auth_type == 'pwd'"
            goto: get_auth_pwd_by_username
          - input: auth_type
            expr: "input.auth_type == 'phone'"
            goto: phone_code
          - input: auth_type
            expr: "input.auth_type == 'email'"
            goto: split_identifier
        goto: reject_type
      - id: phone_code
        kind: logic
        summary: "确认手机登录的区号非空"
        input:
          - { name: code, value: params.input.code, description: "手机号区号；可能为 null" }
        output:
          - { name: code, type: string, description: "非空的手机号区号" }
        errors:
          - platform.errors.AUTH_INVALID_CREDENTIALS
        rules: [ ]
        goto: get_auth_phone_by_number
      - id: split_identifier
        kind: logic
        summary: "把邮箱登录标识拆成用户名与域名"
        input:
          - { name: identifier, value: params.input.identifier, description: "登录标识" }
        output:
          - { name: username, type: string, description: "邮箱本地部分" }
          - { name: domain, type: string, description: "邮箱域名" }
        errors: [ ]
        rules: [ ]
        goto: get_auth_email_by_username_domain
      - id: get_auth_pwd_by_username
        kind: query
        summary: "调用 data.queries.auth.get_auth_pwd_by_username"
        input:
          - { name: username, value: params.input.identifier, description: "用户名" }
        output:
          - { name: row, type: data.entities.auth_pwd, description: "query 返回的 row" }
        query: data.queries.auth.get_auth_pwd_by_username
        goto: load
      - id: get_auth_phone_by_number
        kind: query
        summary: "调用 data.queries.auth.get_auth_phone_by_number"
        input:
          - { name: code, value: step.phone_code.code, description: "手机号区号" }
          - { name: number, value: params.input.identifier, description: "手机号" }
        output:
          - { name: row, type: data.entities.auth_phone, description: "query 返回的 row" }
        query: data.queries.auth.get_auth_phone_by_number
        goto: load
      - id: get_auth_email_by_username_domain
        kind: query
        summary: "调用 data.queries.auth.get_auth_email_by_username_domain"
        input:
          - { name: username, value: step.split_identifier.username, description: "用户名" }
          - { name: domain, value: step.split_identifier.domain, description: "邮箱域名" }
        output:
          - { name: row, type: data.entities.auth_email, description: "query 返回的 row" }
        query: data.queries.auth.get_auth_email_by_username_domain
        goto: load
      - id: load
        kind: logic
        summary: "把命中的认证绑定行归一为登录校验输入"
        input:
          - { name: auth_type, value: params.input.auth_type, description: "认证类型" }
          - { name: pwd_row, value: step.get_auth_pwd_by_username.row, description: "密码绑定行" }
          - { name: phone_row, value: step.get_auth_phone_by_number.row, description: "手机绑定行" }
          - { name: email_row, value: step.get_auth_email_by_username_domain.row, description: "邮箱绑定行" }
        output:
          - { name: account_id, type: integer, description: "命中的账号 ID" }
          - { name: auth_pwd_id, type: integer, description: "密码绑定 ID；手机/邮箱认证时为 null", nullable: true }
          - { name: failed_login_count, type: integer, description: "密码绑定当前的连续失败次数；非密码认证时为 0" }
          - { name: auth_status, type: data.enums.auth_status, description: "命中的认证绑定状态" }
          - { name: password_hash, type: string, description: "密码哈希；非密码认证时为 null", nullable: true }
          - { name: locked_until, type: timestamp, description: "密码绑定锁定截止时间", nullable: true }
        errors:
          - platform.errors.AUTH_INVALID_CREDENTIALS
        rules: [ ]
        goto: load_account
      - id: load_account
        kind: query
        summary: "加载登录账号"
        input:
          - { name: id, value: step.load.account_id, description: "认证绑定命中的账号 ID" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.get_account
        goto: check
      - id: check
        kind: logic
        summary: "校验凭据、锁定与账号状态，输出登录结果"
        input:
          - { name: account, value: step.load_account.account, description: "load_account 读到的账号" }
          - { name: auth_type, value: params.input.auth_type, description: "认证类型" }
          - { name: password, value: params.input.password, description: "用户输入的密码" }
          - { name: auth_status, value: step.load.auth_status, description: "认证绑定状态" }
          - { name: password_hash, value: step.load.password_hash, description: "密码哈希" }
          - { name: failed_login_count, value: step.load.failed_login_count, description: "当前连续失败次数" }
          - { name: locked_until, value: step.load.locked_until, description: "锁定截止时间" }
        output:
          - { name: success, type: boolean, description: "登录是否成功" }
          - { name: reason, type: data.enums.login_failed_reason, description: "失败原因；成功时为 null", nullable: true }
        errors: [ ]
        rules:
          - { rule: feature.rules.auth.auth_login_requires_verified }
          - { rule: feature.rules.auth.auth_login_rejects_pending_account }
          - { rule: feature.rules.auth.auth_login_rejects_suspended_account }
          - { rule: feature.rules.auth.auth_login_rejects_deleted_account }
          - { rule: feature.rules.auth.login_lockout }
        goto: now
      - id: now
        kind: logic
        summary: "取当前时间作为登录时间"
        input: [ ]
        output:
          - { name: login_at, type: timestamp, description: "登录时间" }
        errors: [ ]
        rules: [ ]
        goto: record_branch
      - id: record_branch
        kind: when
        summary: "按登录结果与认证类型选择记录与事件路径"
        input:
          - { name: success, value: step.check.success, description: "登录是否成功" }
          - { name: auth_type, value: params.input.auth_type, description: "认证类型" }
          - { name: reason, value: step.check.reason, description: "失败原因" }
        output: [ ]
        when:
          - input: success
            expr: "input.success == true"
            goto: record_login_success
          - input: success
            expr: "input.success == false && input.auth_type == 'pwd' && input.reason == 'bad_password'"
            goto: pwd_failure_id
        goto: fail_reason
      - id: record_login_success
        kind: service
        summary: "记录成功并发出成功事件"
        input:
          - { name: account_id, value: step.load.account_id, description: "账号 ID" }
          - { name: auth_pwd_id, value: step.load.auth_pwd_id, description: "密码绑定 ID；非密码登录为 null" }
          - { name: login_at, value: step.now.login_at, description: "登录时间" }
        output: [ ]
        service: cap.services.auth.record_login_success
        goto: issue_tokens
      - id: pwd_failure_id
        kind: logic
        summary: "确认密码失败路径上的绑定 ID 非空"
        input:
          - { name: id, value: step.load.auth_pwd_id, description: "密码绑定 ID；可能为 null" }
        output:
          - { name: id, type: integer, description: "非空的密码绑定 ID" }
        errors:
          - platform.errors.COMMON_INTERNAL
        rules: [ ]
        goto: pwd_fail_reason
      - id: pwd_fail_reason
        kind: logic
        summary: "确认密码失败路径上的失败原因非空"
        input:
          - { name: reason, value: step.check.reason, description: "失败原因；可能为 null" }
        output:
          - { name: reason, type: data.enums.login_failed_reason, description: "非空的失败原因" }
        errors:
          - platform.errors.COMMON_INTERNAL
        rules: [ ]
        goto: record_login_failure
      - id: record_login_failure
        kind: service
        summary: "记录失败计数并发出失败事件"
        input:
          - { name: account_id, value: step.load.account_id, description: "账号 ID" }
          - { name: auth_pwd_id, value: step.pwd_failure_id.id, description: "密码绑定 ID" }
          - { name: failed_login_count, value: step.load.failed_login_count, description: "当前连续失败次数" }
          - { name: login_at, value: step.now.login_at, description: "登录时间" }
          - { name: reason, value: step.pwd_fail_reason.reason, description: "失败原因" }
        output: [ ]
        service: cap.services.auth.record_login_failure
        goto: reject
      - id: fail_reason
        kind: logic
        summary: "确认非密码失败路径上的失败原因非空"
        input:
          - { name: reason, value: step.check.reason, description: "失败原因；可能为 null" }
        output:
          - { name: reason, type: data.enums.login_failed_reason, description: "非空的失败原因" }
        errors:
          - platform.errors.COMMON_INTERNAL
        rules: [ ]
        goto: emit_login_failed
      - id: emit_login_failed
        kind: events
        summary: "发出登录失败事件"
        input:
          - { name: account_id, value: step.load.account_id, description: "账号 ID" }
          - { name: reason, value: step.fail_reason.reason, description: "失败原因" }
          - { name: failed_at, value: step.now.login_at, description: "登录失败时间" }
        output: [ ]
        events:
          - ref: cap.events.account.login_failed
        goto: reject
      - id: issue_tokens
        kind: service
        summary: "为登录账号签发令牌"
        input:
          - { name: account_id, value: step.load.account_id, description: "账号 ID" }
          - { name: device_id, value: params.input.device_id, description: "设备标识" }
        output:
          - { name: tokens, type: cap.services.token.schemas.TokenPair, description: "service 返回的 tokens" }
        service: cap.services.token.issue
        goto: build_session
      - id: build_session
        kind: logic
        summary: "组装登录会话"
        input:
          - { name: account, value: step.load_account.account, description: "账号实体" }
          - { name: tokens, value: step.issue_tokens.tokens, description: "签发后的令牌对" }
        output:
          - { name: session, type: cap.services.auth.schemas.AuthSession, description: "登录会话" }
        errors: [ ]
        rules: [ ]
        goto: $end
      - id: reject
        kind: logic
        summary: "按失败原因返回统一登录错误"
        input:
          - { name: reason, value: step.check.reason, description: "失败原因" }
        output: [ ]
        errors:
          - platform.errors.AUTH_INVALID_CREDENTIALS
          - platform.errors.AUTH_LOCKED
          - platform.errors.ACCOUNT_SUSPENDED
        rules: [ ]
        goto: $end
      - id: reject_type
        kind: logic
        summary: "拒绝不支持的认证类型"
        input: [ ]
        output: [ ]
        errors:
          - platform.errors.AUTH_INVALID_CREDENTIALS
        rules: [ ]
        goto: $end

  - name: bind_password
    summary: "创建、修改或启停密码认证绑定"
    visibility: public
    tx_mode: none
    params:
      - { name: ctx, type: context.Context }
      - { name: input, type: cap.services.auth.schemas.BindPasswordInput }
    returns:
      - { name: binding, type: cap.services.auth.schemas.AuthBinding, value: step.to_binding.binding }
      - { name: err, type: error }
    steps:
      - id: load_account
        kind: query
        summary: "读取认证绑定所属账号"
        input:
          - { name: id, value: params.input.account_id, description: "账号 ID" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.get_account
        goto: check_account
      - id: check_account
        kind: logic
        summary: "校验账号可变更认证绑定"
        input:
          - { name: account, value: step.load_account.account, description: "认证绑定所属账号" }
        output: [ ]
        errors:
          - platform.errors.ACCOUNT_SUSPENDED
          - platform.errors.ACCOUNT_ALREADY_DELETED
        rules:
          - { rule: feature.rules.auth.auth_binding_rejects_suspended_account }
          - { rule: feature.rules.auth.auth_binding_rejects_deleted_account }
        goto: resolve
      - id: resolve
        kind: logic
        summary: "按 action 定位目标密码绑定：create 生成新 ID，其余使用现有绑定"
        input:
          - { name: action, value: params.input.action, description: "绑定动作" }
          - { name: account_id, value: params.input.account_id, description: "账号 ID" }
          - { name: username, value: params.input.username, description: "用户名；用于定位现有绑定" }
        output:
          - { name: binding_id, type: integer, description: "目标密码绑定 ID" }
          - { name: auth_type, type: data.enums.auth_type, description: "本服务的认证类型常量" }
        errors: [ ]
        rules: [ ]
        goto: branch
      - id: branch
        kind: when
        summary: "按 action 选择创建、改密、启用或停用分支"
        input:
          - { name: action, value: params.input.action, description: "绑定动作" }
        output: [ ]
        when:
          - input: action
            expr: "input.action == 'create'"
            goto: create_status
          - input: action
            expr: "input.action == 'update'"
            goto: hash_update
          - input: action
            expr: "input.action == 'enable'"
            goto: enable_status
          - input: action
            expr: "input.action == 'disable'"
            goto: disable_status
        goto: $end
      - id: create_status
        kind: logic
        summary: "创建密码绑定即 verified"
        input: [ ]
        output:
          - { name: status, type: data.enums.auth_status, description: "目标状态 verified" }
        errors: [ ]
        rules: [ ]
        goto: create_username
      - id: create_username
        kind: logic
        summary: "确认创建密码必须提供用户名"
        input:
          - { name: username, value: params.input.username, description: "用户名；可能为 null" }
        output:
          - { name: username, type: string, description: "非空的用户名" }
        errors:
          - platform.errors.AUTH_INVALID_CREDENTIALS
        rules: [ ]
        goto: hash_create
      - id: hash_create
        kind: logic
        summary: "对创建时的明文密码做哈希"
        input:
          - { name: password, value: params.input.password, description: "明文密码" }
        output:
          - { name: password_hash, type: string, description: "密码哈希" }
        errors: [ ]
        rules: [ ]
        goto: create_auth_pwd
      - id: create_auth_pwd
        kind: query
        summary: "调用 data.queries.auth.create_auth_pwd"
        lifecycles: [ cap.lifecycles.auth_pwd.create ]
        input:
          - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
          - { name: account_id, value: params.input.account_id, description: "账号 ID" }
          - { name: status, value: step.create_status.status, description: "绑定状态 verified" }
          - { name: username, value: step.create_username.username, description: "用户名" }
          - { name: password_hash, value: step.hash_create.password_hash, description: "密码哈希" }
        output: [ ]
        query: data.queries.auth.create_auth_pwd
        goto: load
      - id: hash_update
        kind: logic
        summary: "对修改时的明文密码做哈希"
        input:
          - { name: password, value: params.input.password, description: "明文密码" }
        output:
          - { name: password_hash, type: string, description: "密码哈希" }
        errors: [ ]
        rules: [ ]
        goto: update_auth_pwd_hash
      - id: update_auth_pwd_hash
        kind: query
        summary: "调用 data.queries.auth.update_auth_pwd_hash"
        input:
          - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
          - { name: password_hash, value: step.hash_update.password_hash, description: "密码哈希" }
        output: [ ]
        query: data.queries.auth.update_auth_pwd_hash
        goto: load
      - id: enable_status
        kind: logic
        summary: "启用密码绑定后状态为 verified"
        input: [ ]
        output:
          - { name: status, type: data.enums.auth_status, description: "目标状态 verified" }
        errors: [ ]
        rules: [ ]
        goto: enable_pwd_status
      - id: enable_pwd_status
        kind: query
        summary: "调用 data.queries.auth.set_auth_pwd_status"
        lifecycles: [ cap.lifecycles.auth_pwd.transitions.enable ]
        input:
          - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
          - { name: status, value: step.enable_status.status, description: "绑定状态 verified" }
        output: [ ]
        query: data.queries.auth.set_auth_pwd_status
        goto: load
      - id: disable_status
        kind: logic
        summary: "停用密码绑定后状态为 disabled"
        input: [ ]
        output:
          - { name: status, type: data.enums.auth_status, description: "目标状态 disabled" }
        errors: [ ]
        rules: [ ]
        goto: disable_pwd_status
      - id: disable_pwd_status
        kind: query
        summary: "调用 data.queries.auth.set_auth_pwd_status"
        lifecycles: [ cap.lifecycles.auth_pwd.transitions.disable ]
        input:
          - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
          - { name: status, value: step.disable_status.status, description: "绑定状态 disabled" }
        output: [ ]
        query: data.queries.auth.set_auth_pwd_status
        goto: revoke_verifications
