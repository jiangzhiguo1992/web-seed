        summary: "读取变更后的邮箱绑定"
        input:
          - { name: id, value: step.merge_id.target_id, description: "认证绑定 ID" }
        output:
          - { name: row, type: data.entities.auth_email, description: "query 返回的 row" }
        query: data.queries.auth.get_auth_email_by_id
        goto: to_binding
      - id: to_binding
        kind: logic
        summary: "把邮箱绑定行映射为 AuthBinding"
        input:
          - { name: row, value: step.load.row, description: "邮箱绑定行" }
        output:
          - { name: binding, type: cap.services.auth.schemas.AuthBinding, description: "认证绑定" }
        errors: [ ]
        rules: [ ]
        goto: $end

  - name: record_login_success
    summary: "记录密码登录成功并发出成功事件"
    visibility: internal
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: integer }
      - { name: auth_pwd_id, type: integer, nullable: true }
      - { name: login_at, type: timestamp }
    returns:
      - { name: err, type: error }
    steps:
      - id: branch
        kind: when
        summary: "非密码登录跳过失败计数清零"
        input:
          - { name: auth_pwd_id, value: params.auth_pwd_id, description: "密码绑定 ID；非密码登录为 null" }
        output: [ ]
        when:
          - input: auth_pwd_id
            expr: "input.auth_pwd_id == null"
            goto: emit_login_succeeded
        goto: reset_id
      - id: reset_id
        kind: logic
        summary: "确认密码成功路径上的绑定 ID 非空"
        input:
          - { name: id, value: params.auth_pwd_id, description: "密码绑定 ID；可能为 null" }
        output:
          - { name: id, type: integer, description: "非空的密码绑定 ID" }
        errors:
          - platform.errors.COMMON_INTERNAL
        rules: [ ]
        goto: record_auth_pwd_login_success
      - id: record_auth_pwd_login_success
        kind: query
        summary: "记录登录成功并清零失败计数"
        input:
          - { name: id, value: step.reset_id.id, description: "密码绑定 ID" }
        output: [ ]
        errors:
          - platform.errors.COMMON_INTERNAL
        query: data.queries.auth.record_auth_pwd_login_success
        goto: emit_login_succeeded
      - id: emit_login_succeeded
        kind: events
        summary: "发出登录成功事件"
        input:
          - { name: id, value: params.account_id, description: "账号 ID" }
          - { name: login_at, value: params.login_at, description: "登录时间" }
        output: [ ]
        events:
          - ref: cap.events.account.login_succeeded
        goto: $end

  - name: record_login_failure
    summary: "记录密码登录失败并发出失败事件"
    visibility: internal
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: integer }
      - { name: auth_pwd_id, type: integer }
      - { name: failed_login_count, type: integer }
      - { name: login_at, type: timestamp }
      - { name: reason, type: data.enums.login_failed_reason }
    returns:
      - { name: err, type: error }
    steps:
      - id: load_policy
        kind: logic
        summary: "读取密码登录锁定策略"
        input: [ ]
        output:
          - { name: max_attempts, type: integer, description: "最大连续失败次数" }
          - { name: lockout, type: integer, description: "锁定时长（秒）" }
        errors: [ ]
        rules:
          - { rule: feature.rules.auth.login_lockout }
        goto: lock_until
      - id: lock_until
        kind: logic
        summary: "按连续失败次数与锁定策略计算锁定截止时间"
        input:
          - { name: failed_login_count, value: params.failed_login_count, description: "当前连续失败次数" }
          - { name: max_attempts, value: step.load_policy.max_attempts, description: "最大连续失败次数" }
          - { name: lockout, value: step.load_policy.lockout, description: "锁定时长（秒）" }
        output:
          - { name: lock_until, type: timestamp, description: "锁定截止时间" }
        errors:
          - platform.errors.AUTH_LOCKED
        rules:
          - { rule: feature.rules.auth.login_lockout }
        goto: record_auth_pwd_login_failure
      - id: record_auth_pwd_login_failure
        kind: query
        summary: "调用 data.queries.auth.record_auth_pwd_login_failure"
        input:
          - { name: id, value: params.auth_pwd_id, description: "密码绑定 ID" }
          - { name: lock_until, value: step.lock_until.lock_until, description: "锁定截止时间" }
        output: [ ]
        errors:
          - platform.errors.COMMON_INTERNAL
        query: data.queries.auth.record_auth_pwd_login_failure
        goto: emit_login_failed
      - id: emit_login_failed
        kind: events
        summary: "发出登录失败事件"
        input:
          - { name: account_id, value: params.account_id, description: "账号 ID" }
          - { name: reason, value: params.reason, description: "失败原因" }
          - { name: failed_at, value: params.login_at, description: "登录失败时间" }
        output: [ ]
        events:
          - ref: cap.events.account.login_failed
        goto: $end

  - name: revoke_all_for_account
    summary: "软删账号的认证绑定，并编排令牌吊销与验证体作废"
    visibility: public
    tx_mode: none
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: integer }
    returns:
      - { name: err, type: error }
    steps:
      - id: soft_delete_auth_pwd_by_account
        kind: query
        summary: "调用 data.queries.auth.soft_delete_auth_pwd_by_account"
        lifecycles: [ cap.lifecycles.auth_pwd.destroy ]
        input:
          - { name: account_id, value: params.account_id, description: "账号 ID" }
        output: [ ]
        query: data.queries.auth.soft_delete_auth_pwd_by_account
        goto: soft_delete_auth_phone_by_account
      - id: soft_delete_auth_phone_by_account
        kind: query
        summary: "调用 data.queries.auth.soft_delete_auth_phone_by_account"
        lifecycles: [ cap.lifecycles.auth_contact.destroy ]
        input:
          - { name: account_id, value: params.account_id, description: "账号 ID" }
        output: [ ]
        query: data.queries.auth.soft_delete_auth_phone_by_account
        goto: soft_delete_auth_email_by_account
      - id: soft_delete_auth_email_by_account
        kind: query
        summary: "调用 data.queries.auth.soft_delete_auth_email_by_account"
        lifecycles: [ cap.lifecycles.auth_contact.destroy ]
        input:
          - { name: account_id, value: params.account_id, description: "账号 ID" }
        output: [ ]
        query: data.queries.auth.soft_delete_auth_email_by_account
        goto: revoke_tokens
      - id: revoke_tokens
        kind: service
        summary: "吊销账号全部令牌"
        input:
          - { name: account_id, value: params.account_id, description: "账号 ID" }
        output: [ ]
        errors:
          - platform.errors.COMMON_INTERNAL
        service: cap.services.token.revoke_by_account
        goto: revoke_verifications
      - id: revoke_verifications
        kind: service
        summary: "作废账号未消费的验证体"
        input:
          - { name: account_id, value: params.account_id, description: "账号 ID" }
        output: [ ]
        errors:
          - platform.errors.COMMON_INTERNAL
        service: cap.services.verification.revoke_by_account
        goto: $end
