id: cap.services.auth
summary: "认证会话服务：登录、认证绑定与账号注销编排"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "auth.login 不直接写 token 表；通过 cap.services.token.issue 签发"
  - "认证失败统一返回 AUTH_INVALID_CREDENTIALS，不要枚举账号是否存在"

schemas:
  LoginInput:
    type: object
    properties:
      - { name: auth_type, schema: { ref: data.enums.auth_type }, required: true, description: "认证类型" }
      - { name: identifier, schema: { type: auth_identifier }, required: true, description: "登录标识" }
      - { name: password, schema: { type: string }, nullable: true, write_only: true, description: "密码；仅请求写入，不回显" }
      - { name: code, schema: { type: phone_code }, nullable: true, description: "手机号区号，例如 +86" }
      - { name: device_id, schema: { type: device_id }, nullable: true, description: "设备标识" }
    validation:
      - { rule: "input.auth_type != \"pwd\" || input.password != null", message: "密码认证必须提供密码" }
  BindPasswordInput:
    type: object
    properties:
      - { name: account_id, schema: { type: integer }, required: true, description: "账号 ID" }
      - { name: action, schema: { ref: data.enums.auth_password_action }, required: true, description: "认证绑定动作" }
      - { name: username, schema: { type: auth_username }, nullable: true, description: "用户名" }
      - { name: password, schema: { type: string }, nullable: true, write_only: true, description: "密码；仅请求写入，不回显" }
    validation:
      - { rule: "input.action != \"create\" && input.action != \"update\" || input.password != null", message: "创建或修改密码必须提供密码" }
  BindPhoneInput:
    type: object
    properties:
      - { name: account_id, schema: { type: integer }, required: true, description: "账号 ID" }
      - { name: action, schema: { ref: data.enums.auth_bind_action }, required: true, description: "认证绑定动作" }
      - { name: code, schema: { type: phone_code }, nullable: true, description: "手机号区号，例如 +86" }
      - { name: number, schema: { type: phone_number }, nullable: true, description: "手机号；只允许数字" }
    validation:
      - { rule: "input.action != \"create\" || input.number != null", message: "创建手机绑定必须提供手机号" }
  BindEmailInput:
    type: object
    properties:
      - { name: account_id, schema: { type: integer }, required: true, description: "账号 ID" }
      - { name: action, schema: { ref: data.enums.auth_bind_action }, required: true, description: "认证绑定动作" }
      - { name: username, schema: { type: email_username }, nullable: true, description: "用户名" }
      - { name: domain, schema: { type: email_domain }, nullable: true, description: "邮箱域名" }
    validation:
      - { rule: "input.action != \"create\" || input.username != null && input.domain != null", message: "创建邮箱绑定必须提供用户名和域名" }
  AuthBinding:
    type: object
    properties:
      - { name: auth_type, schema: { ref: data.enums.auth_type }, required: true, description: "认证类型" }
      - { name: auth_id, schema: { type: integer }, required: true, description: "认证绑定 ID" }
      - { name: account_id, schema: { type: integer }, required: true, description: "账号 ID" }
      - { name: status, schema: { ref: data.enums.auth_status }, required: true, description: "认证绑定状态" }
      - { name: masked_target, schema: { type: string }, description: "脱敏后的接收目标" }
  AuthSession:
    type: object
    properties:
      - { name: account, schema: { ref: data.entities.account }, required: true, description: "账号实体" }
      - { name: tokens, schema: { ref: TokenPair }, required: true, description: "令牌对" }

services:
  - name: login
    summary: "登录：校验认证绑定，签发令牌"
    visibility: public
    transaction: required
    params:
      - { name: ctx, type: context.Context }
      - { name: input, type: LoginInput }
    returns:
      - { name: session, type: AuthSession }
      - { name: err, type: error }
    steps:
      - { id: begin, kind: tx_begin, summary: "开启写事务" }
      - id: split_identifier
        kind: logic
        summary: "把登录标识拆成邮箱用户名与域名"
        input:
          - { name: identifier, value: params.input.identifier, description: "登录标识：用户名、手机号或邮箱" }
        output:
          - { name: username, type: string, description: "邮箱本地部分；非邮箱登录时为空" }
          - { name: domain, type: string, description: "邮箱域名；非邮箱登录时为空" }
        errors: [ ]
      - id: load
        kind: logic
        summary: "按 auth_type 读取认证绑定并解析账号"
        input:
          - { name: auth_type, value: params.input.auth_type, description: "决定读取密码/手机/邮箱哪一种绑定" }
          - { name: identifier, value: params.input.identifier, description: "登录标识：用户名、手机号或邮箱" }
          - { name: code, value: params.input.code, description: "手机号区号" }
        output:
          - { name: account_id, type: integer, description: "命中的账号 ID" }
          - { name: auth_id, type: integer, description: "命中的认证绑定 ID" }
          - { name: auth_pwd_id, type: integer, description: "密码绑定 ID" }
        errors:
          - platform.errors.AUTH_INVALID_CREDENTIALS
        queries:
          - query: data.queries.auth.get_auth_pwd_by_username
            input:
              - { name: username, value: params.input.identifier, description: "用户名" }
          - query: data.queries.auth.get_auth_phone_by_number
            input:
              - { name: code, value: params.input.code, description: "手机号区号" }
              - { name: number, value: params.input.identifier, description: "手机号" }
          - query: data.queries.auth.get_auth_email_by_username_domain
            input:
              - { name: username, value: step.split_identifier.username, description: "用户名" }
              - { name: domain, value: step.split_identifier.domain, description: "邮箱域名" }
      - id: load_account
        kind: query
        summary: "加载登录账号"
        queries:
          - query: data.queries.account.get_account
            input:
              - { name: id, value: step.load.account_id, description: "认证绑定命中的账号 ID" }
      - id: check
        kind: logic
        summary: "校验凭据、锁定与账号状态，签发令牌"
        depends_on: [ load_account ]
        input:
          - { name: account, value: step.load_account.account, description: "load_account 读到的账号" }
          - { name: auth_id, value: step.load.auth_id, description: "命中的认证绑定 ID" }
          - { name: auth_pwd_id, value: step.load.auth_pwd_id, description: "密码绑定 ID；手机/邮箱认证时为空" }
        output:
          - { name: session, type: AuthSession, description: "登录会话" }
          - { name: success, type: boolean, description: "登录是否成功" }
          - { name: auth_pwd_id, type: integer, description: "密码绑定 ID" }
        errors:
          - platform.errors.AUTH_INVALID_CREDENTIALS
          - platform.errors.AUTH_LOCKED
          - platform.errors.ACCOUNT_SUSPENDED
          - platform.errors.COMMON_FORBIDDEN
        rules:
          - "feature.rules.auth.auth_login_requires_verified"
      - id: lock_until
        kind: logic
        summary: "计算失败锁定的截止时间"
        output:
          - { name: lock_until, type: timestamp, description: "锁定截止时间" }
        errors: [ ]
      - id: record
        kind: logic
        summary: "记录登录结果；按 success 选择成功或失败记录"
        input:
          - { name: success, value: step.check.success, description: "根据 success 选择成功/失败记录" }
          - { name: auth_pwd_id, value: step.check.auth_pwd_id, description: "写登录记录时使用的密码绑定 ID" }
        output: [ ]
        errors: [ ]
        queries:
          - query: data.queries.auth.record_auth_pwd_login_success
            input:
              - { name: id, value: step.check.auth_pwd_id, description: "认证绑定 ID" }
          - query: data.queries.auth.record_auth_pwd_login_failure
            input:
              - { name: id, value: step.check.auth_pwd_id, description: "认证绑定 ID" }
              - { name: lock_until, value: step.lock_until.lock_until, description: "锁定截止时间" }
        events:
          - cap.events.account.login_succeeded
          - cap.events.account.login_failed
      - { id: commit, kind: tx_commit, summary: "提交写事务" }

  - name: bind_password
    summary: "创建、修改或启停密码认证绑定"
    visibility: public
    transaction: none
    params:
      - { name: ctx, type: context.Context }
      - { name: input, type: BindPasswordInput }
    returns:
      - { name: binding, type: AuthBinding }
      - { name: err, type: error }
    steps:
      - id: resolve
        kind: logic
        summary: "按 action 定位目标密码绑定：create 生成新 ID，update/enable/disable 使用现有绑定"
        input:
          - { name: action, value: params.input.action, description: "绑定动作" }
          - { name: account_id, value: params.input.account_id, description: "账号 ID" }
          - { name: username, value: params.input.username, description: "用户名；用于定位现有绑定" }
        output:
          - { name: binding_id, type: integer, description: "目标密码绑定 ID" }
        errors: [ ]
      - id: bind_status
        kind: logic
        summary: "把 action 映射为认证绑定状态"
        input:
          - { name: action, value: params.input.action, description: "绑定动作" }
        output:
          - { name: status, type: data.enums.auth_status, description: "目标绑定状态" }
        errors: [ ]
      - id: hash_password
        kind: logic
        summary: "对明文密码做哈希"
        input:
          - { name: password, value: params.input.password, description: "明文密码" }
        output:
          - { name: password_hash, type: string, description: "密码哈希" }
        errors: [ ]
      - id: create_bind
        kind: logic
        summary: "创建密码绑定；创建即 verified"
        output:
          - { name: binding, type: AuthBinding, description: "认证绑定" }
        errors:
          - platform.errors.AUTH_USERNAME_TAKEN
          - platform.errors.AUTH_INVALID_CREDENTIALS
          - platform.errors.COMMON_FORBIDDEN
        queries:
          - query: data.queries.auth.create_auth_pwd
            input:
              - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
              - { name: account_id, value: params.input.account_id, description: "账号 ID" }
              - { name: status, value: step.bind_status.status, description: "绑定状态码" }
              - { name: username, value: params.input.username, description: "用户名" }
              - { name: password_hash, value: step.hash_password.password_hash, description: "密码哈希" }
        lifecycle: [ cap.lifecycles.auth_pwd.create ]
        state:
          write:
            status: verified
            queries: [ data.queries.auth.create_auth_pwd ]
      - id: update_bind
        kind: logic
        summary: "修改密码哈希；不改变认证状态"
        output:
          - { name: binding, type: AuthBinding, description: "认证绑定" }
        errors:
          - platform.errors.AUTH_INVALID_CREDENTIALS
          - platform.errors.COMMON_FORBIDDEN
        queries:
          - query: data.queries.auth.update_auth_pwd_hash
            input:
              - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
              - { name: password_hash, value: step.hash_password.password_hash, description: "密码哈希" }
      - id: enable_bind
        kind: transition
        summary: "启用密码绑定"
        output:
          - { name: binding, type: AuthBinding, description: "认证绑定" }
        errors:
          - platform.errors.AUTH_INVALID_CREDENTIALS
          - platform.errors.COMMON_FORBIDDEN
        queries:
          - query: data.queries.auth.set_auth_pwd_status
            input:
              - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
              - { name: status, value: step.bind_status.status, description: "绑定状态码" }
        lifecycle: [ cap.lifecycles.auth_pwd.enable ]
        state:
          write:
            status: verified
            queries: [ data.queries.auth.set_auth_pwd_status ]
      - id: disable_bind
        kind: transition
        summary: "停用密码绑定"
        output:
          - { name: binding, type: AuthBinding, description: "认证绑定" }
        errors:
          - platform.errors.AUTH_INVALID_CREDENTIALS
          - platform.errors.COMMON_FORBIDDEN
        queries:
          - query: data.queries.auth.set_auth_pwd_status
            input:
              - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
              - { name: status, value: step.bind_status.status, description: "绑定状态码" }
        lifecycle: [ cap.lifecycles.auth_pwd.disable ]
        state:
          write:
            status: disabled
            queries: [ data.queries.auth.set_auth_pwd_status ]

  - name: bind_phone
    summary: "创建或启停手机号认证绑定"
    visibility: public
    transaction: none
    params:
      - { name: ctx, type: context.Context }
      - { name: input, type: BindPhoneInput }
    returns:
      - { name: binding, type: AuthBinding }
      - { name: err, type: error }
    steps:
      - id: resolve
        kind: logic
        summary: "按 action 定位目标手机绑定：create 生成新 ID，enable/disable 使用现有绑定"
        input:
          - { name: action, value: params.input.action, description: "绑定动作" }
          - { name: account_id, value: params.input.account_id, description: "账号 ID" }
          - { name: number, value: params.input.number, description: "手机号；用于定位现有绑定" }
        output:
          - { name: binding_id, type: integer, description: "目标手机绑定 ID" }
        errors: [ ]
      - id: bind_status
        kind: logic
        summary: "把 action 映射为认证绑定状态"
        input:
          - { name: action, value: params.input.action, description: "绑定动作" }
        output:
          - { name: status, type: data.enums.auth_status, description: "目标绑定状态" }
        errors: [ ]
      - id: request_operator
        kind: logic
        summary: "读取当前操作者标识"
        output:
          - { name: operator, type: string, description: "操作者标识" }
        errors: [ ]
      - id: create_bind
        kind: logic
        summary: "创建手机号绑定；创建后为 unverified"
        output:
          - { name: binding, type: AuthBinding, description: "认证绑定" }
        errors:
          - platform.errors.AUTH_PHONE_TAKEN
          - platform.errors.AUTH_PHONE_INVALID
          - platform.errors.COMMON_FORBIDDEN
        queries:
          - query: data.queries.auth.create_auth_phone
            input:
              - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
              - { name: account_id, value: params.input.account_id, description: "账号 ID" }
              - { name: status, value: step.bind_status.status, description: "绑定状态码" }
              - { name: code, value: params.input.code, description: "手机号区号" }
              - { name: number, value: params.input.number, description: "手机号" }
              - { name: operator, value: step.request_operator.operator, description: "操作者标识" }
        lifecycle: [ cap.lifecycles.auth_contact.create ]
        state:
          write:
            status: unverified
            queries: [ data.queries.auth.create_auth_phone ]
      - id: enable_bind
        kind: transition
        summary: "启用手机号绑定"
        output:
          - { name: binding, type: AuthBinding, description: "认证绑定" }
        errors:
          - platform.errors.AUTH_PHONE_INVALID
          - platform.errors.COMMON_FORBIDDEN
        queries:
          - query: data.queries.auth.set_auth_phone_status
            input:
              - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
              - { name: status, value: step.bind_status.status, description: "绑定状态码" }
        lifecycle: [ cap.lifecycles.auth_contact.enable ]
        state:
          write:
            status: verified
            queries: [ data.queries.auth.set_auth_phone_status ]
      - id: disable_bind
        kind: transition
        summary: "停用手机号绑定"
        output:
          - { name: binding, type: AuthBinding, description: "认证绑定" }
        errors:
          - platform.errors.AUTH_PHONE_INVALID
          - platform.errors.COMMON_FORBIDDEN
        queries:
          - query: data.queries.auth.set_auth_phone_status
            input:
              - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
              - { name: status, value: step.bind_status.status, description: "绑定状态码" }
        lifecycle: [ cap.lifecycles.auth_contact.disable ]
        state:
          write:
            status: disabled
            queries: [ data.queries.auth.set_auth_phone_status ]

  - name: bind_email
    summary: "创建或启停邮箱认证绑定"
    visibility: public
    transaction: none
    params:
      - { name: ctx, type: context.Context }
      - { name: input, type: BindEmailInput }
    returns:
      - { name: binding, type: AuthBinding }
      - { name: err, type: error }
    steps:
      - id: resolve
        kind: logic
        summary: "按 action 定位目标邮箱绑定：create 生成新 ID，enable/disable 使用现有绑定"
        input:
          - { name: action, value: params.input.action, description: "绑定动作" }
          - { name: account_id, value: params.input.account_id, description: "账号 ID" }
          - { name: username, value: params.input.username, description: "用户名；用于定位现有绑定" }
          - { name: domain, value: params.input.domain, description: "邮箱域名；用于定位现有绑定" }
        output:
          - { name: binding_id, type: integer, description: "目标邮箱绑定 ID" }
        errors: [ ]
      - id: bind_status
        kind: logic
        summary: "把 action 映射为认证绑定状态"
        input:
          - { name: action, value: params.input.action, description: "绑定动作" }
        output:
          - { name: status, type: data.enums.auth_status, description: "目标绑定状态" }
        errors: [ ]
      - id: email_parts
        kind: logic
        summary: "把邮箱域名拆成域名主体与顶级域"
        input:
          - { name: domain, value: params.input.domain, description: "邮箱域名" }
        output:
          - { name: entity, type: string, description: "域名主体" }
          - { name: tld, type: string, description: "顶级域" }
        errors: [ ]
      - id: create_bind
        kind: logic
        summary: "创建邮箱绑定；创建后为 unverified"
        output:
          - { name: binding, type: AuthBinding, description: "认证绑定" }
        errors:
          - platform.errors.AUTH_EMAIL_TAKEN
          - platform.errors.AUTH_EMAIL_INVALID
          - platform.errors.COMMON_FORBIDDEN
        queries:
          - query: data.queries.auth.create_auth_email
            input:
              - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
              - { name: account_id, value: params.input.account_id, description: "账号 ID" }
              - { name: status, value: step.bind_status.status, description: "绑定状态码" }
              - { name: username, value: params.input.username, description: "用户名" }
              - { name: domain, value: params.input.domain, description: "邮箱域名" }
              - { name: entity, value: step.email_parts.entity, description: "域名主体" }
              - { name: tld, value: step.email_parts.tld, description: "顶级域" }
        lifecycle: [ cap.lifecycles.auth_contact.create ]
        state:
          write:
            status: unverified
            queries: [ data.queries.auth.create_auth_email ]
      - id: enable_bind
        kind: transition
        summary: "启用邮箱绑定"
        output:
          - { name: binding, type: AuthBinding, description: "认证绑定" }
        errors:
          - platform.errors.AUTH_EMAIL_INVALID
          - platform.errors.COMMON_FORBIDDEN
        queries:
          - query: data.queries.auth.set_auth_email_status
            input:
              - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
              - { name: status, value: step.bind_status.status, description: "绑定状态码" }
        lifecycle: [ cap.lifecycles.auth_contact.enable ]
        state:
          write:
            status: verified
            queries: [ data.queries.auth.set_auth_email_status ]
      - id: disable_bind
        kind: transition
        summary: "停用邮箱绑定"
        output:
          - { name: binding, type: AuthBinding, description: "认证绑定" }
        errors:
          - platform.errors.AUTH_EMAIL_INVALID
          - platform.errors.COMMON_FORBIDDEN
        queries:
          - query: data.queries.auth.set_auth_email_status
            input:
              - { name: id, value: step.resolve.binding_id, description: "认证绑定 ID" }
              - { name: status, value: step.bind_status.status, description: "绑定状态码" }
        lifecycle: [ cap.lifecycles.auth_contact.disable ]
        state:
          write:
            status: disabled
            queries: [ data.queries.auth.set_auth_email_status ]

  - name: revoke_all_for_account
    summary: "软删账号的认证绑定，并编排令牌吊销与验证体作废"
    visibility: public
    transaction: none
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: integer }
    returns:
      - { name: err, type: error }
    steps:
      - id: revoke_bindings
        kind: logic
        summary: "软删账号的密码/手机/邮箱认证绑定"
        output: [ ]
        errors:
          - platform.errors.COMMON_INTERNAL
        queries:
          - query: data.queries.auth.soft_delete_auth_pwd_by_account
            input:
              - { name: account_id, value: params.account_id, description: "账号 ID" }
          - query: data.queries.auth.soft_delete_auth_phone_by_account
            input:
              - { name: account_id, value: params.account_id, description: "账号 ID" }
          - query: data.queries.auth.soft_delete_auth_email_by_account
            input:
              - { name: account_id, value: params.account_id, description: "账号 ID" }
        lifecycle: [ cap.lifecycles.auth_pwd.destroy, cap.lifecycles.auth_contact.destroy ]
      - id: revoke_tokens
        kind: service
        summary: "吊销账号全部令牌"
        depends_on: [ revoke_bindings ]
        errors:
          - platform.errors.COMMON_INTERNAL
        services:
