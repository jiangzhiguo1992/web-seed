id: cap.services.token
summary: "令牌服务：签发、刷新、吊销与校验"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "token 只存 hash；原文只通过 issue 返回 TokenPair 暴露"
  - "verify 只校验 access token；refresh token 只在 refresh/logout 中使用"

schemas:
  TokenPair:
    type: object
    properties:
      - { name: access_token, schema: { type: string }, required: true, read_only: true, description: "访问令牌" }
      - { name: refresh_token, schema: { type: string }, required: true, read_only: true, description: "刷新令牌" }
      - { name: access_expire_at, schema: { type: timestamp }, required: true, description: "访问令牌过期时间" }
      - { name: refresh_expire_at, schema: { type: timestamp }, required: true, description: "刷新令牌过期时间" }
      - { name: token_type, schema: { type: token_type }, description: "令牌类型；固定 Bearer" }
services:
  - name: issue
    summary: "为账号签发 access + refresh 令牌对"
    visibility: public
    transaction: none
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: integer }
      - { name: device_id, type: string, nullable: true }
    returns:
      - { name: tokens, type: TokenPair }
      - { name: err, type: error }
    steps:
      - id: load_account
        kind: query
        summary: "读取令牌归属账号"
        queries:
          - query: data.queries.account.get_account
            input:
              - {name: id, value: params.account_id, description: "待签发令牌的账号 ID"}
      - id: issue
        kind: logic
        summary: "生成令牌对，哈希后持久化 refresh token"
        depends_on: [ load_account ]
        errors:
          - platform.errors.COMMON_INTERNAL
        input:
          - { name: account, value: step.load_account.account, description: "令牌归属账号，用于写入 own_type/own_id" }
        output:
          - {name: tokens, type: TokenPair, description: "新签发的令牌对"}
        queries:
          - query: data.queries.token.create_token
            input:
              - {name: id, value: "expr: new_id()", description: "新令牌 ID"}
              - {name: own_type, value: step.load_account.account.own_type, description: "令牌归属主体类型"}
              - {name: own_id, value: step.load_account.account.own_id, description: "令牌归属主体 ID"}
              - {name: account_id, value: params.account_id, description: "令牌归属账号 ID"}
              - {name: device_id, value: params.device_id, description: "签发设备标识"}
              - {name: user_id, value: step.load_account.account.user_id, description: "令牌关联用户 ID"}
              - {name: access_token_hash, value: "expr: hash_token(access_token)", description: "访问令牌哈希"}
              - {name: refresh_token_hash, value: "expr: hash_token(refresh_token)", description: "刷新令牌哈希"}
              - {name: access_expire_at, value: "expr: access_expire_at()", description: "访问令牌过期时间"}
              - {name: refresh_expire_at, value: "expr: refresh_expire_at()", description: "刷新令牌过期时间"}

  - name: refresh
    summary: "用刷新令牌换取新令牌对"
    visibility: public
    transaction: required
    params:
      - { name: ctx, type: context.Context }
      - { name: refresh_token, type: string }
    returns:
      - { name: tokens, type: TokenPair }
      - { name: err, type: error }
    steps:
      - id: load_old
        kind: query
        summary: "按刷新令牌读取旧令牌"
        queries:
          - query: data.queries.token.get_token_by_refresh
            input:
              - {name: refresh_token_hash, value: "expr: hash_token(params.refresh_token)", description: "待换新的刷新令牌哈希"}
      - id: refresh
        kind: logic
        summary: "校验 refresh token，作废旧令牌并签发新令牌对"
        depends_on: [ load_old ]
        errors:
          - platform.errors.AUTH_TOKEN_INVALID
          - platform.errors.AUTH_TOKEN_EXPIRED
        input:
          - { name: refresh_token, value: params.refresh_token, description: "待换新的刷新令牌" }
          - { name: old_token, value: step.load_old.row, description: "旧令牌行，用于作废与继承 own_type/own_id" }
        output:
          - {name: tokens, type: TokenPair, description: "换新后的令牌对"}
        queries:
          - query: data.queries.token.create_token
            input:
              - {name: id, value: "expr: new_id()", description: "新令牌 ID"}
              - {name: own_type, value: step.load_old.row.own_type, description: "继承的归属主体类型"}
              - {name: own_id, value: step.load_old.row.own_id, description: "继承的归属主体 ID"}
              - {name: account_id, value: step.load_old.row.account_id, description: "继承的账号 ID"}
              - {name: device_id, value: step.load_old.row.device_id, description: "继承的设备标识"}
              - {name: user_id, value: step.load_old.row.user_id, description: "继承的用户 ID"}
              - {name: access_token_hash, value: "expr: hash_token(access_token)", description: "访问令牌哈希"}
              - {name: refresh_token_hash, value: "expr: hash_token(refresh_token)", description: "刷新令牌哈希"}
              - {name: access_expire_at, value: "expr: access_expire_at()", description: "访问令牌过期时间"}
              - {name: refresh_expire_at, value: "expr: refresh_expire_at()", description: "刷新令牌过期时间"}
          - query: data.queries.token.revoke_token
            input:
              - {name: refresh_token_hash, value: "expr: hash_token(params.refresh_token)", description: "待作废的旧刷新令牌哈希"}
              - {name: revoked_at, value: "expr: now()", description: "旧令牌作废时间"}
              - {name: revoke_reason, value: "expr: token_revoke_reason('rotated')", description: "旧令牌作废原因：rotated"}

  - name: logout
    summary: "吊销刷新令牌"
    visibility: public
    transaction: required
    params:
      - { name: ctx, type: context.Context }
      - { name: refresh_token, type: string }
    returns:
      - { name: err, type: error }
    steps:
      - id: logout
        kind: logic
        summary: "校验并吊销 refresh token"
        errors:
          - platform.errors.AUTH_TOKEN_INVALID
        input:
          - { name: refresh_token, value: params.refresh_token, description: "要吊销的刷新令牌" }
        output: [ ]
        queries:
          - query: data.queries.token.get_token_by_refresh
            input:
              - {name: refresh_token_hash, value: "expr: hash_token(params.refresh_token)", description: "待吊销的刷新令牌哈希"}
          - query: data.queries.token.revoke_token
            input:
              - {name: refresh_token_hash, value: "expr: hash_token(params.refresh_token)", description: "待吊销的刷新令牌哈希"}
              - {name: revoked_at, value: "expr: now()", description: "吊销时间"}
              - {name: revoke_reason, value: "expr: token_revoke_reason('logout')", description: "吊销原因：logout"}

  - name: revoke_by_account
    summary: "吊销账号的全部令牌"
    visibility: public
    transaction: none
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: integer }
    returns:
      - { name: err, type: error }
    steps:
      - id: revoke
        kind: logic
        summary: "吊销账号全部有效令牌"
        errors:
          - platform.errors.COMMON_INTERNAL
        output: [ ]
        queries:
          - query: data.queries.token.revoke_tokens_by_account
            input:
              - {name: account_id, value: params.account_id, description: "被吊销令牌的账号 ID"}
              - {name: revoked_at, value: "expr: now()", description: "吊销时间"}
              - {name: revoke_reason, value: "expr: token_revoke_reason('account_revoked')", description: "吊销原因：account_revoked"}

  - name: verify
    summary: "校验访问令牌并返回账号"
    visibility: public
    transaction: read_only
    params:
      - { name: ctx, type: context.Context }
      - { name: access_token, type: string }
    returns:
      - { name: account, type: data.entities.account }
      - { name: err, type: error }
    steps:
      - id: load_token
        kind: query
        summary: "按访问令牌读取令牌"
        queries:
          - query: data.queries.token.get_token_by_access
            input:
              - {name: access_token_hash, value: "expr: hash_token(params.access_token)", description: "待校验的访问令牌哈希"}
      - id: verify
        kind: logic
        summary: "校验 access token 并加载账号"
        depends_on: [ load_token ]
        errors:
          - platform.errors.AUTH_TOKEN_INVALID
          - platform.errors.AUTH_TOKEN_EXPIRED
        input:
          - { name: access_token, value: params.access_token, description: "待校验的访问令牌" }
          - { name: token, value: step.load_token.row, description: "令牌行，用于校验过期与吊销状态" }
        output:
          - {name: account, type: data.entities.account, description: "令牌归属账号"}
        queries:
          - query: data.queries.account.get_account
            input:
              - {name: id, value: step.load_token.row.account_id, description: "令牌归属账号 ID"}

  - name: purge_expired
    summary: "清理已过期令牌"
    visibility: internal
    transaction: none
    params:
      - { name: ctx, type: context.Context }
    returns:
      - { name: affected_rows, type: integer }
      - { name: err, type: error }
    steps:
      - id: purge
        kind: logic
        summary: "删除过期令牌"
        errors:
          - platform.errors.COMMON_INTERNAL
        output:
          - { name: affected_rows, type: integer, description: "影响行数" }
        queries:
          - query: data.queries.token.delete_expired_tokens
            input:
              - {name: limit, value: "expr: batch_limit()", description: "单批删除上限"}
