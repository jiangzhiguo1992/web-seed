id: cap.services.token
summary: "令牌服务：签发、刷新、吊销与校验"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "token 只存 hash；令牌原文只通过 issue/refresh 的返回值暴露，HTTP 层只把 refresh token 写入 HttpOnly cookie"
  - "verify 只校验 access token；refresh token 只在 refresh/logout 中使用"

schemas:
  TokenPair:
    type: _types.object
    properties:
      - { name: access_token, schema: { type: _types.string }, required: true, read_only: true, description: "访问令牌" }
      - { name: refresh_token, schema: { type: _types.string }, required: true, read_only: true, description: "刷新令牌" }
      - { name: access_expire_at, schema: { type: _types.timestamp }, required: true, description: "访问令牌过期时间" }
      - { name: refresh_expire_at, schema: { type: _types.timestamp }, required: true, description: "刷新令牌过期时间" }
      - { name: token_type, schema: { type: _types.token_type }, description: "令牌类型；固定 Bearer" }
  AccessToken:
    type: _types.object
    properties:
      - { name: access_token, schema: { type: _types.string }, required: true, read_only: true, description: "访问令牌" }
      - { name: access_expire_at, schema: { type: _types.timestamp }, required: true, description: "访问令牌过期时间" }
      - { name: token_type, schema: { type: _types.token_type }, description: "令牌类型；固定 Bearer" }
  RefreshToken:
    type: _types.object
    properties:
      - { name: refresh_token, schema: { type: _types.string }, required: true, read_only: true, description: "刷新令牌；只写 HttpOnly cookie，不进入响应体" }
      - { name: refresh_expire_at, schema: { type: _types.timestamp }, required: true, description: "刷新令牌过期时间" }

services:
  - name: issue
    summary: "为账号签发 access + refresh 令牌对"
    visibility: public
    tx_mode: none
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: _types.integer }
      - { name: device_id, type: _types.string, nullable: true }
    returns:
      - { name: tokens, type: cap.services.token.schemas.TokenPair, value: step.issue_tokens.tokens }
      - { name: err, type: error }
    steps:
      - id: load_account
        kind: query
        summary: "读取令牌归属账号"
        input:
          - { name: id, value: params.account_id, description: "待签发令牌的账号 ID" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.get_account
        goto: check_account
      - id: check_account
        kind: logic
        summary: "校验账号可签发令牌"
        input:
          - { name: account, value: step.load_account.account, description: "令牌归属账号" }
        output: [ ]
        errors:
          - platform.errors.AUTH_TOKEN_INVALID
        rules:
          - { rule: feature.rules.auth.auth_token_requires_active_account }
        goto: issue_tokens
      - id: issue_tokens
        kind: logic
        summary: "生成 access/refresh 令牌对与过期时间"
        input: [ ]
        output:
          - { name: tokens, type: cap.services.token.schemas.TokenPair, description: "新签发的令牌对" }
        errors: [ ]
        rules: [ ]
        goto: hash_tokens
      - id: hash_tokens
        kind: logic
        summary: "计算访问令牌与刷新令牌的哈希"
        input:
          - { name: access_token, value: step.issue_tokens.tokens.access_token, description: "新访问令牌" }
          - { name: refresh_token, value: step.issue_tokens.tokens.refresh_token, description: "新刷新令牌" }
        output:
          - { name: access_token_hash, type: _types.string, description: "访问令牌哈希" }
          - { name: refresh_token_hash, type: _types.string, description: "刷新令牌哈希" }
        errors: [ ]
        rules: [ ]
        goto: new_id
      - id: new_id
        kind: logic
        summary: "生成新令牌 ID"
        input: [ ]
        output:
          - { name: id, type: _types.integer, description: "新令牌 ID" }
        errors: [ ]
        rules: [ ]
        goto: create_token
      - id: create_token
        kind: query
        summary: "调用 data.queries.token.create_token"
        lifecycles: [ cap.lifecycles.token.create ]
        input:
          - { name: id, value: step.new_id.id, description: "新令牌 ID" }
          - { name: account_id, value: params.account_id, description: "令牌归属账号 ID" }
          - { name: user_id, value: step.load_account.account.user_id, description: "令牌关联用户 ID" }
          - { name: device_id, value: params.device_id, description: "签发设备标识" }
          - { name: access_token_hash, value: step.hash_tokens.access_token_hash, description: "访问令牌哈希" }
          - { name: refresh_token_hash, value: step.hash_tokens.refresh_token_hash, description: "刷新令牌哈希" }
          - { name: access_expire_at, value: step.issue_tokens.tokens.access_expire_at, description: "访问令牌过期时间" }
          - { name: refresh_expire_at, value: step.issue_tokens.tokens.refresh_expire_at, description: "刷新令牌过期时间" }
        output: [ ]
        query: data.queries.token.create_token
        goto: now
      - id: now
        kind: logic
        summary: "取当前时间作为签发时间"
        input: [ ]
        output:
          - { name: issued_at, type: _types.timestamp, description: "签发时间" }
        errors: [ ]
        rules: [ ]
        goto: emit_issued
      - id: emit_issued
        kind: events
        summary: "发出令牌签发事件"
        input:
          - { name: token_id, value: step.new_id.id, description: "令牌 ID" }
          - { name: account_id, value: params.account_id, description: "账号 ID" }
          - { name: account, value: step.load_account.account, description: "账号实体" }
          - { name: issued_at, value: step.now.issued_at, description: "签发时间" }
        output: [ ]
        events:
          - ref: cap.events.token.issued
        goto: $end
    used_by:
      - cap.services.auth.login

  - name: refresh
    summary: "用刷新令牌换取新令牌对"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: refresh_token, type: _types.string }
    returns:
      - { name: access, type: cap.services.token.schemas.AccessToken, value: step.split_tokens.access }
      - { name: refresh, type: cap.services.token.schemas.RefreshToken, value: step.split_tokens.refresh }
      - { name: err, type: error }
    steps:
      - id: hash_old
        kind: logic
        summary: "计算旧刷新令牌的哈希"
        input:
          - { name: refresh_token, value: params.refresh_token, description: "待换新的刷新令牌" }
        output:
          - { name: refresh_token_hash, type: _types.string, description: "旧刷新令牌哈希" }
        errors: [ ]
        rules: [ ]
        goto: load_old
      - id: load_old
        kind: query
        summary: "按刷新令牌读取旧令牌"
        input:
          - { name: refresh_token_hash, value: step.hash_old.refresh_token_hash, description: "待换新的刷新令牌哈希" }
        output:
          - { name: row, type: data.entities.token, description: "query 返回的 row" }
        query: data.queries.token.get_token_by_refresh
        goto: load_account
      - id: load_account
        kind: query
        summary: "读取旧令牌归属账号"
        input:
          - { name: id, value: step.load_old.row.account_id, description: "旧令牌归属账号 ID" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.get_account
        goto: check_account
      - id: check_account
        kind: logic
        summary: "校验账号可刷新令牌"
        input:
          - { name: account, value: step.load_account.account, description: "旧令牌归属账号" }
        output: [ ]
        errors:
          - platform.errors.AUTH_TOKEN_INVALID
        rules:
          - { rule: feature.rules.auth.auth_token_requires_active_account }
        goto: validate
      - id: validate
        kind: logic
        summary: "校验旧刷新令牌的过期与吊销状态"
        input:
          - { name: refresh_token, value: params.refresh_token, description: "待换新的刷新令牌" }
          - { name: old_token, value: step.load_old.row, description: "旧令牌行" }
        output: [ ]
        errors:
          - platform.errors.AUTH_TOKEN_INVALID
          - platform.errors.AUTH_TOKEN_EXPIRED
        rules: [ ]
        goto: issue_tokens
      - id: issue_tokens
        kind: logic
        summary: "生成新的 access/refresh 令牌对与过期时间"
        input: [ ]
        output:
          - { name: tokens, type: cap.services.token.schemas.TokenPair, description: "换新后的令牌对" }
        errors: [ ]
        rules: [ ]
        goto: split_tokens
      - id: split_tokens
        kind: logic
        summary: "拆分新的访问令牌与刷新令牌"
        input:
          - { name: tokens, value: step.issue_tokens.tokens, description: "换新后的令牌对" }
        output:
          - { name: access, type: cap.services.token.schemas.AccessToken, description: "新的访问令牌" }
          - { name: refresh, type: cap.services.token.schemas.RefreshToken, description: "新的刷新令牌" }
        errors: [ ]
        rules: [ ]
        goto: hash_new
      - id: hash_new
        kind: logic
        summary: "计算新访问令牌与新刷新令牌的哈希"
        input:
          - { name: access_token, value: step.split_tokens.access.access_token, description: "新访问令牌" }
          - { name: refresh_token, value: step.split_tokens.refresh.refresh_token, description: "新刷新令牌" }
        output:
          - { name: access_token_hash, type: _types.string, description: "新访问令牌哈希" }
          - { name: refresh_token_hash, type: _types.string, description: "新刷新令牌哈希" }
        errors: [ ]
        rules: [ ]
        goto: new_id
      - id: new_id
        kind: logic
        summary: "生成新令牌 ID"
        input: [ ]
        output:
          - { name: id, type: _types.integer, description: "新令牌 ID" }
        errors: [ ]
        rules: [ ]
        goto: now
      - id: now
        kind: logic
        summary: "取当前时间作为旧令牌作废时间"
        input: [ ]
        output:
          - { name: revoked_at, type: _types.timestamp, description: "旧令牌作废时间" }
        errors: [ ]
        rules: [ ]
        goto: reason
      - id: reason
        kind: logic
        summary: "构造令牌作废原因：rotated"
        input: [ ]
        output:
          - { name: revoke_reason, type: data.enums.token_revoke_reason, description: "作废原因：正常轮换" }
        errors: [ ]
        rules: [ ]
        goto: create_token
      - id: create_token
        kind: query
        summary: "调用 data.queries.token.create_token"
        lifecycles: [ cap.lifecycles.token.create ]
        input:
          - { name: id, value: step.new_id.id, description: "新令牌 ID" }
          - { name: account_id, value: step.load_old.row.account_id, description: "继承的账号 ID" }
          - { name: user_id, value: step.load_old.row.user_id, description: "继承的用户 ID" }
          - { name: device_id, value: step.load_old.row.device_id, description: "继承的设备标识" }
          - { name: access_token_hash, value: step.hash_new.access_token_hash, description: "新访问令牌哈希" }
          - { name: refresh_token_hash, value: step.hash_new.refresh_token_hash, description: "新刷新令牌哈希" }
          - { name: access_expire_at, value: step.split_tokens.access.access_expire_at, description: "访问令牌过期时间" }
          - { name: refresh_expire_at, value: step.split_tokens.refresh.refresh_expire_at, description: "刷新令牌过期时间" }
        output: [ ]
        query: data.queries.token.create_token
        goto: revoke_token
      - id: revoke_token
        kind: query
        summary: "调用 data.queries.token.revoke_token"
        lifecycles: [ cap.lifecycles.token.transitions.revoke ]
        input:
          - { name: refresh_token_hash, value: step.hash_old.refresh_token_hash, description: "待作废的旧刷新令牌哈希" }
          - { name: revoked_at, value: step.now.revoked_at, description: "旧令牌作废时间" }
          - { name: revoke_reason, value: step.reason.revoke_reason, description: "旧令牌作废原因：rotated" }
          - { name: replaced_by_id, value: step.new_id.id, description: "替换旧令牌的新令牌 ID" }
        output: [ ]
        query: data.queries.token.revoke_token
        goto: $end
    used_by:
      - cap.protocols.http.auth.refresh

  - name: logout
    summary: "吊销刷新令牌"
    visibility: public
    tx_mode: required
    params:
      - { name: ctx, type: context.Context }
      - { name: refresh_token, type: _types.string }
    returns:
      - { name: err, type: error }
    steps:
      - id: hash
        kind: logic
        summary: "计算待吊销刷新令牌的哈希"
        input:
          - { name: refresh_token, value: params.refresh_token, description: "要吊销的刷新令牌" }
        output:
          - { name: refresh_token_hash, type: _types.string, description: "待吊销的刷新令牌哈希" }
        errors: [ ]
        rules: [ ]
        goto: now
      - id: now
        kind: logic
        summary: "取当前时间作为吊销时间"
        input: [ ]
        output:
          - { name: revoked_at, type: _types.timestamp, description: "吊销时间" }
        errors: [ ]
        rules: [ ]
        goto: reason
      - id: reason
        kind: logic
        summary: "构造令牌吊销原因：logout"
        input: [ ]
        output:
          - { name: revoke_reason, type: data.enums.token_revoke_reason, description: "吊销原因：登出" }
        errors: [ ]
        rules: [ ]
        goto: get_token_by_refresh
      - id: get_token_by_refresh
        kind: query
        summary: "调用 data.queries.token.get_token_by_refresh"
        input:
          - { name: refresh_token_hash, value: step.hash.refresh_token_hash, description: "待吊销的刷新令牌哈希" }
        output:
          - { name: row, type: data.entities.token, description: "query 返回的 row" }
        query: data.queries.token.get_token_by_refresh
        goto: validate
      - id: validate
        kind: logic
        summary: "校验刷新令牌存在且未吊销"
        input:
          - { name: token, value: step.get_token_by_refresh.row, description: "待吊销的令牌行" }
        output: [ ]
        errors:
          - platform.errors.AUTH_TOKEN_INVALID
        rules: [ ]
        goto: revoke_token
      - id: revoke_token
        kind: query
        summary: "调用 data.queries.token.revoke_token"
        lifecycles: [ cap.lifecycles.token.transitions.revoke ]
        input:
          - { name: refresh_token_hash, value: step.hash.refresh_token_hash, description: "待吊销的刷新令牌哈希" }
          - { name: revoked_at, value: step.now.revoked_at, description: "吊销时间" }
          - { name: revoke_reason, value: step.reason.revoke_reason, description: "吊销原因：logout" }
        output: [ ]
        query: data.queries.token.revoke_token
        goto: $end
    used_by:
      - cap.protocols.http.auth.logout

  - name: revoke_by_account
    summary: "吊销账号的全部令牌"
    visibility: public
    tx_mode: none
    params:
      - { name: ctx, type: context.Context }
      - { name: account_id, type: _types.integer }
    returns:
      - { name: err, type: error }
    steps:
      - id: now
        kind: logic
        summary: "取当前时间作为吊销时间"
        input: [ ]
        output:
          - { name: revoked_at, type: _types.timestamp, description: "吊销时间" }
        errors: [ ]
        rules: [ ]
        goto: reason
      - id: reason
        kind: logic
        summary: "构造令牌吊销原因：account_revoked"
        input: [ ]
        output:
          - { name: revoke_reason, type: data.enums.token_revoke_reason, description: "吊销原因：账号注销" }
        errors: [ ]
        rules: [ ]
        goto: revoke_tokens_by_account
      - id: revoke_tokens_by_account
        kind: query
        summary: "调用 data.queries.token.revoke_tokens_by_account"
        lifecycles: [ cap.lifecycles.token.transitions.revoke ]
        input:
          - { name: account_id, value: params.account_id, description: "被吊销令牌的账号 ID" }
          - { name: revoked_at, value: step.now.revoked_at, description: "吊销时间" }
          - { name: revoke_reason, value: step.reason.revoke_reason, description: "吊销原因：account_revoked" }
        output: [ ]
        errors:
          - platform.errors.COMMON_INTERNAL
        query: data.queries.token.revoke_tokens_by_account
        goto: $end
    used_by:
      - cap.events.token.revoke_account
      - cap.services.auth.revoke_all_for_account

  - name: expire
    summary: "把过期令牌置为 expired"
    visibility: internal
    tx_mode: none
    params:
      - { name: ctx, type: context.Context }
    returns:
      - { name: affected_rows, type: _types.integer, value: step.expire_tokens.affected_rows }
      - { name: err, type: error }
    steps:
      - id: now
        kind: logic
        summary: "取当前时间"
        input: [ ]
        output:
          - { name: now, type: _types.timestamp, description: "当前时间" }
        errors: [ ]
        rules: [ ]
        goto: status_expired
      - id: status_expired
        kind: logic
        summary: "构造令牌目标状态：已过期"
        input: [ ]
        output:
          - { name: status, type: data.enums.token_status, description: "目标状态：已过期" }
        errors: [ ]
        rules: [ ]
        goto: batch_limit
      - id: batch_limit
        kind: logic
        summary: "取单批更新上限"
        input: [ ]
        output:
          - { name: limit, type: _types.integer, description: "单批更新上限" }
        errors: [ ]
        rules: [ ]
        goto: expire_tokens
      - id: expire_tokens
        kind: query
        summary: "调用 data.queries.token.expire_tokens"
        lifecycles: [ cap.lifecycles.token.transitions.expire ]
        input:
          - { name: now, value: step.now.now, description: "当前时间" }
          - { name: status, value: step.status_expired.status, description: "目标状态：已过期" }
          - { name: limit, value: step.batch_limit.limit, description: "单批更新上限" }
        output:
          - { name: affected_rows, type: _types.integer, description: "query 返回的 affected_rows" }
        errors: [ ]
        query: data.queries.token.expire_tokens
        goto: $end
    used_by:
      - cap.events.token.expire_tokens

  - name: verify
    summary: "校验访问令牌并返回账号"
    visibility: public
    tx_mode: read_only
    params:
      - { name: ctx, type: context.Context }
      - { name: access_token, type: _types.string }
    returns:
      - { name: account, type: data.entities.account, value: step.verify.account }
      - { name: err, type: error }
    steps:
      - id: hash
        kind: logic
        summary: "计算待校验访问令牌的哈希"
        input:
          - { name: access_token, value: params.access_token, description: "待校验的访问令牌" }
        output:
          - { name: access_token_hash, type: _types.string, description: "待校验的访问令牌哈希" }
        errors: [ ]
        rules: [ ]
        goto: load_token
      - id: load_token
        kind: query
        summary: "按访问令牌读取令牌"
        input:
          - { name: access_token_hash, value: step.hash.access_token_hash, description: "待校验的访问令牌哈希" }
        output:
          - { name: row, type: data.entities.token, description: "query 返回的 row" }
        query: data.queries.token.get_token_by_access
        goto: get_account
      - id: get_account
        kind: query
        summary: "调用 data.queries.account.get_account"
        input:
          - { name: id, value: step.load_token.row.account_id, description: "令牌归属账号 ID" }
        output:
          - { name: account, type: data.entities.account, description: "query 返回的 account" }
        query: data.queries.account.get_account
        goto: verify
      - id: verify
        kind: logic
        summary: "校验 access token 并返回账号"
        input:
          - { name: access_token, value: params.access_token, description: "待校验的访问令牌" }
          - { name: token, value: step.load_token.row, description: "令牌行，用于校验过期与吊销状态" }
          - { name: account, value: step.get_account.account, description: "令牌归属账号" }
        output:
          - { name: account, type: data.entities.account, description: "令牌归属账号" }
        errors:
          - platform.errors.AUTH_TOKEN_INVALID
          - platform.errors.AUTH_TOKEN_EXPIRED
        rules:
          - { rule: feature.rules.auth.auth_token_requires_active_account }
        goto: $end
    used_by:
      - cap.protocols.http.auth.me

  - name: purge_expired
    summary: "清理已过期令牌"
    visibility: internal
    tx_mode: none
    params:
      - { name: ctx, type: context.Context }
    returns:
      - { name: affected_rows, type: _types.integer, value: step.delete_expired_tokens.affected_rows }
      - { name: err, type: error }
    steps:
      - id: batch_limit
        kind: logic
        summary: "取单批删除上限"
        input: [ ]
        output:
          - { name: limit, type: _types.integer, description: "单批删除上限" }
        errors: [ ]
        rules: [ ]
        goto: delete_expired_tokens
      - id: delete_expired_tokens
        kind: query
        summary: "调用 data.queries.token.delete_expired_tokens"
        input:
          - { name: limit, value: step.batch_limit.limit, description: "单批删除上限" }
        output:
          - { name: affected_rows, type: _types.integer, description: "query 返回的 affected_rows" }
        errors:
          - platform.errors.COMMON_INTERNAL
        query: data.queries.token.delete_expired_tokens
        goto: $end
    used_by:
      - cap.events.token.purge_expired

  - name: record_issued
