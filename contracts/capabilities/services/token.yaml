id: cap.services.token
summary: "令牌服务：签发、刷新、吊销与校验"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "token 只存 hash；原文只通过 issue 返回 TokenPair 暴露"
  - "verify 只校验 access token；refresh token 只在 refresh/logout 中使用"

schemas:
  TokenPair:
    type: object
    properties:
      - { name: access_token, schema: { type: string }, required: true, read_only: true, description: "访问令牌" }
      - { name: refresh_token, schema: { type: string }, required: true, read_only: true, description: "刷新令牌" }
      - { name: access_expire_at, schema: { type: timestamp }, required: true, description: "访问令牌过期时间" }
      - { name: refresh_expire_at, schema: { type: timestamp }, required: true, description: "刷新令牌过期时间" }
      - { name: token_type, schema: { type: token_type }, description: "令牌类型；固定 Bearer" }
services:
  - name: issue
    summary: "为账号签发 access + refresh 令牌对"
    visibility: public
    transaction: none
    params:
      - {name: ctx, type: context.Context}
      - {name: account_id, type: integer}
      - {name: device_id, type: string, nullable: true}
    returns:
      - {name: tokens, type: TokenPair}
    steps:
      - id: issue
        kind: logic
        summary: "生成令牌对，哈希后持久化 refresh token"
        errors:
          - platform.errors.COMMON_INTERNAL
        output:
          - {name: tokens, type: TokenPair}
        queries:
          - query: data.queries.token.create_token
            input:
              id: "expr: new_id()"
              own_type: "expr: account.own_type"
              own_id: "expr: account.own_id"
              account_id: "input.account_id"
              device_id: "input.device_id"
              user_id: "expr: account.user_id"
              access_token_hash: "expr: hash_token(access_token)"
              refresh_token_hash: "expr: hash_token(refresh_token)"
              access_expire_at: "expr: access_expire_at()"
              refresh_expire_at: "expr: refresh_expire_at()"

  - name: refresh
    summary: "用刷新令牌换取新令牌对"
    visibility: public
    transaction: required
    params:
      - {name: ctx, type: context.Context}
      - {name: refresh_token, type: string}
    returns:
      - {name: tokens, type: TokenPair}
    steps:
      - id: refresh
        kind: logic
        summary: "校验 refresh token，作废旧令牌并签发新令牌对"
        errors:
          - platform.errors.AUTH_TOKEN_INVALID
          - platform.errors.AUTH_TOKEN_EXPIRED
        input: {refresh_token: "input.refresh_token"}
        output:
          - {name: tokens, type: TokenPair}
        queries:
          - query: data.queries.token.get_token_by_refresh
            input: {refresh_token_hash: "expr: hash_token(input.refresh_token)"}
          - query: data.queries.token.create_token
            input:
              id: "expr: new_id()"
              own_type: "expr: old_token.own_type"
              own_id: "expr: old_token.own_id"
              account_id: "expr: old_token.account_id"
              device_id: "expr: old_token.device_id"
              user_id: "expr: old_token.user_id"
              access_token_hash: "expr: hash_token(access_token)"
              refresh_token_hash: "expr: hash_token(refresh_token)"
              access_expire_at: "expr: access_expire_at()"
              refresh_expire_at: "expr: refresh_expire_at()"
          - query: data.queries.token.revoke_token
            input:
              refresh_token_hash: "expr: hash_token(input.refresh_token)"
              revoked_at: "expr: now()"
              revoke_reason: "expr: token_revoke_reason('rotated')"

  - name: logout
    summary: "吊销刷新令牌"
    visibility: public
    transaction: required
    params:
      - {name: ctx, type: context.Context}
      - {name: refresh_token, type: string}
    returns: []
    steps:
      - id: logout
        kind: logic
        summary: "校验并吊销 refresh token"
        errors:
          - platform.errors.AUTH_TOKEN_INVALID
        input: {refresh_token: "input.refresh_token"}
        output: []
        queries:
          - query: data.queries.token.get_token_by_refresh
            input: {refresh_token_hash: "expr: hash_token(input.refresh_token)"}
          - query: data.queries.token.revoke_token
            input:
              refresh_token_hash: "expr: hash_token(input.refresh_token)"
              revoked_at: "expr: now()"
              revoke_reason: "expr: token_revoke_reason('logout')"

  - name: revoke_by_account
    summary: "吊销账号的全部令牌"
    visibility: public
    transaction: none
    params:
      - {name: ctx, type: context.Context}
      - {name: account_id, type: integer}
    returns: []
    steps:
      - id: revoke
        kind: logic
        summary: "吊销账号全部有效令牌"
        errors:
          - platform.errors.COMMON_INTERNAL
        output: []
        queries:
          - query: data.queries.token.revoke_tokens_by_account
            input:
              account_id: "input.account_id"
              revoked_at: "expr: now()"
              revoke_reason: "expr: token_revoke_reason('account_revoked')"

  - name: verify
    summary: "校验访问令牌并返回账号"
    visibility: public
    transaction: read_only
    params:
      - {name: ctx, type: context.Context}
      - {name: access_token, type: string}
    returns:
      - {name: account, type: data.entities.account}
    steps:
      - id: verify
        kind: logic
        summary: "校验 access token 并加载账号"
        errors:
          - platform.errors.AUTH_TOKEN_INVALID
          - platform.errors.AUTH_TOKEN_EXPIRED
        input: {access_token: "input.access_token"}
        output:
          - {name: account, type: data.entities.account}
        queries:
          - query: data.queries.token.get_token_by_access
            input: {access_token_hash: "expr: hash_token(input.access_token)"}
          - query: data.queries.account.get_account
            input: {id: "expr: token.account_id"}

  - name: purge_expired
    summary: "清理已过期令牌"
    visibility: internal
    transaction: none
    params:
      - {name: ctx, type: context.Context}
    returns:
      - {name: affected_rows, type: integer}
    steps:
      - id: purge
        kind: logic
        summary: "删除过期令牌"
        errors:
          - platform.errors.COMMON_INTERNAL
        output:
          - {name: affected_rows, type: integer}
        queries:
          - query: data.queries.token.delete_expired_tokens
            input: {limit: "expr: batch_limit()"}
