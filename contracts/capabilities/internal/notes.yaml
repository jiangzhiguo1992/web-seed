# contract: cap.internal.notes
# summary: 笔记模块对外暴露的 service 能力。只登记跨模块调用，模块内部方法不进契约。
# enforcement: generated+tested
# consumers: [api]
# refs: [domain.entity.note, domain.state.note, platform.errors]
# generates:
#   - apps/api/internal/generated/contracts/notes.go（interface + mock）
# do_not:
#   - 不要让其他模块直接 import notes 的 repo 或包内类型
#   - 不要在 interface 里暴露 *pgx.Tx 或 sql 类型
#   - 不要在 interface 里返回 http 类型

schema_version: 1
id: cap.internal.notes
summary: 笔记跨模块 service 接口
stability: stable
module: notes

interface:
  name: NotesService
  package: internal/modules/notes
  methods:
    - name: Get
      summary: 按 ID 获取笔记
      params:
        - { name: ctx, type: context.Context }
        - { name: id, type: uuid }
      returns:
        - { name: note, type: domain.entity.note }
        - { name: err, type: error }
      errors: [platform.error.NOTE_NOT_FOUND, platform.error.NOTE_FORBIDDEN]
      transaction: read_only

    - name: Create
      summary: 创建笔记
      params:
        - { name: ctx, type: context.Context }
        - { name: input, type: CreateNoteInput }
      returns:
        - { name: note, type: domain.entity.note }
        - { name: err, type: error }
      errors: [platform.error.NOTE_TITLE_REQUIRED, platform.error.NOTE_FORBIDDEN]
      transaction: required
      emits: [domain.event.note_created]

    - name: Archive
      summary: 归档笔记
      params:
        - { name: ctx, type: context.Context }
        - { name: id, type: uuid }
        - { name: version, type: integer }
      returns:
        - { name: note, type: domain.entity.note }
        - { name: err, type: error }
      errors:
        - platform.error.NOTE_NOT_FOUND
        - platform.error.NOTE_VERSION_CONFLICT
        - platform.error.NOTE_ILLEGAL_TRANSITION
      transaction: required
      emits: [domain.event.note_archived]

types:
  CreateNoteInput:
    type: object
    additionalProperties: false
    required: [title]
    properties:
      title: { type: string, minLength: 1, maxLength: 200 }
      body: { type: string, maxLength: 10000 }

consumers:
  - module: audit
    uses: [Get]
  - module: notification
    uses: [Get]
