# 验证码入口策略。

id: cap.policies.verification
summary: "验证码入口策略"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "发送与校验都必须限流，防止短信轰炸与暴力猜码"
scope: "verification"
policies:
  - id: cap.policies.verification.send
    name: send
    summary: "发送验证码"
    audit: true
    rate_limit: {requests: 5, window_seconds: 60}
  - id: cap.policies.verification.verify
    name: verify
    summary: "校验验证码"
    audit: true
    rate_limit: {requests: 10, window_seconds: 60}
