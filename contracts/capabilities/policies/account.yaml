# 账号入口策略。

id: cap.policies.account
summary: "账号入口策略"
owner_module: account
schema_version: 1
stability: stable
do_not:
  - "权限点必须来自 platform.security.permissions"
  - "不要在 service 内联 permissions/audit/rate_limit/idempotency"
scope: "account"
policies:
  - id: cap.policies.account.get
    name: get
    summary: "账号详情"
    permissions: [platform.security.permissions.account_read]
  - id: cap.policies.account.list
    name: list
    summary: "账号列表"
    permissions: [platform.security.permissions.account_read]
    rate_limit: {requests: 60, window_seconds: 60}
  - id: cap.policies.account.create
    name: create
    summary: "创建账号"
    permissions: [platform.security.permissions.account_write]
    audit: true
    idempotency: {key: "account_create:{input.number}", window: 24h}
  - id: cap.policies.account.update
    name: update
    summary: "更新账号"
    permissions: [platform.security.permissions.account_write]
    audit: true
  - id: cap.policies.account.delete
    name: delete
    summary: "软删账号"
    permissions: [platform.security.permissions.account_delete]
    audit: true
    idempotency: {key: "account_delete:{id}", window: 24h}
  - id: cap.policies.account.activate
    name: activate
    summary: "激活账号"
    permissions: [platform.security.permissions.account_write]
    audit: true
  - id: cap.policies.account.suspend
    name: suspend
    summary: "封禁账号"
    permissions: [platform.security.permissions.account_write]
    audit: true
