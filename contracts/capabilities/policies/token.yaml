# 令牌入口策略。

id: cap.policies.token
summary: "令牌入口策略"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "登出必须幂等，重复请求不得报错"
scope: "token"
policies:
  - id: cap.policies.token.logout
    name: logout
    summary: "登出"
    audit: true
    idempotency: {key: "auth_logout:{refresh_token_hash}", window: 24h}
