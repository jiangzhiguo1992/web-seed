id: cap.events.account
summary: "账号领域事件"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "事件 payload 不得包含密码、令牌、邮箱、手机号原文"
  - "破坏兼容必须升 version，不得原地修改 payload"

topics:
  - id: cap.events.account.created
    name: account.created
    version: 1
    summary: "账号创建"
    idempotent: true
    publish:
      payload:
        type: _types.object
        properties:
          - { name: id, schema: { type: _types.id }, required: true, description: "唯一标识" }
          - { name: number, schema: { type: _types.account_number }, required: true, description: "账号编号" }
          - { name: status, schema: { ref: data.enums.account_status }, required: true, description: "账号创建后的状态" }
          - { name: created_at, schema: { type: _types.timestamp }, required: true, description: "创建时间" }
      emitted_by:
        - cap.services.account.create
  - id: cap.events.account.activated
    name: account.activated
    version: 1
    summary: "账号激活或解封"
    idempotent: true
    publish:
      payload:
        type: _types.object
        properties:
          - { name: id, schema: { type: _types.id }, required: true, description: "唯一标识" }
          - { name: activated_at, schema: { type: _types.timestamp }, required: true, description: "账号激活时间" }
      emitted_by:
        - cap.services.account.activate
  - id: cap.events.account.suspended
    name: account.suspended
    version: 1
    summary: "账号封禁"
    idempotent: true
    publish:
      payload:
        type: _types.object
        properties:
          - { name: id, schema: { type: _types.id }, required: true, description: "唯一标识" }
          - { name: reason, schema: { type: _types.string }, required: true, description: "失败或停用原因" }
          - { name: suspended_at, schema: { type: _types.timestamp }, required: true, description: "账号停用时间" }
      emitted_by:
        - cap.services.account.suspend
  - id: cap.events.account.reactivated
    name: account.reactivated
    version: 1
    summary: "账号解封"
    idempotent: true
    publish:
      payload:
        type: _types.object
        properties:
          - { name: id, schema: { type: _types.id }, required: true, description: "唯一标识" }
          - { name: reactivated_at, schema: { type: _types.timestamp }, required: true, description: "账号重新激活时间" }
      emitted_by:
        - cap.services.account.activate
  - id: cap.events.account.deleted
    name: account.deleted
    version: 1
    summary: "账号软删"
    idempotent: true
    publish:
      payload:
        type: _types.object
        properties:
          - { name: id, schema: { type: _types.id }, required: true, description: "唯一标识" }
          - { name: deleted_at, schema: { type: _types.timestamp }, required: true, description: "软删时间" }
      emitted_by:
        - cap.services.account.delete
  - id: cap.events.account.login_succeeded
    name: account.login_succeeded
    version: 1
    summary: "登录成功"
    idempotent: false
    publish:
      payload:
        type: _types.object
        properties:
          - { name: id, schema: { type: _types.id }, required: true, description: "唯一标识" }
          - { name: ip, schema: { type: _types.string }, description: "客户端 IP" }
          - { name: user_agent, schema: { type: _types.string }, description: "客户端 User-Agent" }
          - name: attributes
            schema:
              type: _types.map
              values: { type: _types.string }
              min_items: 1
              max_items: 10
              key_patterns: [ '^[a-z][a-z0-9_]*$' ]
            description: "登录上下文扩展属性；键值均为字符串"
          - { name: login_at, schema: { type: _types.timestamp }, required: true, description: "登录时间" }
      emitted_by:
        - cap.services.auth.record_login_success
  - id: cap.events.account.login_failed
    name: account.login_failed
    version: 1
    summary: "登录失败"
    idempotent: false
    publish:
      payload:
        type: _types.object
        properties:
          - { name: account_id, schema: { type: _types.id }, nullable: true, description: "账号 ID；未知账号为 null" }
          - { name: reason, schema: { ref: data.enums.login_failed_reason }, required: true, description: "失败或停用原因" }
          - { name: failed_at, schema: { type: _types.timestamp }, required: true, description: "登录失败时间" }
      emitted_by:
        - cap.services.auth.login
        - cap.services.auth.record_login_failure

dispatches:
  - id: cap.events.account.notify_deleted
    name: notify_deleted
    summary: "异步通知账号注销"
    payload:
      type: _types.object
      properties:
        - { name: account_id, schema: { type: _types.id }, required: true, description: "账号 ID" }
        - { name: deleted_at, schema: { type: _types.timestamp }, required: true, description: "软删时间" }
    service: cap.services.account.notify_deleted
    emitted_by: [ cap.services.account.delete ]
    timeout: 1h
    retry: { max_attempts: 3, backoff: exponential, dead_letter: true }
    concurrency: { key: account_notify_deleted, ttl: 5m }
