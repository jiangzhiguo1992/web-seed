id: cap.events.token
summary: "令牌异步任务"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "purge_expired 只清理过期令牌，不得顺带吊销有效令牌"
  - "expire_tokens 只改 status，不删除行；删除由 purge_expired 负责"
  - "expire_tokens 每小时先标记 expired，purge_expired 3:30 再物理删除，避免未标记就被删"

topics:
  - id: cap.events.token.issued
    name: token.issued
    version: 1
    summary: "令牌签发"
    idempotent: true
    publish:
      payload:
        kind: _types.schemas.object
        properties:
          - { name: token_id, schema: { type: _types.basics.id }, required: true, description: "令牌 ID" }
          - { name: account_id, schema: { type: _types.basics.id }, required: true, description: "账号 ID" }
          - { name: account, schema: { type: data.entities.account }, required: true, description: "账号实体" }
          - { name: issued_at, schema: { type: _types.basics.timestamp.long }, required: true, description: "签发时间" }
      emitted_by:
        - cap.services.token.issue
    subscribe:
      - id: cap.events.token.record_issued
        name: record_issued
        summary: "消费 token.issued，记录签发审计"
        service: cap.services.token.record_issued
        retry: { max_attempts: 3, backoff: exponential, dead_letter: true }
        concurrency: { key: token_record_issued, ttl: 1m }

crons:
  - id: cap.events.token.expire_tokens
    name: expire_tokens
    summary: "把超过 refresh_expire_at 的活跃令牌置为 expired"
    service: cap.services.token.expire
    schedule: "0 * * * *"
    overlap: forbid
    retry: { max_attempts: 3, backoff: exponential, dead_letter: true }
    concurrency: { key: token_expire, ttl: 1h }
  - id: cap.events.token.purge_expired
    name: purge_expired
    summary: "清理已过期令牌"
    service: cap.services.token.purge_expired
    schedule: "30 3 * * *"
    overlap: forbid
    retry: { max_attempts: 3, backoff: exponential, dead_letter: true }
    concurrency: { key: token_purge, ttl: 1h }
