# 手机/邮箱认证绑定生命周期：创建为 unverified，验证成功后 verified，可停用/启用。

id: cap.lifecycles.auth_contact
summary: "手机/邮箱认证绑定生命周期"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "手机/邮箱创建后是 unverified，验证成功后才 verified"
  - "验证成功只由 cap.services.verification.verify 写入"
  - "unverified 只能销毁，不能停用；disable 只允许从 verified 出发"

subjects:
  - { entity: data.entities.auth_phone, field: status }
  - { entity: data.entities.auth_email, field: status }
initial: unverified
create:
  steps: [ cap.services.auth.bind_email.create_bind, cap.services.auth.bind_phone.create_bind ]
destroy:
  steps: [ cap.services.auth.revoke_all_for_account.revoke_bindings ]
  from: [unverified, verified, disabled]
states: [unverified, verified, disabled]
transitions:
  - name: verify
    description: "验证码校验成功，置为已认证"
    from: [unverified]
    to: verified
    guard: true
    on_violation: platform.errors.COMMON_INTERNAL
    implemented_by: [ cap.services.verification.verify.apply_email_verified, cap.services.verification.verify.apply_phone_verified ]
  - name: disable
    description: "停用手机/邮箱认证"
    from: [verified]
    to: disabled
    guard: true
    on_violation: platform.errors.COMMON_INTERNAL
    implemented_by: [ cap.services.auth.bind_email.disable_bind, cap.services.auth.bind_phone.disable_bind ]
  - name: enable
    description: "启用手机/邮箱认证"
    from: [disabled]
    to: verified
    guard: true
    on_violation: platform.errors.COMMON_INTERNAL
    implemented_by: [ cap.services.auth.bind_email.enable_bind, cap.services.auth.bind_phone.enable_bind ]
forbidden_examples:
  - { from: unverified, transition: enable, reason: "未认证不能直接启用" }
  - { from: unverified, transition: disable, reason: "未认证不能停用，只能销毁" }
  - { from: verified, transition: verify, reason: "已认证不可重复验证" }
idempotent_transitions: []
