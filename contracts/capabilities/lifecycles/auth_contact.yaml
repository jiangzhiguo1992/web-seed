# 手机/邮箱认证绑定生命周期：创建为 unverified，验证成功后 verified，可停用/启用。

id: cap.lifecycles.auth_contact
summary: "手机/邮箱认证绑定生命周期"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "手机/邮箱创建后是 unverified，验证成功后才 verified"
  - "验证成功只由 cap.services.verification.verify 写入"
  - "unverified 只能销毁，不能停用；disable 只允许从 verified 出发"

subjects:
  - { entity: data.entities.auth_phone, field: status }
  - { entity: data.entities.auth_email, field: status }
states:
  values: [unverified, verified, disabled]
  initial: unverified
create:
  requires:
    - { lifecycle: cap.lifecycles.account, states: [pending, active] }
  services:
    - cap.services.auth.bind_email
    - cap.services.auth.bind_phone
destroy:
  requires:
    - { lifecycle: cap.lifecycles.account, states: [pending, active, suspended] }
  services:
    - cap.services.auth.bind_email
    - cap.services.auth.bind_phone
    - cap.services.auth.revoke_all_for_account
transitions:
  - name: verify
    description: "验证码校验成功，置为已认证"
    from: [unverified]
    to: verified
    requires:
      - { lifecycle: cap.lifecycles.account, states: [pending, active] }
    implemented_by:
      - cap.services.verification.verify.apply_email_verified
      - cap.services.verification.verify.apply_phone_verified
  - name: disable
    description: "停用手机/邮箱认证"
    from: [verified]
    to: disabled
    requires:
      - { lifecycle: cap.lifecycles.account, states: [pending, active] }
    implemented_by:
      - cap.services.auth.bind_email.disable_email_status
      - cap.services.auth.bind_phone.disable_phone_status
  - name: enable
    description: "启用手机/邮箱认证"
    from: [disabled]
    to: verified
    requires:
      - { lifecycle: cap.lifecycles.account, states: [pending, active] }
    implemented_by:
      - cap.services.auth.bind_email.enable_email_status
      - cap.services.auth.bind_phone.enable_phone_status
