# 令牌生命周期：签发 active；吊销 revoked；过期 expired 由 expire 服务写入。

id: cap.lifecycles.token
summary: "令牌生命周期"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "expired 由 cap.services.token.expire 批量写入；读取方仍应检查过期时间"
  - "purge_expired 物理删除令牌，不属于状态转换"
  - "不要用 revoked 表示自然过期"

subjects:
  - { entity: data.entities.token, field: status }
states:
  values:
    - { value: active, steps: [ cap.services.token.expire.expire_tokens, cap.services.token.issue.create_token, cap.services.token.logout.get_token_by_refresh, cap.services.token.logout.revoke_token, cap.services.token.purge_expired.delete_expired_tokens, cap.services.token.refresh.create_token, cap.services.token.refresh.load_old, cap.services.token.refresh.revoke_token, cap.services.token.revoke_by_account.revoke_tokens_by_account, cap.services.token.verify.load_token ] }
    - { value: revoked, steps: [ cap.services.token.issue.create_token, cap.services.token.logout.get_token_by_refresh, cap.services.token.purge_expired.delete_expired_tokens, cap.services.token.refresh.create_token, cap.services.token.refresh.load_old, cap.services.token.verify.load_token ] }
    - { value: expired, steps: [ cap.services.token.issue.create_token, cap.services.token.logout.get_token_by_refresh, cap.services.token.purge_expired.delete_expired_tokens, cap.services.token.refresh.create_token, cap.services.token.refresh.load_old, cap.services.token.verify.load_token ] }
  initial: active
  final: [ revoked, expired ]
create:
  requires:
    - lifecycle: cap.lifecycles.account
      states: [ active ]
      rules: [ "feature.rules.auth.auth_token_requires_active_account" ]
      on_violation: platform.errors.AUTH_TOKEN_INVALID
  implemented_by:
    - cap.services.token.issue.create_token
    - cap.services.token.refresh.create_token
transitions:
  - name: revoke
    description: "主动吊销令牌"
    from: [ active ]
    to: revoked
    requires: [ ]
    implemented_by:
      - cap.services.token.logout.revoke_token
      - cap.services.token.refresh.revoke_token
      - cap.services.token.revoke_by_account.revoke_tokens_by_account
  - name: expire
    description: "把超过 refresh_expire_at 的活跃令牌置为 expired"
    from: [ active ]
    to: expired
    requires: [ ]
    implemented_by:
      - cap.services.token.expire.expire_tokens
