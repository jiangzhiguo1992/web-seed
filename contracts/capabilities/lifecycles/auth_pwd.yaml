# 密码认证绑定状态机。

id: cap.lifecycles.auth_pwd
summary: "密码认证绑定生命周期"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "update 只改密码哈希，不改变 auth_status"

subjects:
  - { entity: data.entities.auth_pwd, field: status }
states:
  values:
    - { value: verified, steps: [ cap.services.auth.bind_password.disable_pwd_status ] }
    - { value: disabled, steps: [ cap.services.auth.bind_password.enable_pwd_status ] }
  initial: verified
  final: [ ]

create:
  requires:
    - lifecycle: cap.lifecycles.account
      states: [ pending, active ]
      rules: [ feature.flows.auth.auth_binding_rejects_suspended_account, feature.flows.auth.auth_binding_rejects_deleted_account ]
      on_violation: platform.errors.ACCOUNT_ILLEGAL_TRANSITION
  implemented_by:
    - cap.services.auth.bind_password.create_auth_pwd
destroy:
  requires:
    - lifecycle: cap.lifecycles.account
      states: [ pending, active, suspended ]
      rules: [ feature.flows.auth.auth_binding_rejects_deleted_account ]
      on_violation: platform.errors.ACCOUNT_ALREADY_DELETED
  implemented_by:
    - cap.services.auth.revoke_all_for_account.soft_delete_auth_pwd_by_account
transitions:
  - name: disable
    description: "停用密码认证"
    from: [ verified ]
    to: disabled
    requires:
      - lifecycle: cap.lifecycles.account
        states: [ pending, active ]
        rules: [ feature.flows.auth.auth_binding_rejects_suspended_account, feature.flows.auth.auth_binding_rejects_deleted_account ]
        on_violation: platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    implemented_by:
      - cap.services.auth.bind_password.disable_pwd_status
  - name: enable
    description: "启用密码认证"
    from: [ disabled ]
    to: verified
    requires:
      - lifecycle: cap.lifecycles.account
        states: [ pending, active ]
        rules: [ feature.flows.auth.auth_binding_rejects_suspended_account, feature.flows.auth.auth_binding_rejects_deleted_account ]
        on_violation: platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    implemented_by:
      - cap.services.auth.bind_password.enable_pwd_status
