# 密码认证绑定生命周期：创建即 verified，可停用/启用，软删账号时销毁。

id: cap.lifecycles.auth_pwd
summary: "密码认证绑定生命周期"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "密码创建即 verified；不要在创建后再走一次验证"
  - "update 只改密码哈希，不改变 auth_status"

subjects:
  - { entity: data.entities.auth_pwd, field: status }
states:
  values: [ verified, disabled ]
  initial: verified
  final: [ ]
create:
  requires:
    - { lifecycle: cap.lifecycles.account, states: [ pending, active ] }
  implemented_by:
    - cap.services.auth.bind_password.create_auth_pwd
destroy:
  requires:
    - { lifecycle: cap.lifecycles.account, states: [ pending, active, suspended ] }
  implemented_by:
    - cap.services.auth.revoke_all_for_account.soft_delete_auth_pwd_by_account
transitions:
  - name: disable
    description: "停用密码认证"
    from: [ verified ]
    to: disabled
    requires:
      - { lifecycle: cap.lifecycles.account, states: [ pending, active ] }
    implemented_by:
      - cap.services.auth.bind_password.disable_pwd_status
  - name: enable
    description: "启用密码认证"
    from: [ disabled ]
    to: verified
    requires:
      - { lifecycle: cap.lifecycles.account, states: [ pending, active ] }
    implemented_by:
      - cap.services.auth.bind_password.enable_pwd_status
