# 验证体生命周期：创建 pending；发送 sent；校验成功 consumed；过期 expired；作废 revoked；发送失败 failed。

id: cap.lifecycles.verification
summary: "验证体生命周期"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "failed 只表示发送失败；发送失败必须把验证体置为 failed"
  - "invalid 是 verification_result，不是 verification_status；不要写入验证体状态"
  - "验证码不匹配只递增 attempt_count，状态保持 sent；attempts_exceeded 不在 verify 事务内写 revoked"
  - "expired 由 cleanup 按 expire_at 写入；读取方仍应检查 expire_at"

subjects:
  - { entity: data.entities.verification_body, field: status }
states:
  values:
    - { value: pending, steps: [ cap.services.verification.cleanup.expire_stale, cap.services.verification.cleanup.revoke_exhausted, cap.services.verification.revoke_by_account.revoke_active_verifications_by_account, cap.services.verification.revoke_by_auth.revoke_active_verifications_by_auth, cap.services.verification.send.mark_sent, cap.services.verification.send.revoke_old ] }
    - { value: sent, steps: [ cap.services.verification.cleanup.expire_stale, cap.services.verification.cleanup.revoke_exhausted, cap.services.verification.revoke_by_account.revoke_active_verifications_by_account, cap.services.verification.revoke_by_auth.revoke_active_verifications_by_auth, cap.services.verification.send.mark_failed, cap.services.verification.send.revoke_old, cap.services.verification.verify.consume ] }
    - { value: consumed, steps: [ ] }
    - { value: expired, steps: [ ] }
    - { value: revoked, steps: [ ] }
    - { value: failed, steps: [ ] }
  initial: pending
  final: [ consumed, expired, revoked, failed ]

create:
  requires:
    - lifecycle: cap.lifecycles.account
      states: [ pending, active ]
      rules: [ feature.rules.auth.verification_account_active ]
      on_violation: platform.errors.AUTH_VERIFICATION_INVALID
  implemented_by:
    - cap.services.verification.send.create

transitions:
  - name: send
    description: "验证体创建后标记为已发送"
    from: [ pending ]
    to: sent
    requires:
      - lifecycle: cap.lifecycles.account
        states: [ pending, active ]
        rules: [ feature.rules.auth.verification_account_active ]
        on_violation: platform.errors.AUTH_VERIFICATION_INVALID
    implemented_by:
      - cap.services.verification.send.mark_sent
  - name: consume
    description: "验证码校验成功后消费"
    from: [ sent ]
    to: consumed
    requires:
      - lifecycle: cap.lifecycles.account
        states: [ pending, active ]
        rules: [ feature.rules.auth.verification_account_active ]
        on_violation: platform.errors.AUTH_VERIFICATION_INVALID
    implemented_by:
      - cap.services.verification.verify.consume
  - name: expire
    description: "超过 expire_at 的 pending/sent 验证体由 cleanup 置为 expired"
    from: [ pending, sent ]
    to: expired
    requires: [ ]
    implemented_by:
      - cap.services.verification.cleanup.expire_stale
  - name: revoke
    description: "重发、换绑、停用或清理时作废"
    from: [ pending, sent ]
    to: revoked
    requires: [ ]
    implemented_by:
      - cap.services.verification.cleanup.revoke_exhausted
      - cap.services.verification.revoke_by_account.revoke_active_verifications_by_account
      - cap.services.verification.revoke_by_auth.revoke_active_verifications_by_auth
      - cap.services.verification.send.revoke_old
  - name: fail
    description: "验证码发送失败"
    from: [ sent ]
    to: failed
    requires:
      - lifecycle: cap.lifecycles.account
        states: [ pending, active ]
        rules: [ feature.rules.auth.verification_account_active ]
        on_violation: platform.errors.AUTH_VERIFICATION_INVALID
    implemented_by:
      - cap.services.verification.send.mark_failed
