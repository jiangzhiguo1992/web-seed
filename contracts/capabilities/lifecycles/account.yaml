# 账号生命周期：创建、状态转换与软删。

id: cap.lifecycles.account
summary: "账号生命周期"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "account 生命周期必须穷举所有合法转换，未列出即非法"
  - "封禁与软删不要混用：suspended 可恢复，deleted 不可"

subjects:
  - { entity: data.entities.account, field: status }
states:
  values:
    - { value: pending, steps: [ cap.services.account.activate.get_account, cap.services.account.activate.set_account_status, cap.services.account.create.create_account, cap.services.account.create.exists_account_number, cap.services.account.delete.get_account, cap.services.account.delete.soft_delete_account, cap.services.account.get.get_account, cap.services.account.list.list_accounts, cap.services.account.suspend.get_account, cap.services.account.update.get_account, cap.services.account.update.update_account, cap.services.auth.bind_email.load_account, cap.services.auth.bind_password.load_account, cap.services.auth.bind_phone.load_account, cap.services.auth.login.load_account, cap.services.token.issue.load_account, cap.services.token.refresh.load_account, cap.services.token.verify.get_account, cap.services.token.verify.verify, cap.services.verification.send.load_account, cap.services.verification.verify.load_account ] }
    - { value: active, steps: [ cap.services.account.activate.get_account, cap.services.account.create.create_account, cap.services.account.create.exists_account_number, cap.services.account.delete.get_account, cap.services.account.delete.soft_delete_account, cap.services.account.get.get_account, cap.services.account.list.list_accounts, cap.services.account.suspend.get_account, cap.services.account.suspend.set_account_status, cap.services.account.update.get_account, cap.services.account.update.update_account, cap.services.auth.bind_email.load_account, cap.services.auth.bind_password.load_account, cap.services.auth.bind_phone.load_account, cap.services.auth.login.load_account, cap.services.token.issue.load_account, cap.services.token.refresh.load_account, cap.services.token.verify.get_account, cap.services.token.verify.verify, cap.services.verification.send.load_account, cap.services.verification.verify.load_account ] }
    - { value: suspended, steps: [ cap.services.account.activate.get_account, cap.services.account.activate.set_account_status, cap.services.account.create.create_account, cap.services.account.create.exists_account_number, cap.services.account.delete.get_account, cap.services.account.delete.soft_delete_account, cap.services.account.get.get_account, cap.services.account.list.list_accounts, cap.services.account.suspend.get_account, cap.services.account.update.get_account, cap.services.account.update.update_account, cap.services.auth.bind_email.load_account, cap.services.auth.bind_password.load_account, cap.services.auth.bind_phone.load_account, cap.services.auth.login.load_account, cap.services.token.issue.load_account, cap.services.token.refresh.load_account, cap.services.token.verify.get_account, cap.services.token.verify.verify, cap.services.verification.send.load_account, cap.services.verification.verify.load_account ] }
    - { value: deleted, steps: [ cap.services.account.activate.get_account, cap.services.account.create.create_account, cap.services.account.create.exists_account_number, cap.services.account.delete.get_account, cap.services.account.get.get_account, cap.services.account.list.list_accounts, cap.services.account.suspend.get_account, cap.services.account.update.get_account, cap.services.account.update.update_account, cap.services.auth.bind_email.load_account, cap.services.auth.bind_password.load_account, cap.services.auth.bind_phone.load_account, cap.services.auth.login.load_account, cap.services.token.issue.load_account, cap.services.token.refresh.load_account, cap.services.token.verify.get_account, cap.services.token.verify.verify, cap.services.verification.send.load_account, cap.services.verification.verify.load_account ] }
  initial: pending
  final: [ deleted ]
create:
  requires: [ ]
  implemented_by:
    - cap.services.account.create.create_account
destroy:
  requires: [ ]
  implemented_by:
    - cap.services.account.delete.soft_delete_account
transitions:
  - name: activate
    description: "激活账号"
    from: [ pending ]
    to: active
    requires: [ ]
    implemented_by:
      - cap.services.account.activate.set_account_status
  - name: suspend
    description: "封禁账号"
    from: [ active ]
    to: suspended
    requires: [ ]
    implemented_by:
      - cap.services.account.suspend.set_account_status
  - name: reactivate
    description: "解封"
    from: [ suspended ]
    to: active
    requires: [ ]
    implemented_by:
      - cap.services.account.activate.set_account_status
