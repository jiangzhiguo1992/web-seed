# 账号生命周期：创建、状态转换与软删。

id: cap.lifecycles.account
summary: "账号生命周期"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "account 生命周期必须穷举所有合法转换，未列出即非法"
  - "封禁与软删不要混用：suspended 可恢复，deleted 不可"

subjects:
  - { entity: data.entities.account, field: status }
states:
  values: [ pending, active, suspended, deleted ]
  initial: pending
  final: [ deleted ]
create:
  requires: [ ]
  implemented_by:
    - cap.services.account.create.create_account
destroy:
  requires: [ ]
  implemented_by:
    - cap.services.account.delete.soft_delete_account
transitions:
  - name: activate
    description: "激活账号"
    from: [ pending ]
    to: active
    requires: [ ]
    implemented_by:
      - cap.services.account.activate.set_account_status
  - name: suspend
    description: "封禁账号"
    from: [ active ]
    to: suspended
    requires: [ ]
    implemented_by:
      - cap.services.account.suspend.set_account_status
  - name: reactivate
    description: "解封"
    from: [ suspended ]
    to: active
    requires: [ ]
    implemented_by:
      - cap.services.account.activate.set_account_status
