# 账号生命周期：创建、状态转换与软删。

id: cap.lifecycles.account
summary: "账号生命周期"
owner_module: account
schema_version: 1
stability: draft
do_not: []

subjects:
  - { entity: data.entities.account, field: status }
states:
  values:
    - { value: pending, steps: [ cap.services.account.activate.set_account_status, cap.services.account.delete.soft_delete_account ] }
    - { value: active, steps: [ cap.services.account.delete.soft_delete_account, cap.services.account.suspend.set_account_status ] }
    - { value: suspended, steps: [ cap.services.account.activate.set_account_status, cap.services.account.delete.soft_delete_account ] }
    - { value: deleted, steps: [ ] }
  initial: pending
  final: [ deleted ]

create:
  requires: [ ]
  implemented_by:
    - cap.services.account.create.create_account
destroy:
  requires: [ ]
  implemented_by:
    - cap.services.account.delete.soft_delete_account
transitions:
  - name: activate
    description: "激活账号"
    from: [ pending ]
    to: active
    requires: [ ]
    implemented_by:
      - cap.services.account.activate.set_account_status
  - name: suspend
    description: "封禁账号"
    from: [ active ]
    to: suspended
    requires: [ ]
    implemented_by:
      - cap.services.account.suspend.set_account_status
  - name: reactivate
    description: "解封"
    from: [ suspended ]
    to: active
    requires: [ ]
    implemented_by:
      - cap.services.account.activate.set_account_status
