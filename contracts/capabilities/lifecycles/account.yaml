# 账号生命周期：创建、状态转换与软删。

id: cap.lifecycles.account
summary: "账号生命周期"
owner_module: account
schema_version: 1
stability: stable
do_not:
  - "account 生命周期必须穷举所有合法转换，未列出即非法"
  - "封禁与软删不要混用：suspended 可恢复，deleted 不可"

subjects:
  - { entity: data.entities.account, field: status }
initial: pending
final: deleted
create:
  steps: [ cap.services.account.create.create ]
destroy:
  steps: [ cap.services.account.delete.soft_delete ]
  from: [pending, active]
  to: deleted
states: [pending, active, suspended, deleted]
transitions:
  - name: activate
    description: "激活账号"
    from: [pending]
    to: active
    guard: true
    on_violation: platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    implemented_by: [ cap.services.account.activate.apply ]
  - name: suspend
    description: "封禁账号"
    from: [active]
    to: suspended
    guard: true
    on_violation: platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    implemented_by: [ cap.services.account.suspend.apply ]
  - name: reactivate
    description: "解封"
    from: [suspended]
    to: active
    guard: true
    on_violation: platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    implemented_by: [ cap.services.account.activate.apply ]
forbidden_examples:
  - { from: deleted, transition: activate, reason: "已删除不可激活" }
  - { from: pending, transition: suspend, reason: "待激活账号不可直接封禁" }
idempotent_transitions: []
