# 入口访问策略；binding 目标必须是 service item。

id: meta.platform.security.access
type: platform.security.access
title: "入口访问策略"
targets:
  dir: "contracts/platform/security"
  glob: "access.yaml"
  id: "platform.security.access"
  naming: "snake_case"

fields:
  - name: id
    type: _types.string
    required: true
    const: platform.security.access
    description: "契约 ID"

  - name: summary
    type: _types.string
    required: true
    description: "一句话说明"

  - name: schema_version
    type: _types.integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: _types.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.set<_types.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: bindings
    type: _types.list<_types.object>
    required: true
    min_items: 1
    description: "入口策略绑定"
    item_fields:
      - name: target
        type: _types.string
        required: true
        pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$'
        description: "service item ID"

      - name: permissions
        type: _types.list<_types.string>
        required: false
        unique: true
        min_items: 1
        pattern: '^platform\.security\.permissions\.[a-z][a-z0-9_]*$'
        description: "所需权限"

      - name: audit
        type: _types.boolean
        required: false
        description: "是否写审计"

      - name: rate_limit
        type: _types.object
        required: false
        description: "限流"
        fields:
          - name: requests
            type: _types.integer
            required: true
            min: 1
            description: "窗口内请求数"

          - name: window_seconds
            type: _types.integer
            required: true
            min: 1
            description: "窗口秒数"

rules:
  - { id: access-coverage, text: "每个被 HTTP operation 暴露的 service 必须有 platform.security.access binding（permissions、audit 或 rate_limit 至少一项）", implemented_by: [ access-coverage ] }
