# cap.http 类型规范：flow 到 HTTP 协议的绑定。
# paths 的关键绑定（operationId/x-contract-id/x-flow/错误响应）由 checker 校验；完整 OpenAPI 结构由生成器负责。

id: meta.cap.http
type: cap.http
title: "HTTP 协议绑定契约"
targets:
  dir: "contracts/capabilities/protocols/http"
  glob: "*.yaml"
  id: "cap.http.<file>"
  naming: "snake_case"

fields:
  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "格式版本"

  - name: id
    type: string
    required: true
    pattern: '^cap\.http\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: string
    required: true
    description: "一句话说明"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: list<string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: module
    type: string
    required: false
    pattern: '^[a-z][a-z0-9_]*$'
    description: "所属模块；shared.yaml 可省略"

  - name: base_path
    type: string
    required: false
    pattern: '^/[A-Za-z0-9_\-/]*$'
    description: "URL 前缀，例如 /v1"

  - name: default_error_responses
    type: list<any>
    required: false
    unique: true
    description: "默认注入的错误状态码；operation 不得重复声明这些状态码"

  - name: paths
    type: any
    required: true
    description: "OpenAPI 3.1 path item；每个 operation 必须写 operationId、x-contract-id、x-flow"

  - name: components
    type: any
    required: false
    description: "协议层共享 schema/参数/响应；schema 可用 x-method-type / x-enum / x-entity 指向唯一来源，生成器展开"

rules:
  - { id: http-binding, text: "每个 http operation 必须有 operationId、x-contract-id 与 x-flow；x-service 已移除；x-flow 必须指向存在的同步 flow；同步 flow 必须有至少一个 protocol 入边；x-contract-id 必须唯一；operation 不得重复声明 default_error_responses 中的状态码", implemented_by: [ http-binding ] }
  - { id: http-components, text: "components.schemas 的 object 必须 additionalProperties: false；x-method-type/x-enum/x-entity 必须指向存在的来源；$ref 必须指向存在的 schema", implemented_by: [ http-components ] }
