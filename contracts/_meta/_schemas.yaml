# 共享受限 schema DSL：cap.services.schemas 与 cap.events.payload。
# 两层语法：schema 节点只描述值域；property 条目只描述槽位。
# property 是 object.properties 的 item_fields，槽位键只允许出现在这里，
# 节点位置出现即报 schema.slot-position。

id: meta.schemas
title: "schema DSL"

kinds:
  object:
    description: "对象节点；properties 是属性条目列表"
    keys:
      - name: type
        type: string
        required: true
        description: "固定为 object"
      - name: properties
        type: list<object>
        required: true
        unique_key: name
        description: "对象属性；每个条目是 name + schema + 槽位注解"
        item_fields:
          - name: name
            type: string
            required: true
            pattern: '^[a-z][a-z0-9_]*$'
            description: "属性名；对象内唯一"
          - name: schema
            types: [ scalar, object, array, ref ]
            required: true
            description: "属性值域"
          - name: required
            type: boolean
            description: "键是否必须出现；默认 false"
          - name: nullable
            type: boolean
            description: "值是否可为 null；默认 false"
          - name: default
            type: any
            description: "缺省值；仅槽位层"
          - name: read_only
            type: boolean
            description: "仅响应输出；默认 false"
          - name: write_only
            type: boolean
            description: "仅请求输入；默认 false"
          - name: description
            type: string
            required: true
            description: "属性说明"
      - name: validation
        type: list<object>
        required: false
        description: "对象级校验规则；每条 rule 是受限布尔表达式，引用 input.<属性名>"
        item_fields:
          - name: rule
            type: string
            required: true
            description: "受限布尔表达式；字段用 input.<属性名>，操作符 == != > >= < <= && || !"
          - name: message
            type: string
            required: true
            description: "违反规则时的错误文案"

  array:
    description: "数组节点；items 是元素值域"
    keys:
      - name: type
        type: string
        required: true
        description: "固定为 array"
      - name: items
        types: [ object, array, scalar, ref ]
        required: true
        description: "数组元素值域"
      - name: min_items
        type: integer
        min: 0
        description: "数组最小长度"
      - name: max_items
        type: integer
        min: 0
        description: "数组最大长度"
      - name: validation
        type: list<object>
        required: false
        description: "数组级校验规则；每条 rule 是受限布尔表达式，引用 value"
        item_fields:
          - name: rule
            type: string
            required: true
            description: "受限布尔表达式；数组节点引用 value"
          - name: message
            type: string
            required: true
            description: "违反规则时的错误文案"

  scalar:
    description: "标量节点；type 指向 _types 的 family 或自定义类型"
    keys:
      - name: type
        type: string
        required: true
        description: "标量类型"
      - name: validation
        type: list<object>
        required: false
        description: "标量级校验规则；每条 rule 是受限布尔表达式，引用 value"
        item_fields:
          - name: rule
            type: string
            required: true
            description: "受限布尔表达式；标量节点引用 value"
          - name: message
            type: string
            required: true
            description: "违反规则时的错误文案"

  ref:
    description: "引用节点；ref 指向 entity、enum 或本地 schema"
    keys:
      - name: ref
        type: string
        required: true
        description: "引用 entity / enum / 本地 schema"
      - name: validation
        type: list<object>
        required: false
        description: "引用级校验规则；每条 rule 是受限布尔表达式，引用 value 或 value.<path>"
        item_fields:
          - name: rule
            type: string
            required: true
            description: "受限布尔表达式；ref 节点引用 value 或 value.<path>"
          - name: message
            type: string
            required: true
            description: "违反规则时的错误文案"
