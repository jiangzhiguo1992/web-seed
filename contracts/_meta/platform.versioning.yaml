# API 版本与兼容策略；结构由 contract-check 校验。

id: meta.platform.versioning
type: platform.versioning
title: "版本与兼容策略"
targets:
  dir: "contracts/platform"
  glob: "versioning.yaml"
  id: "platform.versioning"
  naming: "snake_case"

fields:
  - name: schema_version
    type: _types.integer
    required: true
    const: 1
    description: "格式版本"
  - name: id
    type: _types.string
    required: true
    const: platform.versioning
    description: "契约 ID"
  - name: summary
    type: _types.string
    required: true
    description: "一句话说明"
  - name: stability
    type: _types.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"
  - name: do_not
    type: _types.set<_types.string>
    required: true
    unique: true
    description: "实例级负向约束"
  - name: api
    type: _types.any
    soft: true
    required: true
    description: "API 版本策略"
  - name: contract
    type: _types.any
    soft: true
    required: true
    description: "契约演进策略"
  - name: compatibility
    type: _types.any
    soft: true
    required: true
    description: "破坏性变更定义"
  - name: deprecation
    type: _types.any
    soft: true
    required: true
    description: "弃用流程"
  - name: detection
    type: _types.any
    soft: true
    required: true
    description: "兼容性检测"
  - name: client_requirements
    type: _types.list<_types.string>
    required: true
    min_items: 1
    description: "客户端要求"

rules:
  - { id: versioning-refs, text: "api.current 必须是 project.yaml 中已声明的 api_version；detection.command 为 make 目标时必须存在；deprecation.headers 必须已在 http_conventions 响应头登记；accepted_breaking_changes 的 id 唯一、scope 必须是 project.yaml 已声明的 api_version", implemented_by: [ versioning-refs ] }
