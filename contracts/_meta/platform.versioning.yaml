# API 版本、弃用与兼容策略。

id: meta.platform.versioning
contract: platform.versioning
title: "版本与兼容策略"
targets:
  dir: "contracts/platform"
  glob: "versioning.yaml"
  id: "platform.versioning"
  naming: "snake_case"

fields:
  - name: id
    type: _types.basics.string
    required: true
    const: platform.versioning
    description: "契约 ID"
  - name: summary
    type: _types.basics.string
    required: true
    description: "一句话说明"
  - name: schema_version
    type: _types.basics.integer.32
    required: true
    const: 1
    description: "格式版本"
  - name: stability
    type: _types.basics.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"
  - name: do_not
    type: _types.structures.set<_types.basics.string>
    required: true
    unique: true
    description: "实例级负向约束"
  - name: api
    type: _types.structures.object
    required: true
    description: "API 版本策略"
    fields:
      - { name: scheme, type: _types.basics.string, required: true, description: "版本方案" }
      - { name: current, type: _types.basics.string, required: true, pattern: '^v[0-9]+$', description: "当前主版本" }
      - name: stability_levels
        type: _types.structures.list<_types.structures.object>
        required: true
        min_items: 1
        description: "稳定性级别"
        item_fields:
          - { name: level, type: _types.basics.string, required: true, enum: [ experimental, stable, deprecated ], description: "级别" }
          - { name: note, type: _types.basics.string, required: true, description: "说明" }
  - name: contract
    type: _types.structures.object
    required: true
    description: "契约演进策略"
    fields:
      - { name: schema_version, type: _types.basics.integer.32, required: true, const: 1, description: "契约格式版本" }
      - { name: evolution, type: _types.basics.string, required: true, enum: [ additive_only ], description: "演进方式" }
  - name: compatibility
    type: _types.structures.object
    required: true
    description: "破坏性变更定义"
    fields:
      - name: accepted_breaking_changes
        type: _types.structures.list<_types.structures.object>
        required: true
        description: "已接受的破坏性变更"
        item_fields:
          - { name: id, type: _types.basics.string, required: true, description: "变更 ID" }
          - { name: baseline, type: _types.basics.string, required: true, description: "对比基线" }
          - { name: reason, type: _types.basics.string, required: true, description: "接受原因" }
          - { name: scope, type: _types.structures.list<_types.basics.string>, required: true, min_items: 1, pattern: '^v[0-9]+$', description: "影响版本" }
      - name: breaking_changes
        type: _types.structures.object
        required: true
        description: "破坏性变更判定"
        fields:
          - { name: definition, type: _types.structures.list<_types.basics.string>, required: true, min_items: 1, description: "判定项" }
          - { name: requires, type: _types.basics.string, required: true, enum: [ major_version_bump ], description: "处置方式" }
      - { name: non_breaking, type: _types.structures.list<_types.basics.string>, required: true, min_items: 1, description: "非破坏性变更" }
  - name: deprecation
    type: _types.structures.object
    required: true
    description: "弃用流程"
    fields:
      - { name: header_required, type: _types.basics.boolean, required: true, description: "是否强制弃用头" }
      - name: headers
        type: _types.structures.list<_types.structures.object>
        required: true
        min_items: 1
        description: "弃用响应头"
        item_fields:
          - { name: name, type: _types.basics.string, required: true, description: "header 名" }
          - { name: format, type: _types.basics.string, required: true, description: "header 值格式" }
          - { name: example, type: _types.basics.string, required: true, description: "示例值" }
      - { name: min_window_days, type: _types.basics.integer.32, required: true, min: 0, description: "最短弃用窗口" }
      - { name: process, type: _types.structures.list<_types.basics.string>, required: true, min_items: 1, description: "弃用步骤" }
  - name: detection
    type: _types.structures.object
    required: true
    description: "兼容性检测"
    fields:
      - { name: command, type: _types.basics.string, required: true, description: "检测命令" }
      - { name: baseline_command, type: _types.basics.string, required: true, description: "基线对比命令" }
      - { name: tool, type: _types.basics.string, required: true, description: "检测工具" }
      - { name: baseline, type: _types.basics.string, required: true, description: "基线引用" }
      - { name: fail_on, type: _types.structures.list<_types.basics.string>, required: true, min_items: 1, description: "失败条件" }
      - { name: note, type: _types.basics.string, required: true, description: "说明" }
  - name: client_requirements
    type: _types.structures.list<_types.basics.string>
    required: true
    min_items: 1
    description: "客户端要求"

rules:
  - { id: versioning-refs, text: "api.current 必须是某个 HTTP mount.api_version；detection.command 与 detection.baseline_command 为 make 目标时必须存在；deprecation.headers 必须已在 http_conventions 响应头登记，format 只允许 RFC9745/HTTP-date 且 example 必须匹配格式；accepted_breaking_changes 的 id 唯一、scope 必须是 HTTP mount.api_version", implemented_by: [ versioning-refs ] }
