# 类型元层：类型族、容器、schema 节点；项目自定义类型在 contracts/data/types.yaml。

id: meta.types
title: "统一类型注册表"

basics:
  string:
    description: "字符序列"
    params:
      min_len: { type: _types.basics.integer, required: false, min: 0, description: "最小长度" }
      max_len: { type: _types.basics.integer, required: false, min: 1, description: "最大长度" }
      fixed: { type: _types.basics.boolean, required: false, default: false, description: "定长" }
      pattern: { type: _types.basics.string, required: false, description: "写入前校验正则" }
      normalize: { type: _types.basics.string, required: false, enum: [ lower, upper ], description: "写入前归一" }
    types:
      string: { go: string, pg: [ text, varchar, char, character varying, character, bpchar, name ], ts: string }
  boolean:
    description: "布尔值"
    params: { }
    types:
      boolean: { go: bool, pg: [ boolean ], ts: boolean }
  integer:
    description: "整数；unsigned 只影响取值校验，不改变 Go/PG/TS 落型"
    params:
      bits: { type: _types.basics.integer, required: false, enum: [ 8, 16, 32, 64 ], default: 32, description: "位宽" }
      unsigned: { type: _types.basics.boolean, required: false, default: false, description: "无符号" }
      min: { type: _types.basics.integer, required: false, description: "下限" }
      max: { type: _types.basics.integer, required: false, description: "上限" }
    types:
      8: { go: int8, pg: [ smallint ], ts: number }
      16: { go: int16, pg: [ smallint, smallserial ], ts: number }
      32: { go: int32, pg: [ integer, serial ], ts: number }
      64: { go: int64, pg: [ bigint, bigserial ], ts: number }
  float:
    description: "浮点数"
    params:
      bits: { type: _types.basics.integer, required: false, enum: [ 32, 64 ], default: 64, description: "位宽" }
      min: { type: _types.basics.float, required: false, description: "下限" }
      max: { type: _types.basics.float, required: false, description: "上限" }
    types:
      32: { go: float32, pg: [ real ], ts: number }
      64: { go: float64, pg: [ double precision ], ts: number }
  decimal:
    description: "精确小数；Go 侧用 decimal.Decimal 承载，不使用 string 或 float"
    params:
      kind: { type: _types.basics.string, required: false, enum: [ numeric, money ], default: numeric, description: "数值类型" }
      precision: { type: _types.basics.integer, required: true, min: 1, examples: [ 19 ], description: "总位数" }
      scale: { type: _types.basics.integer, required: false, default: 0, min: 0, description: "小数位数" }
      min: { type: _types.basics.decimal, required: false, description: "下限" }
      max: { type: _types.basics.decimal, required: false, description: "上限" }
    types:
      decimal: { go: decimal.Decimal, pg: [ numeric, decimal, money ], ts: string }
  datetime:
    description: "日期/时间；mode 选择日期、时间或日期时间，timezone 控制时区"
    params:
      mode: { type: _types.basics.string, required: false, enum: [ date, time, datetime ], default: datetime, description: "模式" }
      timezone: { type: _types.basics.boolean, required: false, default: false, description: "带时区" }
    types:
      datetime: { go: time.Time, pg: [ date, time, timetz, timestamp, timestamptz ], ts: string }
  timestamp:
    description: "绝对时间点；timezone 控制是否带时区，fractional_seconds 控制小数秒"
    params:
      timezone: { type: _types.basics.boolean, required: false, default: true, description: "带时区" }
      fractional_seconds: { type: _types.basics.integer, required: false, default: 6, min: 0, max: 9, description: "小数秒精度" }
    types:
      timestamp: { go: time.Time, pg: [ timestamp, timestamptz ], ts: string }
  json:
    description: "JSON 文档；kind 选择 json 或 jsonb"
    params:
      kind: { type: _types.basics.string, required: false, enum: [ json, jsonb ], default: jsonb, description: "JSON 类型" }
    types:
      json: { go: json.RawMessage, pg: [ json, jsonb ], ts: unknown }
  jsonpath:
    description: "JSON 路径表达式"
    params: { }
    types:
      jsonpath: { go: string, pg: [ jsonpath ], ts: string }
  bytes:
    description: "二进制"
    params:
      min_len: { type: _types.basics.integer, required: false, min: 0, description: "最小长度" }
      max_len: { type: _types.basics.integer, required: false, min: 1, description: "最大长度" }
      fixed: { type: _types.basics.boolean, required: false, default: false, description: "定长" }
    types:
      bytes: { go: "[]byte", pg: [ bytea ], ts: string }
  any:
    description: "任意值；用于无法静态建模的字段；没有确定性存储落型"
    params: { }
    types:
      any: { go: any, pg: [ ], ts: unknown }
  uuid:
    description: "UUID"
    params: { }
    types:
      uuid: { go: string, pg: [ uuid ], ts: string }
  interval:
    description: "时间间隔"
    params: { }
    types:
      interval: { go: time.Duration, pg: [ interval ], ts: string }
  network:
    description: "网络地址；kind 选择 inet、cidr 或 MAC 类型"
    params:
      kind: { type: _types.basics.string, required: false, enum: [ inet, cidr, macaddr, macaddr8 ], default: inet, description: "网络类型" }
    types:
      network: { go: string, pg: [ inet, cidr, macaddr, macaddr8 ], ts: string }
  bit:
    description: "位串；kind 选择定长 bit 或变长 varbit"
    params:
      kind: { type: _types.basics.string, required: false, enum: [ bit, varbit ], default: varbit, description: "位串类型" }
    types:
      bit: { go: string, pg: [ bit, varbit ], ts: string }
  textsearch:
    description: "全文检索类型；kind 选择 tsvector 或 tsquery"
    params:
      kind: { type: _types.basics.string, required: false, enum: [ tsvector, tsquery ], default: tsvector, description: "检索类型" }
    types:
      textsearch: { go: string, pg: [ tsvector, tsquery ], ts: string }
  xml:
    description: "XML 文档"
    params: { }
    types:
      xml: { go: string, pg: [ xml ], ts: string }
  geometry:
    description: "几何类型；kind 选择 PostgreSQL 几何类型"
    params:
      kind: { type: _types.basics.string, required: false, enum: [ point, line, lseg, box, path, polygon, circle ], default: point, description: "几何类型" }
    types:
      geometry: { go: string, pg: [ point, line, lseg, box, path, polygon, circle ], ts: string }
  range:
    description: "范围类型；kind 选择 PostgreSQL 范围类型"
    params:
      kind: { type: _types.basics.string, required: false, enum: [ int4range, int8range, numrange, tsrange, tstzrange, daterange ], default: int4range, description: "范围类型" }
    types:
      range: { go: string, pg: [ int4range, int8range, numrange, tsrange, tstzrange, daterange ], ts: string }
  multirange:
    description: "多范围类型；kind 选择 PostgreSQL 多范围类型"
    params:
      kind: { type: _types.basics.string, required: false, enum: [ int4multirange, int8multirange, nummultirange, tsmultirange, tstzmultirange, datemultirange ], default: int4multirange, description: "多范围类型" }
    types:
      multirange: { go: string, pg: [ int4multirange, int8multirange, nummultirange, tsmultirange, tstzmultirange, datemultirange ], ts: string }
  oid:
    description: "对象标识；kind 选择 PostgreSQL OID/reg* 类型"
    params:
      kind: { type: _types.basics.string, required: false, enum: [ oid, regproc, regprocedure, regoper, regoperator, regclass, regcollation, regtype, regrole, regnamespace, regconfig, regdictionary ], default: oid, description: "OID 类型" }
    types:
      oid: { go: uint32, pg: [ oid, regproc, regprocedure, regoper, regoperator, regclass, regcollation, regtype, regrole, regnamespace, regconfig, regdictionary ], ts: number }
  pg_lsn:
    description: "PostgreSQL WAL 日志序列号"
    params: { }
    types:
      pg_lsn: { go: string, pg: [ pg_lsn ], ts: string }

structures:
  list:
    description: "有序、可重复、变长列表"
    fields:
      - { name: item, type: "*", required: true, description: "元素" }
    params:
      min_items: { type: _types.basics.integer, required: false, min: 0, description: "最小元素数" }
      max_items: { type: _types.basics.integer, required: false, min: 1, description: "最大元素数" }
  set:
    description: "无序、去重集合"
    fields:
      - { name: item, type: "*", required: true, description: "元素" }
    params:
      min_items: { type: _types.basics.integer, required: false, min: 0, description: "最小元素数" }
      max_items: { type: _types.basics.integer, required: false, min: 1, description: "最大元素数" }
  array:
    description: "定长有序数组；元素类型固定"
    fields:
      - { name: item, type: "*", required: true, description: "元素" }
    params:
      len: { type: _types.basics.integer, required: true, min: 1, description: "数组长度" }
  map:
    description: "键值映射；键固定为 string 或 integer"
    fields:
      - { name: key, type: "*", required: true, enum: [ string, integer ], description: "键；string 或 integer" }
      - { name: value, type: "*", required: true, description: "值；任意 _types 类型" }
    params:
      min_items: { type: _types.basics.integer, required: false, min: 0, description: "最小键数" }
      max_items: { type: _types.basics.integer, required: false, min: 1, description: "最大键数" }
      key_patterns: { type: _types.structures.list<_types.basics.string>, required: false, description: "string key 的正则列表；全部匹配" }
  object:
    description: "固定键对象；字段由 fields/item_fields 定义"
    params: { }

schemas:
  object:
    description: "对象节点；properties 是属性条目"
    keys:
      - name: type
        type: _types.basics.string
        required: true
        const: _types.schemas.object
        description: "固定为 _types.schemas.object"
      - name: properties
        type: _types.structures.list<_types.structures.object>
        required: true
        unique_key: name
        description: "对象属性条目"
        item_fields:
          - name: name
            type: _types.basics.string
            required: true
            pattern: '^[a-z][a-z0-9_]*$'
            description: "属性名"
          - name: schema
            types: [ _types.schemas.* ]
            required: true
            description: "属性值域"
          - name: required
            type: _types.basics.boolean
            description: "键是否必须出现"
          - name: nullable
            type: _types.basics.boolean
            description: "值是否可为 null"
          - name: default
            type: _types.basics.any
            description: "缺省值；仅槽位层"
          - name: read_only
            type: _types.basics.boolean
            description: "仅响应输出"
          - name: write_only
            type: _types.basics.boolean
            description: "仅请求输入"
          - name: description
            type: _types.basics.string
            required: true
            description: "属性说明"
      - name: validation
        type: _types.structures.list<_types.structures.object>
        required: false
        description: "对象级校验规则"
        item_fields:
          - name: rule
            type: _types.basics.string
            required: true
            description: "受限布尔表达式；字段用 input.<属性名>，操作符 == != > >= < <= && || !"
          - name: message
            type: _types.basics.string
            required: true
            description: "违反规则时的错误文案"

  array:
    description: "数组节点；items 是元素值域"
    keys:
      - name: type
        type: _types.basics.string
        required: true
        const: _types.schemas.array
        description: "固定为 _types.schemas.array"
      - name: items
        types: [ _types.schemas.* ]
        required: true
        description: "数组元素值域"
      - name: min_items
        type: _types.basics.integer
        min: 0
        description: "数组最小长度"
      - name: max_items
        type: _types.basics.integer
        min: 0
        description: "数组最大长度"
      - name: validation
        type: _types.structures.list<_types.structures.object>
        required: false
        description: "数组级校验规则"
        item_fields:
          - name: rule
            type: _types.basics.string
            required: true
            description: "受限布尔表达式；引用 value"
          - name: message
            type: _types.basics.string
            required: true
            description: "违反规则时的错误文案"

  map:
    description: "映射节点；键固定为 string（JSON 对象键），values 是值域；integer key 用 _types.structures.map，不进入 schema 节点"
    keys:
      - name: type
        type: _types.basics.string
        required: true
        const: _types.schemas.map
        description: "固定为 _types.schemas.map"
      - name: values
        types: [ _types.schemas.* ]
        required: true
        description: "映射值域；键固定为 string"
      - name: min_items
        type: _types.basics.integer
        min: 0
        description: "映射最小键数"
      - name: max_items
        type: _types.basics.integer
        min: 0
        description: "映射最大键数"
      - name: key_patterns
        type: _types.structures.list<_types.basics.string>
        required: false
        min_items: 1
        unique: true
        description: "string key 的正则列表；全部匹配"
      - name: validation
        type: _types.structures.list<_types.structures.object>
        required: false
        description: "映射级校验规则"
        item_fields:
          - name: rule
            type: _types.basics.string
            required: true
            description: "受限布尔表达式；引用 value"
          - name: message
            type: _types.basics.string
            required: true
            description: "违反规则时的错误文案"

  scalar:
    description: "标量节点；type 指向 _types.basics.*（类型族或 data/types.yaml 自定义类型）"
    keys:
      - name: type
        type: _types.basics.string
        required: true
        pattern: '^_types\.basics\.[a-z][a-z0-9_]*(\.[a-z0-9_]+)?$'
        description: "值类型引用 _types.basics.<name>"
      - name: validation
        type: _types.structures.list<_types.structures.object>
        required: false
        description: "标量级校验规则"
        item_fields:
          - name: rule
            type: _types.basics.string
            required: true
            description: "受限布尔表达式；引用 value"
          - name: message
            type: _types.basics.string
            required: true
            description: "违反规则时的错误文案"

  ref:
    description: "引用节点；ref 指向 entity、enum 或全限定本地 schema"
    keys:
      - name: ref
        type: _types.basics.string
        required: true
        pattern: '^(data\.(entities|enums)\.[a-z][a-z0-9_]*|cap\.services\.[a-z][a-z0-9_]*\.schemas\.[A-Za-z][A-Za-z0-9]*)$'
        description: "全限定引用：data.entities.* / data.enums.* / cap.services.<file>.schemas.<Type>"
      - name: validation
        type: _types.structures.list<_types.structures.object>
        required: false
        description: "引用级校验规则"
        item_fields:
          - name: rule
            type: _types.basics.string
            required: true
            description: "受限布尔表达式；引用 value 或 value.<path>"
          - name: message
            type: _types.basics.string
            required: true
            description: "违反规则时的错误文案"

# 类型词汇审计的显式例外；例外之外出现裸 object/array/map 或未知 _types.* 一律失败。
type_vocabulary:
  exceptions:
    - { path: contracts/_meta, kind: dir, reason: "契约元层：顶层 type 是契约类型，字段 type 由 _meta 校验" }
    - { path: contracts/generated, kind: dir, reason: "生成产物：OpenAPI 使用 JSON Schema 外部词汇" }
    - { path: contracts/capabilities/protocols/http, kind: dir, reason: "完整 OpenAPI 3.1：type: object/array 是外部词汇" }
    - { path: contracts/platform/http_conventions.yaml, kind: file, reason: "平台 HTTP 组件：components 直接使用 OpenAPI 3.1 JSON Schema 词汇" }
    - { path: contracts/index.yaml, kind: file, reason: "契约注册表：不含 schema 节点" }
    - { path: contracts/project.yaml, kind: file, reason: "项目元数据：不含 schema 节点" }

# 每个类型族参数的消费方：openapi=生成到 OpenAPI，storage=仅存储层，runtime=业务运行时。
param_targets:
  min_len: openapi
  max_len: openapi
  pattern: openapi
  min: openapi
  max: openapi
  default: openapi
  fixed: storage
  normalize: runtime
  bits: storage
  unsigned: storage
  precision: storage
  scale: storage
  mode: storage
  timezone: storage
  fractional_seconds: storage
  kind: storage
