# 类型元层：类型族、容器、schema 节点；项目自定义类型在 contracts/data/types.yaml。

id: meta.types
title: "统一类型注册表"

commons:
  basics_params:
    default:
      type: _types.basics.any
      required: false
      description: "缺省值；值域必须与所属类型族兼容"

basics:
  bytes:
    description: "二进制"
    params:
      fixed: { type: _types.basics.boolean, required: false, default: false, description: "定长" }
      min_len: { type: _types.basics.integer.32, required: false, min: 0, description: "最小长度" }
      max_len: { type: _types.basics.integer.32, required: false, min: 1, description: "最大长度" }
    types:
      bytes: { go: "[]byte", pg: [ bytea ], ts: string }
  bit:
    description: "位串；kind 选择定长 bit 或变长 varbit，length 指定位数；Go 用 math/big.Int，按数值位解释，不保留前导 0"
    params:
      kind: { type: _types.basics.string, required: false, enum: [ bit, varbit ], default: varbit, description: "位串类型" }
      length: { type: _types.basics.integer.32, required: false, min: 1, description: "位数；kind=bit 时应声明" }
    types:
      bit: { go: big.Int, pg: [ bit, varbit ], ts: number }
  string:
    description: "字符序列；kind 选择 text 或全文检索类型；fixed:true + max_len 用 char，其余用 text"
    params:
      kind: { type: _types.basics.string, required: false, enum: [ text, tsvector, tsquery ], default: text, description: "字符存储类型" }
      fixed: { type: _types.basics.boolean, required: false, default: false, description: "定长" }
      min_len: { type: _types.basics.integer.32, required: false, min: 0, description: "最小长度" }
      max_len: { type: _types.basics.integer.32, required: false, min: 1, description: "最大长度" }
      pattern: { type: _types.basics.string, required: false, description: "写入前校验正则" }
      normalize: { type: _types.basics.string, required: false, enum: [ lower, upper ], description: "写入前归一" }
    types:
      string: { go: string, pg: [ text, char, tsvector, tsquery ], ts: string }
  boolean:
    description: "布尔值"
    params: { }
    types:
      boolean: { go: bool, pg: [ boolean ], ts: boolean }
  integer:
    description: "整数；位宽由类型引用的 variant 决定（integer.8/16/32/64），unsigned 不存在；auto_increment 只允许出现在表列，选择 PostgreSQL smallserial/serial/bigserial"
    params:
      auto_increment: { type: _types.basics.boolean, required: false, default: false, description: "PostgreSQL 自增（smallserial/serial/bigserial）；仅表列可用，与 default/default_sql 互斥且要求 nullable:false" }
      min: { type: _types.basics.integer.64, required: false, description: "下限" }
      max: { type: _types.basics.integer.64, required: false, description: "上限" }
    types:
      8: { go: int8, pg: [ smallint ], ts: number }
      16: { go: int16, pg: [ smallint, smallserial ], ts: number }
      32: { go: int32, pg: [ integer, serial ], ts: number }
      64: { go: int64, pg: [ bigint, bigserial ], ts: number }
  float:
    description: "浮点数；位宽由类型引用的 variant 决定（float.32/64）"
    params:
      min: { type: _types.basics.float.64, required: false, description: "下限" }
      max: { type: _types.basics.float.64, required: false, description: "上限" }
    types:
      32: { go: float32, pg: [ real ], ts: number }
      64: { go: float64, pg: [ double precision ], ts: number }
  decimal:
    description: "精确小数；Go 用 shopspring/decimal，JSON 为 number（超过 2^53 的整数需业务侧注意）"
    params:
      precision: { type: _types.basics.integer.32, required: true, min: 1, examples: [ 19 ], description: "总位数" }
      scale: { type: _types.basics.integer.32, required: false, default: 0, min: 0, description: "小数位数" }
      min: { type: _types.basics.decimal, required: false, description: "下限" }
      max: { type: _types.basics.decimal, required: false, description: "上限" }
    types:
      decimal: { go: decimal.Decimal, pg: [ numeric ], ts: number }
  datetime:
    description: "日期/时间；mode 选择日期、时间或日期时间，timezone 带时区，time 不带时区"
    params:
      mode: { type: _types.basics.string, required: false, enum: [ date, time, datetime ], default: datetime, description: "模式" }
    types:
      timezone: { go: time.Time, pg: [ date, timetz, timestamptz ], ts: string }
      time: { go: time.Time, pg: [ date, time, timestamp ], ts: string }
  timestamp:
    description: "绝对时间点；time 带时区（timestamptz），long 不带时区（timestamp），fractional_seconds 控制小数秒"
    params:
      fractional_seconds: { type: _types.basics.integer.32, required: false, default: 6, min: 0, max: 9, description: "小数秒精度" }
    types:
      time: { go: time.Time, pg: [ timestamptz ], ts: string }
      long: { go: int64, pg: [ timestamp ], ts: number }
  json:
    description: "JSON 文档；kind 选择 json 或 jsonb"
    params:
      kind: { type: _types.basics.string, required: false, enum: [ json, jsonb ], default: jsonb, description: "JSON 类型" }
    types:
      json: { go: json.RawMessage, pg: [ json, jsonb ], ts: unknown }
  xml:
    description: "XML 文档；Go 用 map[string]any 表示，序列化由 repository 用 encoding/xml 适配"
    params: { }
    types:
      xml: { go: "map[string]any", pg: [ xml ], ts: unknown }
  any:
    description: "任意值；具体 apps 实现时再决定落型，契约不约束"
    params: { }

structures:
  list:
    description: "有序、可重复、变长列表"
    fields:
      - { name: item, type: "*", required: true, description: "元素" }
    params:
      min_items: { type: _types.basics.integer.32, required: false, min: 0, description: "最小元素数" }
      max_items: { type: _types.basics.integer.32, required: false, min: 1, description: "最大元素数" }
  set:
    description: "无序、去重集合"
    fields:
      - { name: item, type: "*", required: true, description: "元素" }
    params:
      min_items: { type: _types.basics.integer.32, required: false, min: 0, description: "最小元素数" }
      max_items: { type: _types.basics.integer.32, required: false, min: 1, description: "最大元素数" }
  array:
    description: "定长有序数组；元素类型固定"
    fields:
      - { name: item, type: "*", required: true, description: "元素" }
    params:
      len: { type: _types.basics.integer.32, required: true, min: 1, description: "数组长度" }
  map:
    description: "键值映射；键固定为 string 或 integer"
    fields:
      - { name: key, type: "*", required: true, enum: [ string, integer ], description: "键；string 或 integer" }
      - { name: value, type: "*", required: true, description: "值；任意 _types 类型" }
    params:
      min_items: { type: _types.basics.integer.32, required: false, min: 0, description: "最小键数" }
      max_items: { type: _types.basics.integer.32, required: false, min: 1, description: "最大键数" }
      key_patterns: { type: _types.structures.list<_types.basics.string>, required: false, description: "string key 的正则列表；全部匹配" }
  object:
    description: "固定键对象；字段由 fields/item_fields 定义"
    params: { }

schemas:
  object:
    description: "对象节点；properties 是属性条目"
    keys:
      - name: kind
        type: _types.basics.string
        required: true
        const: _types.schemas.object
        description: "固定为 _types.schemas.object"
      - name: properties
        type: _types.structures.list<_types.structures.object>
        required: true
        unique_key: name
        description: "对象属性条目"
        item_fields:
          - name: name
            type: _types.basics.string
            required: true
            pattern: '^[a-z][a-z0-9_]*$'
            description: "属性名"
          - name: schema
            types: [ _types.schemas.* ]
            required: true
            description: "属性值域"
          - name: required
            type: _types.basics.boolean
            description: "键是否必须出现"
          - name: nullable
            type: _types.basics.boolean
            description: "值是否可为 null"
          - name: default
            type: _types.basics.any
            description: "缺省值；仅槽位层"
          - name: read_only
            type: _types.basics.boolean
            description: "仅响应输出"
          - name: write_only
            type: _types.basics.boolean
            description: "仅请求输入"
          - name: description
            type: _types.basics.string
            required: true
            description: "属性说明"
      - name: validation
        type: _types.structures.list<_types.structures.object>
        required: false
        description: "对象级校验规则"
        item_fields:
          - name: rule
            type: _types.basics.string
            required: true
            description: "受限布尔表达式；字段用 input.<属性名>，操作符 == != > >= < <= && || !"
          - name: message
            type: _types.basics.string
            required: true
            description: "违反规则时的错误文案"

  array:
    description: "数组节点；items 是元素值域"
    keys:
      - name: kind
        type: _types.basics.string
        required: true
        const: _types.schemas.array
        description: "固定为 _types.schemas.array"
      - name: items
        types: [ _types.schemas.* ]
        required: true
        description: "数组元素值域"
      - name: min_items
        type: _types.basics.integer.32
        min: 0
        description: "数组最小长度"
      - name: max_items
        type: _types.basics.integer.32
        min: 0
        description: "数组最大长度"
      - name: validation
        type: _types.structures.list<_types.structures.object>
        required: false
        description: "数组级校验规则"
        item_fields: &value_validation
          - name: rule
            type: _types.basics.string
            required: true
            description: "受限布尔表达式；array/map/scalar 引用 value，ref 可引用 value.<path>"
          - name: message
            type: _types.basics.string
            required: true
            description: "违反规则时的错误文案"

  map:
    description: "映射节点；键固定为 string（JSON 对象键），values 是值域；integer key 用 _types.structures.map，不进入 schema 节点"
    keys:
      - name: kind
        type: _types.basics.string
        required: true
        const: _types.schemas.map
        description: "固定为 _types.schemas.map"
      - name: values
        types: [ _types.schemas.* ]
        required: true
        description: "映射值域；键固定为 string"
      - name: min_items
        type: _types.basics.integer.32
        min: 0
        description: "映射最小键数"
      - name: max_items
        type: _types.basics.integer.32
        min: 0
        description: "映射最大键数"
      - name: key_patterns
        type: _types.structures.list<_types.basics.string>
        required: false
        min_items: 1
        unique: true
        description: "string key 的正则列表；全部匹配"
      - name: validation
        type: _types.structures.list<_types.structures.object>
        required: false
        description: "映射级校验规则"
        item_fields: *value_validation

  scalar:
    description: "标量节点；type 指向 _types.basics.*（类型族或 data/types.yaml 自定义类型）"
    keys:
      - name: type
        type: _types.basics.string
        required: true
        pattern: '^_types\.basics\.[a-z][a-z0-9_]*(\.[a-z0-9_]+)?$'
        description: "值类型引用 _types.basics.<name>"
      - name: validation
        type: _types.structures.list<_types.structures.object>
        required: false
        description: "标量级校验规则"
        item_fields: *value_validation

  ref:
    description: "引用节点；type 指向 entity、enum 或全限定本地 schema"
    keys:
      - name: type
        type: _types.basics.string
        required: true
        pattern: '^(data\.(entities|enums)\.[a-z][a-z0-9_]*|cap\.services\.[a-z][a-z0-9_]*\.schemas\.[A-Za-z][A-Za-z0-9]*)$'
        description: "全限定引用：data.entities.* / data.enums.* / cap.services.<file>.schemas.<Type>"
      - name: validation
        type: _types.structures.list<_types.structures.object>
        required: false
        description: "引用级校验规则"
        item_fields: *value_validation

