# 共享值类型：类型族 + 参数；tables/entities/queries 共用。

id: meta.types
title: "共享值类型"

column_types:
  families:
    string:
      description: "字符序列"
      params:
        min_len: { type: integer, required: false, min: 0, description: "最小长度" }
        max_len: { type: integer, required: false, min: 1, description: "最大长度" }
        fixed: { type: boolean, required: false, default: false, description: "定长" }
        pattern: { type: string, required: false, description: "写入前校验正则" }
        normalize: { type: string, required: false, enum: [ lower, upper ], description: "写入前归一" }
    boolean:
      description: "布尔值"
      params: { }
    integer:
      description: "整数"
      params:
        bits: { type: integer, required: false, enum: [ 8, 16, 32, 64 ], default: 64, description: "位宽" }
        unsigned: { type: boolean, required: false, default: false, description: "无符号" }
        min: { type: integer, required: false, description: "下限" }
        max: { type: integer, required: false, description: "上限" }
    float:
      description: "浮点数"
      params:
        bits: { type: integer, required: false, enum: [ 32, 64 ], default: 64, description: "位宽" }
        min: { type: float, required: false, description: "下限" }
        max: { type: float, required: false, description: "上限" }
    decimal:
      description: "精确小数"
      params:
        precision: { type: integer, required: true, min: 1, examples: [ 19 ], description: "总位数" }
        scale: { type: integer, required: false, default: 0, min: 0, description: "小数位数" }
        min: { type: decimal, required: false, description: "下限" }
        max: { type: decimal, required: false, description: "上限" }
    datetime:
      description: "日期/时间"
      params:
        mode: { type: string, required: false, enum: [ date, time, datetime ], default: datetime, description: "模式" }
        timezone: { type: boolean, required: false, default: false, description: "带时区" }
    timestamp:
      description: "绝对时间点"
      params:
        timezone: { type: boolean, required: false, default: true, description: "带时区" }
        fractional_seconds: { type: integer, required: false, default: 6, min: 0, max: 9, description: "小数秒精度" }
    json:
      description: "JSON 文档"
      params:
        binary: { type: boolean, required: false, default: false, description: "使用 jsonb" }
    bytes:
      description: "二进制"
      params:
        min_len: { type: integer, required: false, min: 0, description: "最小长度" }
        max_len: { type: integer, required: false, min: 1, description: "最大长度" }
        fixed: { type: boolean, required: false, default: false, description: "定长" }
