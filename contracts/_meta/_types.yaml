# 契约类型默认值
#
# 每类契约的默认元数据。文件只需写实例差异，不重复类型级配置。
# 生效值 = 本文件 + 文件正文覆盖。

schema_version: 1

# 所有契约类型共享的字段节点语义。
# 该段是文档与 AI 入口；硬约束的实现仍在 scripts/cmd/internal/check。
schema_semantics:
  hard_fields: [name, type, required, enum, allowed, pattern, const, unique, min, max, fields, item_fields]
  soft_fields: [description, caution, generates, examples, default, generated, write, title, targets, rules]
  required: "契约必须显式声明；缺失即校验失败"
  default: "required 字段上只影响 contract-new 骨架；optional 字段上表示省略时的语义默认值；contract-check 不补值"
  stability: "draft/stable/deprecated 可双向流转；stable 文件不得含 TODO/FIXME"
  rules: "规则清单；每条规则必须写 implemented_by，指向 checker 实际输出的 [rule-id]"
  quote: "contracts 下文本字段（description/comment/summary/do_not 等）必须使用双引号"

# targets 的结构；checker 与 contract-new 共用。
target_semantics:
  dir: "扫描目录"
  glob: "文件 glob"
  file: "单文件契约的固定路径"
  id: "实例 ID 模板，<file> 替换为文件 stem；单例契约直接写固定 ID"
  naming: "文件名规则；当前支持 snake_case"
  exception: "显式 {file, id, kind} 例外；kind: base 标记基类"

# 跨类型通用的规则；表/实体等专有规则留在各自的 _meta/<type>.yaml。
schema_rules:
  - { id: id-from-file, text: "契约 id 必须等于 targets.id 模板（<file> 替换为文件 stem）；例外按 targets.exception", implemented_by: [id-from-file] }
  - { id: contract-id-unique, text: "契约 ID 全局唯一", implemented_by: [contract-id-unique] }
  - { id: unique-names, text: "同一契约内 name 不重复", implemented_by: [unique-names] }
  - { id: default-vs-default-sql, text: "default 与 default_sql 互斥", implemented_by: [default-vs-default-sql] }
  - { id: default-type, text: "default 的类型、长度、范围必须与字段类型兼容", implemented_by: [default-type] }
  - { id: primary-key-nullable, text: "primary_key: true 的字段不得 nullable: true", implemented_by: [primary-key-nullable] }
  - { id: do-not-specific, text: "do_not 每条必须含本实例标识，不得写类型级通用规则", implemented_by: [do-not-specific] }

# 类型由 ID 前两段推导：data.tables.account → data.tables
# platform 组统一映射为 platform.*
types:
  data.tables.base:
    enforcement: generated
    consumers: [tools]
    generates: []
    do_not:
      - "本文件不是物理表：不生成 DDL、不建实体、不落存储"
      - "物理表必须 extends: [data.tables.base]"
      - "不要给基类加业务字段"
      - "基类 5 列不得改名或删除"

  data.tables:
    enforcement: generated+tested
    consumers: [api]
    generates: [schema_sql, migrations, sqlc]
    schema: contracts/_meta/data.tables.yaml
    check: make contract-check
    do_not:
      - "不要手写 migrations，改本文件后运行 make gen-db"
      - "物理表必须 extends: [data.tables.base]；不得重复声明 id/created_at/updated_at/deleted_at；status 必须重声明为 integer"
      - "不要绕过软删过滤（deleted_at IS NULL）"
      - "UNIQUE 约束包含软删行；需软删后复用时用 indexes[].unique + where: deleted_at IS NULL"
      - "禁止数据库外键（foreign_key）；跨表一致性由应用/业务规则保证"
      - "表列不引用 data.enums.*；状态整数码用 integer，由 entity 映射为枚举"
      - "不要用未结构化字段塞原生 DDL；分区用 table.partition，表达式索引用 indexes[].expression"
      - "used_by 是生成物，禁止手改；queries 记录查询项 ID，不是查询文件 ID"
      - "只有 owner_module 相同的 cap.services/cap.async 可以写表；跨模块读通过 persistence.queries"
      - "never_expose 列禁止进入普通 OpenAPI/TS/事件/普通 entity；认证 query 与 x-auth-response 是唯一例外"

  data.queries:
    enforcement: generated+tested
    consumers: [api]
    generates: [queries_sql, sqlc]
    do_not:
      - "每个 query 必须有显式 id：data.queries.<module>.<query_id>"
      - "每个 query 必须声明 table 或 tables，供图校验推导血缘"
      - "不要在 repo 层手写 SQL"
      - "不要写 SELECT *；敏感表必须用 return_columns 显式列出返回列"
      - "nullable 参数在 SQL 中使用 sqlc.narg('name')"

  data.entities:
    enforcement: generated+tested
    consumers: [api, web/admin]
    generates: [go_type, ts_type]
    do_not:
      - "不要在实体文件里写 DDL（物理结构在 data/tables）"
      - "不要写状态机、业务规则（属于 business）"
      - "数据库表达不了的复杂校验写在 validation，不要搬到 tables"
      - "实体必须用 table: data.tables.<file> 指回物理表"
      - "不要引用 business.*"

  data.enums:
    enforcement: generated
    consumers: [api, web/admin, worker]
    generates: [go_constants, ts_union]
    schema: contracts/_meta/data.enums.yaml
    check: make contract-check
    do_not:
      - "枚举值只能追加，禁止改名或删除；code 一旦分配不得复用或修改"
      - "每个枚举项必须有显式 id：data.enums.<name>"
      - "不要收模块内部枚举"

  data.storage:
    enforcement: tested
    consumers: [api, worker, ops]
    generates: []
    do_not:
      - "存储引擎只在本文件定义，禁止在 tables 里逐表声明 engine"
      - "未列出的引擎与拓扑一律视为不支持"
      - "Redis 不是表存储"

  data.policy:
    enforcement: generated
    consumers: [tools]

  cap.http:
    enforcement: generated+tested
    consumers: [api, web/admin]
    generates: [openapi_merged, go_server, ts_client]
    do_not:
      - "不要在 handler 里直接读 r.URL.Query()"
      - "不要逐接口重复声明默认错误响应"
      - "响应 schema 必须 additionalProperties: false"
      - "不要写 business.rules.* 或 business.events.*（由 business 侧锚点）"
      - "每个 operation 必须写 x-contract-id 与 x-service"
      - "字段长度/枚举以 data 契约为准；手写值只用于 OpenAPI 展开"

  cap.async:
    enforcement: generated+tested
    consumers: [worker]
    generates: [job_skeleton]
    do_not:
      - "五要素必须齐全：trigger / input / output / idempotency / retry"
      - "不要引用 business.*"
      - "不要在任务里写业务规则，引用 business.rules.*"
      - "多实例部署时必须声明分布式锁"

  cap.services:
    enforcement: generated+tested
    consumers: [api]
    generates: [go_interface, mock]
    do_not:
      - "只登记跨模块调用的方法"
      - "不要在 interface 里暴露 *pgx.Tx 或 HTTP 类型"
      - "必须声明 persistence（表、字段映射、查询、约束错误映射）"
      - "跨模块读通过 persistence.queries；写表必须属于 owner_module"
      - "不要引用 business.*（规则/事件由 business 侧锚点）"
      - "返回 data.entities.*，不要返回表行 data.tables.*.row"
      - "field_map 只写命名不同的字段，同名不写"
      - "数据库约束到业务错误的映射写在 constraint_errors，不要写 constraint_map"

  business.states:
    enforcement: generated+tested
    consumers: [api, web/admin]
    generates: [state_constants, transition_table, tests]
    do_not:
      - "不要在 handler/service 手写状态判断"
      - "不要新增状态而不更新转换表"
      - "非法转换清单必须与 transitions 同步维护"
      - "archived 与 deleted 不可混用"

  business.rules:
    enforcement: tested
    consumers: [api]
    generates: [test_skeleton]
    do_not:
      - "不要写没有 given/when/then 的规则"
      - "不要在 handler 里复制规则逻辑"
      - "每条规则必须声明 implemented_by，否则视为未实现"

  cap.flows:
    enforcement: tested
    consumers: [api]
    do_not:
      - "只编排，不写调用代码"
      - "流程编排属于实现层，不要放回 business"
      - "只允许引用 business.states/rules/events 进行编排，不要复制规则逻辑"

  business.events:
    enforcement: generated+tested
    consumers: [api, worker]
    generates: [event_constants, payload_types]
    do_not:
      - "不要在事件里放 PII"
      - "破坏兼容必须升 version"
      - "payload 字段只能是 data.entities.* 字段的子集"
      - "不要写 trigger 反向引用能力（由 capabilities 的 emits 声明）"

  business.glossary:
    enforcement: review-only
    consumers: [ai, api, web/admin]
    do_not:
      - "术语表是唯一命名来源；代码、契约、UI 文案必须一致"
      - "不要在本文件写实现细节"

  feature.routes:
    enforcement: generated
    consumers: [web/admin]
    generates: [router, menu]
    do_not:
      - "不要手写路由表"
      - "不要在路由 meta 硬编码权限字符串"

  feature.pages:
    enforcement: generated+tested
    consumers: [web/admin]
    generates: [page_skeleton, types, tests]
    do_not:
      - "不要手写 URL，必须引用 capability"
      - "四态（loading/empty/error/forbidden）缺一不可"
      - "禁止引用 data.*"

  feature.flows:
    enforcement: tested
    consumers: [web/admin]
    do_not:
      - "只描述界面步骤与结果，不写实现"

  platform.*:
    enforcement: tested
    consumers: [tools, api, web/admin]
    do_not:
      - "不要绕过本契约直接写常量"
      - "新增字段必须登记，否则 CI 警告"
