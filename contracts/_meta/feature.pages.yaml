# 页面契约；结构性引用由 checker 校验，UI/文案是软区。

id: meta.feature.pages
type: feature.pages
title: "页面契约"
targets:
  dir: "contracts/features/pages"
  glob: "*.yaml"
  id: "feature.pages.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: _types.string
    required: true
    pattern: '^feature\.pages\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: _types.string
    required: true
    description: "一句话说明"

  - name: schema_version
    type: _types.integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: _types.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.set<_types.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: page
    type: _types.string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "页面名"

  - name: route
    type: _types.string
    required: false
    pattern: '^feature\.routes\.[a-z][a-z0-9_]*$'
    description: "路由 ID；无路由时为 null"

  - name: data
    type: _types.map<_types.object>
    required: false
    key_patterns: [ '^[a-z][a-z0-9_]*$' ]
    description: "数据源映射"
    item_fields:
      - { name: capability, type: _types.string, required: true, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "数据源 service ID" }
      - name: params
        type: _types.map<_types.object>
        required: false
        key_patterns: [ '^[a-z][a-z0-9_]*$' ]
        description: "参数映射"
        item_fields:
          - { name: from, type: _types.string, required: true, description: "取值来源" }
          - { name: type, type: _types.string, required: false, description: "值类型" }
          - { name: enum, type: _types.any, required: false, description: "枚举来源或字面量列表" }
          - { name: required, type: _types.boolean, required: false, description: "是否必填" }
          - { name: optional, type: _types.boolean, required: false, description: "是否可选" }
          - { name: default, type: _types.any, required: false, description: "默认值" }
          - { name: secret, type: _types.boolean, required: false, description: "是否敏感" }
      - name: cache
        type: _types.object
        required: false
        description: "缓存策略"
        fields:
          - { name: stale_time, type: _types.string, required: false, description: "陈旧时间" }
          - { name: refetch_on_focus, type: _types.boolean, required: false, description: "聚焦时刷新" }

  - name: view_states
    type: _types.map<_types.object>
    required: true
    key_patterns: [ '^[a-z][a-z0-9_]*$' ]
    description: "页面状态映射"
    item_fields:
      - { name: when, type: _types.string, required: true, description: "状态条件表达式" }
      - { name: ui, type: _types.string, required: false, description: "UI 变体" }
      - { name: show, type: _types.string, required: false, description: "展示字段" }
      - { name: note, type: _types.string, required: false, description: "状态说明" }
      - { name: action, type: _types.string, required: false, description: "状态动作名" }
      - { name: retry, type: _types.boolean, required: false, description: "是否可重试" }

  - name: actions
    type: _types.map<_types.object>
    required: false
    key_patterns: [ '^[a-z][a-z0-9_]*$' ]
    description: "动作映射"
    item_fields:
      - { name: capability, type: _types.string, required: false, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "调用的 service ID" }
      - name: params
        type: _types.map<_types.object>
        required: false
        key_patterns: [ '^[a-z][a-z0-9_]*$' ]
        description: "参数映射；key 必须是 service 参数或对象字段"
        item_fields:
          - { name: from, type: _types.string, required: true, description: "取值来源" }
          - { name: type, type: _types.string, required: false, description: "值类型" }
          - { name: enum, type: _types.any, required: false, description: "枚举来源或字面量列表" }
          - { name: required, type: _types.boolean, required: false, description: "是否必填" }
          - { name: optional, type: _types.boolean, required: false, description: "是否可选" }
          - { name: default, type: _types.any, required: false, description: "默认值" }
          - { name: secret, type: _types.boolean, required: false, description: "是否敏感" }
      - { name: permission, type: _types.string, required: false, pattern: '^platform\.security\.permissions\.[a-z][a-z0-9_]*$', description: "权限 ID" }
      - name: available_when
        type: _types.object
        required: false
        description: "可用条件"
        fields:
          - { name: transition, type: _types.string, required: false, pattern: '^cap\.lifecycles\.[a-z][a-z0-9_]*\.(create|destroy|transitions\.[a-z][a-z0-9_]*)$', description: "单个 lifecycle 动作引用" }
          - { name: transitions, type: _types.list<_types.string>, required: false, unique: true, min_items: 1, pattern: '^cap\.lifecycles\.[a-z][a-z0-9_]*\.(create|destroy|transitions\.[a-z][a-z0-9_]*)$', description: "多个 lifecycle 动作引用" }
          - { name: state_not, type: _types.list<_types.string>, required: false, unique: true, min_items: 1, pattern: '^[a-z][a-z0-9_]*$', description: "排除的状态" }
      - { name: ui, type: _types.string, required: false, description: "UI 变体" }
      - { name: label, type: _types.string, required: false, description: "按钮文案" }
      - { name: confirm, type: _types.boolean, required: false, description: "是否二次确认" }
      - { name: danger, type: _types.boolean, required: false, description: "是否危险动作" }
      - { name: on_success, type: _types.string, required: false, description: "成功后的导航/动作" }

  - name: fields
    type: _types.list<_types.object>
    required: false
    description: "表单或展示字段"
    item_fields:
      - { name: name, type: _types.string, required: true, description: "字段名" }
      - { name: widget, type: _types.string, required: false, enum: [ text, string, integer, email, password, number, tel, url, date, datetime-local, time, search, textarea, select, checkbox, radio, hidden ], description: "输入/展示控件类型" }
      - { name: required, type: _types.boolean, required: false, description: "是否必填" }
      - { name: optional, type: _types.boolean, required: false, description: "是否可选" }
      - { name: minLength, type: _types.integer, required: false, min: 0, description: "最小长度" }
      - { name: maxLength, type: _types.integer, required: false, min: 0, description: "最大长度" }
      - { name: label, type: _types.string, required: false, description: "展示名" }
      - { name: enum, type: _types.string, required: false, pattern: '^(data\.enums\.[a-z][a-z0-9_]*|cap\.lifecycles\.[a-z][a-z0-9_]*(\.states(\.values)?)?)$', description: "枚举来源" }
      - { name: render, type: _types.string, required: false, enum: [ text, badge, code, heading, relative_time, link, date, boolean ], description: "渲染方式" }
      - { name: autocomplete, type: _types.string, required: false, enum: [ username, current-password, new-password, email, tel, one-time-code, name, given-name, family-name, organization, street-address, postal-code, country, url, off ], description: "浏览器自动填充提示" }
      - { name: secret, type: _types.boolean, required: false, description: "是否敏感输入" }

  - name: filters
    type: _types.list<_types.object>
    required: false
    description: "筛选器"
    item_fields:
      - { name: name, type: _types.string, required: true, description: "筛选项名" }
      - { name: enum, type: _types.string, required: false, pattern: '^(data\.enums\.[a-z][a-z0-9_]*|cap\.lifecycles\.[a-z][a-z0-9_]*(\.states(\.values)?)?)$', description: "枚举来源" }
      - { name: multiple, type: _types.boolean, required: false, description: "是否多选" }
      - { name: label, type: _types.string, required: false, description: "展示名" }

  - name: pagination
    type: _types.object
    required: false
    description: "分页配置"
    fields:
      - { name: style, type: _types.string, required: true, enum: [ offset ], description: "分页风格" }
      - { name: param, type: _types.string, required: true, enum: [ offset ], description: "分页参数名" }
      - { name: limit_default, type: _types.integer, required: false, min: 1, description: "默认页大小" }
      - { name: limit_max, type: _types.integer, required: false, min: 1, description: "最大页大小" }

  - name: empty_copy
    type: _types.object
    required: false
    description: "空态文案"
    fields:
      - { name: title, type: _types.string, required: true, description: "空态标题" }
      - { name: description, type: _types.string, required: true, description: "空态描述" }
      - { name: action_label, type: _types.string, required: false, description: "空态动作文案" }

  - name: analytics
    type: _types.object
    required: false
    description: "埋点"
    fields:
      - { name: page_view, type: _types.string, required: true, description: "页面浏览事件" }
      - { name: actions, type: _types.map<_types.string>, required: false, description: "动作事件映射" }

  - name: security
    type: _types.object
    required: false
    description: "安全提示"
    fields:
      - { name: rate_limit_hint, type: _types.string, required: false, description: "限流提示" }
      - { name: error_copy_uniform, type: _types.string, required: false, description: "统一错误提示" }

  - name: transition_ui
    type: _types.object
    required: false
    description: "状态按钮渲染"
    fields:
      - { name: source, type: _types.string, required: true, pattern: '^cap\.lifecycles\.[a-z][a-z0-9_]*\.transitions$', description: "lifecycle transitions 引用" }
      - { name: rule, type: _types.string, required: true, description: "渲染规则" }

  - name: copy
    type: _types.object
    required: false
    description: "静态文案"
    fields:
      - { name: title, type: _types.string, required: true, description: "标题" }
      - { name: description, type: _types.string, required: true, description: "描述" }

rules:
  - { id: page-structure, text: "id 必须由 targets 派生；page 必须等于文件 stem；view_states 必须包含 loading、error、forbidden，以及 empty 或 idle 之一", implemented_by: [ page-structure ] }
  - { id: page-params, text: "data/actions.params 的 key 必须是 capability 的 service 参数或对象字段；声明了 type 时必须与 service 字段类型一致；enum 必须是引用字符串或非空字符串列表；required 与 optional 不得同时声明", implemented_by: [ page-params ] }
  - { id: page-action-target, text: "actions.on_success 必须是 navigate(feature.routes.*) 或 close_and_redirect(feature.routes.*)，目标 route 必须存在", implemented_by: [ page-action-target ] }
  - { id: page-limits, text: "pagination.limit_default <= limit_max；fields.minLength <= maxLength", implemented_by: [ page-limits ] }
  - { id: page-refs, text: "route/capability/permission/enum 与 available_when 内的 transition/transitions/state_not 引用必须存在；transition_ui.source 必须是已存在的 cap.lifecycles.*.transitions；analytics.page_view/actions 必须是已存在的埋点事件", implemented_by: [ page-refs ] }
