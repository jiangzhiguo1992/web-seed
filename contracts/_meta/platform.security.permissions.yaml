# 权限点唯一来源；权限点只增不改。

id: meta.platform.security.permissions
type: platform.security.permissions
title: "权限点"
targets:
  dir: "contracts/platform/security"
  glob: "permissions.yaml"
  id: "platform.security.permissions"

fields:
  - name: schema_version
    type: _types.basics.integer
    required: true
    const: 1
    description: "格式版本"

  - name: id
    type: _types.basics.string
    required: true
    const: platform.security.permissions
    description: "契约 ID"

  - name: summary
    type: _types.basics.string
    required: true
    description: "一句话说明"

  - name: stability
    type: _types.basics.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.structures.set<_types.basics.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: naming
    type: _types.structures.object
    required: true
    description: "命名约定"
    fields:
      - { name: pattern, type: _types.basics.string, required: true, description: "权限码模板" }
      - { name: actions, type: _types.structures.list<_types.basics.string>, required: true, unique: true, min_items: 1, enum: [ read, write, delete, manage ], description: "允许的动作" }

  - name: permissions
    type: _types.structures.list<_types.structures.object>
    required: true
    min_items: 1
    unique_key: code
    description: "权限点列表"
    item_fields:
      - { name: code, type: _types.basics.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "权限码；引用写作 platform.security.permissions.<code>" }
      - { name: resource, type: _types.basics.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "资源名" }
      - { name: action, type: _types.basics.string, required: true, enum: [ read, write, delete, manage ], description: "动作" }
      - { name: description, type: _types.basics.string, required: true, description: "权限用途" }

  - name: boundaries
    type: _types.structures.object
    required: true
    description: "权限边界说明"
    fields:
      - name: resource_level
        type: _types.structures.object
        required: true
        description: "资源级权限说明"
        fields:
          - { name: example, type: _types.basics.string, required: true, description: "资源级规则示例" }
      - name: wildcard
        type: _types.structures.object
        required: true
        description: "通配权限说明"
        fields:
          - { name: allowed_for, type: _types.structures.list<_types.basics.string>, required: true, unique: true, min_items: 1, pattern: '^platform\.security\.roles\.[a-z][a-z0-9_]*$', description: "允许使用 * 的角色" }
          - { name: note, type: _types.basics.string, required: true, description: "通配使用说明" }

rules:
  - { id: permission-code-shape, text: "naming.pattern 必须是 <resource>_<action>；permissions[].code 必须等于 <resource>_<action>；action 必须在 naming.actions", implemented_by: [ permission-code-shape ] }
