# data.tables 的字段树 + 值域 + 字段说明。
# 通用字段语义见 _types.yaml 的 schema_semantics；通用规则见 schema_rules；本文件只写 data.tables 特有内容。
# targets 决定扫描路径、ID 模板、命名规则与基类例外；通用语义见 _types.yaml 的 target_semantics。
# 本文件同时是 contract-new 的字段来源；不要另写模板。

id: meta.data.tables
type: data.tables
title: "物理表契约"
targets:
  dir: "contracts/data/tables"
  glob: "*.yaml"
  id: "data.tables.<file>"
  naming: "snake_case"
  exception:
    - { file: "_base.yaml", id: "data.tables.base", kind: base }

column_refs:
  prefixes: [ "data.tables." ]
  require_col: [ "data.tables." ]
column_types:
  families:
    string:
      description: "字符序列；覆盖 char/varchar/text"
      params:
        min_len: { type: integer, required: false, min: 0, description: "最小字符数" }
        max_len: { type: integer, required: false, min: 1, description: "最大字符数" }
        fixed: { type: boolean, required: false, default: false, description: "固定长度；为 true 时必须写 max_len" }
        pattern: { type: string, required: false, description: "写入前校验的正则" }
        normalize: { type: string, required: false, enum: [ lower, upper ], description: "写入前归一方式" }
    boolean:
      description: "布尔值；覆盖 bool/tinyint(1)"
      params: { }
    integer:
      description: "整数；覆盖 int8/16/32/64"
      params:
        bits: { type: integer, required: false, enum: [ 8, 16, 32, 64 ], default: 64, description: "存储位宽" }
        unsigned: { type: boolean, required: false, default: false, description: "是否无符号" }
        min: { type: integer, required: false, description: "闭区间下限" }
        max: { type: integer, required: false, description: "闭区间上限" }
    float:
      description: "浮点数；覆盖 real/double"
      params:
        bits: { type: integer, required: false, enum: [ 32, 64 ], default: 64, description: "存储位宽" }
        min: { type: float, required: false, description: "闭区间下限" }
        max: { type: float, required: false, description: "闭区间上限" }
    decimal:
      description: "精确小数；覆盖 decimal/numeric"
      params:
        precision: { type: integer, required: true, min: 1, examples: [ 19 ], description: "总位数" }
        scale: { type: integer, required: false, default: 0, min: 0, description: "小数位数" }
        min: { type: decimal, required: false, description: "闭区间下限" }
        max: { type: decimal, required: false, description: "闭区间上限" }
    datetime:
      description: "日期/时间；覆盖 date/time/datetime"
      params:
        mode: { type: string, required: false, enum: [ date, time, datetime ], default: datetime, description: "日期/时间模式" }
        timezone: { type: boolean, required: false, default: false, description: "是否带时区" }
    timestamp:
      description: "绝对时间点"
      params:
        timezone: { type: boolean, required: false, default: true, description: "是否带时区" }
        fractional_seconds: { type: integer, required: false, default: 6, min: 0, max: 9, description: "小数秒精度" }
    json:
      description: "JSON 文档；覆盖 json/jsonb"
      params:
        binary: { type: boolean, required: false, default: false, description: "是否使用 jsonb" }
    bytes:
      description: "二进制；覆盖 binary/varbinary/blob/bytea"
      params:
        min_len: { type: integer, required: false, min: 0, description: "最小字节数" }
        max_len: { type: integer, required: false, min: 1, description: "最大字节数" }
        fixed: { type: boolean, required: false, default: false, description: "固定长度；为 true 时必须写 max_len" }

fields:
  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "契约格式版本，固定 1"
    generates: "无"
    caution: "必须是整数 1"

  - name: id
    type: string
    required: true
    pattern: '^data\.tables\.[a-z][a-z0-9_]*$'
    description: "由 file stem 派生"
    generates: "契约 ID、图节点"
    caution: "不要写 data.table.*；_base.yaml 例外为 data.tables.base"

  - name: summary
    type: string
    required: true
    description: "一句话说明这张表是什么"
    generates: "index 摘要"
    caution: "不要写字段清单"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "契约稳定度"
    generates: "index 摘要"
    caution: "stable 不得含 TODO/FIXME；可回退 draft 继续修改"

  - name: kind
    type: string
    required: false
    enum: [ base ]
    description: "仅 tables/_base.yaml 使用"
    generates: "跳过 DDL"
    caution: "物理表不写"

  - name: owner_module
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "唯一写归属模块"
    generates: "归属校验"
    caution: "只有同模块 cap.services/cap.async 可写表"

  - name: extends
    type: list<string>
    required: true
    allowed: [ data.tables.base ]
    unique: true
    default: [ data.tables.base ]
    description: "契约继承基类 5 列"
    generates: "展开基类列"
    caution: "只能写 data.tables.base"

  - name: do_not
    type: list<string>
    required: false
    description: "实例级负向约束；每条含本表标识"
    generates: "AI 反例"
    caution: "通用规则在 _meta/_types.yaml，禁止复制到这里"

  - name: table
    type: object
    required: true
    description: "物理表元数据"
    generates: "表名、COMMENT、保留、分区"
    caution: "不是契约 ID"
    fields:
      - name: name
        type: string
        required: false
        pattern: '^[a-z][a-z0-9_]*$'
        description: "物理表名；默认 file stem"
        generates: "DDL 表名、SQL FROM"
      - name: comment
        type: string
        required: true
        description: "数据库 COMMENT"
        generates: "DDL COMMENT"
        caution: "不要复制 summary"
      - name: size_class
        type: string
        required: true
        enum: [ small, large ]
        default: small
        description: "表量级；large 索引默认 CONCURRENTLY"
        generates: "索引并发策略"
        caution: "不是性能承诺；按预期量级写"
      - name: retention
        type: object
        required: false
        description: "保留/清理策略；cleanup 任务唯一来源"
        generates: "cleanup 策略"
        caution: "不是数据库自动 TTL"
        fields:
          - { name: unit, type: string, required: false, default: days, enum: [ minutes, hours, days ], description: "所有时长的单位" }
          - { name: pending, type: integer, required: false, min: 1, description: "待处理状态清理阈值" }
          - { name: soft_delete, type: integer, required: false, min: 1, description: "软删记录保留时长" }
          - { name: hard_delete, type: integer, required: false, min: 1, description: "硬删记录保留时长" }
          - { name: ttl, type: integer, required: false, min: 1, description: "记录过期时长（TTL）" }
      - name: partition
        type: object
        required: false
        description: "分区策略；替代原生 DDL"
        generates: "DDL PARTITION BY"
        caution: "range 必填 interval；list/hash 暂不支持"
        fields:
          - { name: strategy, type: string, required: true, enum: [ range, list, hash ], description: "分区策略" }
          - { name: columns, type: list<string>, required: true, description: "分区键列名" }
          - { name: interval, type: string, required: false, description: "range 间隔，如 \"1 month\"" }

  - name: columns
    type: list<object>
    required: true
    description: "物理列；id/status/created_at/updated_at/deleted_at 不重声明"
    generates: "DDL 列、sqlc、Go 类型"
    caution: "status 必须是 integer；枚举映射只在 entity"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', examples: [ "name" ], description: "列名" }
      - { name: type, type: string, required: true, default: string, description: "类型族键，或 data.tables.*.col.* 引用", caution: "表列不引用 data.enums.*；引用类型不可带类型族参数" }
      - { name: nullable, type: boolean, required: false, default: false, description: "是否可空；默认 false" }
      - { name: primary_key, type: boolean, required: false, description: "是否主键；主键不可空", caution: "基类 id 已是主键；仅复合主键时使用" }
      - { name: generated_by, type: string, required: false, enum: [ application, database ], description: "初始值由应用/数据库生成" }
      - { name: default, type: any, required: false, description: "字面量默认值；与 default_sql 互斥" }
      - { name: default_sql, type: string, required: false, description: "SQL 表达式默认值；与 default 互斥" }
      # 类型族参数由 column_types.families.params 注入
      - { name: pii, type: boolean, required: false, description: "个人敏感信息" }
      - { name: never_expose, type: boolean, required: false, description: "禁止进入普通 API/TS/事件/entity" }
      - { name: managed_by, type: string, required: false, enum: [ application, database ], description: "后续维护方" }
      - { name: comment, type: string, required: false, description: "列 COMMENT" }

  - name: constraints
    type: list<object>
    required: false
    description: "DDL 约束：check/unique/exclude"
    generates: "DDL CHECK/UNIQUE/EXCLUDE"
    caution: "UNIQUE 含软删行；需软删后复用请用唯一索引"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^(ck|uq|ex)_[a-z][a-z0-9_]*$', description: "约束名；check=ck_, unique=uq_, exclude=ex_" }
      - { name: type, type: string, required: true, enum: [ check, unique, exclude ], description: "约束类型" }
      - { name: expr, type: string, required: false, description: "check/exclude 的 SQL 表达式" }
      - { name: columns, type: list<string>, required: false, description: "unique 约束的列名" }

  - name: indexes
    type: list<object>
    required: false
    description: "索引；每条必须有 reason"
    generates: "DDL INDEX"
    caution: "唯一索引必须带软删过滤"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^(idx|uq)_[a-z][a-z0-9_]*$', description: "索引名；普通 idx_，唯一 uq_" }
      - { name: columns, type: list<string>, required: false, description: "索引列；与 expression 二选一" }
      - { name: expression, type: string, required: false, description: "表达式索引；与 columns 二选一" }
      - { name: unique, type: boolean, required: false, description: "是否唯一" }
      - { name: where, type: string, required: false, description: "部分索引条件" }
      - { name: order, type: list<string>, required: false, allowed: [ asc, desc ], description: "与 columns 一一对应的方向" }
      - { name: reason, type: string, required: true, description: "为什么需要" }
      - { name: method, type: string, required: false, enum: [ btree, hash, gin, gist, brin ], default: btree, description: "索引方法" }
      - { name: concurrently, type: string, required: false, enum: [ auto, "true", "false" ], default: auto, description: "是否并发；写字符串 auto/\"true\"/\"false\"" }
      - { name: include, type: list<string>, required: false, description: "覆盖索引附加列" }

  - name: used_by
    type: object
    required: true
    generated: true
    write: forbidden
    description: "反向索引；只记直接入边"
    generates: "used_by、inbound"
    caution: "生成物，禁止手改"
    fields:
      - { name: entities, type: list<string>, required: true, unique: true, description: "实体 ID 列表" }
      - { name: queries, type: list<string>, required: true, unique: true, description: "查询项 ID 列表" }
      - { name: capabilities, type: list<string>, required: true, unique: true, description: "能力 ID 列表" }

rules:
  - { id: base-only, text: "extends 只能是 targets.exception 声明的 base ID", implemented_by: [base-only] }
  - { id: no-base-columns, text: "物理表不得声明 id/created_at/updated_at/deleted_at；status 必须重声明为 integer", implemented_by: [no-base-columns] }
  - { id: status-integer, text: "物理表必须声明 status，且类型为 integer；枚举只在 entity", implemented_by: [status-integer] }
  - { id: base-file, text: "kind: base 必须位于 targets.exception 声明的文件，且 ID 与例外一致", implemented_by: [base-file] }
  - { id: column-type, text: "列类型必须是类型族键，或匹配 column_refs.prefixes；表列不引用 data.enums.*", implemented_by: [column-type] }
  - { id: family-params, text: "列参数必须属于该类型族；required 参数必须出现", implemented_by: [family-params] }
  - { id: family-length, text: "min_len <= max_len；fixed 必须写 max_len 且 min_len 等于 max_len", implemented_by: [family-length] }
  - { id: family-range, text: "min <= max；unsigned 的 min/default 不得为负；default 必须在范围内", implemented_by: [family-range] }
  - { id: family-decimal, text: "scale <= precision", implemented_by: [family-decimal] }
  - { id: no-foreign-key, text: "禁止 foreign_key；跨表一致性由应用/业务规则保证", implemented_by: [no-foreign-key] }
  - { id: unique-scope, text: "UNIQUE 约束含软删行；唯一索引 + where 只约束未删行，按业务选择", implemented_by: [unique-scope] }
  - { id: constraint-fields, text: "check/exclude 用 expr；unique 用 columns", implemented_by: [constraint-fields] }
  - { id: index-order, text: "order 只能与 columns 配合，长度一致，值为 asc/desc", implemented_by: [index-order] }
  - { id: large-index-concurrently, text: "size_class=large 时索引不得显式 concurrently: \"false\"", implemented_by: [large-index-concurrently] }
  - { id: partition, text: "partition.columns 非空；range 必须有 interval，其他策略不得有", implemented_by: [partition] }
  - { id: used-by-generated, text: "used_by 由 make gen-graph 写入，禁止手改；queries 记录查询项 ID，不是查询文件 ID", implemented_by: [used-by-generated] }
  - { id: owner-write, text: "只有 owner_module 相同的 cap.services/cap.async 可以写表", implemented_by: [owner-write] }
  - { id: base-columns, text: "基类必须且只能是 id/status/created_at/updated_at/deleted_at", implemented_by: [base-columns] }
  - { id: physical-name-unique, text: "物理表名全局唯一", implemented_by: [physical-name-unique] }
  - { id: index-reason, text: "索引必须写非空 reason", implemented_by: [index-reason] }
  - { id: index-definition, text: "索引必须有 columns 或 expression 之一；名称前缀匹配类型", implemented_by: [index-definition] }
