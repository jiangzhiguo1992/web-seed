# data.tables 的字段树 + 值域 + 字段说明。
# 通用字段语义见 _meta/README.md；类型族在 _meta/_types.yaml；本文件只写 data.tables 特有内容。
# targets 决定扫描路径、ID 模板与命名规则；基类固定为 data/tables/_base.yaml，由 checker 写死识别。
# 本文件同时是 contract-new 的字段来源；不要另写模板。

id: meta.data.tables
type: data.tables
title: "物理表契约"
targets:
  dir: "contracts/data/tables"
  glob: "*.yaml"
  id: "data.tables.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: string
    required: true
    pattern: '^data\.tables\.[a-z][a-z0-9_]*$'
    description: "由 targets.id 模板派生（<file> 替换为文件 stem）"
    generates: "契约 ID、图节点"
    caution: "不要写 data.table.*；pattern 与 targets.id 同步；基类契约见 data.tables.base"

  - name: summary
    type: string
    required: true
    description: "一句话说明这张表是什么"
    generates: "index 摘要"
    caution: "不要写字段清单"

  - name: owner_module
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "唯一写归属模块"
    generates: "归属校验"
    caution: "只有同模块 cap.services/cap.async 可写表"

  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "契约格式版本，固定 1"
    generates: "无"
    caution: "必须是整数 1"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "契约稳定度"
    generates: "index 摘要"
    caution: "stable 不得含 TODO/FIXME；可回退 draft 继续修改"

  - name: do_not
    type: list<string>
    required: false
    description: "实例级负向约束；每条含本表标识"
    generates: "AI 反例"
    caution: "通用规则放组 README 或 _base，禁止复制到这里"

  - name: table
    type: object
    required: true
    description: "物理表元数据：表名、注释、继承"
    generates: "表名、COMMENT、继承列"
    caution: "不是契约 ID；engine/size_class/retention/partition 在 data/storage.yaml"
    fields:
      - name: name
        type: string
        required: false
        pattern: '^[a-z][a-z0-9_]*$'
        description: "物理表名；默认 file stem"
        generates: "DDL 表名、SQL FROM"
      - name: comment
        type: string
        required: true
        description: "数据库 COMMENT"
        generates: "DDL COMMENT"
        caution: "不要复制 summary"
      - name: extends
        type: list<string>
        required: true
        pattern: '^data\.tables\.[a-z][a-z0-9_]*$'
        unique: true
        default: [ data.tables.base ]
        description: "继承的父表 ID 列表；可多父，默认 data.tables.base"
        generates: "展开父表及基类列"
        caution: "父表必须存在且不得成环；同名列来源不同视为冲突；不得重声明任何继承列"
      - name: entities
        type: list<string>
        required: true
        unique: true
        pattern: '^data\.entities\.[a-z][a-z0-9_]*$'
        description: "映射本表的 entity ID 列表；必须与 entity.model.tables 双向一致"
        generates: "实体反向映射"
        caution: "显式声明；checker 校验每一处引用，悬空或缺失都报错"

  - name: columns
    type: list<object>
    required: true
    description: "物理列；基类 5 列与祖先业务列不重声明"
    generates: "DDL 列、sqlc、Go 类型"
    caution: "枚举映射只在 entity；status 由基类提供"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', examples: [ "name" ], description: "列名" }
      - { name: type, type: string, required: true, default: string, description: "类型族键，或 data.tables.<t>.col.<c> 引用", caution: "引用规则硬编码：只允许 data.tables.<t>.col.<c>；表列不引用 data.enums.*；引用类型不可带类型族参数" }
      - { name: nullable, type: boolean, required: false, default: false, description: "是否可空；默认 false" }
      - { name: primary_key, type: boolean, required: false, description: "是否主键；主键不可空", caution: "基类 id 已是主键；仅复合主键时使用" }
      - { name: default, type: any, required: false, description: "字面量默认值；与 default_sql 互斥" }
      - { name: default_sql, type: string, required: false, description: "SQL 表达式默认值；与 default 互斥" }
      # 类型族参数由 _meta/_types.yaml 的 column_types.families.params 注入
      - { name: sensitivity, type: string, required: false, enum: [ public, pii, secret ], default: public, description: "列敏感级别；public 可返回，pii 可脱敏返回，secret 禁止返回", caution: "secret 隐含 pii；继承到 entity 时只能收紧，不能降低" }
      - { name: redundancy, type: string, required: false, pattern: '^[a-z][a-z0-9_]*$', description: "所属冗余组 ID；组定义与 source/copies 见 data/storage.yaml 的 redundancy_groups", caution: "列只写组 ID；source/copy 角色、类型与可空一致性由 checker 按 storage 校验" }
      - { name: comment, type: string, required: false, description: "列 COMMENT" }

  - name: constraints
    type: list<object>
    required: false
    description: "DDL 约束：check"
    generates: "DDL CHECK"
    caution: "唯一性统一由 indexes[].unique 表达；只保留 check，exclude 已移除"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^ck_[a-z][a-z0-9_]*$', description: "约束名；check 用 ck_" }
      - { name: type, type: string, required: true, enum: [ check ], description: "约束类型" }
      - { name: expr, type: string, required: false, description: "check 的 SQL 表达式", caution: "checker 只校验非空；SQL 语义由生成器/数据库验证" }

  - name: indexes
    type: list<object>
    required: false
    description: "索引；每条必须有 comment"
    generates: "DDL INDEX、COMMENT ON INDEX"
    caution: "唯一索引用 unique: true；live_only 决定唯一作用域；索引名同一 schema 内必须全局唯一"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^(idx|uq)_[a-z][a-z0-9_]*$', description: "索引名；普通 idx_，唯一 uq_" }
      - { name: columns, type: list<string>, required: false, description: "索引列；与 expression 二选一" }
      - { name: expression, type: string, required: false, description: "表达式索引；与 columns 二选一" }
      - { name: unique, type: boolean, required: false, description: "是否唯一" }
      - { name: live_only, type: boolean, required: false, default: false, description: "是否只约束未软删行（deleted_at IS NULL）", caution: "true=软删后可复用；false/省略=全表唯一（含软删行）" }
      - { name: comment, type: string, required: true, description: "索引用途；生成 COMMENT ON INDEX" }
      - { name: used_by, type: list<string>, required: true, unique: true, description: "使用该索引的查询项 ID；至少一个，防空索引", caution: "写 data.queries.* 项，不是查询文件；查询必须引用当前表" }

  - name: used_by
    type: object
    required: true
    generated: true
    write: forbidden
    description: "反向索引；只记直接 query"
    generates: "used_by、inbound"
    caution: "生成物，禁止手改；必须是文件最后一个顶层键"
    fields:
      - { name: queries, type: list<string>, required: true, unique: true, description: "查询项 ID 列表" }

rules:
  - { id: table-key-order, text: "表顶层键顺序固定为 id/summary/owner_module/schema_version/stability/do_not/table/columns/constraints/indexes/used_by", implemented_by: [ table-key-order ] }
  - { id: base-file, text: "基类契约固定位于 contracts/data/tables/_base.yaml，ID 固定为 data.tables.base", implemented_by: [ base-file ] }
  - { id: base-columns, text: "基类必须且只能是 id/status/created_at/updated_at/deleted_at；id 为 integer（bits: 64）主键、status 为非空 integer 且非主键（默认 0）、三个时间列为 timestamp（created_at/updated_at 非空、deleted_at 可空）", implemented_by: [ base-columns ] }
  - { id: base-only, text: "table.extends 不得为空；必须是 data.tables.* 契约 ID", implemented_by: [ base-only ] }
  - { id: extends-ref, text: "table.extends 的每个父表必须存在；不得自成环，继承链必须最终到达 data.tables.base", implemented_by: [ extends-ref ] }
  - { id: extends-conflict, text: "多个父表提供同名列时，只有来源相同（钻石继承）才允许；来源不同必须解决冲突", implemented_by: [ extends-conflict ] }
  - { id: no-base-columns, text: "物理表不得重声明基类 5 列（id/status/created_at/updated_at/deleted_at）及祖先业务列", implemented_by: [ no-base-columns ] }
  - { id: column-type, text: "列类型必须是类型族键，或 data.tables.<t>.col.<c> 引用；表列不引用 data.enums.*", implemented_by: [ column-type ] }
  - { id: family-params, text: "列参数必须属于该类型族；required 参数必须出现", implemented_by: [ family-params ] }
  - { id: family-length, text: "min_len <= max_len；fixed 为 true 时必须写 max_len，若写 min_len 必须等于 max_len", implemented_by: [ family-length ] }
  - { id: family-range, text: "min <= max；unsigned 的 min/default 不得为负；default 必须在范围内", implemented_by: [ family-range ] }
  - { id: family-decimal, text: "scale <= precision", implemented_by: [ family-decimal ] }
  - { id: no-foreign-key, text: "禁止 foreign_key；跨表一致性由应用/业务规则保证", implemented_by: [ no-foreign-key ] }
  - { id: index-live-only, text: "live_only: true 要求表存在 nullable 的 deleted_at 列；唯一索引的 live_only 决定唯一作用域", implemented_by: [ index-live-only ] }
  - { id: constraint-fields, text: "check 必须写非空 expr；check 名以 ck_ 开头", implemented_by: [ constraint-fields ] }
  - { id: storage-registry, text: "storage.yaml 的 tables 必须覆盖每张物理表，且只引用已存在的表；基类不是物理表", implemented_by: [ storage-registry ] }
  - { id: storage-entry, text: "storage.tables 条目只允许 engine/size_class/retention/partition；size_class 只能是 small/large", implemented_by: [ storage-entry ] }
  - { id: storage-engine, text: "storage.tables 的 engine 必须在 supported_engines 中且该引擎已启用", implemented_by: [ storage-engine ] }
  - { id: storage-doc, text: "storage.yaml 顶层只允许 schema_version/id/summary/stability/do_not/default_engine/supported_engines/engines/deployment/tables/redundancy_groups/not_supported；engines.<name>.enabled 必须是 bool，supported_engines 必须是非空字符串列表", implemented_by: [ storage-doc ] }
  - { id: storage-retention, text: "retention.unit 只能是 minutes/hours/days；各保留时长必须 >= 1", implemented_by: [ storage-retention ] }
  - { id: storage-partition, text: "partition.columns 非空且必须存在；range 必须有 interval，其他策略不得有", implemented_by: [ storage-partition ] }
  - { id: used-by-generated, text: "used_by.queries 由 make gen-graph 写入，禁止手改；只记 query 直接入边", implemented_by: [ used-by-generated ] }
  - { id: table-entities, text: "table.entities 必须等于 model.tables 包含本表的 entity 集合；每个 entity 必须存在且确实映射本表", implemented_by: [ table-entities ] }
  - { id: owner-write, text: "只有 owner_module 相同的 cap.services/cap.async 可以写表；写查询必须在 persistence.write_queries 或 cap.async.writes 中声明并指向单表；跨模块读取用 persistence.queries", implemented_by: [ owner-write ] }
  - { id: physical-name-unique, text: "物理表名全局唯一", implemented_by: [ physical-name-unique ] }
  - { id: index-comment, text: "索引必须写非空 comment", implemented_by: [ index-comment ] }
  - { id: index-definition, text: "索引必须有 columns 或 expression 之一；名称前缀匹配类型", implemented_by: [ index-definition ] }
  - { id: index-used-by, text: "每条索引必须声明 used_by，至少引用一个查询项 ID", implemented_by: [ index-used-by ] }
  - { id: index-used-by-ref, text: "index.used_by 必须指向 data.queries.* 项；该查询必须引用当前表，且表达式提及索引列", implemented_by: [ index-used-by-ref ] }
  - { id: index-name-unique, text: "索引名同一 schema 内必须全局唯一", implemented_by: [ index-name-unique ] }
  - { id: constraint-error-ref, text: "capabilities.persistence.constraint_errors 的键必须是所写表声明的约束或索引名", implemented_by: [ constraint-error-ref ] }
  - { id: redundant-group, text: "storage.redundancy_groups 每个组必须有 source 和至少一个 copies；组 ID 唯一且为 snake_case", implemented_by: [ redundant-group ] }
  - { id: redundant-ref, text: "columns[].redundancy 必须与 storage.redundancy_groups 双向一致；copy 与 source 的 type/nullable 必须一致", implemented_by: [ redundant-ref ] }
  - { id: default-type, text: "default 的类型、长度、范围必须与字段类型兼容", implemented_by: [ default-type ] }
  - { id: default-vs-default-sql, text: "default 与 default_sql 互斥", implemented_by: [ default-vs-default-sql ] }
  - { id: primary-key-nullable, text: "primary_key: true 的字段不得 nullable: true", implemented_by: [ primary-key-nullable ] }
  - { id: do-not-specific, text: "物理表 do_not 每条必须含本表标识；通用规则上移组 README 或 _base", implemented_by: [ do-not-specific ] }
