# data.tables 类型规范：表、列、约束、索引；类型族见 _types.yaml。

id: meta.data.tables
type: data.tables
title: "物理表契约"
targets:
  dir: "contracts/data/tables"
  glob: "*.yaml"
  id: "data.tables.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: string
    required: true
    pattern: '^data\.tables\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "写归属模块"

  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: list<string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: table
    type: object
    required: true
    description: "物理表元数据（不含存储事实）"
    fields:
      - name: name
        type: string
        required: true
        pattern: '^[a-z][a-z0-9_]*$'
        description: "物理表名"
      - name: comment
        type: string
        required: true
        description: "数据库 COMMENT"
      - name: extends
        type: list<string>
        required: true
        pattern: '^data\.tables\.[a-z][a-z0-9_]*$'
        unique: true
        description: "父表 ID 列表"
      - name: entities
        type: list<string>
        required: true
        unique: true
        pattern: '^data\.entities\.[a-z][a-z0-9_]*$'
        description: "映射本表的 entity ID 列表"

  - name: columns
    type: list<object>
    required: true
    description: "物理列"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "列名" }
      - { name: type, type: string, required: true, description: "类型族键或列引用" }
      - { name: nullable, type: boolean, required: false, default: false, description: "是否可空" }
      - { name: primary_key, type: boolean, required: false, description: "是否主键" }
      - { name: default, type: any, required: false, description: "字面量默认值" }
      - { name: default_sql, type: string, required: false, description: "SQL 表达式默认值" }
      # 类型族参数由 _meta/_types.yaml 的 column_types.families.params 注入
      - { name: sensitivity, type: string, required: false, enum: [ public, pii, secret ], default: public, description: "敏感级别；secret 列禁止跨模块返回" }
      - { name: redundancy, type: string, required: false, pattern: '^[a-z][a-z0-9_]*$', description: "冗余组 ID" }
      - { name: comment, type: string, required: false, description: "列 COMMENT" }

  - name: constraints
    type: list<object>
    required: false
    description: "DDL 约束；唯一性用 indexes[].unique"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^ck_[a-z][a-z0-9_]*$', description: "约束名" }
      - { name: type, type: string, required: true, enum: [ check ], description: "约束类型" }
      - { name: expr, type: string, required: false, description: "CHECK 表达式；checker 只校验非空" }

  - name: indexes
    type: list<object>
    required: false
    description: "索引"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^(idx|uq)_[a-z][a-z0-9_]*$', description: "索引名" }
      - { name: columns, type: list<string>, required: false, unique: true, description: "索引列" }
      - { name: expression, type: string, required: false, description: "表达式索引；checker 只校验非空" }
      - { name: unique, type: boolean, required: false, description: "是否唯一" }
      - { name: live_only, type: boolean, required: false, default: false, description: "是否只约束未软删行；false 含软删行" }
      - { name: comment, type: string, required: true, description: "索引用途" }
      - { name: used_by, type: list<string>, required: true, unique: true, description: "使用该索引的 query 项 ID" }

  - name: used_by
    type: object
    required: true
    generated: true
    write: forbidden
    description: "生成的 query 反向索引"
    fields:
      - { name: queries, type: list<string>, required: true, unique: true, description: "query 项 ID" }

rules:
  - { id: table-key-order, text: "表契约字段顺序必须与 _meta/data.tables.yaml 的 fields 顺序一致；嵌套对象同序", implemented_by: [ table-key-order ] }
  - { id: base-file, text: "基类契约固定位于 contracts/data/tables/_base.yaml，ID 固定为 data.tables.base", implemented_by: [ base-file ] }
  - { id: base-columns, text: "基类必须且只能是 id/status/created_at/updated_at/deleted_at；id 为 integer（bits: 64）、unsigned: false、主键，status 为非空 integer 且非主键（默认 0）、三个时间列为 timestamp（created_at/updated_at 非空、deleted_at 可空）", implemented_by: [ base-columns ] }
  - { id: base-only, text: "table.extends 不得为空", implemented_by: [ base-only ] }
  - { id: extends-ref, text: "table.extends 的每个父表必须存在；不得自成环，继承链必须最终到达 data.tables.base", implemented_by: [ extends-ref ] }
  - { id: extends-conflict, text: "多个父表提供同名列时，只有来源相同（钻石继承）才允许；来源不同必须解决冲突", implemented_by: [ extends-conflict ] }
  - { id: no-base-columns, text: "物理表不得重声明基类 5 列（id/status/created_at/updated_at/deleted_at）及祖先业务列", implemented_by: [ no-base-columns ] }
  - { id: column-type, text: "列类型必须是类型族键，或 data.tables.<t>.col.<c> 引用；表列不引用 data.enums.*", implemented_by: [ column-type ] }
  - { id: family-params, text: "列参数必须属于该类型族；required 参数必须出现", implemented_by: [ family-params ] }
  - { id: family-length, text: "min_len <= max_len；fixed 为 true 时必须写 max_len，若写 min_len 必须等于 max_len", implemented_by: [ family-length ] }
  - { id: family-range, text: "min <= max；unsigned 的 min/default 不得为负；default 必须在范围内", implemented_by: [ family-range ] }
  - { id: family-decimal, text: "scale <= precision", implemented_by: [ family-decimal ] }
  - { id: no-foreign-key, text: "禁止 foreign_key；跨表一致性由应用/业务规则保证", implemented_by: [ no-foreign-key ] }
  - { id: index-live-only, text: "live_only: true 要求表存在 nullable 的 deleted_at 列", implemented_by: [ index-live-only ] }
  - { id: constraint-fields, text: "type=check 的约束必须写非空 expr", implemented_by: [ constraint-fields ] }
  - { id: storage-registry, text: "storage.yaml 的 tables 必须覆盖每张物理表，且只引用已存在的表；基类不是物理表", implemented_by: [ storage-registry ] }
  - { id: storage-entry, text: "storage.tables 条目只允许 engine/size_class/retention/partition；engine 必填，size_class 只能是 small/large", implemented_by: [ storage-entry ] }
  - { id: storage-engine, text: "storage.tables 的 engine 必须在 supported_engines 中", implemented_by: [ storage-engine ] }
  - { id: storage-doc, text: "storage.yaml 顶层只允许 schema_version/id/summary/stability/do_not/supported_engines/tables/not_supported；supported_engines 必填且必须是非空字符串列表，not_supported 若存在必须是非空字符串列表", implemented_by: [ storage-doc ] }
  - { id: storage-retention, text: "retention 只允许 unit/pending/soft_delete/hard_delete/ttl；必须写 unit 和至少一个时长；unit 只能是 minutes/hours/days；各时长必须 >= 1", implemented_by: [ storage-retention ] }
  - { id: storage-partition, text: "partition 只允许 strategy/columns/interval；strategy 只能是 range/list/hash；columns 非空且必须存在；range 必须有 interval，其他策略不得有", implemented_by: [ storage-partition ] }
  - { id: used-by-generated, text: "used_by.queries 由 make gen-graph 写入，禁止手改；只记 query 直接入边", implemented_by: [ used-by-generated ] }
  - { id: table-entities, text: "table.entities 必须等于 model.tables 包含本表的 entity 集合；每个 entity 必须存在且确实映射本表", implemented_by: [ table-entities ] }
  - { id: owner-write, text: "只有 owner_module 相同的 cap.services/cap.async 可以写表；查询用 tables[].write:true 标记写表；有写表的查询必须出现在 persistence.write_queries 或 cap.async.writes 中；service 写表必须在 persistence.table/tables 中，async 写表由 writes 声明；每个写表归属模块一致；返回 affected_rows 的查询必须有写表并出现在某个写声明中；跨模块读取用 persistence.queries", implemented_by: [ owner-write ] }
  - { id: physical-name-unique, text: "物理表名全局唯一", implemented_by: [ physical-name-unique ] }
  - { id: index-comment, text: "索引必须写非空 comment", implemented_by: [ index-comment ] }
  - { id: index-definition, text: "索引必须有 columns 或 expression 之一；columns 必须存在；名称前缀匹配类型", implemented_by: [ index-definition ] }
  - { id: index-used-by, text: "每条索引的 used_by 不得为空，至少引用一个查询项 ID", implemented_by: [ index-used-by ] }
  - { id: index-used-by-ref, text: "index.used_by 必须指向存在的 data.queries.* 项，且该查询的 tables 必须包含当前表", implemented_by: [ index-used-by-ref ] }
  - { id: index-name-unique, text: "索引名同一 schema 内必须全局唯一", implemented_by: [ index-name-unique ] }
  - { id: constraint-error-ref, text: "capabilities.persistence.constraint_errors 的键必须是所写表声明的约束或索引名", implemented_by: [ constraint-error-ref ] }
  - { id: redundant-group, text: "data/redundancy.yaml 的 groups 每个组必须有 source 和至少一个 copies；组只允许 source/copies；组 ID 必须为 snake_case", implemented_by: [ redundant-group ] }
  - { id: redundant-ref, text: "groups 的 source/copies 必须是存在的表列；columns[].redundancy 必须与 groups 双向一致；同一列只能属于一个组；copy 与 source 的 type/nullable 必须一致", implemented_by: [ redundant-ref ] }
  - { id: default-type, text: "列 default 的 YAML 类型必须与列类型族兼容；长度/范围按本列声明的参数校验（不展开 data.tables.*.col.* 引用）", implemented_by: [ default-type ] }
  - { id: default-vs-default-sql, text: "default 与 default_sql 互斥", implemented_by: [ default-vs-default-sql ] }
  - { id: physical-primary-key, text: "物理表不得声明 primary_key；主键统一由基类 id 提供", implemented_by: [ physical-primary-key ] }
  - { id: do-not-specific, text: "物理表 do_not 每条必须含本表标识（文件名、物理表名、列、约束或索引名）；通用规则上移组 README 或 _base", implemented_by: [ do-not-specific ] }
