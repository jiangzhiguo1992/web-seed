# 存储事实单例：引擎、保留、归档、缓存。

id: meta.data.storage
type: data.storage
title: "存储拓扑契约"
targets:
  dir: "contracts/data"
  glob: "storage.yaml"
  id: "data.storage"

fields:
  - name: id
    type: _types.string
    required: true
    const: data.storage
    description: "契约 ID"

  - name: summary
    type: _types.string
    required: true
    description: "一句话说明"

  - name: schema_version
    type: _types.integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: _types.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.set<_types.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: supported_engines
    type: _types.set<_types.string>
    required: true
    unique: true
    min_items: 1
    pattern: '^[a-z][a-z0-9_-]*$'
    description: "支持的权威存储引擎"

  - name: not_supported_topologies
    type: _types.set<_types.string>
    required: false
    unique: true
    min_items: 1
    pattern: '^[a-z][a-z0-9_-]*$'
    description: "明确不支持的拓扑"

  - name: tables
    type: _types.map<_types.list<_types.object>>
    required: true
    key_patterns: [ '^[a-z][a-z0-9_]*$' ]
    description: "engine -> 表条目；key 是权威引擎，value 是条目列表"
    item_fields:
      - { name: table, type: _types.string, required: true, description: "权威表 ID；归档条目中是归档物理表名" }
      - { name: description, type: _types.string, required: false, description: "普通条目说明；必须等于表 summary" }
      - { name: retention, type: _types.boolean, required: false, description: "是否开启保留" }
      - { name: unit, type: _types.string, required: false, enum: [ minutes, hours, days ], description: "保留时长单位" }
      - { name: ttl, type: _types.integer, required: false, min: 1, description: "过期时长" }
      - { name: archive_of, type: _types.string, required: false, pattern: '^data\.tables\.[a-z][a-z0-9_]*$', description: "归档源表 ID" }
      - { name: promotable, type: _types.boolean, required: false, description: "归档能否回迁" }
      - { name: on_conflict, type: _types.string, required: false, enum: [ skip, overwrite, error ], description: "回迁冲突策略" }
      - { name: age_by, type: _types.string, required: false, enum: [ created_at, updated_at ], description: "数据年龄列" }
      - { name: after_unit, type: _types.string, required: false, enum: [ minutes, hours, days ], description: "归档阈值单位" }
      - { name: after, type: _types.integer, required: false, min: 1, description: "归档阈值" }

  - name: caches
    type: _types.map<_types.list<_types.object>>
    required: false
    key_patterns: [ '^[a-z][a-z0-9_]*$' ]
    description: "cache engine -> 缓存条目；key 是缓存引擎，value 是条目列表"
    item_fields:
      - { name: prefix, type: _types.string, required: true, pattern: '^[a-z][a-z0-9_:-]*$', description: "Redis key 前缀；同一引擎内唯一" }
      - { name: key, type: _types.list<_types.string>, required: true, unique: true, min_items: 1, description: "缓存键列" }
      - { name: cache_of, type: _types.string, required: true, pattern: '^data\.tables\.[a-z][a-z0-9_]*$', description: "权威表 ID" }
      - { name: retention, type: _types.boolean, required: true, description: "缓存保留开关" }
      - { name: unit, type: _types.string, required: false, enum: [ minutes, hours, days ], description: "缓存保留单位" }
      - { name: cache_ttl, type: _types.integer, required: false, min: 1, description: "缓存保留时长" }

rules:
  - { id: storage-registry, text: "storage.tables 每个引擎条目是 map<list<object>>：table 必填、同引擎内不重复、覆盖每张物理表且只引用已存在的表；每张表只能出现在一个权威引擎下；基类不是物理表；caches 条目是 map<list<object>>，cache_of 必须引用已登记的权威表", implemented_by: [ storage-registry ] }
  - { id: storage-entry-fields, text: "普通条目只允许 table/description/retention/unit/ttl", implemented_by: [ storage-entry-fields ] }
  - { id: storage-cache-fields, text: "caches 条目只允许 cache_of/key/prefix/retention/unit/cache_ttl", implemented_by: [ storage-cache-fields ] }
  - { id: storage-archive-fields, text: "归档条目只允许 archive_of/promotable/on_conflict/table/retention/unit/ttl/age_by/after_unit/after", implemented_by: [ storage-archive-fields ] }
  - { id: storage-cache-prefix, text: "caches[].prefix 在同一引擎内唯一", implemented_by: [ storage-cache-prefix ] }
  - { id: storage-entry-description, text: "tables 条目二选一：普通条目写 description（等于对应 data.tables 的 summary），归档条目写 archive_of；两者互斥", implemented_by: [ storage-entry-description ] }
  - { id: storage-cache-key, text: "caches 的 key 是非空去重列名列表（account_id / col.account_id / 完整列引用），表由 cache_of 确定，每列必须属于该表（含继承列）；同一引擎内 (cache_of,key) 唯一，key 顺序参与比较；跨引擎同 (cache_of,key) 视为同一逻辑缓存", implemented_by: [ storage-cache-key ] }
  - { id: storage-cache-used-by, text: "storage.caches 的每个逻辑缓存必须至少被一个查询的 caches 有效引用（cache_of 在 query.tables 中）；未被引用或只有无效引用的缓存必须删除", implemented_by: [ storage-cache-used-by ] }
  - { id: storage-engine, text: "storage.tables 的键必须在 supported_engines 中，且每个 supported_engine 都必须有对应条目列表", implemented_by: [ storage-engine ] }
  - { id: storage-retention, text: "retention 是布尔开关；cache 条目必须写 retention:true；未开启（false/省略/非布尔）时禁止 unit 与 ttl", implemented_by: [ storage-retention ] }
  - { id: storage-duration, text: "retention:true 时表条目必须写 unit 和 ttl，cache 条目必须写 unit/cache_ttl；unit 只能是 minutes/hours/days；时长必须 >= 1", implemented_by: [ storage-duration ] }
  - { id: storage-ttl-bound, text: "cache_ttl 不得超过权威表条目的 ttl（若声明）", implemented_by: [ storage-ttl-bound ] }
  - { id: storage-archive-source, text: "归档条目必须写 archive_of/promotable/table/age_by/after_unit/after；promotable 是布尔；on_conflict 只能是 skip/overwrite/error，promotable:true 时必须写，false 时禁止；table 必须是 snake_case；age_by 只能是 created_at/updated_at；after_unit 只能是 minutes/hours/days；after >= 1", implemented_by: [ storage-archive-source ] }
  - { id: storage-archive-ref, text: "archive_of 必须是已登记的权威表且一表只能有一条归档；归档表名不得与物理表或其他归档表重名；age_by 必须是源表列", implemented_by: [ storage-archive-ref ] }
