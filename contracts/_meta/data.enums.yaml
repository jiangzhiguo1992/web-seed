# 跨前后端枚举；持久化为整数 code。

id: meta.data.enums
contract: data.enums
title: "枚举集合契约"
targets:
  dir: "contracts/data/enums"
  glob: "*.yaml"
  id: "data.enums.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: _types.basics.string
    required: true
    pattern: '^data\.enums\.[a-z][a-z0-9_]*$'
    description: "集合文件 ID"

  - name: summary
    type: _types.basics.string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: _types.basics.string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "枚举集合归属模块"

  - name: schema_version
    type: _types.basics.integer.32
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: _types.basics.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.structures.set<_types.basics.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: enums
    type: _types.structures.list<_types.structures.object>
    required: true
    description: "枚举项列表"
    item_fields:
      - { name: name, type: _types.basics.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "枚举名；项 ID 为 data.enums.<name>" }
      - { name: description, type: _types.basics.string, required: true, description: "枚举用途" }
      - { name: go_type, type: _types.basics.string, required: true, pattern: '^[A-Z][A-Za-z0-9]*$', description: "Go 类型名" }
      - { name: ts_type, type: _types.basics.string, required: true, pattern: '^[A-Z][A-Za-z0-9]*$', description: "TS 类型名" }
      - name: values
        type: _types.structures.list<_types.structures.object>
        required: true
        description: "枚举值列表"
        item_fields:
          - { name: value, type: _types.basics.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "对外字符串值" }
          - { name: code, type: _types.basics.integer.32, required: true, min: 0, max: 2147483647, description: "持久化整数码" }
          - { name: description, type: _types.basics.string, required: true, description: "枚举值说明" }
      - name: used_by
        type: _types.structures.set<_types.basics.string>
        required: true
        unique: true
        min_items: 1
        generated: true
        write: forbidden
        pattern: '^(data\.entities\.[a-z][a-z0-9_]*|cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*|cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*|cap\.protocols\.http\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*)$'
        description: "使用该枚举的 entity / service / event / http operation；由 make gen-graph 写入"

rules:
  - { id: enum-key-order, text: "枚举集合字段顺序必须与 _meta/data.enums.yaml 的 fields 顺序一致；嵌套对象同序", implemented_by: [ enum-key-order ] }
  - { id: enum-id, text: "文件 id 必须等于 targets 派生的 data.enums.<file>；枚举项 ID 固定为 data.enums.<name>", implemented_by: [ enum-id ] }
  - { id: enum-values-unique, text: "同一枚举的 values 不得重复", implemented_by: [ enum-values-unique ] }
  - { id: enum-code-unique, text: "同一枚举的 code 不得重复", implemented_by: [ enum-code-unique ] }
  - { id: enum-type-unique, text: "go_type / ts_type 在全部枚举文件中不得重复", implemented_by: [ enum-type-unique ] }
  - { id: enum-used-by, text: "used_by 必须等于 entity 字段与具体 capability 使用点的并集：service 项、event topic/subscribe/cron/dispatch、http operation；不统计物理表/query/feature；由 make gen-graph 写入，禁止手改", implemented_by: [ enum-used-by ] }
  - { id: enum-owner-module, text: "文件 stem 必须等于 owner_module；data.enums.<module> 的文件只能放该模块的枚举", implemented_by: [ enum-owner-module ] }
  - { id: enum-do-not-specific, text: "do_not 每条必须含文件 ID data.enums.<file>、枚举 name 或 go_type/ts_type；通用规则放组 README，禁止复制", implemented_by: [ enum-do-not-specific ] }
