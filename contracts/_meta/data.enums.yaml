# data.enums 类型的单一规范：字段树 + 值域 + 字段说明。
# 通用字段语义见 _types.yaml 的 schema_semantics。
#
# 集合契约：文件 id 为 data.enums；每个枚举项 id 为 data.enums.<name>。
# 该文件同时是 contract-new 的字段来源；不要另写模板。

id: meta.data.enums
type: data.enums
title: "跨端枚举契约"
targets:
  file: "contracts/data/enums.yaml"
  id: "data.enums"

fields:
  - { name: schema_version, type: integer, required: true, const: 1, description: "契约格式版本，固定 1" }
  - { name: id, type: string, required: true, const: data.enums, description: "集合文件 ID" }
  - { name: summary, type: string, required: true, description: "一句话说明枚举集合" }
  - { name: stability, type: string, required: true, enum: [stable, draft, deprecated], description: "契约稳定度" }
  - name: enums
    type: list<object>
    required: true
    description: "跨前后端枚举；模块内部枚举不进本文件"
    generates: "Go 常量、TS union"
    caution: "不要收只在一个模块内部使用的枚举；表列不引用枚举"
    item_fields:
      - { name: id, type: string, required: true, description: "枚举项 ID，等于 data.enums.<name>" }
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "枚举名，snake_case" }
      - { name: description, type: string, required: false, description: "枚举用途说明" }
      - { name: go_type, type: string, required: true, pattern: '^[A-Z][A-Za-z0-9]*$', description: "Go 类型名，PascalCase；集合内唯一" }
      - { name: ts_type, type: string, required: true, pattern: '^[A-Z][A-Za-z0-9]*$', description: "TS 类型名，PascalCase；集合内唯一" }
      - name: values
        type: list<object>
        required: true
        description: "枚举值列表；只能追加，不能改名或删除"
        item_fields:
          - { name: value, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "对外字符串值（API/TS），snake_case；数据库存 code" }
          - { name: code, type: integer, required: true, min: 0, description: "数据库整数码；entity 映射回枚举" }
          - { name: description, type: string, required: false, description: "枚举值说明" }

rules:
  - { id: enum-id, text: "集合 id 固定为 data.enums", implemented_by: [enum-id] }
  - { id: enum-id-matches-name, text: "item.id 必须等于 data.enums.<item.name>", implemented_by: [enum-id-matches-name] }
  - { id: enum-values-unique, text: "同一枚举的 values 不得重复", implemented_by: [enum-values-unique] }
  - { id: enum-code-unique, text: "同一枚举的 code 不得重复", implemented_by: [enum-code-unique] }
  - { id: enum-type-unique, text: "同一集合内 go_type / ts_type 不得重复", implemented_by: [enum-type-unique] }
  - { id: enum-append-only, text: "枚举值只能追加；code 一旦分配不得复用或修改", implemented_by: [enum-append-only] }
