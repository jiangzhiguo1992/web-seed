# data.enums 类型规范：跨前后端枚举集合；枚举项无 id。

id: meta.data.enums
type: data.enums
title: "枚举集合契约"
targets:
  file: "contracts/data/enums.yaml"
  id: "data.enums"

fields:
  - name: id
    type: string
    required: true
    description: "集合文件 ID"

  - name: summary
    type: string
    required: true
    description: "一句话说明"

  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: list<string>
    required: true
    description: "实例级负向约束"

  - name: enums
    type: list<object>
    required: true
    description: "枚举项列表"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "枚举名；项 ID 派生为 data.enums.<name>" }
      - { name: description, type: string, required: false, description: "枚举用途" }
      - { name: go_type, type: string, required: true, pattern: '^[A-Z][A-Za-z0-9]*$', description: "Go 类型名" }
      - { name: ts_type, type: string, required: true, pattern: '^[A-Z][A-Za-z0-9]*$', description: "TS 类型名" }
      - name: values
        type: list<object>
        required: true
        description: "枚举值列表"
        item_fields:
          - { name: value, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "对外字符串值" }
          - { name: code, type: integer, required: true, min: 0, max: 2147483647, description: "持久化整数码" }
          - { name: description, type: string, required: false, description: "枚举值说明" }
      - name: used_by
        type: object
        required: true
        description: "使用该枚举的 entity / capability"
        fields:
          - { name: entities, type: list<string>, required: true, unique: true, description: "entity ID 列表" }
          - { name: capabilities, type: list<string>, required: true, unique: true, description: "capability ID 列表" }

rules:
  - { id: enum-key-order, text: "枚举集合字段顺序必须与 _meta/data.enums.yaml 的 fields 顺序一致；嵌套对象同序", implemented_by: [ enum-key-order ] }
  - { id: enum-id, text: "集合 id 固定为 data.enums", implemented_by: [ enum-id ] }
  - { id: enum-values-unique, text: "同一枚举的 values 不得重复", implemented_by: [ enum-values-unique ] }
  - { id: enum-code-unique, text: "同一枚举的 code 不得重复", implemented_by: [ enum-code-unique ] }
  - { id: enum-type-unique, text: "同一集合内 go_type / ts_type 不得重复", implemented_by: [ enum-type-unique ] }
  - { id: enum-used-by, text: "used_by.entities/capabilities 必须与 entity 字段和 capability 引用完全一致；不统计物理表/feature；空列表合法", implemented_by: [ enum-used-by ] }
  - { id: enum-do-not-specific, text: "do_not 每条必须含集合 ID data.enums、枚举 name 或 go_type/ts_type；通用规则放组 README，禁止复制", implemented_by: [ enum-do-not-specific ] }
