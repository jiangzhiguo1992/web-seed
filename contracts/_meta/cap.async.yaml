# cap.async 类型规范：异步任务契约，按模块组织。
# 异步任务引用一个同步 service 作为 handler；trigger/retry/concurrency 只在此声明。

id: meta.cap.async
type: cap.async
title: "异步任务契约"
targets:
  dir: "contracts/capabilities/async"
  glob: "*.yaml"
  id: "cap.async.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: string
    required: true
    pattern: '^cap\.async\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "任务归属模块"

  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: list<string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: scope
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "业务范围"

  - name: jobs
    type: list<object>
    required: true
    min_items: 1
    description: "异步任务项；item ID = cap.async.<file>.<snake_case(name)>"
    item_fields:
      - { name: id, type: string, required: true, pattern: '^cap\.async\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "任务 ID" }
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "任务名" }
      - { name: summary, type: string, required: true, description: "一句话说明" }
      - { name: service, type: string, required: true, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "同步 handler service" }
      - name: trigger
        type: object
        required: true
        description: "触发方式"
        fields:
          - { name: type, type: string, required: true, enum: [ cron, event, webhook ], description: "触发类型" }
          - { name: schedule, type: string, required: false, description: "cron 表达式；type=cron 时必须" }
          - { name: event, type: string, required: false, pattern: '^cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "事件 ID；type=event 时必须" }
          - { name: path, type: string, required: false, pattern: '^/', description: "webhook 路径；type=webhook 时必须" }
          - { name: method, type: string, required: false, enum: [ get, post, put, patch, delete ], description: "webhook HTTP 方法；type=webhook 时必须" }
      - name: retry
        type: object
        required: false
        description: "重试与死信"
        fields:
          - { name: max_attempts, type: integer, required: true, min: 1, description: "最大尝试次数" }
          - { name: backoff, type: string, required: true, enum: [ fixed, exponential ], description: "退避策略" }
          - { name: dead_letter, type: boolean, required: true, description: "是否进入死信" }
      - name: concurrency
        type: object
        required: false
        description: "并发与分布式锁"
        fields:
          - { name: key, type: string, required: true, description: "并发键模板" }
          - { name: ttl, type: string, required: false, pattern: '^[0-9]+(s|m|h|d)$', description: "锁 TTL" }

rules:
  - { id: async-service, text: "service 必须存在且与 async 文件的 owner_module 同模块；被 async 引用的 service 不得被 cap.protocols.http 绑定", implemented_by: [ async-service ] }
  - { id: async-trigger, text: "type=cron 必须有 schedule；type=event 必须有存在的事件；type=webhook 必须有 path/method；其余类型不得写 schedule/event/path/method", implemented_by: [ async-trigger ] }
  - { id: async-structure, text: "job name 在文件内唯一；retry.max_attempts >= 1；concurrency.key 必填；async job 不得重复声明同一 (trigger, service)", implemented_by: [ async-structure ] }
