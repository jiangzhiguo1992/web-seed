# 错误码文件：全局约定 + 分域错误码 + 基础设施基线。

id: meta.platform.errors
type: platform.errors
title: "错误码契约"
targets:
  dir: "contracts/platform/errors"
  glob: "*.yaml"
  id: "platform.errors.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: _types.string
    required: true
    pattern: '^platform\.errors\.[a-z][a-z0-9_]*$'
    description: "契约 ID"
  - name: summary
    type: _types.string
    required: true
    min_len: 1
    description: "一句话说明"
  - name: schema_version
    type: _types.integer
    required: true
    const: 1
    description: "格式版本"
  - name: stability
    type: _types.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"
  - name: do_not
    type: _types.set<_types.string>
    required: true
    unique: true
    description: "实例级负向约束"
  - name: naming
    type: _types.object
    required: false
    description: "错误码命名约定"
    fields:
      - { name: pattern, type: _types.string, required: true, description: "错误码模式" }
      - { name: common_prefix, type: _types.string, required: true, description: "公共错误前缀" }
      - { name: max_total, type: _types.integer, required: true, min: 0, description: "错误码总数上限" }
  - name: biz_code
    type: _types.object
    required: false
    description: "业务码分配"
    fields:
      - { name: success_code, type: _types.integer, required: true, description: "成功业务码" }
      - name: ranges
        type: _types.map<_types.list<_types.integer>>
        required: true
        key_patterns: [ '^[a-z][a-z0-9_]*$' ]
        description: "域 → 业务码区间"
  - name: order
    type: _types.list<_types.string>
    required: false
    unique: true
    description: "错误文件加载顺序"
  - name: mapping_rules
    type: _types.list<_types.object>
    required: false
    description: "状态码映射规则"
    item_fields:
      - { name: status, type: _types.integer, required: true, min: 100, max: 599, description: "HTTP 状态码" }
      - { name: when, type: _types.string, required: true, description: "适用场景" }
  - name: errors
    type: _types.list<_types.object>
    required: false
    min_items: 1
    unique_key: code
    description: "错误码项"
    item_fields:
      - { name: code, type: _types.string, required: true, pattern: '^[A-Z][A-Z0-9_]*$', description: "错误码" }
      - { name: biz_code, type: _types.integer, required: true, min: 1, max: 9999, description: "业务码" }
      - { name: status, type: _types.integer, required: true, min: 100, max: 599, description: "HTTP 状态码" }
      - { name: retryable, type: _types.boolean, required: true, description: "是否可重试" }
      - { name: i18n, type: _types.string, required: true, min_len: 1, description: "i18n key" }
      - { name: message, type: _types.string, required: true, min_len: 1, description: "默认消息" }
  - name: common_errors
    type: _types.list<_types.string>
    required: false
    unique: true
    min_items: 1
    pattern: '^platform\.errors\.[A-Z][A-Z0-9_]*$'
    description: "基础设施错误基线"

rules:
  - { id: error-file-placement, text: "_base.yaml 只写 naming/biz_code/order/mapping_rules；errors 只在域文件；common_errors 只在 data_access.yaml；_base 不写 errors/common_errors，data_access 不写 errors", implemented_by: [ error-file-placement ] }
  - { id: error-i18n-derivation, text: "i18n 必须等于 errors.<code 小写，首个 _ 换成 .>；如 AUTH_TOKEN_INVALID → errors.auth.token_invalid", implemented_by: [ error-i18n-derivation ] }
  - { id: error-i18n-locale, text: "每个 errors[].i18n 必须存在于 project.defaults.locales（含默认 locale）对应的 apps/web/admin/src/shared/locales/<locale>.json；默认 locale 值必须等于 errors[].message，其他 locale 值非空；所有 locale 不得有多余 key", implemented_by: [ error-i18n-locale ] }
