# 业务规则：约束/不变量/策略。

id: meta.feature.rules
contract: feature.rules
title: "业务规则契约"
targets:
  dir: "contracts/features/rules"
  glob: "*.yaml"
  id: "feature.rules.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: _types.basics.string
    required: true
    pattern: '^feature\.rules\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: _types.basics.string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: _types.basics.string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "规则归属模块；按业务主体而非实现模块"

  - name: schema_version
    type: _types.basics.integer.32
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: _types.basics.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.structures.set<_types.basics.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: rules
    type: _types.structures.list<_types.structures.object>
    required: true
    min_items: 1
    description: "规则项"
    item_fields:
      - { name: id, type: _types.basics.string, required: true, pattern: '^feature\.rules\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "规则 ID" }
      - { name: kind, type: _types.basics.string, required: true, enum: [ constraint, invariant, policy ], description: "constraint=字段级校验；invariant=断言；policy=人工实现" }
      - { name: summary, type: _types.basics.string, required: true, description: "一句话说明" }
      - { name: errors, type: _types.structures.set<_types.basics.string>, required: false, unique: true, pattern: '^platform\.errors\.[A-Z][A-Z0-9_]*$', description: "违反规则时可能返回的错误码；实现该规则的 service 必须声明" }
      - { name: entity, type: _types.basics.string, required: false, pattern: '^data\.entities\.[a-z][a-z0-9_]*$', description: "constraint 的实体" }
      - { name: field, type: _types.basics.string, required: false, pattern: '^[a-z][a-zA-Z0-9_]*$', description: "constraint 的字段名（json_name）" }
      - { name: op, type: _types.basics.string, required: false, enum: [ eq, ne, gt, ge, lt, le, in, not_in, pattern, min_len, max_len, required, not_null ], description: "constraint 的比较操作" }
      - { name: value, type: _types.basics.any, required: false, description: "constraint 的期望值" }
      - { name: assert, type: _types.basics.string, soft: true, required: false, description: "invariant 的断言表达式" }
      - { name: implemented_by, type: _types.structures.set<_types.basics.string>, required: true, unique: true, min_items: 1, generated: true, write: forbidden, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "实现该规则的 service 项；由 gen-graph 写入" }
      - { name: given, type: _types.basics.string, soft: true, required: false, description: "policy 前置条件" }
      - { name: when, type: _types.basics.string, soft: true, required: false, description: "policy 触发场景" }
      - { name: then, type: _types.basics.string, soft: true, required: false, description: "policy 期望结果" }

rules:
  - { id: rule-structure, text: "kind=constraint 必须有 entity/field/op/value 且不得有 assert/given/when/then；entity 必须是存在的 data.entities.*，field 必须是该实体的非关系字段或基类列；kind=invariant 必须有 assert 且不得有 entity/field/op/value/given/when/then；kind=policy 不得有 entity/field/op/value/assert；errors 必须是存在的 platform.errors.*；implemented_by 必须指向存在的 cap.services.*，非空由字段 min_items 保证", implemented_by: [ rule-structure ] }
  - { id: rule-value, text: "constraint 的 op/value 必须可判定：pattern 为非空合法正则且字段为 string；in/not_in 为非空标量列表；min_len/max_len 为非负整数且字段为 string；required/not_null 为布尔；eq/ne 为标量；gt/ge/lt/le 为数字且字段为数值或时间", implemented_by: [ rule-value ] }
  - { id: rule-id-unique, text: "规则 ID 全局唯一，且必须以文件 ID 为前缀", implemented_by: [ rule-id-unique ] }
