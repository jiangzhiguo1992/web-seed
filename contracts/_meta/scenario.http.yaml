# HTTP 验收场景：确定性请求 → 响应 → 持久数据。

id: meta.scenario.http
type: scenario.http
title: "HTTP 验收场景"
targets:
  dir: "contracts/scenarios/http"
  glob: "*.yaml"
  id: "scenario.http.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: _types.string
    required: true
    pattern: '^scenario\.http\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: _types.string
    required: true
    description: "一句话说明"

  - name: schema_version
    type: _types.integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: _types.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.set<_types.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: scenarios
    type: _types.list<_types.object>
    required: true
    min_items: 1
    description: "场景列表"
    item_fields:
      - { name: name, type: _types.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "场景名；项 ID 为 scenario.http.<file>.<name>" }
      - { name: summary, type: _types.string, required: true, description: "场景说明" }
      - { name: operation, type: _types.string, required: true, pattern: '^cap\.protocols\.http\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "被测 HTTP operation" }
      - name: actor
        type: _types.object
        required: true
        description: "调用者"
        fields:
          - { name: anonymous, type: _types.boolean, required: true, description: "是否匿名" }
          - { name: role, type: _types.string, required: false, pattern: '^platform\.security\.roles\.[a-z][a-z0-9_]*$', description: "角色" }
          - { name: permissions, type: _types.set<_types.string>, required: false, unique: true, min_items: 1, pattern: '^platform\.security\.permissions\.[a-z][a-z0-9_]*$', description: "额外权限" }
      - name: given
        type: _types.object
        required: true
        description: "前置状态"
        fields:
          - { name: clock, type: _types.string, required: true, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$', description: "注入时钟 RFC3339 UTC" }
          - { name: id_seq, type: _types.list<_types.integer>, required: true, unique: true, min_items: 1, description: "注入 ID 序列" }
          - { name: db, type: _types.any, soft: true, required: true, description: "表 ID → 行列表；必须覆盖链上所有读表" }
      - name: when
        type: _types.object
        required: true
        description: "请求"
        fields:
          - { name: path, type: _types.map<_types.any>, required: false, description: "path 参数" }
          - { name: query, type: _types.map<_types.any>, required: false, description: "query 参数" }
          - { name: headers, type: _types.map<_types.any>, required: false, description: "请求头" }
          - { name: cookies, type: _types.map<_types.any>, required: false, description: "cookie" }
          - { name: body, type: _types.any, soft: true, required: false, description: "请求体" }
          - { name: idempotency_key, type: _types.string, required: false, description: "Idempotency-Key" }
      - name: then
        type: _types.object
        required: true
        description: "期望"
        fields:
          - name: response
            type: _types.object
            required: true
            description: "响应断言"
            fields:
              - { name: status, type: _types.integer, required: true, min: 100, max: 599, description: "HTTP 状态码" }
              - { name: headers, type: _types.map<_types.any>, required: false, description: "响应头断言" }
              - { name: body, type: _types.any, soft: true, required: false, description: "响应体精确断言" }
          - name: db
            type: _types.object
            required: true
            description: "持久数据差异"
            fields:
              - { name: added, type: _types.any, soft: true, required: true, description: "表 ID → 新增行" }
              - { name: changed, type: _types.any, soft: true, required: true, description: "表 ID → {key,set} 变更" }
              - { name: removed, type: _types.any, soft: true, required: true, description: "表 ID → 删除行 key" }
              - { name: unchanged, type: _types.string, required: true, enum: [ strict ], description: "全库未声明变化必须为零" }
          - { name: events, type: _types.list<_types.string>, required: false, unique: true, min_items: 1, pattern: '^cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "期望发出的领域事件" }

rules:
  - { id: scenario-structure, text: "id 必须由 targets 派生；场景 name 在文件内唯一；每个场景必须有 operation 与 then.unchanged: strict", implemented_by: [ scenario-structure ] }
  - { id: scenario-refs, text: "operation 必须是已存在的 cap.protocols.http.*；then.response.status 必须在该 operation 的有效 responses 中；role/permissions/events 必须存在", implemented_by: [ scenario-refs ] }
  - { id: scenario-db, text: "given.db 与 then.db 的表 ID 必须存在且属于该 operation 的 service 链；每个场景必须覆盖链上表；then.db 只允许链上写表", implemented_by: [ scenario-db ] }
