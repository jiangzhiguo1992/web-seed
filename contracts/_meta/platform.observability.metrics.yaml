# 指标名与标签；结构由 contract-check 校验。

id: meta.platform.observability.metrics
type: platform.observability.metrics
title: "指标名与标签"
targets:
  dir: "contracts/platform/observability"
  glob: "metrics.yaml"
  id: "platform.observability.metrics"
  naming: "snake_case"

fields:
  - name: schema_version
    type: _types.integer
    required: true
    const: 1
    description: "格式版本"
  - name: id
    type: _types.string
    required: true
    const: platform.observability.metrics
    description: "契约 ID"
  - name: summary
    type: _types.string
    required: true
    description: "一句话说明"
  - name: stability
    type: _types.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"
  - name: do_not
    type: _types.set<_types.string>
    required: true
    unique: true
    description: "实例级负向约束"
  - name: naming
    type: _types.any
    soft: true
    required: true
    description: "命名规则"
  - name: metrics
    type: _types.list<_types.any>
    required: true
    min_items: 1
    description: "指标清单"
  - name: label_rules
    type: _types.any
    soft: true
    required: true
    description: "标签规则"
  - name: exporter
    type: _types.any
    soft: true
    required: true
    description: "导出配置"

rules:
  - { id: metric-shape, text: "指标名唯一；labels 不得使用 label_rules.forbidden_labels；kind 只允许 counter/gauge/histogram", implemented_by: [ metric-shape ] }
