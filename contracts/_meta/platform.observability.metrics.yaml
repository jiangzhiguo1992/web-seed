# 指标名、标签与导出配置。

id: meta.platform.observability.metrics
contract: platform.observability.metrics
title: "指标名与标签"
targets:
  dir: "contracts/platform/observability"
  glob: "metrics.yaml"
  id: "platform.observability.metrics"
  naming: "snake_case"

fields:
  - name: id
    type: _types.basics.string
    required: true
    const: platform.observability.metrics
    description: "契约 ID"
  - name: summary
    type: _types.basics.string
    required: true
    description: "一句话说明"
  - name: schema_version
    type: _types.basics.integer.32
    required: true
    const: 1
    description: "格式版本"
  - name: stability
    type: _types.basics.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"
  - name: do_not
    type: _types.structures.set<_types.basics.string>
    required: true
    unique: true
    description: "实例级负向约束"
  - name: naming
    type: _types.structures.object
    required: true
    description: "命名规则"
    fields:
      - { name: pattern, type: _types.basics.string, required: true, description: "指标名模板" }
      - { name: unit_suffixes, type: _types.structures.list<_types.basics.string>, required: true, min_items: 1, description: "允许的单位后缀" }
  - name: metrics
    type: _types.structures.list<_types.structures.object>
    required: true
    min_items: 1
    description: "指标清单"
    item_fields:
      - { name: name, type: _types.basics.string, required: true, description: "指标名" }
      - { name: kind, type: _types.basics.string, required: true, description: "指标类型" }
      - { name: labels, type: _types.structures.list<_types.basics.string>, required: true, description: "标签" }
      - { name: buckets, type: _types.structures.list<_types.basics.float.64>, required: false, description: "直方图分桶" }
      - { name: description, type: _types.basics.string, required: true, description: "指标含义" }
  - name: label_rules
    type: _types.structures.object
    required: true
    description: "标签规则"
    fields:
      - { name: low_cardinality_only, type: _types.basics.boolean, required: true, description: "是否只允许低基数标签" }
      - { name: forbidden_labels, type: _types.structures.list<_types.basics.string>, required: true, description: "禁止标签" }
      - { name: route_label, type: _types.basics.string, required: true, description: "路由标签规则" }
  - name: exporter
    type: _types.structures.object
    required: true
    description: "导出配置"
    fields:
      - { name: default, type: _types.basics.string, required: true, description: "默认导出器" }
      - { name: options, type: _types.structures.list<_types.basics.string>, required: true, min_items: 1, description: "可选导出器" }
      - { name: config_source, type: _types.basics.string, required: true, description: "配置来源" }

rules:
  - { id: metric-shape, text: "指标名唯一；counter 必须以 _total 结尾，histogram 必须以 naming.unit_suffixes 中的单位结尾（_total 除外）；同一指标的 labels 不得重复；labels 不得使用 label_rules.forbidden_labels；kind 只允许 counter/gauge/histogram；exporter.default 必须属于 exporter.options", implemented_by: [ metric-shape ] }
