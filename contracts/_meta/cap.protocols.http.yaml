# service 的 HTTP 绑定（OpenAPI 3.1）。

id: meta.cap.protocols.http
type: cap.protocols.http
title: "HTTP 协议绑定契约"
targets:
  dir: "contracts/capabilities/protocols/http"
  glob: "*.yaml"
  id: "cap.protocols.http.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: _types.string
    required: true
    pattern: '^cap\.protocols\.http\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: _types.string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: _types.string
    required: false
    pattern: '^[a-z][a-z0-9_]*$'
    description: "所属模块；纯组件文件可省略"

  - name: schema_version
    type: _types.integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: _types.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.set<_types.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: mount
    type: _types.object
    required: false
    description: "文件级挂载：公共资源前缀与调用端；有 paths 时必填"
    fields:
      - { name: path, type: _types.string, required: true, pattern: '^/([A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+$|^/$', description: "公共资源前缀，如 /account；audience 段写在 paths 里，不写 /account/admin" }
      - { name: audience, type: _types.list<_types.string>, required: true, unique: true, min_items: 1, pattern: '^[a-z][a-z0-9_-]*$', description: "调用端；值必须在 platform.http_conventions.audiences 中" }

  - name: paths
    type: _types.map<_types.object>
    required: false
    key_patterns: [ '^/([A-Za-z0-9_{}.-]+/)*[A-Za-z0-9_{}.-]+$|^/$' ]
    description: "相对路径 → method → operation；完整 path = mount.path + key"
    item_fields:
      - name: get
        type: _types.object
        required: false
        description: "GET operation"
        item_fields: &http_operation
          - { name: id, type: _types.string, required: true, pattern: '^cap\.protocols\.http\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "operation 契约 ID" }
          - { name: name, type: _types.string, required: true, pattern: '^[a-z][A-Za-z0-9]*$', description: "OpenAPI operationId" }
          - { name: service, type: _types.string, required: true, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "绑定的同步 public service" }
          - { name: summary, type: _types.string, required: true, description: "operation 说明" }
          - { name: used_by, type: _types.list<_types.string>, required: true, unique: true, min_items: 1, pattern: '^feature\.pages\.[a-z][a-z0-9_]*$', description: "页面消费者；必须非空；精确集合由 http-consumer 校验" }
          - { name: security, type: _types.list<_types.any>, required: false, description: "OpenAPI security requirement 列表；scheme 由 http-security 校验" }
          - name: request
            type: _types.object
            required: true
            description: "请求绑定"
            fields:
              - { name: headers, type: _types.map<_types.any>, required: false, description: "header 名 → 组件名或 {schema,required}" }
              - { name: path, type: _types.map<_types.any>, required: false, description: "path 参数 → {schema,required}" }
              - { name: query, type: _types.map<_types.any>, required: false, description: "query 参数 → {schema,required}" }
              - { name: cookies, type: _types.map<_types.any>, required: false, description: "cookie 参数 → 组件名或 {schema,required}" }
              - name: body
                type: _types.object
                required: false
                description: "请求体"
                fields:
                  - { name: content_type, type: _types.string, required: true, description: "媒体类型；当前固定 application/json" }
                  - { name: schema, type: _types.any, soft: true, required: true, description: "类型 ID 或匿名 object 节点" }
                  - { name: required, type: _types.boolean, required: false, description: "是否必填；默认 true；映射必填 service 参数时不得为 false" }
              - name: mapping
                type: _types.object
                required: true
                description: "HTTP 参数 → service 参数路径"
                fields:
                  - { name: body, type: _types.any, soft: true, required: false, description: "service 参数名或字段映射" }
                  - { name: path, type: _types.map<_types.string>, required: false, description: "path 参数 → service 参数路径" }
                  - { name: query, type: _types.map<_types.string>, required: false, description: "query 参数 → service 参数路径" }
                  - { name: header, type: _types.map<_types.string>, required: false, description: "header 参数 → service 参数路径" }
                  - { name: cookie, type: _types.map<_types.string>, required: false, description: "cookie 参数 → service 参数路径" }
              - { name: idempotency, type: _types.string, required: true, enum: [ none, optional, required ], description: "幂等模式" }
          - name: response
            type: _types.map<_types.object>
            required: true
            key_patterns: [ '^[1-5][0-9]{2}$' ]
            description: "HTTP 状态码 → 响应；2xx 写 description/headers/body，非 2xx 只写 codes"
            item_fields:
              - { name: description, type: _types.string, required: false, description: "响应说明；2xx 必填" }
              - { name: headers, type: _types.map<_types.any>, required: false, description: "响应头 → 组件名或定义" }
              - name: body
                type: _types.object
                required: false
                description: "响应体；2xx 带 body 时必填"
                fields:
                  - { name: content_type, type: _types.string, required: true, description: "媒体类型" }
                  - { name: schema, type: _types.any, soft: true, required: true, description: "返回类型 ID" }
              - { name: codes, type: _types.list<_types.string>, required: false, unique: true, min_items: 1, pattern: '^platform\.errors\.', description: "该状态下的业务错误 ID；非 2xx 必填" }
      - name: post
        type: _types.object
        required: false
        description: "POST operation"
        item_fields: *http_operation
      - name: put
        type: _types.object
        required: false
        description: "PUT operation"
        item_fields: *http_operation
      - name: patch
        type: _types.object
        required: false
        description: "PATCH operation"
        item_fields: *http_operation
      - name: delete
        type: _types.object
        required: false
        description: "DELETE operation"
        item_fields: *http_operation
      - name: head
        type: _types.object
        required: false
        description: "HEAD operation"
        item_fields: *http_operation
      - name: options
        type: _types.object
        required: false
        description: "OPTIONS operation"
        item_fields: *http_operation

  - name: shared
    type: _types.object
    required: false
    description: "跨模块共享组件；生成 OpenAPI 时转换为 components"
    fields:
      - { name: securitySchemes, type: _types.any, description: "安全方案定义" }
      - { name: schemas, type: _types.any, description: "共享 schema；每项必须带 source 溯源块" }
      - { name: parameters, type: _types.any, description: "共享参数定义" }
      - { name: headers, type: _types.any, description: "共享响应头定义" }
      - { name: responses, type: _types.any, description: "共享响应定义" }

rules:
  - { id: http-file, text: "文件 id 必须由 targets 派生", implemented_by: [ http-file ] }
  - { id: http-shape, text: "paths 必须是 path → method → operation 的固定结构；operation 必须使用 id/name/service/summary/used_by/request/response（security 可选）；request 只允许 headers/path/query/cookies/body/mapping/idempotency；response 的 key 是三位状态码，2xx 必须写 description/headers/body，非 2xx 只能写非空 codes；shared.schemas（规范化后 components.schemas）的 source 必须且只能声明一个溯源键", implemented_by: [ http-shape ] }
  - { id: http-version, text: "mount.path 与 paths 的 key 不得以 /v<数字> 开头；API 版本与 timeout_ms 只在 project.yaml 的 app 上声明，URL 前缀由生成器派生", implemented_by: [ http-version ] }
  - { id: http-mount, text: "有 paths 的文件必须有 mount：mount.path 以 / 开头且只写公共资源前缀（如 /account，不写 /account/admin）；audience 段放在 paths 的 key 里（如 /admin）；paths 的 key 是相对路径且以 / 开头；拼接后的 path 全局唯一", implemented_by: [ http-mount ] }
  - { id: http-operation, text: "每个 operation 必须有全局唯一的 name、id、service；id 必须匹配当前文件且全局唯一；path+method 全局唯一；x-* 仅允许 x-contract-id/x-service/x-timeout-ms/x-service-params/x-idempotency（由 normalizer 生成，生成 OpenAPI 前删除）；service 必须指向存在的 public 同步 service", implemented_by: [ http-operation ] }
  - { id: http-default-errors, text: "平台基线错误状态必须由 platform/http_conventions.error_responses 声明，每个状态必须有 shared.responses 映射；operation 不得写空的错误 response", implemented_by: [ http-default-errors ] }
  - { id: http-audience, text: "mount.audience 非空且每个值在 platform.http_conventions.audiences 中；project.yaml 中 api app 的 audience 必须在其 include 的每个 HTTP 文件中至少出现一次", implemented_by: [ http-audience ] }
  - { id: http-consumer, text: "used_by 模板属性保证非空；脚本进一步校验它精确等于引用其 service 的 feature.pages 集合；每个页面引用的 service 必须至少被一个 operation 暴露", implemented_by: [ http-consumer ] }
  - { id: http-components, text: "shared.schemas（规范化后 components.schemas）每个条目必须且只能是 source.service_type、source.enum、source.entity 或 source.platform:true 之一；service_type/enum/entity 条目不得写 properties；platform 条目必须 additionalProperties:false；所有 $ref 必须指向存在的 schema/header/response/parameter", implemented_by: [ http-components ] }
  - { id: http-shared, text: "shared.securitySchemes 每项必须有受支持的 type；http 必须有 scheme，apiKey 必须有 name 与 in，oauth2 必须有 flows，每个 flow 必须有 authorizationUrl/tokenUrl（按 flow 类型）与 scopes；openIdConnect 必须有 openIdConnectUrl；shared.responses 每项必须有非空 description，headers 必须是名称或带 schema 的定义，content 每项必须有 schema；shared.parameters 必须有 name/in/schema 且 path 参数 required；shared.headers 必须有 schema；shared.schemas 必须有 source 且只声明一个源键，非 platform schema 不得写 properties", implemented_by: [ http-shared ] }
  - { id: http-security, text: "operation.security 引用的 scheme 必须在 shared.securitySchemes 中声明；受保护 operation 必须显式声明 security", implemented_by: [ http-security ] }
  - { id: http-idempotency, text: "每个 operation 必须声明 request.idempotency：none/optional/required；optional/required 必须在 request.headers 声明 Idempotency-Key，required 必须使用 IdempotencyKeyRequired；none 不得声明 Idempotency-Key", implemented_by: [ http-idempotency ] }
  - { id: http-headers, text: "每个 operation 必须在 request.headers 声明 X-Request-Id: RequestId；每个 response.<status>.headers 必须声明 X-Request-Id: XRequestId；使用 cookie 参数的 operation 必须在 request.headers 声明 X-CSRF-Token: CSRFToken", implemented_by: [ http-headers ] }
  - { id: http-retry-after, text: "429 与 503 的 shared response 必须声明 Retry-After；operation 不得声明缺少 Retry-After 的 429/503 响应", implemented_by: [ http-retry-after ] }
  - { id: http-service-type, text: "request.body 必须由 request.mapping.body 绑定；body.schema 直接引用类型 ID；$ref 形态的 body 类型必须是 service 的 params 类型；匿名 object 形态的 body 每个 property 必须映射到 service 的标量参数，且不得有多余字段", implemented_by: [ http-service-type ] }
  - { id: http-service-params, text: "request.mapping 的 body/path/query/header/cookie 映射必须指向 service 存在的参数或字段；service 每个必填非 ctx 参数必须被覆盖；HTTP 参数必须全部有映射（平台头 X-Request-Id/Idempotency-Key/X-CSRF-Token 除外）；映射两侧类型必须一致；映射到必填 service 参数的 requestBody 必须 required=true", implemented_by: [ http-service-params ] }
  - { id: http-service-return, text: "2xx 带 body 的 response.<status>.body.schema 必须直接引用类型 ID；该类型必须对应 service 的非 err return；204 要求 service 没有业务 return；禁止在 body schema 上写 x-service-return", implemented_by: [ http-service-return ] }
  - { id: http-errors, text: "每个 operation 的非 2xx response 必须以 codes 精确列出 service 错误闭包（由 service-errors 递归计算）去掉 COMMON_*，并按错误 status 分组；每个 code 的 status 必须等于所在 response 的 key；每个 service 错误必须落到平台基线状态或非 2xx response；禁止列出 COMMON_* 与未知错误", implemented_by: [ http-errors ] }
