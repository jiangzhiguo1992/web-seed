# service 的 HTTP 绑定（OpenAPI 3.1）。

id: meta.cap.protocols.http
type: cap.protocols.http
title: "HTTP 协议绑定契约"
targets:
  dir: "contracts/capabilities/protocols/http"
  glob: "*.yaml"
  id: "cap.protocols.http.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: _types.string
    required: true
    pattern: '^cap\.protocols\.http\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: _types.string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: _types.string
    required: false
    pattern: '^[a-z][a-z0-9_]*$'
    description: "所属模块；纯组件文件可省略"

  - name: schema_version
    type: _types.integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: _types.string
    required: true
    enum: [ stable, draft, deprecated ]
    description: "稳定度"

  - name: do_not
    type: _types.set<_types.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: base_path
    type: _types.string
    required: false
    pattern: '^/[A-Za-z0-9_\-]+(/[A-Za-z0-9_\-]+)*$'
    description: "URL 前缀"

  - name: default_error_responses
    type: _types.list<_types.integer>
    required: false
    unique: true
    min: 100
    max: 599
    description: "默认注入的错误状态码"

  - name: paths
    type: _types.any
    required: false
    description: "OpenAPI 3.1 path item"

  - name: components
    type: _types.any
    soft: true
    required: false
    description: "OpenAPI components；x-* 与 $ref 由 checker 校验，其余由生成器校验"

rules:
  - { id: http-file, text: "文件 id 必须由 targets 派生", implemented_by: [ http-file ] }
  - { id: http-operation, text: "每个 operation 必须有全局唯一的 operationId、x-contract-id、x-service；x-contract-id 必须匹配当前文件且全局唯一；path+method 全局唯一；x-timeout-ms 必须为正整数；x-* 仅允许 x-contract-id/x-service/x-timeout-ms/x-default-errors；x-service 必须指向存在的 public 同步 service", implemented_by: [ http-operation ] }
  - { id: http-default-errors, text: "default_error_responses 与 x-default-errors 的状态码必须为 100-599；每个状态码必须有 components.responses 映射；operation 不得重复声明生效的默认状态码", implemented_by: [ http-default-errors ] }
  - { id: http-components, text: "components.schemas 与 operation 内联 schema 的 object 必须 additionalProperties: false；x-service-type 必须是 cap.services.<file>.schemas.<Type>，x-enum/x-entity 必须全限定且指向存在的来源；所有 $ref 必须指向存在的 schema", implemented_by: [ http-components ] }
  - { id: http-retry-after, text: "default_error_responses 含 503 时必须定义 components.headers.RetryAfter 与 components.responses.ServiceUnavailable，且该响应声明 Retry-After；operation 的 503 响应必须声明 Retry-After", implemented_by: [ http-retry-after ] }
  - { id: http-service-type, text: "requestBody 的 $ref 必须是 x-service 指向的 service 的 params 类型，且该 component 的 x-service-type 必须属于同一 service", implemented_by: [ http-service-type ] }
  - { id: http-service-return, text: "response schema 的 x-service-return 必须是 data.entities.* 或 cap.services.<file>.schemas.<Type>，且是 x-service 指向的 service 的 returns 类型之一", implemented_by: [ http-service-return ] }
