# service 的 HTTP 绑定（OpenAPI 3.1）。

id: meta.cap.protocols.http
type: cap.protocols.http
title: "HTTP 协议绑定契约"
targets:
  dir: "contracts/capabilities/protocols/http"
  glob: "*.yaml"
  id: "cap.protocols.http.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: _types.string
    required: true
    pattern: '^cap\.protocols\.http\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: _types.string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: _types.string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "所属模块"

  - name: schema_version
    type: _types.integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: _types.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.set<_types.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: mount
    type: _types.object
    required: true
    description: "文件级挂载：API 版本、公共资源前缀与调用端"
    fields:
      - { name: api_version, type: _types.string, required: true, pattern: '^v[0-9]+$', description: "API 主版本；生成器据此派生 OpenAPI servers: /<api_version>" }
      - { name: path, type: _types.string, required: true, pattern: '^/([A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+$|^/$', description: "公共资源前缀，如 /account；audience 段写在 paths 里，不写 /account/admin" }
      - { name: audience, type: _types.list<_types.string>, required: true, unique: true, min_items: 1, pattern: '^[a-z][a-z0-9_-]*$', description: "调用端；值必须在 platform.http_conventions.audiences 中" }

  - name: paths
    type: _types.map<_types.object>
    required: true
    min_items: 1
    key_patterns: [ '^/([A-Za-z0-9_{}.-]+/)*[A-Za-z0-9_{}.-]+$|^/$' ]
    description: "相对路径 → method → operation；完整 path = mount.path + key，版本由 servers 承载"
    item_fields:
      - name: get
        type: _types.object
        required: false
        description: "GET operation"
        item_fields: &http_operation
          - { name: id, type: _types.string, required: true, pattern: '^cap\.protocols\.http\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "operation 契约 ID" }
          - { name: name, type: _types.string, required: true, pattern: '^[a-z][A-Za-z0-9]*$', description: "OpenAPI operationId" }
          - { name: service, type: _types.string, required: true, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "绑定的同步 public service" }
          - { name: summary, type: _types.string, required: true, description: "operation 说明" }
          - { name: used_by, type: _types.list<_types.string>, required: true, unique: true, min_items: 1, pattern: '^feature\.pages\.[a-z][a-z0-9_]*$', description: "页面消费者；必须非空；精确集合由 http-consumer 校验" }
          - name: security
            type: _types.object
            required: true
            description: "认证要求；BearerAuth 为 true 表示本次 API 必须携带 JWT access token"
            fields:
              - { name: BearerAuth, type: _types.boolean, required: true, description: "是否需要 Bearer JWT 认证" }
          - name: request
            type: _types.object
            required: true
            description: "请求绑定"
            fields:
              - name: path
                type: _types.list<_types.object>
                required: false
                unique_key: name
                description: "path 参数；每项必须写 name/schema/description/to"
                item_fields:
                  - { name: name, type: _types.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "path 参数名，必须与路径中的 {name} 一致" }
                  - { name: schema, type: _types.string, required: true, pattern: '^(_types\.[a-z][a-z0-9_]*(<[A-Za-z0-9_<>, ]+>)?|data\.enums\.[a-z][a-z0-9_]*)$', description: "参数类型；只允许标量/枚举类型 ID，不允许实体或匿名 object" }
                  - { name: description, type: _types.string, required: true, description: "参数含义" }
                  - { name: to, type: _types.string, required: true, pattern: '^params\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$', description: "对应的 service 参数路径" }
              - name: query
                type: _types.list<_types.object>
                required: false
                unique_key: name
                description: "query 参数；每项必须写 name/schema/required/description/to"
                item_fields:
                  - { name: name, type: _types.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "query 参数名" }
                  - { name: schema, type: _types.string, required: true, pattern: '^(_types\.[a-z][a-z0-9_]*(<[A-Za-z0-9_<>, ]+>)?|data\.enums\.[a-z][a-z0-9_]*)$', description: "参数类型；只允许标量/枚举类型 ID" }
                  - { name: required, type: _types.boolean, required: false, description: "是否必填；默认 false" }
                  - { name: description, type: _types.string, required: true, description: "参数含义" }
                  - { name: to, type: _types.string, required: true, pattern: '^params\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$', description: "对应的 service 参数路径" }
              - name: body
                type: _types.object
                required: false
                description: "请求体"
                fields:
                  - { name: content_type, type: _types.string, required: true, const: application/json, description: "媒体类型；固定 application/json；由 body 声明，不写成 header" }
                  - { name: schema, type: _types.string, required: true, pattern: '^(data\.(entities|enums)\.[a-z][a-z0-9_]*|cap\.services\.[a-z][a-z0-9_]*\.schemas\.[A-Za-z][A-Za-z0-9]*)$', description: "请求体类型；必须是具名类型，不支持匿名 object 或标量" }
                  - { name: required, type: _types.boolean, required: false, description: "是否必填；默认 true；映射必填 service 参数时不得为 false" }
                  - { name: to, type: _types.string, required: true, pattern: '^params\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$', description: "对应的 service 参数路径" }
          - name: response
            type: _types.map<_types.object>
            required: true
            key_patterns: [ '^[1-5][0-9]{2}$' ]
            description: "HTTP 状态码 → 响应；2xx 写 description/body，非 2xx 只写 codes"
            item_fields:
              - { name: description, type: _types.string, required: false, description: "响应说明；2xx 必填" }
              - name: body
                type: _types.object
                required: false
                description: "响应体；2xx 带 body 时必填"
                fields:
                  - { name: content_type, type: _types.string, required: true, const: application/json, description: "媒体类型；固定 application/json；由 body 声明，不写成 header" }
                  - { name: schema, type: _types.string, required: true, pattern: '^(data\.(entities|enums)\.[a-z][a-z0-9_]*|cap\.services\.[a-z][a-z0-9_]*\.schemas\.[A-Za-z][A-Za-z0-9]*)$', description: "返回类型 ID；必须是具名类型" }
              - { name: codes, type: _types.list<_types.string>, required: false, unique: true, min_items: 1, pattern: '^platform\.errors\.', description: "该状态下的业务错误 ID；非 2xx 必填" }
      - name: post
        type: _types.object
        required: false
        description: "POST operation"
        item_fields: *http_operation
      - name: put
        type: _types.object
        required: false
        description: "PUT operation"
        item_fields: *http_operation
      - name: patch
        type: _types.object
        required: false
        description: "PATCH operation"
        item_fields: *http_operation
      - name: delete
        type: _types.object
        required: false
        description: "DELETE operation"
        item_fields: *http_operation
      - name: head
        type: _types.object
        required: false
        description: "HEAD operation"
        item_fields: *http_operation
      - name: options
        type: _types.object
        required: false
        description: "OPTIONS operation"
        item_fields: *http_operation

rules:
  - { id: http-file, text: "文件 id 必须由 targets 派生", implemented_by: [ http-file ] }
  - { id: http-status, text: "response 的 status 必须落在 platform.http_conventions.status_codes 的 success/client_error/server_error 列表内；3xx 与未登记状态非法", implemented_by: [ http-status ] }
  - { id: http-shape, text: "paths 必须是 path → method → operation；operation 必须使用 id/name/service/summary/used_by/security/request/response；request 只允许 path/query/body；GET/HEAD 不得声明 request.body；response 的 key 是三位状态码，2xx 必须写 description/body，非 2xx 只能写非空 codes", implemented_by: [ http-shape ] }
  - { id: http-version, text: "mount.api_version 必须是 v<数字>；mount.path 与 paths 的 key 不得以 /v<数字> 开头；生成器按 app 内各文件一致的 mount.api_version 派生 servers: /<version>，同一 app 不得混版本；project.yaml 的 api app 只校验 audience 与 timeout_ms", implemented_by: [ http-version ] }
  - { id: http-mount, text: "每个文件必须有 mount：api_version/path/audience；mount.path 以 / 开头且只写公共资源前缀（如 /account，不写 /account/admin）；audience 段放在 paths 的 key 里（如 /admin）；paths 的 key 是相对路径且以 / 开头；拼接后的 path 全局唯一", implemented_by: [ http-mount ] }
  - { id: http-path-params, text: "paths 的 key 中每个 {name} 占位符必须是 [a-z][a-z0-9_]*，且与 request.path 的 name 一一对应；request.path 不得声明路径中不存在的参数", implemented_by: [ http-path-params ] }
  - { id: http-operation, text: "每个 operation 必须有全局唯一的 name、id、service；id 必须匹配当前文件且全局唯一；path+method 全局唯一；x-* 仅允许 x-contract-id/x-service/x-timeout-ms（由 normalizer 生成，生成 OpenAPI 前删除）；service 必须指向存在的 public 同步 service", implemented_by: [ http-operation ] }
  - { id: http-default-errors, text: "平台基线错误状态必须由 platform/http_conventions.error_responses 声明，每个状态必须有 platform/http_conventions.components.responses 映射；operation 不得写空的错误 response", implemented_by: [ http-default-errors ] }
  - { id: http-audience, text: "mount.audience 非空且每个值在 platform.http_conventions.audiences 中；project.yaml 中 api app 的 audience 必须在其 include 的每个 HTTP 文件中至少出现一次", implemented_by: [ http-audience ] }
  - { id: http-consumer, text: "used_by 模板属性保证非空；脚本进一步校验它精确等于引用其 service 的 feature.pages 集合；每个页面引用的 service 必须至少被一个 operation 暴露；同一 service 不得被多个 operation 绑定", implemented_by: [ http-consumer ] }
  - { id: http-components, text: "所有 $ref 必须指向存在的 platform components；direct type ID 生成的 components.schemas 必须且只能声明一个 source 溯源键；非 platform schema 不得写 properties", implemented_by: [ http-components ] }
  - { id: http-shared, text: "platform/http_conventions.components 的结构校验：securitySchemes 每项必须有受支持的 type；http 必须有 scheme，apiKey 必须有 name 与 in，oauth2 必须有 flows，openIdConnect 必须有 openIdConnectUrl；responses 每项必须有非空 description，headers 必须是 $ref 或带 schema 的定义，content 每项必须有 schema；parameters 必须有 name/in/schema 且 path 参数 required；headers 必须有 schema；schemas 必须是封闭 object", implemented_by: [ http-shared ] }
  - { id: http-security, text: "operation.security.BearerAuth 必须为 boolean；有权限点的 service 必须为 true；BearerAuth 为 true 时 account_id/access_token service 参数由认证中间件注入，HTTP 参数不得映射到它们", implemented_by: [ http-security ] }
  - { id: http-retry-after, text: "429 与 503 的 platform response 必须声明 Retry-After；operation 不得声明缺少 Retry-After 的 429/503 响应", implemented_by: [ http-retry-after ] }
  - { id: http-service-type, text: "request.body.to 必须绑定到具名 service 参数；body.schema 直接引用该参数的类型 ID，且两者类型一致；不支持匿名 object 请求体", implemented_by: [ http-service-type ] }
  - { id: http-service-params, text: "path/query/body 的 to 必须写 params.<service 参数路径>；每个 HTTP 参数必须声明 to；service 每个必填非 ctx 参数必须被覆盖（认证注入的 account_id/access_token 除外）；映射两侧类型必须一致；映射到必填 service 参数的 requestBody 必须 required=true", implemented_by: [ http-service-params ] }
  - { id: http-service-return, text: "2xx 带 body 的 response.<status>.body.schema 必须直接引用类型 ID；该类型必须对应 service 的非 err return；204 要求 service 没有业务 return；禁止在 body schema 上写 x-service-return", implemented_by: [ http-service-return ] }
  - { id: http-errors, text: "每个 operation 的非 2xx response 必须以 codes 精确列出 service 错误闭包（由 service-errors 递归计算）去掉 COMMON_*，并按错误 status 分组；每个 code 的 status 必须等于所在 response 的 key；每个 service 错误必须落到平台基线状态或非 2xx response；禁止列出 COMMON_* 与未知错误", implemented_by: [ http-errors ] }
