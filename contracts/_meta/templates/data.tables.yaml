# <summary>
#
# 使用 make contract-new 生成后，替换所有 <...> 占位符。
# 字段语义见 contracts/_meta/schema/data.tables.yaml。

schema_version: 1
id: data.tables.<file>
summary: <summary>
stability: draft
owner_module: <module>
extends: [data.tables.base]

do_not: []
#  - <本表的具体约束；必须含字段名/表名，不要复制通用规则>

table:
  # name: <physical_table>        # 仅当物理表名与文件名不同（如 account -> accounts）
  comment: <summary>
  size_class: small
  # retention: { pending_days: 7, soft_delete_days: 30, hard_delete_days: 90 }

columns:
  - name: <column>
    type: text
    nullable: false
    comment: <column comment>
  - name: status
    type: data.enums.<enum_name>
    nullable: false
    default: <initial_value>
    comment: <status comment>

constraints:
  - name: ck_<physical_table>_status
    type: enum
    column: status
    enum: data.enums.<enum_name>

indexes: []

used_by:
  entities: []
  queries: []
  capabilities: []
