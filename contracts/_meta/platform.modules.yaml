# 模块注册表；owner_module 的唯一来源。

id: meta.platform.modules
type: platform.modules
title: "模块注册表"
targets:
  dir: "contracts/platform"
  glob: "modules.yaml"
  id: "platform.modules"

fields:
  - name: id
    type: _types.basics.string
    required: true
    const: platform.modules
    description: "契约 ID"

  - name: summary
    type: _types.basics.string
    required: true
    description: "一句话说明"

  - name: schema_version
    type: _types.basics.integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: _types.basics.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.structures.set<_types.basics.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: modules
    type: _types.structures.list<_types.structures.object>
    required: true
    min_items: 1
    unique_key: name
    description: "模块清单"
    item_fields:
      - { name: name, type: _types.basics.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "模块名；等于 owner_module" }
      - { name: summary, type: _types.basics.string, required: true, description: "一句话说明" }
