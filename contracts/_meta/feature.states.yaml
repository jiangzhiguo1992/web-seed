# feature.states 类型规范：业务状态机，按业务主体组织。
# 状态机是业务不变量，不是 UI 加载态；features 只引用转换 ID。

id: meta.feature.states
type: feature.states
title: "状态机契约"
targets:
  dir: "contracts/features/states"
  glob: "*.yaml"
  id: "feature.states.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: string
    required: true
    pattern: '^feature\.states\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "状态机归属模块；按业务主体而非实现模块"

  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: list<string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: machine
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "状态机名"
  - name: subject
    type: string
    required: true
    pattern: '^data\.entities\.[a-z][a-z0-9_]*$'
    description: "业务主体实体"

  - name: states
    type: list<object>
    required: true
    min_items: 1
    description: "状态列表"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "状态名" }
      - { name: description, type: string, required: true, description: "状态说明" }
      - { name: terminal, type: boolean, required: true, description: "是否终态" }

  - name: initial
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "初始状态"

  - name: transitions
    type: list<object>
    required: true
    min_items: 1
    description: "转换列表；必须穷举合法转换"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "转换名" }
      - { name: description, type: string, required: true, description: "转换说明" }
      - { name: from, type: list<string>, required: true, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "源状态" }
      - { name: to, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "目标状态" }
      - name: guard
        type: any
        required: true
        description: "守卫：true 表示无额外条件；{ rule: cap.rules.* } 表示结构化规则"
      - { name: on_violation, type: string, required: true, pattern: '^platform\.errors\.[A-Z][A-Z0-9_]*$', description: "非法转换错误码" }
      - { name: side_effects, type: list<string>, required: false, unique: true, pattern: '^cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "副作用事件" }
      - { name: implemented_by, type: list<string>, required: true, unique: true, generated: true, write: forbidden, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "实现该转换的服务项" }

  - name: forbidden_examples
    type: list<object>
    required: false
    description: "非法转换示例；用于生成负向测试"
    item_fields:
      - { name: from, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "源状态" }
      - { name: transition, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "转换名" }
      - { name: reason, type: string, required: true, description: "非法原因" }

  - name: idempotent_transitions
    type: list<string>
    required: false
    unique: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "幂等转换"

rules:
  - { id: state-structure, text: "状态名唯一；initial 必须是已声明状态；transitions 的 from/to 必须是已声明状态；forbidden_examples 的 from/transition 必须存在且不是合法转换；guard 只能是 true 或 { rule: cap.rules.* }；side_effects 必须指向存在的 cap.events.*；implemented_by 必须指向存在的 cap.services.*", implemented_by: [ state-structure ] }
  - { id: state-exhaustive, text: "每个非终态必须有出边；终态不得有出边；转换名唯一", implemented_by: [ state-exhaustive ] }
