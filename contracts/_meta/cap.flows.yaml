# cap.flows 类型规范：按模块聚合的编排用例集，文件级 module + item 级 flow。
# 字段树为目标态；capabilities 的字段树与 checker 接入待后续批次。

id: meta.cap.flows
type: cap.flows
title: "编排契约"
targets:
  dir: "contracts/capabilities/flows"
  glob: "*.yaml"
  id: "cap.flows.<file>"
  naming: "snake_case"

fields:
  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "格式版本"

  - name: id
    type: string
    required: true
    pattern: '^cap\.flows\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: string
    required: true
    description: "一句话说明"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: list<string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: module
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "所属模块；flow 的写归属校验基准"

  - name: flows
    type: list<object>
    required: true
    description: "用例列表；item ID = cap.flows.<file>.<snake_case(name)>"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "用例名；派生 item ID" }
      - { name: summary, type: string, required: true, description: "一句话说明" }
      - { name: implementation, type: string, required: true, enum: [ direct, flow ], description: "direct=直通一个 method；flow=显式 steps 编排" }
      - { name: method, type: string, required: false, pattern: '^cap\.methods\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "implementation=direct 时必填" }
      - name: trigger
        type: object
        required: false
        description: "异步触发器；同步 flow 不写本字段"
        fields:
          - { name: type, type: string, required: true, enum: [ cron, event, webhook ], description: "触发类型" }
          - { name: schedule, type: string, required: false, description: "cron 表达式；type=cron 时必须" }
          - { name: event, type: string, required: false, pattern: '^business\.events\.', description: "事件 ID；type=event 时必须" }
      - { name: input, type: any, required: false, description: "同步 flow 对应请求；异步 flow 对应 job payload" }
      - { name: output, type: any, required: false, description: "同步 flow 对应响应；异步 flow 对应 job result" }
      - { name: permissions, type: list<string>, required: false, unique: true, pattern: '^platform\.security\.permissions\.[a-z][a-z0-9_]*$', description: "权限点 ID；同步 flow 必填，异步 flow 可选" }
      - { name: audit, type: boolean, required: false, description: "是否写审计日志" }
      - name: rate_limit
        type: object
        required: false
        description: "限流策略"
        fields:
          - { name: requests, type: integer, required: true, min: 1, description: "窗口内请求数" }
          - { name: window_seconds, type: integer, required: true, min: 1, description: "窗口秒数" }
      - { name: transaction, type: string, required: false, enum: [ required, read_only, none ], description: "事务边界；同步 flow 必填" }
      - name: idempotency
        type: object
        required: false
        description: "幂等键与窗口；异步 flow 必填，同步 flow 可选"
        fields:
          - { name: key, type: string, required: true, description: "幂等键模板" }
          - { name: window, type: string, required: true, pattern: '^[0-9]+(s|m|h|d)$', description: "窗口，例如 24h" }
      - { name: max_iterations, type: integer, required: false, min: 1, description: "flow 级循环预算；存在后向/自环 goto 时必填" }
      - name: retry
        type: object
        required: false
        description: "重试与死信；异步 flow 必填，同步 flow 禁止"
        fields:
          - { name: max_attempts, type: integer, required: true, min: 1, description: "最大尝试次数" }
          - { name: backoff, type: string, required: true, enum: [ fixed, exponential ], description: "退避策略" }
          - { name: dead_letter, type: boolean, required: true, description: "是否进入死信" }
      - name: concurrency
        type: object
        required: false
        description: "并发与分布式锁；异步 flow 必填，同步 flow 禁止"
        fields:
          - { name: key, type: string, required: true, description: "并发键模板" }
          - { name: ttl, type: string, required: false, pattern: '^[0-9]+(s|m|h|d)$', description: "锁 TTL" }
      - name: steps
        type: list<object>
        required: false
        description: "implementation=flow 时必填；use 只能是 cap.methods.*、platform.security.permissions.*；无 use 表示 flow 内部逻辑，不得引用 data.queries.*"
        item_fields:
          - { name: id, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "步骤 ID，flow 内唯一" }
          - { name: use, type: string, required: false, description: "cap.methods.* 或 platform.security.permissions.*" }
          - { name: depends_on, type: list<string>, required: false, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "依赖的前序步骤 ID；依赖不可达时本步骤不可达" }
          - { name: when, type: string, required: false, description: "受限布尔表达式：true/false、!、&&、||、括号、input.<path> / step.<id>.<path> 与字面量比较；静态可判定为 false 时不可达；step 引用必须是前序步骤" }
          - name: on_error
            type: list<object>
            required: false
            description: "错误处理；未列出的错误默认 abort"
            item_fields:
              - { name: error, type: string, required: true, pattern: '^platform\.errors\.[A-Z][A-Z0-9_]*$', description: "错误码" }
              - { name: action, type: string, required: true, enum: [ abort, continue, goto ], description: "abort=向上传播；continue=吞掉继续；goto=吞掉并跳转" }
              - { name: target, type: string, required: false, pattern: '^[a-z][a-z0-9_]*$', description: "action=goto 时的目标 step ID" }
          - { name: errors, type: list<string>, required: false, unique: true, pattern: '^platform\.errors\.[A-Z][A-Z0-9_]*$', description: "步骤可产生的错误；方法步骤必须是 use 目标 errors 的子集，缺省取目标全部 errors；内部/权限步骤缺省为空" }
          - name: output
            type: list<object>
            required: false
            description: "内部步骤的输出 schema；方法步骤由 method returns 派生，禁止声明"
            item_fields:
              - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "输出名" }
              - { name: type, type: string, required: true, description: "输出类型" }
      - name: compensation
        type: object
        required: false
        description: "结构化补偿"
        fields:
          - { name: action, type: string, required: true, enum: [ rollback, compensate, dead_letter ], description: "补偿动作" }
      - name: postconditions
        type: list<object>
        required: false
        description: "后置条件"
        item_fields:
          - { name: field, type: string, required: true, description: "字段名" }
          - { name: op, type: string, required: true, enum: [ eq, ne, gt, ge, lt, le, in, not_in ], description: "比较操作" }
          - { name: value, type: any, required: true, description: "期望值" }
      - { name: errors, type: list<string>, required: false, unique: true, pattern: '^platform\.errors\.[A-Z][A-Z0-9_]*$', description: "flow 对外错误集；direct flow 必须是 method errors 与 flow 级错误的并集子集；flow implementation 必须包含可达步骤的未处理错误与 flow 级错误；permissions/rate_limit/audit/idempotency 分别必带 COMMON_FORBIDDEN/COMMON_RATE_LIMITED/COMMON_AUDIT_FAILED/COMMON_IDEMPOTENCY_CONFLICT；存在后向/自环 goto 时必带 COMMON_LOOP_EXHAUSTED" }

rules:
  - { id: flow-structure, text: "flow item 的 implementation 只能是 direct/flow；direct 必须有 method 且无 steps；flow 必须有 steps 且无 method；同步 flow 必须有 transaction/permissions 且不得有 retry/concurrency；异步 flow 必须有 input/output/idempotency/retry/concurrency 且不得有 transaction；trigger.type=cron 必须有 schedule，type=event 必须有 event；step.id 在 flow 内唯一；depends_on 必须引用前序步骤；内部步骤 output.name 唯一，方法/权限步骤禁止 output", implemented_by: [ flow-structure ] }
  - { id: flow-when, text: "when 是受限布尔表达式（true/false、!、&&、||、括号、input.* / step.<id>.* 与字面量比较）；静态 false 的步骤不可达；引用的 step 必须是前序步骤，字段必须存在于 method returns（err 除外）或内部 step.output；$ref / oneOf discriminator / anyOf / allOf / 列表索引按 schema 解析，when 的 &&、||、!=、!、<、<=、>、>= 约束用于选择 oneOf 分支；|| 合并两侧共同路径的候选值/区间，单侧路径丢弃，! 按 De Morgan 取反", implemented_by: [ flow-when ] }
  - { id: flow-control, text: "on_error 按 error 唯一，action 只能是 abort/continue/goto，target 仅 goto 可用且必须存在；存在后向/自环 goto 时 flow.max_iterations 必填且 >= 1，预算是 flow 级总预算，耗尽返回 COMMON_LOOP_EXHAUSTED（503，可重试，建议带 Retry-After）", implemented_by: [ flow-control ] }
  - { id: flow-errors, text: "方法步骤的 errors 必须是目标 method errors 的子集，缺省取全部；direct flow 的 errors 必须是 method errors 与 flow 级错误的并集子集，并包含必带 flow 级错误；flow implementation 的 errors 必须包含可达步骤的未处理错误与 flow 级错误；permissions/rate_limit/audit/idempotency 分别必带 COMMON_FORBIDDEN/COMMON_RATE_LIMITED/COMMON_AUDIT_FAILED/COMMON_IDEMPOTENCY_CONFLICT；存在后向/自环 goto 时必带 COMMON_LOOP_EXHAUSTED", implemented_by: [ flow-errors ] }
  - { id: flow-no-query, text: "flow 不得直接引用 data.queries.*；写操作必须经由 cap.methods，内部逻辑步骤不写 use", implemented_by: [ flow-no-query ] }
