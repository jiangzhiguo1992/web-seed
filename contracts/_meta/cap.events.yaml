# cap.events：跨模块领域事件；发射与消费分别由 service step 与 async trigger 派生。

id: meta.cap.events
type: cap.events
title: "领域事件契约"
targets:
  dir: "contracts/capabilities/events"
  glob: "*.yaml"
  id: "cap.events.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: string
    required: true
    pattern: '^cap\.events\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "事件归属模块；按业务主体而非生产者模块"

  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: list<string>
    required: true
    unique: true
    description: "实例级负向约束"
  - name: delivery
    type: string
    required: true
    enum: [ at_least_once, at_most_once, exactly_once ]
    description: "投递语义"

  - name: events
    type: list<object>
    required: true
    min_items: 1
    description: "事件项；item ID = cap.events.<name>"
    item_fields:
      - { name: id, type: string, required: true, pattern: '^cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "事件 ID" }
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)?$', description: "事件名，例如 account.created" }
      - { name: version, type: integer, required: true, min: 1, description: "事件版本" }
      - { name: payload, type: any, required: true, description: "payload schema" }
      - { name: summary, type: string, required: true, description: "一句话说明" }
      - { name: emitted_by, type: list<string>, required: true, unique: true, generated: true, write: forbidden, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "发射该事件的服务项；由 service step 生成" }
      - { name: consumers, type: list<string>, required: true, unique: true, generated: true, write: forbidden, pattern: '^[a-z][a-z0-9_]*$', description: "消费该事件的模块；由 async job trigger.event 生成" }

rules:
  - { id: event-structure, text: "事件名在文件内唯一、以文件主体为前缀且 item ID 必须为 cap.events.<name>；payload 为 inline object 时必须 additionalProperties: false；emitted_by 必须指向存在的 cap.services.*", implemented_by: [ event-structure ] }
  - { id: event-payload-ref, text: "payload.$ref 必须是存在的 object 类型（data.entities.* / cap.services.*.types.*）；properties.<field>.type 引用的 data.enums.* / data.entities.* 必须存在，data.enums.* 不得作为 $ref", implemented_by: [ event-payload-ref ] }
