# 异步 topic、cron 与 dispatch。

id: meta.cap.events
contract: cap.events
title: "异步事件与任务契约"
targets:
  dir: "contracts/capabilities/events"
  glob: "*.yaml"
  id: "cap.events.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: _types.basics.string
    required: true
    pattern: '^cap\.events\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: _types.basics.string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: _types.basics.string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "归属模块"

  - name: schema_version
    type: _types.basics.integer.32
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: _types.basics.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.structures.set<_types.basics.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: topics
    type: _types.structures.list<_types.structures.object>
    required: false
    min_items: 1
    unique_key: name
    description: "主题：消息契约，内含发布侧与订阅侧"
    item_fields:
      - { name: id, type: _types.basics.string, required: true, pattern: '^cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "主题 ID" }
      - { name: name, type: _types.basics.string, required: true, pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "主题名，例如 account.created" }
      - { name: version, type: _types.basics.integer.32, required: true, min: 1, description: "主题版本" }
      - { name: summary, type: _types.basics.string, required: true, description: "一句话说明" }
      - { name: idempotent, type: _types.basics.boolean, required: true, description: "消息是否可安全重复投递：true 时发布者可重试，消费方可按 payload 的业务键去重；不代表消费者自动幂等" }
      - name: publish
        type: _types.structures.object
        required: true
        description: "发布侧：消息格式与发射者"
        fields:
          - { name: payload, types: [ _types.schemas.* ], required: true, description: "消息体；发布出参，也是订阅入参" }
          - { name: emitted_by, type: _types.structures.set<_types.basics.string>, required: true, unique: true, generated: true, write: forbidden, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "发射该主题的服务项" }
      - name: subscribe
        type: _types.structures.list<_types.structures.object>
        required: false
        min_items: 1
        description: "订阅侧：消费该主题的异步任务"
        item_fields:
          - { name: id, type: _types.basics.string, required: true, pattern: '^cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "订阅项 ID" }
          - { name: name, type: _types.basics.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "订阅项名" }
          - { name: summary, type: _types.basics.string, required: true, description: "一句话说明" }
          - { name: service, type: _types.basics.string, required: true, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "同步 handler service" }
          - &event_retry
            name: retry
            type: _types.structures.object
            required: false
            description: "重试与死信"
            fields:
              - { name: max_attempts, type: _types.basics.integer.32, required: true, min: 1, description: "最大尝试次数" }
              - { name: backoff, type: _types.basics.string, required: true, enum: [ fixed, exponential ], description: "退避策略" }
              - { name: dead_letter, type: _types.basics.boolean, required: true, description: "是否进入死信" }
          - &event_concurrency
            name: concurrency
            type: _types.structures.object
            required: false
            description: "并发与分布式锁"
            fields:
              - { name: key, type: _types.basics.string, soft: true, required: true, description: "并发键模板" }
              - { name: ttl, type: _types.basics.string, required: false, pattern: '^[1-9][0-9]*(s|m|h|d)$', description: "锁 TTL" }

  - name: crons
    type: _types.structures.list<_types.structures.object>
    required: false
    min_items: 1
    description: "定时任务"
    item_fields:
      - { name: id, type: _types.basics.string, required: true, pattern: '^cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "任务 ID" }
      - { name: name, type: _types.basics.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "任务名" }
      - { name: summary, type: _types.basics.string, required: true, description: "一句话说明" }
      - { name: service, type: _types.basics.string, required: true, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "同步 handler service" }
      - { name: schedule, type: _types.basics.string, required: true, description: "5 字段 cron 表达式：分 时 日 月 周" }
      - { name: overlap, type: _types.basics.string, required: true, enum: [ allow, forbid ], description: "上一次未结束时是否允许启动下一次：allow=允许，forbid=跳过本次" }
      - *event_retry
      - *event_concurrency

  - name: dispatches
    type: _types.structures.list<_types.structures.object>
    required: false
    min_items: 1
    description: "内部命令任务：service 投递、唯一消费者执行"
    item_fields:
      - { name: id, type: _types.basics.string, required: true, pattern: '^cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "任务 ID" }
      - { name: name, type: _types.basics.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "任务名" }
      - { name: summary, type: _types.basics.string, required: true, description: "一句话说明" }
      - { name: payload, types: [ _types.schemas.* ], required: true, description: "命令参数值域" }
      - { name: service, type: _types.basics.string, required: true, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "唯一消费者 service" }
      - { name: emitted_by, type: _types.structures.set<_types.basics.string>, required: true, unique: true, min_items: 1, generated: true, write: forbidden, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "投递该命令的 service 项；至少一个" }
      - { name: delay, type: _types.basics.string, required: false, pattern: '^[1-9][0-9]*(s|m|h|d)$', description: "投递延迟" }
      - { name: timeout, type: _types.basics.string, required: false, pattern: '^[1-9][0-9]*(s|m|h|d)$', description: "队列等待超时：入队后超过该时长未被消费则过期；不是执行超时" }
      - *event_retry
      - *event_concurrency

rules:
  - { id: event-structure, text: "topic.id 必须为 cap.events.<name> 且全局唯一；topic name 在文件内唯一且必须以 <file>. 开头；version >= 1；topic.publish.emitted_by 与 dispatch.emitted_by 必须指向存在的 cap.services.*；dispatch.emitted_by 至少一个；dispatch payload 字段必须与唯一消费者 service 的非 ctx 参数同名、required/nullable 一致且类型一致，不多不少", implemented_by: [ event-structure ] }
  - { id: event-file-shape, text: "契约 ID 必须与 targets 派生一致；topics/crons/dispatches 至少一个非空；topic、subscribe、cron、dispatch 的 ID 共享 cap.events.* 空间且全局唯一", implemented_by: [ event-file-shape ] }
  - { id: event-orphan, text: "topic 必须被发布或被订阅：publish.emitted_by 非空或 subscribe 非空", implemented_by: [ event-orphan ] }
  - { id: async-service, text: "subscribe.service / cron.service / dispatch.service 必须存在且与 events 文件的 owner_module 同模块；被异步任务引用的 service 不得被 cap.protocols.http 绑定", implemented_by: [ async-service ] }
  - { id: async-structure, text: "subscribe/cron/dispatch 的 name 在文件内唯一；id 必须等于 <file-id>.<name>；同一 service 在同一槽内不得重复绑定", implemented_by: [ async-structure ] }
  - { id: event-cron-schedule, text: "cron 必须有合法的 5 字段表达式（分 时 日 月 周），支持 *、*/n、a-b、a-b/n、a,b,c 与数字，且各字段在取值范围内", implemented_by: [ event-cron-schedule ] }
