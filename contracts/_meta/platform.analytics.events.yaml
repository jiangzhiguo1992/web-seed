# 埋点事件与属性；载荷不保证映射表列。

id: meta.platform.analytics.events
contract: platform.analytics.events
title: "埋点事件与属性"
targets:
  dir: "contracts/platform/analytics"
  glob: "events.yaml"
  id: "platform.analytics.events"
  naming: "snake_case"

fields:
  - name: id
    type: _types.basics.string
    required: true
    const: platform.analytics.events
    description: "契约 ID"
  - name: summary
    type: _types.basics.string
    required: true
    description: "一句话说明"
  - name: schema_version
    type: _types.basics.integer
    required: true
    const: 1
    description: "格式版本"
  - name: stability
    type: _types.basics.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"
  - name: do_not
    type: _types.structures.set<_types.basics.string>
    required: true
    unique: true
    description: "实例级负向约束"
  - name: naming
    type: _types.structures.object
    required: true
    description: "命名规则"
    fields:
      - { name: pattern, type: _types.basics.string, required: true, description: "事件名模式" }
      - { name: property_case, type: _types.basics.string, required: true, enum: [ snake_case ], description: "属性命名风格" }
      - { name: id_policy, type: _types.basics.string, required: true, description: "标识策略" }
  - name: common_properties
    type: _types.structures.list<_types.structures.object>
    required: true
    description: "公共属性"
    item_fields:
      - { name: name, type: _types.basics.string, required: true, description: "属性名" }
      - { name: type, type: _types.basics.string, required: true, description: "类型" }
      - { name: pii, type: _types.basics.boolean, required: true, description: "是否 PII" }
  - name: events
    type: _types.structures.list<_types.structures.object>
    required: true
    min_items: 1
    description: "事件列表"
    item_fields:
      - { name: name, type: _types.basics.string, required: true, description: "事件名" }
      - { name: description, type: _types.basics.string, required: true, description: "说明" }
      - { name: trigger, type: _types.basics.string, required: true, enum: [ mount, click, api_success, api_error ], description: "触发点" }
      - { name: ref, type: _types.basics.string, required: false, description: "HTTP operation ID" }
      - { name: page, type: _types.basics.string, required: false, description: "页面 ID" }
      - name: properties
        type: _types.structures.list<_types.structures.object>
        required: true
        description: "事件属性"
        item_fields:
          - { name: name, type: _types.basics.string, required: true, description: "属性名" }
          - { name: type, type: _types.basics.string, required: true, description: "类型" }
          - { name: pii, type: _types.basics.boolean, required: true, description: "是否 PII" }
  - name: forbidden_properties
    type: _types.structures.set<_types.basics.string>
    required: true
    unique: true
    description: "禁止进入埋点的属性名"
  - name: provider
    type: _types.structures.object
    required: true
    description: "埋点提供方"
    fields:
      - { name: default, type: _types.basics.string, required: true, description: "默认 provider" }
      - { name: options, type: _types.structures.list<_types.basics.string>, required: true, min_items: 1, description: "可选 provider" }

rules:
  - { id: analytics-pii, text: "forbidden_properties 必须 snake_case；同一 property 在 common_properties/events 中的 type 与 pii 必须一致；pii:true 的属性不得出现在 forbidden_properties，且必须被 log_fields.never_log 覆盖；pii:false 不得命中 never_log", implemented_by: [ analytics-pii ] }
  - { id: analytics-types, text: "property.type 必须是标量 basic type、data.types 的自定义类型或 data.enums 的枚举名；_types.basics.any 与 _types.basics.json 禁止", implemented_by: [ analytics-types ] }
  - { id: analytics-refs, text: "事件名唯一；ref 必须是已存在的 HTTP operation；page 必须是已存在的 feature.pages，且 trigger=mount 时该页 analytics.page_view 必须等于事件名；properties 不得使用 forbidden_properties；provider.default 必须属于 provider.options", implemented_by: [ analytics-refs, analytics-types ] }
