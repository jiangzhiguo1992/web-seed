# data.queries 的单一规范：字段树 + 值域 + 硬规则。
# 查询是接口：只声明入参、结果、目标表、索引引用与读写属性；
# SQL 如何执行不在契约里，由实现/生成器负责。
# 通用字段语义见 _meta/README.md；本文件只写 data.queries 特有内容。

id: meta.data.queries
type: data.queries
title: "查询契约"
targets:
  dir: "contracts/data/queries"
  glob: "*.yaml"
  id: "data.queries.<file>"
  naming: "snake_case"

fields:
  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "契约格式版本，固定 1"
    generates: "无"
    caution: "必须是整数 1"

  - name: id
    type: string
    required: true
    pattern: '^data\.queries\.[a-z][a-z0-9_]*$'
    description: "由 targets.id 模板派生（<file> 替换为文件 stem）"
    generates: "契约 ID、图节点"
    caution: "query 项 ID 必须以此 ID 加点为前缀；checker 以文件名为源"

  - name: summary
    type: string
    required: true
    description: "一句话说明这个查询集负责什么"
    generates: "index 摘要"
    caution: "不要写单条 SQL 细节"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "契约稳定度"
    generates: "index 摘要"
    caution: "stable 不得含 TODO/FIXME；可回退 draft 继续修改"

  - name: owner_module
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "查询集归属模块"
    generates: "sqlc package、写归属校验"
    caution: "写查询的 owner_module 必须等于写目标表的 owner_module"

  - name: do_not
    type: list<string>
    required: false
    description: "实例级负向约束；每条含本查询集标识"
    generates: "AI 反例"
    caution: "通用规则放组 README，禁止复制到这里"

  - name: queries
    type: list<object>
    required: true
    min_items: 1
    description: "查询项列表；每条是一份可生成的接口契约"
    generates: "查询接口、sqlc 代码、测试骨架"
    caution: "只写入参/结果/目标表/索引引用；不写 SQL 子句"
    item_fields:
      - { name: id, type: string, required: true, pattern: '^data\.queries\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "查询项 ID：data.queries.<file>.<query>", caution: "必须以前缀 data.queries.<file>. 开头" }
      - { name: name, type: string, required: true, pattern: '^[A-Z][A-Za-z0-9]*$', description: "方法名", caution: "必须等于 query id 末段的 PascalCase；全局唯一" }
      - { name: access, type: string, required: true, enum: [ read, write ], description: "读写属性；write 有副作用", caution: "write 只能有一个目标表，owner_module 必须等于目标表 owner_module" }
      - { name: kind, type: string, required: true, enum: [ one, many, exec ], description: "结果基数；exec 只返回受影响行数", caution: "exec 必须是 write 且 returns=affected_rows；read 不得用 exec" }

      - { name: targets, type: list<string>, required: true, min_items: 1, unique: true, pattern: '^data\.tables\.', description: "查询读写到的表；第一个是主表，单表也写成列表", caution: "write 只能有一张目标表；read 可以多表；表必须存在且不是 data.tables.base" }

      - name: params
        type: list<object>
        required: false
        description: "方法入参；接口的唯一入参声明"
        generates: "方法签名、参数校验"
        caution: "只声明接口参数；SQL 如何使用参数由实现负责"
        item_fields:
          - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "参数名" }
          - { name: type, type: string, required: true, description: "逻辑类型，如 text、integer、timestamp、[]text" }
          - { name: column, type: string, required: false, pattern: '^data\.tables\.[a-z][a-z0-9_]*\.col\.[a-z][a-z0-9_]*$', description: "参数绑定的物理列；数组参数绑定元素列", caution: "列必须属于查询的 targets；type 必须与列类型族兼容" }
          - { name: nullable, type: boolean, required: false, default: false, description: "参数是否可为空" }
          - { name: default, type: any, required: false, description: "默认值；只影响生成骨架" }
          - { name: min, type: integer, required: false, description: "闭区间下限" }
          - { name: max, type: integer, required: false, description: "闭区间上限" }
          - { name: note, type: string, required: false, description: "参数补充说明" }

      - { name: returns, type: string, required: true, description: "结果 DSL：data.tables.<t>.row、data.entities.<e>、[] 前缀、boolean/integer/string/float/decimal/timestamp/datetime/json、affected_rows、object", generates: "方法返回类型", caution: "object 必须配 output_fields；affected_rows 只能配 exec；many 必须写 [] 前缀" }
      - { name: return_columns, type: list<string>, required: false, unique: true, description: "结果投影列；只用于表行/实体返回，按物理列名写", caution: "省略表示按返回类型的默认投影；敏感列只有同模块可显式列出" }

      - name: output_fields
        type: list<object>
        required: false
        min_items: 1
        description: "object 结果的字段清单；结果形状，不是 SQL 表达式"
        generates: "输出类型、方法返回"
        caution: "只有 returns 为 object/[]object 时出现；每项只写 name/type"
        item_fields:
          - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "输出字段名" }
          - { name: type, type: string, required: true, description: "逻辑类型；可写 data.enums.*" }
          - { name: nullable, type: boolean, required: false, description: "是否可空" }
          - { name: note, type: string, required: false, description: "输出字段补充说明" }

      - { name: index_ref, type: list<string>, required: false, unique: true, pattern: '^data\.tables\.[a-z][a-z0-9_]*\.(pk|(idx|uq)_[a-z][a-z0-9_]*)$', description: "查询依赖的索引：data.tables.<t>.pk 或 data.tables.<t>.<index-name>", generates: "索引校验、EXPLAIN 提示", caution: "单表查询至少一个；显式索引必须在 indexes[].used_by 中列出本查询" }

rules:
  - { id: query-key-order, text: "查询文件顶层键顺序固定为 id/summary/owner_module/schema_version/stability/do_not/queries", implemented_by: [ query-key-order ] }
  - { id: query-id-prefix, text: "query.id 必须以 <文件 id>. 开头", implemented_by: [ query-id-prefix ] }
  - { id: query-id-unique, text: "query.id 在当前集合内唯一", implemented_by: [ query-id-unique ] }
  - { id: query-name, text: "query.name 必须等于 query id 末段的 PascalCase", implemented_by: [ query-name ] }
  - { id: query-name-unique, text: "query.name 全局唯一，避免方法名冲突", implemented_by: [ query-name-unique ] }
  - { id: query-shape, text: "access/kind/returns 必须匹配：exec 必须是 write 且返回 affected_rows；read 不得用 exec；one/many 不得返回 affected_rows；write 的 one/many 只能返回表行/实体；many 必须写 []，one/exec 不得写 []", implemented_by: [ query-shape ] }
  - { id: query-table-shape, text: "targets 非空、去重、不得指向 data.tables.base；write 只能有一张目标表", implemented_by: [ query-table-shape ] }
  - { id: query-params, text: "params 的 name 不得重复，type 不得为空", implemented_by: [ query-params ] }
  - { id: query-param-column, text: "params[].column 必须属于查询的 targets；param.type 的类型族必须与列类型族兼容（数组参数校验元素类型）", implemented_by: [ query-param-column ] }
  - { id: query-returns, text: "returns DSL 必须合法，引用的表/实体必须存在", implemented_by: [ query-returns ] }
  - { id: query-return-columns, text: "return_columns 必须属于返回类型；敏感列只允许同模块显式列出；exec 不得写 return_columns", implemented_by: [ query-return-columns ] }
  - { id: query-entity-coverage, text: "返回实体时，字段的来源表必须在查询的 targets 中；return_columns 省略表示全部非敏感列，显式时必须覆盖全部非指针、非敏感列字段", implemented_by: [ query-entity-coverage ] }
  - { id: query-output-fields, text: "object 返回必须有非空 output_fields；字段 name 唯一、type 非空；不得同时写 return_columns", implemented_by: [ query-output-fields ] }
  - { id: query-kind, text: "one 的表行/实体读必须命中返回表/实体的唯一索引或主键", implemented_by: [ query-kind ] }
  - { id: query-index-ref, text: "index_ref 必须指向查询表上的 PK 或 indexes[].name；显式索引必须在 used_by 中列出该查询；单表查询至少一个 index_ref", implemented_by: [ query-index-ref ] }
  - { id: query-index-used-by, text: "index.used_by 的查询必须存在、引用当前表，并在 index_ref 中引用该索引", implemented_by: [ query-index-used-by ] }
  - { id: query-write-owner, text: "write 目标取自 targets[0]；owner_module 必须等于目标表 owner_module；read 可以跨模块", implemented_by: [ query-write-owner ] }
  - { id: query-sensitive-columns, text: "never_expose 列不得被跨模块查询返回；return_columns 省略时默认不投影，同模块需要时必须显式列出", implemented_by: [ query-sensitive-columns ] }
  - { id: query-do-not-specific, text: "do_not 每条必须含本查询集标识；通用规则放组 README，禁止复制", implemented_by: [ query-do-not-specific ] }
