# data.queries 的单一规范：字段树 + 值域 + 硬规则。
# 查询是接口：只声明入参、结果、目标表与索引引用；
# SQL 如何执行不在契约里，由实现/生成器负责。
# 通用字段语义见 _meta/README.md；本文件只写 data.queries 特有内容。
# 本文件同时是 contract-new 的字段来源；不要另写模板。

id: meta.data.queries
type: data.queries
title: "查询契约"
targets:
  dir: "contracts/data/queries"
  glob: "*.yaml"
  id: "data.queries.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: string
    required: true
    pattern: '^data\.queries\.[a-z][a-z0-9_]*$'
    description: "由 targets.id 模板派生（<file> 替换为文件 stem）"
    generates: "契约 ID、图节点"
    caution: "query 项 ID 必须以此 ID 加点为前缀；checker 以文件名为源"

  - name: summary
    type: string
    required: true
    description: "一句话说明这个查询集负责什么"
    generates: "index 摘要"
    caution: "不要写单条 SQL 细节"

  - name: owner_module
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "查询集归属模块"
    generates: "sqlc package"
    caution: "只表示查询集归属；读写归属在 capabilities 的 write_queries/writes 中声明"

  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "契约格式版本，固定 1"
    generates: "无"
    caution: "必须是整数 1"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    description: "契约稳定度"
    generates: "index 摘要"
    caution: "stable 只能用户手动设置/降级；生成器只产出 draft，且不得含 TODO/FIXME"

  - name: do_not
    type: list<string>
    required: true
    description: "实例级负向约束；必填，每条含本查询集标识"
    generates: "AI 反例"
    caution: "通用规则放组 README，禁止复制到这里"

  - name: queries
    type: list<object>
    required: true
    description: "查询项列表；每条是一份可生成的接口契约"
    generates: "查询接口、sqlc 代码、测试骨架"
    caution: "只写入参/结果/目标表/索引引用；不写 SQL 子句"
    item_fields:
      - name: name
        type: string
        required: true
        pattern: '^[A-Z][A-Za-z0-9]*$'
        description: "方法名"
        caution: "name 是稳定键：必须是 PascalCase；项 ID 由 <文件 id>.<snake_case(name)> 派生；全局唯一；改名即新 ID"

      - name: tables
        type: list<string>
        required: true
        unique: true
        pattern: '^data\.tables\.'
        description: "查询读写到的表；第一个是主表，单表也写成列表"
        caution: "可以多表；表必须存在且不是 data.tables.base；实例必须竖排"

      - name: params
        type: list<object>
        required: false
        description: "方法入参；接口的唯一入参声明"
        generates: "方法签名、参数校验"
        caution: "只声明接口参数；SQL 如何使用参数由实现负责"
        item_fields:
          - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "参数名" }
          - { name: type, type: string, required: true, description: "逻辑类型，如 text、integer、timestamp、List<text>", caution: "必须能映射到类型族或 data.enums.*；数组用 List<T>" }
          - { name: column, type: string, required: false, pattern: '^data\.tables\.[a-z][a-z0-9_]*\.col\.[a-z][a-z0-9_]*$', description: "参数绑定的物理列；数组参数绑定元素列", caution: "列必须属于查询的 tables；与 expr 互斥" }
          - { name: expr, type: string, required: false, description: "参数参与的 SQL 表达式；不绑定单个列时使用", caution: "与 column 互斥；checker 只校验非空，SQL 语义由实现验证" }
          - { name: nullable, type: boolean, required: false, default: false, description: "参数是否可为空" }
          - { name: default, type: any, required: false, description: "传入 null 时使用的默认值", caution: "只有 nullable: true 时才允许；checker 校验可判定的标量类型/数组外层，枚举值与数组元素交给生成器" }
          - { name: description, type: string, required: false, description: "参数说明" }

      - name: returns
        type: list<object>
        required: true
        description: "结果形状；每项是一个返回字段/实体/表行/标量"
        generates: "方法返回类型、投影列"
        caution: "kind 区分 column/entity/table/scalar/affected_rows；同一 query 的多项 list 必须一致"
        item_fields:
          - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "返回字段名" }
          - { name: list, type: boolean, required: false, default: false, description: "该返回项是否为列表；同一 query 的多项必须一致" }
          - { name: kind, type: string, required: true, enum: [ column, entity, table, scalar, affected_rows ], description: "返回项类型", caution: "column/entity/table/scalar/affected_rows" }
          - { name: column, type: string, required: false, pattern: '^data\.tables\.[a-z][a-z0-9_]*\.col\.[a-z][a-z0-9_]*$', description: "kind=column 时的物理列", caution: "必须属于查询的 tables" }
          - { name: entity, type: string, required: false, pattern: '^data\.entities\.[a-z][a-z0-9_]*$', description: "kind=entity 时的实体 ID", caution: "实体主表必须在 tables 中" }
          - { name: table, type: string, required: false, pattern: '^data\.tables\.[a-z][a-z0-9_]*$', description: "kind=table 时的表 ID", caution: "必须是 tables[0]" }
          - { name: type, type: string, required: false, description: "kind=scalar 时的逻辑类型；可写 data.enums.*", caution: "只能用于 kind=scalar" }
          - { name: columns, type: list<string>, required: false, unique: true, description: "kind=table/entity 时的投影物理列；省略表示默认投影", caution: "只允许 table/entity；必须属于目标表/实体" }
          - { name: nullable, type: boolean, required: false, default: false, description: "返回字段是否可空" }
          - { name: description, type: string, required: false, description: "返回字段说明" }

      - name: index_ref
        type: list<string>
        required: false
        unique: true
        pattern: '^data\.tables\.[a-z][a-z0-9_]*\.(pk|(idx|uq)_[a-z][a-z0-9_]*)$'
        description: "查询依赖的索引：data.tables.<t>.pk 或 data.tables.<t>.<index-name>"
        generates: "索引校验、EXPLAIN 提示"
        caution: "单表查询至少一个；显式索引必须在 indexes[].used_by 中列出本查询"

rules:
  - { id: query-key-order, text: "查询契约字段顺序必须与 _meta/data.queries.yaml 的 fields 顺序一致；嵌套对象同序", implemented_by: [ query-key-order ] }
  - { id: query-name, text: "query.name 必须是 PascalCase；当前项 ID 由 <文件 id>.<snake_case(name)> 派生", implemented_by: [ query-name ] }
  - { id: query-name-unique, text: "query.name 全局唯一，避免方法与派生 ID 冲突", implemented_by: [ query-name-unique ] }
  - { id: query-shape, text: "affected_rows 不得为列表，必须是唯一返回项，且不得带 column/entity/table/type/columns；table 返回也必须是唯一返回项", implemented_by: [ query-shape ] }
  - { id: query-table-shape, text: "tables 非空、去重、不得指向 data.tables.base", implemented_by: [ query-table-shape ] }
  - { id: query-params, text: "params 的 name 不得重复；type 不得为空，未绑定 column 时必须映射到类型族或 data.enums.*；column/expr 互斥；default 只在 nullable:true 时允许；checker 校验可判定的标量 default 类型/数组外层，枚举值与数组元素交给生成器；offset/limit 按 query-pagination 校验", implemented_by: [ query-params ] }
  - { id: query-param-column, text: "params[].column 必须属于查询的 tables；param.type 的类型族必须与列类型族兼容（数组参数校验元素类型；data.enums.* 按 integer 列校验）", implemented_by: [ query-param-column ] }
  - { id: query-pagination, text: "offset/limit 是保留分页参数名，出现时必须 type=integer、nullable:true、default 必填；offset 默认 0，limit 默认必须为正数；list 返回必须同时声明两者", implemented_by: [ query-pagination ] }
  - { id: query-returns, text: "returns 非空；name 不得重复；每项 kind 合法，kind 对应字段必须出现且互斥字段不得出现；同一 query 的 list 必须一致", implemented_by: [ query-returns ] }
  - { id: query-return-columns, text: "column/table.columns/entity.columns 必须属于目标表/实体", implemented_by: [ query-return-columns ] }
  - { id: query-entity-coverage, text: "entity 显式 columns 必须覆盖全部非指针、非 secret 字段；字段来源表必须在 tables 中", implemented_by: [ query-entity-coverage ] }
  - { id: query-sensitive-columns, text: "sensitivity: secret 的列/字段不得被跨模块查询返回；columns 省略时默认不投影 secret，同模块需要时必须显式列出", implemented_by: [ query-sensitive-columns ] }
  - { id: query-index-ref, text: "index_ref 必须指向查询表上的 PK 或 indexes[].name；显式索引必须在 used_by 中列出该查询；单表查询至少一个 index_ref", implemented_by: [ query-index-ref ] }
  - { id: query-index-used-by, text: "index.used_by 的每个查询必须在 index_ref 中引用该索引", implemented_by: [ query-index-used-by ] }
  - { id: query-do-not-specific, text: "do_not 每条必须含本查询集标识；通用规则放组 README，禁止复制", implemented_by: [ query-do-not-specific ] }
