# 角色与权限映射；角色只增不改。

id: meta.platform.security.roles
type: platform.security.roles
title: "角色与权限映射"
targets:
  dir: "contracts/platform/security"
  glob: "roles.yaml"
  id: "platform.security.roles"

fields:
  - name: schema_version
    type: _types.integer
    required: true
    const: 1
    description: "格式版本"

  - name: id
    type: _types.string
    required: true
    const: platform.security.roles
    description: "契约 ID"

  - name: summary
    type: _types.string
    required: true
    description: "一句话说明"

  - name: stability
    type: _types.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.set<_types.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: roles
    type: _types.list<_types.object>
    required: true
    min_items: 1
    unique_key: code
    description: "角色列表"
    item_fields:
      - { name: code, type: _types.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "角色码；引用写作 platform.security.roles.<code>" }
      - { name: name, type: _types.string, required: true, description: "展示名" }
      - { name: description, type: _types.string, required: true, description: "角色说明" }
      - { name: inherits, type: _types.list<_types.string>, required: true, unique: true, pattern: '^platform\.security\.roles\.[a-z][a-z0-9_]*$', description: "继承的角色 ID 列表" }
      - { name: permissions, type: _types.list<_types.string>, required: true, unique: true, min_items: 1, pattern: '^(\*|platform\.security\.permissions\.[a-z][a-z0-9_]*)$', description: "权限 ID 列表；* 表示全部" }
      - { name: mfa_required, type: _types.boolean, required: false, default: false, description: "是否强制 MFA" }

  - name: constraints
    type: _types.object
    required: true
    description: "角色约束"
    fields:
      - { name: max_inheritance_depth, type: _types.integer, required: true, min: 0, description: "最大继承深度" }
      - { name: cycle_forbidden, type: _types.boolean, required: true, description: "是否禁止继承环" }
      - { name: unknown_permission_forbidden, type: _types.boolean, required: true, description: "是否禁止未知权限" }

  - name: default_role
    type: _types.string
    required: true
    pattern: '^platform\.security\.roles\.[a-z][a-z0-9_]*$'
    description: "默认角色 ID"

rules:
  - { id: role-inheritance, text: "inherits 必须指向已声明角色；禁止自继承与环；继承深度不得超过 constraints.max_inheritance_depth", implemented_by: [ role-inheritance ] }
  - { id: role-permissions, text: "permissions 必须是已声明权限；仅 admin 可使用 *；default_role 必须存在", implemented_by: [ role-permissions ] }
