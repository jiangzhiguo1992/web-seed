# cap.services 类型规范：模块对协议与跨模块调用暴露的服务。
# 一个文件 = 一个 Go interface；services 是该接口的方法。
# steps 是实现路径：query/service/logic/event/transition 五类，必须可被 checker 校验。

id: meta.cap.services
type: cap.services
title: "服务契约"
targets:
  dir: "contracts/capabilities/services"
  glob: "*.yaml"
  id: "cap.services.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: string
    required: true
    pattern: '^cap\.services\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "写归属模块；写表归属必须等于本字段"

  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: list<string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: interface
    type: object
    required: true
    description: "Go interface；方法签名由 services[].params/returns 派生，不在此重复"
    fields:
      - name: name
        type: string
        required: true
        pattern: '^[A-Z][A-Za-z0-9]*$'
        description: "interface 名，PascalCase"
      - name: package
        type: string
        required: true
        pattern: '^internal/modules/.*$'
        description: "Go 接口包路径；跨模块只允许 import 此包"

  - name: persistence
    type: object
    required: true
    description: "持久化归属：本服务文件可写的表与约束错误映射"
    fields:
      - { name: tables, type: list<string>, required: true, unique: true, pattern: '^data\.tables\.[a-z][a-z0-9_]*$', description: "本服务可写的表" }
      - { name: constraint_errors, type: map<string>, required: false, description: "约束/索引名到错误 ID" }

  - name: types
    type: any
    required: false
    description: "本地类型；值是 OpenAPI-ish schema 文本；跨文件引用用类型名"

  - name: services
    type: list<object>
    required: true
    description: "服务项列表；item ID = cap.services.<file>.<snake_case(name)>"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "服务项名；派生 item ID" }
      - { name: summary, type: string, required: true, description: "一句话说明" }
      - { name: visibility, type: string, required: true, enum: [ public, internal ], description: "public=可被其他模块 service 引用；internal=仅本模块可见" }

      - name: params
        type: list<object>
        required: true
        description: "入参；生成器自动补 ctx/error"
        item_fields:
          - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "参数名" }
          - { name: type, type: string, required: true, description: "参数类型" }
          - { name: nullable, type: boolean, required: false, description: "是否可空" }

      - name: returns
        type: list<object>
        required: true
        description: "返回值；生成器自动补 error"
        item_fields:
          - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "返回名" }
          - { name: type, type: string, required: true, description: "返回类型" }
          - { name: nullable, type: boolean, required: false, description: "是否可空" }

      - { name: errors, type: list<string>, required: true, unique: true, pattern: '^platform\.errors\.[A-Z][A-Z0-9_]*$', description: "本服务对外错误集；必须覆盖所有可达步骤的未处理错误与入口策略错误" }

      - name: permissions
        type: list<string>
        required: false
        unique: true
        pattern: '^platform\.security\.permissions\.[a-z][a-z0-9_]*$'
        description: "入口权限点；由 handler/worker 生成器消费，service 实现不读取"

      - { name: audit, type: boolean, required: false, description: "是否写审计日志；由入口生成器消费" }

      - name: rate_limit
        type: object
        required: false
        description: "入口限流；由入口生成器消费"
        fields:
          - { name: requests, type: integer, required: true, min: 1, description: "窗口内请求数" }
          - { name: window_seconds, type: integer, required: true, min: 1, description: "窗口秒数" }

      - { name: transaction, type: string, required: true, enum: [ required, read_only, none ], description: "事务边界；usecase 生成器据此包裹方法体" }

      - name: idempotency
        type: object
        required: false
        description: "幂等键与窗口；由入口生成器消费"
        fields:
          - { name: key, type: string, required: true, description: "幂等键模板" }
          - { name: window, type: string, required: true, pattern: '^[0-9]+(s|m|h|d)$', description: "窗口，例如 24h" }

      - name: max_iterations
        type: integer
        required: false
        min: 1
        description: "service 级循环预算；存在后向/自环 goto 时必填"

      - name: steps
        type: list<object>
        required: true
        min_items: 1
        description: "实现路径；kind 决定必填字段，由 checker 按 variants 校验"
        item_fields:
          - { name: id, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "步骤 ID，service 内唯一" }
          - { name: kind, type: string, required: true, enum: [ query, service, logic, event, transition ], description: "步骤类型" }
          - { name: summary, type: string, required: true, description: "一句话说明" }
          - { name: depends_on, type: list<string>, required: false, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "依赖的前序步骤 ID" }
          - { name: when, type: string, required: false, description: "受限布尔表达式：true/false、!、&&、||、括号、input.<path> / step.<id>.<path> 与字面量比较" }

          - name: on_error
            type: list<object>
            required: false
            description: "错误处理；未列出的错误默认 abort"
            item_fields:
              - { name: error, type: string, required: true, pattern: '^platform\.errors\.[A-Z][A-Z0-9_]*$', description: "错误码" }
              - { name: action, type: string, required: true, enum: [ abort, continue, goto ], description: "abort=向上传播；continue=吞掉继续；goto=吞掉并跳转" }
              - { name: target, type: string, required: false, pattern: '^[a-z][a-z0-9_]*$', description: "action=goto 时的目标 step ID" }

          - { name: errors, type: list<string>, required: false, unique: true, pattern: '^platform\.errors\.[A-Z][A-Z0-9_]*$', description: "步骤可产生的错误；query/service 步骤缺省取目标 errors，logic 必填" }

          - name: output
            type: list<object>
            required: false
            description: "logic 步骤的输出；query/service/event/transition 由目标派生，禁止声明"
            item_fields:
              - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "输出名" }
              - { name: type, type: string, required: true, description: "输出类型" }

          - { name: query, type: string, required: false, pattern: '^data\.queries\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "kind=query 时的目标查询" }
          - { name: service, type: string, required: false, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "kind=service 时的目标服务项" }
          - { name: params, type: map<string>, required: false, description: "query/service 步骤的参数映射；key 是目标参数名，value 是 input.* / step.<id>.* / 字面量表达式" }
          - { name: queries, type: list<string>, required: false, unique: true, pattern: '^data\.queries\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "kind=logic 时该逻辑步骤调用的查询；用于 query.used_by 反向索引" }
          - { name: events, type: list<string>, required: false, unique: true, pattern: '^cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "kind=logic 时该逻辑步骤发射的事件" }
          - { name: rules, type: list<string>, required: false, unique: true, pattern: '^feature\.rules\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "kind=logic 时的业务规则依据" }
          - { name: event, type: string, required: false, pattern: '^cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "kind=event 时发射的事件" }
          - name: payload
            type: map<string>
            required: false
            description: "kind=event 时的事件字段映射；key 是 payload 字段名，value 是表达式"
          - { name: transitions, type: list<string>, required: false, unique: true, pattern: '^feature\.states\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "kind=transition 时执行的状态转换 ID 列表" }

rules:
  - { id: service-id, text: "services 契约 ID 必须与 targets.id 派生一致，且全局唯一", implemented_by: [ service-id ] }
  - { id: service-structure, text: "service 的 interface.name 必须 PascalCase、interface.package 必须在 internal/modules/ 下；service 名唯一；transaction 必填；steps 非空；step.id 在 service 内唯一；depends_on 必须引用前序步骤；logic/transition 步骤 output 的 name 必须唯一，query/service/event 禁止 output；kind 必填字段由 checker 按 variants 校验", implemented_by: [ service-structure ] }
  - { id: service-ref, text: "query 必须指向存在的 data.queries.*；service 必须指向存在的 cap.services.*；event 必须指向存在的 cap.events.*；transition 必须指向存在的 feature.states.*；rules 必须指向存在的 feature.rules.*；params/returns/types 的 data.enums.* / data.entities.* 必须存在，data.tables.* 禁止", implemented_by: [ service-ref ] }
  - { id: service-owner-write, text: "kind=query 的写表必须属于 service 文件的 owner_module；跨模块写必须走 kind=service；persistence.tables 必须覆盖所有 query 写表", implemented_by: [ service-owner-write ] }
  - { id: service-errors, text: "service.errors 必须覆盖所有可达步骤的未处理错误与入口策略错误；步骤 errors 必须是目标 query/service 错误集的子集，缺省取目标全部", implemented_by: [ service-errors ] }
  - { id: service-control, text: "on_error 按 error 唯一，action 只能是 abort/continue/goto，target 仅 goto 可用且必须存在；存在后向/自环 goto 时 service.max_iterations 必填且 >= 1", implemented_by: [ service-control ] }
  - { id: service-when, text: "when 是受限布尔表达式；静态 false 的步骤不可达；引用的 step 必须是前序步骤，字段必须存在于目标 returns、logic output 或 query 返回；$ref / oneOf / anyOf / allOf / 列表索引按 schema 解析", implemented_by: [ service-when ] }
  - { id: service-visibility, text: "cap.protocols.http.x-service 只能指向 visibility=public 且无 async job 的 service；跨模块 kind=service 只能指向 visibility=public 的目标；internal 目标只能被同模块引用", implemented_by: [ service-visibility ] }
  - { id: service-steps-kind, text: "kind=query 必须有 query；kind=service 必须有 service；kind=logic 必须有 output+errors，可选 queries/events/rules；kind=event 必须有 event；kind=transition 必须有 transitions；params 可选，出现时 key 必须是目标参数", implemented_by: [ service-steps-kind ] }
  - { id: service-cycle, text: "kind=service 调用图必须无环", implemented_by: [ service-cycle ] }
  - { id: service-params, text: "params 的值必须是 input.* / step.<id>.* 表达式或字面量；input 字段必须存在，step 字段必须存在于前序步骤输出", implemented_by: [ service-params ] }
  - { id: service-output, text: "kind=logic 的 output 必须覆盖 service returns 的全部业务字段（err 除外）", implemented_by: [ service-output ] }
  - { id: service-event-payload, text: "kind=event 的 payload key 必须属于事件 payload.properties", implemented_by: [ service-event-payload ] }
