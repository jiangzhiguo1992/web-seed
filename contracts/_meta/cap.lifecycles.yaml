# 状态机；subjects 声明共享该状态机的实体字段。

id: meta.cap.lifecycles
type: cap.lifecycles
title: "实体状态生命周期契约"
targets:
  dir: "contracts/capabilities/lifecycles"
  glob: "*.yaml"
  id: "cap.lifecycles.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: _types.string
    required: true
    pattern: '^cap\.lifecycles\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: _types.string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: _types.string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "归属模块"

  - name: schema_version
    type: _types.integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: _types.string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: _types.set<_types.string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: subjects
    type: _types.list<_types.object>
    required: true
    min_items: 1
    description: "共享同一状态机的实体状态字段"
    item_fields:
      - { name: entity, type: _types.string, required: true, pattern: '^data\.entities\.[a-z][a-z0-9_]*$', description: "状态所属实体" }
      - { name: field, type: _types.string, required: true, pattern: '^[a-z][a-zA-Z0-9_]*$', description: "实体上的状态字段（json_name）" }

  - name: states
    type: _types.object
    required: true
    description: "状态集合与边界"
    fields:
      - { name: values, type: _types.set<_types.string>, required: true, min_items: 1, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "状态取值集合" }
      - { name: initial, type: _types.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "初始状态" }
      - { name: final, type: _types.set<_types.string>, required: false, min_items: 1, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "终态集合；省略表示没有终态" }

  - name: create
    type: _types.object
    required: true
    description: "创建动作"
    fields:
      - name: requires
        type: _types.list<_types.object>
        required: false
        min_items: 1
        description: "创建前的跨维度状态前提；列表内全部满足（AND）"
        item_fields:
          - { name: lifecycle, type: _types.string, required: true, pattern: '^cap\.lifecycles\.[a-z][a-z0-9_]*$', description: "前置状态所属生命周期" }
          - { name: states, type: _types.set<_types.string>, required: true, min_items: 1, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "允许的前置状态集合" }
      - { name: implemented_by, type: _types.set<_types.string>, required: true, min_items: 1, unique: true, generated: true, write: forbidden, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "实现该动作的 step；事件由 step.events 声明" }

  - name: destroy
    type: _types.object
    required: false
    description: "销毁动作；声明 final 时销毁进入终态"
    fields:
      - name: requires
        type: _types.list<_types.object>
        required: false
        min_items: 1
        description: "销毁前的跨维度状态前提；列表内全部满足（AND）"
        item_fields:
          - { name: lifecycle, type: _types.string, required: true, pattern: '^cap\.lifecycles\.[a-z][a-z0-9_]*$', description: "前置状态所属生命周期" }
          - { name: states, type: _types.set<_types.string>, required: true, min_items: 1, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "允许的前置状态集合" }
      - { name: implemented_by, type: _types.set<_types.string>, required: true, min_items: 1, unique: true, generated: true, write: forbidden, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "实现该动作的 step；事件由 step.events 声明" }

  - name: transitions
    type: _types.list<_types.object>
    required: false
    min_items: 1
    description: "状态转换；create/destroy 之外的合法转换"
    item_fields:
      - { name: name, type: _types.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "转换名" }
      - { name: description, type: _types.string, required: true, description: "转换说明" }
      - { name: from, type: _types.set<_types.string>, required: true, min_items: 1, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "源状态" }
      - { name: to, type: _types.string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "目标状态" }
      - name: requires
        type: _types.list<_types.object>
        required: false
        min_items: 1
        description: "跨维度前置状态；列表内全部满足（AND）"
        item_fields:
          - { name: lifecycle, type: _types.string, required: true, pattern: '^cap\.lifecycles\.[a-z][a-z0-9_]*$', description: "前置状态所属生命周期" }
          - { name: states, type: _types.set<_types.string>, required: true, min_items: 1, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "允许的前置状态集合" }
      - { name: implemented_by, type: _types.set<_types.string>, required: true, min_items: 1, unique: true, generated: true, write: forbidden, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "实现该转换的 step" }

rules:
  - { id: lifecycle-structure, text: "states.values 名唯一；initial/final 必须是 values 中的状态；transitions 的 from/to 必须是 values；final 不得作为 transition 的 from；destroy 存在时 final 不得多于一个；destroy 与唯一 final 同时存在时 transition 不得指向该 final", implemented_by: [ lifecycle-structure ] }
  - { id: lifecycle-exhaustive, text: "每个 state 必须从 initial 可达；非 final 状态必须有出边（transition 或 destroy）；转换名唯一", implemented_by: [ lifecycle-exhaustive ] }
  - { id: lifecycle-subject, text: "subjects[].entity 必须是存在的 data.entities.*；subjects[].field 必须是该实体的非关系标量字段、类型为存在的 data.enums.*、source 为 column；同一 lifecycle 的所有 subjects 的 field 类型必须相同；lifecycle.owner_module 必须等于每个 subject 实体的 owner_module；states.values/initial/final/from/to 必须是该枚举的值", implemented_by: [ lifecycle-subject ] }
  - { id: lifecycle-dimension, text: "同一 (entity, field) 组合只能被一个 lifecycle 契约声明；同一 lifecycle 内不得重复声明同一 (entity, field)", implemented_by: [ lifecycle-dimension ] }
  - { id: lifecycle-enum-coverage, text: "被 lifecycle 使用的 data.enums.*，每个枚举值必须至少被一个使用该枚举的 lifecycle states.values 声明；states.values 只允许该枚举的值", implemented_by: [ lifecycle-enum-coverage ] }
  - { id: lifecycle-requires, text: "requires[].states 必须非空且均为目标 lifecycle 的 states.values；lifecycle 必须是存在的 cap.lifecycles.* 且不能是自身；同一 action 内同一个 lifecycle 只能出现一次；按 lifecycle 文件聚合的 requires 图不得有环；列表内全部满足（AND）", implemented_by: [ lifecycle-requires ] }
  - { id: lifecycle-anchors, text: "create.implemented_by/destroy.implemented_by 必须等于 step.lifecycles 反推出的 step 集合；transitions[].implemented_by 必须是存在的 cap.services.<file>.<service>.<step>，且 step 的 lifecycles 反向引用同一动作；动作发出的事件只在 step.events / cap.events.topics.emitted_by 声明", implemented_by: [ lifecycle-anchors ] }
