# cap.lifecycles：一个契约 = 一个状态机；subjects 列出共享该状态机的实体状态字段。

id: meta.cap.lifecycles
type: cap.lifecycles
title: "实体状态生命周期契约"
targets:
  dir: "contracts/capabilities/lifecycles"
  glob: "*.yaml"
  id: "cap.lifecycles.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: string
    required: true
    pattern: '^cap\.lifecycles\.[a-z][a-z0-9_]*$'
    description: "契约 ID"

  - name: summary
    type: string
    required: true
    description: "一句话说明"

  - name: owner_module
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "归属模块"

  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "格式版本"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    default: draft
    description: "稳定度"

  - name: do_not
    type: list<string>
    required: true
    unique: true
    description: "实例级负向约束"

  - name: subjects
    type: list<object>
    required: true
    min_items: 1
    description: "共享同一状态机的实体状态字段"
    item_fields:
      - { name: entity, type: string, required: true, pattern: '^data\.entities\.[a-z][a-z0-9_]*$', description: "状态所属实体" }
      - { name: field, type: string, required: true, pattern: '^[a-z][a-zA-Z0-9_]*$', description: "实体上的状态字段（json_name）" }

  - name: states
    type: object
    required: true
    description: "状态集合与边界"
    fields:
      - { name: values, type: list<string>, required: true, min_items: 1, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "状态取值集合；必须是 subject 状态枚举的值" }
      - { name: initial, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "初始状态" }
      - { name: final, type: list<string>, required: false, min_items: 1, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "终态集合；省略表示没有终态" }

  - name: create
    type: object
    required: true
    description: "创建动作"
    fields:
      - name: requires
        type: list<object>
        required: false
        min_items: 1
        description: "创建前的跨维度状态前提；列表内全部满足（AND）"
        item_fields:
          - { name: lifecycle, type: string, required: true, pattern: '^cap\.lifecycles\.[a-z][a-z0-9_]*$', description: "前置状态所属生命周期；不能是自身" }
          - { name: states, type: list<string>, required: true, min_items: 1, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "允许的前置状态集合；目标维度处于其中任一状态即可" }
      - { name: services, type: list<string>, required: true, min_items: 1, unique: true, generated: true, write: forbidden, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "gen-graph 从 step.lifecycles 反推；events 不能单独构成 action" }
      - { name: events, type: list<string>, required: false, unique: true, pattern: '^cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "可选；必须由 services 中的 step 发出" }

  - name: destroy
    type: object
    required: false
    description: "销毁动作；可从任意非 final 状态销毁实体，声明 final 时同时进入 final"
    fields:
      - name: requires
        type: list<object>
        required: false
        min_items: 1
        description: "销毁前的跨维度状态前提；列表内全部满足（AND）"
        item_fields:
          - { name: lifecycle, type: string, required: true, pattern: '^cap\.lifecycles\.[a-z][a-z0-9_]*$', description: "前置状态所属生命周期；不能是自身" }
          - { name: states, type: list<string>, required: true, min_items: 1, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "允许的前置状态集合；目标维度处于其中任一状态即可" }
      - { name: services, type: list<string>, required: true, min_items: 1, unique: true, generated: true, write: forbidden, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "gen-graph 从 step.lifecycles 反推；events 不能单独构成 action" }
      - { name: events, type: list<string>, required: false, unique: true, pattern: '^cap\.events\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "可选；必须由 services 中的 step 发出" }

  - name: transitions
    type: list<object>
    required: false
    min_items: 1
    description: "状态转换；create/destroy 之外的合法转换"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "转换名" }
      - { name: description, type: string, required: true, description: "转换说明" }
      - { name: from, type: list<string>, required: true, min_items: 1, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "源状态" }
      - { name: to, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "目标状态" }
      - name: requires
        type: list<object>
        required: false
        min_items: 1
        description: "跨维度前置状态；列表内全部满足（AND）"
        item_fields:
          - { name: lifecycle, type: string, required: true, pattern: '^cap\.lifecycles\.[a-z][a-z0-9_]*$', description: "前置状态所属生命周期；不能是自身" }
          - { name: states, type: list<string>, required: true, min_items: 1, unique: true, pattern: '^[a-z][a-z0-9_]*$', description: "允许的前置状态集合；目标维度处于其中任一状态即可" }
      - { name: implemented_by, type: list<string>, required: true, min_items: 1, unique: true, generated: true, write: forbidden, pattern: '^cap\.services\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: "gen-graph 生成" }

rules:
  - { id: lifecycle-structure, text: "states.values 名唯一；initial/final 必须是 values 中的状态；transitions 的 from/to 必须是 values；final 不得作为 transition 的 from；destroy 存在时 final 不得多于一个；destroy 与唯一 final 同时存在时 transition 不得指向该 final", implemented_by: [ lifecycle-structure ] }
  - { id: lifecycle-exhaustive, text: "每个 state 必须从 initial 可达；非 final 状态必须有出边（transition 或 destroy）；转换名唯一", implemented_by: [ lifecycle-exhaustive ] }
  - { id: lifecycle-subject, text: "subjects[].entity 必须是存在的 data.entities.*；subjects[].field 必须是该实体的非关系标量字段、类型为存在的 data.enums.*、source 为 column；同一 lifecycle 的所有 subjects 的 field 类型必须相同；lifecycle.owner_module 必须等于每个 subject 实体的 owner_module；states.values/initial/final/from/to 必须是该枚举的值", implemented_by: [ lifecycle-subject ] }
  - { id: lifecycle-dimension, text: "同一 (entity, field) 组合只能被一个 lifecycle 契约声明；同一 lifecycle 内不得重复声明同一 (entity, field)", implemented_by: [ lifecycle-dimension ] }
  - { id: lifecycle-enum-coverage, text: "被 lifecycle 使用的 data.enums.*，每个枚举值必须至少被一个使用该枚举的 lifecycle states.values 声明；states.values 只允许该枚举的值", implemented_by: [ lifecycle-enum-coverage ] }
  - { id: lifecycle-requires, text: "requires[].states 必须非空且均为目标 lifecycle 的 states.values；lifecycle 必须是存在的 cap.lifecycles.* 且不能是自身；同一 action 内同一个 lifecycle 只能出现一次；按 lifecycle 文件聚合的 requires 图不得有环；列表内全部满足（AND）", implemented_by: [ lifecycle-requires ] }
  - { id: lifecycle-anchors, text: "create.services/destroy.services 必须等于 step.lifecycles 反推出的 service 集合；create.events/destroy.events 必须是存在的 cap.events.* 且由对应 services 中的 step 发出；transitions[].implemented_by 必须是存在的 cap.services.<file>.<service>.<step>，且 step 的 lifecycles 反向引用同一动作", implemented_by: [ lifecycle-anchors ] }
