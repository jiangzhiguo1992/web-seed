# data.entities 的单一规范：字段树 + 值域 + 硬规则。
# 通用字段语义见 _meta/README.md；本文件只写 data.entities 特有内容。
# 实体是读模型：字段必须能投影回物理列或声明为计算字段，不反推 DDL，不承载业务行为。
# 实体/字段名是 Go 标识符：首字母大写导出（public），小写不导出（internal）。
# 实体类型复用 _meta/_types.yaml 的 column_types.families，不维护第二套类型词表。
# fields 同时承载标量字段与关系字段：标量用 source/validation，关系用 type/join_column_from/join_column_to，二者互斥。
# 本文件的字段顺序是唯一顺序源：实例必须按 fields/item_fields 的顺序书写，checker 不维护第二份顺序表。
# description 是 schema 级必填；source/validation 是“标量必填、关系禁写”的条件必填，由 checker 强制。

id: meta.data.entities
type: data.entities
title: "逻辑数据实体契约"
targets:
  dir: "contracts/data/entities"
  glob: "*.yaml"
  id: "data.entities.<file>"
  naming: "snake_case"

fields:
  - name: id
    type: string
    required: true
    pattern: '^data\.entities\.[a-z][a-z0-9_]*$'
    description: "由 targets.id 模板派生（<file> 替换为文件 stem）"
    generates: "契约 ID、图节点"
    caution: "不要手写与文件不一致的 ID；checker 以文件名为源"

  - name: summary
    type: string
    required: true
    description: "一句话说明这个实体是什么"
    generates: "index 摘要"
    caution: "不要写字段清单"

  - name: owner_module
    type: string
    required: true
    pattern: '^[a-z][a-z0-9_]*$'
    description: "实体所属模块；必须等于主表的 owner_module"
    generates: "包/模块归属、生成目录"
    caution: "不要写 capability 名；多表实体以 tables[0] 的主表为准"

  - name: schema_version
    type: integer
    required: true
    const: 1
    description: "契约格式版本，固定 1"
    generates: "无"
    caution: "必须是整数 1"

  - name: stability
    type: string
    required: true
    enum: [ stable, draft, deprecated ]
    description: "契约稳定度"
    generates: "index 摘要"
    caution: "stable 不得含 TODO/FIXME；可回退 draft 继续修改"

  - name: do_not
    type: list<string>
    required: false
    description: "实例级负向约束；每条含本实体标识"
    generates: "AI 反例"
    caution: "通用规则放组 README 或 _base，禁止复制到这里"

  - name: model
    type: object
    required: true
    description: "Go 类型声明：名称、继承、映射表；字段本身在顶层 fields"
    generates: "Go/TS 类型声明"
    caution: "内层顺序以本文件 model.fields 为准；不要在这里塞字段"
    fields:
      - { name: name, type: string, required: true, pattern: '^[A-Za-z][A-Za-z0-9]*$', description: "Go 类型名；首字母大写 public，小写 internal", caution: "必须是合法非关键字 Go 标识符；全局唯一" }
      - { name: extends, type: list<string>, required: true, min_items: 1, unique: true, pattern: '^data\.entities\.[a-z][a-z0-9_]*$', description: "继承的实体基类；当前只允许 data.entities.base", caution: "不得引用普通 entity；基类字段不得重声明；Status 可用 data.enums.* 特化" }
      - { name: tables, type: list<string>, required: true, min_items: 1, unique: true, pattern: '^data\.tables\.[a-z][a-z0-9_]*$', description: "实体映射的物理表列表；第一张是主表，单表也写成列表", caution: "不得指向 data.tables.base；多表时字段必须用 source.column 指明来源；每张表至少被一个字段引用" }
      - { name: included_by, type: list<string>, required: true, unique: true, pattern: '^data\.entities\.[a-z][a-z0-9_]*$', description: "通过关系字段指向本实体的 entity ID 列表；必须与关系字段 type 双向一致", caution: "显式声明；checker 校验每一处引用，悬空或缺失都报错" }

  - name: fields
    type: list<object>
    required: true
    description: "实体的业务字段与关系字段；只写语义增量，机械事实从来源列派生"
    generates: "Go/TS 类型、JSON 形状、关系装载"
    caution: "每项二选一：标量字段（source）或关系字段（type + join_column_from + join_column_to），不得混用"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^[A-Za-z][A-Za-z0-9]*$', description: "Go 字段名；首字母大写导出，小写不导出", caution: "同一实体内唯一；sensitivity: secret 的字段必须小写开头" }
      - { name: type, type: string, required: false, description: "标量字段的逻辑类型；关系字段写目标 entity ID（data.entities.*）；前缀 * 表示指针", generates: "Go/TS 字段类型", caution: "标量：来源列字段可省略并按列类型+nullable 派生，computed/soft 必填；关系：必须是 data.entities.* 且不得为指针" }
      - { name: json_name, type: string, required: false, pattern: '^[a-z][a-zA-Z0-9_]*$', description: "生成的 JSON 字段名；省略时取 snake_case(name)", generates: "JSON tag、TS 属性名", caution: "同一实体内必须唯一；只有自定义命名才需要写" }
      - { name: description, type: string, required: true, description: "字段说明；必须显式，不继承列 comment", caution: "写语义，不要重复列名或物理长度" }
      - name: source
        type: object
        required: false
        description: "标量字段的装载来源；column/computed/soft 三选一；标量必填，关系字段不得写"
        generates: "SQL 投影、字段装载"
        caution: "标量字段必须显式；column 的校验/类型由来源列给出；computed 不占列；soft=外部传入或无法脚本化的来源说明"
        fields:
          - { name: column, type: string, required: false, pattern: '^data\.tables\.[a-z][a-z0-9_]*\.col\.[a-z][a-z0-9_]*$', description: "来源物理列；必须属于本实体的表", caution: "同一列不得被两个字段引用" }
          - { name: computed, type: string, required: false, description: "计算/聚合表达式；标量字段的另一种来源", caution: "非空；必须使用指针类型 *T；不引用 @param；不同查询需要不同算法时改用 query.returns；表达式语义由实现验证" }
          - { name: soft, type: string, required: false, description: "外部传入或无法脚本化的来源说明", caution: "非空；必须显式 type；validation 不得使用 column" }
      - name: validation
        type: object
        required: false
        description: "字段校验规则；标量必填；column/pattern/soft 三选一，默认语义为 column"
        generates: "输入校验、测试断言"
        caution: "column=复用列规则，必须与 source.column 相同；pattern=硬正则；soft=脚本无法验证的软表达式；soft 来源不得用 column"
        fields:
          - { name: column, type: string, required: false, pattern: '^data\.tables\.[a-z][a-z0-9_]*\.col\.[a-z][a-z0-9_]*$', description: "依赖该列的校验规则（类型/长度/范围/pattern）", caution: "必须属于本实体的表；有 source.column 时必须与 source.column 相同" }
          - { name: pattern, type: string, required: false, description: "字段级硬正则", caution: "只允许 string 字段；checker 编译校验" }
          - { name: soft, type: string, required: false, description: "无法脚本化的软校验表达式", caution: "非空；生成测试提示，不做机器判定" }
      - { name: sensitivity, type: string, required: false, enum: [ public, pii, secret ], description: "字段敏感级别；标量字段省略时继承来源列，computed 省略时默认 public", caution: "不得低于来源列；secret 字段名必须小写开头；关系字段不得写" }
      - { name: join_column_from, type: string, required: false, pattern: '^data\.tables\.[a-z][a-z0-9_]*\.col\.[a-z][a-z0-9_]*$', description: "本端连接列；关系字段必填", caution: "必须属于当前 entity 的 model.tables" }
      - { name: join_column_to, type: string, required: false, pattern: '^data\.tables\.[a-z][a-z0-9_]*\.col\.[a-z][a-z0-9_]*$', description: "目标端连接列；关系字段必填", caution: "必须属于 relation.type 映射的表，且与 from 列类型一致" }
      - { name: load, type: string, required: false, enum: [ eager, lazy ], default: lazy, description: "装载策略；默认 lazy，表示不默认关联查询", caution: "eager 的查询侧列必须有索引；eager 链不得成环；自引用只能 lazy" }

  - name: validation
    type: list<object>
    required: false
    description: "数据库表达不了的跨字段校验"
    generates: "校验骨架、测试"
    caution: "不要写 DDL；不要写业务行为规则（属于 business.rules）"
    item_fields:
      - { name: name, type: string, required: true, pattern: '^[a-z][a-z0-9_]*$', description: "校验名；实体内唯一；ID 派生为 <entity-id>.<name>" }
      - { name: expr, type: string, required: true, description: "可执行的布尔表达式", caution: "checker 只校验非空；表达式语义由实现验证" }
      - { name: on_violation, type: string, required: true, pattern: '^platform\.errors\.[A-Z][A-Z0-9_]*$', description: "失败时映射的错误码" }

  - name: used_by
    type: object
    required: true
    generated: true
    write: forbidden
    description: "反向索引；query 装载与 capability 引用"
    generates: "used_by、inbound"
    caution: "生成物，禁止手改；必须是文件最后一个顶层键，make gen-graph 只重写该块"
    fields:
      - { name: queries, type: list<string>, required: true, unique: true, description: "returns 本实体的 query 项 ID" }
      - { name: capabilities, type: list<string>, required: true, unique: true, description: "引用本实体的 capability ID；只统计 type/x-entity/returns 中的直接引用" }

rules:
  - { id: entity-base-file, text: "基类契约固定位于 contracts/data/entities/_base.yaml，ID 固定为 data.entities.base", implemented_by: [ entity-base-file ] }
  - { id: entity-base-shape, text: "基类必须且只能是 ID/Status/CreatedAt/UpdatedAt/DeletedAt；type 从 tables/_base 继承不得重写，DeletedAt 为 *timestamp；每个基类字段必须写 source/validation/description", implemented_by: [ entity-base-shape ] }
  - { id: entity-base-only, text: "model.extends 必须恰好是 [data.entities.base]", implemented_by: [ entity-base-only ] }
  - { id: entity-no-base-fields, text: "具体实体不得重声明基类字段；Status 允许用 data.enums.* 特化", implemented_by: [ entity-no-base-fields ] }
  - { id: entity-base-field-first, text: "重声明的基类字段（当前仅 Status）必须是 fields 第一项", implemented_by: [ entity-base-field-first ] }
  - { id: entity-table-shape, text: "model.tables 必填、非空、去重、不得指向 data.tables.base；model.tables[0] 是主表", implemented_by: [ entity-table-shape ] }
  - { id: entity-table-covered, text: "每张物理表必须被至少一个 entity 映射", implemented_by: [ entity-table-covered ] }
  - { id: entity-name, text: "model.name 必须是合法 Go 标识符（非关键字）；首字母大写 public，小写 internal", implemented_by: [ entity-name ] }
  - { id: entity-field-name, text: "字段 name 必须是合法 Go 标识符（非关键字）；首字母大小写表达导出性", implemented_by: [ entity-field-name ] }
  - { id: entity-name-unique, text: "entity.model.name 必须全局唯一，避免生成 Go 类型冲突", implemented_by: [ entity-name-unique ] }
  - { id: entity-owner-module, text: "owner_module 必须等于主表 model.tables[0] 的 owner_module", implemented_by: [ entity-owner-module ] }
  - { id: entity-key-order, text: "实体契约字段顺序必须与 _meta/data.entities.yaml 的 fields 顺序一致；嵌套对象同序", implemented_by: [ entity-key-order ] }
  - { id: entity-model-order, text: "model 内字段顺序必须与 _meta/data.entities.yaml 的 model.fields 一致", implemented_by: [ entity-model-order ] }
  - { id: entity-id, text: "ID 是所有实体的唯一主键：必须来自主表 id 列、非指针，且是唯一主键", implemented_by: [ entity-id ] }
  - { id: entity-field-variant, text: "字段二选一：标量字段必须有 source 且不得写 join_column_from/join_column_to/load；关系字段必须有 type/join_column_from/join_column_to，且不得写 source/validation/sensitivity（空对象也不允许）", implemented_by: [ entity-field-variant ] }
  - { id: entity-field-source, text: "source 必须三选一：column 指向本实体表的列；computed 非空、指针类型、不引用 @param；soft 非空且必须显式 type", implemented_by: [ entity-field-source ] }
  - { id: entity-field-type, text: "来源列字段的 type 可省略，省略时按列类型+nullable 派生；computed/soft 必填；显式 type 的 * 前缀必须与来源列 nullable 一致；枚举只能映射 integer 列；禁止列表类型和 data.tables.* 行类型", implemented_by: [ entity-field-type ] }
  - { id: entity-field-column, text: "source.column 必须存在且属于本实体的表；同一列不得被两个字段引用；多表合成的每张表至少被一个字段引用", implemented_by: [ entity-field-column ] }
  - { id: entity-field-validation, text: "标量字段必须显式 validation，三选一：column 指向存在且与本字段 source.column 相同的列；pattern 是合法正则且字段为 string；soft 非空；soft 来源不得用 column", implemented_by: [ entity-field-validation ] }
  - { id: entity-field-description, text: "字段描述必须显式且非空，不从列 comment 继承", implemented_by: [ entity-field-description ] }
  - { id: entity-field-sensitive, text: "sensitivity 省略时继承来源列；显式值不得低于来源列；secret 字段名必须小写开头", implemented_by: [ entity-field-sensitive ] }
  - { id: entity-field-json-name, text: "json_name 可省略，默认取 snake_case(name)；同一实体内 JSON 名必须唯一", implemented_by: [ entity-field-json-name ] }
  - { id: entity-relation-type, text: "relation.type 必须是 data.entities.* ID，且不得为指针", implemented_by: [ entity-relation-type ] }
  - { id: entity-relation-target, text: "relation.type 必须是已存在的 entity，且 join_column_to 的表必须被该 entity 映射", implemented_by: [ entity-relation-target ] }
  - { id: entity-relation-via, text: "join_column_from 必须属于当前 entity 的表；join_column_to 必须属于 relation.type 映射的表；两列类型族必须一致", implemented_by: [ entity-relation-via ] }
  - { id: entity-relation-cardinality, text: "关系基数由两端列唯一性推断：两端唯一 one_to_one；from 唯一 one_to_many；to 唯一 many_to_one；两端都不唯一则不允许", implemented_by: [ entity-relation-cardinality ] }
  - { id: entity-relation-eager-index, text: "eager 关系的 join_column_to 必须有索引或主键", implemented_by: [ entity-relation-eager-index ] }
  - { id: entity-relation-eager-cycle, text: "eager 关系链不得成环；自引用不得 eager", implemented_by: [ entity-relation-eager-cycle ] }
  - { id: entity-validation, text: "validation.name 必须 snake_case 且实体内唯一，ID 派生为 <entity-id>.<name>；expr 非空；on_violation 必须存在", implemented_by: [ entity-validation ] }
  - { id: entity-used-by, text: "used_by.queries 必须等于 returns 本实体的 query 集合；used_by.capabilities 必须等于引用本实体的 capability 集合", implemented_by: [ entity-used-by ] }
  - { id: entity-included-by, text: "model.included_by 必须等于关系字段 type 指向本实体的 entity 集合；每个 entity 必须存在且确实指向本实体", implemented_by: [ entity-included-by ] }
  - { id: entity-do-not-specific, text: "do_not 每条必须含本实体标识；通用规则放组 README 或 _base，禁止复制", implemented_by: [ entity-do-not-specific ] }
