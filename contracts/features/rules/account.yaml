# 账号业务规则集。

id: feature.rules.account
summary: "账号业务规则集"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "account 只关心业务主体；密码/手机/邮箱/令牌规则在 feature.rules.auth"
  - "不要在 handler/service 里手写编号格式或归属校验"
  - "不要在本文件写密码强度规则（见 platform/security/auth_policy）"
rules:
  - id: feature.rules.account.number_format
    kind: constraint
    summary: "账号编号只允许字母、数字、下划线和短横线，长度 4–64"
    entity: data.entities.account
    field: number
    op: pattern
    value: "^[A-Za-z0-9_-]{4,64}$"
    on_violation: platform.errors.ACCOUNT_NUMBER_INVALID
    implemented_by: [ cap.services.account.create ]
  - id: feature.rules.account.number_unique
    kind: policy
    summary: "未删除账号内编号唯一"
    on_violation: platform.errors.ACCOUNT_NUMBER_TAKEN
    implemented_by: [ cap.services.account.create ]
    given: "已存在 active 账号 ACC-0001"
    when: "创建 ACC-0001"
    then: "拒绝，返回 ACCOUNT_NUMBER_TAKEN"
  - id: feature.rules.account.nickname_length
    kind: invariant
    summary: "昵称长度 1–100"
    assert: "len(nickname) >= 1 && len(nickname) <= 100"
    on_violation: platform.errors.ACCOUNT_NICKNAME_INVALID
    implemented_by: [ cap.services.account.create, cap.services.account.update ]
  - id: feature.rules.account.self_only
    kind: policy
    summary: "非管理员只能查看和修改自己的账号"
    on_violation: platform.errors.COMMON_FORBIDDEN
    implemented_by: [ cap.services.account.get, cap.services.account.update ]
    given: "当前用户 id = A，目标账号 user_id = B"
    when: "非 admin 角色访问 B"
    then: "拒绝，返回 COMMON_FORBIDDEN"
  - id: feature.rules.account.deleted_cannot_modify
    kind: policy
    summary: "已软删账号不可修改、不可再次删除"
    on_violation: platform.errors.ACCOUNT_ALREADY_DELETED
    implemented_by: [ cap.services.account.delete, cap.services.account.update ]
    given: "deleted_at != nil"
    when: "update / delete"
    then: "拒绝，返回 ACCOUNT_ALREADY_DELETED"
  - id: feature.rules.account.delete_revokes_auth
    kind: policy
    summary: "软删账号必须同时软删认证绑定、作废未消费验证体并吊销全部令牌"
    on_violation: platform.errors.COMMON_INTERNAL
    implemented_by: [ cap.services.account.delete ]
    given: "account.delete 只更新 account.status/deleted_at"
    when: "软删账号"
    then: "调用 cap.services.auth.revoke_all_for_account；失败则回滚整个删除"
  - id: feature.rules.account.deleted_status_consistent
    kind: invariant
    summary: "status=deleted 当且仅当 deleted_at 非空"
    assert: "(status == deleted) == (deleted_at != nil)"
    on_violation: platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    implemented_by: [ cap.services.account.delete ]
  - id: feature.rules.account.activate_requires_pending_or_suspended
    kind: policy
    summary: "只有 pending 或 suspended 账号可以激活"
    on_violation: platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    implemented_by: [ cap.services.account.activate ]
    given: "account.status not in (pending, suspended)"
    when: "激活账号"
    then: "拒绝，返回 ACCOUNT_ILLEGAL_TRANSITION"
  - id: feature.rules.account.suspend_requires_active
    kind: policy
    summary: "只有 active 账号可以封禁"
    on_violation: platform.errors.ACCOUNT_ILLEGAL_TRANSITION
    implemented_by: [ cap.services.account.suspend ]
    given: "account.status != active"
    when: "封禁账号"
    then: "拒绝，返回 ACCOUNT_ILLEGAL_TRANSITION"
