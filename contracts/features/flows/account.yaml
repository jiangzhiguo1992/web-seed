# 账号功能流程。

id: feature.flows.account
summary: "账号功能流程"
owner_module: account
schema_version: 1
stability: draft
do_not:
  - "account 只关心业务主体；密码/手机/邮箱/令牌规则在 feature.flows.auth"
  - "不要在 handler/service 里手写编号格式或归属校验"
  - "不要在本文件写密码强度规则（见 platform/security/auth_policy）"
scope: ui
entry: feature.routes.account_list
steps:
  - id: create
    page: feature.pages.account_create
    action: submit
    rules:
      - feature.flows.account.number_format
      - feature.flows.account.number_unique
      - feature.flows.account.nickname_length
    next: detail
    on_success: feature.routes.account_detail
  - id: detail
    page: feature.pages.account_detail
    action: edit
    rules:
      - feature.flows.account.nickname_length
      - feature.flows.account.self_only
      - feature.flows.account.deleted_cannot_modify
    next: done
  - id: activate
    page: feature.pages.account_detail
    action: activate
    rules:
      - feature.flows.account.activate_requires_pending_or_suspended
    next: done
  - id: suspend
    page: feature.pages.account_detail
    action: suspend
    rules:
      - feature.flows.account.suspend_requires_active
    next: done
  - id: delete
    page: feature.pages.account_detail
    action: delete
    rules:
      - feature.flows.account.deleted_cannot_modify
      - feature.flows.account.delete_revokes_auth
      - feature.flows.account.deleted_status_consistent
    next: done
    on_success: feature.routes.account_list
  - id: activate_from_list
    page: feature.pages.account_list
    action: activate
    rules:
      - feature.flows.account.activate_requires_pending_or_suspended
    next: done
  - id: suspend_from_list
    page: feature.pages.account_list
    action: suspend
    rules:
      - feature.flows.account.suspend_requires_active
    next: done
  - id: delete_from_list
    page: feature.pages.account_list
    action: delete
    rules:
      - feature.flows.account.deleted_cannot_modify
      - feature.flows.account.delete_revokes_auth
      - feature.flows.account.deleted_status_consistent
    next: done
    on_success: feature.routes.account_list
rules:
  - id: feature.flows.account.number_format
    kind: constraint
    summary: "账号编号只允许字母、数字、下划线和短横线，长度 4–64"
    errors: [ platform.errors.ACCOUNT_NUMBER_INVALID ]
    entity: data.entities.account
    field: number
    op: pattern
    value: "^[A-Za-z0-9_-]{4,64}$"
    implemented_by: [ cap.services.account.create ]
  - id: feature.flows.account.number_unique
    kind: policy
    summary: "未删除账号内编号唯一"
    errors: [ platform.errors.ACCOUNT_NUMBER_TAKEN ]
    decision:
      - when: "request.number in existing_active_numbers"
        effect: deny
        error: "platform.errors.ACCOUNT_NUMBER_TAKEN"
    implemented_by: [ cap.services.account.create ]
    verified_by: [ scripts/cmd/internal/check/rules_policy_test.go ]
  - id: feature.flows.account.nickname_length
    kind: invariant
    summary: "昵称长度 1–100"
    errors: [ platform.errors.ACCOUNT_NICKNAME_INVALID ]
    assert: "len(nickname) >= 1 && len(nickname) <= 100"
    implemented_by: [ cap.services.account.create, cap.services.account.update ]
    verified_by: [ scripts/cmd/internal/check/invariants_test.go ]
  - id: feature.flows.account.self_only
    kind: policy
    summary: "非管理员只能查看和修改自己的账号"
    errors: [ platform.errors.COMMON_FORBIDDEN ]
    decision:
      - when: "!current_user.is_admin && current_user.id != target_account.user_id"
        effect: deny
        error: "platform.errors.COMMON_FORBIDDEN"
    implemented_by: [ cap.services.account.get, cap.services.account.update ]
    verified_by: [ scripts/cmd/internal/check/rules_policy_test.go ]
  - id: feature.flows.account.deleted_cannot_modify
    kind: policy
    summary: "已软删账号不可修改、不可再次删除"
    errors: [ platform.errors.ACCOUNT_ALREADY_DELETED ]
    decision:
      - when: "target_account.deleted_at != nil"
        effect: deny
        error: "platform.errors.ACCOUNT_ALREADY_DELETED"
    implemented_by: [ cap.services.account.delete, cap.services.account.update ]
    verified_by: [ scripts/cmd/internal/check/rules_policy_test.go ]
  - id: feature.flows.account.delete_revokes_auth
    kind: policy
    summary: "软删账号必须同时软删认证绑定并作废未消费验证体；已签发 JWT 由账号状态校验失效"
    errors: [ platform.errors.COMMON_INTERNAL ]
    decision:
      - when: "true"
        effect: call
        target: cap.services.auth.revoke_all_for_account
        on_failure: "rollback"
    implemented_by: [ cap.services.account.delete ]
    verified_by: [ scripts/cmd/internal/check/rules_policy_test.go ]
  - id: feature.flows.account.deleted_status_consistent
    kind: invariant
    summary: "status=deleted 当且仅当 deleted_at 非空"
    errors: [ platform.errors.ACCOUNT_ILLEGAL_TRANSITION ]
    assert: "(status == \"deleted\") == (deleted_at != nil)"
    implemented_by: [ cap.services.account.delete ]
    verified_by: [ scripts/cmd/internal/check/invariants_test.go ]
  - id: feature.flows.account.activate_requires_pending_or_suspended
    kind: policy
    summary: "只有 pending 或 suspended 账号可以激活"
    errors: [ platform.errors.ACCOUNT_ILLEGAL_TRANSITION ]
    decision:
      - when: "target_account.status != \"pending\" && target_account.status != \"suspended\""
        effect: deny
        error: "platform.errors.ACCOUNT_ILLEGAL_TRANSITION"
    implemented_by: [ cap.services.account.activate ]
    verified_by: [ scripts/cmd/internal/check/rules_policy_test.go ]
  - id: feature.flows.account.suspend_requires_active
    kind: policy
    summary: "只有 active 账号可以封禁"
    errors: [ platform.errors.ACCOUNT_ILLEGAL_TRANSITION ]
    decision:
      - when: "target_account.status != \"active\""
        effect: deny
        error: "platform.errors.ACCOUNT_ILLEGAL_TRANSITION"
    implemented_by: [ cap.services.account.suspend ]
    verified_by: [ scripts/cmd/internal/check/rules_policy_test.go ]
