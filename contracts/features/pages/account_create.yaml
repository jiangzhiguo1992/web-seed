# 新建账号页。账号创建不包含认证信息；认证由 auth 模块单独创建。

id: feature.pages.account_create
summary: "新建账号页"
schema_version: 1
stability: draft
do_not:
  - "不要在本页收集密码/手机号/邮箱；认证信息由 auth 模块单独创建"
  - "不要硬编码编号格式，引用 feature.flows.account.number_format"

page: account_create
route: feature.routes.account_create

data:
  submit:
    capability: cap.services.account.create
    params:
      number: { from: form.number, type: _types.basics.string, required: true }
      nickname: { from: form.nickname, type: _types.basics.string, required: true }
      user_id: { from: form.user_id, type: _types.basics.id, optional: true }

view_states:
  loading:
    when: "mutation.isPending"
    ui: "button_spinner"
  empty:
    when: "false"
    note: "表单页无空态"
  error:
    when: "mutation.isError"
    ui: "inline_alert"
    show: "problem.detail"
  forbidden:
    when: "!hasPermission('platform.security.permissions.account_write')"
    ui: "forbidden-panel"

actions:
  submit:
    capability: cap.services.account.create
    params:
      number: { from: form.number, type: _types.basics.string, required: true }
      nickname: { from: form.nickname, type: _types.basics.string, required: true }
      user_id: { from: form.user_id, type: _types.basics.id, optional: true }
    permission: platform.security.permissions.account_write
    ui: "primary-button"
    label: "创建"
    on_success: "navigate(feature.routes.account_detail)"

fields:
  - name: number
    widget: string
    required: true
    minLength: 4
    maxLength: 64
    label: "账号编号"
  - name: nickname
    widget: string
    required: true
    maxLength: 100
    label: "昵称"
  - name: user_id
    widget: integer
    optional: true
    label: "关联用户"
