# 登录页。认证能力落地前以 planned 引用占位。

schema_version: 1
id: feature.page.login
summary: 登录页
stability: draft
do_not:
  - 不要把 token 存进 localStorage
  - 不要在页面里自行实现刷新逻辑
  - 错误提示必须统一，避免枚举账号是否存在

page: login
route: feature.route.login

data:
  submit:
    capability: planned:cap.http.auth.login
    note: auth 模块落地后替换为真实 capability
    params:
      email: { from: form.email, type: string, required: true }
      password: { from: form.password, type: string, required: true }

states:
  idle:
    when: "true"
    ui: form
  loading:
    when: "mutation.isPending"
    ui: button_spinner
  error:
    when: "mutation.isError"
    ui: inline_alert
    show: "problem.title"
  forbidden:
    when: "problem.code == 'ACCOUNT_SUSPENDED' || problem.code == 'ACCOUNT_LOCKED'"
    ui: inline_alert
    show: "problem.message"

actions:
  submit:
    capability: planned:cap.http.auth.login
    ui: primary-button
    label: 登录
    on_success: close_and_redirect(feature.route.account_list)

fields:
  - { name: email, type: string, required: true, maxLength: 254, autocomplete: username }
  - { name: password, type: string, required: true, minLength: 12, autocomplete: current-password, secret: true }

security:
  rate_limit_hint: 连续失败 5 次锁定 15 分钟（见 platform.sec.auth）
  error_copy_uniform: 邮箱与密码错误统一提示，避免枚举账号
