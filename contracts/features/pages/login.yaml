# 登录页。认证用例已在 cap.services.auth 落地。

id: feature.pages.login
summary: "登录页"
schema_version: 1
stability: draft
do_not:
  - "不要把 token 存进 localStorage"
  - "不要在页面里自行实现刷新逻辑"
  - "错误提示必须统一，避免枚举账号是否存在"

page: login
route: feature.routes.login

data:
  submit:
    capability: cap.services.auth.login
    params:
      auth_type: { from: form.auth_type, type: _types.basics.string, enum: [ pwd, phone, email ], default: pwd }
      identifier: { from: form.identifier, type: _types.basics.string, required: true }
      password: { from: form.password, type: _types.basics.string, required: true, secret: true }
      device_id: { from: device.id, type: _types.basics.string }

view_states:
  idle:
    when: "true"
    ui: "form"
  loading:
    when: "mutation.isPending"
    ui: "button_spinner"
  error:
    when: "mutation.isError"
    ui: "inline_alert"
    show: "problem.title"
  forbidden:
    when: "problem.code == 'AUTH_LOCKED' || problem.code == 'ACCOUNT_SUSPENDED'"
    ui: "inline_alert"
    show: "problem.message"

actions:
  submit:
    capability: cap.services.auth.login
    ui: "primary-button"
    label: "登录"
    on_success: "close_and_redirect(feature.routes.account_list)"
  send_code:
    capability: cap.services.verification.send
    params:
      auth_type: { from: form.auth_type, type: _types.basics.string, required: true }
      target: { from: form.identifier, type: _types.basics.string, required: true }
      purpose: { from: form.purpose, type: _types.basics.string, required: true }
      account_id: { from: form.account_id, type: _types.basics.id, optional: true }
    ui: "secondary-button"
    label: "发送验证码"
  verify_code:
    capability: cap.services.verification.verify
    params:
      auth_type: { from: form.auth_type, type: _types.basics.string, required: true }
      target: { from: form.identifier, type: _types.basics.string, required: true }
      purpose: { from: form.purpose, type: _types.basics.string, required: true }
      code: { from: form.code, type: _types.basics.string, required: true, secret: true }
      account_id: { from: form.account_id, type: _types.basics.id, optional: true }
    ui: "primary-button"
    label: "校验验证码"

fields:
  - name: identifier
    widget: string
    required: true
    maxLength: 254
    autocomplete: username
  - name: password
    widget: string
    required: true
    minLength: 12
    autocomplete: current-password
    secret: true
  - name: code
    widget: string
    optional: true
    maxLength: 6
    label: "验证码"
    autocomplete: one-time-code
  - name: purpose
    widget: select
    optional: true
    label: "验证用途"
    enum: data.enums.verification_purpose
  - name: account_id
    widget: integer
    optional: true
    label: "账号 ID"

analytics:
  page_view: page.login_viewed

security:
  rate_limit_hint: "连续失败 5 次锁定 15 分钟（见 platform.security.auth_policy）"
  error_copy_uniform: "账号标识与密码错误统一提示，避免枚举账号"
