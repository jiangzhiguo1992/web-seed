# 登录页。认证接口已在 cap.http.auth 落地。

schema_version: 1
id: feature.pages.login
summary: "登录页"
stability: draft
do_not:
  - "不要把 token 存进 localStorage"
  - "不要在页面里自行实现刷新逻辑"
  - "错误提示必须统一，避免枚举账号是否存在"

page: login
route: feature.routes.login

data:
  submit:
    capability: cap.http.auth.login
    params:
      auth_type: { from: form.auth_type, type: string, enum: [pwd, phone, email], default: pwd }
      identifier: { from: form.identifier, type: string, required: true }
      password: { from: form.password, type: string, required: true, secret: true }
      device_id: { from: device.id, type: string }

states:
  idle:
    when: "true"
    ui: "form"
  loading:
    when: "mutation.isPending"
    ui: "button_spinner"
  error:
    when: "mutation.isError"
    ui: "inline_alert"
    show: "problem.title"
  forbidden:
    when: "problem.code == 'AUTH_LOCKED' || problem.code == 'ACCOUNT_SUSPENDED'"
    ui: "inline_alert"
    show: "problem.message"

actions:
  submit:
    capability: cap.http.auth.login
    ui: "primary-button"
    label: "登录"
    on_success: "close_and_redirect(feature.routes.account_list)"

fields:
  - { name: identifier, type: string, required: true, maxLength: 254, autocomplete: username }
  - { name: password, type: string, required: true, minLength: 12, autocomplete: current-password, secret: true }

security:
  rate_limit_hint: "连续失败 5 次锁定 15 分钟（见 platform.security.auth_policy）"
  error_copy_uniform: "账号标识与密码错误统一提示，避免枚举账号"
