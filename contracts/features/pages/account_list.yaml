# 账号列表页。四态必须齐全，数据源必须引用 capability。

schema_version: 1
id: feature.page.account_list
summary: 账号列表页
stability: stable
do_not:
  - 状态筛选的取值必须来自 business.state.account.states，不要硬编码
  - forbidden 态依赖 platform.permission.account_read，不可省略

page: account_list
route: feature.route.account_list

data:
  list:
    capability: cap.http.accounts.list
    params:
      status: { from: query.status, enum: business.state.account.states, optional: true }
      page_size: { from: query.page_size, type: integer, default: 20 }
    cache:
      stale_time: 30s
      refetch_on_focus: false

states:
  loading:
    when: "query.isPending"
    ui: skeleton-table
  empty:
    when: "query.isSuccess && items.length == 0"
    ui: empty-state
    action: create
  error:
    when: "query.isError"
    ui: error-panel
    show: "problem.detail"
    retry: true
  forbidden:
    when: "!hasPermission('platform.permission.account_read')"
    ui: forbidden-panel

actions:
  create:
    capability: cap.http.accounts.create
    permission: platform.permission.account_write
    ui: primary-button
    label: 新建账号
    on_success: navigate(feature.flow.account_create.success_target)
  activate:
    capability: cap.http.accounts.activate
    permission: platform.permission.account_write
    ui: row-action
    label: 激活
    available_when: "row.status == pending || row.status == suspended"
  suspend:
    capability: cap.http.accounts.suspend
    permission: platform.permission.account_write
    ui: row-action
    label: 封禁
    confirm: true
    available_when: "row.status == active"
  delete:
    capability: cap.http.accounts.delete
    permission: platform.permission.account_delete
    ui: row-action
    label: 删除
    confirm: true
    danger: true
    available_when: "row.status != deleted"

fields:
  - { name: email, render: text }
  - { name: display_name, render: text }
  - { name: status, enum: business.state.account.states, render: badge }
  - { name: last_login_at, render: relative_time }
  - { name: created_at, render: relative_time }

filters:
  - { name: status, enum: business.state.account.states, multiple: false, label: 状态 }

pagination:
  style: cursor
  param: cursor
  page_size_default: 20
  page_size_max: 100

empty_copy:
  title: 还没有账号
  description: 创建第一个账号开始使用
  action_label: 新建账号

analytics:
  page_view: page.account_list_viewed
  actions:
    create: account.create_clicked
