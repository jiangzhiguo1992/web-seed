# 账号列表页。四态必须齐全，数据源必须引用 capability。

id: feature.pages.account_list
summary: "账号列表页"
schema_version: 1
stability: draft
do_not:
  - "状态筛选的取值必须来自 cap.lifecycles.account.states.values，不要硬编码"
  - "forbidden 态依赖 platform.security.permissions.account_read，不可省略"

page: account_list
route: feature.routes.account_list

data:
  list:
    capability: cap.services.account.list
    params:
      status: { from: query.status, enum: cap.lifecycles.account.states.values, optional: true }
      offset: { from: query.offset, type: _types.integer, default: 0 }
      limit: { from: query.limit, type: _types.integer, default: 20 }
    cache:
      stale_time: 30s
      refetch_on_focus: false

view_states:
  loading:
    when: "query.isPending"
    ui: "skeleton-table"
  empty:
    when: "query.isSuccess && items.length == 0"
    ui: "empty-state"
    action: "create"
  error:
    when: "query.isError"
    ui: "error-panel"
    show: "problem.detail"
    retry: true
  forbidden:
    when: "!hasPermission('platform.security.permissions.account_read')"
    ui: "forbidden-panel"

actions:
  create:
    permission: platform.security.permissions.account_write
    ui: "primary-button"
    label: "新建账号"
    on_success: "navigate(feature.routes.account_create)"
  activate:
    capability: cap.services.account.activate
    params:
      id: { from: row.id, type: _types.id, required: true }
    permission: platform.security.permissions.account_write
    available_when: { transitions: [cap.lifecycles.account.transitions.activate, cap.lifecycles.account.transitions.reactivate] }
    ui: "row-action"
    label: "激活"
  suspend:
    capability: cap.services.account.suspend
    params:
      id: { from: row.id, type: _types.id, required: true }
      reason: { from: form.reason, type: _types.string, required: true }
    permission: platform.security.permissions.account_write
    available_when: { transition: cap.lifecycles.account.transitions.suspend }
    ui: "row-action"
    label: "封禁"
    confirm: true
  delete:
    capability: cap.services.account.delete
    params:
      id: { from: row.id, type: _types.id, required: true }
    permission: platform.security.permissions.account_delete
    available_when: { transition: cap.lifecycles.account.destroy }
    ui: "row-action"
    label: "删除"
    confirm: true
    danger: true

fields:
  - name: number
    render: text
  - name: nickname
    render: text
  - name: status
    enum: cap.lifecycles.account.states.values
    render: badge
  - name: created_at
    render: relative_time

filters:
  - { name: status, enum: cap.lifecycles.account.states.values, multiple: false, label: "状态" }

pagination:
  style: offset
  param: offset
  limit_default: 20
  limit_max: 100

empty_copy:
  title: "还没有账号"
  description: "创建第一个账号开始使用"
  action_label: 新建账号

analytics:
  page_view: page.account_list_viewed
  actions:
    create: account.create_clicked
