# 账号详情页。四态与可用动作由生命周期决定。

id: feature.pages.account_detail
summary: "账号详情页"
schema_version: 1
stability: draft
do_not:
  - "不要在前端判断状态合法性，使用 cap.lifecycles.account 的动作表"
  - "认证信息只能通过认证接口获取，不要在本页拼装"

page: account_detail
route: feature.routes.account_detail

data:
  detail:
    capability: cap.services.account.get
    params:
      id: { from: route.params.id, type: _types.basics.id, required: true }
    cache:
      stale_time: 10s

view_states:
  loading:
    when: "query.isPending"
    ui: "skeleton-detail"
  empty:
    when: "false"
    note: "详情页无空态，不存在时进入 error/not_found"
  error:
    when: "query.isError"
    ui: "error-panel"
    show: "problem.detail"
  forbidden:
    when: "problem.code == 'COMMON_FORBIDDEN'"
    ui: "forbidden-panel"

actions:
  edit:
    capability: cap.services.account.update
    params:
      id: { from: route.params.id, type: _types.basics.id, required: true }
      nickname: { from: form.nickname, type: _types.basics.string, required: true }
    permission: platform.security.permissions.account_write
    available_when: { state_not: [ deleted ] }
    ui: "primary-button"
  activate:
    capability: cap.services.account.activate
    params:
      id: { from: route.params.id, type: _types.basics.id, required: true }
    permission: platform.security.permissions.account_write
    available_when: { transitions: [ cap.lifecycles.account.transitions.activate, cap.lifecycles.account.transitions.reactivate ] }
  suspend:
    capability: cap.services.account.suspend
    params:
      id: { from: route.params.id, type: _types.basics.id, required: true }
      reason: { from: form.reason, type: _types.basics.string, required: true }
    permission: platform.security.permissions.account_write
    available_when: { transition: cap.lifecycles.account.transitions.suspend }
    confirm: true
  delete:
    capability: cap.services.account.delete
    params:
      id: { from: route.params.id, type: _types.basics.id, required: true }
    permission: platform.security.permissions.account_delete
    available_when: { transition: cap.lifecycles.account.destroy }
    confirm: true
    danger: true

fields:
  - name: number
    render: heading
  - name: nickname
    render: text
  - name: user_id
    render: code
  - name: status
    enum: cap.lifecycles.account.states.values
    render: badge
  - name: created_at
    render: relative_time
  - name: updated_at
    render: relative_time

transition_ui:
  source: cap.lifecycles.account.transitions
  rule: "只渲染 from 包含当前状态的按钮（含 destroy）；点击前调用 canTransition()"
