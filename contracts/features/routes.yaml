# contract: feature.routes
# summary: 路由与菜单。页面路由由本文件生成，禁止手写。
# enforcement: generated
# consumers: [web/admin]
# refs: [features/pages/*, platform.sec.permissions]
# generates:
#   - apps/web/admin/src/generated/routes.ts
#   - apps/web/admin/src/generated/menu.ts
# do_not:
#   - 不要在 src/router 手写路由，改本文件
#   - 不要在路由 meta 里硬编码权限字符串
#   - 新增页面必须同时登记 page 契约

schema_version: 1
id: feature.routes
summary: 路由与菜单
stability: stable

app: web/admin

layout:
  default: default
  auth: blank          # 登录页等无导航布局

routes:
  - id: feature.route.note_list
    path: /notes
    name: note-list
    page: feature.page.note_list
    layout: default
    permission: platform.permission.note_read
    menu:
      group: 内容管理
      label: 笔记
      icon: document
      order: 10
    meta:
      title: 笔记列表

  - id: feature.route.note_detail
    path: /notes/:id
    name: note-detail
    page: feature.page.note_detail
    layout: default
    permission: platform.permission.note_read
    menu: null          # 不在菜单中显示
    meta:
      title: 笔记详情

  - id: feature.route.login
    path: /login
    name: login
    page: feature.page.login
    layout: auth
    permission: null
    menu: null
    meta:
      title: 登录
      public: true

redirects:
  - { from: /, to: /notes }

not_found:
  page: feature.page.not_found
  layout: default
