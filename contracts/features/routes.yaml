# 路由与菜单。页面路由由本文件生成，禁止手写。

schema_version: 1
id: feature.routes
summary: 路由与菜单
stability: stable
do_not:
  - 不要手写路由表
  - 不要在路由 meta 硬编码权限字符串，引用 platform.security.permissions.*

app: web/admin

layout:
  default: default
  auth: blank

routes:
  - id: feature.routes.account_list
    path: /accounts
    name: account-list
    page: feature.pages.account_list
    layout: default
    permission: platform.security.permissions.account_read
    menu:
      group: 系统管理
      label: 账号
      icon: users
      order: 10
    meta:
      title: 账号列表

  - id: feature.routes.account_create
    path: /accounts/new
    name: account-create
    page: feature.pages.account_create
    layout: default
    permission: platform.security.permissions.account_write
    menu: null
    meta:
      title: 新建账号

  - id: feature.routes.account_detail
    path: /accounts/:id
    name: account-detail
    page: feature.pages.account_detail
    layout: default
    permission: platform.security.permissions.account_read
    menu: null
    meta:
      title: 账号详情

  - id: feature.routes.login
    path: /login
    name: login
    page: feature.pages.login
    layout: auth
    permission: null
    menu: null
    meta:
      title: 登录
      public: true

redirects:
  - { from: /, to: /accounts }

not_found:
  page: feature.pages.not_found
  layout: default
