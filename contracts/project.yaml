# 项目元信息。derive 脚本的唯一输入，所有生成物的命名来源。

id: project
schema_version: 1
stability: stable

project:
  name: web-seed
  display_name: "Web Seed"
  description: "通用 Web + API 脚手架模板"
  version: 0.1.0
  license: MIT

go:
  module: github.com/yourorg/web-seed/apps/api
  version: "1.27"

web:
  package_scope: "@webseed"
  node_version: "26"
  package_manager: pnpm
  package_manager_version: "12.18.0"

defaults:
  timezone: UTC
  locale: zh-CN
  currency: CNY
  id_strategy: integer

# 应用拓扑：每个应用包含哪些能力。生成器按此合并 OpenAPI。
apps:
  admin:
    kind: api
    description: "管理端 API"
    includes:
      - cap.http.shared
      - cap.http.account
      - cap.http.auth
    generated:
      spec: generated/openapi/admin.yaml
      server: apps/api/internal/generated/openapi
      client: apps/web/packages/api-client/src/generated

  web-admin:
    kind: web
    description: "管理端前端"
    routes: feature.routes
    packages: [api-client, ui-kit, design-tokens]

# derive 时由 scripts/derive.sh 读取并替换
derive:
  replace:
    - { from: "github.com/yourorg/web-seed", to: "<your-module>" }
    - { from: "@webseed", to: "<your-scope>" }
    - { from: "web-seed", to: "<your-project>" }
  delete_after_derive:
    - docs/playbooks/template-derive.md
    - .opencode/skills/template-derive
    - .opencode/skills/template-doctor
    - .opencode/opencode.json
