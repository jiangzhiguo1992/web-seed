name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - name: build / vet / test
        working-directory: apps/api
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm -r build
        working-directory: apps/web
      - run: pnpm -r --if-present typecheck
        working-directory: apps/web

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-docs.sh

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/cmd/go.mod
      - name: build / vet / test
        working-directory: scripts/cmd
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # enum-append-only 对比 HEAD^1，需要 PR merge commit 的父提交
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/cmd/go.mod
          cache-dependency-path: scripts/cmd/go.sum
      - run: make check-rule-ids
      - run: make audit-types
      - run: make contract-check
      - name: check index registration
        run: time make check-index
      - run: make gen-check-core

  contract-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/cmd/go.mod
          cache-dependency-path: scripts/cmd/go.sum
      - name: v1→v2 compatibility
        run: make contract-compat

  rule-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/cmd/go.mod
      - run: make gen-rule-tests-check
      - run: make test-rules
