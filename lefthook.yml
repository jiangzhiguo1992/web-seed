pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "apps/api/**/*.go"
      run: cd apps/api && test -z "$(gofmt -l .)" || (echo "gofmt required:" && gofmt -l . && exit 1)
    govet:
      glob: "apps/api/**/*.go"
      run: cd apps/api && go vet ./...
    contracts-tools:
      glob: "**/*"
      run: |
        changed=$(git diff --cached --name-only)
        if echo "$changed" | grep -qE '^(contracts/.*\.yaml|scripts/cmd/.*\.go)$'; then
          make contract-check && make gen-check
        fi
    contract-compat:
      glob: "**/*"
      run: |
        changed=$(git diff --cached --name-only)
        if echo "$changed" | grep -qE '^(contracts/data/enums/.*\.yaml|scripts/cmd/contract_compat/.*\.go|scripts/contract/compat\.sh)$'; then
          make contract-compat-staged
        fi
    contract-docs:
      glob: "contracts/**/*.md"
      run: ./scripts/check-docs.sh
    rule-ids:
      glob: "scripts/cmd/**/*.go"
      run: make check-rule-ids && make lint-tools && make test-tools
    docs:
      glob: "docs/**/*.md"
      run: ./scripts/check-docs.sh

pre-push:
  commands:
    build:
      run: make build
